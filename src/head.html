<title>Web3 101 学习手册</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar + chapter rail (drawer on phones) + one reading column. Each chapter is a "block": height, hash, prev-hash. Labs mount inline. */
:root {
  --ground: #f2f5f4;
  --paper: #fcfdfc;
  --ink: #13201c;
  --ink-2: #56645f;
  --rule: #dbe2df;
  --tint: #e8eeeb;
  --accent: #0a7a69;
  --accent-soft: #d3eee8;
  --info: #3756c8; --info-soft: #e2e8fa;
  --ok: #1d8a4b; --ok-soft: #dcf1e3;
  --warn: #b0650a; --warn-soft: #f9ead3;
  --risk: #c3304b; --risk-soft: #f9e0e5;
  --f-display: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rail: 280px;
  --bar: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1412; --paper: #141c19; --ink: #e2ebe7; --ink-2: #98a8a1; --rule: #25312d; --tint: #1b2522;
    --accent: #3ccfb2; --accent-soft: #123a32;
    --info: #8ea6ff; --info-soft: #1a2442; --ok: #4fc883; --ok-soft: #12321f;
    --warn: #f0a649; --warn-soft: #3a2a12; --risk: #ff6d84; --risk-soft: #3d1a22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1412; --paper: #141c19; --ink: #e2ebe7; --ink-2: #98a8a1; --rule: #25312d; --tint: #1b2522;
  --accent: #3ccfb2; --accent-soft: #123a32;
  --info: #8ea6ff; --info-soft: #1a2442; --ok: #4fc883; --ok-soft: #12321f;
  --warn: #f0a649; --warn-soft: #3a2a12; --risk: #ff6d84; --risk-soft: #3d1a22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.8; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--paper); }
a { color: var(--info); text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button, input, select { font: inherit; color: inherit; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--bar); display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--paper); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--ink); text-decoration: none; }
.brand .cube { width: 22px; height: 22px; flex: none; }
.brand b { font-family: var(--f-display); font-weight: 900; font-size: 17px; white-space: nowrap; letter-spacing: .01em; }
.brand .tick { font-family: var(--f-mono); font-size: 11px; color: var(--accent); letter-spacing: .06em; white-space: nowrap; }
.bar .spacer { flex: 1; }
.btn { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; height: 34px; padding-inline: 12px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
#menuBtn { display: none; }

/* shell */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }
.rail { position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar) - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--paper); border-right: 1px solid var(--rule); padding: 14px 12px 40px max(12px, env(safe-area-inset-left, 0px)); }
.search { width: 100%; font-size: 14px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--ground); }
.group { margin-top: 18px; }
.group h4 { margin: 0 0 4px; padding-inline: 8px; font-size: 11px; font-weight: 600; letter-spacing: .12em; color: var(--ink-2); }
.navlink { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px; align-items: baseline; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.5; }
.navlink .code { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.navlink:hover { background: var(--tint); }
.navlink[aria-current="page"] { background: var(--accent-soft); }
.navlink[aria-current="page"] .code { color: var(--accent); font-weight: 600; }
.results { margin-top: 10px; }
.result { display: block; padding: 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px; line-height: 1.5; }
.result:hover { background: var(--tint); }
.result b { display: block; font-size: 14px; }
.result span { color: var(--ink-2); }
.result mark { background: var(--accent-soft); color: var(--ink); }

/* reading column */
main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.doc { max-width: 820px; margin: 0 auto; padding-block: 28px 80px; }
.doc h1, .doc h2, .doc h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.35; }
.doc h1 { font-size: 32px; font-weight: 900; margin: 6px 0 16px; letter-spacing: .005em; }
.doc h2 { font-size: 23px; font-weight: 900; margin: 52px 0 12px; padding-top: 18px; border-top: 1px solid var(--rule); }
.doc h3 { font-size: 18px; font-weight: 700; margin: 30px 0 8px; }
.doc p, .doc li { max-width: 68ch; }
.doc p, .doc li, .call, .quiz, .recap, .meta, .oneliner, .notes { overflow-wrap: anywhere; }
.doc ul, .doc ol { padding-left: 1.4em; }
.doc li { margin: 3px 0; }
.doc strong { font-weight: 700; }
.doc code { font-family: var(--f-mono); font-size: .85em; background: var(--tint); padding: 1px 5px; border-radius: 4px; }
.code-wrap { overflow-x: auto; background: var(--tint); border-radius: 8px; margin: 14px 0; }
.code-bar { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 0 0; }
.code-wrap pre { margin: 0; padding: 12px 14px; font-family: var(--f-mono); font-size: 13px; line-height: 1.65; }
.code-wrap .lang { display: block; padding: 2px 14px 0; font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); letter-spacing: .06em; }
.table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.doc table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.6; }
.doc th, .doc td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
.doc tr:last-child td { border-bottom: 0; }
.doc th { background: var(--tint); font-weight: 600; white-space: nowrap; }
.doc td { font-variant-numeric: tabular-nums; }

/* block header: each chapter is a block in a chain */
.blockhead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.blockhead .h { grid-row: span 2; font-size: 26px; font-weight: 600; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.blockhead .row { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blockhead .row b { color: var(--ink); font-weight: 600; }
.meta { display: grid; gap: 6px; margin: 18px 0 8px; padding: 14px 16px; border-radius: 10px; background: var(--tint); font-size: 15px; }
.meta .k { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--ink-2); }
.meta ol { margin: 2px 0 6px; }
.oneliner { margin: 18px 0; padding: 16px 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent-soft); font-size: 18px; font-weight: 700; line-height: 1.6; font-family: var(--f-display); }

/* callouts: fixed markers per ASD-STE100 rule R9 */
.call { margin: 18px 0; padding: 12px 16px; border-radius: 10px; background: var(--tint); }
.call > .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 1px 8px; border-radius: 999px; margin-bottom: 4px; background: var(--paper); }
.call p { margin: 6px 0; }
.call ul, .call ol { margin: 6px 0; }
.call.analogy { background: var(--accent-soft); } .call.analogy > .tag { color: var(--accent); }
.call.info { background: var(--info-soft); } .call.info > .tag { color: var(--info); }
.call.warn { background: var(--warn-soft); } .call.warn > .tag { color: var(--warn); }
.call.risk { background: var(--risk-soft); } .call.risk > .tag { color: var(--risk); }
.call.deep { background: transparent; border: 1px dashed var(--rule); } .call.deep > .tag { color: var(--ink-2); }

/* diagrams */
figure.mmd { margin: 20px 0; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); overflow: hidden; }
figure.mmd .mmd-title { padding: 10px 14px 0; font-size: 13px; font-weight: 700; color: var(--ink-2); display: flex; justify-content: space-between; gap: 10px; }
figure.mmd .mmd-title .zoom { font-weight: 500; font-size: 12px; color: var(--accent); white-space: nowrap; }
figure.mmd .mmd-body { padding: 14px; overflow-x: auto; min-height: 60px; }
figure.mmd .mmd-body svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
figure.mmd.ready .mmd-body { cursor: zoom-in; }
figure.mmd.wide .mmd-body { cursor: grab; }
figure.mmd.wide .mmd-title .zoom::before { content: "可左右滑动 · "; color: var(--ink-2); }
figure.mmd .mmd-fallback { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); white-space: pre-wrap; }
figure.mmd figcaption { border-top: 1px solid var(--rule); padding: 10px 14px 12px; background: var(--ground); }
figure.mmd figcaption .cap { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--ink-2); margin-bottom: 4px; }
.notes { list-style: none; padding: 0 !important; margin: 0; display: grid; gap: 4px; }
.notes li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; font-size: 14px; line-height: 1.6; max-width: none !important; }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 0; border-radius: 4px; text-align: center; height: fit-content; margin-top: 2px; letter-spacing: .04em; }
.chip.flow { background: var(--info-soft); color: var(--info); }
.chip.fail { background: var(--warn-soft); color: var(--warn); }
.chip.limit { background: var(--tint); color: var(--ink-2); border: 1px solid var(--rule); }
.chip.risk { background: var(--risk-soft); color: var(--risk); }
.chip.key { background: var(--accent-soft); color: var(--accent); }

/* diagram viewer */
.viewer { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; background: var(--ground); }
.viewer-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--paper); border-bottom: 1px solid var(--rule); }
.viewer-bar .vt { flex: 1 1 200px; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer-bar .zv { font-family: var(--f-mono); font-size: 13px; min-width: 52px; text-align: center; color: var(--ink-2); }
.viewer-port { position: relative; flex: 1; overflow: hidden; cursor: grab; touch-action: none; background: radial-gradient(circle, var(--rule) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--ground); }
.viewer-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.viewer-stage svg { display: block; max-width: none !important; background: var(--paper); border-radius: 8px; padding: 12px; }

/* labs */
.lab { margin: 24px 0; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--paper); overflow: hidden; }
.lab-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 16px; background: var(--accent-soft); }
.lab-head .lt { font-family: var(--f-display); font-weight: 900; font-size: 17px; }
.lab-head .lk { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; color: var(--accent); font-weight: 600; }
.lab-head .ld { flex-basis: 100%; font-size: 14px; color: var(--ink-2); line-height: 1.6; }
.lab-head .open { margin-left: auto; font-size: 13px; }
.lab-body { padding: 16px; display: grid; gap: 14px; }
.lab-body .try { font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--tint); line-height: 1.7; }
.lab-body .try b { color: var(--accent); }
.ctrls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }
.rng { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; align-items: center; font-size: 14px; }
.rng span { color: var(--ink-2); }
.rng output { font-family: var(--f-mono); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rng input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--paper); padding: 5px 12px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--paper); font-weight: 600; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.stat { padding: 8px 12px; border-radius: 8px; background: var(--ground); border: 1px solid var(--rule); min-width: 0; }
.stat .k { font-size: 12px; color: var(--ink-2); line-height: 1.4; }
.stat .v { font-family: var(--f-mono); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.4; }
.stat.ok { border-color: var(--ok); background: var(--ok-soft); } .stat.ok .v { color: var(--ok); }
.stat.warn { border-color: var(--warn); background: var(--warn-soft); } .stat.warn .v { color: var(--warn); }
.stat.risk { border-color: var(--risk); background: var(--risk-soft); } .stat.risk .v { color: var(--risk); }
.verdict { padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: 15px; line-height: 1.6; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.warn { background: var(--warn-soft); color: var(--warn); }
.verdict.risk { background: var(--risk-soft); color: var(--risk); }
.verdict.info { background: var(--info-soft); color: var(--info); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-2); font-family: var(--f-mono); font-size: 11px; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .axis { stroke: var(--ink-2); stroke-width: 1; }
.chart .s1 { stroke: var(--accent); stroke-width: 2.2; fill: none; }
.chart .s2 { stroke: var(--info); stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
.chart .s3 { stroke: var(--risk); stroke-width: 1.6; fill: none; stroke-dasharray: 3 3; }
.chart .area { fill: var(--accent-soft); stroke: none; }
.chart .dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }
.chart .dot2 { fill: var(--risk); stroke: var(--paper); stroke-width: 2; }
.chart .bar { fill: var(--accent); }
.chart .bar.hl { fill: var(--risk); }
.chart .lbl { fill: var(--ink); font-weight: 600; }
.log { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.7; background: var(--ground); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; max-height: 220px; overflow: auto; }
.log div { white-space: pre-wrap; overflow-wrap: anywhere; }
.log .ok { color: var(--ok); } .log .risk { color: var(--risk); } .log .warn { color: var(--warn); } .log .info { color: var(--info); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.lab input[type="text"], .lab input[type="number"], .lab select, .lab textarea { border: 1px solid var(--rule); border-radius: 6px; background: var(--ground); padding: 5px 8px; font-size: 14px; min-width: 0; }
.lab textarea { width: 100%; font-family: var(--f-mono); font-size: 13px; resize: vertical; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }

/* module tree in the rail */
details.mod { border-radius: 8px; }
details.mod > summary { list-style: none; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1.5; font-weight: 600; }
details.mod > summary::-webkit-details-marker { display: none; }
details.mod > summary:hover { background: var(--tint); }
details.mod > summary .code { font-family: var(--f-mono); font-size: 11px; color: var(--accent); }
details.mod > summary .prog { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-2); font-weight: 500; }
details.mod > summary .prog.full { color: var(--ok); }
details.mod[open] > summary { background: var(--tint); }
details.mod .navlink { padding-left: 18px; font-size: 13.5px; }
.navlink.done > span:last-child::after { content: " ✓"; color: var(--ok); font-weight: 700; }

/* beginner blocks */
.call.start { background: var(--info-soft); border-left: 4px solid var(--info); } .call.start > .tag { color: var(--info); }
.call.recall { background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--accent); } .call.recall > .tag { color: var(--accent); background: var(--accent-soft); }
.call.try { background: var(--ok-soft); border-left: 4px solid var(--ok); } .call.try > .tag { color: var(--ok); }
.recap { margin: 28px 0 8px; padding: 14px 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--paper); }
.recap .k, .subs .k { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--accent); }
.recap ul { margin: 6px 0 0; }
.subs { margin: 18px 0; }
.quiz { margin: 12px 0; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); }
.quiz .qq { font-weight: 600; margin-bottom: 8px; line-height: 1.6; }
.quiz .qq .mono { color: var(--accent); margin-right: 4px; }
.quiz .qo { display: grid; gap: 6px; }
.quiz .qo button { text-align: left; border: 1px solid var(--rule); background: var(--ground); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 14.5px; line-height: 1.55; }
.quiz .qo button:hover { border-color: var(--accent); }
.quiz .qo button.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.quiz .qo button.wrong { border-color: var(--risk); background: var(--risk-soft); color: var(--risk); }
.quiz .qwhy { margin-top: 8px; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.7; background: var(--tint); }
.quiz .qwhy.ok .qres { color: var(--ok); } .quiz .qwhy.bad .qres { color: var(--risk); }
.donebar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 48px; padding: 14px; border-radius: 10px; background: var(--tint); }

.slides-cta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 12px 0 0; padding: 10px 14px; border: 1px solid var(--rule); border-left: 3px solid var(--accent); border-radius: 10px; background: var(--paper); color: var(--ink); text-decoration: none; }
.slides-cta:hover { border-color: var(--accent); }
.slides-cta b { color: var(--accent); }
.slides-cta span { color: var(--ink-2); font-size: 13px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--paper); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager .k { font-size: 12px; color: var(--ink-2); font-family: var(--f-mono); }
.pager .t { font-weight: 700; font-size: 14px; }
.pager .next { text-align: right; grid-column: 2; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 16px 0; }
.card { display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); text-decoration: none; color: var(--ink); min-width: 0; }
