    <g id="in-sg3" class="h"><rect x="825" y="450" width="215" height="140" rx="16" fill="#0f1117" stroke="#58C4DD" stroke-width="4" stroke-dasharray="14 10"/><text x="932" y="538" font-size="52" font-weight="700" fill="#58C4DD" fill-opacity="0.55" text-anchor="middle">4</text></g>

      <circle cx="1185" cy="640" r="11" fill="#FF9F43"/><circle cx="1215" cy="640" r="11" fill="#FF9F43"/><circle cx="1245" cy="640" r="11" fill="#FF9F43"/><circle cx="1275" cy="640" r="11" fill="#FF9F43"/><circle cx="1305" cy="640" r="11" fill="#FF9F43"/><circle cx="1335" cy="640" r="11" fill="#FF9F43"/>

      <circle cx="1605" cy="640" r="11" fill="#FC6255"/><circle cx="1635" cy="640" r="11" fill="#FC6255"/><circle cx="1665" cy="640" r="11" fill="#FC6255"/>

</g>
<g id="in-term" class="h">
  <rect x="70" y="56" width="560" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
  <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">钱包 <tspan font-size="28" font-weight="400" fill="#8a8f99">Wallet</tspan></text>

    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 钱包里装着币吗？
      IN("#in-wal", at(0, 0.0), 0.6, { y: 20 }, { y: 0 });
      IN("#in-flap", at(0, 0.0), 0.6, { y: 20 }, { y: 0 });
      IN("#in-qc > g", at(0, 0.03), 0.5, { scale: 0.5, svgOrigin: "600 560" }, { scale: 1, svgOrigin: "600 560" });
      IN("#in-qm", at(0, 0.06), 0.4, { y: 10 }, { y: 0 });
      // “不”：钱包打开，只有一把钥匙
      tl.to("#in-flap", { scaleY: -1, svgOrigin: "960 440", duration: 0.7, ease: "power2.inOut" }, at(0, 0.12));
      IN("#in-key", at(0, 0.2), 0.5, { scale: 0.6, svgOrigin: "960 600" }, { scale: 1, svgOrigin: "960 600" });
      IN("#in-term", at(0, 0.28), 0.6, { x: -20 }, { x: 0 });
      // 币一直记在链上
      IN("#in-chain", at(0, 0.45), 0.6, { x: 30 }, { x: 0 });
      OUT("#in-qm", at(0, 0.47), 0.3);
      tl.to("#in-qc", { keyframes: [{ x: 300, y: -260, duration: 0.6, ease: "power1.out" }, { x: 950, y: -30, duration: 0.7, ease: "power1.in" }] }, at(0, 0.5));
      IN("#in-c1", at(0, 0.58), 0.4, { scale: 0.4, svgOrigin: "1300 530" }, { scale: 1, svgOrigin: "1300 530" });
      IN("#in-c2", at(0, 0.62), 0.4, { scale: 0.4, svgOrigin: "1675 530" }, { scale: 1, svgOrigin: "1675 530" });
      IN("#in-c3", at(0, 0.66), 0.4, { scale: 0.4, svgOrigin: "1800 530" }, { scale: 1, svgOrigin: "1800 530" });
      // 谁握着私钥，谁就能动它
      ARROW("#in-sig", at(0, 0.74), 0.8);
      IN("#in-sigd", at(0, 0.74) + 0.8, 0.2);
      IN("#in-sigl", at(0, 0.78), 0.5);
      tl.to("#in-key", { scale: 1.15, svgOrigin: "960 600", duration: 0.3, yoyo: true, repeat: 1 }, at(0, 0.8));
      tl.to("#in-qc", { y: -50, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.out" }, at(0, 0.9));
      // L1 交易所账户不是钱包
      IN("#in-ex", at(1, 0.04), 0.5, { y: 20 }, { y: 0 });
      IN("#in-ex1", at(1, 0.3), 0.4); IN("#in-ex2", at(1, 0.7), 0.4, { x: -12 }, { x: 0 });
      // L2 三个要求；钱包缩小下移
      OUT("#in-term, #in-ex", at(2, 0.0), 0.4);
      OUT("#in-flap, #in-chain, #in-qc, #in-c1, #in-c2, #in-c3, #in-sig, #in-sigd, #in-sigl", at(2, 0.0), 0.4);
      tl.to("#in-wS", { scale: 0.75, svgOrigin: "960 550", duration: 0.9, ease: "power2.inOut" }, at(2, 0.06));
      tl.to("#in-wM", { y: 230, duration: 0.9, ease: "power2.inOut" }, at(2, 0.06));
      DRAW("#in-bl0", at(2, 0.55), 0.5); IN("#in-b0", at(2, 0.6), 0.5, { scale: 0.7, svgOrigin: "660 292" }, { scale: 1, svgOrigin: "660 292" });
      DRAW("#in-bl1", at(2, 0.7), 0.5); IN("#in-b1", at(2, 0.75), 0.5, { scale: 0.7, svgOrigin: "960 292" }, { scale: 1, svgOrigin: "960 292" });
      DRAW("#in-bl2", at(2, 0.84), 0.5); IN("#in-b2", at(2, 0.89), 0.5, { scale: 0.7, svgOrigin: "1260 292" }, { scale: 1, svgOrigin: "1260 292" });
      // L3 比方：家门钥匙 | 金库
      OUT("#in-badges, #in-wM", at(3, 0.0), 0.4);
      IN("#in-home", at(3, 0.04), 0.7, { x: -30 }, { x: 0 });
      tl.fromTo("#in-hkey", { rotation: -25, svgOrigin: "440 825" }, { rotation: 0, svgOrigin: "440 825", duration: 0.8, ease: "back.out(2)", immediateRender: false }, at(3, 0.1));
      IN("#in-vault", at(3, 0.2), 0.8, { x: 30 }, { x: 0 });
      IN("#in-kl", at(3, 0.3), 0.4);
      IN("#in-tk0", at(3, 0.36), 0.3); IN("#in-tk1", at(3, 0.36), 0.3);
      tl.to("#in-kh0 circle, #in-kh1 circle", { stroke: "#83C167", duration: 0.3 }, at(3, 0.36));
      tl.fromTo("#in-tk0", { rotation: -90, svgOrigin: "980 450" }, { rotation: 0, svgOrigin: "980 450", duration: 0.6, ease: "power2.out", immediateRender: false }, at(3, 0.37));
      tl.fromTo("#in-tk1", { rotation: -90, svgOrigin: "980 590" }, { rotation: 0, svgOrigin: "980 590", duration: 0.6, ease: "power2.out", immediateRender: false }, at(3, 0.37));
      IN("#in-up", at(3, 0.5), 0.6, { y: -20 }, { y: 0 });
      IN("#in-down", at(3, 0.64), 0.7, { y: 30 }, { y: 0 });
      IN("#in-form", at(3, 0.8), 0.6, { x: 30 }, { x: 0 });
      IN("#in-stamp", at(3, 0.88), 0.35, { scale: 1.8, svgOrigin: "1680 695" }, { scale: 1, svgOrigin: "1680 695" });
      // L4 比方的局限
      OUT("#in-home, #in-form, #in-stamp", at(4, 0.0), 0.4);
      tl.to("#in-vM", { x: -760, duration: 0.9, ease: "power2.inOut" }, at(4, 0.03));
      IN("#in-bank", at(4, 0.12), 0.6, { y: -20 }, { y: 0 });
      IN("#in-btn0", at(4, 0.2), 0.4, { x: -20 }, { x: 0 });
      IN("#in-btn1", at(4, 0.26), 0.4, { x: -20 }, { x: 0 });
      IN("#in-chain2", at(4, 0.45), 0.6, { x: 30 }, { x: 0 });
      IN("#in-tx", at(4, 0.5), 0.5, { y: -20 }, { y: 0 });
      IN("#in-txl", at(4, 0.52), 0.4);
      IN("#in-conf", at(4, 0.58), 0.35, { scale: 1.7, svgOrigin: "1625 488" }, { scale: 1, svgOrigin: "1625 488" });
      tl.to("#in-btn1 rect", { fillOpacity: 0.5, duration: 0.2, yoyo: true, repeat: 1 }, at(4, 0.66));
      ARROW("#in-undo", at(4, 0.68), 0.6);
      IN("#in-x", at(4, 0.76), 0.25, { scale: 0.4, svgOrigin: "1352 432" }, { scale: 1, svgOrigin: "1352 432" });
      tl.to("#in-undo", { x: -40, opacity: 0, duration: 0.5, ease: "power2.out" }, at(4, 0.8));
      IN("#in-nox", at(4, 0.84), 0.4);
      // L5 本集路线：地图四段 → 六道题 → 三个误区
      OUT("#in-vM, #in-bank, #in-btn0, #in-btn1, #in-chain2, #in-tx, #in-txl, #in-conf, #in-x, #in-nox", at(5, 0.0), 0.4);
      DRAW("#in-rail", at(5, 0.06), 1.0);
      IN("#in-mapl", at(5, 0.1), 0.5);
      ["#in-sg0", "#in-sg1", "#in-sg2", "#in-sg3"].forEach((s, i) => IN(s, at(5, 0.14 + i * 0.06), 0.4, { y: 20 }, { y: 0 }));
      IN("#in-six", at(5, 0.5), 0.6, { x: 30 }, { x: 0 });
      IN("#in-three", at(5, 0.8), 0.6, { x: 30 }, { x: 0 });

      tl.to("#in-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#in-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["intro"] = tl;
    })();
  </script>
