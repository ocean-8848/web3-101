    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // ===== 测验版式（照 EP009 quiz1）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#qu-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#qu-q1", at(0, 0.03), 0.01);
      tl.fromTo("#qu-qcr1", { attr: { width: 0 } }, { attr: { width: 1420 }, duration: 2.4, ease: "none" }, at(0, 0.05));
      IN("#qu-q2", at(0, 0.05) + 2.4, 0.01);
      tl.fromTo("#qu-qcr2", { attr: { width: 0 } }, { attr: { width: 1420 }, duration: 2.4, ease: "none" }, at(0, 0.05) + 2.4);
      const SHOW = (k, t) => {
        IN(`#qu-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#qu-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#qu-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.0);
      };
      const RIGHT = (k, t) => {
        tl.to(`#qu-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#qu-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#qu-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#qu-o${k}-t`, { attr: { y: Y0[k] + 52 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#qu-o${k}-n`, t + 0.3, 0.5);
      };
      const PAUSE = () => {
        IN("#qu-pause", at(2, 0.0), 0.3);
        tl.fromTo("#qu-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#qu-pause", at(3, 0.0), 0.3);
      };

      // L0 题干
      IN("#qu-ring24", at(0, 0.42), 0.6, { scale: 0.85, svgOrigin: "1310 540" }, { scale: 1, svgOrigin: "1310 540" });
      DRAW("#qu-sec", at(0, 0.5), 0.8);
      IN("#qu-secl", at(0, 0.56), 0.4);
      IN("#qu-jar", at(0, 0.72), 0.6, { y: 30 }, { y: 0 });
      IN("#qu-jq", at(0, 0.85), 0.4, { scale: 0.5, svgOrigin: "1660 680" }, { scale: 1, svgOrigin: "1660 680" });
      // L1 四个选项
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.25)); SHOW("C", at(1, 0.5)); SHOW("D", at(1, 0.75));
      // L2 暂停
      PAUSE();
      // L3 揭晓 B，逐行算
      RIGHT("B", at(3, 0.02));
      OUT("#qu-jq", at(3, 0.05), 0.3);
      IN("#qu-f1", at(3, 0.12), 0.5, { x: -20 }, { x: 0 });
      IN("#qu-f2", at(3, 0.3), 0.5, { x: -20 }, { x: 0 });
      tl.to("#qu-f3", { fill: "#FF9F43", scale: 1.12, svgOrigin: "1180 852", duration: 0.35, yoyo: true, repeat: 1, repeatDelay: 1.2 }, at(4, 0.6));
      tl.to("#qu-sec", { strokeWidth: 24, duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.48));
      IN("#qu-f3", at(3, 0.56), 0.5, { x: -20 }, { x: 0 });
      IN("#qu-lvl", at(3, 0.58), 0.01);
      tl.to("#qu-lvl", { attr: { y: 666, height: 208 }, duration: 0.8, ease: "power2.out" }, at(3, 0.6));
      IN("#qu-f4", at(3, 0.8), 0.5, { x: -20 }, { x: 0 });
      tl.to("#qu-lvl", { attr: { y: 562, height: 312 }, duration: 0.8, ease: "power2.out" }, at(3, 0.84));
      IN("#qu-tick", at(3, 0.88), 0.4);
      // L4 干扰项
      WRONG("A", at(4, 0.02));
      WRONG("C", at(4, 0.2));
      tl.to("#qu-r24", { stroke: "#F0B90B", duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.24));
      WRONG("D", at(4, 0.4));
      tl.to("#qu-sec", { strokeWidth: 24, duration: 0.35, yoyo: true, repeat: 1 }, at(4, 0.72));
      tl.to("#qu-secl", { scale: 1.2, svgOrigin: "1487 428", duration: 0.35, yoyo: true, repeat: 1 }, at(4, 0.72));
      // L5 损失上限 = 余额
      OUT("#qu-f1, #qu-f2, #qu-f3, #qu-f4", at(5, 0.0), 0.4);
      ARROW("#qu-steal", at(5, 0.2), 0.6);
      IN("#qu-sc", at(5, 0.2), 0.2);
      tl.to("#qu-sc", { x: -330, y: 70, duration: 0.8, ease: "power2.inOut" }, at(5, 0.22));
      IN("#qu-stl", at(5, 0.36), 0.4);
      tl.to("#qu-jar path", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.4));
      IN("#qu-loss", at(5, 0.58), 0.5, { y: 12 }, { y: 0 });

      tl.to("#qu-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz1"] = tl;
    })();
