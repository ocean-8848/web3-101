    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // 金币弧线：二次贝塞尔 (480,400) → 控制点 (960,100) → (1440,400)
      const P0 = [480, 400], P1 = [960, 100], P2 = [1440, 400];
      const bez = u => [(1 - u) * (1 - u) * P0[0] + 2 * (1 - u) * u * P1[0] + u * u * P2[0], (1 - u) * (1 - u) * P0[1] + 2 * (1 - u) * u * P1[1] + u * u * P2[1]];
      const dots = document.querySelector("#ho-dots"), NS = "http://www.w3.org/2000/svg";
      for (let k = 1; k <= 13; k++) {
        const [x, y] = bez(k / 14), c = document.createElementNS(NS, "circle");
        c.setAttribute("id", "ho-d" + k); c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 6); c.setAttribute("opacity", 0);
        dots.appendChild(c);
      }

      // L0 手机
      IN("#ho-ph0", at(0, 0.0), 0.6, { y: 30 }, { y: 0 });
      IN("#ho-pl0", at(0, 0.1), 0.5);
      IN("#ho-pt", at(0, 0.35), 0.5, { scale: 0.8, svgOrigin: "360 535" }, { scale: 1, svgOrigin: "360 535" });
      IN("#ho-ph1", at(0, 0.6), 0.6, { y: 30 }, { y: 0 });
      IN("#ho-pl1", at(0, 0.7), 0.5);
      // L1 金币飞过去
      const t1 = at(1, 0.05), fly = 1.5;
      IN("#ho-coin", t1, 0.2);
      const pr = { u: 0 }, cc = document.querySelector("#ho-coinc");
      tl.fromTo(pr, { u: 0 }, { u: 1, duration: fly, ease: "power1.inOut", immediateRender: false, onUpdate: () => { const [x, y] = bez(pr.u); cc.setAttribute("cx", x); cc.setAttribute("cy", y); } }, t1);
      for (let k = 1; k <= 13; k++) tl.fromTo("#ho-d" + k, { opacity: 0 }, { opacity: 0.9, duration: 0.15 }, t1 + fly * (k / 14) * 0.95);
      tl.to("#ho-ph1 rect", { stroke: "#F0B90B", duration: 0.25, yoyo: true, repeat: 1 }, t1 + fly);
      // L2 什么都没移动：轨迹打叉，账本表升起
      tl.to("#ho-dots circle", { opacity: 0.25, duration: 0.3 }, at(2, 0.0));
      OUT("#ho-coin", at(2, 0.0), 0.4);
      IN("#ho-x", at(2, 0.06), 0.3, { scale: 0.5, svgOrigin: "960 250" }, { scale: 1, svgOrigin: "960 250", ease: "back.out(2)" });
      OUT("#ho-dots circle, #ho-x", at(2, 0.24), 0.4);
      IN("#ho-tab", at(2, 0.3), 0.7, { y: 60 }, { y: 0 });
      IN("#ho-ex", at(2, 0.4), 0.5);
      IN("#ho-v0, #ho-v1", at(2, 0.35), 0.5);
      tl.to("#ho-v0", { fill: "#FC6255", duration: 0.2 }, at(2, 0.5));
      COUNT("#ho-v0", 500, 400, at(2, 0.5), 1.0);
      tl.to("#ho-v0", { fill: "#F0B90B", duration: 0.4 }, at(2, 0.5) + 1.1);
      tl.to("#ho-v1", { fill: "#83C167", duration: 0.2 }, at(2, 0.76));
      COUNT("#ho-v1", 200, 300, at(2, 0.76), 1.0);
      tl.to("#ho-v1", { fill: "#F0B90B", duration: 0.4 }, at(2, 0.76) + 1.1);
      // L3 由谁来记
      OUT("#ho-s1 > *", at(3, 0.0), 0.5);
      IN("#ho-q", at(3, 0.15), 0.7, { scale: 0.9, svgOrigin: "960 540" }, { scale: 1, svgOrigin: "960 540" });
      tl.to("#ho-q", { attr: { y: 236, "font-size": 52 }, duration: 0.8, ease: "power2.inOut" }, at(3, 0.72));
      // L4 左面板：一家机构记账
      IN("#ho-lp", at(4, 0.0), 0.6);
      IN("#ho-term", at(4, 0.03), 0.5);
      IN("#ho-bank", at(4, 0.08), 0.6, { y: 20 }, { y: 0 });
      IN("#ho-one", at(4, 0.2), 0.5);
      ["#ho-u0", "#ho-u1", "#ho-u2", "#ho-u3"].forEach((s, k) => IN(s, at(4, 0.28 + k * 0.06), 0.4, { scale: 0.6, svgOrigin: ["220 480", "800 480", "220 790", "800 790"][k] }, { scale: 1, svgOrigin: ["220 480", "800 480", "220 790", "800 790"][k] }));
      ["#ho-a0", "#ho-a1", "#ho-a2", "#ho-a3"].forEach((s, k) => IN(s, at(4, 0.42 + k * 0.04), 0.4));
      IN("#ho-must", at(4, 0.68), 0.6, { y: 12 }, { y: 0 });
      OUT("#ho-term", at(4, 0.97), 0.3);
      // L5 右面板：每个节点各一本
      IN("#ho-rp", at(5, 0.0), 0.6);
      IN("#ho-term2", at(5, 0.04), 0.5);
      ["#ho-n0", "#ho-n1", "#ho-n3", "#ho-n2"].forEach((s, k) => IN(s, at(5, 0.14 + k * 0.07), 0.45, { scale: 0.5, svgOrigin: ["1140 490", "1680 490", "1680 780", "1140 780"][k] }, { scale: 1, svgOrigin: ["1140 490", "1680 490", "1680 780", "1140 780"][k] }));
      IN("#ho-edges", at(5, 0.45), 0.6);
      IN("#ho-cap", at(5, 0.55), 0.6, { scale: 0.8, svgOrigin: "1410 633" }, { scale: 1, svgOrigin: "1410 633" });
      ["#ho-n0", "#ho-n1", "#ho-n3", "#ho-n2"].forEach((s, k) => tl.to(s + " circle", { stroke: "#83C167", duration: 0.2, yoyo: true, repeat: 1 }, at(5, 0.8 + k * 0.04)));
      OUT("#ho-term2", at(6, 0.0), 0.3);
      // L6 信任的转换
      OUT("#ho-must", at(6, 0.02), 0.3);
      IN("#ho-tl", at(6, 0.1), 0.5, { y: 14 }, { y: 0 });
      ARROW("#ho-sw", at(6, 0.24), 0.8);
      IN("#ho-swl", at(6, 0.28), 0.4);
      IN("#ho-tr", at(6, 0.36), 0.5, { y: 14 }, { y: 0 });
      tl.to("#ho-tr rect", { strokeWidth: 5, duration: 0.3, yoyo: true, repeat: 1 }, at(6, 0.66));
      tl.to("#ho-q", { opacity: 0.5, duration: 0.5 }, at(6, 0.75));

      tl.to("#ho-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ho-term, #ho-term2", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["hook"] = tl;
    })();
