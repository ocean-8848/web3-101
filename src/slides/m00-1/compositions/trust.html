      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      const NS = "http://www.w3.org/2000/svg";

      // ---------- L0 银行 + 16 个用户 ----------
      const gl = document.querySelector("#tr-lines"), gu = document.querySelector("#tr-users");

      IN("#tr-tl", at(0, 0.7), 0.5);

      tl.to("#tr-bank text", { fill: "#6b6f7a", duration: 0.5 }, at(1, 0.46));
      IN("#tr-k3", at(1, 0.5), 0.4);
      IN("#tr-only", at(1, 0.72), 0.5, { x: 16 }, { x: 0 });
      // ---------- L2 跨行跨境：层层对账 ----------
      OUT("#tr-p1 > *", at(2, 0.0), 0.5);

      ["#tr-e0", "#tr-e1", "#tr-e2", "#tr-e3"].forEach((s, k) => ARROW(s, at(2, 0.1 + k * 0.05), 0.4));
      ["#tr-L0", "#tr-L1", "#tr-L2"].forEach((s, k) => IN(s, at(2, 0.36 + k * 0.05), 0.4, { y: -12 }, { y: 0 }));
      ARROW("#tr-r0", at(2, 0.52), 0.5); IN("#tr-rl0", at(2, 0.54), 0.3);
      ARROW("#tr-r1", at(2, 0.62), 0.5); IN("#tr-rl1", at(2, 0.64), 0.3);
      tl.to("#tr-r0, #tr-r1", { strokeWidth: 6, duration: 0.25, yoyo: true, repeat: 3 }, at(2, 0.72));
      IN("#tr-coin", at(2, 0.3), 0.3);
      tl.to("#tr-coin", { attr: { cx: 1720 }, duration: (at(2, 0.92) - at(2, 0.32)), ease: "none" }, at(2, 0.32));
      IN("#tr-slow", at(2, 0.84), 0.5, { scale: 0.8, svgOrigin: "1700 945" }, { scale: 1, svgOrigin: "1700 945" });
      // ---------- L3 账本收拢，记账权转移 ----------
      OUT("#tr-p2 > *", at(3, 0.0), 0.5);
      tl.to("#tr-L0", { attr: { x: 960, y: 680 }, duration: 0.8, ease: "power2.inOut" }, at(3, 0.02));
      tl.to("#tr-L1", { attr: { x: 960, y: 680 }, duration: 0.8, ease: "power2.inOut" }, at(3, 0.02));
      tl.to("#tr-L2", { attr: { x: 960, y: 680 }, duration: 0.8, ease: "power2.inOut" }, at(3, 0.02));
      OUT("#tr-L0, #tr-L2", at(3, 0.02) + 0.8, 0.1);
      tl.to("#tr-L1", { scale: 1.6, svgOrigin: "960 680", duration: 0.5, ease: "back.out(2)" }, at(3, 0.02) + 0.8);

      // 一圈蓝色节点

        const a = -Math.PI / 2 + k * Math.PI / 3, x = 960 + 360 * Math.cos(a), y = 690 + 220 * Math.sin(a);

        mk("circle", { id: "tr-rn" + k, cx: x.toFixed(1), cy: y.toFixed(1), r: 34, fill: "#0f1117", stroke: "#58C4DD", "stroke-width": 3.5, opacity: 0 }, ring);

      IN("#tr-sb, #tr-sbl", at(3, 0.2), 0.5);
      // 笔：先在银行手里
      const PEN0 = [352, 640];
      IN("#tr-pen", at(3, 0.24), 0.4, { x: PEN0[0], y: PEN0[1] }, { x: PEN0[0], y: PEN0[1] });

      const hop = [4, 5, 0, 1];
      hop.forEach((k, j) => {
        const t = at(3, 0.7 + j * 0.07);

      IN("#tr-bx", at(4, 0.2), 0.4);
      IN("#tr-b0", at(4, 0.22), 0.8, { x: -12 }, { x: 0 });
