    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      // 余额条：每元 0.28 px
      const BAR = (k, a, b, t, d = 0.8) => {
        tl.fromTo("#ba-r" + k, { attr: { width: a * 0.28 } }, { attr: { width: b * 0.28 }, duration: d, ease: "power2.out", immediateRender: false }, t);
        COUNT("#ba-n" + k, a, b, t, d);
      };

      // L0 泳道
      ["#ba-l0", "#ba-l1", "#ba-l2", "#ba-l3", "#ba-l4"].forEach((s, k) => IN(s, at(0, 0.05 + k * 0.13), 0.5, { y: -16 }, { y: 0 }));

      ARROW("#ba-m1", at(1, 0.14), 0.7);
      IN("#ba-m1l", at(1, 0.2), 0.5);
      ARROW("#ba-m2", at(1, 0.6), 0.7);
      IN("#ba-m2l", at(1, 0.66), 0.4);
      IN("#ba-key", at(1, 0.5), 0.5, { scale: 0.8, svgOrigin: "741 562" }, { scale: 1, svgOrigin: "741 562" });
      // L2 两项检查
      IN("#ba-c0a, #ba-c0", at(2, 0.14), 0.5, { x: -16 }, { x: 0 });
      IN("#ba-c0k", at(2, 0.48), 0.3, { scale: 0.4, svgOrigin: "1127 613" }, { scale: 1, svgOrigin: "1127 613", ease: "back.out(2)" });
      IN("#ba-c1a, #ba-c1", at(2, 0.62), 0.5, { x: -16 }, { x: 0 });
      IN("#ba-bh, #ba-bA, #ba-bB, #ba-n0, #ba-n1, #ba-r0, #ba-r1", at(2, 0.68), 0.5);
      tl.to("#ba-r0", { fill: "#ffd65c", duration: 0.25, yoyo: true, repeat: 1 }, at(2, 0.8));
      IN("#ba-c1k", at(2, 0.88), 0.3, { scale: 0.4, svgOrigin: "1127 681" }, { scale: 1, svgOrigin: "1127 681", ease: "back.out(2)" });
      // L3 开启事务：借记 + 贷记
      ARROW("#ba-m3", at(3, 0.04), 0.7);
      IN("#ba-m3l", at(3, 0.1), 0.4);
      IN("#ba-br", at(3, 0.16), 0.5, { scale: 1.06, svgOrigin: "1437 837" }, { scale: 1, svgOrigin: "1437 837" });
      IN("#ba-row0", at(3, 0.3), 0.4, { x: 16 }, { x: 0 });
      BAR(0, 500, 400, at(3, 0.34));
      IN("#ba-row1", at(3, 0.66), 0.4, { x: 16 }, { x: 0 });
      BAR(1, 200, 300, at(3, 0.7));
      // L4 要么一起成功，要么一起失败
      IN("#ba-aon", at(4, 0.02), 0.5);
      const tf = at(4, 0.08);
      tl.to("#ba-br", { stroke: "#FC6255", duration: 0.25 }, tf);
      tl.to("#ba-rows", { opacity: 0.2, duration: 0.4 }, tf + 0.2);
      BAR(0, 400, 500, tf + 0.2, 0.6); BAR(1, 300, 200, tf + 0.2, 0.6);
      const tc = tf + 1.7;
      tl.to("#ba-br", { stroke: "#83C167", duration: 0.25 }, tc);
      tl.to("#ba-rows", { opacity: 1, duration: 0.4 }, tc + 0.1);
      BAR(0, 500, 400, tc + 0.2, 0.6); BAR(1, 200, 300, tc + 0.2, 0.6);
      ARROW("#ba-m4", at(4, 0.6), 0.7);
      IN("#ba-m4l", at(4, 0.64), 0.4);
      IN("#ba-m5", at(4, 0.76), 0.5, { x: -30 }, { x: 0 });
      IN("#ba-m5l", at(4, 0.8), 0.4);
      tl.to("#ba-bobh", { stroke: "#83C167", duration: 0.25, yoyo: true, repeat: 3 }, at(4, 0.86));
      // L5 复式记账：留下两行流水，天平平衡
      OUT("#ba-lanes, #ba-lanes2", at(5, 0.0), 0.5);
      tl.to("#ba-tx", { x: -1000, y: -320, duration: 0.9, ease: "power2.inOut" }, at(5, 0.04));
      IN("#ba-term", at(5, 0.06), 0.5);
      IN("#ba-eq", at(5, 0.22), 0.6, { y: 14 }, { y: 0 });
      IN("#ba-scale", at(5, 0.3), 0.5);
      IN("#ba-beam", at(5, 0.32), 0.5);
      IN("#ba-pl, #ba-pr", at(5, 0.36), 0.4);

      tl.to("#ba-beam", { rotation: 7, svgOrigin: "1350 560", duration: 0.4, ease: "power2.out" }, at(5, 0.7));

      tl.to("#ba-beam", { rotation: 0, svgOrigin: "1350 560", duration: 0.8, ease: "elastic.out(1, 0.5)" }, at(5, 0.88));

      tl.to("#ba-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
