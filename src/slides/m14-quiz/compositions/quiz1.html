  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      const SHOW = (k, t) => {
        IN(`#qu-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#qu-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#qu-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#qu-pause", at(2, 0.0), 0.3);
        tl.fromTo("#qu-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#qu-pause", at(3, 0.0), 0.3);
      };
      const RIGHT = (k, t) => {
        tl.to(`#qu-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#qu-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#qu-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#qu-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#qu-o${k}-n`, t + 0.3, 0.5);
      };
      IN("#qu-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#qu-tag", at(0, 0.04), 0.4);
      IN("#qu-q1", at(0, 0.03), 0.01);
      IN("#qu-q2", at(0, 0.4), 0.01);

      tl.fromTo("#qu-qcr1", { attr: { width: 0 } }, { attr: { width: 1300 }, duration: 1.8, ease: "none" }, at(0, 0.05));
      tl.fromTo("#qu-qcr2", { attr: { width: 0 } }, { attr: { width: 1300 }, duration: 2.0, ease: "none" }, at(0, 0.8));
      // L0 交易图随旁白出现
      IN("#qu-unit", at(0, 0.12), 0.4);
      IN("#qu-in1", at(0, 0.16), 0.4, { x: -20 }, { x: 0 });
      IN("#qu-in2", at(0, 0.24), 0.4, { x: -20 }, { x: 0 });
      ARROW("#qu-ai1", at(0, 0.3), 0.4); ARROW("#qu-ai2", at(0, 0.3), 0.4);
      IN("#qu-tx", at(0, 0.32), 0.4);
      ARROW("#qu-ao1", at(0, 0.38), 0.4); IN("#qu-payl", at(0, 0.38), 0.4);
      IN("#qu-out1", at(0, 0.4), 0.4, { x: 20 }, { x: 0 });
      ARROW("#qu-ao2", at(0, 0.52), 0.4);
      IN("#qu-out2", at(0, 0.54), 0.4, { x: 20 }, { x: 0 }); IN("#qu-chl", at(0, 0.56), 0.4);
      IN("#qu-vb", at(0, 0.68), 0.4, { y: 10 }, { y: 0 });
      tl.to("#qu-vb", { scale: 1.12, svgOrigin: "1510 740", duration: 0.3, yoyo: true, repeat: 1 }, at(0, 0.88));

      // L1 选项
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.38)); SHOW("C", at(1, 0.6)); SHOW("D", at(1, 0.8));
      // L2 暂停
      PAUSE();
      // L3 揭晓 B：差额 → sat → ÷ vB
      RIGHT("B", at(3, 0.04));
      tl.to("#qu-oA-dim, #qu-oC-dim, #qu-oD-dim", { opacity: 0.6, duration: 0.4 }, at(3, 0.06));
      tl.to("#qu-in1, #qu-in2", { scale: 1.08, svgOrigin: "1250 610", duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.22));
      tl.to("#qu-out1, #qu-out2", { scale: 1.08, svgOrigin: "1770 610", duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.3));
      IN("#qu-k1", at(3, 0.28), 0.5);
      IN("#qu-k2", at(3, 0.56), 0.5);
      IN("#qu-k3", at(3, 0.74), 0.5);
      // L4 干扰项
      WRONG("D", at(4, 0.02));
      WRONG("A", at(4, 0.52));
      WRONG("C", at(4, 0.6));
      // L5 选项与算式退场；找零消失，差额流向矿工
      OUT("#qu-oA, #qu-oB, #qu-oC, #qu-oD, #qu-k1, #qu-k2, #qu-k3", at(5, 0.0), 0.4);
      IN("#qu-sum1", at(5, 0.06), 0.5, { x: -20 }, { x: 0 });
      IN("#qu-sum2", at(5, 0.2), 0.5);
      OUT("#qu-out2, #qu-chl", at(5, 0.4), 0.4);
      tl.to("#qu-ao2", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.5));
      IN("#qu-miner", at(5, 0.52), 0.5, { scale: 0.6, svgOrigin: "1770 660" }, { scale: 1, svgOrigin: "1770 660" });
      IN("#qu-mfee", at(5, 0.6), 0.4);
      IN("#qu-sum3", at(5, 0.66), 0.5);
      tl.to("#qu-miner", { scale: 1.1, svgOrigin: "1770 660", duration: 0.3, yoyo: true, repeat: 1 }, at(5, 0.85));


      tl.to("#qu-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz1"] = tl;
    })();
  </script>
