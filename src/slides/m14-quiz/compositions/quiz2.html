      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const Y0 = { A: 380, B: 515, C: 650, D: 785 };

        IN(`#q2-o${k}`, t, 0.5, { x: -40 }, { x: 0 });

        tl.to(`#q2-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#q2-pause", at(2, 0.0), 0.3);
        tl.fromTo("#q2-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#q2-pause", at(3, 0.0), 0.3);
      };
      const RIGHT = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);

        tl.to(`#q2-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);

      const WRONG = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q2-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q2-o${k}-n`, t + 0.3, 0.5);
      };
      IN("#q2-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q2-tag", at(0, 0.04), 0.4);
      IN("#q2-q1", at(0, 0.03), 0.01);
      IN("#q2-q2", at(0, 0.4), 0.01);

      tl.fromTo("#q2-qcr1", { attr: { width: 0 } }, { attr: { width: 1400 }, duration: 3.0, ease: "none" }, at(0, 0.05));

      IN("#q2-disk", at(0, 0.12), 0.5, { scale: 0.85, svgOrigin: "1300 490" }, { scale: 1, svgOrigin: "1300 490" });
      tl.to("#q2-disk", { x: 5, duration: 0.06, yoyo: true, repeat: 5 }, at(0, 0.2));
      IN("#q2-db", at(0, 0.42), 0.5, { y: -16 }, { y: 0 });

      // L1 选项
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.22)); SHOW("C", at(1, 0.48)); SHOW("D", at(1, 0.7));
      // L2 暂停
      PAUSE();
      // L3 揭晓 D：静态备份 → 对方 → 最新状态关闭 → 资金上链 → 新节点

      tl.to("#q2-oA-dim, #q2-oB-dim, #q2-oC-dim", { opacity: 0.6, duration: 0.4 }, at(3, 0.06));
      OUT("#q2-p0", at(3, 0.0), 0.4);
      IN("#q2-scb", at(3, 0.1), 0.4);
      ARROW("#q2-f1", at(3, 0.18), 0.4); IN("#q2-peer", at(3, 0.22), 0.4);
      ARROW("#q2-f2", at(3, 0.34), 0.3); IN("#q2-close", at(3, 0.38), 0.4);
      ARROW("#q2-f3", at(3, 0.52), 0.3); IN("#q2-fund", at(3, 0.56), 0.4);
      ARROW("#q2-f4", at(3, 0.74), 0.3); IN("#q2-new", at(3, 0.78), 0.4);
      // L4 干扰项：广播旧状态被没收
      OUT("#q2-p1", at(4, 0.0), 0.4);
      WRONG("A", at(4, 0.02));
      WRONG("B", at(4, 0.08));
      IN("#q2-old", at(4, 0.12), 0.4);
      ARROW("#q2-g1", at(4, 0.2), 0.4); IN("#q2-g1t", at(4, 0.2), 0.4); IN("#q2-chain", at(4, 0.24), 0.4);
      ARROW("#q2-g2", at(4, 0.36), 0.5); IN("#q2-g2t", at(4, 0.36), 0.4);
      IN("#q2-opp", at(4, 0.44), 0.4);
      IN("#q2-take", at(4, 0.5), 0.4);
      WRONG("C", at(4, 0.76));
      // L5 选项与示意退场；天平
      OUT("#q2-oA, #q2-oB, #q2-oC, #q2-oD, #q2-p2", at(5, 0.0), 0.4);

      IN("#q2-bl", at(5, 0.22), 0.5);
      IN("#q2-br", at(5, 0.6), 0.5);
      tl.to("#q2-beam", { rotation: 4, svgOrigin: "960 500", duration: 0.6, ease: "power2.inOut" }, at(5, 0.62));
