    (function () {

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      // ===== 测验版式（同 EP009 quiz1）=====

      IN("#q4-q", at(0, 0.03), 0.01);
      tl.fromTo("#q4-qcr1", { attr: { width: 0 } }, { attr: { width: 1480 }, duration: 2.6, ease: "none" }, at(0, 0.04));
      tl.fromTo("#q4-qcr2", { attr: { width: 0 } }, { attr: { width: 1480 }, duration: 2.6, ease: "none" }, at(0, 0.04) + 2.6);
      const SHOW = (k, t) => {
        IN(`#q4-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q4-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q4-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.0);
      };
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.25)); SHOW("C", at(1, 0.5)); SHOW("D", at(1, 0.72));
      IN("#q4-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q4-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#q4-pause", at(3, 0.0), 0.3);
      OUT("#q4-badge", at(3, 0.0), 0.3);
      const RIGHT = (k, t) => {
        tl.to(`#q4-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q4-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q4-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q4-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q4-o${k}-n`, t + 0.3, 0.5);
      };

      // L0 归集路径与两条电量条
      IN("#q4-addr", at(0, 0.12), 0.5, { x: -20 }, { x: 0 });
      ARROW("#q4-a1", at(0, 0.24), 0.6);
      IN("#q4-usdt", at(0, 0.26), 0.4);
      IN("#q4-hot", at(0, 0.28), 0.5, { x: 20 }, { x: 0 });
      IN("#q4-en", at(0, 0.4), 0.5);
      tl.to("#q4-ent", { strokeOpacity: 0.3, duration: 0.3, yoyo: true, repeat: 1 }, at(0, 0.46));
      IN("#q4-bw", at(0, 0.55), 0.4);
      tl.fromTo("#q4-bwf", { attr: { width: 0 } }, { attr: { width: 500 }, duration: 0.8, ease: "power2.out", immediateRender: false }, at(0, 0.57));
      IN("#q4-free", at(0, 0.62), 0.4);
      IN("#q4-need", at(0, 0.72), 0.5);
      // L3 揭晓 C；算式
      RIGHT("C", at(3, 0.03));
      IN("#q4-f1", at(3, 0.14), 0.5, { x: -20 }, { x: 0 });
      IN("#q4-f2", at(3, 0.4), 0.5, { x: -20 }, { x: 0 });
      IN("#q4-f3", at(3, 0.72), 0.5, { x: -20 }, { x: 0 });
      // L4 干扰项
      WRONG("B", at(4, 0.02));
      tl.to("#q4-bwf", { opacity: 0.4, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.2));
      tl.to("#q4-ent", { strokeWidth: 5, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.36));
      WRONG("A", at(4, 0.72));
      WRONG("D", at(4, 0.8));
      // L5 选项淡出；委托 / 租赁注满能量，火苗变小
      OUT("#q4-oA, #q4-oB, #q4-oC, #q4-oD", at(5, 0.0), 0.4);

      OUT("#q4-need", at(5, 0.32), 0.4);
      tl.to("#q4-fli", { scale: 0.4, svgOrigin: "400 820", duration: 1.0, ease: "power2.inOut" }, at(5, 0.45));

      tl.to("#q4-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
