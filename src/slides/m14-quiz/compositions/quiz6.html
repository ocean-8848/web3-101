      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // ===== 测验版式（同 EP009 quiz1）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q6-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q6-q", at(0, 0.03), 0.01);
      tl.fromTo("#q6-qcr1", { attr: { width: 0 } }, { attr: { width: 1480 }, duration: 3.0, ease: "none" }, at(0, 0.04));
      tl.fromTo("#q6-qcr2", { attr: { width: 0 } }, { attr: { width: 1480 }, duration: 2.8, ease: "none" }, at(0, 0.04) + 3.0);
      const SHOW = (k, t) => {
        IN(`#q6-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q6-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q6-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.0);
      };
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.1)); SHOW("C", at(1, 0.62)); SHOW("D", at(1, 0.82));
      IN("#q6-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q6-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#q6-pause", at(3, 0.0), 0.3);
      OUT("#q6-badge", at(3, 0.0), 0.3);
      const RIGHT = (k, t) => {
        tl.to(`#q6-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q6-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q6-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q6-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q6-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q6-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q6-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q6-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q6-o${k}-n`, t + 0.3, 0.5);
      };

      // L0 两条路线
      IN("#q6-t1", at(0, 0.18), 0.4);
      IN("#q6-arb", at(0, 0.24), 0.5, { x: -20 }, { x: 0 });

      ARROW("#q6-a1", at(0, 0.33), 0.6);
      IN("#q6-2s", at(0, 0.43), 0.4, { y: 10 }, { y: 0 });
      IN("#q6-t2", at(0, 0.6), 0.4);
      IN("#q6-qm", at(0, 0.75), 0.4, { scale: 1.5, svgOrigin: "1790 685" }, { scale: 1, svgOrigin: "1790 685" });
      // L3 揭晓 B；术语卡；Solver 垫资 + CCTP 三步

      IN("#q6-sv", at(3, 0.12), 0.4);
      IN("#q6-coin", at(3, 0.16), 0.2);
      tl.to("#q6-coin", { attr: { cx: 1668, cy: 472 }, duration: 0.8, ease: "power2.inOut" }, at(3, 0.17));
      IN("#q6-inv", at(3, 0.3), 0.4);
      IN("#q6-invf", at(3, 0.3), 0.4);
      IN("#q6-invt", at(3, 0.3), 0.4);
      OUT("#q6-invt", at(3, 0.36), 0.3);
      tl.to("#q6-invf", { attr: { width: 70 }, fill: "#FC6255", duration: 1.2, ease: "power2.in" }, at(3, 0.36));
      IN("#q6-worse", at(3, 0.46), 0.4);
      OUT("#q6-qm", at(3, 0.52), 0.3);
      IN("#q6-k1", at(3, 0.58), 0.4);
      ARROW("#q6-k12", at(3, 0.66), 0.3);
      IN("#q6-k2", at(3, 0.68), 0.4);
      ARROW("#q6-k23", at(3, 0.78), 0.3);
      IN("#q6-k3", at(3, 0.8), 0.4);
      IN("#q6-nos", at(3, 0.9), 0.4);

      WRONG("A", at(4, 0.02));
      tl.to("#q6-k3", { opacity: 0.4, duration: 0.25, yoyo: true, repeat: 1 }, at(4, 0.16));

      OUT("#q6-oA, #q6-oB, #q6-oC, #q6-oD", at(5, 0.0), 0.4);
      ARROW("#q6-back", at(5, 0.12), 0.7);
      IN("#q6-bl", at(5, 0.3), 0.4);
      tl.to("#q6-invf", { attr: { width: 300 }, fill: "#F0B90B", duration: 1.0, ease: "power2.out" }, at(5, 0.4));
      OUT("#q6-worse", at(5, 0.36), 0.3);
      IN("#q6-invt", at(5, 0.42), 0.4);

      tl.to("#q6-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#q6-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
