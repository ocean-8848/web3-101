  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const MSG = (a, lab, t) => { ARROW(a, t, 0.6); IN(lab, t + 0.3, 0.4); };
      const DIM = (s, t) => tl.to(s, { opacity: 0.3, duration: 0.4 }, t);

      // L0 两笔 Gas → 签名 + 一笔
      IN("#pe-old", at(0, 0.05), 0.6, { y: 14 }, { y: 0 });
      IN("#pe-term", at(0, 0.5), 0.5);
      IN("#pe-new", at(0, 0.68), 0.6, { y: 14 }, { y: 0 });
      tl.to("#pe-old", { opacity: 0.35, duration: 0.4 }, at(0, 0.68));
      // L1 泳道 + 链下签名
      OUT("#pe-s0", at(1, 0), 0.4);
      IN("#pe-hd1", at(1, 0.05), 0.4, { y: -12 }, { y: 0 });
      IN("#pe-hd2", at(1, 0.1), 0.4, { y: -12 }, { y: 0 });
      IN("#pe-hd3", at(1, 0.15), 0.4, { y: -12 }, { y: 0 });
      [["#pe-ll1", 760], ["#pe-ll2", 272], ["#pe-ll3", 272]].forEach(([s, y0], k) => {
        IN(s, at(1, 0.2 + 0.04 * k), 0.1);
        tl.fromTo(s, { attr: { y2: y0 } }, { attr: { y2: 1000 }, duration: 0.8, ease: "power2.out", immediateRender: false }, at(1, 0.2 + 0.04 * k));
      });
      IN("#pe-time", at(1, 0.3), 0.4);
      IN("#pe-board", at(1, 0.32), 0.5, { x: 20 }, { x: 0 });
      IN("#pe-vals", at(1, 0.36), 0.4);
      IN("#pe-off", at(1, 0.4), 0.4);
      IN("#pe-msg", at(1, 0.44), 0.5, { y: 10 }, { y: 0 });
      IN("#pe-stamp", at(1, 0.74), 0.3, { scale: 1.8, svgOrigin: "392 470" }, { scale: 1, svgOrigin: "392 470" });
      IN("#pe-0gas", at(1, 0.88), 0.4, { y: 8 }, { y: 0 });
      // L2 签名交给协议；任何人可提交
      OUT("#pe-term", at(2, 0), 0.3);

      tl.to("#pe-chip", { x: 400, duration: 0.7, ease: "power2.inOut" }, at(2, 0.1));
      IN("#pe-anyone", at(2, 0.55), 0.5, { y: 10 }, { y: 0 });
      // L3 同一笔交易：permit → 验签 → 设额度 → transferFrom
      OUT("#pe-anyone", at(3, 0), 0.3);
      DIM("#pe-send", at(3, 0));
      ARROW("#pe-br", at(3, 0.03), 0.5);
      MSG("#pe-m1", "#pe-m1l", at(3, 0.06));
      IN("#pe-key", at(3, 0.2), 0.4, { scale: 1.4, svgOrigin: "1140 874" }, { scale: 1, svgOrigin: "1140 874" });
      OUT("#pe-av0", at(3, 0.3), 0.2);
      IN("#pe-av1", at(3, 0.32), 0.4, { scale: 1.4, svgOrigin: "1780 456" }, { scale: 1, svgOrigin: "1780 456" });

      MSG("#pe-m2", "#pe-m2l", at(3, 0.58));
      IN("#pe-brl", at(3, 0.7), 0.5, { x: -10 }, { x: 0 });

      IN("#pe-anc", at(4, 0.12), 0.4);
      ARROW("#pe-a1a", at(4, 0.18), 0.5);
      COUNT("#pe-anc", 0, 1, at(4, 0.2), 0.4);
      IN("#pe-a2", at(4, 0.27), 0.4, { x: -10 }, { x: 0 });
      ARROW("#pe-a2a", at(4, 0.32), 0.5);
      IN("#pe-a2x", at(4, 0.35), 0.3, { scale: 1.6, svgOrigin: "700 795" }, { scale: 1, svgOrigin: "700 795" });
      IN("#pe-a2l", at(4, 0.37), 0.4);
      // (b) DOMAIN_SEPARATOR
      OUT("#pe-da", at(4, 0.46), 0.3);

      IN("#pe-k2", at(5, 0.71), 0.4, { x: 10 }, { x: 0 });

      IN("#pe-k3", at(5, 0.85), 0.4, { x: 10 }, { x: 0 });

      OUT("#pe-s5", at(6, 0), 0.4);
      IN("#pe-usdt", at(6, 0.2), 0.5, { scale: 0.7, svgOrigin: "660 480" }, { scale: 1, svgOrigin: "660 480" });
      IN("#pe-usdtl", at(6, 0.32), 0.4);
      IN("#pe-usdc", at(6, 0.6), 0.5, { scale: 0.7, svgOrigin: "1260 480" }, { scale: 1, svgOrigin: "1260 480" });

      ARROW("#pe-o2", at(7, 0.29), 0.5);
      ARROW("#pe-o3", at(7, 0.32), 0.5);
      IN("#pe-ol", at(7, 0.3), 0.4);

      ARROW("#pe-q1", at(7, 0.43), 0.5);
      ARROW("#pe-q2", at(7, 0.46), 0.5);
      ARROW("#pe-q3", at(7, 0.49), 0.5);
      IN("#pe-clks", at(7, 0.57), 0.5);
      IN("#pe-3009", at(7, 0.7), 0.6, { y: 16 }, { y: 0 });
      IN("#pe-3c", at(7, 0.8), 0.3);
      tl.fromTo("#pe-3c", { attr: { cx: 1560 } }, { attr: { cx: 1820 }, duration: 1.6, ease: "power2.inOut", immediateRender: false }, at(7, 0.82));
      tl.to("#pe-clks", { opacity: 0.35, duration: 0.3, yoyo: true, repeat: 3 }, at(7, 0.9));

      tl.to("#pe-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#pe-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["permit"] = tl;
    })();
