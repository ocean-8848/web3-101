    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const MSG = (a, lab, t) => { ARROW(a, t, 0.6); IN(lab, t + 0.3, 0.4); };
      const DIM = (s, t) => tl.to(s, { opacity: 0.3, duration: 0.4 }, t);
      // 内存池卡槽：上 = 先上链
      const SLOT1 = 320, SLOT2 = 420;
      tl.set("#ra-cA", { y: SLOT1 }, 0);
      tl.set("#ra-cB", { y: SLOT2 }, 0);

      // L0 术语卡 + 泳道
      IN("#ra-term", at(0, 0.02), 0.5);
      IN("#ra-hd1", at(0, 0.2), 0.4, { y: -12 }, { y: 0 });
      IN("#ra-hd2", at(0, 0.27), 0.4, { y: -12 }, { y: 0 });
      IN("#ra-hd3", at(0, 0.34), 0.4, { y: -12 }, { y: 0 });
      IN("#ra-hd4", at(0, 0.41), 0.4, { y: -12 }, { y: 0 });
      [["#ra-ll1", 272], ["#ra-ll2", 620], ["#ra-ll3", 272], ["#ra-ll4", 600]].forEach(([s, y0], k) => {
        IN(s, at(0, 0.5 + 0.05 * k), 0.1);
        tl.fromTo(s, { attr: { y2: y0 } }, { attr: { y2: 1000 }, duration: 0.8, ease: "power2.out", immediateRender: false }, at(0, 0.5 + 0.05 * k));
      });
      IN("#ra-pool", at(0, 0.6), 0.5);
      IN("#ra-board", at(0, 0.7), 0.5, { x: 20 }, { x: 0 });
      IN("#ra-vals", at(0, 0.75), 0.4);
      IN("#ra-time", at(0, 0.8), 0.5);
      // L1 Alice → 内存池
      ARROW("#ra-m1", at(1, 0.45), 0.5);
      IN("#ra-cAin", at(1, 0.5), 0.5, { x: -200 }, { x: 0 });
      IN("#ra-pend", at(1, 0.7), 0.4);
      // L2 Bob 盯着，抢先插队
      OUT("#ra-term", at(2, 0), 0.3);
      IN("#ra-eye", at(2, 0.15), 0.4);
      tl.fromTo("#ra-beam", { opacity: 0 }, { opacity: 1, duration: 0.3, yoyo: true, repeat: 3, immediateRender: false }, at(2, 0.2));
      tl.to("#ra-hd3r, #ra-bobc, #ra-bobb", { stroke: "#FC6255", duration: 0.4 }, at(2, 0.35));
      tl.to("#ra-bobt", { fill: "#FC6255", duration: 0.4 }, at(2, 0.35));
      MSG("#ra-m2", "#ra-tip", at(2, 0.5));
      IN("#ra-cBin", at(2, 0.55), 0.5, { x: 200 }, { x: 0 });
      tl.to("#ra-cB", { y: SLOT1, duration: 0.7, ease: "power2.inOut" }, at(2, 0.75));
      tl.to("#ra-cA", { y: SLOT2, duration: 0.7, ease: "power2.inOut" }, at(2, 0.75));
      // L3 区块 N / N+1 / N+2
      OUT("#ra-eye", at(3, 0), 0.3);
      DIM("#ra-m1, #ra-m2, #ra-tip", at(3, 0));
      OUT("#ra-cBin", at(3, 0.02), 0.3);
      MSG("#ra-b1", "#ra-b1l", at(3, 0.04));
      COUNT("#ra-al", 100, 0, at(3, 0.12), 0.7);
      COUNT("#ra-bb", 0, 100, at(3, 0.14), 0.7);
      IN("#ra-p1", at(3, 0.14), 0.3, { y: 10 }, { y: 0 });
      OUT("#ra-p1", at(3, 0.3), 0.3);
      OUT("#ra-cAin, #ra-pend", at(3, 0.36), 0.3);
      MSG("#ra-b2", "#ra-b2l", at(3, 0.38));
      COUNT("#ra-al", 0, 50, at(3, 0.46), 0.7);
      DIM("#ra-b1, #ra-b1l text", at(3, 0.7));
