    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 代扣协议
      IN("#in-paper", at(0, 0.03), 0.7, { y: 20 }, { y: 0 });
      IN("#in-bank", at(0, 0.5), 0.5);
      DRAW("#in-bankx", at(0, 0.62), 0.4);
      IN("#in-bankl", at(0, 0.68), 0.5, { y: 10 }, { y: 0 });
      // L1 签给骗子
      OUT("#in-bank, #in-bankl", at(1, 0), 0.3);
      tl.to("#in-bankx", { opacity: 0, duration: 0.3 }, at(1, 0));
      OUT("#in-payee", at(1, 0.05), 0.2);
      IN("#in-stamp", at(1, 0.08), 0.3, { scale: 1.6, svgOrigin: "357 496" }, { scale: 1, svgOrigin: "357 496" });
      IN("#in-acc", at(1, 0.3), 0.4, { x: 20 }, { x: 0 });
      ARROW("#in-grab", at(1, 0.5), 0.5); IN("#in-grabl", at(1, 0.55), 0.3);
      tl.to("#in-accbar", { attr: { width: 200 }, duration: 0.8, ease: "power2.inOut" }, at(1, 0.6));
      // L2 金额不限 · 永久有效 → 授权表那一格
      OUT("#in-stamp, #in-acc, #in-grab, #in-grabl", at(2, 0), 0.4);
      IN("#in-payee2", at(2, 0.04), 0.4);
      OUT("#in-amt", at(2, 0.06), 0.3);
      IN("#in-amt2", at(2, 0.1), 0.5, { x: -10 }, { x: 0 });
      tl.to("#in-papers", { scale: 0.4, svgOrigin: "520 560", duration: 0.7, ease: "power2.in" }, at(2, 0.33));
      OUT("#in-paper", at(2, 0.33) + 0.35, 0.35);
      IN("#in-cell", at(2, 0.33) + 0.5, 0.6, { scale: 0.6, svgOrigin: "700 510" }, { scale: 1, svgOrigin: "700 510" });
      IN("#in-cellh", at(2, 0.33) + 0.8, 0.4);
      tl.fromTo("#in-cellr", { strokeOpacity: 1 }, { strokeOpacity: 0.25, duration: 0.9, yoyo: true, repeat: 13, ease: "sine.inOut", immediateRender: false }, at(2, 0.33) + 1.2);
      IN("#in-term", at(2, 0.5), 0.5);
      IN("#in-type", at(2, 0.62), 0.5, { y: 10 }, { y: 0 });
      IN("#in-gas", at(2, 0.82), 0.5, { scale: 0.6, svgOrigin: "1500 500" }, { scale: 1, svgOrigin: "1500 500" });
      // L3 用后不递减
      OUT("#in-term", at(3, 0), 0.3);
      OUT("#in-gas", at(3, 0), 0.3);
      IN("#in-dex", at(3, 0.03), 0.4, { x: 20 }, { x: 0 });
      IN("#in-tfl", at(3, 0.08), 0.3);
      [0.1, 0.38, 0.66].forEach((f, k) => {
        const t = at(3, f);
        if (k === 0) ARROW("#in-tf", t, 0.5);
        else tl.fromTo("#in-tf", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false }, t);
        if (k > 0) OUT(`#in-n${k}`, t, 0.15);
        IN(`#in-n${k + 1}`, t + 0.1, 0.2);
        tl.fromTo(`#in-m${k + 1}`, { opacity: 0, y: 0 }, { opacity: 1, y: -24, duration: 0.35, ease: "power2.out", immediateRender: false }, t + 0.45);
        tl.to(`#in-m${k + 1}`, { opacity: 0, duration: 0.3 }, t + 0.85);
        tl.to("#in-cellt", { fill: "#FC6255", duration: 0.15, yoyo: true, repeat: 1 }, t + 0.5);
      });
      IN("#in-eq", at(3, 0.7), 0.4, { y: 10 }, { y: 0 });
      // L4 被攻破 / 恶意升级 → 全部暴露
      OUT("#in-type, #in-eq, #in-tf, #in-tfl, #in-n3", at(4, 0.03), 0.3);
      DRAW("#in-crack", at(4, 0.06), 0.4);
      tl.to("#in-dexr", { stroke: "#FC6255", duration: 0.3 }, at(4, 0.08));
      tl.to("#in-dext", { fill: "#FC6255", duration: 0.3 }, at(4, 0.08));
      IN("#in-up", at(4, 0.18), 0.4, { y: -10 }, { y: 0 });
      tl.to("#in-upr", { stroke: "#FC6255", duration: 0.3 }, at(4, 0.3));
      tl.to("#in-upt", { fill: "#FC6255", duration: 0.3 }, at(4, 0.3));
      IN("#in-bal", at(4, 0.4), 0.5, { x: -20 }, { x: 0 });
      IN("#in-frame", at(4, 0.5), 0.4, { scale: 1.08, svgOrigin: "700 740" }, { scale: 1, svgOrigin: "700 740" });
      IN("#in-exp", at(4, 0.55), 0.4);
