  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      // 逐字打出
      const TYPE = (sel, str, t, d = 0.8) => {
        const o = { n: 0 }, el = document.querySelector(sel);
        tl.fromTo(o, { n: 0 }, { n: str.length, duration: d, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = str.slice(0, Math.round(o.n)); } }, t);
      };

      // L0 显示 2.5 / 链上 2,500,000
      IN("#de-term", at(0, 0.02), 0.5);
      IN("#de-bar0", at(0, 0.3), 0.6, { y: 16 }, { y: 0 });
      IN("#de-bl0", at(0, 0.35), 0.5);
      IN("#de-beam", at(0, 0.5), 0.5);
      IN("#de-lens", at(0, 0.55), 0.6, { scale: 0.7, svgOrigin: "960 400" }, { scale: 1, svgOrigin: "960 400" });
      IN("#de-ll0", at(0, 0.62), 0.5);
      // L1 表格
      OUT("#de-l0", at(1, 0), 0.4);
      OUT("#de-term", at(1, 0), 0.3);
      IN("#de-tbox, #de-head, #de-seps", at(1, 0.04), 0.6);
      IN("#de-r1", at(1, 0.25), 0.5, { x: -16 }, { x: 0 });
      IN("#de-r2", at(1, 0.37), 0.5, { x: -16 }, { x: 0 });
      TYPE("#de-v2", "1,000,000", at(1, 0.4), 0.5);
      IN("#de-r3", at(1, 0.5), 0.5, { x: -16 }, { x: 0 });
      TYPE("#de-v3", "100,000,000", at(1, 0.53), 0.5);
      IN("#de-r0", at(1, 0.62), 0.5, { x: -16 }, { x: 0 });
      TYPE("#de-v0", "1,000,000,000,000,000,000 wei", at(1, 0.78), 1.2);
      // L2 算一算：只留 USDC 行
      OUT("#de-r0, #de-v0, #de-r1, #de-r3, #de-v3, #de-seps", at(2, 0), 0.4);
      tl.to("#de-r2m", { y: -190, duration: 0.8, ease: "power2.inOut" }, at(2, 0.04));
      tl.to("#de-tbox", { attr: { height: 175 }, duration: 0.8, ease: "power2.inOut" }, at(2, 0.04));
      IN("#de-tag", at(2, 0.1), 0.5);
      IN("#de-s1", at(2, 0.2), 0.5, { x: -16 }, { x: 0 });
      IN("#de-s2", at(2, 0.42), 0.5, { x: -16 }, { x: 0 });
      tl.to("#de-r2bg", { opacity: 0.15, duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.42));
      tl.to("#de-d6", { scale: 1.3, svgOrigin: "900 618", duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.42));
      IN("#de-s3", at(2, 0.65), 0.5, { x: -16 }, { x: 0 });
      IN("#de-res", at(2, 0.75), 0.2);
      COUNT("#de-res", 0, 2500000, at(2, 0.75), 1.2, v => Math.round(v).toLocaleString("en-US"));
      // L3 错误①：比余额大 10^12 倍 → revert
      OUT("#de-calc", at(3, 0), 0.35);
      IN("#de-e1t", at(3, 0.06), 0.5, { x: -16 }, { x: 0 });
      IN("#de-e1a, #de-e1b", at(3, 0.18), 0.4);
      IN("#de-e1c", at(3, 0.3), 0.4);
      IN("#de-e1r", at(3, 0.3), 0.05);
      tl.to("#de-e1r", { attr: { width: 1260 }, duration: 0.9, ease: "power3.in" }, at(3, 0.32));
      IN("#de-e1x", at(3, 0.5), 0.4, { x: -20 }, { x: 0 });
      IN("#de-sts", at(3, 0.66), 0.3, { scale: 1.6, svgOrigin: "1290 645" }, { scale: 1, svgOrigin: "1290 645", ease: "back.out(2)" });
      // L4 错误②：按 6 位 → 一万亿分之一，静默
      OUT("#de-e1", at(4, 0), 0.35);
      OUT("#de-r2m, #de-tbox, #de-head", at(4, 0), 0.35);
      IN("#de-e2t", at(4, 0.06), 0.5, { x: -16 }, { x: 0 });
      IN("#de-e2a, #de-e2b", at(4, 0.16), 0.4);
      IN("#de-e2c, #de-e2r", at(4, 0.26), 0.4);
      tl.to("#de-e2r", { attr: { width: 4 }, duration: 1.0, ease: "power3.in" }, at(4, 0.32));
      IN("#de-mag", at(4, 0.55), 0.4, { scale: 0.6, svgOrigin: "346 797" }, { scale: 1, svgOrigin: "346 797" });
      IN("#de-e2l", at(4, 0.62), 0.4);
      IN("#de-q", at(4, 0.78), 0.5, { y: 16 }, { y: 0 });
      // L5 结论
      OUT("#de-e2", at(5, 0), 0.4);
      IN("#de-con", at(5, 0.12), 0.7, { scale: 0.9, svgOrigin: "960 540" }, { scale: 1, svgOrigin: "960 540" });
      ARROW("#de-ul", at(5, 0.45), 0.6);
      IN("#de-call", at(5, 0.68), 0.6, { y: 20 }, { y: 0 });
      tl.to("#de-con", { scale: 1.04, svgOrigin: "960 540", duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, at(5, 0.9));

      tl.to("#de-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#de-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["decimals"] = tl;
    })();
  </script>
