  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const N = v => Math.round(v).toLocaleString("en-US");
      const LINES = [0, 1, 2, 3, 4, 5, 6, 7].map(i => "#sa-c" + i);
      const HL = (i, t) => {
        tl.to("#sa-hl", { attr: { y: 263 + 38 * i }, duration: 0.35, ease: "power2.inOut" }, t);
        tl.to(LINES.filter((_, k) => k !== i), { opacity: 0.6, duration: 0.3 }, t);
        tl.to(LINES[i], { opacity: 1, duration: 0.3 }, t);
      };

      // L0 deposit 代码
      IN("#sa-code", at(0, 0.05), 0.6, { y: 20 }, { y: 0 });
      IN("#sa-vault", at(0, 0.5), 0.5, { x: 20 }, { x: 0 });

      // L1 逐行：before → safeTransferFrom → after - before → shares
      IN("#sa-hl", at(1, 0.02), 0.3); HL(2, at(1, 0.02));
      IN("#sa-bef", at(1, 0.06), 0.4);
      HL(3, at(1, 0.26));
      ["#sa-co0", "#sa-co1", "#sa-co2"].forEach((s, k) => {
        const t = at(1, 0.28) + 0.25 * k;
        IN(s, t, 0.2);
        tl.to(s, { attr: { cx: 1400 + 40 * k, cy: 410 }, duration: 0.7, ease: "power2.inOut" }, t);
      });
      HL(4, at(1, 0.55));
      IN("#sa-aft", at(1, 0.56), 0.4);
      IN("#sa-rcv", at(1, 0.64), 0.5);
      HL(5, at(1, 0.84));
      IN("#sa-shr", at(1, 0.86), 0.5);

      // L2 算一算：2% 手续费
      OUT("#sa-code, #sa-vault, #sa-bef, #sa-aft, #sa-co0, #sa-co1, #sa-co2, #sa-rcv, #sa-shr", at(2, 0), 0.4);
      IN("#sa-fee", at(2, 0) + 0.45, 0.5);
      IN("#sa-in", at(2, 0.08), 0.2);
      tl.to("#sa-in", { attr: { width: 600 }, duration: 0.8, ease: "power2.out" }, at(2, 0.08));
      IN("#sa-inl", at(2, 0.16), 0.4);
      DRAW("#sa-far", at(2, 0.4), 0.6);
      ["#sa-dr0", "#sa-dr1"].forEach((s, k) => {
        IN(s, at(2, 0.5) + 0.2 * k, 0.15);
        tl.to(s, { attr: { cy: 510 }, duration: 0.6, ease: "power2.in" }, at(2, 0.5) + 0.2 * k);
        OUT(s, at(2, 0.5) + 0.2 * k + 0.5, 0.2);
      });
      IN("#sa-out", at(2, 0.6), 0.2);
      tl.to("#sa-out", { attr: { width: 588 }, duration: 0.8, ease: "power2.out" }, at(2, 0.6));
      IN("#sa-outl", at(2, 0.7), 0.4);

      // L3 错误：+1000，放大到 100 人
      IN("#sa-bad", at(3, 0.02), 0.5, { y: 16 }, { y: 0 });
      IN("#sa-bv1", at(3, 0.1), 0.4); IN("#sa-bv2", at(3, 0.2), 0.4);
      IN("#sa-gapl", at(3, 0.28), 0.4);
      tl.to("#sa-bad rect:last-child", { opacity: 0.3, duration: 0.25, yoyo: true, repeat: 3 }, at(3, 0.28));
      IN("#sa-users", at(3, 0.42), 0.4);
      COUNT("#sa-bv1", 1000, 100000, at(3, 0.42), 1.2, N);
      COUNT("#sa-bv2", 980, 98000, at(3, 0.5), 1.2, N);
      COUNT("#sa-gap", 20, 2000, at(3, 0.58), 1.0, N);
      for (let k = 0; k < 10; k++) IN("#sa-u" + k, at(3, 0.7) + 0.06 * k, 0.3, { y: 10 }, { y: 0 });
      tl.to("#sa-u8 circle, #sa-u8 path, #sa-u9 circle, #sa-u9 path", { stroke: "#FC6255", duration: 0.3 }, at(3, 0.86));
      IN("#sa-cant", at(3, 0.88), 0.4);
      IN("#sa-note", at(3, 0.6), 0.5);

      // L4 正确：+received
      OUT("#sa-note", at(4, 0), 0.3);
      IN("#sa-good", at(4, 0) + 0.35, 0.5, { y: 16 }, { y: 0 });
      IN("#sa-gb1", at(4, 0.1), 0.2); IN("#sa-gb2", at(4, 0.1), 0.2);
      tl.to("#sa-gb1, #sa-gb2", { attr: { width: 588 }, duration: 0.8, ease: "power2.out" }, at(4, 0.1));
      IN("#sa-geq", at(4, 0.5), 0.4);
      IN("#sa-ok", at(4, 0.62), 0.4);

      // L5 forceApprove
      OUT("#sa-fee, #sa-in, #sa-inl, #sa-far, #sa-out, #sa-outl, #sa-bad, #sa-bv1, #sa-bv2, #sa-gapl, #sa-users, #sa-cant, #sa-good, #sa-gb1, #sa-gb2, #sa-geq, #sa-ok", at(5, 0), 0.4);
      for (let k = 0; k < 10; k++) OUT("#sa-u" + k, at(5, 0), 0.4);
      IN("#sa-code2", at(5, 0) + 0.45, 0.5, { y: 16 }, { y: 0 });
      IN("#sa-r1", at(5, 0.18), 0.4);
      DRAW("#sa-r1a", at(5, 0.24), 0.5); IN("#sa-r1b", at(5, 0.28), 0.3);
      IN("#sa-r1x", at(5, 0.34), 0.3); IN("#sa-r1t", at(5, 0.36), 0.4);
      IN("#sa-r2", at(5, 0.55), 0.4);
      DRAW("#sa-r2a", at(5, 0.62), 0.4); IN("#sa-r2b", at(5, 0.66), 0.3);
      DRAW("#sa-r2c", at(5, 0.68), 0.4); IN("#sa-r2d", at(5, 0.72), 0.3);
      IN("#sa-r2t", at(5, 0.76), 0.4);

      tl.to("#sa-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["safe"] = tl;
    })();
  </script>
