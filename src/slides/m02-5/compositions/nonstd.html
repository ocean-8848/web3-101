      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      // 第 i 个问题：编号换成问题，结论卡长出，之前的行变暗
      const ASK = (i, tq, tk) => {
        OUT("#no-n" + i, tq, 0.25);
        IN("#no-q" + i, tq + 0.3, 0.4);
        tl.to("#no-d" + i, { strokeWidth: 5, duration: 0.3, yoyo: true, repeat: 1 }, tq);
        IN("#no-k" + i, tk, 0.5, { x: -20 }, { x: 0 });
        for (let k = 0; k < i; k++) tl.to(["#no-q" + k, "#no-k" + k, "#no-d" + k], { opacity: 0.45, duration: 0.3 }, tq);
      };

      // L0 协议 + 五条分叉 + 编号
      IN("#no-proto", at(0, 0.05), 0.6, { x: -20 }, { x: 0 });
      for (let i = 0; i < 5; i++) {
        DRAW("#no-l" + i, at(0, 0.28 + 0.1 * i), 0.5);
        IN("#no-d" + i, at(0, 0.32 + 0.1 * i), 0.4);
        IN("#no-n" + i, at(0, 0.34 + 0.1 * i), 0.4);
      }

      // L1 ① bool
      ASK(0, at(1, 0.02), at(1, 0.3));
      IN("#no-a1", at(1, 0.12), 0.5);
      IN("#no-gear", at(1, 0.2), 0.5);
      tl.to("#no-grot", { rotation: 200, svgOrigin: "360 762", duration: 2.2, ease: "power1.out" }, at(1, 0.22));
      tl.to("#no-grot", { rotation: 192, svgOrigin: "360 762", duration: 0.12, yoyo: true, repeat: 5 }, at(1, 0.22) + 2.2);
      tl.to("#no-gglow", { fillOpacity: 0.35, duration: 0.3, yoyo: true, repeat: 3 }, at(1, 0.45));
      tl.to("#no-gin", { stroke: "#FC6255", duration: 0.3 }, at(1, 0.45));
      IN("#no-grev", at(1, 0.5), 0.4);
      IN("#no-term1", at(1, 0.78), 0.5);

      // L2 ② 手续费
      OUT("#no-term1, #no-a1, #no-gear, #no-grev", at(2, 0), 0.35);
      IN("#no-term2", at(2, 0) + 0.45, 0.5);
      ASK(1, at(2, 0.05), at(2, 0.42));
      IN("#no-a2", at(2, 0.12), 0.5);
      DRAW("#no-a2ar", at(2, 0.22), 0.5);
      ["#no-cn0", "#no-cn1", "#no-cn2"].forEach((s, k) => {
        IN(s, at(2, 0.28) + 0.15 * k, 0.15);
        tl.to(s, { attr: { cy: 920 }, duration: 0.6, ease: "power2.in" }, at(2, 0.28) + 0.15 * k);
        OUT(s, at(2, 0.28) + 0.15 * k + 0.5, 0.2);
      });
      IN("#no-a2o", at(2, 0.36), 0.4);

      // L3 ③ rebase
      OUT("#no-term2, #no-a2, #no-a2ar, #no-a2o", at(3, 0), 0.35);
      IN("#no-term3", at(3, 0) + 0.45, 0.5);
      ASK(2, at(3, 0.04), at(3, 0.62));
      IN("#no-a3", at(3, 0.12), 0.5); IN("#no-sbar", at(3, 0.12), 0.5);
