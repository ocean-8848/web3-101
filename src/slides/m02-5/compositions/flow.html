    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const FMT = v => Math.round(v).toLocaleString("en-US");
      // 消息：箭头从发出方射出 0.6 s，标签随后淡入
      const MSG = (a, lab, t) => { ARROW(a, t, 0.6); IN(lab, t + 0.3, 0.4); };
      const DIM = (s, t) => tl.to(s, { opacity: 0.3, duration: 0.4 }, t);
      const FLASH = (s, t) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 3, immediateRender: false }, t);

      // L0 不能主动拿；没有回调
      IN("#fl-pile", at(0, 0.02), 0.6, { y: 16 }, { y: 0 });
      IN("#fl-wdex", at(0, 0.08), 0.6, { x: 20 }, { x: 0 });
      IN("#fl-glass", at(0, 0.14), 0.6, { scale: 0.9, svgOrigin: "897 530" }, { scale: 1, svgOrigin: "897 530" });
      ARROW("#fl-grab", at(0, 0.2), 0.6);
      tl.to("#fl-glass", { x: 6, duration: 0.08, yoyo: true, repeat: 3 }, at(0, 0.2) + 0.6);
      IN("#fl-grabl", at(0, 0.27), 0.4);
      IN("#fl-other", at(0, 0.6), 0.5);
      ARROW("#fl-pay", at(0, 0.66), 0.6); IN("#fl-payl", at(0, 0.68), 0.4);
      IN("#fl-bell", at(0, 0.76), 0.4);
      IN("#fl-belll", at(0, 0.82), 0.4, { y: 10 }, { y: 0 });
      // L1 墙淡出，泳道
      OUT("#fl-wall", at(1, 0), 0.4);
      IN("#fl-hd1", at(1, 0.1), 0.4, { y: -12 }, { y: 0 });
      IN("#fl-hd2", at(1, 0.17), 0.4, { y: -12 }, { y: 0 });
      IN("#fl-hd3", at(1, 0.24), 0.4, { y: -12 }, { y: 0 });
