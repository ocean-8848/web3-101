      };
      const ROT = (sel, cx, cy, len, a0, a1, t, d, ease = "none") => { const el = document.querySelector(sel), o = { a: a0 };
        tl.fromTo(o, { a: a0 }, { a: a1, duration: d, ease, immediateRender: false, onUpdate: () => { const r = o.a * Math.PI / 180; el.setAttribute("x2", (cx + len * Math.sin(r)).toFixed(1)); el.setAttribute("y2", (cy - len * Math.cos(r)).toFixed(1)); } }, t); };

        IN(`#re-c${i}, #re-ch${i}`, t0 + 1.0, 0.3, { y: -20 }, { y: 0 });
