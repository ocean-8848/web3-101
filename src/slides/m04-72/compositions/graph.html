  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const fmtc = v => Math.round(v).toLocaleString("en-US");
      const COL = (s, c, t, d = 0.3, prop = "fill") => tl.to(s, { [prop]: c, duration: d }, t);
      const ALONG = (sel, psel, t, d = 1, ease = "power1.inOut", r0 = 0, r1 = 1) => {
        const el = document.querySelector(sel), p = document.querySelector(psel), len = p.getTotalLength(), o = { v: r0 };
        tl.fromTo(o, { v: r0 }, { v: r1, duration: d, ease, immediateRender: false, onUpdate: () => { const q = p.getPointAtLength(o.v * len); el.setAttribute("transform", `translate(${q.x.toFixed(1)},${q.y.toFixed(1)})`); } }, t);
      };
      const ROT = (sel, cx, cy, len, a0, a1, t, d, ease = "none") => { const el = document.querySelector(sel), o = { a: a0 };
        tl.fromTo(o, { a: a0 }, { a: a1, duration: d, ease, immediateRender: false, onUpdate: () => { const r = o.a * Math.PI / 180; el.setAttribute("x2", (cx + len * Math.sin(r)).toFixed(1)); el.setAttribute("y2", (cy - len * Math.cos(r)).toFixed(1)); } }, t); };
      const SWAP = (a, b, t, d = 0.3) => { OUT(a, t, d); IN(b, t + d, d); };

      // L0 nodes then edges
      ["LINK", "WETH", "USDC", "DAI"].forEach((n, i) => IN(`#gr-n${n}`, at(0, 0.05) + i * 0.25, 0.5, { scale: 0.6, svgOrigin: { LINK: "260 620", WETH: "760 420", USDC: "1260 420", DAI: "1660 680" }[n] }, { scale: 1, svgOrigin: { LINK: "260 620", WETH: "760 420", USDC: "1260 420", DAI: "1660 680" }[n] }));
      [1, 3, 4, 5, 6].forEach((k, i) => { DRAW(`#gr-e${k}`, at(0, 0.3) + i * 0.4, 0.7); IN(`#gr-l${k}`, at(0, 0.3) + i * 0.4 + 0.5, 0.4); });
      IN("#gr-e2", at(0, 0.62), 0.6); IN("#gr-l2", at(0, 0.7), 0.4);
      // L1 four candidate paths
      [["A", 0.12, 0], ["B", 0.34, 1], ["C", 0.55, 2], ["D", 0.8, 3]].forEach(([g, f, h], i) => {
        const t0 = at(1, f);
        DRAW(`#gr-g${g}`, t0, 1.1);
        IN(`#gr-hop${h}`, t0 + 0.2, 0.3);
