  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const fmtc = v => Math.round(v).toLocaleString("en-US");
      const COL = (s, c, t, d = 0.3, prop = "fill") => tl.to(s, { [prop]: c, duration: d }, t);
      const ALONG = (sel, psel, t, d = 1, ease = "power1.inOut", r0 = 0, r1 = 1) => {
        const el = document.querySelector(sel), p = document.querySelector(psel), len = p.getTotalLength(), o = { v: r0 };
        tl.fromTo(o, { v: r0 }, { v: r1, duration: d, ease, immediateRender: false, onUpdate: () => { const q = p.getPointAtLength(o.v * len); el.setAttribute("transform", `translate(${q.x.toFixed(1)},${q.y.toFixed(1)})`); } }, t);
      };
      const ROT = (sel, cx, cy, len, a0, a1, t, d, ease = "none") => { const el = document.querySelector(sel), o = { a: a0 };
        tl.fromTo(o, { a: a0 }, { a: a1, duration: d, ease, immediateRender: false, onUpdate: () => { const r = o.a * Math.PI / 180; el.setAttribute("x2", (cx + len * Math.sin(r)).toFixed(1)); el.setAttribute("y2", (cy - len * Math.cos(r)).toFixed(1)); } }, t); };
      const SWAP = (a, b, t, d = 0.3) => { OUT(a, t, d); IN(b, t + d, d); };

      // L0
      IN("#ho-coins", at(0, 0.05), 0.7, { y: 30 }, { y: 0 });
      ARROW("#ho-arr1", at(0, 0.4), 0.9);
      IN("#ho-usdc", at(0, 0.6), 0.6);
      tl.fromTo("#ho-q0", { opacity: 1 }, { opacity: 0.35, duration: 0.4, yoyo: true, repeat: 3, immediateRender: false }, at(0, 0.8));
      // L1
      OUT("#ho-arr1", at(1, 0), 0.3);
      IN("#ho-win", at(1, 0.05), 0.6, { y: 20 }, { y: 0 });
      COUNT("#ho-num", 0, 280458, at(1, 0.3), 2.2, v => "≈ " + fmtc(v));
      tl.fromTo("#ho-num", { attr: { "font-size": 84 } }, { attr: { "font-size": 92 }, duration: 0.3, yoyo: true, repeat: 1, immediateRender: false }, at(1, 0.78));
      // L2
      OUT("#ho-coins, #ho-usdc", at(2, 0), 0.4);
      for (let i = 0; i < 8; i++) IN(`#ho-p${i}`, at(2, 0.04) + i * 0.12, 0.5, { y: 30 }, { y: 0 });
      IN("#ho-blk, #ho-bk0", at(2, 0.3), 0.5);
      const H = [130,60,105,55,140,80,100,70], DJ = [[-14,10,-6,12,-10,8,-12,6],[10,-8,12,-10,6,-12,8,-6]];
      const jig = (k, t) => { for (let i = 0; i < 8; i++) {
        const cx = 240 + i*206, w = H[i] >= 100 ? 124 : 84, e = w*0.16, yt = 980 - H[i] - DJ[k][i];
        tl.to(`#ho-p${i}-b`, { attr: { d: `M${cx-w/2} ${yt} L${cx-w/2} 980 A${w/2} ${e} 0 0 0 ${cx+w/2} 980 L${cx+w/2} ${yt}` }, duration: 0.5, ease: "power2.inOut" }, t);
        tl.to(`#ho-p${i}-t`, { attr: { cy: yt }, duration: 0.5, ease: "power2.inOut" }, t);
        tl.to(`#ho-p${i}-q`, { attr: { y: yt - e - 14 }, duration: 0.5, ease: "power2.inOut" }, t);
      } };
      SWAP("#ho-bk0", "#ho-bk1", at(2, 0.5)); jig(0, at(2, 0.5));
      SWAP("#ho-bk1", "#ho-bk2", at(2, 0.75)); jig(1, at(2, 0.75));
      COL("#ho-num", "#FF9F43", at(2, 0.8), 0.3);
      // L3
      OUT("#ho-win, #ho-blk, #ho-bk2", at(3, 0), 0.4);
      IN("#ho-card", at(3, 0.04), 0.5, { x: 40 }, { x: 0 });
      IN("#ho-term", at(3, 0.06), 0.5);
      for (let i = 0; i < 8; i++) { tl.to(`#ho-p${i}-q`, { opacity: 0, duration: 0.3 }, at(3, 0.15) + i*0.05); tl.to(`#ho-p${i}-t`, { fill: "#1c3a46", duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.18) + i*0.08); }
      IN("#ho-eq", at(3, 0.3), 0.7, { y: 20 }, { y: 0 });
      tl.fromTo("#ho-eq", { attr: { "font-size": 76 } }, { attr: { "font-size": 82 }, duration: 0.35, yoyo: true, repeat: 1, immediateRender: false }, at(3, 0.55));
      IN("#ho-clk", at(3, 0.72), 0.5);
      ROT("#ho-hand", 720, 680, 32, 90, 810, at(3, 0.72), 3.2);
      // L4 map
      OUT("#ho-card, #ho-eq, #ho-clk, #ho-pools", at(4, 0), 0.4);
      IN("#ho-map", at(4, 0.05), 0.5);
      IN("#ho-st, #ho-en", at(4, 0.1), 0.4);
      DRAW("#ho-rt", at(4, 0.12), 0.9); DRAW("#ho-rm", at(4, 0.18), 0.9); DRAW("#ho-rb", at(4, 0.24), 0.9);
      IN("#ho-cost", at(4, 0.45), 0.5);
      for (let i = 0; i < 8; i++) {
        const top = i % 2 === 0, t0 = at(4, 0.55) + Math.floor(i / 2) * 0.35;
        IN(`#ho-car${i}`, t0, 0.15);
        ALONG(`#ho-car${i}`, top ? "#ho-rt" : "#ho-rm", t0, 3.2, "none", 0, 0.42 - Math.floor(i / 2) * 0.06);
      }
      // L5 changing roads + front-runner
      const RC = [["#ho-rt","#FC6255"],["#ho-rb","#83C167"],["#ho-rm","#FC6255"],["#ho-rt","#83C167"],["#ho-rb","#FC6255"],["#ho-rm","#83C167"],["#ho-rt","#8a8f99"],["#ho-rb","#8a8f99"],["#ho-rm","#8a8f99"]];
      RC.forEach(([r, c], k) => COL(r, c, at(5, 0.02) + k * 0.55, 0.2, "stroke"));
      for (let i = 0; i < 8; i++) { const top = i % 2 === 0, j = Math.floor(i / 2);
        ALONG(`#ho-car${i}`, top ? "#ho-rt" : "#ho-rm", at(5, 0.1), 4.6, "none", 0.42 - j*0.06, 0.88 - j*0.06); }
      IN("#ho-red", at(5, 0.25), 0.3);
      ALONG("#ho-red", "#ho-redp", at(5, 0.28), 0.8, "power2.in");
      ALONG("#ho-red", "#ho-rt", at(5, 0.28) + 0.8, 3.4, "none", 0.52, 0.97);
      IN("#ho-s1", at(5, 0.72), 0.5, { y: 20 }, { y: 0 });
      IN("#ho-s2", at(5, 0.8), 0.5, { y: 20 }, { y: 0 });
      OUT("#ho-term", at(5, 0.97), 0.3);


      tl.to("#ho-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ho-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["hook"] = tl;
    })();
