        const el = document.querySelector(sel), p = document.querySelector(psel), len = p.getTotalLength(), o = { v: r0 };
        tl.fromTo(o, { v: r0 }, { v: r1, duration: d, ease, immediateRender: false, onUpdate: () => { const q = p.getPointAtLength(o.v * len); el.setAttribute("transform", `translate(${q.x.toFixed(1)},${q.y.toFixed(1)})`); } }, t);

      const ROT = (sel, cx, cy, len, a0, a1, t, d, ease = "none") => { const el = document.querySelector(sel), o = { a: a0 };
