  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const fmtc = v => Math.round(v).toLocaleString("en-US");
      const COL = (s, c, t, d = 0.3, prop = "fill") => tl.to(s, { [prop]: c, duration: d }, t);
      const ALONG = (sel, psel, t, d = 1, ease = "power1.inOut", r0 = 0, r1 = 1) => {
        const el = document.querySelector(sel), p = document.querySelector(psel), len = p.getTotalLength(), o = { v: r0 };
        tl.fromTo(o, { v: r0 }, { v: r1, duration: d, ease, immediateRender: false, onUpdate: () => { const q = p.getPointAtLength(o.v * len); el.setAttribute("transform", `translate(${q.x.toFixed(1)},${q.y.toFixed(1)})`); } }, t);
      };
      const ROT = (sel, cx, cy, len, a0, a1, t, d, ease = "none") => { const el = document.querySelector(sel), o = { a: a0 };
        tl.fromTo(o, { a: a0 }, { a: a1, duration: d, ease, immediateRender: false, onUpdate: () => { const r = o.a * Math.PI / 180; el.setAttribute("x2", (cx + len * Math.sin(r)).toFixed(1)); el.setAttribute("y2", (cy - len * Math.cos(r)).toFixed(1)); } }, t); };
      const SWAP = (a, b, t, d = 0.3) => { OUT(a, t, d); IN(b, t + d, d); };

      // L0
      IN("#sy-tab", at(0, 0.1), 0.6, { x: 30 }, { x: 0 });
      // L1 slow reads -> snapshot + events
      for (let i = 0; i < 8; i++) IN(`#sy-c${i}, #sy-d${i}`, at(1, 0.02) + i * 0.08, 0.4);
      IN("#sy-slow", at(1, 0.06), 0.4);
      for (let i = 0; i < 5; i++) tl.to(`#sy-d${i}`, { fill: "#58C4DD", duration: 0.25 }, at(1, 0.12) + i * 0.55);
      IN("#sy-x", at(1, 0.44), 0.3, { scale: 1.2, svgOrigin: "620 425" }, { scale: 1, svgOrigin: "620 425" });
      IN("#sy-slow2", at(1, 0.46), 0.3);
      IN("#sy-cam", at(1, 0.56), 0.5, { y: 20 }, { y: 0 });
      tl.fromTo("#sy-lens", { attr: { r: 24 } }, { attr: { r: 6 }, duration: 0.15, yoyo: true, repeat: 1, immediateRender: false }, at(1, 0.66));
      IN("#sy-evl", at(1, 0.74), 0.5);
      for (let r = 0; r < 2; r++) for (let i = 0; i < 6; i++) {
        const t0 = at(1, 0.72) + r * 1.4 + i * 0.24;
        tl.fromTo(`#sy-e${i}`, { opacity: 0, attr: { x: 1100 } }, { opacity: 1, duration: 0.2, immediateRender: false }, t0);
        tl.fromTo(`#sy-e${i}`, { attr: { x: 1100 } }, { attr: { x: 640 }, duration: 1.3, ease: "none", immediateRender: false }, t0);
        tl.to(`#sy-e${i}`, { opacity: 0, duration: 0.15 }, t0 + 1.15);
      }
      // L2 factory -> multicall
      const L1OUT = Array.from({ length: 8 }, (_, i) => `#sy-c${i}, #sy-d${i}`).join(", ");
      OUT(L1OUT + ", #sy-slow, #sy-x, #sy-slow2, #sy-cam, #sy-evl", at(2, 0), 0.4);
      IN("#sy-n1", at(2, 0.05), 0.5, { y: -16 }, { y: 0 });
      DRAW("#sy-fan", at(2, 0.25), 0.6);
      IN("#sy-n2", at(2, 0.3), 0.5, { y: -16 }, { y: 0 });
      IN("#sy-term", at(2, 0.33), 0.5);
      tl.to("#sy-n2r", { strokeWidth: 6, duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.45));
      IN("#sy-r2", at(2, 0.66), 0.5, { x: 20 }, { x: 0 });
      IN("#sy-r3", at(2, 0.84), 0.5, { x: 20 }, { x: 0 });
      OUT("#sy-term", at(2, 0.33) + 7.0, 0.4);
      // L3 snapshot block + subscribe
      ARROW("#sy-a2", at(3, 0.02), 0.3);
      IN("#sy-n3", at(3, 0.08), 0.5, { y: -16 }, { y: 0 });
      IN("#sy-b20, #sy-b30", at(3, 0.3), 0.4, { y: -10 }, { y: 0 });
      ARROW("#sy-a3", at(3, 0.5), 0.3);
      IN("#sy-n4", at(3, 0.56), 0.5, { y: -16 }, { y: 0 });
      // L4 event types, V2 Sync
      ARROW("#sy-a4", at(4, 0.0), 0.25);
      IN("#sy-dia", at(4, 0.03), 0.4);
      DRAW("#sy-br", at(4, 0.08), 0.5);
      IN("#sy-k0, #sy-k1, #sy-k2", at(4, 0.12), 0.4);
      tl.to("#sy-k0r", { stroke: "#F0B90B", strokeWidth: 5, duration: 0.3 }, at(4, 0.22));
      IN("#sy-sc", at(4, 0.28), 0.5, { x: -30 }, { x: 0 });
      tl.to("#sy-f2", { opacity: 0.25, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.48));
      IN("#sy-sct", at(4, 0.5), 0.4);
      SWAP("#sy-b20", "#sy-b21", at(4, 0.5));
