<template>
  <style>
    #root { position: absolute; inset: 0; background: #0f1117; overflow: hidden; }
    #root svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root text { font-family: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    #root .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; }
    #root .h { opacity: 0; }
    #root .dr { stroke-dasharray: 1; stroke-dashoffset: 1; }
  </style>
  <!-- 场景 tryit，id 前缀 tr- -->
  <div id="root" data-composition-id="tryit" data-duration="28.75" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="tr-cp1"><rect id="tr-m1" x="390" y="320" width="0" height="56" /></clipPath>
        <clipPath id="tr-cp2"><rect id="tr-m2" x="390" y="492" width="0" height="56" /></clipPath>
        <clipPath id="tr-cp3"><rect id="tr-m3" x="390" y="640" width="0" height="56" /></clipPath>
        <clipPath id="tr-cp4"><rect id="tr-m4" x="390" y="770" width="0" height="56" /></clipPath>
      </defs>
      <g id="tr-all">
        <g id="tr-tag" class="h">
          <rect x="360" y="168" width="250" height="54" rx="27" fill="none" stroke="#FF9F43" stroke-width="2.5" />
          <text x="485" y="206" font-size="30" font-weight="700" fill="#FF9F43" text-anchor="middle">只用测试私钥</text>
        </g>
        <g id="tr-win" class="h">
          <rect x="360" y="240" width="1200" height="660" rx="18" fill="#161a22" stroke="#8a8f99" stroke-width="2.5" />
          <line x1="360" y1="292" x2="1560" y2="292" stroke="#3a3f4a" stroke-width="2" />
          <circle cx="398" cy="266" r="9" fill="#FC6255" /><circle cx="428" cy="266" r="9" fill="#FF9F43" /><circle cx="458" cy="266" r="9" fill="#83C167" />
          <text class="mono" x="1520" y="276" font-size="28" fill="#6b6f7a" text-anchor="end">foundry</text>
        </g>
        <rect id="tr-cur" class="h" x="400" y="330" width="16" height="36" fill="#e8e6df" />

        <!-- L1 new -->
        <text id="tr-c1" class="mono" clip-path="url(#tr-cp1)" x="400" y="360" font-size="30" fill="#e8e6df"><tspan fill="#58C4DD">$</tspan> cast wallet new</text>
        <text id="tr-o1a" class="h mono" x="400" y="408" font-size="30" fill="#8a8f99">Address:     <tspan fill="#83C167">0x8a3F…c21E</tspan></text>
        <text id="tr-o1b" class="h mono" x="400" y="452" font-size="30" fill="#8a8f99">Private key: <tspan fill="#FC6255">0x••••••••••••••••</tspan></text>

        <!-- L2 sign -->
        <text id="tr-c2" class="mono" clip-path="url(#tr-cp2)" x="400" y="532" font-size="30" fill="#e8e6df"><tspan fill="#58C4DD">$</tspan> cast wallet sign --private-key $PK "hello"</text>
        <text id="tr-o2" class="h mono" x="400" y="580" font-size="30" fill="#F0B90B">0x5c1e7a…9b1c1b</text>
        <text id="tr-o2l" class="h" x="700" y="580" font-size="28" fill="#F0B90B">65 字节</text>

        <!-- L3 verify -->
        <text id="tr-c3" class="mono" clip-path="url(#tr-cp3)" x="400" y="680" font-size="30" fill="#e8e6df"><tspan fill="#58C4DD">$</tspan> cast wallet verify -a $ADDR "hello" $SIG</text>
        <text id="tr-o3" class="h mono" x="400" y="728" font-size="30" fill="#83C167">Validation succeeded</text>
        <text id="tr-o3l" class="h" x="800" y="728" font-size="30" font-weight="700" fill="#83C167">✓ 验证成功</text>

        <!-- L4 hello! -->
        <text id="tr-c4" class="mono" clip-path="url(#tr-cp4)" x="400" y="810" font-size="30" fill="#e8e6df"><tspan fill="#58C4DD">$</tspan> cast wallet verify -a $ADDR "hello<tspan id="tr-bang" fill="#FC6255">!</tspan>" $SIG</text>
        <text id="tr-o4" class="h mono" x="400" y="858" font-size="30" fill="#FC6255">Error: validation failed</text>
        <text id="tr-o4l" class="h" x="880" y="858" font-size="30" font-weight="700" fill="#FC6255">✕ 验证失败</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      // 打字：裁剪框宽度展开，光标跟随
      const TYPE = (k, y, w, t, d) => {
        tl.fromTo(`#tr-m${k}`, { attr: { width: 0 } }, { attr: { width: w }, duration: d, ease: "none", immediateRender: false }, t);
        tl.set("#tr-cur", { attr: { y: y - 30 } }, t);
        tl.fromTo("#tr-cur", { attr: { x: 400 } }, { attr: { x: 400 + w + 6 }, duration: d, ease: "none", immediateRender: false }, t);
      };

      // L0 终端 + 标签
      IN("#tr-win", at(0, 0.02), 0.6, { y: 20 }, { y: 0 });
      IN("#tr-tag", at(0, 0.35), 0.5, { x: -16 }, { x: 0 });
      IN("#tr-cur", at(0, 0.5), 0.2);
      // L1 cast wallet new
      TYPE(1, 360, 310, at(1, 0.18), 0.9);
      IN("#tr-o1a", at(1, 0.4), 0.4);
      IN("#tr-o1b", at(1, 0.52), 0.4);
      tl.fromTo("#tr-o1b tspan", { opacity: 1 }, { opacity: 0.35, duration: 0.3, yoyo: true, repeat: 1, immediateRender: false }, at(1, 0.75));
      // L2 sign
      TYPE(2, 532, 800, at(2, 0.05), 1.3);
      IN("#tr-o2", at(2, 0.55), 0.4);
      IN("#tr-o2l", at(2, 0.72), 0.4, { x: -10 }, { x: 0 });
      // L3 verify
      TYPE(3, 680, 770, at(3, 0.05), 1.3);
      IN("#tr-o3", at(3, 0.6), 0.4);
      IN("#tr-o3l", at(3, 0.7), 0.4, { scale: 0.8, svgOrigin: "880 718" }, { scale: 1, svgOrigin: "880 718" });
      // L4 hello! → 失败
      TYPE(4, 810, 790, at(4, 0.04), 1.3);
      tl.fromTo("#tr-bang", { opacity: 1 }, { opacity: 0.2, duration: 0.25, yoyo: true, repeat: 3, immediateRender: false }, at(4, 0.3));
      IN("#tr-o4", at(4, 0.45), 0.4);
      IN("#tr-o4l", at(4, 0.55), 0.4, { scale: 0.8, svgOrigin: "960 848" }, { scale: 1, svgOrigin: "960 848" });
      tl.to("#tr-o2", { fill: "#fff2c0", duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.8));
      OUT("#tr-cur", at(4, 0.6), 0.3);

      tl.to("#tr-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["tryit"] = tl;
    })();
  </script>
</template>
