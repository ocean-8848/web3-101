      // L0 骰子 k → 生死线

      tl.to("#no-fd", { fill: "#ffb3ab", duration: 0.3, yoyo: true, repeat: 1 }, at(1, 0.85));
      // L2 同一个 k 两次
      OUT("#no-term", at(2, 0), 0.4);
      tl.to("#no-p1", { y: -150, scale: 0.7, svgOrigin: "960 400", duration: 0.7, ease: "power2.inOut" }, at(2, 0.04));
      IN("#no-c1", at(2, 0.12), 0.5, { x: -30 }, { x: 0 });
      IN("#no-c2", at(2, 0.24), 0.5, { x: -30 }, { x: 0 });

      DRAW("#no-rl", at(2, 0.44), 0.4);
      IN("#no-twice", at(2, 0.5), 0.5, { x: -12 }, { x: 0 });
      IN("#no-eqs", at(2, 0.72), 0.5);
      // L3 联立解 k、d
      IN("#no-d1", at(3, 0.08), 0.6, { x: 20 }, { x: 0 });
      IN("#no-d2", at(3, 0.46), 0.6, { x: 20 }, { x: 0 });
      IN("#no-dglow", at(3, 0.62), 0.3, { scale: 0.4, svgOrigin: "1013 566" }, { scale: 1, svgOrigin: "1013 566" });
      tl.to("#no-dd", { fill: "#ff8a80", duration: 0.25, yoyo: true, repeat: 3 }, at(3, 0.62));
      IN("#no-any", at(3, 0.8), 0.5, { y: 12 }, { y: 0 });
      // L4 k 还必须不可预测
      IN("#no-pd", at(4, 0.04), 0.5, { scale: 0.5, svgOrigin: "1040 790" }, { scale: 1, svgOrigin: "1040 790" });

      IN("#no-pt1", at(4, 0.14), 0.5, { x: -12 }, { x: 0 });
      IN("#no-pt2", at(4, 0.55), 0.5, { y: 12 }, { y: 0 });
      tl.to("#no-dd", { fill: "#ff8a80", duration: 0.25, yoyo: true, repeat: 3 }, at(4, 0.8));
      // L5 公开可得
      OUT("#no-pred", at(5, 0), 0.3);
      OUT("#no-eqs", at(5, 0), 0.3);
      IN("#no-chain", at(5, 0.05), 0.5, { y: 20 }, { y: 0 });

      ARROW("#no-u1", at(5, 0.38), 0.5);
      ARROW("#no-u2", at(5, 0.45), 0.5);
      IN("#no-pub", at(5, 0.6), 0.5);
      // L6 PS3
      OUT("#no-p1, #no-p2", at(6, 0), 0.5);
      IN("#no-ps", at(6, 0.08), 0.6, { scale: 0.9, svgOrigin: "450 515" }, { scale: 1, svgOrigin: "450 515" });
      IN("#no-psl", at(6, 0.2), 0.5);
      IN("#no-key", at(6, 0.38), 0.5, { x: -60 }, { x: 0 });
      IN("#no-fwl", at(6, 0.42), 0.5);
      IN("#no-same", at(6, 0.55), 0.5);
      tl.to("#no-key", { x: 40, y: -40, duration: 0.6, ease: "back.out(2)" }, at(6, 0.78));
      tl.to("#no-keyc, #no-keys", { stroke: "#FC6255", duration: 0.3 }, at(6, 0.8));
      tl.to("#no-fwl", { fill: "#FC6255", duration: 0.3 }, at(6, 0.8));
      // L7 安卓
      IN("#no-ph", at(7, 0.05), 0.6, { y: 30 }, { y: 0 });
      IN("#no-anl", at(7, 0.15), 0.5);
      IN("#no-k1", at(7, 0.35), 0.4, { scale: 0.5, svgOrigin: "1610 390" }, { scale: 1, svgOrigin: "1610 390" });

      IN("#no-samek", at(7, 0.52), 0.4);

        tl.to(`#no-co${i}`, { opacity: 0, duration: 0.3 }, t + 0.8);

      IN("#no-term2", at(8, 0.03), 0.5);
