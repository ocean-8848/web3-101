    (function () {
      const C = /*CUES*/{}/*END*/;

      const tl = gsap.timeline({ paused: true });

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
const H = n => { let x = Math.imul((n + 0x2f1) ^ 0x5bd1e995, 2654435761) >>> 0; x = Math.imul(x ^ (x >>> 15), 2246822519) >>> 0; x = (x ^ (x >>> 13)) >>> 0; return x.toString(16).padStart(8, "0"); };
const p6 = n => String(n).padStart(6, "0");
const fmt = v => Math.round(v).toLocaleString("en-US");
const SA = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const salt = n => { let x = (Math.imul(n, 1103515245) + 12345) >>> 0, s = ""; for (let k = 0; k < 4; k++) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; s += SA[(x >>> 16) % SA.length]; } return s; };
const rows = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => document.querySelector("#on-r" + i));
const setRows = v => rows.forEach((el, i) => { const n = Math.min(999999, Math.floor(v) + i); el.textContent = p6(n) + "  →  " + H(n) + "…"; });

document.querySelector("#on-fpt").textContent = H(482915) + "…";
const rows5 = [0, 1, 2, 3, 4, 5, 6].map(i => document.querySelector("#on-q" + i));
const setRows5 = v => rows5.forEach((el, i) => { const n = (Math.floor(v) + i) % 1000000; el.textContent = p6(n) + "·" + salt(Math.floor(v) + i) + "…  →  " + H(n * 7 + 3) + "…"; });
setRows5(0);
const SCROLL = (fn, a, b, t, d, ease = "power2.inOut") => { const o = { v: a }; tl.fromTo(o, { v: a }, { v: b, duration: d, ease, immediateRender: false, onUpdate: () => fn(o.v) }, t); };

// L0 方向：正向快、反向被墙挡住

tl.fromTo("#on-dot", { attr: { cx: 480 } }, { attr: { cx: 1430 }, duration: 0.35, ease: "none", repeat: 3, repeatDelay: 0.25, immediateRender: false }, at(0, 0.2));
OUT("#on-dot", at(0, 0.2) + 2.4, 0.2);
ARROW("#on-bw", at(0, 0.58), 0.9);
IN("#on-wall", at(0, 0.66), 0.25, { scaleY: 0.2, svgOrigin: "961 494" }, { scaleY: 1, svgOrigin: "961 494" });

tl.to("#on-wall", { x: 6, duration: 0.06, yoyo: true, repeat: 3 }, at(0, 0.78));
// L1 加密 vs 哈希
OUT("#on-p0", at(1, 0), 0.4);
IN("#on-enc", at(1, 0.06), 0.6, { y: 20 }, { y: 0 });
ARROW("#on-ea", at(1, 0.16), 0.5);
IN("#on-hsh", at(1, 0.42), 0.6, { y: 20 }, { y: 0 });
ARROW("#on-ha1", at(1, 0.52), 0.5);
IN("#on-nokey", at(1, 0.62), 0.4);
IN("#on-hl1", at(1, 0.74), 0.5);
// L2 前提
OUT("#on-p1", at(2, 0), 0.4);
IN("#on-pre", at(2, 0.12), 0.6, { scale: 0.9, svgOrigin: "960 230" }, { scale: 1, svgOrigin: "960 230" });
// L3 6 位数字密码：查表
IN("#on-tp, #on-th", at(3, 0.02), 0.5);

IN("#on-cn, #on-cnl", at(3, 0.1), 0.4);

IN("#on-fp, #on-fpt", at(3, 0.5), 0.5, { x: 20 }, { x: 0 });

SCROLL(setRows, 999991, 482911, at(3, 0.66), 1.4, "power3.out");

IN("#on-fd", at(3, 0.66) + 1.6, 0.4);
// L4 只有是/否
OUT("#on-rows, #on-hl, #on-fd, #on-cn, #on-cnl, #on-fpt, #on-ha", at(4, 0), 0.35);
tl.to("#on-tp", { attr: { height: 230 }, duration: 0.5, ease: "power2.inOut" }, at(4, 0.08));
