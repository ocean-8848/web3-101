            <text class="mono" x="1205.9" y="369.1" font-size="30" fill="#6b6f7a" text-anchor="middle">1</text>

            <text class="mono" x="1049.1" y="525.9" font-size="30" fill="#6b6f7a" text-anchor="middle">b</text>
            <text class="mono" x="1040.0" y="480.0" font-size="30" fill="#6b6f7a" text-anchor="middle">c</text>
            <text class="mono" x="1049.1" y="434.1" font-size="30" fill="#6b6f7a" text-anchor="middle">d</text>

            <text id="mi-a4" class="h" x="1000" y="516" font-size="36" fill="#FF9F43">N = 4</text>

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
const HX = "0123456789abcdef";
const hx = (n, k) => { let x = (Math.imul(n + 7919 * k, 2654435761) ^ 0x9e3779b9) >>> 0, s = ""; for (let j = 0; j < 13; j++) { x = (Math.imul(x, 1664525) + 1013904223) >>> 0; s += HX[(x >>> 24) & 15]; } return s; };
const hEl = document.querySelector("#mi-h"), nEl = document.querySelector("#mi-nc");
const setH = (n, z) => {
  let s = hx(n, 1);
  if (z === 0 && s[0] === "0") s = "a" + s.slice(1);
  const head = s.slice(0, 8), tail = s.slice(8);
  if (z > 0) hEl.innerHTML = '<tspan fill="#83C167" font-weight="700">' + "0".repeat(z) + "</tspan>" + head.slice(z) + "…" + tail;
  else hEl.textContent = head + "…" + tail;
};
setH(0, 0);
const RUN = (a, b, t, d, z, ease = "power1.in") => {
  const o = { v: a };
  tl.fromTo(o, { v: a }, { v: b, duration: d, ease, immediateRender: false, onUpdate: function () {
    const n = Math.round(o.v); nEl.textContent = n.toLocaleString("en-US");
    setH(n, this.progress() >= 1 ? z : 0);
  } }, t);
  if (z > 0) {
    tl.to("#mi-ob", { stroke: "#83C167", duration: 0.2 }, t + d);
    tl.to("#mi-ob", { stroke: "#58C4DD", duration: 0.3 }, t + d + 1.2);
  }
};
// L0 挖矿机
IN("#mi-t1", at(0, 0.02), 0.5);
IN("#mi-box", at(0, 0.08), 0.6, { y: 16 }, { y: 0 });
IN("#mi-nc", at(0, 0.3), 0.4);
ARROW("#mi-ar", at(0, 0.4), 0.4);
IN("#mi-ob, #mi-h", at(0, 0.5), 0.5);
// L1 nonce 跳动 + 目标
IN("#mi-tg", at(1, 0.1), 0.5, { x: 16 }, { x: 0 });
IN("#mi-cap", at(1, 0.2), 0.5);
RUN(0, 37, at(1, 0.22), 4.0, 1, "none");
// L2 一个字符位：1/16
IN("#mi-ring", at(2, 0.02), 0.6, { scale: 0.85, svgOrigin: "1160 470" }, { scale: 1, svgOrigin: "1160 470" });
IN("#mi-rhl", at(2, 0.12), 0.3);
tl.fromTo("#mi-rhl", { rotation: 0, svgOrigin: "1160 470" }, { rotation: 720, svgOrigin: "1160 470", duration: 3.0, ease: "power2.inOut", immediateRender: false }, at(2, 0.14));
tl.to("#mi-rhl", { attr: { r: 30 }, duration: 0.2, yoyo: true, repeat: 1 }, at(2, 0.14) + 3.0);
IN("#mi-p1", at(2, 0.5), 0.5);
IN("#mi-p2", at(2, 0.74), 0.5);
// L3 3 个 0、4 个 0
OUT("#mi-ring, #mi-rhl, #mi-p1, #mi-p2", at(3, 0), 0.4);
IN("#mi-a1, #mi-b1t", at(3, 0.06), 0.4);
IN("#mi-a3", at(3, 0.14), 0.4);
IN("#mi-b3t", at(3, 0.24), 0.5, { x: -16 }, { x: 0 });
RUN(0, 3871, at(3, 0.06), 3.0, 3);
IN("#mi-a4", at(3, 0.6), 0.4);
IN("#mi-b4t", at(3, 0.7), 0.5, { x: -16 }, { x: 0 });
RUN(0, 70214, at(3, 0.6), 2.6, 4);
// L4 每秒 100 万次，6 个 0
IN("#mi-ex", at(4, 0.08), 0.5);
IN("#mi-a6", at(4, 0.4), 0.4);
RUN(0, 16203511, at(4, 0.42), 3.6, 6);
IN("#mi-b6t", at(4, 0.62), 0.6, { x: -16 }, { x: 0 });
// L5 10 个 0 + 指数柱
IN("#mi-a10", at(5, 0.04), 0.4);
IN("#mi-b10t", at(5, 0.12), 0.5, { x: -16 }, { x: 0 });
IN("#mi-c10t", at(5, 0.36), 0.5, { x: -16 }, { x: 0 });
RUN(0, 9999999, at(5, 0.04), 9.0, 0, "none");
IN("#mi-base, #mi-cx", at(5, 0.6), 0.4);
for (let i = 1; i <= 10; i++) IN("#mi-b" + i, at(5, 0.62) + (i - 1) * 0.12, 0.35, { scaleY: 0, svgOrigin: `${198 + (i - 1) * 60} 1000` }, { scaleY: 1, svgOrigin: `${198 + (i - 1) * 60} 1000` });
IN("#mi-cl", at(5, 0.7), 0.5);
// L6 工作量证明
OUT("#mi-t1", at(6, 0), 0.3);
IN("#mi-t2", at(6, 0.08), 0.5);
IN("#mi-nsc", at(6, 0.4), 0.5);
RUN(9999999, 30000000, at(6, 0.05), 4.6, 0, "none");
// L7 全网算力
OUT("#mi-rows", at(7, 0), 0.4);
IN("#mi-n1", at(7, 0.06), 0.5);
IN("#mi-n2", at(7, 0.42), 0.5);
IN("#mi-ll", at(7, 0.12), 0.4);
IN("#mi-lb", at(7, 0.14), 0.5, { scaleX: 0, svgOrigin: "1000 610" }, { scaleX: 1, svgOrigin: "1000 610" });
IN("#mi-gl", at(7, 0.62), 0.4);
IN("#mi-gb", at(7, 0.64), 1.4, { scaleX: 0, svgOrigin: "1000 768" }, { scaleX: 1, svgOrigin: "1000 768", ease: "power2.inOut" });
IN("#mi-lg", at(7, 0.74), 0.4);
tl.to("#mi-lb", { opacity: 0.45, duration: 0.5 }, at(7, 0.8));

      /*ENDANIM*/

      tl.to("#mi-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["mining"] = tl;
    })();
  </script>
