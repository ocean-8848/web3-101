};

[0, 1, 2, 3].forEach(i => { IN(`#pi-a${i}`, at(3, 0.04) + i * 0.1, 0.4); IN(`#pi-ix${i}`, at(3, 0.04) + i * 0.1, 0.4); });

OUT("#pi-short", at(3, 0.5), 0.3);
