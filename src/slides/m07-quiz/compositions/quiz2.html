      IN("#q2-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q2-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#q2-pause", at(3, 0.0), 0.3);
      const RIGHT = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);

        tl.to(`#q2-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
