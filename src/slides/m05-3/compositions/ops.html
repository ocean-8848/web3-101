        <text x="100" y="160" font-size="28" fill="#e8e6df">记录签过的消息，防止签出矛盾</text>
      </g>
      <g id="op-term2" class="h">
        <rect x="70" y="56" width="600" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">分布式验证者 <tspan font-size="28" font-weight="400" fill="#8a8f99">DVT</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">一把密钥拆给多人共同签名</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 back to hook: no double signing
      IN("#op-s0", at(0, 0.02), 0.6);
      DRAW("#op-x1", at(0, 0.5), 0.3); DRAW("#op-x2", at(0, 0.58), 0.3);
      // L1 clients + hardware
      OUT("#op-s0, #op-x1, #op-x2", at(1, 0), 0.4);
      IN("#op-s1", at(1, 0.03), 0.4);
      for (let i = 0; i < 3; i++) IN(`#op-m${i}`, at(1, 0.06 + i * 0.07), 0.4, { x: -15 }, { x: 0 });
      IN("#op-pie", at(1, 0.3), 0.5, { scale: 0.8, svgOrigin: "1060 470" }, { scale: 1, svgOrigin: "1060 470" });
      tl.to("#op-pc", { fill: "#83C167", duration: 0.4 }, at(1, 0.42));
      IN("#op-min", at(1, 0.44), 0.4);
      IN("#op-hw", at(1, 0.6), 0.5, { x: 20 }, { x: 0 });
      // L2 keys hot/cold
      OUT("#op-s1", at(2, 0), 0.4);
      IN("#op-k1", at(2, 0.05), 0.5);
      IN("#op-k2", at(2, 0.3), 0.5);
      IN("#op-k3", at(2, 0.6), 0.5);
      IN("#op-pp", at(2, 0.62), 0.3);
      tl.to("#op-pp", { y: 250, duration: 0.8, ease: "power2.in" }, at(2, 0.7));
      tl.to("#op-pp", { opacity: 0, duration: 0.2 }, at(2, 0.7) + 0.8);
      // L3 single instance + doppelganger
      OUT("#op-k1, #op-k2, #op-k3", at(3, 0), 0.4);
      IN("#op-s3", at(3, 0.04), 0.5);
      tl.to("#op-w1, #op-w2", { stroke: "#FF9F43", duration: 0.3, yoyo: true, repeat: 5 }, at(3, 0.35));
      COUNT("#op-ep", 0, 3, at(3, 0.35), 3.0, v => "epoch " + Math.floor(v + 0.001));
      IN("#op-nc", at(3, 0.75), 0.4);
      tl.to("#op-dl", { fill: "#83C167", stroke: "#83C167", duration: 0.3 }, at(3, 0.85));
      IN("#op-go", at(3, 0.87), 0.4);
      // L4 migration flow + DB term
      OUT("#op-s3", at(4, 0), 0.4);
      for (let i = 0; i < 5; i++) {
        const t = at(4, 0.04 + i * 0.17);
        IN(`#op-f${i}`, t, 0.4, { y: 15 }, { y: 0 });
        tl.to(`#op-fb${i}`, { stroke: "#83C167", duration: 0.3 }, t + 0.5);
        if (i < 4) ARROW(`#op-fa${i}`, t + 0.6, 0.3);
      }
      IN("#op-db", at(4, 0.2), 0.4);
      IN("#op-term", at(4, 0.24), 0.5);
      IN("#op-eip", at(4, 0.28), 0.4);
      tl.to("#op-db", { x: 360, duration: 0.8, ease: "power2.inOut" }, at(4, 0.38));
      // L5 remote signer + DVT
      OUT("#op-s4", at(5, 0), 0.4);
      OUT("#op-term", at(5, 0), 0.4);
      IN("#op-ws", at(5, 0.05), 0.5);
      ARROW("#op-req", at(5, 0.18), 0.4); IN("#op-reqt", at(5, 0.2), 0.3);
      IN("#op-term2", at(5, 0.36), 0.5);
      IN("#op-dk", at(5, 0.42), 0.4);
      for (let i = 0; i < 4; i++) { DRAW(`#op-dv${i}`, at(5, 0.5), 0.5); tl.set(`#op-dv${i}`, { opacity: 1 }, at(5, 0.5)); IN(`#op-o${i}`, at(5, 0.55) + i * 0.1, 0.3); }
      tl.to("#op-ob3", { stroke: "#6b6f7a", duration: 0.3 }, at(5, 0.75));
      tl.to("#op-ot3", { fill: "#6b6f7a", duration: 0.3 }, at(5, 0.75));
      tl.to("#op-dv3", { opacity: 0.2, duration: 0.3 }, at(5, 0.75));
      IN("#op-off", at(5, 0.76), 0.3);
      IN("#op-thr", at(5, 0.82), 0.4);
      IN("#op-obol", at(5, 0.88), 0.4);
      // L6 pseudo code
      OUT("#op-s5", at(6, 0), 0.4);
      OUT("#op-term2", at(6, 0), 0.4);
      IN("#op-s6", at(6, 0.04), 0.5);
      tl.to("#op-hl", { opacity: 1, duration: 0.3 }, at(6, 0.12));
      IN("#op-n1", at(6, 0.15), 0.4);
      tl.to("#op-hl", { attr: { y: 441 }, duration: 0.4 }, at(6, 0.4));
      IN("#op-n2", at(6, 0.42), 0.4);
      tl.to("#op-hl", { attr: { y: 494 }, duration: 0.4 }, at(6, 0.66));
      IN("#op-n3", at(6, 0.68), 0.4);
      tl.to("#op-hl", { attr: { y: 547 }, duration: 0.4 }, at(6, 0.86));
      IN("#op-n4", at(6, 0.88), 0.4);
      // L7 monitoring
      OUT("#op-s6", at(7, 0), 0.4);
      IN("#op-s7", at(7, 0.04), 0.3);
      for (let i = 0; i < 6; i++) IN(`#op-t${i}`, at(7, 0.06 + i * 0.04), 0.3);
      IN("#op-al", at(7, 0.45), 0.4);
      tl.to("#op-tb2", { stroke: "#FC6255", duration: 0.3 }, at(7, 0.5));
      tl.to("#op-alc", { opacity: 0.2, duration: 0.25, yoyo: true, repeat: 5 }, at(7, 0.55));


      tl.to("#op-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#op-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      tl.to("#op-term2", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["ops"] = tl;
    })();
  </script>
</template>
