      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 table + partial withdrawals
      IN("#ex-frame", at(0, 0.02), 0.6);
      DRAW("#ex-d1", at(0, 0.05), 0.6); DRAW("#ex-d2", at(0, 0.08), 0.6);
      IN("#ex-h1", at(0, 0.15), 0.5); IN("#ex-auto", at(0, 0.3), 0.4);
      IN("#ex-t1", at(0, 0.38), 0.5, { x: -20 }, { x: 0 });
      for (let i = 0; i < 3; i++) tl.fromTo(`#ex-ca${i}`, { opacity: 0, attr: { cx: 935 } }, { keyframes: [{ opacity: 1, duration: 0.15 }, { attr: { cx: 1050 }, opacity: 0, duration: 0.9, ease: "power1.in" }] }, at(0, 0.5) + i * 0.35);
      IN("#ex-t2", at(0, 0.68), 0.5, { x: -20 }, { x: 0 });
      for (let i = 0; i < 3; i++) tl.fromTo(`#ex-cb${i}`, { opacity: 0, attr: { cx: 978 } }, { keyframes: [{ opacity: 1, duration: 0.15 }, { attr: { cx: 1070 }, opacity: 0, duration: 0.9, ease: "power1.in" }] }, at(0, 0.8) + i * 0.35);
      // L1 sweep
      IN("#ex-scan", at(1, 0.02), 0.5);
      tl.fromTo("#ex-ptr", { rotation: 0 }, { rotation: 720, svgOrigin: "1200 370", duration: L[1][1] - at(1, 0.1), ease: "none", immediateRender: false }, at(1, 0.1));
      for (let k = 0; k < 12; k++) tl.to(`#ex-v${k}`, { keyframes: [{ fill: "#F0B90B", attr: { r: 11 }, duration: 0.12 }, { fill: "#58C4DD", attr: { r: 8 }, duration: 0.25 }] }, at(1, 0.1) + k * (L[1][1] - at(1, 0.1)) / 24);
      IN("#ex-s1", at(1, 0.35), 0.5);
      IN("#ex-s2", at(1, 0.72), 0.5);
      // L2 full withdrawal

      IN("#ex-ra", at(2, 0.1), 0.5, { x: -20 }, { x: 0 });
      IN("#ex-rb", at(2, 0.35), 0.5, { x: -20 }, { x: 0 });
      ARROW("#ex-a1", at(2, 0.5), 0.4); ARROW("#ex-a2", at(2, 0.52), 0.4);
      IN("#ex-q", at(2, 0.56), 0.4);
      ARROW("#ex-a3", at(2, 0.66), 0.3);
      IN("#ex-hg", at(2, 0.7), 0.4);
      tl.to("#ex-hgb", { fill: "#FF9F43", duration: 1.2 }, at(2, 0.72));
      ARROW("#ex-a4", at(2, 0.86), 0.3);

      // L3 slashed

      IN("#ex-r3a", at(3, 0.1), 0.4, { x: -20 }, { x: 0 });
      ARROW("#ex-a5", at(3, 0.25), 0.3);
      IN("#ex-cal", at(3, 0.3), 0.4);
      COUNT("#ex-calt", 1, 36, at(3, 0.35), 1.6);
      ARROW("#ex-a6", at(3, 0.72), 0.3);
