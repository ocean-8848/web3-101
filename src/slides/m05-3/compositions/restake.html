  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 three roles
      IN("#res-term", at(0, 0.05), 0.5);
      IN("#res-rs", at(0, 0.6), 0.5, { y: 15 }, { y: 0 });
      IN("#res-op", at(0, 0.7), 0.5, { y: 15 }, { y: 0 });
      IN("#res-av", at(0, 0.8), 0.5, { y: 15 }, { y: 0 });
      // L1 deposit into vault + delegate power only
      IN("#res-vault", at(1, 0.03), 0.5);
      IN("#res-coin", at(1, 0.08), 0.3);
      IN("#res-cl", at(1, 0.1), 0.4);
      tl.to("#res-coin", { y: 200, duration: 0.9, ease: "power2.in" }, at(1, 0.22));
      OUT("#res-cl", at(1, 0.4), 0.3);
      OUT("#res-term", at(1, 0.45), 0.4);
      DRAW("#res-dl", at(1, 0.5), 0.6);
      tl.set("#res-dl", { opacity: 0 }, at(1, 0.5) + 0.62); tl.set("#res-dl2", { opacity: 1 }, at(1, 0.5) + 0.62);
      IN("#res-dlt", at(1, 0.55), 0.5);
      IN("#res-flag", at(1, 0.66), 0.3);
      tl.to("#res-flag", { x: 430, duration: 1.4, ease: "power2.inOut" }, at(1, 0.7));
      // L2 operator opts into AVSs
      ARROW("#res-oa", at(2, 0.25), 0.6);
      ARROW("#res-ob", at(2, 0.3), 0.6);
      IN("#res-oin", at(2, 0.35), 0.4);
      IN("#res-avs1", at(2, 0.5), 0.5);
      IN("#res-avs2", at(2, 0.65), 0.5);
      // L3 slashing propagates
      IN("#res-rule", at(3, 0.05), 0.4);
      tl.to("#res-sha", { stroke: "#FC6255", duration: 0.2, yoyo: true, repeat: 3 }, at(3, 0.25));
      ARROW("#res-z1", at(3, 0.35), 0.4);
      tl.to("#res-opp", { fill: "#FC6255", duration: 0.25 }, at(3, 0.42));
      ARROW("#res-z2", at(3, 0.5), 0.4);
      tl.to("#res-vb", { stroke: "#FC6255", duration: 0.25 }, at(3, 0.58));
      OUT("#res-avs1, #res-avs2", at(3, 0.65), 0.3);
      IN("#res-bad", at(3, 0.72), 0.4);
      tl.to("#res-sha, #res-shb", { stroke: "#FC6255", duration: 0.3 }, at(3, 0.75));
      // L4 withdrawal delay
      OUT("#res-roles", at(4, 0), 0.4);
      IN("#res-wd", at(4, 0.05), 0.4);
      ARROW("#res-w1", at(4, 0.12), 0.3); IN("#res-wq", at(4, 0.15), 0.4);
      ARROW("#res-w2", at(4, 0.24), 0.3); IN("#res-wh", at(4, 0.27), 0.4);
      tl.to("#res-whb", { fill: "#FF9F43", duration: 1.5 }, at(4, 0.3));
      ARROW("#res-w3", at(4, 0.42), 0.3); IN("#res-wg", at(4, 0.45), 0.4);
      IN("#res-why", at(4, 0.5), 0.4);
      IN("#res-doc", at(4, 0.7), 0.4);
      // L5 stacked risk tower
      OUT("#res-wd, #res-w1, #res-wq, #res-w2, #res-wh, #res-w3, #res-wg, #res-why, #res-doc", at(5, 0), 0.4);
      for (let i = 0; i < 4; i++) IN(`#res-ly${i}`, at(5, 0.06 + i * 0.06), 0.4, { y: -30 }, { y: 0 });
      IN("#res-stk", at(5, 0.35), 0.5);
      tl.to("#res-tw", { x: 8, duration: 0.08, yoyo: true, repeat: 7, ease: "sine.inOut" }, at(5, 0.5));
      IN("#res-cyc", at(5, 0.55), 0.4);
      ARROW("#res-c1", at(5, 0.62), 0.4); ARROW("#res-c2", at(5, 0.68), 0.4); ARROW("#res-c3", at(5, 0.74), 0.4);
      IN("#res-pan", at(5, 0.8), 0.4);
      // L6 not free
      OUT("#res-tw, #res-stk, #res-cyc, #res-c1, #res-c2, #res-c3, #res-pan", at(6, 0), 0.3);
      IN("#res-free", at(6, 0.1), 0.4);
      DRAW("#res-fx", at(6, 0.45), 0.4);


      tl.to("#res-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#res-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["restake"] = tl;
    })();
