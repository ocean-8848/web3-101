  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 ledger records shares
      IN("#ls-term", at(0, 0.05), 0.5);
      IN("#ls-led", at(0, 0.3), 0.6, { scale: 0.95, svgOrigin: "1060 465" }, { scale: 1, svgOrigin: "1060 465" });
      DRAW("#ls-lx", at(0, 0.55), 0.4);
      IN("#ls-lsh, #ls-lsv", at(0, 0.75), 0.5, { x: 20 }, { x: 0 });
      IN("#ls-lcap", at(0, 0.82), 0.5);
      // L1 formula + rebase
      OUT("#ls-led, #ls-lcap", at(1, 0), 0.4);
      OUT("#ls-term", at(1, 0), 0.4);
      IN("#ls-f", at(1, 0.04), 0.6, { y: 10 }, { y: 0 });
      IN("#ls-or", at(1, 0.3), 0.5);
      ARROW("#ls-oa", at(1, 0.36), 0.5);
      IN("#ls-oat", at(1, 0.4), 0.4);
      IN("#ls-pool", at(1, 0.45), 0.5);
      IN("#ls-b0, #ls-b1, #ls-b2", at(1, 0.5), 0.4);
      tl.to("#ls-pv", { scale: 1.4, svgOrigin: "860 650", duration: 0.3, yoyo: true, repeat: 1 }, at(1, 0.6));
      IN("#ls-rb", at(1, 0.62), 0.4);
      tl.to("#ls-b0", { attr: { width: 440 }, duration: 0.6 }, at(1, 0.64));
      tl.to("#ls-b1", { attr: { width: 330 }, duration: 0.6 }, at(1, 0.64));
      tl.to("#ls-b2", { attr: { width: 220 }, duration: 0.6 }, at(1, 0.64));
      tl.to("#ls-poolb", { stroke: "#FC6255", duration: 0.2 }, at(1, 0.84));
      IN("#ls-slash", at(1, 0.84), 0.3);
      tl.to("#ls-b0", { attr: { width: 425 }, duration: 0.5 }, at(1, 0.88));
      tl.to("#ls-b1", { attr: { width: 318 }, duration: 0.5 }, at(1, 0.88));
      tl.to("#ls-b2", { attr: { width: 212 }, duration: 0.5 }, at(1, 0.88));
      // L2 calc
      OUT("#ls-p1", at(2, 0), 0.4);
      IN("#ls-calc", at(2, 0.04), 0.5);
      IN("#ls-c1", at(2, 0.12), 0.5, { x: 20 }, { x: 0 });
      IN("#ls-c2", at(2, 0.4), 0.5, { x: 20 }, { x: 0 });
      IN("#ls-c3", at(2, 0.66), 0.5, { x: 20 }, { x: 0 });
      COUNT("#ls-c3v", 1000000, 1000100, at(2, 0.75), 1.4, v => Math.round(v).toLocaleString("en-US"));
      // L3 result
      IN("#ls-c4", at(3, 0.02), 0.5, { x: 20 }, { x: 0 });
      IN("#ls-c5", at(3, 0.3), 0.5);
      IN("#ls-c6", at(3, 0.6), 0.4, { scale: 0.6, svgOrigin: "1050 806" }, { scale: 1, svgOrigin: "1050 806" });
      tl.to("#ls-c6", { opacity: 0.4, duration: 0.25, yoyo: true, repeat: 3 }, at(3, 0.75));
      // L4 stETH vs wstETH
      OUT("#ls-calc", at(4, 0), 0.4);
      IN("#ls-cmp", at(4, 0.05), 0.5);
      COUNT("#ls-sq", 100, 100.01, at(4, 0.2), 1.2, v => (Math.round(v * 100) / 100).toFixed(v > 100.004 ? 2 : 0));
      COUNT("#ls-wp", 1, 1.0001, at(4, 0.5), 1.2, v => v > 1.00004 ? "1.0001" : "1");
      IN("#ls-big", at(4, 0.85), 0.5, { y: 15 }, { y: 0 });
      // L5 code
      OUT("#ls-cmp, #ls-big", at(5, 0), 0.4);
      IN("#ls-code", at(5, 0.05), 0.5);
      tl.to("#ls-hl", { opacity: 1, duration: 0.4 }, at(5, 0.5));
      IN("#ls-cn", at(5, 0.6), 0.5);
      // L6 rate != market price
      OUT("#ls-code, #ls-cn", at(6, 0), 0.4);
      IN("#ls-tags", at(6, 0.04), 0.5);
      tl.to("#ls-mk", { strokeWidth: 6, duration: 0.25, yoyo: true, repeat: 3 }, at(6, 0.2));
      IN("#ls-orc", at(6, 0.35), 0.5);
      IN("#ls-q", at(6, 0.62), 0.6, { y: 15 }, { y: 0 });


      tl.to("#ls-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ls-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["lst"] = tl;
    })();
  </script>
