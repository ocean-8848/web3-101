    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      (function () {
        let d = "M260 840";
        for (let k = 0; k <= 40; k++) { const u = k / 40, s = 55 + 25 * Math.pow(u, 1.6); d += ` L${(260 + 1200 * u).toFixed(1)} ${(840 - 5.4 * s).toFixed(1)}`; }
        document.querySelector("#le-ga").setAttribute("d", d + " L1460 840 Z");
      })();
      // L0 lights
      IN("#le-fl", at(0, 0.05), 0.5);
      for (let i = 1; i <= 5; i++) IN(`#le-l${i}`, at(0, 0.08 + i * 0.07), 0.4);
      IN("#le-term", at(0, 0.5), 0.5);
      tl.to("#le-lc5", { fill: "#FF9F43", stroke: "#FF9F43", duration: 0.3 }, at(0, 0.62));
      IN("#le-st1", at(0, 0.68), 0.5);
      // L1 inactivity score & quadratic curve
      IN("#le-off", at(1, 0.03), 0.5, { x: -20 }, { x: 0 });
      IN("#le-ch", at(1, 0.12), 0.5);
      COUNT("#le-cnt", 0, 12, at(1, 0.2), 5.5, v => String(Math.round(v)));
      DRAW("#le-cv", at(1, 0.25), 5);
      IN("#le-fm", at(1, 0.55), 0.5);
      OUT("#le-term", at(1, 0.75), 0.4);
      // L2 online not rewarded, offline stake shrinks, recovery
      IN("#le-on", at(2, 0.02), 0.5, { x: -20 }, { x: 0 });
      tl.fromTo("#le-on0", { fill: "#e8e6df" }, { fill: "#8a8f99", duration: 0.8, immediateRender: false }, at(2, 0.12));
      IN("#le-stk", at(2, 0.3), 0.4);
      tl.to("#le-bar", { attr: { width: 300 }, duration: 3, ease: "power1.in" }, at(2, 0.35));
      OUT("#le-st1", at(2, 0.72), 0.3);
      tl.to("#le-lc5", { fill: "#83C167", stroke: "#83C167", duration: 0.3 }, at(2, 0.76));
      IN("#le-st2", at(2, 0.78), 0.5);
      // L3 demo 45/55
      OUT("#le-p1", at(3, 0), 0.5);
      IN("#le-d1", at(3, 0.05), 0.5);
      const r0 = at(3, 0.12), r1 = at(3, 0.9);
      tl.fromTo("#le-c1r", { attr: { width: 0 } }, { attr: { width: 1200 }, duration: r1 - r0, ease: "none", immediateRender: false }, r0);
      const cross = r0 + 0.622 * (r1 - r0);
      tl.to("#le-d1l", { fill: "#83C167", stroke: "#83C167", duration: 0.3 }, cross);
      IN("#le-d1t", cross + 0.1, 0.4);
      // L4 34% malicious
      OUT("#le-d1", at(4, 0), 0.4);
      IN("#le-d2", at(4, 0.06), 0.4);
      tl.fromTo("#le-c2r", { attr: { width: 0 } }, { attr: { width: 1200 }, duration: 3, ease: "none", immediateRender: false }, at(4, 0.12));
      tl.to("#le-d2l", { stroke: "#FF9F43", duration: 0.3, yoyo: true, repeat: 3 }, at(4, 0.6));
      IN("#le-d2t", at(4, 0.62), 0.4);
      // L5 network split
      OUT("#le-d2", at(5, 0), 0.4);
      IN("#le-sp", at(5, 0.06), 0.6);
      IN("#le-spt0", at(5, 0.25), 0.4);
      ARROW("#le-xa", at(5, 0.55), 0.8);
      ARROW("#le-xb", at(5, 0.6), 0.8);
      IN("#le-spt1", at(5, 0.62), 0.4);
      tl.to("#le-sla, #le-slb", { fill: "#83C167", stroke: "#83C167", duration: 0.4 }, at(5, 0.86));
      IN("#le-spt2", at(5, 0.86), 0.4);
      // L6 two finalized chains + social layer
      OUT("#le-sp", at(6, 0), 0.4);
      IN("#le-cn", at(6, 0.06), 0.6);
      IN("#le-ttl", at(6, 0.55), 0.6, { y: 20 }, { y: 0 });
      COUNT("#le-onp", 55, 80, at(3, 0.12), at(3, 0.9) - at(3, 0.12), v => String(Math.round(v)));


      tl.to("#le-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#le-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["leak"] = tl;
    })();
