  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const HL = (p, a, b, t, by, lh = 38, fs = 28, lp = null, n = 0) => {
        tl.to(`#${p}-hl`, { opacity: 1, attr: { y: by + a * lh - fs * 0.33 - lh / 2, height: (b - a + 1) * lh }, duration: 0.35, ease: "power2.inOut" }, t);
        if (lp) for (let i = 0; i < n; i++) tl.to(`#${lp}${i}`, { opacity: (i >= a && i <= b) ? 1 : 0.6, duration: 0.3 }, t);
      };
      const UNHL = (p, t, lp = null, n = 0) => { tl.to(`#${p}-hl`, { opacity: 0, duration: 0.3 }, t); if (lp) for (let i = 0; i < n; i++) tl.to(`#${lp}${i}`, { opacity: 1, duration: 0.3 }, t); };
      const LIT = (P, i, t, on = true, d = 0.4) => { tl.to(`#${P}-pg${i}`, { opacity: on ? 1 : 0.35, duration: d }, t); tl.to(`#${P}-ps${i}`, { attr: { fill: on ? "#192931" : "#0f1117", "stroke-width": on ? 3 : 2.5 }, duration: d }, t); };

      // L0 Foundry machine reads invariants; code appears
      IN("#fu-m0", at(0, 0.0), 0.5, { y: -16 }, { y: 0 });
      IN("#fu-cp, #fu-lab", at(0, 0.05), 0.4);
      for (let i = 0; i < 12; i++) IN(`#fu-a${i}`, at(0, 0.08) + i * 0.08, 0.3, { x: -10 }, { x: 0 });
      HL("fu-cp", 0, 0, at(0, 0.3), 290, 38, 28, "fu-a", 12);
      IN("#fu-inv", at(0, 0.45), 0.5, { y: 20 }, { y: 0 });
      tl.to("#fu-inv", { x: -180, y: -200, scale: 0.4, svgOrigin: "1450 480", opacity: 0, duration: 0.9, ease: "power2.in" }, at(0, 0.72));
      tl.to("#fu-m0-b", { attr: { fill: "#1a2a17" }, duration: 0.2, yoyo: true, repeat: 1 }, at(0, 0.72) + 0.8);
      // L1 handler + bound + random calls
      HL("fu-cp", 1, 4, at(1, 0.02), 290, 38, 28, "fu-a", 12);
      for (let i = 0; i < 4; i++) tl.fromTo(`#fu-q${i}`, { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at(1, 0.12) + i * 0.4);
      IN("#fu-bd", at(1, 0.5), 0.4);
      IN("#fu-dot", at(1, 0.58), 0.3);
      tl.to("#fu-dot", { attr: { cx: 1650, cy: 560 }, duration: 0.7, ease: "back.out(1.4)" }, at(1, 0.66));
      tl.to("#fu-q2 rect", { attr: { stroke: "#F0B90B" }, duration: 0.3 }, at(1, 0.66));
      // L2 I1 balance, I3 ruler
      OUT("[id^='fu-q'], #fu-bd, #fu-dot", at(2, 0.0), 0.3);
      HL("fu-cp", 5, 7, at(2, 0.03), 290, 38, 28, "fu-a", 12);
      IN("#fu-i1", at(2, 0.06), 0.4);
      IN("#fu-sc", at(2, 0.08), 0.5);
      tl.to("#fu-beam", { rotation: -8, svgOrigin: "1500 430", duration: 0.9, ease: "back.out(1.6)" }, at(2, 0.18));
      IN("#fu-scl0", at(2, 0.18), 0.4); IN("#fu-scl1", at(2, 0.28), 0.4);
      HL("fu-cp", 9, 10, at(2, 0.58), 290, 38, 28, "fu-a", 12);
      IN("#fu-ru", at(2, 0.6), 0.5);
      IN("#fu-nd", at(2, 0.66), 0.3);
      [120, -60, 200, -150, 60].forEach((dx, k) => tl.to("#fu-nd", { x: dx, duration: 0.7, ease: "power1.inOut" }, at(2, 0.7) + k * 0.7));
      // L3 config, counterexample, shrink
      OUT("#fu-sc, #fu-scl0, #fu-scl1, #fu-i1, #fu-ru, #fu-nd", at(3, 0.0), 0.3);
      UNHL("fu-cp", at(3, 0.0), "fu-a", 12);
      IN("#fu-cfg", at(3, 0.06), 0.4, { y: 12 }, { y: 0 });
      for (let i = 0; i < 8; i++) IN(`#fu-s${i}`, at(3, 0.42) + i * 0.1, 0.25);
      for (let i = 1; i < 7; i++) OUT(`#fu-s${i}`, at(3, 0.72), 0.3);
      tl.to("#fu-s0", { x: 200, duration: 0.6, ease: "power2.inOut" }, at(3, 0.76));
      tl.to("#fu-s7", { x: -304, duration: 0.6, ease: "power2.inOut" }, at(3, 0.76));
      IN("#fu-min", at(3, 0.86), 0.4);
      // L4 Echidna / Medusa
      OUT("#fu-cfg, #fu-s0, #fu-s7, #fu-min", at(4, 0.0), 0.3);
      OUT("#fu-ga", at(4, 0.02), 0.3);
      for (let i = 0; i < 12; i++) IN(`#fu-b${i}`, at(4, 0.06) + i * 0.05, 0.3, { x: -10 }, { x: 0 });
      IN("#fu-m1", at(4, 0.08), 0.5, { y: -16 }, { y: 0 });
      IN("#fu-m2", at(4, 0.14), 0.5, { y: -16 }, { y: 0 });
      IN("#fu-tob", at(4, 0.22), 0.4);
      HL("fu-cp", 8, 8, at(4, 0.55), 290, 38, 28, "fu-b", 12);
      ARROW("#fu-br", at(4, 0.6), 0.4);
      for (let i = 0; i < 3; i++) IN(`#fu-lb${i}`, at(4, 0.64) + i * 0.08, 0.35, { x: -10 }, { x: 0 });
      // L5 Medusa
      OUT("#fu-tob", at(5, 0.0), 0.3);
      tl.to("#fu-m2-b", { attr: { fill: "#192931", stroke: "#58C4DD", "stroke-width": 4 }, duration: 0.4 }, at(5, 0.05));
      tl.to("#fu-m1-b", { attr: { "stroke-opacity": 0.5 }, duration: 0.4 }, at(5, 0.6));
      IN("#fu-ge", at(5, 0.12), 0.4);
      IN("#fu-fz", at(5, 0.4), 0.4);
      ARROW("#fu-ea", at(5, 0.6), 0.6);
      IN("#fu-eal", at(5, 0.66), 0.4);
      // L6 donate path
      OUT("[id^='fu-lb'], #fu-br", at(6, 0.0), 0.3);
      HL("fu-cp", 6, 7, at(6, 0.04), 290, 38, 28, "fu-b", 12);
      IN("#fu-p0", at(6, 0.18), 0.5, { x: -16 }, { x: 0 });
      IN("#fu-p1", at(6, 0.45), 0.5, { x: -16 }, { x: 0 });
      IN("#fu-p1l", at(6, 0.72), 0.4);
      // L7 sampling
      OUT("#fu-cp, #fu-lab, #fu-gb, #fu-m0, #fu-m1, #fu-m2, #fu-ge, #fu-fz, #fu-ea, #fu-eal, #fu-p0, #fu-p1, #fu-p1l", at(7, 0.0), 0.4);
      IN("#fu-fd", at(7, 0.06), 0.6);
      for (let k = 0; k < 30; k++) tl.fromTo(`#fu-lt${k}`, { opacity: 1, attr: { r: 0 } }, { opacity: 1, attr: { r: 9 }, duration: 0.25, ease: "back.out(2)" }, at(7, 0.12) + k * 0.05);
      IN("#fu-smp", at(7, 0.3), 0.4);
      IN("#fu-moon", at(7, 0.45), 0.5, { y: -16 }, { y: 0 });
      IN("#fu-night", at(7, 0.5), 0.4);
      IN("#fu-cc", at(7, 0.72), 0.5, { y: 12 }, { y: 0 });


      tl.to("#fu-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["fuzz"] = tl;
    })();
