          <g id="mo-pg3" opacity="0.35"><rect id="mo-ps3" x="990" y="970" width="230" height="60" rx="14" fill="#0f1117" stroke="#58C4DD" stroke-width="2.5" /><text id="mo-pt3" x="1105" y="1010" font-size="28" text-anchor="middle" fill="#e8e6df">④ 修复复审</text></g>
          <g id="mo-pg4" opacity="1"><rect id="mo-ps4" x="1280" y="970" width="230" height="60" rx="14" fill="#192931" stroke="#58C4DD" stroke-width="3" /><text id="mo-pt4" x="1395" y="1010" font-size="28" text-anchor="middle" fill="#e8e6df">⑤ 上线监控</text></g>
          <g id="mo-pg5" opacity="0.35"><rect id="mo-ps5" x="1570" y="970" width="230" height="60" rx="14" fill="#0f1117" stroke="#58C4DD" stroke-width="2.5" /><text id="mo-pt5" x="1685" y="1010" font-size="28" text-anchor="middle" fill="#e8e6df">⑥ 应急响应</text></g>
        </g>
      </g>

  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v), ease = "power2.out") => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease, immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const PG = { full: [720, 120, 790, 30, 860, 80], mini: [970, 60, 1010, 28, 998, 4] };
      const PIPE = (m, t, d = 0.9) => { const [y, h, ty, fs, by, bh] = PG[m], E = { duration: d, ease: "power2.inOut" };
        for (let i = 0; i < 6; i++) { tl.to(`#mo-ps${i}`, { attr: { y, height: h }, ...E }, t); tl.to(`#mo-pt${i}`, { attr: { y: ty, "font-size": fs }, ...E }, t); }
        tl.to("#mo-pbelt", { attr: { y: by, height: bh }, ...E }, t);
        tl.to("#mo-pbeltg", { opacity: m === "mini" ? 0 : 1, ...E }, t);
        tl.to("#mo-pcon", { opacity: m === "mini" ? 1 : 0, ...E }, t); };
      const LIT = (i, t, on = true, d = 0.4) => { tl.to(`#mo-pg${i}`, { opacity: on ? 1 : 0.35, duration: d }, t); tl.to(`#mo-ps${i}`, { attr: { fill: on ? "#192931" : "#0f1117", "stroke-width": on ? 3 : 2.5 }, duration: d }, t); };

      const HL = (i, t, c = "#58C4DD") => { tl.to(`#mo-rr${i}`, { attr: { stroke: c, "stroke-width": 3 }, duration: 0.3 }, t); };
      const UH = (i, t) => { tl.to(`#mo-rr${i}`, { attr: { stroke: "#3a3f4a", "stroke-width": 2 }, duration: 0.3 }, t); };
      // L0 radar tower and vault
      IN("#mo-tower", at(0, 0.0), 0.6, { y: 20 }, { y: 0 });
      IN("#mo-tl", at(0, 0.05), 0.5);
      IN("#mo-vault, #mo-vl", at(0, 0.18), 0.5);
      [0, 1, 2].forEach(k => tl.fromTo(`#mo-w${k}`, { opacity: 0 }, { opacity: 1, duration: 0.45, yoyo: true, repeat: 5, ease: "sine.inOut" }, at(0, 0.2) + k * 0.22));
      IN("#mo-q", at(0, 0.3), 0.6, { y: 20 }, { y: 0 });
      // L1 rule 1: outflow
      OUT("#mo-s0", at(1, 0.0), 0.4);
      IN("#mo-hdr", at(1, 0.04), 0.5);
      IN("#mo-r0", at(1, 0.06), 0.5, { x: -30 }, { x: 0 });
      HL(0, at(1, 0.1));
      tl.to("#mo-b0", { attr: { width: 150 }, duration: 2.4, ease: "power1.inOut" }, at(1, 0.35));
      // L2 rule 2: privileged functions
      UH(0, at(2, 0.0));
      IN("#mo-r1", at(2, 0.02), 0.5, { x: -30 }, { x: 0 }); HL(1, at(2, 0.05), "#B48EF0");
      [0, 1, 2].forEach(k => tl.to(`#mo-f${k}`, { attr: { fill: "#ffffff" }, duration: 0.25, yoyo: true, repeat: 1 }, at(2, 0.14 + k * 0.1)));
      tl.to("#mo-rr1", { attr: { stroke: "#e8e6df" }, duration: 0.2, yoyo: true, repeat: 3 }, at(2, 0.45));
      tl.to("#mo-gv", { attr: { fill: "#e8e6df" }, duration: 0.3, yoyo: true, repeat: 3 }, at(2, 0.62));
      // L3 rule 3: oracle deviation
      UH(1, at(3, 0.0));
      IN("#mo-r2", at(3, 0.02), 0.5, { x: -30 }, { x: 0 }); HL(2, at(3, 0.05), "#FF9F43");
      tl.to("#mo-pB", { y: 16, duration: 1.2, ease: "power2.inOut" }, at(3, 0.25));
      tl.to("#mo-rr2", { attr: { stroke: "#FC6255" }, duration: 0.2, yoyo: true, repeat: 3 }, at(3, 0.45));
      tl.to("#mo-pB", { opacity: 0.3, duration: 0.3, yoyo: true, repeat: 3 }, at(3, 0.62));
      tl.to("#mo-rr2", { attr: { stroke: "#FF9F43" }, duration: 0.3 }, at(3, 0.8));
      tl.to("#mo-rr2", { attr: { fill: "#2a2116" }, duration: 0.5, yoyo: true, repeat: 3 }, at(3, 0.42));
      tl.to("#mo-pB", { y: 26, duration: 0.8, ease: "power2.inOut" }, at(3, 0.66));
      // L4 rule 4 & 5
      UH(2, at(4, 0.0));
      IN("#mo-r3", at(4, 0.02), 0.5, { x: -30 }, { x: 0 }); HL(3, at(4, 0.05), "#FC6255");
      tl.set("#mo-needle", { rotation: 40, svgOrigin: "200 706" }, 0);
      tl.to("#mo-needle", { rotation: -70, svgOrigin: "200 706", duration: 1.4, ease: "power2.in" }, at(4, 0.22));
      tl.to("#mo-garc", { attr: { stroke: "#FC6255" }, duration: 0.3 }, at(4, 0.35));
      UH(3, at(4, 0.55));
      IN("#mo-r4", at(4, 0.56), 0.5, { x: -30 }, { x: 0 }); HL(4, at(4, 0.6), "#FF9F43");
      tl.fromTo("#mo-flash", { opacity: 1 }, { opacity: 0.2, duration: 0.25, yoyo: true, repeat: 5, immediateRender: false }, at(4, 0.7));
      // L5 tools change
      UH(4, at(5, 0.0));
      OUT("#mo-board", at(5, 0.0), 0.5);
      IN("#mo-def", at(5, 0.04), 0.5);
      ARROW("#mo-dl", at(5, 0.08), 1.0);
      IN("#mo-dn0", at(5, 0.14), 0.5, { y: 10 }, { y: 0 });
      IN("#mo-dn1", at(5, 0.26), 0.5, { y: 10 }, { y: 0 });
      IN("#mo-dn2", at(5, 0.38), 0.5, { y: 10 }, { y: 0 });
      IN("#mo-fo", at(5, 0.6), 0.5);
      [0, 1, 2].forEach(n => IN(`#mo-sn${n}`, at(5, 0.64 + n * 0.03), 0.4));
      [0, 1, 2].forEach(n => [0, 1, 2].forEach(b => IN(`#mo-bt${n}${b}`, at(5, 0.72 + (n * 3 + b) * 0.012), 0.3, { y: -12 }, { y: 0 })));
      IN("#mo-btn", at(5, 0.9), 0.5, { y: -12 }, { y: 0 });
      // L6 the calculation: 8% outflow
      OUT("#mo-s5", at(6, 0.0), 0.4);
      tl.set("#mo-hdr, #mo-r1, #mo-r2, #mo-r3, #mo-r4", { opacity: 0 }, at(6, 0.0));
      tl.set("#mo-board", { opacity: 1 }, at(6, 0.0));
      tl.set("#mo-r0", { opacity: 0 }, at(6, 0.0));
      tl.set("#mo-b0", { attr: { width: 0 } }, at(6, 0.0));
      IN("#mo-r0", at(6, 0.04), 0.4);
      IN("#mo-bl, #mo-bv, #mo-bt, #mo-bf, #mo-b5, #mo-b5t", at(6, 0.06), 0.4);
      const T0 = at(6, 0.12), TD = 2.6;
      tl.to("#mo-bf", { attr: { width: 720 }, duration: TD, ease: "none" }, T0);
      tl.to("#mo-b0", { attr: { width: 272 }, duration: TD, ease: "none" }, T0);
      COUNT("#mo-bv", 0, 8, T0, TD, v => Math.round(v) + "%", "none");
      const TX = T0 + TD * 5 / 8;
      tl.to("#mo-bf, #mo-b0", { attr: { fill: "#FC6255" }, duration: 0.2 }, TX);
      tl.to("#mo-bv", { attr: { fill: "#FC6255" }, duration: 0.2 }, TX);
      tl.to("#mo-rr0", { attr: { stroke: "#FC6255", "stroke-width": 4, fill: "#2a1618" }, duration: 0.2, yoyo: true, repeat: 3 }, TX);
      tl.to("#mo-rr0", { attr: { stroke: "#FC6255", "stroke-width": 3 }, duration: 0.2 }, TX + 0.85);
      [0, 1, 2, 3].forEach(k => IN(`#mo-wd${k}`, at(6, 0.3 + k * 0.06), 0.4, { x: 20 }, { x: 0 }));
      IN("#mo-qq", at(6, 0.72), 0.5, { y: 14 }, { y: 0 });
      // L7 five-minute check, then pause
      OUT("#mo-s6, #mo-board", at(7, 0.0), 0.4);
      IN("#mo-rgt, #mo-rgl", at(7, 0.03), 0.4);
      tl.fromTo("#mo-rg", { opacity: 1, strokeDashoffset: 0 }, { opacity: 1, strokeDashoffset: 0, duration: 0.01, immediateRender: false }, at(7, 0.03));
      tl.to("#mo-rg", { strokeDashoffset: 1, duration: at(7, 0.55) - at(7, 0.05), ease: "none" }, at(7, 0.05));
      [0, 1, 2].forEach(k => IN(`#mo-ck${k}`, at(7, 0.08 + k * 0.12), 0.4, { x: -16 }, { x: 0 }));
      ARROW("#mo-ka", at(7, 0.48), 0.5);
      IN("#mo-kal", at(7, 0.5), 0.4);
      IN("#mo-pbo", at(7, 0.54), 0.4, { scale: 0.6, svgOrigin: "1420 540" }, { scale: 1, svgOrigin: "1420 540" });
      tl.to("#mo-pb", { scale: 0.88, svgOrigin: "1420 540", duration: 0.15, yoyo: true, repeat: 1 }, at(7, 0.6));
      tl.fromTo("#mo-glow", { opacity: 0.9, scale: 1, svgOrigin: "1420 540" }, { opacity: 0, scale: 1.3, svgOrigin: "1420 540", duration: 0.8, ease: "power2.out", immediateRender: false }, at(7, 0.62));
      ARROW("#mo-ba", at(7, 0.68), 0.5);
      IN("#mo-br1", at(7, 0.72), 0.4);
      IN("#mo-br2", at(7, 0.86), 0.4, { y: 10 }, { y: 0 });

      tl.to("#mo-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["monitor"] = tl;
    })();
  </script>
