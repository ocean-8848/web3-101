  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      // L0 两条路
      IN("#qu-coin", at(0, 0)); IN("#qu-tg", at(0, 0.15));
      ARROW("#qu-pu", at(0, 0.4), 0.8); ARROW("#qu-pd", at(0, 0.5), 0.8);
      // L1 二级市场
      tl.to("#qu-pu", { stroke: "#e8e6df", duration: 0.3 }, at(1, 0.02));
      IN("#qu-ut", at(1, 0.05)); IN("#qu-bars", at(1, 0.25), 0.5, { y: 20 }, { y: 0 });
      IN("#qu-us", at(1, 0.55));
      // L2 协议取回
      tl.to("#qu-pu", { stroke: "#8a8f99", duration: 0.3 }, at(2, 0.02));
      tl.to("#qu-pd", { stroke: "#e8e6df", duration: 0.3 }, at(2, 0.02));
      IN("#qu-dt", at(2, 0.05));
      tl.fromTo("#qu-lq", { opacity: 0 }, { opacity: 1, duration: 0.5 }, at(2, 0.25));
      tl.fromTo("#qu-lq rect", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.1 }, at(2, 0.25));
      IN("#qu-ds", at(2, 0.55));
      // L3 时间线
      IN("#qu-tl", at(3, 0.05)); IN("#qu-t2", at(3, 0.12)); IN("#qu-t1", at(3, 0.5));
      // L4 取回流程
      OUT("#qu-coin,#qu-tg,#qu-pu,#qu-pd,#qu-ut,#qu-bars,#qu-us,#qu-dt,#qu-lq,#qu-ds,#qu-tl,#qu-t1,#qu-t2", at(4, 0));
      IN("#qu-us2", at(4, 0.05)); ARROW("#qu-f1", at(4, 0.1), 0.4);
      IN("#qu-rq", at(4, 0.15));
      ARROW("#qu-f2", at(4, 0.3), 0.4); IN("#qu-qb,#qu-fq", at(4, 0.33));
      [0, 1].forEach(k => {
        const t0 = at(4, 0.45 + k * 0.17);
        tl.to("#qu-s" + k, { opacity: 0, duration: 0.3 }, t0);
        tl.to("#qu-fqm", { x: -62 * (k + 1), duration: 0.6, ease: "power2.inOut" }, t0 + 0.2);
        tl.fromTo("#qu-s" + (6 + k), { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, t0 + 0.6);
      });
      IN("#qu-term", at(4, 0.5), 0.5);
      ARROW("#qu-f3", at(4, 0.8), 0.4); IN("#qu-cd", at(4, 0.85), 0.6, { y: 20 }, { y: 0 });
      // L5 最终确定 → claim
      IN("#qu-st", at(5, 0.05), 0.5, { y: -20 }, { y: 0, ease: "back.out(2)" });
      IN("#qu-cl", at(5, 0.45));
      tl.to("#qu-cl rect", { fill: "#83C167", duration: 0.15, yoyo: true, repeat: 1 }, at(5, 0.62));
      ARROW("#qu-f4", at(5, 0.68), 0.4); IN("#qu-eth", at(5, 0.75), 0.5, { x: -30 }, { x: 0 });
      // L6 两点注意
      OUT("#qu-term", at(6, 0), 0.3);
      IN("#qu-lk", at(6, 0.08), 0.5, { y: -15 }, { y: 0 });
      IN("#qu-hg", at(6, 0.4));
      tl.fromTo("#qu-hg path", { rotation: 0, svgOrigin: "765 845" }, { rotation: 180, svgOrigin: "765 845", duration: 0.8, immediateRender: false }, at(6, 0.7));


      tl.to("#qu-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#qu-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["queue"] = tl;
    })();
  </script>
