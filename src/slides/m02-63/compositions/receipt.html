    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      // L0 质押回顾 + 罚没
      IN("#re-val", at(0, 0.05));
      tl.fromTo("#re-vc", { opacity: 0, attr: { cx: 500 } }, { opacity: 1, attr: { cx: 960 }, duration: 1.0, ease: "power2.out" }, at(0, 0.12));

      tl.to("#re-rw", { y: -20, opacity: 0, duration: 0.6 }, at(0, 0.6));
      IN("#re-ds", at(0, 0.7), 0.3);
      tl.to("#re-valr", { stroke: "#FC6255", duration: 0.15, yoyo: true, repeat: 3 }, at(0, 0.7));
      IN("#re-chip", at(0, 0.76), 0.1);
      tl.fromTo("#re-frag", { opacity: 1, x: 0, y: 0 }, { x: 60, y: -40, opacity: 0, duration: 0.8 }, at(0, 0.76));
      IN("#re-term", at(0, 0.82), 0.5);
      // L1 存入池子
      OUT("#re-val,#re-vc,#re-chip,#re-ds", at(1, 0));
      IN("#re-L", at(1, 0.1));
      IN("#re-M", at(1, 0.3));
      ARROW("#re-a1", at(1, 0.45)); IN("#re-a1t", at(1, 0.5));
      tl.fromTo("#re-fc", { opacity: 0, attr: { cx: 440 } }, { opacity: 1, duration: 0.15 }, at(1, 0.65));

      // L2 运营者 + 铸造 LST

      DRAW("#re-ln0", at(2, 0.05)); DRAW("#re-ln1", at(2, 0.08)); DRAW("#re-ln2", at(2, 0.11));
      IN("#re-srv", at(2, 0.18));
      ARROW("#re-a2", at(2, 0.45)); IN("#re-a2t", at(2, 0.5));
      IN("#re-R", at(2, 0.55), 0.7, { x: -30 }, { x: 0 });

      // L3 收据可用，底层继续领奖励
      [0, 1, 2].forEach(i => {
        IN("#re-u" + i, at(3, 0.05 + i * 0.12), 0.4);
        tl.to("#re-u" + i + " rect", { stroke: "#83C167", duration: 0.3 }, at(3, 0.12 + i * 0.12));
        tl.to("#re-u" + i + " text", { fill: "#83C167", duration: 0.3 }, at(3, 0.12 + i * 0.12));
        [0, 1].forEach(k => {
          tl.fromTo("#re-pl" + i, { opacity: 0, y: 0 }, { opacity: 1, y: -14, duration: 0.5, immediateRender: false }, at(3, 0.45 + k * 0.25) + i * 0.15);
          tl.to("#re-pl" + i, { opacity: 0, duration: 0.4 }, at(3, 0.45 + k * 0.25) + i * 0.15 + 0.6);
        });
      });
      OUT("#re-term2", at(3, 0.9), 0.4);
      // L4 仓单比喻
      IN("#re-met", at(4, 0.1));
      IN("#re-eq", at(4, 0.6));
      // L5 两处不成立

      tl.fromTo(".re-rd", { opacity: 0 }, { opacity: 1, duration: 0.2, yoyo: true, repeat: 5 }, at(5, 0.18));
      IN("#re-m2", at(5, 0.6), 0.5, { x: -20 }, { x: 0 });
      // L6 组合风险
      OUT("#re-met,#re-eq,#re-m1,#re-m2,#re-u0,#re-u1,#re-u2", at(6, 0));
      IN("#re-b0", at(6, 0.08), 0.6, { y: 20 }, { y: 0 });
      IN("#re-b1", at(6, 0.2), 0.6, { y: 20 }, { y: 0 });
      IN("#re-b2", at(6, 0.32), 0.6, { y: 20 }, { y: 0 });
      IN("#re-ne", at(6, 0.45));
      [0, 1, 2, 3].forEach(i => IN("#re-t" + i, at(6, 0.55 + i * 0.08), 0.4, { y: -12 }, { y: 0 }));


      tl.to("#re-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
