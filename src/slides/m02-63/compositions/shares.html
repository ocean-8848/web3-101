        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">rebase <tspan font-size="28" font-weight="400" fill="#8a8f99"></tspan></text>

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      // L0 池子与问题
      IN("#sh-box", at(0, 0.05), 0.7);
      IN("#sh-rc", at(0, 0.3), 0.6, { y: -40 }, { y: 0 });
      IN("#sh-q", at(0, 0.55), 0.5);
      // L1 账本
      OUT("#sh-q,#sh-rc", at(1, 0.05));
      IN("#sh-led", at(1, 0.2), 0.8);
      IN("#sh-term", at(1, 0.72), 0.5);
      // L2 公式
      IN("#sh-f", at(2, 0.1), 0.8, { y: 20 }, { y: 0 });
      // L3 预言机 + rebase
      OUT("#sh-term", at(3, 0), 0.3);
      IN("#sh-or", at(3, 0.05)); IN("#sh-pe", at(3, 0.12));
      IN("#sh-ol", at(3, 0.2));
      [0, 1, 2].forEach(k => {
        const t0 = at(3, 0.28 + k * 0.2);
        tl.fromTo("#sh-od", { opacity: 1, attr: { cx: 305 } }, { attr: { cx: 552 }, duration: 0.7, ease: "power1.in", immediateRender: false }, t0);
        tl.to("#sh-od", { opacity: 0, duration: 0.1 }, t0 + 0.7);
        tl.to("#sh-bar", { attr: { width: 180 + (k + 1) * 6 }, duration: 0.3 }, t0 + 0.72);
        tl.fromTo(".sh-rf", { opacity: 0 }, { opacity: 0.3, duration: 0.18, yoyo: true, repeat: 1, immediateRender: false }, t0 + 0.75);
        tl.fromTo(".sh-bal", { y: 0 }, { y: -8, duration: 0.18, yoyo: true, repeat: 1, immediateRender: false }, t0 + 0.75);
      });
      IN("#sh-term2", at(3, 0.85), 0.5);
      // L4 算一算
      OUT("#sh-or,#sh-ol", at(4, 0));
      tl.to("#sh-bar", { attr: { width: 180 }, duration: 0.3 }, at(4, 0));
      tl.to("#sh-pm", { x: -460, duration: 0.9, ease: "power2.inOut" }, at(4, 0.02));
      IN("#sh-pan", at(4, 0.12));
      IN("#sh-p1", at(4, 0.25)); IN("#sh-p2", at(4, 0.4)); IN("#sh-p3", at(4, 0.55)); IN("#sh-p4", at(4, 0.75));
      OUT("#sh-term2", at(4, 0.6), 0.4);
      // L5 一天后
      IN("#sh-dv", at(5, 0.02)); IN("#sh-p5", at(5, 0.08));
      tl.to("#sh-bar", { attr: { width: 186 }, duration: 0.4 }, at(5, 0.12));
      IN("#sh-p6", at(5, 0.45));
      IN("#sh-p7", at(5, 0.85), 0.5, { attr: { "font-size": 40 } }, { attr: { "font-size": 60 } });
      // L6 余额自动变；负奖励
      COUNT("#sh-ab", 100, 100.01, at(6, 0.05), 1.0, v => v.toFixed(2));
      IN("#sh-up", at(6, 0.12), 0.5);
      OUT("#sh-up", at(6, 0.5));
      tl.to("#sh-bar", { fill: "#FC6255", attr: { width: 172 }, duration: 0.6 }, at(6, 0.55));
      tl.to("#sh-ab", { fill: "#FC6255", duration: 0.3 }, at(6, 0.6));
      COUNT("#sh-ab", 100.01, 99.99, at(6, 0.6), 0.8, v => v.toFixed(2));
      IN("#sh-neg", at(6, 0.62));


      tl.to("#sh-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#sh-term,#sh-term2", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["shares"] = tl;
    })();
  </script>
