      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);

      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
// L0 the table
IN("#pl-term", at(0, 0.45), 0.5);
IN("#pl-tab", at(0, 0.6), 0.7, { y: 20 }, { y: 0 });
// L1 selectors

IN("#pl-sel0", at(1, 0.25), 0.3); IN("#pl-g0", at(1, 0.25), 0.4);
IN("#pl-sel1", at(1, 0.55), 0.3); IN("#pl-g1", at(1, 0.55), 0.4);
IN("#pl-r2bg", at(1, 0.8), 0.3); IN("#pl-g2", at(1, 0.8), 0.4);
OUT("#pl-term", at(1, 0.95), 0.4);
// L2 copy constraint
IN("#pl-cp0, #pl-cp1", at(2, 0.1), 0.4);
DRAW("#pl-arc", at(2, 0.25), 0.6);
IN("#pl-cpl", at(2, 0.4), 0.5);
// L3 custom gate: many rows -> one
IN("#pl-stl", at(3, 0.15), 0.4);
IN("#pl-stack", at(3, 0.15), 0.5, { x: 20 }, { x: 0 });
OUT("#pl-stl", at(3, 0.5), 0.3);

IN("#pl-one", at(3, 0.5) + 0.7, 0.4);
OUT("#pl-stack", at(3, 0.5) + 0.8, 0.2);
IN("#pl-onel", at(3, 0.5) + 0.9, 0.4);
tl.to("#pl-r2bg", { fillOpacity: 0.4, duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.85));
// L4 lookup table
OUT("#pl-hash", at(4, 0), 0.4);
IN("#pl-term2", at(4, 0.05), 0.5);
IN("#pl-lt", at(4, 0.15), 0.5, { x: 20 }, { x: 0 });
IN("#pl-v", at(4, 0.35), 0.3);
tl.to("#pl-v", { attr: { x: 1590, y: 647 }, duration: 0.8, ease: "power2.inOut" }, at(4, 0.42));

tl.to("#pl-lc5", { fill: "#1f3320", stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, at(4, 0.42) + 0.7);
IN("#pl-lkl", at(4, 0.7), 0.5);
// L5 circuit once, witness each time
OUT("#pl-main", at(5, 0), 0.4);
OUT("#pl-term2", at(5, 0), 0.4);
