        const o = { v: from }, el = document.querySelector(sel);

      };

OUT("#r1-term", at(1, 0.75), 0.4);
// L2 addition folds in, multiplication adds a row

// L3 three-row table
OUT("#r1-p1", at(3, 0), 0.4);
IN("#r1-tb", at(3, 0.03), 0.5);
[[0.06, 0.18], [0.34, 0.47], [0.6, 0.82]].forEach(([a, b], r) => {
  IN(`#r1-row${r}`, at(3, a), 0.5, { x: -15 }, { x: 0 });
  IN(`#r1-chk${r}`, at(3, b), 0.5);
  IN(`#r1-ok${r}`, at(3, b) + 0.5, 0.3, { scale: 0.4, svgOrigin: `1578 ${[482, 592, 702][r]}` }, { scale: 1, svgOrigin: `1578 ${[482, 592, 702][r]}` });
});
tl.to("#r1-chk0, #r1-chk1, #r1-chk2", { fill: "#83C167", duration: 0.4, stagger: 0.1 }, at(3, 0.92));
// L4 "only x 1", Circom terminal

IN("#r1-term2", at(4, 0.35), 0.5);

// L5 quiz

tl.to("#r1-q1f", { scale: 0, svgOrigin: "1320 570", opacity: 0, duration: 0.25, ease: "power2.in" }, at(5, 0.64));
IN("#r1-q1b", at(5, 0.64) + 0.25, 0.3, { scale: 0.2, svgOrigin: "1320 580" }, { scale: 1, svgOrigin: "1320 580" });
