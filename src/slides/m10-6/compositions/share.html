  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/

const CX = [667, 960, 1253];
for (let r = 0; r < 3; r++) {
  IN(`#sh-nm${r}`, at(0, 0.22 + r * 0.05), 0.5, { x: -20 }, { x: 0 });
  IN(`#sh-sal${r}`, at(0, 0.42 + r * 0.04), 0.5);
}
gsap.utils.toArray("#sh-all .sh-gl").forEach((el, k) => DRAW(el, at(0, 0.55) + k * 0.06, 0.6));
IN("#sh-hd0, #sh-hd1, #sh-hd2", at(0, 0.7), 0.6);
IN("#sh-note", at(0, 0.84), 0.6);
// rows split
const SPLIT = (r, t0, gap) => {
  tl.fromTo(`#sh-sal${r}`, { scale: 1 }, { scale: 1.2, svgOrigin: `300 ${[343, 510, 677][r]}`, duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, t0 - 0.4);
  for (let c = 0; c < 3; c++) IN(`#sh-c${r}${c}`, t0 + c * gap, 0.7, { x: 300 - CX[c] }, { x: 0 });
};
SPLIT(0, at(1, 0.28), 0.6);
IN("#sh-eq0", at(1, 0.62), 0.6, { x: -20 }, { x: 0 });
SPLIT(1, at(2, 0.1), 0.45);
IN("#sh-eq1", at(2, 0.33), 0.5, { x: -20 }, { x: 0 });
SPLIT(2, at(2, 0.6), 0.45);
IN("#sh-eq2", at(2, 0.84), 0.5, { x: -20 }, { x: 0 });
// L3 hand out
IN("#sh-tint0", at(3, 0.06), 0.5); IN("#sh-tint1", at(3, 0.13), 0.5); IN("#sh-tint2", at(3, 0.2), 0.5);
ARROW("#sh-ar0", at(3, 0.3), 0.4); ARROW("#sh-ar1", at(3, 0.34), 0.4); ARROW("#sh-ar2", at(3, 0.38), 0.4);
tl.to("#sh-all .sh-cell", { fill: "#8a8f99", duration: 0.6 }, at(3, 0.5));
OUT("#sh-eq0, #sh-eq1, #sh-eq2", at(3, 0.55), 0.4);
IN("#sh-mk0, #sh-mk1, #sh-mk2", at(3, 0.66), 0.5, { y: -20 }, { y: 0 });
// L4, L5 buckets
IN("#sh-bk0", at(4, 0.05), 0.5);
IN("#sh-b0a", at(4, 0.15), 0.5);
IN("#sh-b0b", at(4, 0.6), 0.5);
IN("#sh-bk1", at(5, 0.02), 0.4); IN("#sh-b1a", at(5, 0.06), 0.4); IN("#sh-b1b", at(5, 0.3), 0.4);
IN("#sh-bk2", at(5, 0.5), 0.4); IN("#sh-b2a", at(5, 0.54), 0.4); IN("#sh-b2b", at(5, 0.84), 0.4);
// L6 total
tl.to("#sh-r0, #sh-r1, #sh-r2", { fill: "#83C167", duration: 0.4 }, at(6, 0.06));
IN("#sh-t1", at(6, 0.12), 0.5, { x: -20 }, { x: 0 });
IN("#sh-t2", at(6, 0.42), 0.5);
IN("#sh-t3", at(6, 0.74), 0.5);
// L7 each one sees only shards + total
IN("#sh-tbox", at(7, 0.08), 0.4);
for (let r = 0; r < 3; r++) {
  const t = at(7, 0.12 + r * 0.24);
  IN(`#sh-eye${r}`, t, 0.4);
  IN(`#sh-col${r}`, t + 0.1, 0.3);
  OUT(`#sh-col${r}`, t + 1.1, 0.3);
}

      /*ENDANIM*/

      tl.to("#sh-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["share"] = tl;
    })();
  </script>
