  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/

IN("#fh-term", at(0, 0.03), 0.5);
IN("#fh-row1", at(0, 0.12), 0.6);
IN("#fh-l2, #fh-e0, #fh-e1", at(0, 0.28), 0.6, { y: 16 }, { y: 0 });
IN("#fh-op", at(0, 0.42), 0.4);
ARROW("#fh-a1", at(0, 0.48), 0.4);
IN("#fh-res", at(0, 0.54), 0.5, { scale: 0.8, svgOrigin: "960 530" }, { scale: 1, svgOrigin: "960 530" });
ARROW("#fh-a2", at(0, 0.68), 0.4); IN("#fh-dl", at(0, 0.68), 0.4);
IN("#fh-p2", at(0, 0.74), 0.5);
ARROW("#fh-p1a", at(0, 0.82), 0.4); IN("#fh-p1", at(0, 0.86), 0.4);
tl.to("#fh-p1", { fill: "#83C167", duration: 0.4 }, at(0, 0.92));
OUT("#fh-term", at(0, 0.92), 0.4);
// L1 noise grows
IN("#fh-mt, #fh-mf", at(1, 0.06), 0.4);
const W = [120, 330, 560, 800];
for (let k = 0; k < 4; k++) {
  const t = at(1, 0.16 + k * 0.17);
  tl.fromTo("#fh-op", { scale: 1 }, { scale: 1.25, svgOrigin: "690 530", duration: 0.18, yoyo: true, repeat: 1, immediateRender: false }, t);
  IN(`#fh-nz${k}`, t + 0.2, 0.3);
  tl.to("#fh-mf", { attr: { width: W[k] }, duration: 0.5, ease: "power2.out" }, t + 0.2);
}
const te = at(1, 0.16 + 3 * 0.17) + 0.6;
tl.to("#fh-mf", { fill: "#FC6255", duration: 0.2 }, te);
tl.to("#fh-p2", { fill: "#FC6255", duration: 0.3 }, te + 0.1);
IN("#fh-err", te + 0.2, 0.4);
// L2 bootstrapping
IN("#fh-term2", at(2, 0.04), 0.5);
DRAW("#fh-ring", at(2, 0.18), 0.9); IN("#fh-ring", at(2, 0.18), 0.1); IN("#fh-rh", at(2, 0.3), 0.3);
tl.to("#fh-ring, #fh-rh", { rotation: 360, svgOrigin: "960 530", duration: 1.6, ease: "power1.inOut", immediateRender: false }, at(2, 0.34));
OUT("#fh-nz3", at(2, 0.4), 0.3); OUT("#fh-nz2", at(2, 0.5), 0.3); OUT("#fh-nz1", at(2, 0.6), 0.3);
tl.to("#fh-mf", { attr: { width: 120 }, fill: "#FF9F43", duration: 0.8, ease: "power2.inOut" }, at(2, 0.45));
OUT("#fh-err", at(2, 0.66), 0.3);
tl.to("#fh-p2", { fill: "#83C167", duration: 0.3 }, at(2, 0.72));
// L3 unbounded but slow
IN("#fh-ch", at(3, 0.05), 0.7, { x: -40 }, { x: 0 });
OUT("#fh-term2", at(3, 0.4), 0.4);
IN("#fh-clk", at(3, 0.55), 0.5);
tl.to("#fh-clk path", { rotation: 360, svgOrigin: "1070 828", duration: 1.6, ease: "none", immediateRender: false }, at(3, 0.6));
// L4 who holds the key
IN("#fh-key", at(4, 0.3), 0.6, { scale: 0.6, svgOrigin: "1640 400" }, { scale: 1, svgOrigin: "1640 400" });
IN("#fh-who", at(4, 0.55), 0.5);
// L5 single holder sees all
OUT("#fh-who", at(5, 0.0), 0.3);
IN("#fh-man", at(5, 0.05), 0.4);
IN("#fh-ub0, #fh-ub1, #fh-ub2, #fh-ub3, #fh-uc0, #fh-uc1, #fh-uc2, #fh-uc3", at(5, 0.08), 0.4);
tl.to("#fh-key", { scale: 0.5, svgOrigin: "1640 400", duration: 0.8, ease: "power2.inOut" }, at(5, 0.15));
tl.to("#fh-kmove", { x: -150, y: 290, duration: 0.8, ease: "power2.inOut" }, at(5, 0.15));
for (let k = 0; k < 4; k++) {
  const t = at(5, 0.5 + k * 0.09);
  OUT(`#fh-uc${k}`, t, 0.2);
  tl.to(`#fh-ub${k}`, { stroke: "#FC6255", duration: 0.2 }, t);
  IN(`#fh-up${k}`, t + 0.2, 0.3);
}

      /*ENDANIM*/

      tl.to("#fh-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#fh-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["fhe"] = tl;
    })();
