OUT("#fm-term", at(4, 0), 0.4);

IN("#fm-acl", at(4, 0.12), 0.5);
IN("#fm-aclr", at(4, 0.32), 0.5);

IN("#fm-kl, #fm-ring", at(5, 0.06), 0.5);
IN("#fm-key", at(5, 0.18), 0.4);
OUT("#fm-key", at(5, 0.3), 0.2);

  tl.to(`#fm-kp${k}`, { x: D[k][0], y: D[k][1], duration: 0.7, ease: "power2.out" }, at(5, 0.31));

IN("#fm-tm", at(6, 0.1), 0.8, { x: 1320, y: -395 }, { x: 0, y: 0 });
