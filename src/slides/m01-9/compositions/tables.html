      IN("#ta-btab, #ta-brow", at(4, 0.12), 0.5);

      DRAW("#ta-e1", at(5, 0.06), 0.5); DRAW("#ta-e2", at(5, 0.06), 0.5); DRAW("#ta-e3", at(5, 0.06), 0.5);

      IN("#ta-c5", at(5, 0.08), 0.6);
