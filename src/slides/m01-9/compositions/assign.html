    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const BAR = (y, h, t, c) => {
        tl.to("#as-hlr, #as-hla", { attr: { y, height: h }, duration: 0.4, ease: "power2.inOut" }, t);
        if (c) tl.to("#as-hlr, #as-hla", { attr: { fill: c }, duration: 0.3 }, t);
      };
      const FLASH = (s, c, t) => tl.to(s, { attr: { stroke: c, "stroke-width": 5 }, duration: 0.2, yoyo: true, repeat: 1 }, t);
      const SWAP = (a, b, t) => { OUT(a, t, 0.25); IN(b, t + 0.3, 0.4); };

      // L0 第一步：查已有地址；用户 42 请求两次拿同一地址
      IN("#as-code", at(0, 0.02), 0.6);
      IN("#as-h0", at(0, 0.08), 0.4);
      ["#as-s0", "#as-s1", "#as-s2", "#as-s3", "#as-s4", "#as-s5", "#as-s6", "#as-s7"].forEach((s, i) => IN(s, at(0, 0.1) + i * 0.08, 0.4, { x: 20 }, { x: 0 }));
      IN("#as-f2, #as-f3, #as-f4, #as-f5, #as-f6, #as-f7", at(0, 0.18), 0.4);
      IN("#as-r42", at(0, 0.38), 0.4);
      ARROW("#as-a42", at(0, 0.45), 0.5);
      FLASH("#as-s1r", "#83C167", at(0, 0.45) + 0.5);
      OUT("#as-a42", at(0, 0.6), 0.25);
      ARROW("#as-a42", at(0, 0.66), 0.5);
      FLASH("#as-s1r", "#83C167", at(0, 0.66) + 0.5);
      IN("#as-idem", at(0, 0.74), 0.4);

      // L1 第二步：领空闲地址 + FOR UPDATE SKIP LOCKED
      OUT("#as-r42, #as-a42, #as-idem", at(1, 0), 0.3);
      BAR(372, 328, at(1, 0.03));
      FLASH("#as-s2r", "#FF9F43", at(1, 0.32));
      BAR(618, 41, at(1, 0.58), "#FF9F43");

      // L2 三个并发请求各拿各的
      SWAP("#as-h0", "#as-h1", at(2, 0.42));
      IN("#as-rA, #as-rB, #as-rC", at(2, 0.04), 0.4);
      ARROW("#as-aA", at(2, 0.14), 0.5); ARROW("#as-aB", at(2, 0.14), 0.5); ARROW("#as-aC", at(2, 0.14), 0.5);
      IN("#as-locks", at(2, 0.24), 0.3, { y: -10 }, { y: 0 });
      OUT("#as-f2, #as-f3, #as-f4", at(2, 0.58), 0.25);
      IN("#as-u2, #as-u3, #as-u4", at(2, 0.62), 0.4);
      tl.to("#as-s2r, #as-s3r, #as-s4r", { attr: { stroke: "#58C4DD" }, duration: 0.4 }, at(2, 0.6));
      OUT("#as-locks", at(2, 0.84), 0.3);

      // L3 同一用户两个请求：撞唯一索引 → 再查一次
      OUT("#as-rA, #as-rB, #as-rC, #as-aA, #as-aB, #as-aC", at(3, 0), 0.3);
      IN("#as-r88a, #as-r88b", at(3, 0.04), 0.4);
      ARROW("#as-a88a", at(3, 0.1), 0.5);
      OUT("#as-f5", at(3, 0.16), 0.25);
      IN("#as-u5", at(3, 0.18), 0.4);
      tl.to("#as-s5r", { attr: { stroke: "#58C4DD" }, duration: 0.3 }, at(3, 0.16));
      ARROW("#as-a88b", at(3, 0.26), 0.4);
      IN("#as-wall", at(3, 0.3), 0.2);
      SWAP("#as-h1", "#as-h2", at(3, 0.3));
      BAR(249, 82, at(3, 0.55), "#58C4DD");
      OUT("#as-a88b", at(3, 0.58), 0.3);
      ARROW("#as-a88c", at(3, 0.62), 0.6);
      FLASH("#as-s5r", "#83C167", at(3, 0.62) + 0.6);
      SWAP("#as-h2", "#as-h3", at(3, 0.7));

      // L4 地址从哪来：钱包系统离线派生
      OUT("#as-code, #as-r88a, #as-r88b, #as-a88a, #as-wall, #as-a88c", at(4, 0) - 0.3, 0.35);
      SWAP("#as-h3", "#as-h0", at(4, 0) - 0.3);
      IN("#as-wal", at(4, 0.04), 0.5, { x: -20 }, { x: 0 });
      ARROW("#as-x1", at(4, 0.2), 0.4);
      IN("#as-xpub", at(4, 0.24), 0.5);
      IN("#as-path", at(4, 0.36), 0.5);
      [0, 1, 2].forEach(k => {
        const t = at(4, 0.48) + k * 0.7;
        IN(`#as-ch${k}`, t, 0.25);
        tl.to(`#as-ch${k}`, { x: 280, duration: 0.9, ease: "power1.in" }, t);
        OUT(`#as-ch${k}`, t + 0.7, 0.2);
      });
      FLASH("#as-s6r, #as-s7r", "#58C4DD", at(4, 0.6));
      IN("#as-only", at(4, 0.78), 0.5);
