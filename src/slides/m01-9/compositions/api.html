      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

      IN("#ap-e2", at(2, 0.42), 0.4, { x: 20 }, { x: 0 });

      BAR(282 + 41, 41, at(2, 0.7));

      tl.to("#ap-calc", { y: -4, duration: 0.2, yoyo: true, repeat: 1 }, at(3, 0.86));

      OUT("#ap-ev, #ap-fl, #ap-flx, #ap-fll, #ap-calc", at(4, 0) - 0.3, 0.3);
      IN("#ap-plat", at(4, 0.03), 0.5);
      IN("#ap-mer", at(4, 0.08), 0.5);
      IN("#ap-req", at(4, 0.14), 0.5);
      ARROW("#ap-w1", at(4, 0.16), 0.4);
      ARROW("#ap-w2", at(4, 0.2), 0.4);

      IN("#ap-h2", at(4, 0.42), 0.4);
      IN("#ap-h3", at(4, 0.58), 0.5);
      IN("#ap-bd", at(4, 0.8), 0.4);

      // L5 商户校验；5 分钟窗口外的旧请求被挡回
      IN("#ap-m1", at(5, 0.04), 0.4);
      IN("#ap-m2", at(5, 0.24), 0.4);
      IN("#ap-win", at(5, 0.45), 0.5);
      IN("#ap-old", at(5, 0.55), 0.3);
      tl.to("#ap-old", { x: 70, duration: 0.5, ease: "power2.in" }, at(5, 0.6));
      IN("#ap-owall", at(5, 0.6) + 0.45, 0.1);

      DRAW("#ap-ax", at(6, 0.02), 0.8);

      ["#ap-d1", "#ap-d2", "#ap-d3", "#ap-d4", "#ap-d5", "#ap-d6"].forEach((s, i) => IN(s, at(6, 0.18 + i * 0.07), 0.3, { y: 8 }, { y: 0 }));

      IN("#ap-d7", at(6, 0.62), 0.3, { y: 8 }, { y: 0 });
