      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      // 点亮角色：rows 为点亮的行号，其余变暗；标记条移到第一行

        P.forEach((p, i) => tl.to(p, { opacity: rows.includes(i) ? 1 : 0.3, duration: 0.4 }, t));
        if (rows.length) {
          const y0 = 236 + 108 * rows[0], h = 68 + 108 * (rows[rows.length - 1] - rows[0]);

      // 角色列出现
      P.forEach((p, i) => IN(p, at(0, 0.0) + i * 0.08, 0.4, { x: -10 }, { x: 0 }));

      IN("#st-ok", at(0, 0.66) + 1.7, 0.4);
      IN("#st-10", at(0, 0.8), 0.5, { x: -12 }, { x: 0 });
      IN("#st-10b", at(0, 0.88), 0.4);

      // L1 账户服务
      OUT("#st-u > *", at(1, 0), 0.4);
      FOCUS([2], at(1, 0));
      IN("#st-abox", at(1, 0.06), 0.5);
      IN("#st-e1", at(1, 0.14), 0.4); IN("#st-e2", at(1, 0.24), 0.4);
      tl.to("#st-e1o", { x: 500, y: 60, duration: 0.8, ease: "power2.in" }, at(1, 0.22));
      tl.to("#st-e2o", { x: 500, y: -60, duration: 0.8, ease: "power2.in" }, at(1, 0.32));
      OUT("#st-e1", at(1, 0.22) + 0.75, 0.2); OUT("#st-e2", at(1, 0.32) + 0.75, 0.2);
      IN("#st-dd", at(1, 0.62), 0.4);
      IN("#st-e3", at(1, 0.66), 0.3);
      tl.to("#st-e3o", { x: 380, duration: 0.6, ease: "power2.in" }, at(1, 0.68));
      IN("#st-e3x", at(1, 0.68) + 0.6, 0.2);
      OUT("#st-e3, #st-e3x", at(1, 0.68) + 1.0, 0.3);

      // L2 外部商户
      OUT("#st-a > *", at(2, 0), 0.4);
      FOCUS([3], at(2, 0));
      IN("#st-plat", at(2, 0.04), 0.5); IN("#st-mer", at(2, 0.08), 0.5);
      IN("#st-term", at(2, 0.12), 0.5);
      ARROW("#st-h1", at(2, 0.16), 0.7); IN("#st-h1l", at(2, 0.2), 0.4);
      IN("#st-seal", at(2, 0.42), 0.5, { y: 8 }, { y: 0 });
      ARROW("#st-h2", at(2, 0.66), 0.5); IN("#st-h2x", at(2, 0.66) + 0.5, 0.2);
      ARROW("#st-h3", at(2, 0.66) + 0.7, 0.6);
      IN("#st-clk", at(2, 0.8), 0.5);
      tl.to("#st-clk line:first-of-type", { rotation: 360, svgOrigin: "960 770", duration: 1.4, ease: "none" }, at(2, 0.82));

      // L3 运维
      OUT("#st-m > *, #st-term", at(3, 0), 0.4);
      FOCUS([4], at(3, 0));
      IN("#st-pan", at(3, 0.06), 0.5);
      DRAW("#st-g1", at(3, 0.14), 0.8); DRAW("#st-g2", at(3, 0.36), 0.8); DRAW("#st-g3", at(3, 0.56), 0.8);
      IN("#st-bell", at(3, 0.72), 0.3);
