      <!-- 术语卡（统一样式）：左上角；一次只放一个词 -->
      <g id="ai-term" class="h">
        <rect x="70" y="56" width="540" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">白名单 <tspan font-size="28" font-weight="400" fill="#8a8f99">Allowlist</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">允许领取空投的地址列表</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const COINS = (t) => {
        tl.fromTo(".ai-coin", { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.15, stagger: 0.18, immediateRender: false }, t);
        tl.fromTo(".ai-coin", { x: 0, y: 0 }, { x: -960, y: -110, duration: 1.0, ease: "power2.inOut", stagger: 0.18, immediateRender: false }, t + 0.1);
        tl.to(".ai-coin", { opacity: 0, duration: 0.2, stagger: 0.18 }, t + 1.0);
      };
      const PULSE = (t) => {
        tl.to("#ai-cardr", { fill: "#3a3016", duration: 0.15 }, t);
        tl.to("#ai-cardr", { fill: "#161a22", duration: 0.3 }, t + 0.2);
        tl.fromTo("#ai-ac", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, t);
      };

      // L0 项目方 + 长名单滚动
      IN("#ai-prj", at(0, 0.02), 0.6, { x: -20 }, { x: 0 });
      IN("#ai-list", at(0, 0.1), 0.6);
      tl.fromTo("#ai-rows", { y: 0 }, { y: -378, duration: at(1, 0.5) - at(0, 0.15), ease: "none" }, at(0, 0.15));
      IN("#ai-term", at(0, 0.42), 0.5);
      // L1 全写进存储：格子逐个填满，红色价签堆成小山
      IN("#ai-stl", at(1, 0.03), 0.5);
      IN(".ai-cell", at(1, 0.06), 0.3, {}, { stagger: 0.04 });
      tl.to(".ai-cell", { fillOpacity: 0.4, duration: 0.2, stagger: 0.12 }, at(1, 0.15));
      IN("#ai-price", at(1, 0.32), 0.5);
      IN(".ai-stk", at(1, 0.4), 0.25, { y: -24 }, { y: 0, stagger: 0.18 });
      OUT("#ai-term", at(1, 0.5), 0.4);
      IN("#ai-x10", at(1, 0.72), 0.5, { scale: 0.7, svgOrigin: "1640 360" }, { scale: 1, svgOrigin: "1640 360" });
      // L2 链下建树，只把根写进合约
      OUT("#ai-store > *", at(2, 0), 0.4);
      IN("#ai-off", at(2, 0.04), 0.5);
      ARROW("#ai-a1", at(2, 0.08), 0.5);
      IN("#ai-scr", at(2, 0.13), 0.5);
      ARROW("#ai-a2", at(2, 0.24), 0.4);
      IN("#ai-root", at(2, 0.28), 0.5, { scale: 0.5, svgOrigin: "1140 565" }, { scale: 1, svgOrigin: "1140 565" });
      IN("#ai-con", at(2, 0.34), 0.5);
      ARROW("#ai-a3", at(2, 0.4), 0.4);
      tl.to("#ai-rootm", { x: 200, y: 30, duration: 0.8, ease: "power2.inOut" }, at(2, 0.47));
      OUT("#ai-a3", at(2, 0.5), 0.3);
      IN("#ai-mr", at(2, 0.58), 0.5);
      ARROW("#ai-a4", at(2, 0.68), 0.5);
      IN("#ai-ipfs", at(2, 0.74), 0.5);
      IN("#ai-pfs", at(2, 0.84), 0.5, { y: -12 }, { y: 0 });
      // L3 用户提交数量 + 证明，合约现场验证
      OUT("#ai-prj, #ai-off, #ai-list, #ai-a1, #ai-scr, #ai-a2, #ai-a4, #ai-ipfs, #ai-pfs", at(3, 0), 0.4);
      IN("#ai-user", at(3, 0.06), 0.6);
      IN("#ai-card", at(3, 0.14), 0.5, { x: -20 }, { x: 0 });
      ARROW("#ai-ac", at(3, 0.26), 0.6);
      IN("#ai-acl", at(3, 0.28), 0.4);
      IN("#ai-ok", at(3, 0.42), 0.4, { scale: 0.5, svgOrigin: "1730 594" }, { scale: 1, svgOrigin: "1730 594" });
      COINS(at(3, 0.5));
      IN("#ai-17", at(3, 0.68), 0.5);
      // L4 不记录已领取 → 同一证明反复领空；加 claimed 后被挡
      OUT("#ai-ok, #ai-17", at(4, 0), 0.3);
      IN("#ai-pooll, #ai-poolbg, #ai-pool", at(4, 0.03), 0.5);
      const drain = [[0.14, 360], [0.32, 180], [0.5, 0]];
      drain.forEach(([f, w]) => {
        PULSE(at(4, f));
        COINS(at(4, f) + 0.1);
        tl.to("#ai-pool", { attr: { width: w }, duration: 0.6, ease: "power2.in" }, at(4, f) + 0.6);
      });
      tl.to("#ai-poolbg", { stroke: "#FC6255", duration: 0.3 }, at(4, 0.62));
      IN("#ai-empty", at(4, 0.64), 0.4);
      OUT("#ai-empty", at(4, 0.76), 0.3);
      tl.to("#ai-poolbg", { stroke: "#8a8f99", duration: 0.3 }, at(4, 0.78));
      tl.to("#ai-pool", { attr: { width: 540 }, duration: 0.5, ease: "power2.out" }, at(4, 0.78));
      IN("#ai-clm", at(4, 0.79), 0.5, { y: -12 }, { y: 0 });
      PULSE(at(4, 0.88));
      IN("#ai-lock", at(4, 0.9), 0.35, { scale: 0.5, svgOrigin: "1216 560" }, { scale: 1, svgOrigin: "1216 560" });
      // L5 链下与合约的编码规则
      OUT("#ai-user, #ai-card, #ai-ac, #ai-acl, #ai-con, #ai-mr, #ai-root, #ai-pooll, #ai-poolbg, #ai-pool, #ai-clm, #ai-lock", at(5, 0), 0.4);
      IN("#ai-cL", at(5, 0.04), 0.6, { x: -20 }, { x: 0 });
      IN("#ai-cR, #ai-encA", at(5, 0.1), 0.6, { x: 20 }, { x: 0 });
      IN("#ai-eq0", at(5, 0.2), 0.3);
      IN("#ai-eq1", at(5, 0.28), 0.3);
      IN("#ai-eq2", at(5, 0.36), 0.3);
      IN("#ai-pfl", at(5, 0.42), 0.4);
      IN(".ai-chip", at(5, 0.44), 0.3, { y: 10 }, { y: 0, stagger: 0.06 });
      OUT("#ai-encA, #ai-eq0", at(5, 0.6), 0.3);
      IN("#ai-encB, #ai-ne0", at(5, 0.64), 0.4);
      tl.to("#ai-cR rect", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.66));
      tl.to(".ai-chip", { fill: "#FC6255", duration: 0.25, stagger: 0.08 }, at(5, 0.74));
      IN("#ai-fail", at(5, 0.84), 0.5);
      // L6 算一算：100 万个地址
      OUT("#ai-cL, #ai-cR, #ai-encB, #ai-ne0, #ai-eq1, #ai-eq2, #ai-pfl, .ai-chip, #ai-fail", at(6, 0), 0.4);
      IN("#ai-k1", at(6, 0.04), 0.5);
      IN("#ai-k2", at(6, 0.13), 0.5, { x: -16 }, { x: 0 });
      IN("#ai-k3", at(6, 0.26), 0.5, { x: -16 }, { x: 0 });
      IN("#ai-k4", at(6, 0.42), 0.5);
      tl.fromTo("#ai-kb1", { opacity: 1, attr: { width: 0 } }, { attr: { width: 1500 }, duration: 1.4, ease: "power2.out", immediateRender: false }, at(6, 0.46));
      IN("#ai-k5", at(6, 0.7), 0.5);
      tl.fromTo("#ai-kb2", { opacity: 1, attr: { width: 0 } }, { attr: { width: 10 }, duration: 0.4, immediateRender: false }, at(6, 0.74));
      tl.to("#ai-kb2", { fill: "#83C167", duration: 0.3 }, at(6, 0.88));

      tl.to("#ai-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ai-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["airdrop"] = tl;
    })();
  </script>
</template>
