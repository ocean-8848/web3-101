      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
      // L0 钩子问题
      IN("#re-q", at(0, 0.05), 0.8, { scale: 0.9, svgOrigin: "960 500" }, { scale: 1, svgOrigin: "960 500" });

      // L1 流水线
      OUT("#re-qu", at(1, 0), 0.3);
      tl.to("#re-q", { attr: { y: 220 }, duration: 0.7, ease: "power2.inOut" }, at(1, 0));
      const NT = [0.04, 0.12, 0.2, 0.32, 0.45, 0.6, 0.7];
      NT.forEach((f, i) => {
        IN(`#re-n${i}, #re-n${i}t`, at(1, f), 0.45);
        if (i > 0) ARROW(`#re-a${i - 1}`, at(1, f) - 0.25, 0.3);

      IN("#re-chain", at(1, 0.84), 0.5);

        IN(`#re-fc${k}, #re-ft${k}`, at(ln, 0.42), 0.5);
        DRAW(`#re-fk${k}`, at(ln, 0.48), 0.4);
        tl.to(`#re-mc${k}, #re-mx${k}, #re-mt${k}`, { opacity: 0.55, duration: 0.5 }, at(ln, 0.64));
        tl.to(`#re-fc${k}`, { fill: "rgba(131,193,103,.14)", duration: 0.5 }, at(ln, 0.84));
