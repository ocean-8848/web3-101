    (function () {

      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const BANDS = ["#gr-b1", "#gr-b2", "#gr-b3"];
      const BAND = (on, t) => BANDS.forEach((s, i) => tl.to(s, { opacity: on.includes(i + 1) ? 1 : 0.3, duration: 0.35 }, t));
      const CMD = (g, n, t, gap = 0.1) => { for (let i = 0; i < n; i++) IN(`#${g}-${i}`, t + i * gap * 3, 0.4, { x: -16 }, { x: 0 }); };
      // L0
      IN("#gr-pn", at(0, 0.1), 0.5);
      IN("#gr-b1", at(0, 0.62), 0.4, { x: -20 }, { x: 0 });
      IN("#gr-b2", at(0, 0.76), 0.4, { x: -20 }, { x: 0 });
      IN("#gr-b3", at(0, 0.88), 0.4, { x: -20 }, { x: 0 });
      // L1 witness
      BAND([2], at(1, 0.02));
      CMD("gr-k1", 2, at(1, 0.06), 0.15);
      IN("#gr-wasm", at(1, 0.5), 0.4); IN("#gr-inp", at(1, 0.15), 0.4);
      ARROW("#gr-a1", at(1, 0.6), 0.4); ARROW("#gr-a2", at(1, 0.6), 0.4);
      IN("#gr-wit", at(1, 0.72), 0.4);
      // L2 phase 1
      BAND([1], at(2, 0.0));
      OUT("#gr-k1, #gr-v1", at(2, 0.0), 0.35);
      CMD("gr-k2", 3, at(2, 0.05), 0.05);
      tl.to("#gr-12", { fill: "#FF9F43", duration: 0.3 }, at(2, 0.42));
      IN("#gr-pow", at(2, 0.45), 0.5, { scale: 0.7, svgOrigin: "590 380" }, { scale: 1, svgOrigin: "590 380" });
      IN("#gr-cap", at(2, 0.56), 0.4);
      IN("#gr-prod", at(2, 0.8), 0.4);
      // L3 phase 2
      OUT("#gr-k2, #gr-v2", at(3, 0.0), 0.35);
      CMD("gr-k3", 3, at(3, 0.05), 0.12);
      IN("#gr-r1cs", at(3, 0.1), 0.4); IN("#gr-ptau", at(3, 0.16), 0.4);
      ARROW("#gr-a3", at(3, 0.26), 0.4); ARROW("#gr-a4", at(3, 0.26), 0.4);
      IN("#gr-z0", at(3, 0.32), 0.4);
      ARROW("#gr-a5", at(3, 0.46), 0.3);
      IN("#gr-dice", at(3, 0.5), 0.5, { scale: 0.5, svgOrigin: "600 535" }, { scale: 1, svgOrigin: "600 535", ease: "back.out(2)" });
      ARROW("#gr-a6", at(3, 0.66), 0.3);
      IN("#gr-zf", at(3, 0.7), 0.4);
      ARROW("#gr-a7", at(3, 0.84), 0.3);
      IN("#gr-vk", at(3, 0.88), 0.4);
      // L4 prove + verify
      BAND([2, 3], at(4, 0.0));
      OUT("#gr-k3, #gr-v3", at(4, 0.0), 0.35);
      IN("#gr-k4-0", at(4, 0.06), 0.4, { x: -16 }, { x: 0 });
      IN("#gr-pz", at(4, 0.1), 0.4); IN("#gr-pw", at(4, 0.14), 0.4);
      IN("#gr-pd", at(4, 0.24), 0.4);
      ARROW("#gr-a8", at(4, 0.34), 0.4); ARROW("#gr-a9", at(4, 0.34), 0.4);
      IN("#gr-pp", at(4, 0.42), 0.4); IN("#gr-pu", at(4, 0.48), 0.4);
      IN("#gr-k4-1", at(4, 0.68), 0.4, { x: -16 }, { x: 0 });
      IN("#gr-k4-2", at(4, 0.86), 0.4, { scale: 0.5, svgOrigin: "1000 370" }, { scale: 1, svgOrigin: "1000 370", ease: "back.out(2)" });
      // L5 open the files
      BAND([2], at(5, 0.0));
      OUT("#gr-v4", at(5, 0.0), 0.35);
      IN("#gr-cpub", at(5, 0.1), 0.5);
      IN("#gr-cprf", at(5, 0.36), 0.5);
      IN("#gr-d1", at(5, 0.46), 0.3); IN("#gr-d2", at(5, 0.52), 0.3); IN("#gr-d3", at(5, 0.58), 0.3);
      const tx = at(5, 0.72);
      IN("#gr-xg", tx, 0.4, { x: 200 }, { x: 0 });
      tl.to("#gr-xg", { x: -130, duration: 0.35, ease: "power2.in" }, tx + 0.45);
      tl.to("#gr-xg", { x: -30, duration: 0.45, ease: "back.out(2)" }, tx + 0.8);
      IN("#gr-xx", tx + 0.9, 0.25);
      // L6 export
      BAND([3], at(6, 0.0));
      OUT("#gr-k4, #gr-v5", at(6, 0.0), 0.35);
      IN("#gr-k6-0", at(6, 0.06), 0.4, { x: -16 }, { x: 0 });
      IN("#gr-sol", at(6, 0.22), 0.5);
      IN("#gr-k6-1", at(6, 0.5), 0.4, { x: -16 }, { x: 0 });
      IN("#gr-cd", at(6, 0.66), 0.5);
      // L7 ceremony
      BAND([1], at(7, 0.0));
      OUT("#gr-pn, #gr-k6, #gr-v6", at(7, 0.0), 0.4);
