      // L3 CSR：白屏转圈 → 交互界面；首屏慢
      DROP(3, 400, "#58C4DD", at(3, 0.0));
      IN("#rr-cb", at(3, 0.08), 0.5); IN("#rr-white", at(3, 0.1), 0.4); IN("#rr-spin", at(3, 0.12), 0.3); IN("#rr-load", at(3, 0.14), 0.4);

      OUT("#rr-spin", at(3, 0.45), 0.3); OUT("#rr-load", at(3, 0.45), 0.3); OUT("#rr-white", at(3, 0.47), 0.4);
      IN("#rr-ui", at(3, 0.5), 0.6, { scale: 0.96, svgOrigin: "1520 607" }, { scale: 1, svgOrigin: "1520 607" });

      IN("#rr-mix", at(4, 0.05), 0.6); IN("#rr-hp", at(4, 0.06), 0.6);
      IN("#rr-top", at(4, 0.12), 0.6);
      IN("#rr-bot", at(4, 0.3), 0.6);
      IN("#rr-topt", at(4, 0.52), 0.5); IN("#rr-bott", at(4, 0.66), 0.5);
      IN("#rr-stamp", at(4, 0.84), 0.45, { scale: 1.5, svgOrigin: "960 792" }, { scale: 1, svgOrigin: "960 792", ease: "back.out(2)" });
      // L5 水合：HTML 纸页递到浏览器，React 逻辑接线点亮

      IN("#rr-term", at(5, 0.05), 0.5);
      IN("#rr-hs", at(5, 0.08), 0.5); IN("#rr-hsl", at(5, 0.08), 0.5); IN("#rr-hb", at(5, 0.12), 0.5);

      tl.to("#rr-sh", { x: 0, duration: 1.2, ease: "power2.inOut" }, at(5, 0.3));
      IN("#rr-rx", at(5, 0.55), 0.5);
      [1, 2, 3].forEach((k, j) => { DRAW(`#rr-w${k}`, at(5, 0.62 + j * 0.08), 0.5); tl.to(`#rr-e${k}`, { stroke: "#58C4DD", fill: "#58C4DD33", duration: 0.3 }, at(5, 0.62 + j * 0.08) + 0.45); });
      OUT("#rr-term", at(5, 0.85), 0.4);

      IN("#rr-t", at(6, 0.06), 0.5);
