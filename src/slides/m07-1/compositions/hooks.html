      IN("#hs-big", at(3, 0.3), 0.4);
      ARROW("#hs-ma", at(3, 0.38), 0.3);
      IN("#hs-gear", at(3, 0.42), 0.3);
      tl.to("#hs-gearr", { rotation: 240, svgOrigin: "1660 610", duration: 1.0, ease: "power1.inOut" }, at(3, 0.45));
      ARROW("#hs-mb", at(3, 0.58), 0.2);
      IN("#hs-out", at(3, 0.6), 0.4);
      tl.to("#hs-big", { fill: "#ffe08a", duration: 0.2, yoyo: true, repeat: 1 }, at(3, 0.76));
      IN("#hs-chk", at(3, 0.8), 0.3, { scale: 0.5, svgOrigin: "1743 728" }, { scale: 1, svgOrigin: "1743 728" });

      // L4：组合成自定义 Hook

      tl.to("#hs-k0", { x: 380, y: 265, opacity: 0, duration: 0.7, ease: "power2.in" }, at(4, 0.12));
      tl.to("#hs-k1", { y: 513, opacity: 0, duration: 0.7, ease: "power2.in" }, at(4, 0.12));
      tl.to("#hs-k2", { x: -380, y: 265, opacity: 0, duration: 0.7, ease: "power2.in" }, at(4, 0.12));
      tl.to("#hs-sl0, #hs-sl1, #hs-sl2", { fill: "#2a2f3a", stroke: "#8a8f99", duration: 0.4 }, at(4, 0.2));

      tl.to("#hs-sl3", { fill: "#58C4DD", stroke: "#58C4DD", duration: 0.3 }, at(4, 0.4));
