      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0：浏览器 → 前端 DApp → 钱包
      IN("#pi-brw, #pi-brwt", at(0, 0.05), 0.6);

      IN("#pi-w2", at(1, 0.62), 0.5, { y: 14 }, { y: 0 });

      // L2：RPC 术语卡，路径 ① 读
      IN("#pi-term", at(2, 0.02), 0.5);
      ARROW("#pi-r1a", at(2, 0.18), 0.7);
      ARROW("#pi-r1b", at(2, 0.3), 0.4);
      IN("#pi-l1", at(2, 0.22), 0.4);
      [0, 1, 2].forEach(k => {
        const t = at(2, 0.36) + k * 0.25;
        tl.fromTo("#pi-d" + k, { opacity: 1, attr: { cx: 640 } }, { attr: { cx: 1560 }, duration: 1.4, ease: "none", immediateRender: false }, t);
        tl.to("#pi-d" + k, { opacity: 0, duration: 0.15 }, t + 1.4);
      });
      IN("#pi-bal", at(2, 0.72), 0.3);
      tl.fromTo("#pi-bal", { attr: { x: 1500 } }, { attr: { x: 1020 }, duration: 1.0, ease: "power2.out", immediateRender: false }, at(2, 0.72));
      tl.set("#pi-d0, #pi-d1, #pi-d2", { opacity: 0 }, at(2, 0.3));

      // L3：钱包术语卡，② 签名，③ 广播
      OUT("#pi-term", at(3, 0.0), 0.3);
      IN("#pi-term2", at(3, 0.06), 0.5);
      IN("#pi-mm, #pi-rb", at(3, 0.1), 0.5);
      tl.set("#pi-envm", { x: 560, y: 620 }, 0);
      IN("#pi-env", at(3, 0.2), 0.4, { scale: 0.5, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0" });
      IN("#pi-l2", at(3, 0.22), 0.4);
      tl.to("#pi-envm", { x: 770, duration: 0.7, ease: "power2.inOut" }, at(3, 0.32));
      IN("#pi-stamp", at(3, 0.45), 0.25, { scale: 2, svgOrigin: "22 14" }, { scale: 1, svgOrigin: "22 14" });
      tl.to("#pi-env rect", { stroke: "#FF9F43", duration: 0.2 }, at(3, 0.47));
      ARROW("#pi-w3", at(3, 0.55), 0.8);
      IN("#pi-l3", at(3, 0.58), 0.4);
      ARROW("#pi-w3b", at(3, 0.7), 0.4);
      tl.to("#pi-envm", { y: 560, duration: 0.3, ease: "power1.inOut" }, at(3, 0.6));
      tl.to("#pi-envm", { x: 1340, duration: 0.7, ease: "power1.inOut" }, at(3, 0.6) + 0.3);
      tl.to("#pi-envm", { y: 400, duration: 0.4, ease: "power1.inOut" }, at(3, 0.6) + 1.0);
      tl.to("#pi-envm", { x: 1690, duration: 0.6, ease: "power1.inOut" }, at(3, 0.6) + 1.4);
      OUT("#pi-env", at(3, 0.6) + 2.0, 0.3);
      OUT("#pi-term2", at(4, 0.0), 0.4);

      // L4：可选后端 ④ 查历史
      IN("#pi-be", at(4, 0.15), 0.6, { scale: 0.9, svgOrigin: "1280 780" }, { scale: 1, svgOrigin: "1280 780" });
      IN("#pi-bet", at(4, 0.22), 0.4);
      IN("#pi-bes", at(4, 0.32), 0.4);
      ARROW("#pi-h4a", at(4, 0.5), 0.5);
      ARROW("#pi-h4b", at(4, 0.62), 0.6);
      IN("#pi-l4", at(4, 0.66), 0.4);

      // L5：图淡成背景，叠加银行网点

      tl.to("#pi-shp", { opacity: 0.3, duration: 0.5 }, at(5, 0.0));
      IN("#pi-bk0", at(5, 0.18), 0.5, { y: -20 }, { y: 0 });
      IN("#pi-bk1", at(5, 0.36), 0.5, { y: -20 }, { y: 0 });

      IN("#pi-bk3", at(5, 0.78), 0.5, { y: -20 }, { y: 0 });
