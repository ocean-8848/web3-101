    (function () {
      const C = /*CUES*/{}/*END*/;

      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const PN = {"pe-pn":[236,40]};
      const HL = (pid, k, t, n = 1) => { const [y0, lh] = PN[pid];
        tl.to("#" + pid + "-hl, #" + pid + "-hlb", { opacity: 1, attr: { y: y0 + (k - 1) * lh, height: n * lh }, duration: 0.35, ease: "power2.out" }, t); };
      const SET = (s, t, v) => tl.to(s, { ...v, duration: 0.4, ease: "power2.out" }, t);
      const OUTALL = (arr, t, d = 0.4) => arr.forEach(s => OUT(s, t, d));

      // L0 aggregator
      IN("#pe-term", at(0, 0.3));
      IN("#pe-src", at(0, 0.1));
      DRAW("#pe-l1", at(0, 0.25)); DRAW("#pe-l2", at(0, 0.3)); DRAW("#pe-l3", at(0, 0.35));
      IN("#pe-agg", at(0, 0.3), 0.6, { scale: 0.6, svgOrigin: "640 540" }, { scale: 1, svgOrigin: "640 540" });
      ARROW("#pe-a0", at(0, 0.55));
      IN("#pe-env0", at(0, 0.6)); IN("#pe-envl", at(0, 0.62));
      IN("#pe-p2", at(0, 0.8));
      IN("#pe-0x", at(0, 0.7));
      // L1 Permit2 flow + code
      OUT("#pe-g0", at(1, 0)); OUT("#pe-term", at(1, 0));
      IN("#pe-pn", at(1, 0.05));
      HL("pe-pn", 5, at(1, 0.1), 5);
      IN("#pe-sa", at(1, 0.12));
      ARROW("#pe-a1", at(1, 0.3));
      IN("#pe-sb", at(1, 0.36));
      IN("#pe-dl", at(1, 0.58));
      IN("#pe-d1", at(1, 0.6), 0.5, { x: -30 }, { x: 0 });
      HL("pe-pn", 7, at(1, 0.62), 2);
      IN("#pe-d2", at(1, 0.7), 0.5, { x: -30 }, { x: 0 });
      IN("#pe-d3", at(1, 0.8), 0.5, { x: -30 }, { x: 0 });
      HL("pe-pn", 10, at(1, 0.9), 2);
      // L2 whitelist gate
      OUT("#pe-g1", at(2, 0));
      HL("pe-pn", 1, at(2, 0.05), 3);
      IN("#pe-gate", at(2, 0.1));
      IN("#pe-eA", at(2, 0.15));
      tl.to("#pe-eA", { x: 340, duration: 1.0, ease: "power2.inOut" }, at(2, 0.28));
      IN("#pe-okA", at(2, 0.42));
      IN("#pe-eB0", at(2, 0.5));
      tl.to("#pe-eB", { x: 80, duration: 0.5, ease: "power2.in" }, at(2, 0.58));
      tl.to("#pe-eB", { x: 0, duration: 0.5, ease: "power2.out" }, at(2, 0.58) + 0.5);
      IN("#pe-xB", at(2, 0.7)); IN("#pe-msgB", at(2, 0.72));
      // L3 decode + simulate + wallet
      OUTALL(["#pe-pn", "#pe-gate", "#pe-eB", "#pe-xB", "#pe-msgB"], at(3, 0));
      ARROW("#pe-a3", at(3, 0.08));
      IN("#pe-dec", at(3, 0.12));
      IN("#pe-bars", at(3, 0.25));
      IN("#pe-sim", at(3, 0.45));
      ARROW("#pe-a4", at(3, 0.7)); IN("#pe-wal", at(3, 0.75));
      // L4 human-readable signature
      OUTALL(["#pe-g2", "#pe-g3"], at(4, 0));
      IN("#pe-raw", at(4, 0.06));
      ARROW("#pe-a5", at(4, 0.2));
