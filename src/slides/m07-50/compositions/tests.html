  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const PN = {"te-pn":[256,40]};
      const HL = (pid, k, t, n = 1) => { const [y0, lh] = PN[pid];
        tl.to("#" + pid + "-hl, #" + pid + "-hlb", { opacity: 1, attr: { y: y0 + (k - 1) * lh, height: n * lh }, duration: 0.35, ease: "power2.out" }, t); };
      const SET = (s, t, v) => tl.to(s, { ...v, duration: 0.4, ease: "power2.out" }, t);
      const OUTALL = (arr, t, d = 0.4) => arr.forEach(s => OUT(s, t, d));

      const LVS = (act, t) => { for (let i = 0; i < 6; i++) { const on = act.includes(i);
        SET("#te-l" + i + "r", t, { attr: { stroke: on ? "#58C4DD" : "#2a2f3a", "fill-opacity": on ? 0.18 : 0.06 } }); } };
      const CK = (s, t) => IN(s, t, 0.4, { scale: 0.4 }, { scale: 1, transformOrigin: "50% 50%" });
      // L0 tower grows
      IN("#te-ttl", at(0, 0.05));
      for (let i = 0; i < 6; i++) IN("#te-l" + i, at(0, 0.12 + 0.12 * i), 0.5, { y: 20 }, { y: 0 });
      // L1 unit
      LVS([0], at(1, 0));
      for (let k = 0; k < 4; k++) { IN("#te-u" + k, at(1, 0.05 + 0.18 * k)); CK("#te-uc" + k, at(1, 0.15 + 0.18 * k)); }
      // L2 property
      OUT("#te-g1", at(2, 0)); LVS([1], at(2, 0));
      IN("#te-pipe", at(2, 0.05));
      for (let k = 0; k < 5; k++) {
        const t0 = at(2, 0.1 + 0.07 * k);
        tl.fromTo("#te-r" + k, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4 }, t0);
        tl.to("#te-r" + k, { y: 150, opacity: 0, duration: 0.7, ease: "power2.in" }, t0 + 0.9);
      }
      ARROW("#te-pa", at(2, 0.5)); IN("#te-eq", at(2, 0.55)); CK("#te-eqc", at(2, 0.6));
      IN("#te-mo", at(2, 0.72)); CK("#te-moc", at(2, 0.8));
      // L3 component
      OUT("#te-g2", at(3, 0)); LVS([2], at(3, 0));
      IN("#te-btn", at(3, 0.05));
      for (let k = 0; k < 5; k++) {
        const t0 = at(3, 0.1 + 0.15 * k);
        IN("#te-b" + k, t0, 0.3);
        if (k < 4) OUT("#te-b" + k, t0 + 1.0, 0.25);
        IN("#te-bd" + k, t0 + 0.3, 0.3); CK("#te-bc" + k, t0 + 0.35);
      }
      IN("#te-b5", at(3, 0.88));
      // L4 E2E fork
      OUT("#te-g3", at(4, 0)); LVS([3], at(4, 0));
      IN("#te-main", at(4, 0.05));
      DRAW("#te-fk", at(4, 0.15)); tl.set("#te-fk", { opacity: 1 }, at(4, 0.15));
      IN("#te-fb", at(4, 0.22)); IN("#te-uni", at(4, 0.32));
      for (let k = 0; k < 3; k++) { IN("#te-e" + k, at(4, 0.48 + 0.15 * k)); CK("#te-ec" + k, at(4, 0.55 + 0.15 * k)); }
      // L5 tricky cases
      OUT("#te-g4", at(5, 0));
      IN("#te-k4", at(5, 0.03)); IN("#te-me", at(5, 0.06)); IN("#te-me1", at(5, 0.06));
      IN("#te-big", at(5, 0.15), 0.5, { y: -60 }, { y: 0 });
      OUT("#te-me1", at(5, 0.3), 0.25); IN("#te-me2", at(5, 0.32));
      SET("#te-mer", at(5, 0.3), { attr: { stroke: "#FC6255", fill: "#FC6255" } });
      IN("#te-toast", at(5, 0.38)); IN("#te-exp", at(5, 0.45));
      IN("#te-k6", at(5, 0.56)); IN("#te-am", at(5, 0.6)); IN("#te-st1", at(5, 0.68));
      IN("#te-mine", at(5, 0.8)); OUT("#te-st1", at(5, 0.86), 0.25); IN("#te-st2", at(5, 0.88));
      // L6 snapshot code
      OUTALL(["#te-g5", "#te-tw"], at(6, 0));
      IN("#te-pn", at(6, 0.05));
      IN("#te-ch", at(6, 0.06));
      HL("te-pn", 3, at(6, 0.1), 2);
      IN("#te-cam", at(6, 0.14)); IN("#te-sv", at(6, 0.18));
      HL("te-pn", 5, at(6, 0.3), 2);
      for (let k = 0; k < 3; k++) {
        const t0 = at(6, 0.35 + 0.15 * k);
        ARROW("#te-bp" + k, t0, 0.4); IN("#te-bb" + k, t0 + 0.3); IN("#te-bl" + k, t0 + 0.1);
        tl.to("#te-bb" + k, { opacity: 0.25, duration: 0.4 }, t0 + 1.1); CK("#te-bk" + k, t0 + 1.1);
      }
      HL("te-pn", 7, at(6, 0.82), 6);
      // L7 load + fault injection
      OUTALL(["#te-pn", "#te-g6"], at(7, 0));
      tl.to("#te-tw", { opacity: 1, duration: 0.5 }, at(7, 0.04)); LVS([4, 5], at(7, 0.04));
      IN("#te-k6n", at(7, 0.08));
      IN("#te-f1", at(7, 0.12)); ARROW("#te-fa1", at(7, 0.2)); IN("#te-f1b", at(7, 0.25));
      IN("#te-f2", at(7, 0.36)); IN("#te-tm", at(7, 0.42)); ARROW("#te-fa2", at(7, 0.5)); IN("#te-f2b", at(7, 0.54));
      IN("#te-f3", at(7, 0.66)); ARROW("#te-fa3", at(7, 0.72)); IN("#te-f3b", at(7, 0.76));
      IN("#te-f3c", at(7, 0.84)); IN("#te-f3x", at(7, 0.88));

      window.__timelines["tests"] = tl;
