  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const MV = (sel, pts, t, d, ease = "none") => { const n = pts.length; pts.forEach((p, i) => tl.to(sel, { attr: { cx: p[0], cy: p[1] }, duration: d / n, ease }, t + i * d / n)); };
      const BZ = (a, b, c, e, n = 10) => { const r = []; for (let i = 1; i <= n; i++) { const u = i / n, v = 1 - u; r.push([v*v*v*a[0] + 3*v*v*u*b[0] + 3*v*u*u*c[0] + u*u*u*e[0], v*v*v*a[1] + 3*v*v*u*b[1] + 3*v*u*u*c[1] + u*u*u*e[1]]); } return r; };
      const NC = { dis: "#8a8f99", con: "#58C4DD", net: "#FF9F43", wait: "#FF9F43", pend: "#FF9F43", spd: "#FF9F43", inc: "#83C167", fin: "#83C167", rev: "#FC6255" };
      const LIT = (k, t, d = 0.5) => { tl.to(`#tx-n-${k} rect`, { attr: { stroke: NC[k] }, duration: d }, t); tl.to(`#tx-n-${k} text`, { attr: { fill: "#e8e6df" }, duration: d }, t); };
      const FLASH = (k, t) => tl.fromTo(`#tx-n-${k} rect`, { attr: { "stroke-width": 9 } }, { attr: { "stroke-width": 3 }, duration: 0.7, ease: "power2.out", immediateRender: false }, t);
      const CLICK = (x, y, t) => { tl.set("#tx-rip", { attr: { cx: x, cy: y, r: 8 }, opacity: 0.9 }, t); tl.to("#tx-rip", { attr: { r: 36 }, opacity: 0, duration: 0.35, ease: "power2.out" }, t); };

      // L0 转圈圈 + 连点三次
      IN("#tx-title", at(0, 0), 0.6);
      IN("#tx-btn", at(0, 0.02), 0.5);
      tl.fromTo("#tx-spin", { rotation: 0 }, { rotation: 1440, svgOrigin: "860 610", duration: 4.2, ease: "none" }, at(0, 0.05));
      IN("#tx-cur", at(0, 0.1), 0.3, { x: 1060, y: 520 }, { x: 990, y: 456 });
      [0.18, 0.27, 0.36].forEach((f, i) => {
        CLICK(992, 458, at(0, f));
        tl.fromTo("#tx-btn rect", { attr: { "stroke-width": 7 } }, { attr: { "stroke-width": 3 }, duration: 0.3, immediateRender: false }, at(0, f));
        IN(`#tx-dup${i}`, at(0, f) + 0.1, 0.35, { x: -40 }, { x: 0 });
      });
      OUT(["#tx-btn", "#tx-cur", "#tx-dup0", "#tx-dup1", "#tx-dup2"], at(0, 0.5), 0.4);
      ["dis", "con", "net", "wait", "pend", "spd", "inc", "fin", "rev"].forEach((k, i) => IN(`#tx-n-${k}`, at(0, 0.56) + i * 0.1, 0.4));
      LIT("inc", at(0, 0.7)); LIT("rev", at(0, 0.7)); FLASH("inc", at(0, 0.7)); FLASH("rev", at(0, 0.7));
      ["dis", "con", "net", "wait", "pend", "spd", "fin"].forEach((k, i) => LIT(k, at(0, 0.84) + i * 0.06));
      ["e1", "e2", "e9", "e10", "e3", "e4", "e6", "e7", "e5", "e8"].forEach((k, i) => ARROW(`#tx-${k}`, at(0, 0.84) + i * 0.05, 0.4));

      // L1 拒签 4001
      tl.to("#tx-dot", { opacity: 1, duration: 0.3 }, at(1, 0));
      MV("#tx-dot", [[820, 268]], at(1, 0.06), 0.6, "power2.inOut");
      IN("#tx-pop", at(1, 0.2), 0.4, { y: 16 }, { y: 0 });
      IN("#tx-cur", at(1, 0.3), 0.3, { x: 800, y: 260 }, { x: 772, y: 200 });
      CLICK(775, 201, at(1, 0.42));
      tl.to("#tx-rejb", { attr: { stroke: "#FF9F43", "stroke-width": 4 }, duration: 0.2 }, at(1, 0.42));
      OUT(["#tx-pop", "#tx-cur"], at(1, 0.52), 0.3);
      ARROW("#tx-rej", at(1, 0.52), 0.6);
      MV("#tx-dot", [[800, 334]], at(1, 0.55), 0.25);
      MV("#tx-dot", BZ([800, 334], [760, 420], [560, 420], [524, 338], 8), at(1, 0.6), 1.0, "none");
      IN("#tx-rejl", at(1, 0.58), 0.4);
      FLASH("con", at(1, 0.78));
      IN("#tx-rejok", at(1, 0.8), 0.4);

      // L2 加速替换，hash 变了
      MV("#tx-dot", [[480, 268]], at(2, 0), 0.3);
      MV("#tx-dot", [[820, 268]], at(2, 0.05), 0.5, "power2.inOut");
      FLASH("wait", at(2, 0.1));
      MV("#tx-dot", [[1180, 268]], at(2, 0.14), 0.6, "power2.inOut");
      FLASH("pend", at(2, 0.22));
      IN("#tx-h1", at(2, 0.22), 0.4);
      MV("#tx-dot", [[1180, 488]], at(2, 0.38), 0.6, "power2.inOut");
      OUT("#tx-h1", at(2, 0.38), 0.3);
      FLASH("spd", at(2, 0.46));
      IN("#tx-h2", at(2, 0.46), 0.4);
      tl.fromTo("#tx-h2", { attr: { fill: "#ffffff" } }, { attr: { fill: "#FF9F43" }, duration: 0.8, immediateRender: false }, at(2, 0.5));
      IN("#tx-wa", at(2, 0.58), 0.5, { y: 20 }, { y: 0 });
      tl.fromTo("#tx-spin2", { rotation: 0 }, { rotation: 1080, svgOrigin: "230 776", duration: 3.6, ease: "none" }, at(2, 0.6));
      IN("#tx-wax", at(2, 0.78), 0.3);
      IN("#tx-wb", at(2, 0.72), 0.5, { y: 20 }, { y: 0 });

      // L3 Revert
      OUT(["#tx-wa", "#tx-wb", "#tx-h2", "#tx-dot"], at(3, 0), 0.4);
      tl.to("#tx-dot2", { opacity: 1, duration: 0.3 }, at(3, 0.06));
      MV("#tx-dot2", [[1458, 724]], at(3, 0.1), 0.9, "power2.inOut");
      FLASH("rev", at(3, 0.26));
