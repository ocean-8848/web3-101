  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0：术语卡 + 三层积木自下而上
      IN("#rw-term", at(0, 0.05), 0.5);
      IN("#rw-bv", at(0, 0.2), 0.6, { y: 40 }, { y: 0 });
      IN("#rw-bw", at(0, 0.55), 0.6, { y: 40 }, { y: 0 });
      IN("#rw-br", at(0, 0.85), 0.6, { y: 40 }, { y: 0 });

      // L1：积木收到左侧，代码面板 + 四步卡
      const t1 = at(1, 0), E = "power2.inOut";
      [["v", 512, 568], ["w", 406, 462], ["r", 300, 356]].forEach(([k, y, ty]) => {
        tl.to(`#rw-b${k}r`, { attr: { x: 80, y, width: 540, height: 90 }, duration: 0.8, ease: E }, t1);
        tl.to(`#rw-b${k}t`, { attr: { x: 350, y: ty, "font-size": 30 }, duration: 0.8, ease: E }, t1);
      });
      IN("#rw-code", t1 + 0.4, 0.6);
      for (let i = 0; i < 8; i++) IN(`#rw-c${i}`, t1 + 0.5 + i * 0.08, 0.4);
      const HL = (y0, n, t) => tl.to("#rw-hl", { attr: { y: 251 + 41 * y0, height: 41 * n }, opacity: 1, duration: 0.4, ease: E }, t);
      const STEP = (k, t) => {
        IN(`#rw-s${k}`, t, 0.5, { y: 20 }, { y: 0 });
        tl.to(`#rw-s${k}r`, { stroke: "#58C4DD", duration: 0.3 }, t + 0.1);
        if (k > 1) tl.to(`#rw-s${k - 1}r`, { stroke: "#3a3f4b", duration: 0.3 }, t + 0.1);
      };
      HL(0, 1, at(1, 0.12)); STEP(1, at(1, 0.12));
      HL(1, 2, at(1, 0.3)); STEP(2, at(1, 0.3));
      HL(3, 4, at(1, 0.6)); STEP(3, at(1, 0.6));
      HL(7, 1, at(1, 0.76)); STEP(4, at(1, 0.76));
      OUT("#rw-term", at(1, 0.74), 0.3);
      IN("#rw-term2", at(1, 0.8), 0.5);

      // L2：第 ③ 步放大：模拟失败 → 不弹钱包 → 不白付 Gas
      OUT("#rw-code", at(2, 0), 0.4);
      tl.to("#rw-s4r", { stroke: "#3a3f4b", duration: 0.3 }, at(2, 0));
      tl.to("#rw-s3r", { stroke: "#FC6255", duration: 0.3 }, at(2, 0.2));
      IN("#rw-sbox", at(2, 0.1), 0.5, { scale: 0.9, svgOrigin: "890 425" }, { scale: 1, svgOrigin: "890 425" });
      tl.to("#rw-sboxr", { stroke: "#FC6255", duration: 0.3 }, at(2, 0.22));
      IN("#rw-sfail", at(2, 0.24), 0.4);
      ARROW("#rw-sarr", at(2, 0.4), 0.5);
      IN("#rw-swal", at(2, 0.48), 0.5);
      IN("#rw-swalt", at(2, 0.55), 0.4);
      IN("#rw-flame", at(2, 0.72), 0.5, { scale: 0.6, svgOrigin: "1660 480" }, { scale: 1, svgOrigin: "1660 480" });
      IN("#rw-flamet", at(2, 0.8), 0.4);
      OUT("#rw-term2", at(2, 0.9), 0.3);

      // L3：精度陷阱 → bigint + decimals
      const t3 = at(3, 0);
      OUT("#rw-stack", t3, 0.4); OUT("#rw-steps", t3, 0.4); OUT("#rw-sim", t3, 0.4);
      IN("#rw-n53", at(3, 0.12), 0.5);
      IN("#rw-eq", at(3, 0.3), 0.6, { scale: 0.9, svgOrigin: "960 420" }, { scale: 1, svgOrigin: "960 420" });
      tl.fromTo("#rw-eqt", { fill: "#FC6255" }, { fill: "#ffffff", duration: 0.25, repeat: 5, yoyo: true, immediateRender: false }, at(3, 0.42));
      OUT("#rw-eq", at(3, 0.64), 0.4); OUT("#rw-n53", at(3, 0.64), 0.4);
      IN("#rw-big", at(3, 0.7), 0.6, { x: -40 }, { x: 0 });
      IN("#rw-dec", at(3, 0.8), 0.5, { x: 40 }, { x: 0 });
      IN("#rw-rule", at(3, 0.88), 0.5);

      // L4：算一算 25 USDC
      const t4 = at(4, 0);
      OUT("#rw-prec", t4, 0.4);
      IN("#rw-ct", at(4, 0.03), 0.5);
      IN("#rw-c25", at(4, 0.24), 0.5, { scale: 0.9, svgOrigin: "340 435" }, { scale: 1, svgOrigin: "340 435" });
      IN("#rw-cal", at(4, 0.36), 0.4);
      ARROW("#rw-carr", at(4, 0.38), 0.6);
      IN("#rw-cres", at(4, 0.48), 0.3);
      COUNT("#rw-cres", 0, 25000000, at(4, 0.48), 1.4, v => Math.round(v).toLocaleString("en-US"));
      IN("#rw-cw", at(4, 0.7), 0.4);
      IN("#rw-cwn", at(4, 0.74), 0.5, { x: -30 }, { x: 0 });
      IN("#rw-cx", at(4, 0.86), 0.5);

      tl.to("#rw-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#rw-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["rw"] = tl;
    })();
