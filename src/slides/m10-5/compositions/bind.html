      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
// L0 public fields with question marks
IN("#bi-hd", at(0, 0.03), 0.4);
for (let k = 0; k < 3; k++) {
  IN("#bi-f" + k, at(0, 0.1 + 0.12 * k), 0.5, { scale: 0.6, svgOrigin: [520, 960, 1400][k] + " 510" }, { scale: 1, svgOrigin: [520, 960, 1400][k] + " 510" });
  IN("#bi-q" + k, at(0, 0.55 + 0.08 * k), 0.4, { y: -15 }, { y: 0 });
}
// L1 mempool: attacker copies proof, swaps recipient, raises gas
OUT("#bi-hd, #bi-f0, #bi-f1, #bi-f2, #bi-q0, #bi-q1, #bi-q2", at(1, 0.0), 0.4);
IN("#bi-cl", at(1, 0.04), 0.5);

IN("#bi-rb2", at(1, 0.55) + 0.35, 0.3);

// L2 race into the block
OUT("#bi-cp, #bi-atk", at(2, 0.0), 0.3);
IN("#bi-blk", at(2, 0.04), 0.4);
tl.to("#bi-tb, #bi-rb2", { x: -260, y: 390, duration: 0.8, ease: "power2.inOut" }, at(2, 0.1));
IN("#bi-rec", at(2, 0.3), 0.4);
tl.to("#bi-ta", { x: -140, y: 380, duration: 0.8, ease: "power2.inOut" }, at(2, 0.45));
tl.to("#bi-ta", { opacity: 0.45, duration: 0.4 }, at(2, 0.45) + 0.8);
tl.to("#bi-tar", { stroke: "#8a8f99", duration: 0.4 }, at(2, 0.45) + 0.8);
