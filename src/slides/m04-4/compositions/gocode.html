<text class="mono" x="120" y="300" font-size="28" fill="#58C4DD" xml:space="preserve">type Level struct {</text>
<text class="mono" x="120" y="344" font-size="28" fill="#58C4DD" xml:space="preserve">    Price  int64</text>
<text class="mono" x="120" y="388" font-size="28" fill="#58C4DD" xml:space="preserve">    Total  int64</text>
<text x="800" y="388" font-size="28" fill="#6b6f7a">// 档位总量</text>
<text class="mono" x="120" y="432" font-size="28" fill="#58C4DD" xml:space="preserve">    Orders *list.List</text>
<text x="800" y="432" font-size="28" fill="#6b6f7a">// FIFO 双向链表</text>
<text class="mono" x="120" y="476" font-size="28" fill="#58C4DD" xml:space="preserve">}</text>
<text class="mono" x="120" y="520" font-size="28" fill="#58C4DD" xml:space="preserve">type Book struct {</text>
<text class="mono" x="120" y="564" font-size="28" fill="#58C4DD" xml:space="preserve">    bids, asks *redblacktree.Tree</text>
<text x="800" y="564" font-size="28" fill="#6b6f7a">// 价格 → 档位</text>
<text class="mono" x="120" y="608" font-size="28" fill="#58C4DD" xml:space="preserve">    index      map[int64]*list.Element</text>
<text x="800" y="608" font-size="28" fill="#6b6f7a">// 订单号 → 节点</text>
<text class="mono" x="120" y="652" font-size="28" fill="#58C4DD" xml:space="preserve">    levelOf    map[int64]*Level</text>
<text x="800" y="652" font-size="28" fill="#6b6f7a">// 订单号 → 档位</text>
<text class="mono" x="120" y="696" font-size="28" fill="#58C4DD" xml:space="preserve">    seq        uint64</text>
<text x="800" y="696" font-size="28" fill="#6b6f7a">// 递增序列号</text>
<text class="mono" x="120" y="740" font-size="28" fill="#58C4DD" xml:space="preserve">}</text>
</g>
<g id="go-c2" class="h">
<text class="mono" x="120" y="300" font-size="28" fill="#58C4DD" xml:space="preserve">for o.Qty &gt; 0 &amp;&amp; !opp.Empty() {</text>
<text class="mono" x="120" y="344" font-size="28" fill="#58C4DD" xml:space="preserve">    lv := opp.Left().Value.(*Level)</text>
<text x="800" y="344" font-size="28" fill="#6b6f7a">// 最优档位</text>
<text class="mono" x="120" y="388" font-size="28" fill="#58C4DD" xml:space="preserve">    if !crosses(o, lv.Price) { break }</text>
<text class="mono" x="120" y="432" font-size="28" fill="#58C4DD" xml:space="preserve">    for e := lv.Orders.Front(); e != nil &amp;&amp; o.Qty &gt; 0; {</text>
<text class="mono" x="120" y="476" font-size="28" fill="#58C4DD" xml:space="preserve">        m := e.Value.(*Order)</text>
<text class="mono" x="120" y="520" font-size="28" fill="#58C4DD" xml:space="preserve">        q := min(o.Qty, m.Qty)</text>
<text class="mono" x="120" y="564" font-size="28" fill="#58C4DD" xml:space="preserve">        o.Qty -= q; m.Qty -= q; lv.Total -= q</text>
<text class="mono" x="120" y="608" font-size="28" fill="#58C4DD" xml:space="preserve">        b.seq++</text>
<text x="800" y="608" font-size="28" fill="#6b6f7a">// 记一条 Trade</text>
<text class="mono" x="120" y="652" font-size="28" fill="#58C4DD" xml:space="preserve">        next := e.Next()</text>
<text class="mono" x="120" y="696" font-size="28" fill="#58C4DD" xml:space="preserve">        if m.Qty == 0 { lv.Orders.Remove(e); delete(…) }</text>
<text class="mono" x="120" y="740" font-size="28" fill="#58C4DD" xml:space="preserve">        e = next</text>
<text class="mono" x="120" y="784" font-size="28" fill="#58C4DD" xml:space="preserve">    }</text>
<text x="120" y="828" font-size="28" fill="#6b6f7a">    // … 档位空 → 从树上删掉档位</text>
</g>
<g id="go-c3" class="h">
<text class="mono" x="120" y="300" font-size="28" fill="#58C4DD" xml:space="preserve">func (b *Book) rest(o *Order) {</text>
<text class="mono" x="120" y="344" font-size="28" fill="#58C4DD" xml:space="preserve">    tree := b.bids; if o.Side == Sell { tree = b.asks }</text>
<text class="mono" x="120" y="388" font-size="28" fill="#58C4DD" xml:space="preserve">    var lv *Level</text>
<text class="mono" x="120" y="432" font-size="28" fill="#58C4DD" xml:space="preserve">    if v, ok := tree.Get(o.Price); ok {</text>
<text class="mono" x="120" y="476" font-size="28" fill="#58C4DD" xml:space="preserve">        lv = v.(*Level)</text>
<text class="mono" x="120" y="520" font-size="28" fill="#58C4DD" xml:space="preserve">    } else {</text>
<text class="mono" x="120" y="564" font-size="28" fill="#58C4DD" xml:space="preserve">        lv = &amp;Level{Price: o.Price, Orders: list.New()}</text>
<text class="mono" x="120" y="608" font-size="28" fill="#58C4DD" xml:space="preserve">        tree.Put(o.Price, lv)</text>
<text class="mono" x="120" y="652" font-size="28" fill="#58C4DD" xml:space="preserve">    }</text>
<text class="mono" x="120" y="696" font-size="28" fill="#58C4DD" xml:space="preserve">    b.index[o.ID] = lv.Orders.PushBack(o)</text>
<text x="844" y="696" font-size="28" fill="#6b6f7a">// 队尾</text>
<text class="mono" x="120" y="740" font-size="28" fill="#58C4DD" xml:space="preserve">    b.levelOf[o.ID] = lv; lv.Total += o.Qty</text>
<text class="mono" x="120" y="784" font-size="28" fill="#58C4DD" xml:space="preserve">}</text>
</g>
<g id="go-c4" class="h">
<text class="mono" x="120" y="300" font-size="28" fill="#58C4DD" xml:space="preserve">func (b *Book) Cancel(id int64) int64 {</text>
<text class="mono" x="120" y="344" font-size="28" fill="#58C4DD" xml:space="preserve">    e, ok := b.index[id]</text>
<text class="mono" x="120" y="388" font-size="28" fill="#58C4DD" xml:space="preserve">    if !ok { return 0 }</text>
<text x="800" y="388" font-size="28" fill="#6b6f7a">// 已成交或已撤</text>
<text class="mono" x="120" y="432" font-size="28" fill="#58C4DD" xml:space="preserve">    o, lv := e.Value.(*Order), b.levelOf[id]</text>
<text class="mono" x="120" y="476" font-size="28" fill="#58C4DD" xml:space="preserve">    lv.Orders.Remove(e)</text>
<text class="mono" x="120" y="520" font-size="28" fill="#58C4DD" xml:space="preserve">    lv.Total -= o.Qty</text>
<text class="mono" x="120" y="564" font-size="28" fill="#58C4DD" xml:space="preserve">    delete(b.index, id); delete(b.levelOf, id)</text>
<text class="mono" x="120" y="608" font-size="28" fill="#58C4DD" xml:space="preserve">    if lv.Orders.Len() == 0 { … }</text>
<text x="800" y="608" font-size="28" fill="#6b6f7a">// 从树删掉档位</text>
<text class="mono" x="120" y="652" font-size="28" fill="#58C4DD" xml:space="preserve">    return o.Qty</text>
<text class="mono" x="120" y="696" font-size="28" fill="#58C4DD" xml:space="preserve">}</text>
</g>
