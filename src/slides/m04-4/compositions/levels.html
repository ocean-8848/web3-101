[0, 1, 2, 3].forEach(k => IN(`#le-s${k}`, at(4, 0.06 + k * 0.03), 0.3));

IN("#le-snew", at(4, 0.62), 0.4, { y: -60 }, { y: 0 });
IN("#le-f3b", at(4, 0.66), 0.4);
IN("#le-p3", at(4, 0.35), 0.4);
