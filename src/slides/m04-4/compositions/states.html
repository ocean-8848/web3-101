      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
const G = ["#st-gnew", "#st-grej", "#st-gacc", "#st-gpar", "#st-gfil", "#st-gcan"];
const CEN = { rej: "420 900", acc: "800 600", par: "1180 420", fil: "1580 420", can: "1180 860" };

IN("#st-term", at(0, 0.04), 0.5);
IN("#st-cnt", at(0, 0.38), 0.5, { y: 15 }, { y: 0 });
tl.to("#st-cnt", { fill: "#58C4DD", duration: 0.4 }, at(0, 0.72));
OUT("#st-cnt", at(1, 0.0), 0.3);
// L1 start -> New
IN("#st-start", at(1, 0.02), 0.3);
ARROW("#st-e1", at(1, 0.12), 0.4);
tl.fromTo("#st-bnew", { opacity: 0 }, { opacity: 1, duration: 0.5 }, at(1, 0.3)); OUT("#st-gnew", at(1, 0.3), 0.3);
IN("#st-l1", at(1, 0.45), 0.4);
// L2 New -> Rejected
OUT("#st-term", at(2, 0.0), 0.4);
ARROW("#st-e2", at(2, 0.1), 0.5);
IN("#st-l2a", at(2, 0.25), 0.4, { x: -10 }, { x: 0 });
IN("#st-l2b", at(2, 0.55), 0.4, { x: -10 }, { x: 0 });
BOX("rej", at(2, 0.3));
// L3 New -> Accepted, order service frame
ARROW("#st-e3", at(3, 0.05), 0.5);
IN("#st-l3a", at(3, 0.08), 0.4);
IN("#st-l3b", at(3, 0.25), 0.4);
BOX("acc", at(3, 0.32));
IN("#st-fp", at(3, 0.62), 0.5); IN("#st-fpl", at(3, 0.68), 0.4);
// L4 matching engine transitions
IN("#st-fb", at(4, 0.02), 0.6); IN("#st-fbl", at(4, 0.06), 0.4);
ARROW("#st-e4", at(4, 0.22), 0.6); BOX("fil", at(4, 0.3)); IN("#st-l4", at(4, 0.32), 0.4);
ARROW("#st-e5", at(4, 0.42), 0.5); BOX("par", at(4, 0.48)); IN("#st-l5", at(4, 0.5), 0.4);
ARROW("#st-e6", at(4, 0.64), 0.5); IN("#st-l6", at(4, 0.68), 0.4);
ARROW("#st-e7", at(4, 0.82), 0.4); IN("#st-l7", at(4, 0.86), 0.4);
// L5 cancel paths + IOC card
ARROW("#st-e8", at(5, 0.04), 0.6); BOX("can", at(5, 0.12));
ARROW("#st-e9", at(5, 0.2), 0.5);
IN("#st-l9", at(5, 0.3), 0.4);
IN("#st-ioc", at(5, 0.55), 0.5, { y: 20 }, { y: 0 });
tl.to("#st-ioc rect", { stroke: "#e8e6df", fill: "#252b36", duration: 0.4 }, at(5, 0.8));
// L6 Accepted -> Rejected, terminals -> end

IN("#st-l10a", at(6, 0.2), 0.4);

ARROW("#st-t1", at(6, 0.8), 0.5); ARROW("#st-t2", at(6, 0.84), 0.5); ARROW("#st-t3", at(6, 0.88), 0.6);

      /*ENDANIM*/

      tl.to("#st-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#st-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);

    })();
