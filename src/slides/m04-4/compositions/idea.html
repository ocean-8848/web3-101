  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
// L0 engine + three tags
IN("#ia-eng", at(0, 0.02), 0.8, { scale: 0.9, svgOrigin: "960 500" }, { scale: 1, svgOrigin: "960 500" });
IN("#ia-term0", at(0, 0.1), 0.5);
IN("#ia-tg0", at(0, 0.5), 0.4, { y: 20 }, { y: 0 });
IN("#ia-tg1", at(0, 0.65), 0.4, { y: 20 }, { y: 0 });
IN("#ia-tg2", at(0, 0.8), 0.4, { y: 20 }, { y: 0 });
const FLOW = (r, t0, step) => {
  [1, 2, 3].forEach((n, i) => IN(`#ia-k${r}${n}`, t0 + i * 0.12, 0.4, { x: -60 }, { x: 0 }));
  [1, 2, 3].forEach((n, i) => {
    const x0 = { 1: 540, 2: 350, 3: 160 }[n], t = t0 + 0.6 + i * step;
    tl.to(`#ia-k${r}${n}`, { x: 760 - x0, duration: 0.5, ease: "power2.in" }, t);
    tl.to(`#ia-k${r}${n}`, { opacity: 0, duration: 0.15 }, t + 0.35);
    tl.to("#ia-engi rect", { attr: { "stroke-width": 7 }, duration: 0.2, yoyo: true, repeat: 1 }, t + 0.45);
    IN(`#ia-o${r}${n}`, t + 0.6, 0.4, { x: -40 }, { x: 0 });
  });
};
// L1 commands in, trades out
FLOW(1, at(1, 0.03), 0.75);
IN("#ia-pp", at(1, 0.45), 0.5, { y: 10 }, { y: 0 });
OUT("#ia-term0", at(1, 0.45), 0.4);
// L2 no money; rebuild from log
IN("#ia-coin", at(2, 0.02), 0.5, { y: -160 }, { y: 0, ease: "power2.out" });
tl.to("#ia-coin", { y: -40, duration: 0.4, ease: "power2.out" }, at(2, 0.2));
IN("#ia-nx", at(2, 0.22), 0.4);
IN("#ia-log", at(2, 0.45), 0.5, { x: -30 }, { x: 0 });
ARROW("#ia-la", at(2, 0.6), 0.5);
IN("#ia-ll", at(2, 0.66), 0.4);
IN("#ia-state", at(2, 0.78), 0.5);
// L3 determinism: replay gives same output
["#ia-coin", "#ia-nx", "#ia-log", "#ia-la", "#ia-ll", "#ia-state"].forEach(s => OUT(s, at(3, 0.0), 0.4));
IN("#ia-term", at(3, 0.04), 0.5);
FLOW(2, at(3, 0.1), 0.45);
IN("#ia-eq", at(3, 0.86), 0.4, { scale: 0.5, svgOrigin: "1490 566" }, { scale: 1, svgOrigin: "1490 566" });
// L4 auctioneer analogy
OUT("#ia-term", at(4, 0.0), 0.4);
OUT("#ia-m1", at(4, 0.0), 0.5);
IN("#ia-win", at(4, 0.06), 0.6);
IN("#ia-bd", at(4, 0.12), 0.6);
[1, 2, 3, 4].forEach((n, i) => IN(`#ia-p${n}`, at(4, 0.2 + i * 0.04), 0.4, { x: -40 }, { x: 0 }));
[1, 2, 3, 4].forEach((n, i) => {
  const t = at(4, 0.4 + i * 0.14);
  tl.to(`#ia-pi${n}`, { x: 315 + 120 * (n - 1), duration: 0.5, ease: "power2.inOut" }, t);
  tl.to(`#ia-p${n}`, { opacity: 0, duration: 0.25 }, t + 0.45);
  if (n % 2 === 1) { tl.fromTo("#ia-flash", { opacity: 0 }, { opacity: 1, duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, t + 0.6); }
  else { DRAW(`#ia-ch${n === 2 ? 0 : 1}`, t + 0.6, 0.5); }
  if (n === 4) { DRAW("#ia-ch2", t + 1.0, 0.5); }
});
// L5 replay -> same board
OUT("#ia-win", at(5, 0.0), 0.4);
IN("#ia-rw", at(5, 0.02), 0.4);
tl.to("#ia-rw", { x: -30, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, at(5, 0.08));
tl.to("#ia-bdm", { x: -940, duration: 0.8, ease: "power2.inOut" }, at(5, 0.1));
IN("#ia-bd2", at(5, 0.3), 0.5);
DRAW("#ia-dh0", at(5, 0.4), 0.35); DRAW("#ia-dh1", at(5, 0.5), 0.35); DRAW("#ia-dh2", at(5, 0.6), 0.35);
IN("#ia-same", at(5, 0.78), 0.4, { scale: 0.6, svgOrigin: "960 500" }, { scale: 1, svgOrigin: "960 500" });
// L6 limits of the analogy
OUT("#ia-rw", at(6, 0.0), 0.3);
IN("#ia-lim", at(6, 0.04), 0.5);
IN("#ia-l1", at(6, 0.22), 0.5, { x: -20 }, { x: 0 });
IN("#ia-l2", at(6, 0.55), 0.4, { x: -20 }, { x: 0 });
IN("#ia-l3", at(6, 0.68), 0.4, { x: -20 }, { x: 0 });
IN("#ia-l4", at(6, 0.84), 0.4, { x: -20 }, { x: 0 });

      /*ENDANIM*/

      tl.to("#ia-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to(["#ia-term", "#ia-term0"], { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["idea"] = tl;
    })();
