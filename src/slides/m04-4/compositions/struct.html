  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
const LIT = (i, t) => { tl.to(`#str-cr${i}`, { stroke: "#58C4DD", duration: 0.4 }, t); tl.to(`#str-ct${i}`, { fill: "#e8e6df", duration: 0.4 }, t); };
// L0 four operations
[0, 1, 2, 3].forEach(i => IN(`#str-c${i}`, at(0, 0.05 + i * 0.12), 0.5, { y: 20 }, { y: 0 }));
// L1 best price + insert level
LIT(0, at(1, 0.03)); IN("#str-i0", at(1, 0.1), 0.5, { y: -15 }, { y: 0 });
tl.to("#str-i0 path", { y: -10, duration: 0.3, yoyo: true, repeat: 1 }, at(1, 0.35));
LIT(1, at(1, 0.55)); IN("#str-i1", at(1, 0.6), 0.4);
tl.fromTo("#str-i1n", { y: -70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.6)", immediateRender: false }, at(1, 0.72));
// L2 time priority + cancel by id
LIT(2, at(2, 0.03)); IN("#str-i2", at(2, 0.08), 0.4);
tl.to("#str-q1", { x: -60, opacity: 0, duration: 0.6, ease: "power2.in" }, at(2, 0.22));
LIT(3, at(2, 0.42)); IN("#str-i3", at(2, 0.48), 0.4);
tl.to("#str-bc", { attr: { width: 380 }, duration: 2.2, ease: "power1.in" }, at(2, 0.58));
tl.to("#str-bt", { attr: { width: 60 }, duration: 2.2, ease: "power1.out" }, at(2, 0.58));
IN("#str-mm", at(2, 0.78), 0.5);
IN("#str-sy", at(2, 0.72), 0.4);
// L3 cards collapse into strip; ask levels
OUT(["#str-mm", "#str-sy"], at(3, 0.0), 0.3);
IN("#str-term", at(3, 0.18), 0.5);
tl.to("#str-lr0", { stroke: "#e8e6df", duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.42));
tl.to("#str-cards", { opacity: 0, y: -120, duration: 0.6, ease: "power2.in" }, at(3, 0.0));
[0, 1, 2, 3].forEach(i => IN(`#str-p${i}`, at(3, 0.08 + i * 0.04), 0.4, { y: -10 }, { y: 0 }));
[0, 1, 2].forEach(i => IN(`#str-lv${i}`, at(3, 0.3 + i * 0.08), 0.5, { x: -30 }, { x: 0 }));
IN("#str-asc", at(3, 0.55), 0.4);
IN("#str-bid", at(3, 0.82), 0.4);
// L4 FIFO doubly linked list
OUT("#str-term", at(4, 0.0), 0.4);
ARROW("#str-ptr", at(4, 0.04), 0.4);
IN("#str-n1", at(4, 0.12), 0.4, { x: -20 }, { x: 0 });
IN("#str-a12", at(4, 0.22), 0.3);
IN("#str-n2", at(4, 0.28), 0.4, { x: -20 }, { x: 0 });
IN("#str-a23", at(4, 0.38), 0.3);
IN("#str-n3", at(4, 0.44), 0.4, { x: -20 }, { x: 0 });
IN("#str-hd", at(4, 0.55), 0.3); IN("#str-tlb", at(4, 0.6), 0.3);
IN("#str-cash", at(4, 0.72), 0.4);
// L5 cancel index hash table
OUT("#str-cash", at(5, 0.0), 0.3);
IN("#str-hash", at(5, 0.05), 0.5, { y: 20 }, { y: 0 });
[0, 1, 2].forEach(i => IN(`#str-h${i}`, at(5, 0.22 + i * 0.07), 0.3));
tl.fromTo("#str-hp", { opacity: 0 }, { opacity: 1, duration: 0.01 }, at(5, 0.55)); DRAW("#str-hp", at(5, 0.55), 0.6);
tl.set("#str-hp", { attr: { "stroke-dasharray": "0.02 0.015" } }, at(5, 0.55) + 0.62);
// L6 new order: binary search O(log n), append O(1)
IN("#str-tw", at(6, 0.02), 0.3);
tl.fromTo("#str-t", { x: -1090, y: 120 }, { x: -1090, y: 120, duration: 0.01 }, at(6, 0.0));
tl.to("#str-t", { x: -1090, y: 0, duration: 0.6, ease: "power2.inOut" }, at(6, 0.1));
IN("#str-olg", at(6, 0.14), 0.4);
tl.to("#str-lr0", { stroke: "#FF9F43", duration: 0.3, yoyo: true, repeat: 1 }, at(6, 0.16));
OUT("#str-olg", at(6, 0.34), 0.3);
tl.to("#str-t", { x: 0, y: 0, duration: 0.9, ease: "power2.inOut" }, at(6, 0.36));
IN("#str-a3t", at(6, 0.42), 0.3);
tl.to("#str-tlb", { x: 245, duration: 0.5 }, at(6, 0.43));
COUNT("#str-tot", 0.8, 1.0, at(6, 0.5), 0.6, v => `(${v.toFixed(1)})`);
tl.to("#str-tot", { fill: "#FF9F43", duration: 0.3, yoyo: true, repeat: 1 }, at(6, 0.5));
tl.to("#str-hrect", { attr: { height: 340 }, duration: 0.4 }, at(6, 0.52)); tl.to("#str-hsep", { attr: { y2: 920 }, duration: 0.4 }, at(6, 0.52));
IN("#str-h3", at(6, 0.56), 0.3);
IN("#str-o1", at(6, 0.45), 0.4);
IN("#str-big", at(6, 0.6), 0.5, { y: 20 }, { y: 0 });
tl.to("#str-big rect", { stroke: "#FF9F43", fill: "#251f18", duration: 0.4 }, at(6, 0.84));
// L7 cancel #105: O(1) lookup, O(1) unlink; empty level must be removed
OUT("#str-o1", at(7, 0.0), 0.3); OUT("#str-olg", at(7, 0.0), 0.1);
tl.to("#str-hr1", { attr: { "fill-opacity": 0.35 }, duration: 0.25, yoyo: true, repeat: 3 }, at(7, 0.02));
tl.to("#str-hp", { attr: { "stroke-width": 6 }, duration: 0.3, yoyo: true, repeat: 1 }, at(7, 0.12));
tl.to("#str-n2", { y: -90, opacity: 0, duration: 0.6, ease: "power2.in" }, at(7, 0.2));
OUT("#str-hp", at(7, 0.2), 0.3); OUT("#str-a23", at(7, 0.22), 0.3);
OUT("#str-h1", at(7, 0.3), 0.3);
