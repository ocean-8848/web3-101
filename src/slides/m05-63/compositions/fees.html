        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

IN("#fe-tot", at(1, 0.72), 0.6, { y: 16 }, { y: 0 });

IN("#fe-ctl", at(4, 0.08), 0.5);
IN("#fe-lp", at(4, 0.2), 0.6);

const sw = (deg, t, d) => {
  tl.to("#fe-beam", { rotation: deg, svgOrigin: "960 360", duration: d, ease: "sine.inOut" }, t);

};
sw(4, at(4, 0.28), 1.2); sw(-4, at(4, 0.6), 1.4); sw(3, at(4, 0.78), 1.0); sw(-2, at(4, 0.9), 0.8); sw(0, at(4, 0.98), 0.4);
// L5 Bitcoin Core 30.0

lit(1, at(6, 0.33)); lit(2, at(6, 0.52)); lit(3, at(6, 0.7));
