      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
      const HL = (id, a, b, t, n, d = 0.35) => {
        const y0 = +document.querySelector("#" + id + "-l0").getAttribute("y");
        const lh = +document.querySelector("#" + id + "-hl").getAttribute("data-lh");
        tl.to("#" + id + "-hl", { opacity: 1, attr: { y: y0 - lh * 0.71 + a * lh, height: (b - a + 1) * lh }, duration: d, ease: "power2.out" }, t);
        for (let i = 0; i < n; i++) tl.to("#" + id + "-l" + i, { opacity: (i >= a && i <= b) ? 1 : 0.6, duration: d }, t);
      };
      const HLOFF = (id, t, n, d = 0.35) => {
        tl.to("#" + id + "-hl", { opacity: 0, duration: d }, t);
        for (let i = 0; i < n; i++) tl.to("#" + id + "-l" + i, { opacity: 1, duration: d }, t);
      };
      const TYPE = (sel, t, d = 0.8) => {
        const el = document.querySelector(sel), s = el.textContent, o = { v: 0 };
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
        tl.fromTo(o, { v: 0 }, { v: s.length, duration: d, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = s.slice(0, Math.round(o.v)); } }, t);
      };
      const POP = (s, t, ox, oy, d = 0.5) => IN(s, t, d, { scale: 0.6, svgOrigin: ((ox) + " " + (oy)) }, { scale: 1, svgOrigin: ((ox) + " " + (oy)), ease: "back.out(2)" });


      // L0 three cards
      ["rm", "fd", "hh"].forEach((c, i) => IN(("#to-" + (c) + "b"), at(0, 0.3 + i * 0.17), 0.6, { y: 24 }, { y: 0 }));
      // L1 Remix
      tl.to("#to-rmr", { attr: { stroke: "#8a8f99" }, duration: 0.3 }, at(1, 0));
      [0.05, 0.2, 0.42, 0.75].forEach((f, i) => IN(("#to-rm" + (i)), at(1, f), 0.5, { x: -12 }, { x: 0 }));
      tl.to("#to-rmr", { attr: { stroke: "#3a3f4a" }, duration: 0.3 }, at(2, 0));
      // L2 Hardhat
      tl.to("#to-hhr", { attr: { stroke: "#8a8f99" }, duration: 0.3 }, at(2, 0));
      [0.05, 0.22, 0.4, 0.55, 0.8].forEach((f, i) => IN(("#to-hh" + (i)), at(2, f), 0.5, { x: -12 }, { x: 0 }));
      tl.to("#to-hhsp", { attr: { width: 170 }, duration: 1.0, ease: "power2.out" }, at(2, 0.82));
      // L3 Foundry focus
      tl.to("#to-rm", { opacity: 0.3, x: -40, duration: 0.7, ease: "power2.inOut" }, at(3, 0));
      tl.to("#to-hh", { opacity: 0.3, x: 40, duration: 0.7, ease: "power2.inOut" }, at(3, 0));
      tl.to("#to-fi", { scale: 1.05, svgOrigin: "960 540", duration: 0.7, ease: "power2.inOut" }, at(3, 0));
      tl.to("#to-fdr", { attr: { stroke: "#58C4DD" }, duration: 0.4 }, at(3, 0.02));
      IN("#to-term", at(3, 0.06), 0.5);
      [0.08, 0.25, 0.42, 0.5, 0.62].forEach((f, i) => IN(("#to-fd" + (i)), at(3, f), 0.5, { x: -12 }, { x: 0 }));
      tl.to("#to-fdsp", { attr: { width: 350 }, duration: 0.9, ease: "power2.out" }, at(3, 0.52));
      // L4 toolset
      OUT("#to-term", at(4, 0), 0.4);
      tl.set("#to-morph", { opacity: 1 }, at(4, 0.02));
      OUT("#to-cards", at(4, 0), 0.35);
      tl.to("#to-morph", { attr: { x: 150, y: 490, width: 140, height: 140, rx: 70 }, duration: 0.9, ease: "power3.inOut" }, at(4, 0.02));
      IN("#to-dev", at(4, 0.06), 0.4);
      [0, 1, 2, 3].forEach(i => ARROW(("#to-ln" + (i)), at(4, 0.07) + i * 0.12, 0.5));
      IN("#to-tb0", at(4, 0.1), 0.5);
      ARROW("#to-bc", at(4, 0.27), 0.5); IN("#to-bcl", at(4, 0.29), 0.4); IN("#to-rpc", at(4, 0.3), 0.4);
      ARROW("#to-vf", at(4, 0.33), 0.6); IN("#to-vfl", at(4, 0.35), 0.4); IN("#to-scan", at(4, 0.37), 0.4);
      IN("#to-tb1", at(4, 0.38), 0.5);
      IN("#to-tb2", at(4, 0.6), 0.5);
      ARROW("#to-ru1", at(4, 0.76), 0.6); DRAW("#to-ru2", at(4, 0.78), 0.3); IN("#to-ru2", at(4, 0.78), 0.05);
      IN("#to-rul", at(4, 0.8), 0.4);
      IN("#to-tb3", at(4, 0.88), 0.5);
      [0.1, 0.38, 0.6, 0.88].forEach((f, i) => tl.to(("#to-tr" + (i)), { attr: { "stroke-width": 5 }, duration: 0.25, yoyo: true, repeat: 1 }, at(4, f) + 0.4));
      // L5 puzzle
      IN("#to-pzl", at(5, 0.1), 0.6, { x: -120 }, { x: 0 });
      IN("#to-pzr", at(5, 0.45), 0.6, { x: 120 }, { x: 0 });
      tl.to("#to-pz", { y: -6, duration: 0.15, yoyo: true, repeat: 1 }, at(5, 0.45) + 0.6);


      tl.to("#to-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#to-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
