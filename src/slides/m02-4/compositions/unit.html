        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
      const HL = (id, a, b, t, n, d = 0.35) => {
        const y0 = +document.querySelector("#" + id + "-l0").getAttribute("y");
        const lh = +document.querySelector("#" + id + "-hl").getAttribute("data-lh");
        tl.to("#" + id + "-hl", { opacity: 1, attr: { y: y0 - lh * 0.71 + a * lh, height: (b - a + 1) * lh }, duration: d, ease: "power2.out" }, t);
        for (let i = 0; i < n; i++) tl.to("#" + id + "-l" + i, { opacity: (i >= a && i <= b) ? 1 : 0.6, duration: d }, t);
      };
      const HLOFF = (id, t, n, d = 0.35) => {
        tl.to("#" + id + "-hl", { opacity: 0, duration: d }, t);
        for (let i = 0; i < n; i++) tl.to("#" + id + "-l" + i, { opacity: 1, duration: d }, t);
      };
      const TYPE = (sel, t, d = 0.8) => {
        const el = document.querySelector(sel), s = el.textContent, o = { v: 0 };
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
        tl.fromTo(o, { v: 0 }, { v: s.length, duration: d, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = s.slice(0, Math.round(o.v)); } }, t);
      };
      const POP = (s, t, ox, oy, d = 0.5) => IN(s, t, d, { scale: 0.6, svgOrigin: ((ox) + " " + (oy)) }, { scale: 1, svgOrigin: ((ox) + " " + (oy)), ease: "back.out(2)" });


      IN("#un-badge", 0.1, 0.5);

      IN("#un-loop", at(1, 0.24), 0.5);
      HL("un-p1", 4, 4, at(1, 0.42), 7);

      HL("un-p1", 5, 5, at(1, 0.68), 7);

      tl.to("#un-bar", { attr: { fill: "#FFD95A" }, duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.45));

      OUT("#un-wand, #un-loop", at(3, 0), 0.4);
      OUT("#un-p1", at(3, 0), 0.35);
      IN("#un-p2", at(3, 0.05), 0.5);
      HL("un-p2", 1, 1, at(3, 0.12), 10);
      IN("#un-ms", at(3, 0.16), 0.5);
      ARROW("#un-call", at(3, 0.2), 0.5);
      HL("un-p2", 2, 2, at(3, 0.42), 10);
      IN("#un-c8", at(3, 0.45), 0.25);
      tl.to("#un-c8", { x: 64, duration: 0.8, ease: "power2.inOut" }, at(3, 0.47));
      tl.to("#un-c8", { opacity: 0, duration: 0.25 }, at(3, 0.47) + 0.75);
      tl.to("#un-bar", { attr: { width: 52 }, duration: 0.8, ease: "power2.inOut" }, at(3, 0.47));
      COUNT("#un-bal", 10, 2, at(3, 0.47), 0.8);
      COUNT("#un-led", 0, 8, at(3, 0.55), 0.6);
      HL("un-p2", 3, 3, at(3, 0.75), 10);
      IN("#un-ok1", at(3, 0.82), 0.05); DRAW("#un-ok1", at(3, 0.82), 0.4);

      COUNT("#un-bal", 2, 5, at(4, 0.64), 0.8);
