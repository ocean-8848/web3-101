      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
      const HL = (id, a, b, t, n, d = 0.35) => {
        const y0 = +document.querySelector("#" + id + "-l0").getAttribute("y");
        const lh = +document.querySelector("#" + id + "-hl").getAttribute("data-lh");
        tl.to("#" + id + "-hl", { opacity: 1, attr: { y: y0 - lh * 0.71 + a * lh, height: (b - a + 1) * lh }, duration: d, ease: "power2.out" }, t);
        for (let i = 0; i < n; i++) tl.to("#" + id + "-l" + i, { opacity: (i >= a && i <= b) ? 1 : 0.6, duration: d }, t);
      };
      const HLOFF = (id, t, n, d = 0.35) => {
        tl.to("#" + id + "-hl", { opacity: 0, duration: d }, t);
        for (let i = 0; i < n; i++) tl.to("#" + id + "-l" + i, { opacity: 1, duration: d }, t);
      };
      const TYPE = (sel, t, d = 0.8) => {
        const el = document.querySelector(sel), s = el.textContent, o = { v: 0 };
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
        tl.fromTo(o, { v: 0 }, { v: s.length, duration: d, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = s.slice(0, Math.round(o.v)); } }, t);
      };
      const POP = (s, t, ox, oy, d = 0.5) => IN(s, t, d, { scale: 0.6, svgOrigin: ((ox) + " " + (oy)) }, { scale: 1, svgOrigin: ((ox) + " " + (oy)), ease: "back.out(2)" });


      // L0 terminal
      IN("#se-term", at(0, 0.02), 0.5);
      IN("#se-t", at(0, 0.15), 0.6, { y: 20 }, { y: 0 });
      tl.to("#se-cur", { opacity: 0, duration: 0.3, yoyo: true, repeat: 7, ease: "steps(1)" }, at(0, 0.3));
      // L1 install
      tl.set("#se-cur", { opacity: 0 }, at(1, 0));
      IN("#se-d0", at(1, 0.02), 0.2); TYPE("#se-t-l0", at(1, 0.02), 1.0);
      HL("se-t", 0, 0, at(1, 0.02), 0);
      IN("#se-d1", at(1, 0.45), 0.2); TYPE("#se-t-l1", at(1, 0.45), 0.5);
      HL("se-t", 1, 1, at(1, 0.45), 0);
      OUT("#se-term", at(1, 0.95), 0.4);
      // L2 init/install/build/test
      [[2, 0.0], [3, 0.12], [4, 0.36], [5, 0.47]].forEach(([i, f]) => {
        IN(("#se-d" + (i)), at(2, f), 0.2); TYPE(("#se-t-l" + (i)), at(2, f), i === 3 ? 0.9 : 0.6); HL("se-t", i, i, at(2, f), 0);
      });
      IN("#se-ps0", at(2, 0.55), 0.4, { y: 10 }, { y: 0 });
      IN("#se-ps1", at(2, 0.58), 0.4, { y: 10 }, { y: 0 });
      IN("#se-sl", at(2, 0.64), 0.4);
      tl.to("#se-knob", { attr: { cx: 1100 }, duration: 2.0, ease: "steps(3)" }, at(2, 0.68));
      COUNT("#se-vlab", 1, 4, at(2, 0.68), 2.0, v => "-" + "v".repeat(Math.max(1, Math.min(4, Math.round(v)))));
      IN("#se-tree", at(2, 0.86), 0.5, { y: -10 }, { y: 0 });
      // L3 dir tree
      HLOFF("se-t", at(3, 0), 0);
      OUT("#se-vv", at(3, 0), 0.35);
      tl.to("#se-t", { x: -690, duration: 0.8, ease: "power2.inOut" }, at(3, 0.02));
      tl.to("#se-t-r", { attr: { width: 950, height: 440 }, duration: 0.8, ease: "power2.inOut" }, at(3, 0.02));
      tl.to("#se-t-bar", { attr: { height: 412 }, duration: 0.8, ease: "power2.inOut" }, at(3, 0.02));
      IN("#se-root", at(3, 0.06), 0.4);
      [0.08, 0.2, 0.33, 0.66, 0.86].forEach((f, i) => IN(("#se-dd" + (i)), at(3, f), 0.5, { x: -14 }, { x: 0 }));
      // L4 foundry.toml
      OUT("#se-t", at(4, 0), 0.35);
      OUT("#se-root, #se-dd1, #se-dd2, #se-dd3, #se-dd4", at(4, 0), 0.35);
      tl.to("#se-dd0", { x: -1020, y: -140, opacity: 0, duration: 0.6, ease: "power2.in" }, at(4, 0.02));
      IN("#se-tm", at(4, 0.06), 0.6, { scale: 0.7, svgOrigin: "120 240" }, { scale: 1, svgOrigin: "120 240" });
      HL("se-tm", 1, 1, at(4, 0.3), 12);
      IN("#se-cA", at(4, 0.32), 0.5); ARROW("#se-cA1", at(4, 0.36), 0.4); IN("#se-cB", at(4, 0.4), 0.5);
      HL("se-tm", 2, 3, at(4, 0.55), 12);
      ARROW("#se-cB1", at(4, 0.66), 0.4); IN("#se-cC", at(4, 0.7), 0.5);
      IN("#se-cD", at(4, 0.82), 0.5); POP("#se-eq", at(4, 0.88), 1550, 590);
      // L5 fuzz / invariant / rpc
      OUT("#se-chain", at(5, 0), 0.4);
      HL("se-tm", 5, 6, at(5, 0.08), 12);
      POP("#se-n1", at(5, 0.15), 1090, 530); IN("#se-n1b", at(5, 0.18), 0.4);
      HL("se-tm", 7, 9, at(5, 0.33), 12);
      POP("#se-n2", at(5, 0.4), 1070, 636); IN("#se-n2b", at(5, 0.44), 0.4);
      POP("#se-n3", at(5, 0.52), 1230, 636); IN("#se-n3b", at(5, 0.55), 0.4);
      HL("se-tm", 10, 11, at(5, 0.72), 12);
      IN("#se-env", at(5, 0.8), 0.5, { x: -12 }, { x: 0 });


      tl.to("#se-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#se-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);

    })();
