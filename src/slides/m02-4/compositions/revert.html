    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
      const HL = (id, a, b, t, n, d = 0.35) => {
        const y0 = +document.querySelector("#" + id + "-l0").getAttribute("y");
        const lh = +document.querySelector("#" + id + "-hl").getAttribute("data-lh");
        tl.to("#" + id + "-hl", { opacity: 1, attr: { y: y0 - lh * 0.71 + a * lh, height: (b - a + 1) * lh }, duration: d, ease: "power2.out" }, t);
        for (let i = 0; i < n; i++) tl.to("#" + id + "-l" + i, { opacity: (i >= a && i <= b) ? 1 : 0.6, duration: d }, t);
      };
      const HLOFF = (id, t, n, d = 0.35) => {
        tl.to("#" + id + "-hl", { opacity: 0, duration: d }, t);
        for (let i = 0; i < n; i++) tl.to("#" + id + "-l" + i, { opacity: 1, duration: d }, t);
      };
      const TYPE = (sel, t, d = 0.8) => {
        const el = document.querySelector(sel), s = el.textContent, o = { v: 0 };
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
        tl.fromTo(o, { v: 0 }, { v: s.length, duration: d, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = s.slice(0, Math.round(o.v)); } }, t);
      };
      const POP = (s, t, ox, oy, d = 0.5) => IN(s, t, d, { scale: 0.6, svgOrigin: ((ox) + " " + (oy)) }, { scale: 1, svgOrigin: ((ox) + " " + (oy)), ease: "back.out(2)" });


      IN("#re-badge", 0.1, 0.5);
      tl.to("#re-g0", { attr: { fill: "#2b5866", "stroke-width": 4 }, duration: 0.4 }, 0.5);

      // L0 fork of paths
      IN("#re-fk0", at(0, 0.05), 0.3);
      DRAW("#re-fk1", at(0, 0.08), 0.6); IN("#re-fk1", at(0, 0.08), 0.05); IN("#re-fk1l", at(0, 0.25), 0.4);
      DRAW("#re-fk2", at(0, 0.4), 0.6); IN("#re-fk2", at(0, 0.4), 0.05); IN("#re-fk2l", at(0, 0.55), 0.4);
      tl.to("#re-fk1, #re-fk1l", { opacity: 0.3, duration: 0.4 }, at(0, 0.8));
      tl.to("#re-fk2", { attr: { "stroke-width": 7 }, duration: 0.4 }, at(0, 0.8));
      // L1 code with startPrank
      IN("#re-p1", at(1, 0.02), 0.6);
      HL("re-p1", 1, 1, at(1, 0.12), 7);
      HL("re-p1", 2, 2, at(1, 0.22), 7);
      HL("re-p1", 5, 5, at(1, 0.31), 7);
      HL("re-p1", 0, 0, at(1, 0.45), 7);
      IN("#re-br", at(1, 0.55), 0.05); DRAW("#re-br", at(1, 0.55), 0.8);
      IN("#re-brl", at(1, 0.65), 0.5);
      HL("re-p1", 6, 6, at(1, 0.88), 7);
      // L2 daily limit math
      OUT("#re-fork", at(2, 0), 0.4);
      HL("re-p1", 2, 2, at(2, 0.05), 7);
      IN("#re-lt", at(2, 0.08), 0.4); IN("#re-lf", at(2, 0.08), 0.5);
      tl.to("#re-lu", { attr: { width: 296 }, duration: 0.8, ease: "power2.out" }, at(2, 0.3));
      IN("#re-l3", at(2, 0.42), 0.4);
      IN("#re-lr", at(2, 0.55), 0.4); IN("#re-l2", at(2, 0.58), 0.4);
      HL("re-p1", 5, 5, at(2, 0.7), 7);
      tl.to("#re-lq", { attr: { width: 300 }, duration: 0.7, ease: "power2.out" }, at(2, 0.72));
      POP("#re-gt", at(2, 0.84), 1790, 300);
      // L3 expectRevert
      HL("re-p1", 3, 4, at(3, 0.06), 7);
