        </g>
      </g>
      <!-- 术语卡（统一样式）：左上角；一次只放一个词 -->
      <g id="ci-term" class="h">
        <rect x="70" y="56" width="620" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">持续集成 <tspan font-size="28" font-weight="400" fill="#8a8f99">CI</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">每次提交自动编译、测试、检查</text>
      </g>
      <g id="ci-term2" class="h">
        <rect x="70" y="56" width="620" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">静态分析 <tspan font-size="28" font-weight="400" fill="#8a8f99">Static Analysis</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">不运行代码，分析源码找问题</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const POP = (s, t, ox, oy, d = 0.5) => IN(s, t, d, { scale: 0.6, svgOrigin: ox + " " + oy }, { scale: 1, svgOrigin: ox + " " + oy, ease: "back.out(2)" });
      const HL = (id, a, b, t, n, d = 0.35) => {
        const y0 = +document.querySelector("#" + id + "-l0").getAttribute("y");
        const lh = +document.querySelector("#" + id + "-hl").getAttribute("data-lh");
        tl.to("#" + id + "-hl", { opacity: 1, attr: { y: y0 - lh * 0.71 + a * lh, height: (b - a + 1) * lh }, duration: d, ease: "power2.out" }, t);
        for (let i = 0; i < n; i++) tl.to("#" + id + "-l" + i, { opacity: (i >= a && i <= b) ? 1 : 0.6, duration: d }, t);
      };
      const LIT = (k, t, c = "#83C167") => tl.to("#ci-sc" + k, { fill: c, stroke: c, duration: 0.3 }, t);

      // L0 CI：提交投进服务器
      IN("#ci-term", at(0, 0.02), 0.5);
      IN("#ci-env", at(0, 0.1), 0.5, { y: 20 }, { y: 0 });
      IN("#ci-envl", at(0, 0.12), 0.5);
      POP("#ci-srv", at(0, 0.25), 1400, 530, 0.6);
      IN("#ci-gear", at(0, 0.27), 0.5);
      ARROW("#ci-a0", at(0, 0.4), 0.6);
      OUT("#ci-envl", at(0, 0.5), 0.3);
      tl.to("#ci-env", { x: 1035, y: -40, opacity: 0, duration: 1.0, ease: "power2.in" }, at(0, 0.5));
      tl.fromTo("#ci-gear", { rotation: 0 }, { rotation: 540, svgOrigin: "1400 465", duration: 5.5, ease: "none", immediateRender: false }, at(0, 0.6));
      IN("#ci-j0", at(0, 0.68), 0.4, { x: -16 }, { x: 0 });
      IN("#ci-j1", at(0, 0.76), 0.4, { x: -16 }, { x: 0 });
      IN("#ci-j2", at(0, 0.84), 0.4, { x: -16 }, { x: 0 });

      // L1 静态分析
      OUT("#ci-s0", at(1, 0), 0.4);
      OUT("#ci-term", at(1, 0), 0.3);
      IN("#ci-term2", at(1, 0) + 0.35, 0.5);
      IN("#ci-sheet", at(1, 0.22), 0.6);
      IN("#ci-magm", at(1, 0.32), 0.3);
      tl.fromTo("#ci-magm", { y: 0, x: 0 }, { y: 240, x: 40, duration: 2.0, ease: "sine.inOut", immediateRender: false }, at(1, 0.34));
      tl.to("#ci-b1", { fill: "#FF9F43", duration: 0.3 }, at(1, 0.39));
      tl.to("#ci-b4", { fill: "#FF9F43", duration: 0.3 }, at(1, 0.5));
      OUT("#ci-magm", at(1, 0.54), 0.3);
      IN("#ci-t1", at(1, 0.56), 0.5);
      IN("#ci-t1l0", at(1, 0.6), 0.4, { x: -12 }, { x: 0 });
      IN("#ci-t1l1", at(1, 0.68), 0.4, { x: -12 }, { x: 0 });
      IN("#ci-fold", at(1, 0.7), 0.5);
      IN("#ci-t1l2", at(1, 0.84), 0.4, { x: -12 }, { x: 0 });
      tl.to("#ci-fold", { opacity: 0.3, duration: 0.5 }, at(1, 0.9));
      IN("#ci-ign", at(1, 0.92), 0.4);

      // L2 四项检查
      OUT("#ci-s1", at(2, 0), 0.4);
      OUT("#ci-term2", at(2, 0), 0.4);
      IN("#ci-k0", at(2, 0.08), 0.5, { y: 20 }, { y: 0 });
      tl.to("#ci-f0", { attr: { x: 130 }, duration: 0.5, ease: "power2.inOut" }, at(2, 0.2));
      tl.to("#ci-f1", { attr: { x: 130 }, duration: 0.5, ease: "power2.inOut" }, at(2, 0.22));
      tl.to("#ci-f3", { attr: { x: 130 }, duration: 0.5, ease: "power2.inOut" }, at(2, 0.24));
      IN("#ci-k1", at(2, 0.3), 0.5, { y: 20 }, { y: 0 });
      tl.fromTo("#ci-cov", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, at(2, 0.36));
      IN("#ci-k2", at(2, 0.52), 0.5, { y: 20 }, { y: 0 });
      [["#ci-g0", 520], ["#ci-g1", 470], ["#ci-g2", 560], ["#ci-g3", 500]].forEach(([g, y], i) => tl.fromTo(g, { attr: { height: 0, y: 620 } }, { attr: { height: 620 - y, y }, duration: 0.5, ease: "power2.out" }, at(2, 0.58) + i * 0.12));
      IN("#ci-k3", at(2, 0.78), 0.5, { y: 20 }, { y: 0 });

      // L3 工作流
      OUT("#ci-s2", at(3, 0), 0.4);
      IN("#ci-p", at(3, 0.03), 0.6);
      IN("#ci-sline", at(3, 0.12), 0.4);
      for (let k = 0; k < 6; k++) IN("#ci-st" + k, at(3, 0.14) + k * 0.08, 0.3);
      HL("ci-p", 0, 0, at(3, 0.28), 11); LIT(0, at(3, 0.3));
      HL("ci-p", 4, 5, at(3, 0.42), 11); LIT(1, at(3, 0.44));
      IN("#ci-lib", at(3, 0.52), 0.5, { x: 60 }, { x: 0 });
      HL("ci-p", 6, 6, at(3, 0.7), 11); LIT(2, at(3, 0.72));
      HL("ci-p", 7, 7, at(3, 0.84), 11); LIT(3, at(3, 0.85));
      HL("ci-p", 8, 8, at(3, 0.9), 11); LIT(4, at(3, 0.91));
      HL("ci-p", 9, 9, at(3, 0.96), 11); LIT(5, at(3, 0.97));

      // L4 合约大小 + gas 快照
      HL("ci-p", 8, 8, at(4, 0.02), 11);
      IN("#ci-size", at(4, 0.06), 0.5);
      IN("#ci-lim", at(4, 0.28), 0.4);
      IN("#ci-sbar", at(4, 0.36), 0.1);
      tl.to("#ci-sbar", { attr: { width: 300 }, duration: 0.8, ease: "power2.out" }, at(4, 0.36));
      HL("ci-p", 10, 10, at(4, 0.55), 11);
      IN("#ci-st6", at(4, 0.55), 0.3); LIT(6, at(4, 0.6));
      IN("#ci-gas", at(4, 0.62), 0.5);
      IN("#ci-gnow", at(4, 0.66), 0.4);
      tl.to("#ci-gnow", { attr: { y: 790, height: 170 }, duration: 0.6, ease: "power2.out" }, at(4, 0.76));
      LIT(6, at(4, 0.86), "#FC6255");
      IN("#ci-gfail", at(4, 0.87), 0.4);

      // L5 Slither 任务
      OUT("#ci-size, #ci-sbar, #ci-lim, #ci-gas, #ci-gnow, #ci-gfail, #ci-lib", at(5, 0), 0.35);
      LIT(6, at(5, 0.02));
      tl.to("#ci-p-hl", { opacity: 0, duration: 0.35 }, at(5, 0.02));
      for (let i = 0; i < 11; i++) tl.to("#ci-p-l" + i, { opacity: 1, duration: 0.35 }, at(5, 0.02));
      IN("#ci-job", at(5, 0.1), 0.5, { x: 30 }, { x: 0 });
      IN("#ci-jl", at(5, 0.2), 0.3);
      POP("#ci-hi", at(5, 0.5), 1378, 448, 0.4);
      for (let k = 0; k < 7; k++) LIT(k, at(5, 0.7), "#FC6255");
      tl.to("#ci-jl", { fill: "#FC6255", stroke: "#FC6255", duration: 0.3 }, at(5, 0.7));
      IN("#ci-red", at(5, 0.74), 0.4);

      // L6 Secrets + 私钥不进 CI
      OUT("#ci-s3", at(6, 0), 0.4);
      IN("#ci-safe", at(6, 0.04), 0.5);
      IN("#ci-sec0", at(6, 0.12), 0.4, { x: -16 }, { x: 0 });
      IN("#ci-sec1", at(6, 0.18), 0.4, { x: -16 }, { x: 0 });
      IN("#ci-srv2", at(6, 0.22), 0.5);
      ARROW("#ci-a6", at(6, 0.3), 0.5);
      IN("#ci-keym", at(6, 0.42), 0.4);
      tl.to("#ci-keym", { x: -200, duration: 0.6, ease: "power2.in" }, at(6, 0.5));
      POP("#ci-ban", at(6, 0.56), 1185, 470, 0.35);
      tl.to("#ci-keym", { x: 0, duration: 0.5, ease: "back.out(2)" }, at(6, 0.56) + 0.3);
      IN("#ci-ms", at(6, 0.72), 0.5, { y: 16 }, { y: 0 });
      IN("#ci-globe", at(6, 0.78), 0.5);
      ARROW("#ci-a7", at(6, 0.84), 0.6);

      tl.to("#ci-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ci-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["ci"] = tl;
    })();
  </script>
</template>
