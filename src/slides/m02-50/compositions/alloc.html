      LIT(4, at(3, 0.66));

      IN("#al-fc", at(4, 0.18), 0.4);
      ARROW("#al-a1", at(4, 0.26), 0.4);

      tl.to("#al-c1", { attr: { cx: 1240 }, duration: 0.6, ease: "power1.inOut" }, at(4, 0.3));
      OUT("#al-c1", at(4, 0.3) + 0.6, 0.2);
      IN("#al-fu", at(4, 0.55), 0.4);
      ARROW("#al-a2", at(4, 0.68), 0.4);
      IN("#al-a2l", at(4, 0.7), 0.3);

      ARROW("#al-ye", at(5, 0.32), 0.4); IN("#al-yel", at(5, 0.32), 0.3);
      IN("#al-by", at(5, 0.36), 0.4);
      ARROW("#al-m1", at(5, 0.58), 0.5);
      ARROW("#al-m2", at(5, 0.58), 0.5);

      ARROW("#al-d1", at(5, 0.74), 0.3);
      IN("#al-bl", at(5, 0.76), 0.4);
