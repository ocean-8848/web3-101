    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const LY = i => 320 + 40 * (i - 1) - 28;
      const HL = (a, b, t) => {
        tl.to("#bu-hl", { attr: { y: LY(a), height: 40 * (b - a + 1) }, duration: 0.4, ease: "power2.inOut" }, t);
        for (let i = 1; i <= 12; i++) tl.to(`#bu-l${i}`, { opacity: i >= a && i <= b ? 1 : 0.6, duration: 0.3 }, t);
      };
      // L0 market box expands into the code panel
      IN("#bu-pr, #bu-mk", 0, 0.25);
      tl.to("#bu-mk", { opacity: 0, duration: 0.25 }, at(0, 0.0));
      tl.to("#bu-pr", { attr: { x: 80, y: 220, width: 1070, height: 580 }, stroke: "#3a3f4a", strokeWidth: 2, duration: 0.8, ease: "power3.inOut" }, at(0, 0.0));
      IN("#bu-chrome", at(0, 0.45), 0.4);
      for (let i = 1; i <= 12; i++) IN(`#bu-l${i}`, at(0, 0.5) + 0.04 * i, 0.3);
      IN("#bu-hl", at(0, 0.9), 0.4);
      // L1 checks
      HL(4, 5, at(1, 0.02));
      IN("#bu-ck1", at(1, 0.15), 0.4, { x: 16 }, { x: 0 });
      IN("#bu-ck1v", at(1, 0.32), 0.3, { scale: 1.6, svgOrigin: "1584 334" }, { scale: 1, svgOrigin: "1584 334" });
      IN("#bu-ck2", at(1, 0.55), 0.4, { x: 16 }, { x: 0 });
      IN("#bu-ck2v", at(1, 0.75), 0.3, { scale: 1.6, svgOrigin: "1584 440" }, { scale: 1, svgOrigin: "1584 440" });
      // L2 effects before interaction; counter-example
      OUT("#bu-ck", at(2, 0.0), 0.3);
      HL(6, 7, at(2, 0.02));
      IN("#bu-n1", at(2, 0.05), 0.4);
      IN("#bu-n2", at(2, 0.12), 0.4);
      IN("#bu-hd1", at(2, 0.2), 0.4);
      IN("#bu-bx", at(2, 0.25), 0.4);
      ARROW("#bu-cb", at(2, 0.35), 0.5);
      IN("#bu-rx", at(2, 0.38), 0.4);
      IN("#bu-cbl", at(2, 0.4), 0.3);
      ARROW("#bu-re", at(2, 0.58), 0.5);
      IN("#bu-rel", at(2, 0.6), 0.3);
      IN("#bu-t1", at(2, 0.8), 0.3, { scale: 1.3, svgOrigin: "1335 725" }, { scale: 1, svgOrigin: "1335 725" });
      IN("#bu-t2", at(2, 0.88), 0.3, { scale: 1.3, svgOrigin: "1555 725" }, { scale: 1, svgOrigin: "1555 725" });
      // L3 correct order, then C-E-I bands, then the lock
      OUT("#bu-hd1, #bu-t2", at(3, 0.0), 0.3);
      IN("#bu-hd2", at(3, 0.0) + 0.3, 0.3);
      tl.to("#bu-t1r", { stroke: "#83C167", fill: "#83C16722", duration: 0.3 }, at(3, 0.02));
      tl.to("#bu-t1t", { fill: "#83C167", duration: 0.3 }, at(3, 0.02));
      HL(6, 6, at(3, 0.02));
      IN("#bu-nl", at(3, 0.08), 0.3, { scale: 1.3, svgOrigin: "1555 725" }, { scale: 1, svgOrigin: "1555 725" });
      HL(7, 7, at(3, 0.14));
      IN("#bu-n3", at(3, 0.24), 0.4);
      HL(9, 10, at(3, 0.24));
      OUT("#bu-bad", at(3, 0.34), 0.35);
      IN("#bu-bd1, #bu-sg", at(3, 0.38), 0.4);
      ARROW("#bu-ba1", at(3, 0.44), 0.3);
      IN("#bu-bd2, #bu-sn", at(3, 0.47), 0.4);
      ARROW("#bu-ba2", at(3, 0.53), 0.3);
      IN("#bu-bd3, #bu-si", at(3, 0.56), 0.4);
      HL(1, 2, at(3, 0.7));
      IN("#bu-lock", at(3, 0.74), 0.4, { y: -12 }, { y: 0 });
      // L4 fee math
      OUT("#bu-bands", at(4, 0.0), 0.35);
      HL(8, 8, at(4, 0.02));
      IN("#bu-f1", at(4, 0.15), 0.4, { x: 16 }, { x: 0 });
      IN("#bu-f2", at(4, 0.3), 0.4);
      IN("#bu-f3", at(4, 0.48), 0.4, { x: 16 }, { x: 0 });
      IN("#bu-f4", at(4, 0.62), 0.4);
      IN("#bu-f4l", at(4, 0.66), 0.4);
      DRAW("#bu-fd", at(4, 0.76), 0.4);
      HL(10, 10, at(4, 0.8));
      IN("#bu-f5", at(4, 0.8), 0.5, { y: 10 }, { y: 0 });
      // L5 storage slot packing
      OUT("#bu-codeall, #bu-right", at(5, 0.0), 0.4);
      IN("#bu-so, #bu-tk", at(5, 0.08), 0.5);
      IN("#bu-sp", at(5, 0.14), 0.5, { x: 80 }, { x: 0 });
      IN("#bu-mx", at(5, 0.3), 0.5);
      IN("#bu-ss", at(5, 0.6), 0.5, { x: -80 }, { x: 0 });
      IN("#bu-sd", at(5, 0.66), 0.3);
      IN("#bu-st", at(5, 0.72), 0.5);
      tl.to("#bu-so", { stroke: "#83C167", strokeWidth: 5, duration: 0.4 }, at(5, 0.86));

      tl.to("#bu-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["buy"] = tl;
    })();
