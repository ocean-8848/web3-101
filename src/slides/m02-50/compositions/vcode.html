  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      // 代码行高亮
      const LINES = [1, 2, 3, 4, 5, 6, 8, 9, 10, 11, 12];
      const ly = i => 330 + (i - 1) * 41;
      const HL = (rows, t) => {
        tl.to("#vc-hl", { opacity: 0.15, attr: { y: ly(rows[0]) - 29, height: rows.length * 41 - 1 }, duration: 0.35, ease: "power2.inOut" }, t);
        LINES.forEach(i => tl.to("#vc-l" + i, { opacity: rows.includes(i) ? 1 : 0.6, duration: 0.3 }, t));
      };

      // L0 面板
      IN("#vc-panel", at(0, 0.02), 0.6, { y: 16 }, { y: 0 });
      LINES.forEach((i, k) => IN("#vc-l" + i, at(0, 0.15) + k * 0.08, 0.35));
      // L1 vested()
      HL([1], at(1, 0.0));
      HL([2], at(1, 0.1));
      IN("#vc-tot", at(1, 0.14), 0.6, { x: 20 }, { x: 0 });
      HL([3], at(1, 0.4));
      IN("#vc-mb", at(1, 0.4), 0.4);
      DRAW("#vc-m0", at(1, 0.42), 0.6); IN("#vc-m0l", at(1, 0.46), 0.4);
      HL([4], at(1, 0.55));
      DRAW("#vc-m2", at(1, 0.57), 0.5); IN("#vc-m2l", at(1, 0.6), 0.4);
      HL([5], at(1, 0.68));
      DRAW("#vc-m1", at(1, 0.7), 0.9);
      IN("#vc-cmp1", at(1, 0.78), 0.5, { x: -12 }, { x: 0 });
      IN("#vc-cmp2", at(1, 0.9), 0.5, { x: -12 }, { x: 0 });
      // L2 release()
      ["#vc-tot", "#vc-mini", "#vc-cmp1", "#vc-cmp2"].forEach(s => OUT(s, at(2, 0), 0.4));
      HL([8], at(2, 0.02));
      HL([9], at(2, 0.1));
      IN("#vc-s1", at(2, 0.12), 0.5);
      HL([10], at(2, 0.4));
      ARROW("#vc-a1", at(2, 0.42), 0.4); IN("#vc-s2", at(2, 0.45), 0.5);
      HL([11], at(2, 0.58));
      ARROW("#vc-a2", at(2, 0.6), 0.4); IN("#vc-s3", at(2, 0.63), 0.5);
      HL([10, 11], at(2, 0.8));
      tl.fromTo("#vc-s2r", { strokeWidth: 3 }, { strokeWidth: 7, duration: 0.3, yoyo: true, repeat: 3, immediateRender: false }, at(2, 0.82));
      // L3 为什么单独记已领取
      ["#vc-s1", "#vc-s2", "#vc-s3", "#vc-a1", "#vc-a2"].forEach(s => OUT(s, at(3, 0), 0.4));
      HL([2], at(3, 0.04));
      IN("#vc-q", at(3, 0.1), 0.6);
      [0.3, 0.42, 0.54].forEach((f, k) => {
        tl.to("#vc-qg", { attr: { width: 520 - 130 * (k + 1) }, duration: 0.5, ease: "power2.inOut" }, at(3, f));
        tl.to("#vc-qr", { attr: { x: 1760 - 130 * (k + 1), width: 130 * (k + 1) }, duration: 0.5, ease: "power2.inOut" }, at(3, f));
      });
      IN("#vc-qok", at(3, 0.62), 0.5);
      IN("#vc-qt", at(3, 0.78), 0.6, { y: 12 }, { y: 0 });
      // L4 VestingWallet + 审查要点
      ["#vc-panel", "#vc-q", "#vc-qok", "#vc-qt"].forEach(s => OUT(s, at(4, 0), 0.5));
      IN("#vc-oz", at(4, 0.06), 0.7, { y: 14 }, { y: 0 });
      IN("#vc-ozs", at(4, 0.3), 0.5);
      IN("#vc-bd1", at(4, 0.68), 0.5, { scale: 0.8, svgOrigin: "720 642" }, { scale: 1, svgOrigin: "720 642" });
      IN("#vc-bd2", at(4, 0.82), 0.5, { scale: 0.8, svgOrigin: "1200 642" }, { scale: 1, svgOrigin: "1200 642" });
      // L5 增发权限
      ["#vc-oz", "#vc-ozs", "#vc-bd1", "#vc-bd2"].forEach(s => OUT(s, at(5, 0), 0.4));
      IN("#vc-btn", at(5, 0.04), 0.5);
      IN("#vc-pie", at(5, 0.1), 0.6, { scale: 0.85, svgOrigin: "1240 540" }, { scale: 1, svgOrigin: "1240 540" });
      IN("#vc-pl", at(5, 0.14), 0.5);
      tl.to("#vc-btnin", { y: 8, duration: 0.12, yoyo: true, repeat: 1 }, at(5, 0.25));
      ARROW("#vc-pa", at(5, 0.27), 0.5);
      const pie = { m: 0 };
      const setPie = () => {
        const m = pie.m, k = (100 - m) / 100, a = 50 * k, b = 30 * k, c = 20 * k;
        const S = (id, len, off) => { const e = document.getElementById(id); e.setAttribute("stroke-dasharray", len + " 100"); e.setAttribute("stroke-dashoffset", -off); };
        S("vc-pm", m, 0); S("vc-p1", a, m); S("vc-p2", b, m + a); S("vc-p3", c, m + a + b);
      };
      tl.fromTo(pie, { m: 0 }, { m: 40, duration: 1.6, ease: "power2.inOut", immediateRender: false, onUpdate: setPie }, at(5, 0.31));
      IN("#vc-pml", at(5, 0.4), 0.5);
      IN("#vc-shell", at(5, 0.5), 0.5, { scale: 1.25, svgOrigin: "460 520" }, { scale: 1, svgOrigin: "460 520" });
      IN("#vc-shl", at(5, 0.55), 0.5);
      IN("#vc-cap", at(5, 0.68), 0.5, { y: 10 }, { y: 0 });
      tl.fromTo("#vc-shell", { strokeWidth: 5 }, { strokeWidth: 9, duration: 0.3, yoyo: true, repeat: 3, immediateRender: false }, at(5, 0.84));

      tl.to("#vc-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["vcode"] = tl;
    })();
  </script>
