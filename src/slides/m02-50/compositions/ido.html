      IN("#io-cnt", at(1, 0.05), 0.4);
      COUNT("#io-cntv", 0, 400000, at(1, 0.05), 2.6, fmtK);
      DRAW("#io-flow", at(1, 0.38), 0.6);
      IN("#io-pud", at(1, 0.5), 0.5, { attr: { rx: 20 } }, { attr: { rx: 130 } });

      IN("#io-ublk", at(3, 0.1), 0.6, { y: -20 }, { y: 0 });
