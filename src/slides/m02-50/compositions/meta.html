        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      for (let i = 0; i < 9; i++) IN(`#me-j${i}`, at(2, 0.17) + 0.18 * i, 0.3, { x: -8 }, { x: 0 });

      ARROW("#me-a2", at(2, 0.78), 0.4);
      IN("#me-img", at(2, 0.84), 0.5, { y: 10 }, { y: 0 });
      // L3 centralized server goes down

      IN("#me-sv", at(3, 0.05), 0.5, { x: -20 }, { x: 0 });
      tl.to("#me-svb", { opacity: 0.3, duration: 0.3 }, at(3, 0.4));

      tl.to("#me-hl", { strokeWidth: 4, fill: "#58C4DD44", duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.55));
      const tb = at(3, 0.72);
      OUT("#me-img", tb, 0.25);
      for (let i = 0; i < 12; i++) {
        tl.fromTo(`#me-d${i}`, { opacity: 0.9 }, { opacity: 0, x: ((i * 37) % 60) - 30, y: 40 + (i % 4) * 18, duration: 0.9, ease: "power2.in", immediateRender: false }, tb);
      }
      IN("#me-gone", tb + 0.8, 0.4);
      // L4 IPFS + pin + on-chain SVG
      OUT("#me-sv, #me-svx, #me-gone", at(4, 0), 0.4);
      [0, 1, 2, 3, 4, 5].forEach(k => IN(`#me-n${k}`, at(4, 0.05) + 0.1 * k, 0.3));

      IN("#me-hash", at(4, 0.2), 0.5, { y: 8 }, { y: 0 });
      tl.set("#me-imgR", { stroke: "#83C167", strokeDasharray: "none" }, at(4, 0.3));
      IN("#me-img", at(4, 0.3), 0.5, {}, { immediateRender: false });
      IN("#me-il", at(4, 0.32), 0.4);
      IN("#me-pin", at(4, 0.58), 0.4, { y: -20 }, { y: 0 });
      IN("#me-svg", at(4, 0.86), 0.5, { scale: 0.9, svgOrigin: "810 940" }, { scale: 1, svgOrigin: "810 940" });

      IN("#me-w", at(5, 0.04), 0.5);
      IN("#me-wc", at(5, 0.07), 0.5);
      IN("#me-wl", at(5, 0.08), 0.5);
