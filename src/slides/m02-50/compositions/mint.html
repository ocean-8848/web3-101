      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const LY = i => 320 + 38 * (i - 1) - 27;
      const ALLL = [...Array(12)].map((_, i) => `#mi-l${i + 1}`);
      const HL = (a, b, t) => {
        tl.to("#mi-hl", { attr: { y: LY(a), height: 38 * (b - a + 1) }, opacity: 1, duration: 0.4, ease: "power2.inOut" }, t);
        const on = ALLL.slice(a - 1, b), off = ALLL.filter(s => !on.includes(s));
        tl.to(off.join(","), { opacity: 0.6, duration: 0.4 }, t);
        tl.to(on.join(","), { opacity: 1, duration: 0.4 }, t);
      };
      // L0 panel types in
      IN("#mi-code", at(0, 0.02), 0.5);
      ALLL.forEach((s, i) => IN(s, at(0, 0.08) + 0.3 * i, 0.25, { x: -10 }, { x: 0 }));
      IN("#mi-oz", at(0, 0.35), 0.5);
      // L1 constants + machine
      HL(3, 4, at(1, 0.02));
      IN("#mi-mc", at(1, 0.15), 0.6, { x: 30 }, { x: 0 });
      IN("#mi-pr", at(1, 0.55), 0.5, { y: 10 }, { y: 0 });
      // L2 two checks
      HL(6, 7, at(2, 0.0));
      COUNT("#mi-cnt", 0, 1000, at(2, 0.06), 0.8);
      tl.to("#mi-mcr", { stroke: "#FC6255", duration: 0.2 }, at(2, 0.06) + 0.8);
      IN("#mi-so", at(2, 0.06) + 0.85, 0.3, { scale: 1.3, svgOrigin: "1490 612" }, { scale: 1, svgOrigin: "1490 612" });
      OUT("#mi-so", at(2, 0.5), 0.3);
      tl.to("#mi-mcr", { stroke: "#58C4DD", duration: 0.3 }, at(2, 0.5));
      COUNT("#mi-cnt", 1000, 5, at(2, 0.5), 0.3);
      IN("#mi-pay", at(2, 0.55), 0.3);
      tl.to("#mi-pay", { x: -100, duration: 0.4, ease: "power2.in" }, at(2, 0.6));
      tl.to("#mi-pay", { x: 0, duration: 0.6, ease: "back.out(2)" }, at(2, 0.6) + 0.4);
      IN("#mi-wp", at(2, 0.6) + 0.4, 0.3, { x: -12 }, { x: 0 });
      // L3 nextId++ before callback
      OUT("#mi-pay, #mi-wp", at(3, 0), 0.3);
      HL(8, 8, at(3, 0.02));
      COUNT("#mi-cnt", 5, 6, at(3, 0.28), 0.3);
      tl.to("#mi-mcr", { strokeWidth: 6, duration: 0.2, yoyo: true, repeat: 1 }, at(3, 0.28));
      ARROW("#mi-cb", at(3, 0.42), 0.4);
      IN("#mi-cbl", at(3, 0.44), 0.3);
      IN("#mi-rc", at(3, 0.46), 0.4, { y: 10 }, { y: 0 });
      ARROW("#mi-rb", at(3, 0.66), 0.7);
      IN("#mi-r6", at(3, 0.76), 0.5, { y: 8 }, { y: 0 });
      // L4 baseURI + withdraw
      OUT("#mi-cb, #mi-cbl, #mi-rc, #mi-rb, #mi-r6", at(4, 0), 0.3);
      HL(10, 11, at(4, 0.02));
      IN("#mi-u1", at(4, 0.08), 0.4);
      IN("#mi-u2", at(4, 0.13), 0.3);
      IN("#mi-u3", at(4, 0.18), 0.4, { y: -14 }, { y: 0 });
      IN("#mi-u4", at(4, 0.3), 0.5, { y: -10 }, { y: 0 });
      IN("#mi-wd", at(4, 0.58), 0.5, { x: -16 }, { x: 0 });
      IN("#mi-ow", at(4, 0.68), 0.4);
      ARROW("#mi-eth", at(4, 0.8), 0.5);
      // L5 reveal risk
      OUT("#mi-code, #mi-right", at(5, 0), 0.5);
      IN("#mi-gu", at(5, 0.05), 0.7, { scale: 0.96, svgOrigin: "580 560" }, { scale: 1, svgOrigin: "580 560" });
      IN("#mi-g1", at(5, 0.12), 0.4);
      IN("#mi-pj", at(5, 0.28), 0.5);
      ARROW("#mi-pa", at(5, 0.36), 0.5);
      IN("#mi-pal", at(5, 0.38), 0.4);
      IN("#mi-gr", at(5, 0.45), 0.5);
      OUT("#mi-gu", at(5, 0.45) + 0.3, 0.3);
      OUT("#mi-g1", at(5, 0.45), 0.3);
      IN("#mi-g2", at(5, 0.45) + 0.35, 0.4);
      IN("#mi-warn", at(5, 0.5), 0.4, { scale: 1.2, svgOrigin: "1400 775" }, { scale: 1, svgOrigin: "1400 775" });
      OUT("#mi-warn", at(5, 0.68), 0.3);
      IN("#mi-lock", at(5, 0.68) + 0.35, 0.4, { y: -10 }, { y: 0 });
      IN("#mi-lt", at(5, 0.75), 0.5);
      // L6 practice
      OUT("#mi-rv", at(6, 0), 0.5);
      IN("#mi-pt0", at(6, 0.02), 0.4);
      IN("#mi-q1", at(6, 0.06), 0.5, { y: 14 }, { y: 0 });
      IN("#mi-q2", at(6, 0.28), 0.5, { y: 14 }, { y: 0 });
      IN("#mi-q3", at(6, 0.52), 0.5, { y: 14 }, { y: 0 });
      IN("#mi-q4", at(6, 0.78), 0.5, { y: 14 }, { y: 0 });


      tl.to("#mi-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["mint"] = tl;
    })();
