    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const fmtN = v => Math.round(v).toLocaleString("en-US");
      // L0 unit prices
      IN("#ec-cap", at(0, 0.03), 0.6);
      IN("#ec-p1", at(0, 0.42), 0.6, { y: -10 }, { y: 0 });
      IN("#ec-p2", at(0, 0.75), 0.6, { y: -10 }, { y: 0 });
      // L1 standard column
      IN("#ec-c1", at(1, 0.02), 0.6);
      IN("#ec-a0", at(1, 0.18), 0.5, { x: -14 }, { x: 0 });
      tl.to("#ec-p1 rect", { strokeWidth: 5, duration: 0.25, yoyo: true, repeat: 1 }, at(1, 0.2));
      IN("#ec-a1", at(1, 0.42), 0.5, { x: -14 }, { x: 0 });
      IN("#ec-a2", at(1, 0.6), 0.5, { x: -14 }, { x: 0 });
      IN("#ec-a3", at(1, 0.73), 0.5, { x: -14 }, { x: 0 });
      tl.to("#ec-p2 rect", { strokeWidth: 5, duration: 0.25, yoyo: true, repeat: 1 }, at(1, 0.74));
      DRAW("#ec-ad", at(1, 0.84), 0.5);
      IN("#ec-at", at(1, 0.86), 0.4);
      COUNT("#ec-atn", 0, 141780, at(1, 0.86), 1.2, fmtN);
      // L2 ERC721A column
      IN("#ec-c2", at(2, 0.02), 0.6);
      IN("#ec-b0", at(2, 0.16), 0.5, { x: -14 }, { x: 0 });
      IN("#ec-b1", at(2, 0.36), 0.5, { x: -14 }, { x: 0 });
      IN("#ec-b2", at(2, 0.56), 0.5, { x: -14 }, { x: 0 });
      IN("#ec-b3", at(2, 0.72), 0.5, { x: -14 }, { x: 0 });
      DRAW("#ec-bd", at(2, 0.84), 0.5);
      IN("#ec-bt", at(2, 0.86), 0.4);
      COUNT("#ec-btn", 0, 57980, at(2, 0.86), 1.2, fmtN);
      // L3 bars: batch 5 vs batch 1
      IN("#ec-l1, #ec-l2, #ec-r1, #ec-r2, #ec-n5", at(3, 0.0), 0.3);
      tl.fromTo("#ec-r1", { attr: { width: 0 } }, { attr: { width: 1300 }, duration: 0.8, ease: "power2.out", immediateRender: false }, at(3, 0.02));
      tl.fromTo("#ec-r2", { attr: { width: 0 } }, { attr: { width: 532 }, duration: 0.8, ease: "power2.out", immediateRender: false }, at(3, 0.02));
      IN("#ec-v1, #ec-v2", at(3, 0.2), 0.4);
      const t1 = at(3, 0.52);
      OUT("#ec-v1, #ec-v2, #ec-n5", t1, 0.25);
      IN("#ec-n1", t1 + 0.3, 0.4);
      tl.to("#ec-r1", { attr: { width: 430 }, duration: 0.8, ease: "power2.inOut" }, t1 + 0.1);
      tl.to("#ec-r2", { attr: { width: 440 }, duration: 0.8, ease: "power2.inOut" }, t1 + 0.1);
      // L4 consecutive ids vs arbitrary
      OUT("#ec-cols, #ec-bars, #ec-p1, #ec-p2", at(4, 0.0), 0.4);
      IN("#ec-axl", at(4, 0.08), 0.5);
      IN("#ec-ok", at(4, 0.12), 0.5);
      ["#ec-k0", "#ec-k1", "#ec-k2", "#ec-k3"].forEach((s, i) => ARROW(s, at(4, 0.18) + 0.25 * i, 0.3));
      DRAW("#ec-okm", at(4, 0.3), 0.4); tl.set("#ec-okm", { opacity: 1 }, at(4, 0.3));
      IN("#ec-bdl", at(4, 0.62), 0.5);
      IN("#ec-bad", at(4, 0.66), 0.5, { y: 12 }, { y: 0 });
      IN("#ec-x", at(4, 0.8), 0.3, { scale: 1.4, svgOrigin: "1310 720" }, { scale: 1, svgOrigin: "1310 720" });
      // L5 code panel
      OUT("#ec-ax, #ec-cap", at(5, 0.0), 0.35);
      IN("#ec-code", at(5, 0.06), 0.6, { y: 16 }, { y: 0 });
      IN("#ec-hl", at(5, 0.3), 0.4);
      tl.to("#ec-cl text:not(#ec-c3)", { opacity: 0.6, duration: 0.4 }, at(5, 0.3));
      IN("#ec-cn1", at(5, 0.4), 0.5);
      IN("#ec-cn2", at(5, 0.62), 0.5);

      tl.to("#ec-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["ercacalc"] = tl;
    })();
