      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 actors, the card stays with the seller
      IN("#ma-s", at(0, 0.02), 0.5, { y: 12 }, { y: 0 });

      // L1 approval rope
      OUT("#ma-q", at(1, 0.0), 0.3);
      ARROW("#ma-a1", at(1, 0.08), 0.8);
      IN("#ma-a1l", at(1, 0.12), 0.5);
      DRAW("#ma-rope", at(1, 0.42), 0.7);
      IN("#ma-ropel", at(1, 0.5), 0.4);
      IN("#ma-a1n", at(1, 0.66), 0.5);
      // L2 list + two checks + record
      ARROW("#ma-a2", at(2, 0.04), 0.6);
      IN("#ma-a2l", at(2, 0.06), 0.5);
      ARROW("#ma-k1", at(2, 0.28), 0.5);
      IN("#ma-k1l", at(2, 0.3), 0.4);

      IN("#ma-k2v", at(2, 0.58), 0.3, { scale: 1.6, svgOrigin: "1032 750" }, { scale: 1, svgOrigin: "1032 750" });
      IN("#ma-rec", at(2, 0.7), 0.5, { scale: 0.6, svgOrigin: "720 325" }, { scale: 1, svgOrigin: "720 325" });
      // L3 non-custodial: card still in wallet; cancel then restore
      IN("#ma-term", at(3, 0.0), 0.5);
      tl.to("#ma-cardr", { strokeWidth: 6, duration: 0.35, yoyo: true, repeat: 3 }, at(3, 0.15));
      ARROW("#ma-a3", at(3, 0.45), 0.5);
      IN("#ma-a3l", at(3, 0.47), 0.4);
      OUT("#ma-rec", at(3, 0.58), 0.35);
      IN("#ma-rec", at(3, 0.82), 0.4);
      // L4 buy: delete record -> transfer -> pay
      OUT("#ma-term, #ma-rows1", at(4, 0.0), 0.4);
      IN("#ma-eth", at(4, 0.04), 0.4);
      ARROW("#ma-b1", at(4, 0.1), 0.7);
      IN("#ma-b1l", at(4, 0.12), 0.4);
      tl.to("#ma-ethm", { y: 94, duration: 0.35, ease: "power2.in" }, at(4, 0.14));
      tl.to("#ma-ethm", { x: -960, duration: 0.9, ease: "power2.inOut" }, at(4, 0.14) + 0.35);
      IN("#ma-s1", at(4, 0.26), 0.3);
      tl.to("#ma-recr", { stroke: "#8a8f99", fill: "#8a8f9922", duration: 0.3 }, at(4, 0.26));
      tl.to("#ma-rect", { fill: "#6b6f7a", duration: 0.3 }, at(4, 0.26));
      OUT("#ma-rec", at(4, 0.32), 0.4);
      IN("#ma-s2", at(4, 0.38), 0.3);
      ARROW("#ma-b2", at(4, 0.4), 0.5);
      IN("#ma-b2l", at(4, 0.4), 0.4);
      const tf = at(4, 0.46);
      tl.to("#ma-cardm", { y: 355, duration: 0.45, ease: "power2.in" }, tf);
      tl.to("#ma-cardm", { x: 1440, duration: 1.1, ease: "power2.inOut" }, tf + 0.45);
      tl.to("#ma-cardm", { y: 0, duration: 0.45, ease: "power2.out" }, tf + 1.55);
      IN("#ma-gl", tf + 0.9, 0.4);
      OUT("#ma-o1", tf + 1.5, 0.25); IN("#ma-o2", tf + 1.75, 0.3);
      IN("#ma-s3", at(4, 0.68), 0.3);
      OUT("#ma-eth", at(4, 0.68), 0.3);
      ARROW("#ma-b3", at(4, 0.68), 0.6);

      IN("#ma-sc", at(4, 0.76), 0.4, { scale: 0.5, svgOrigin: "240 326" }, { scale: 1, svgOrigin: "240 326" });

      OUT("#ma-card, #ma-o2", at(5, 0.0), 0.3);
      tl.set("#ma-cardm", { x: 0, y: 0 }, at(5, 0.0) + 0.35);

      IN("#ma-card, #ma-rec, #ma-o1, #ma-rp", at(5, 0.0) + 0.4, 0.4);
      IN("#ma-tp", at(5, 0.12), 0.4);
      tl.to("#ma-cardm", { y: 623, duration: 0.8, ease: "power2.inOut" }, at(5, 0.15));

      IN("#ma-eth", at(5, 0.3), 0.3);
      ARROW("#ma-r1", at(5, 0.31), 0.6);
      IN("#ma-r1l", at(5, 0.32), 0.4);
      tl.to("#ma-ethm", { y: 94, duration: 0.3, ease: "power2.in" }, at(5, 0.32));
