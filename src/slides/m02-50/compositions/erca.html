  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 user mints 5
      IN("#er-u", at(0, 0.05), 0.5);
      IN("#er-un", at(0, 0.1), 0.5);
      IN("#er-um", at(0, 0.35), 0.5, { x: -16 }, { x: 0 });
      // L1 standard: 5 new slots
      IN("#er-lb1", at(1, 0.0), 0.5);
      [0, 1, 2, 3, 4].forEach(i => IN(`#er-e1${i}`, at(1, 0.04) + 0.06 * i, 0.3));
      IN("#er-k1", at(1, 0.15), 0.4);
      [0, 1, 2, 3, 4].forEach(i => {
        const t = at(1, 0.32 + 0.1 * i);
        IN(`#er-f1${i}`, t, 0.3); IN(`#er-t1${i}`, t + 0.05, 0.3);
        COUNT("#er-k1n", i, i + 1, t, 0.2);
      });
      // L2 ERC721A, consecutive ids
      IN("#er-term", at(2, 0.0), 0.5);
      IN("#er-lb2", at(2, 0.1), 0.5);
      IN("#er-az", at(2, 0.22), 0.5);
      [0, 1, 2, 3, 4].forEach(i => { IN(`#er-e2${i}`, at(2, 0.3) + 0.06 * i, 0.3); IN(`#er-g2${i}`, at(2, 0.34) + 0.06 * i, 0.3); });
      tl.to("#er-g20, #er-g21, #er-g22, #er-g23, #er-g24", { fill: "#e8e6df", duration: 0.25, stagger: 0.12, yoyo: true, repeat: 1 }, at(2, 0.72));
      // L3 only first record; ownerOf(3) scans back
      OUT("#er-g20", at(3, 0.0), 0.25);
      IN("#er-f20", at(3, 0.06), 0.4);
      IN("#er-a0", at(3, 0.06) + 0.25, 0.4);
      IN("#er-k2a", at(3, 0.12), 0.4);
      IN("#er-one", at(3, 0.2), 0.4);
      IN("#er-q", at(3, 0.45), 0.4);
      IN("#er-dot", at(3, 0.5), 0.2);
      [950, 685, 420].forEach((cx, k) => tl.to("#er-dot", { attr: { cx }, duration: 0.3, ease: "power2.inOut" }, at(3, 0.53) + 0.45 * k));
      tl.to("#er-f20", { strokeWidth: 6, duration: 0.2, yoyo: true, repeat: 1 }, at(3, 0.53) + 1.3);
      IN("#er-qa", at(3, 0.53) + 1.4, 0.4, { x: -10 }, { x: 0 });
      // L4 packed slot, constant writes
      OUT("#er-term", at(4, 0.0), 0.3);
      OUT("#er-dot", at(4, 0.0), 0.3);
      IN("#er-pk", at(4, 0.15), 0.5, { y: 14 }, { y: 0 });
      IN("#er-pkl", at(4, 0.3), 0.4);
      OUT("#er-k2a", at(4, 0.6), 0.25);
      IN("#er-k2b", at(4, 0.6) + 0.3, 0.4, { scale: 1.2, svgOrigin: "1700 756" }, { scale: 1, svgOrigin: "1700 756" });
      // L5 first transfer pays the deferred write
      OUT("#er-q, #er-qa, #er-pk, #er-pkl", at(5, 0.0), 0.3);
      IN("#er-tr", at(5, 0.06), 0.4);
      IN("#er-trx", at(5, 0.08), 0.4);
      OUT("#er-g22", at(5, 0.18), 0.2);
      IN("#er-o2", at(5, 0.2), 0.3);
      IN("#er-o2a", at(5, 0.22), 0.3);
      IN("#er-k2c", at(5, 0.26), 0.4);
      OUT("#er-o2a", at(5, 0.42), 0.25);
      tl.to("#er-o2", { stroke: "#58C4DD", fill: "#58C4DD22", duration: 0.3 }, at(5, 0.42));
      IN("#er-o2b", at(5, 0.42) + 0.3, 0.3);
      OUT("#er-g23", at(5, 0.5), 0.2);
      IN("#er-f23", at(5, 0.52), 0.3);
      IN("#er-o3", at(5, 0.54), 0.3);
      IN("#er-fin", at(5, 0.74), 0.5, { y: 10 }, { y: 0 });


      tl.to("#er-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#er-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["erca"] = tl;
    })();
