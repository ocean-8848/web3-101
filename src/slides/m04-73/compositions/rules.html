      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const PULSE = (s, t, o, k = 1.08) => tl.fromTo(s, { scale: 1, svgOrigin: o }, { scale: k, svgOrigin: o, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t);
      const COLS = ["#58C4DD", "#FF9F43", "#83C167", "#FF9F43"];
      const LIT = (i, t) => {
        for (let j = 0; j < i; j++) { tl.to(`#ru-sr${j}`, { stroke: "#3a3f4a", duration: 0.3 }, t); tl.to(`#ru-st${j}`, { fill: "#8a8f99", duration: 0.3 }, t); }
        tl.to(`#ru-sr${i}`, { stroke: COLS[i], duration: 0.3 }, t);
        tl.to(`#ru-sc${i}`, { fill: COLS[i], duration: 0.3 }, t);
        tl.to(`#ru-st${i}`, { fill: "#e8e6df", duration: 0.3 }, t);
        PULSE(`#ru-s${i}`, t, `370 ${305 + 180 * i}`, 1.04);
      };
      const HB = (sel, y, t, first) => first
        ? tl.fromTo(sel, { attr: { y }, opacity: 0 }, { attr: { y }, opacity: 1, duration: 0.3, immediateRender: false }, t)
        : tl.to(sel, { attr: { y }, duration: 0.4, ease: "power2.inOut" }, t);
      // L0
      IN("#ru-title", at(0, 0.0), 0.5);
      for (let i = 0; i < 4; i++) IN(`#ru-s${i}`, at(0, 0.3) + 0.2 * i, 0.4);
      // L1
      LIT(0, at(1, 0.02));
      IN("#ru-hk", at(1, 0.12), 0.5);
      IN("#ru-pm", at(1, 0.2), 0.4); ARROW("#ru-a0", at(1, 0.26), 0.5);
      IN("#ru-ext", at(1, 0.4), 0.4);
      IN("#ru-atk", at(1, 0.55), 0.4); ARROW("#ru-a1", at(1, 0.62), 0.5);
      IN("#ru-fake", at(1, 0.82), 0.4);
      // L2
      OUT("#ru-q1", at(2, 0), 0.4);
      IN("#ru-code1", at(2, 0.04), 0.5);
      HB("#ru-hb1", 292 + 40.6 * 3 - 29, at(2, 0.22), true);
      HB("#ru-hb1", 292 + 40.6 * 4 - 29, at(2, 0.3), false);
      IN("#ru-c1n", at(2, 0.3), 0.4);
      IN("#ru-atk2", at(2, 0.4), 0.4); ARROW("#ru-a2", at(2, 0.44), 0.5);
      IN("#ru-sh", at(2, 0.5), 0.3, { scale: 0.5, svgOrigin: "1270 748" }, { scale: 1, svgOrigin: "1270 748" });
      tl.to("#ru-a2", { stroke: "#6b6f7a", duration: 0.3 }, at(2, 0.53));
      IN("#ru-rev", at(2, 0.55), 0.3);
      IN("#ru-each", at(2, 0.64), 0.4);
      HB("#ru-hb1", 292 + 40.6 * 3 - 29, at(2, 0.66), false);
      IN("#ru-base", at(2, 0.8), 0.4);
      // L3
      OUT("#ru-q2, #ru-title", at(3, 0), 0.4);
      LIT(1, at(3, 0.02));
      IN("#ru-term", at(3, 0.08), 0.5);
      IN("#ru-f0", at(3, 0.12), 0.4); DRAW("#ru-fl0", at(3, 0.16), 0.3);
      IN("#ru-f1", at(3, 0.18), 0.4); DRAW("#ru-fl1", at(3, 0.22), 0.3); IN("#ru-f2", at(3, 0.24), 0.4);
      IN("#ru-pkt", at(3, 0.3), 0.3);
      tl.to("#ru-pkt", { x: 420, duration: 1.0, ease: "power1.inOut" }, at(3, 0.36));
      IN("#ru-pass", at(3, 0.4), 0.4);
      tl.to("#ru-pkt", { x: 840, duration: 1.0, ease: "power1.inOut" }, at(3, 0.5));
      IN("#ru-hint", at(3, 0.6), 0.4);
      OUT("#ru-term", at(3, 0.62), 0.4);
      IN("#ru-title", at(3, 0.62) + 0.45, 0.5);
      IN("#ru-sig", at(3, 0.8), 0.5);
      // L4
      OUT("#ru-q3", at(4, 0), 0.4);
      LIT(2, at(4, 0.02));
