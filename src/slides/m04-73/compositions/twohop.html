  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const PULSE = (s, t, o = 0.4) => tl.to(s, { opacity: o, duration: 0.22, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const TXT = (sel, a, b, t) => { const el = document.querySelector(sel), o = { v: 0 }; tl.fromTo(o, { v: 0 }, { v: 1, duration: 0.02, immediateRender: false, onUpdate: () => { el.textContent = o.v >= 0.5 ? b : a; } }, t); };
      const COL = (s, props, t, d = 0.3) => tl.to(s, { ...props, duration: d }, t);
      const MV = (s, props, t, d = 0.8, ease = "power2.inOut") => tl.to(s, { ...props, duration: d, ease }, t);

      const A = (s, l, t) => { ARROW(s, t, 0.5); IN(l, t + 0.1, 0.35); };
      // L0 四列 + 发起
      IN("#tw-title", at(0, 0.03), 0.5);
      IN("#tw-hu", at(0, 0.2), 0.4); IN("#tw-hr", at(0, 0.3), 0.4); IN("#tw-hp", at(0, 0.4), 0.4); IN("#tw-hh", at(0, 0.5), 0.4);
      IN("#tw-lu, #tw-lr, #tw-lp, #tw-lh", at(0, 0.55), 0.5);
      IN("#tw-lock", at(0, 0.6), 0.4);
      A("#tw-a0", "#tw-a0l", at(0, 0.75));
      // L1 unlock、回调、swap 池 1、beforeSwap
      A("#tw-a1", "#tw-a1l", at(1, 0.03));
      tl.to("#tw-sh", { y: -10, stroke: "#83C167", duration: 0.3 }, at(1, 0.09)); COL("#tw-lb", { fill: "#83C167" }, at(1, 0.09));
      A("#tw-a2", "#tw-a2l", at(1, 0.15));
      A("#tw-a3", "#tw-a3l", at(1, 0.32));
      A("#tw-a4", "#tw-a4l", at(1, 0.55));
      IN("#tw-act", at(1, 0.6), 0.3);
      IN("#tw-a5", at(1, 0.78), 0.3, { x: 20 }, { x: 0 }); IN("#tw-a5l", at(1, 0.8), 0.35);
      // L2 账本：欠 1 ETH，应得 3000 USDC；0 次转账
      IN("#tw-dp", at(2, 0.02), 0.5);
      IN("#tw-r0, #tw-r1, #tw-v0, #tw-v1", at(2, 0.08), 0.4);
      COUNT("#tw-v0", 0, -1, at(2, 0.2), 0.4);
      COUNT("#tw-v1", 0, 3000, at(2, 0.38), 0.8, v => (v >= 0.5 ? "+" : "") + Math.round(v));
      IN("#tw-zero", at(2, 0.66), 0.4, { scale: 1.3, svgOrigin: "490 595" }, { scale: 1, svgOrigin: "490 595" });
      PULSE("#tw-zero", at(2, 0.88));
      // L3 swap 池 2：USDC 抵消为 0，应得 2995 DAI
      A("#tw-a6", "#tw-a6l", at(3, 0.04));
      IN("#tw-neg", at(3, 0.24), 0.3);
      tl.to("#tw-neg", { x: 300, y: 120, duration: 0.8, ease: "power2.in" }, at(3, 0.36));
      OUT("#tw-neg", at(3, 0.36) + 0.65, 0.15);
      COUNT("#tw-v1", 3000, 0, at(3, 0.36) + 0.75, 0.4, v => (v >= 0.5 ? "+" : "") + Math.round(v));
      COL("#tw-v1", { fill: "#83C167" }, at(3, 0.36) + 0.75);
      PULSE("#tw-v1", at(3, 0.56));
      IN("#tw-r2, #tw-v2", at(3, 0.72), 0.4);
      tl.to("#tw-r2", { opacity: 0.5, duration: 1.0, yoyo: true, repeat: 1, ease: "sine.inOut" }, at(3, 0.86));
      COUNT("#tw-v2", 0, 2995, at(3, 0.74), 0.8, v => (v >= 0.5 ? "+" : "") + Math.round(v));
      // L4 settle 1 ETH、take 2995 DAI、检查上锁
      A("#tw-a7", "#tw-a7l", at(4, 0.08));
      COUNT("#tw-v0", -1, 0, at(4, 0.14), 0.3); COL("#tw-v0", { fill: "#83C167" }, at(4, 0.14));
      A("#tw-a8", "#tw-a8l", at(4, 0.32));
      COUNT("#tw-v2", 2995, 0, at(4, 0.4), 0.6, v => (v >= 0.5 ? "+" : "") + Math.round(v)); COL("#tw-v2", { fill: "#83C167" }, at(4, 0.4));
      A("#tw-a9", "#tw-a9l", at(4, 0.62));
      tl.to("#tw-sh", { y: 0, duration: 0.3 }, at(4, 0.86));
      PULSE("#tw-lock", at(4, 0.9));
      // L5 Hook 在中途被调用
      PULSE("#tw-hh", at(5, 0.04)); PULSE("#tw-act", at(5, 0.08));
      IN("#tw-c1", at(5, 0.3), 0.4, { x: 16 }, { x: 0 });
      IN("#tw-c2", at(5, 0.45), 0.4, { x: 16 }, { x: 0 });
      IN("#tw-ev1", at(5, 0.62), 0.4);
      IN("#tw-ev2", at(5, 0.72), 0.4);
      COL("#tw-act", { fill: "#FC6255" }, at(5, 0.72));
      PULSE("#tw-ev2", at(5, 0.9));
      // L6 思考题
      OUT("#tw-seq", at(6, 0), 0.4);
      IN("#tw-q", at(6, 0.12), 0.6, { scale: 0.9, svgOrigin: "960 510" }, { scale: 1, svgOrigin: "960 510" });
      PULSE("#tw-q", at(6, 0.7), 0.6);
      // L7 只 take 的后果：回滚
      MV("#tw-qo", { y: -270 }, at(7, 0.0), 0.7);
      IN("#tw-mr", at(7, 0.04), 0.5); IN("#tw-mp", at(7, 0.06), 0.5);
      IN("#tw-me, #tw-md", at(7, 0.08), 0.4);
      ARROW("#tw-mt", at(7, 0.12), 0.7); IN("#tw-mtl", at(7, 0.14), 0.4);
      IN("#tw-chip", at(7, 0.12), 0.3);
      MV("#tw-chip", { x: -330 }, at(7, 0.14), 1.0);
      COUNT("#tw-md", 2995, 0, at(7, 0.2), 0.5, v => (v >= 0.5 ? "+" : "") + Math.round(v));
      PULSE("#tw-me", at(7, 0.28), 0.3);
      COL("#tw-mpr", { stroke: "#FC6255" }, at(7, 0.36), 0.2);
      IN("#tw-mf", at(7, 0.37), 0.4);
      MV("#tw-chip", { x: -30 }, at(7, 0.5), 0.9);
      COUNT("#tw-md", 0, 2995, at(7, 0.5) + 0.8, 0.4, v => (v >= 0.5 ? "+" : "") + Math.round(v));
      IN("#tw-mrb", at(7, 0.52), 0.4, { scale: 1.3, svgOrigin: "900 725" }, { scale: 1, svgOrigin: "900 725" });
      OUT("#tw-chip", at(7, 0.5) + 0.95, 0.3);
      IN("#tw-later", at(7, 0.74), 0.5, { y: 12 }, { y: 0 });
      PULSE("#tw-later", at(7, 0.9), 0.5);


      tl.to("#tw-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["twohop"] = tl;
    })();
