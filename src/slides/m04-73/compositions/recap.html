      const PULSE = (s, t, o, k = 1.08) => tl.fromTo(s, { scale: 1, svgOrigin: o }, { scale: k, svgOrigin: o, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t);

        tl.to(`#re-pl${k}`, { x: 34, opacity: 0, duration: 0.5, ease: "power2.in" }, t + 0.5);

      const CARD = (k, li, f0, lf, rf, tEnd) => {

        IN(`#re-m${k}x`, at(li, f0) + 0.15, 0.3, { scale: 0.4, svgOrigin: "382 372" }, { scale: 1, svgOrigin: "382 372" });

        rf.forEach(([j, f]) => IN(`#re-m${k}r${j}`, at(li, f), 0.4, { x: 14 }, { x: 0 }));
        IN(`#re-m${k}rh`, at(li, rf[0][1]) - 0.1, 0.3); ARROW(`#re-m${k}c`, at(li, rf[0][1]), 0.3);
        OUT(`#re-m${k}`, tEnd - 0.35, 0.3);
      };
      OUT("#re-q0", at(2, 0) - 0.35, 0.3);
      CARD(0, 2, 0.02, [[0, 0.06]], [[0, 0.5], [1, 0.72]], at(3, 0));
      CARD(1, 3, 0.02, [[0, 0.06]], [[0, 0.45]], at(4, 0));
      CARD(2, 4, 0.02, [[0, 0.04], [1, 0.14]], [[0, 0.31]], at(4, 0.6));
