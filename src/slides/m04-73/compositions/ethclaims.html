      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const PULSE = (s, t, o = 0.4) => tl.to(s, { opacity: o, duration: 0.22, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const TXT = (sel, a, b, t) => { const el = document.querySelector(sel), o = { v: 0 }; tl.fromTo(o, { v: 0 }, { v: 1, duration: 0.02, immediateRender: false, onUpdate: () => { el.textContent = o.v >= 0.5 ? b : a; } }, t); };
      const COL = (s, props, t, d = 0.3) => tl.to(s, { ...props, duration: d }, t);
      const MV = (s, props, t, d = 0.8, ease = "power2.inOut") => tl.to(s, { ...props, duration: d, ease }, t);

      // L0 标题 + 两块面板
      IN("#et-title", at(0, 0.05), 0.5, { y: 12 }, { y: 0 });
      IN("#et-pl, #et-hl", at(0, 0.3), 0.5);
      IN("#et-pr, #et-hr", at(0, 0.45), 0.5);
      PULSE("#et-hl", at(0, 0.85));
      // L1 V3：包 → WETH → 池 → WETH → 拆
      IN("#et-v3", at(1, 0.02), 0.4);
      IN("#et-e1", at(1, 0.06), 0.4);

      ARROW("#et-a2", at(1, 0.26), 0.3); IN("#et-w1", at(1, 0.3), 0.4);
      ARROW("#et-a3", at(1, 0.36), 0.3); IN("#et-pool", at(1, 0.4), 0.4);
      ARROW("#et-a4", at(1, 0.52), 0.3); IN("#et-w2", at(1, 0.56), 0.4);
      ARROW("#et-a5", at(1, 0.62), 0.3); IN("#et-t2", at(1, 0.66), 0.3);
      ARROW("#et-a6", at(1, 0.72), 0.3); IN("#et-e2", at(1, 0.76), 0.4);
      PULSE("#et-t1, #et-t2", at(1, 0.88), 0.3);
      // L2 V4：ETH 直接付入 PoolManager
      IN("#et-v4", at(2, 0.02), 0.4);
      IN("#et-e3", at(2, 0.08), 0.4);
      IN("#et-pm4", at(2, 0.16), 0.5);
      ARROW("#et-a7", at(2, 0.42), 0.7); IN("#et-a7l", at(2, 0.48), 0.4);
      tl.to("#et-t1, #et-t2", { opacity: 0.25, duration: 0.3 }, at(2, 0.7));
      IN("#et-t1x", at(2, 0.7), 0.3); IN("#et-t2x", at(2, 0.76), 0.3);
      PULSE("#et-a7", at(2, 0.9));
      // L3 ERC-6909 凭证余额
      OUT("#et-hr", at(1, 0), 0.3);
      IN("#et-sh", at(1, 0.0) + 0.35, 0.4);
      IN("#et-s3", at(1, 0.06), 0.4);
      IN("#et-sc1", at(1, 0.22), 0.4); ARROW("#et-sa1", at(1, 0.32), 0.3);
      IN("#et-sc2", at(1, 0.38), 0.4); ARROW("#et-sa2", at(1, 0.56), 0.3);
      IN("#et-sc3", at(1, 0.62), 0.4);
      IN("#et-s3r", at(1, 0.82), 0.5, { x: -12 }, { x: 0 });
      IN("#et-s4", at(2, 0.04), 0.4);
      IN("#et-sc4", at(2, 0.14), 0.4); ARROW("#et-sa3", at(2, 0.4), 0.3);
      IN("#et-sc5", at(2, 0.46), 0.4);
      IN("#et-s4r", at(2, 0.84), 0.5, { x: -12 }, { x: 0 });
