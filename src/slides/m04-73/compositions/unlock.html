  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const PULSE = (s, t, o = 0.4) => tl.to(s, { opacity: o, duration: 0.22, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const TXT = (sel, a, b, t) => { const el = document.querySelector(sel), o = { v: 0 }; tl.fromTo(o, { v: 0 }, { v: 1, duration: 0.02, immediateRender: false, onUpdate: () => { el.textContent = o.v >= 0.5 ? b : a; } }, t); };
      const COL = (s, props, t, d = 0.3) => tl.to(s, { ...props, duration: d }, t);
      const MV = (s, props, t, d = 0.8, ease = "power2.inOut") => tl.to(s, { ...props, duration: d, ease }, t);

      // L0 闪电记账：先记差额，最后结净额
      IN("#un-term", at(0, 0.08), 0.5);
      IN("#un-ip, #un-i0", at(0, 0.14), 0.5);
      IN("#un-ib1", at(0, 0.26), 0.2); tl.fromTo("#un-ib1", { attr: { width: 0 } }, { attr: { width: 200 }, duration: 0.5, immediateRender: false }, at(0, 0.26));
      IN("#un-ib2", at(0, 0.36), 0.2); tl.fromTo("#un-ib2", { attr: { x: 960, width: 0 } }, { attr: { x: 840, width: 120 }, duration: 0.5, immediateRender: false }, at(0, 0.36));
      IN("#un-ib3", at(0, 0.46), 0.2); tl.fromTo("#un-ib3", { attr: { width: 0 } }, { attr: { width: 80 }, duration: 0.5, immediateRender: false }, at(0, 0.46));
      tl.to("#un-ib1, #un-ib2, #un-ib3", { opacity: 0.3, duration: 0.4 }, at(0, 0.62));
      IN("#un-inl, #un-inb", at(0, 0.64), 0.5, { y: -20 }, { y: 0 });
      ARROW("#un-ia", at(0, 0.78), 0.5);
      IN("#un-ial", at(0, 0.82), 0.4);
      // L1 解锁状态；第 1 步 unlock
      OUT("#un-intro", at(1, 0), 0.4);
      OUT("#un-term", at(1, 0), 0.3);
      IN("#un-hr", at(1, 0.06), 0.5); IN("#un-hp", at(1, 0.1), 0.5);
      IN("#un-ll, #un-lr", at(1, 0.16), 0.5);
      IN("#un-lock", at(1, 0.3), 0.4);
      PULSE("#un-lock", at(1, 0.48));
      IN("#un-b1", at(1, 0.6), 0.3);
      ARROW("#un-a1", at(1, 0.66), 0.8);
      IN("#un-a1l", at(1, 0.72), 0.4);
      // L2 解锁，回调 unlockCallback
      tl.to("#un-sh", { y: -12, stroke: "#83C167", duration: 0.4 }, at(2, 0.1));
      COL("#un-lb", { fill: "#83C167" }, at(2, 0.1), 0.4);
      IN("#un-b2", at(2, 0.4), 0.3);
      ARROW("#un-a2", at(2, 0.45), 0.8);
      IN("#un-a2l", at(2, 0.55), 0.4);
      IN("#un-cb", at(2, 0.78), 0.5);
      // L3 回调里任意操作，只改 delta
      IN("#un-b3", at(3, 0.02), 0.3);
      IN("#un-tb", at(3, 0.1), 0.5);
      IN("#un-v0, #un-v1", at(3, 0.12), 0.4);
      ARROW("#un-s1", at(3, 0.18), 0.6); IN("#un-s1l", at(3, 0.18), 0.3);
      COUNT("#un-v0", 0, -1, at(3, 0.18) + 0.6, 0.4); COL("#un-v0", { fill: "#FC6255" }, at(3, 0.18) + 0.6);
