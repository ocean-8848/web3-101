      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const PULSE = (s, t, o, k = 1.08) => tl.fromTo(s, { scale: 1, svgOrigin: o }, { scale: k, svgOrigin: o, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t);
      const SEG = (i, t) => {
        tl.to(`#hs-ax${i}`, { stroke: "#FF9F43", duration: 0.4 }, t);
        tl.to(`#hs-lb${i}`, { fill: "#e8e6df", duration: 0.4 }, t);
        tl.to("#hs-con", { attr: { x1: 352 + 304 * i, x2: 352 + 304 * i }, duration: 0.5, ease: "power2.inOut" }, t);
        PULSE(`#hs-k${2 * i}`, t + 0.2, `${254 + 304 * i} 615`, 1.3);
        PULSE(`#hs-k${2 * i + 1}`, t + 0.35, `${450 + 304 * i} 615`, 1.3);
      };
      const UNSEG = (i, t) => {
        tl.to(`#hs-ax${i}`, { stroke: "#8a8f99", strokeWidth: 5, duration: 0.3 }, t);
        tl.to(`#hs-lb${i}`, { fill: "#8a8f99", duration: 0.3 }, t);
        OUT(`#hs-c${i}`, t, 0.3);
      };
      // L0
      IN("#hs-term", at(0, 0.1), 0.5);
      IN("#hs-life", at(0, 0.3), 0.5);
      for (let i = 0; i < 5; i++) { DRAW(`#hs-ax${i}`, at(0, 0.33) + 0.25 * i, 0.4); IN(`#hs-lb${i}`, at(0, 0.36) + 0.25 * i, 0.4); }
      IN("#hs-dot", at(0, 0.62), 0.2);
      tl.fromTo("#hs-dot", { attr: { cx: 200 } }, { attr: { cx: 1720 }, duration: 2.6, ease: "none", immediateRender: false }, at(0, 0.62));
      OUT("#hs-dot", at(0, 0.62) + 2.6, 0.3);
      // L1
      OUT("#hs-term", at(1, 0.0), 0.4);
      for (let k = 0; k < 10; k++) IN(`#hs-k${k}`, at(1, 0.04) + 0.16 * k, 0.3);
      IN("#hs-n, #hs-nl", at(1, 0.06), 0.3);
      COUNT("#hs-n", 0, 10, at(1, 0.06), 1.6);
      IN("#hs-card", at(1, 0.44), 0.5); IN("#hs-con", at(1, 0.48), 0.4);
      SEG(0, at(1, 0.44));
      IN("#hs-c0m", at(1, 0.5), 0.5);
      IN("#hs-c0i0", at(1, 0.66), 0.5);
      IN("#hs-c0i1", at(1, 0.84), 0.5);
      // L2
      UNSEG(0, at(2, 0)); SEG(1, at(2, 0.04));
      IN("#hs-c1m", at(2, 0.08), 0.5);
      IN("#hs-c1i0", at(2, 0.4), 0.4); IN("#hs-c1i1", at(2, 0.6), 0.4); IN("#hs-c1i2", at(2, 0.82), 0.4);
      // L3
      UNSEG(1, at(3, 0)); SEG(2, at(3, 0.04));
      IN("#hs-c2m", at(3, 0.08), 0.5);
      IN("#hs-c2i0", at(3, 0.42), 0.4); IN("#hs-c2i1", at(3, 0.75), 0.4);
      // L4
      UNSEG(2, at(4, 0)); SEG(3, at(4, 0.03));
      tl.to("#hs-ax3", { strokeWidth: 10, duration: 0.4 }, at(4, 0.05));
      IN("#hs-c3m", at(4, 0.06), 0.5);
      IN("#hs-c3i0", at(4, 0.12), 0.5, { scale: 0.8, svgOrigin: "960 455" }, { scale: 1, svgOrigin: "960 455" });
      [0.22, 0.38, 0.52, 0.86].forEach((f, i) => IN(`#hs-ch${i}`, at(4, f), 0.5, { y: 20 }, { y: 0 }));
      // L5
      OUT("#hs-ch0, #hs-ch1, #hs-ch2, #hs-ch3", at(5, 0), 0.35);
      UNSEG(3, at(5, 0.02)); SEG(4, at(5, 0.06));
      IN("#hs-c4m", at(5, 0.1), 0.5);
      IN("#hs-c4i0", at(5, 0.4), 0.5);
      PULSE("#hs-c4i0", at(5, 0.78), "960 455", 1.06);
      // L6
      IN("#hs-note", at(6, 0.0), 0.4);
      OUT("#hs-tl", at(6, 0.2), 0.5);
      IN("#hs-L0", at(6, 0.27), 0.5, { y: -20 }, { y: 0 });
      ARROW("#hs-a0", at(6, 0.4), 0.4); IN("#hs-at0", at(6, 0.42), 0.4);
      IN("#hs-L1", at(6, 0.45), 0.5, { y: -20 }, { y: 0 });
      ARROW("#hs-a1", at(6, 0.6), 0.4); IN("#hs-at1", at(6, 0.62), 0.4);
      IN("#hs-L2", at(6, 0.65), 0.5, { y: -20 }, { y: 0 });
      ARROW("#hs-a2", at(6, 0.8), 0.4); IN("#hs-at2", at(6, 0.82), 0.4);
      IN("#hs-L3", at(6, 0.85), 0.5, { y: -20 }, { y: 0 });
      IN("#hs-pk", at(6, 0.93), 0.2);
      tl.fromTo("#hs-pk", { attr: { cy: 280 } }, { attr: { cy: 940 }, duration: 1.4, ease: "power1.inOut", immediateRender: false }, at(6, 0.93));


      tl.to("#hs-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
