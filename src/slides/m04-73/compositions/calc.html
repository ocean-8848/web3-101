  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const PULSE = (s, t, o = 0.4) => tl.to(s, { opacity: o, duration: 0.22, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const TXT = (sel, a, b, t) => { const el = document.querySelector(sel), o = { v: 0 }; tl.fromTo(o, { v: 0 }, { v: 1, duration: 0.02, immediateRender: false, onUpdate: () => { el.textContent = o.v >= 0.5 ? b : a; } }, t); };
      const COL = (s, props, t, d = 0.3) => tl.to(s, { ...props, duration: d }, t);
      const MV = (s, props, t, d = 0.8, ease = "power2.inOut") => tl.to(s, { ...props, duration: d, ease }, t);

      const fmtK = v => Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      // L0 标题
      IN("#ca-title", at(0, 0.05), 0.6, { y: 14 }, { y: 0 });
      IN("#ca-v3", at(0, 0.4), 0.4);
      IN("#ca-ul", at(0, 0.45), 0.4); IN("#ca-up1", at(0, 0.55), 0.4); IN("#ca-up2", at(0, 0.62), 0.4); IN("#ca-up3", at(0, 0.69), 0.4); IN("#ca-ur", at(0, 0.76), 0.4);
      // L1 V3 四次转账
      [0.06, 0.26, 0.46, 0.66].forEach((f, i) => { const s = `#ca-u${i + 1}`; ARROW(s, at(1, f), 0.6); IN(`${s}b, ${s}t`, at(1, f) + 0.3, 0.3); });
      IN("#ca-f3", at(1, 0.84), 0.5, { x: 16 }, { x: 0 });
      IN("#ca-rnote", at(1, 0.93), 0.5);
      // L2 V4 两次转账
      IN("#ca-v4", at(2, 0.0), 0.4);
      IN("#ca-dl", at(2, 0.02), 0.4); IN("#ca-dp1", at(2, 0.05), 0.4); IN("#ca-dp2", at(2, 0.08), 0.4); IN("#ca-dp3", at(2, 0.11), 0.4); IN("#ca-dr", at(2, 0.14), 0.4);
      DRAW("#ca-fr", at(2, 0.06), 0.8); IN("#ca-frl", at(2, 0.14), 0.4);
      ["B", "C"].forEach((k, i) => {
        const t0 = at(2, 0.24 + i * 0.14);
        IN(`#ca-p${k}, #ca-n${k}`, t0, 0.3);
        tl.to(`#ca-p${k}`, { x: 30, duration: 0.5, ease: "power2.in" }, t0 + 0.5);
        tl.to(`#ca-n${k}`, { x: -30, duration: 0.5, ease: "power2.in" }, t0 + 0.5);
        OUT(`#ca-p${k}, #ca-n${k}`, t0 + 0.95, 0.15);
        IN(`#ca-z${k}`, t0 + 1.05, 0.3, { scale: 1.5, svgOrigin: `${k == "B" ? 615 : 905} 640` }, { scale: 1, svgOrigin: `${k == "B" ? 615 : 905} 640` });
      });
      ARROW("#ca-d1", at(2, 0.6), 0.5); IN("#ca-d1b, #ca-d1t", at(2, 0.6) + 0.3, 0.3);
      ARROW("#ca-d2", at(2, 0.74), 0.5); IN("#ca-d2b, #ca-d2t", at(2, 0.74) + 0.3, 0.3);
      IN("#ca-f4", at(2, 0.86), 0.5, { x: 16 }, { x: 0 });
      // L3 瞬时存储 100 Gas
      IN("#ca-eip", at(3, 0.1), 0.4);
      IN("#ca-g1l", at(3, 0.4), 0.4);
      IN("#ca-g1", at(3, 0.6), 0.3, { scaleX: 0, svgOrigin: "600 852" }, { scaleX: 1, svgOrigin: "600 852" });
      IN("#ca-g1v", at(3, 0.66), 0.4);
      PULSE("#ca-g1v", at(3, 0.9));
      // L4 普通存储 20,000+ Gas
      IN("#ca-g2l", at(4, 0.04), 0.4);
      IN("#ca-g2, #ca-g2v", at(4, 0.14), 0.2);
      tl.fromTo("#ca-g2", { attr: { width: 0 } }, { attr: { width: 1000 }, duration: 1.6, ease: "power2.out", immediateRender: false }, at(4, 0.14));
      COUNT("#ca-g2n", 0, 20000, at(4, 0.14), 1.6, fmtK);
      IN("#ca-sch", at(4, 0.36), 0.4);
      IN("#ca-g1n", at(4, 0.6), 0.5, { x: 12 }, { x: 0 });
      tl.to("#ca-g2", { opacity: 0.5, duration: 1.0, yoyo: true, repeat: 1, ease: "sine.inOut" }, at(4, 0.68));
      // L5 曲线：跳数越多省越多
      OUT("#ca-rows, #ca-gas", at(5, 0), 0.4);
      DRAW("#ca-axes", at(5, 0.04), 0.7); IN("#ca-tk", at(5, 0.08), 0.5);
