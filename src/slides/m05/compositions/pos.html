      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 时间轴
      IN("#po-lab", at(0, 0.05), 0.5, { x: -20 }, { x: 0 });
      DRAW("#po-ax", at(0, 0.15), 1.4);
      // L1 slot 与 epoch
      tl.fromTo(".po-cell", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.04 }, at(1, 0.02));
      tl.fromTo(".po-dot", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.04 }, at(1, 0.04));
      IN("#po-12", at(1, 0.14), 0.4);
      DRAW("#po-br", at(1, 0.34), 0.8);
      IN("#po-ep", at(1, 0.42), 0.5);
      IN("#po-calc", at(1, 0.5), 0.4);
      tl.to("#po-c0", { fill: "#e8e6df", duration: 0.3 }, at(1, 0.52));
      tl.to("#po-c1", { fill: "#e8e6df", duration: 0.3 }, at(1, 0.6));
      tl.to("#po-c2", { fill: "#F0B90B", duration: 0.3 }, at(1, 0.72));
      tl.to("#po-c3", { fill: "#58C4DD", duration: 0.3 }, at(1, 0.86));
      tl.to("#po-c4", { fill: "#58C4DD", duration: 0.3 }, at(1, 0.86));
      // L2 最终性：3 个 epoch + 投票条
      OUT("#po-s1", at(2, 0), 0.4);
      IN("#po-t0", at(2, 0.03), 0.5);
      IN("#po-ep3", at(2, 0.06), 0.6, { scale: 1.08, svgOrigin: "920 300" }, { scale: 1, svgOrigin: "920 300" });
      IN("#po-vote", at(2, 0.18), 0.5);
      const v1 = at(2, 0.3);
      tl.to("#po-vf", { attr: { width: 860 }, duration: 1.4, ease: "power1.inOut" }, v1);
      tl.to("#po-vf", { fill: "#83C167", duration: 0.2 }, v1 + 1.15);
      tl.to("#po-f0", { stroke: "#83C167", duration: 0.3 }, v1 + 1.3);
      IN("#po-s0a", v1 + 1.3, 0.4);
      const v2 = at(2, 0.58);
      tl.to("#po-vf", { attr: { width: 0 }, fill: "#58C4DD", duration: 0.3 }, v2);
      tl.to("#po-vf", { attr: { width: 870 }, duration: 1.2, ease: "power1.inOut" }, v2 + 0.35);
      tl.to("#po-vf", { fill: "#83C167", duration: 0.2 }, v2 + 1.3);
      tl.to("#po-f1", { stroke: "#83C167", duration: 0.3 }, v2 + 1.4);
      IN("#po-s1a", v2 + 1.4, 0.4);
      OUT("#po-s0a", at(2, 0.86), 0.3);
      tl.to("#po-f0", { fill: "#83C167", duration: 0.4 }, at(2, 0.88));
      IN("#po-s0b", at(2, 0.9), 0.4);
      // L3 罚没
      OUT("#po-t0", at(3, 0), 0.3);
      OUT("#po-vote", at(3, 0), 0.4);
      IN("#po-atk", at(3, 0.06), 0.5, { x: -30 }, { x: 0 });
      ARROW("#po-aa", at(3, 0.16), 0.5);
      tl.fromTo("#po-f0", { rotation: 0, svgOrigin: "640 300" }, { rotation: -6, svgOrigin: "640 300", duration: 0.15, yoyo: true, repeat: 3, immediateRender: false }, at(3, 0.28));
      IN("#po-pie", at(3, 0.34), 0.5, { scale: 0.8, svgOrigin: "960 680" }, { scale: 1, svgOrigin: "960 680" });
      ARROW("#po-ab", at(3, 0.42), 0.5);
      IN("#po-t1", at(3, 0.5), 0.5);
      tl.to("#po-sl", { fill: "#FC6255", duration: 0.3 }, at(3, 0.55));
      tl.to("#po-sl", { opacity: 0.4, duration: 0.15, yoyo: true, repeat: 3 }, at(3, 0.62));
      IN("#po-usd", at(3, 0.8), 0.5, { x: -20 }, { x: 0 });
      // L4 不活跃泄漏演示
      OUT("#po-s2", at(4, 0), 0.4);
      OUT("#po-t1", at(4, 0), 0.3);
      IN("#po-on", at(4, 0.04), 0.5);
      IN("#po-off", at(4, 0.1), 0.5);
      const pctEl = { v: 55 };
      for (let i = 0; i < 8; i++) {
        const t = at(4, 0.22 + i * 0.075);
        IN("#po-nb" + i, t, 0.35, { x: -20 }, { x: 0 });
        if (i >= 2) {
          const r = (i - 1) / 6; // 0..1
          const h = 260 - 125 * r;
          tl.to("#po-offr", { attr: { height: h, y: 760 - h }, duration: 0.35, ease: "power2.out" }, t + 0.1);
          const p = 55 + 12 * r;
          tl.to("#po-onf", { attr: { width: p * 10 }, duration: 0.35, ease: "power2.out" }, t + 0.1);
        }
      }
      COUNT("#po-pct", 55, 67, at(4, 0.22 + 2 * 0.075) + 0.1, at(4, 0.22 + 7 * 0.075) - at(4, 0.22 + 2 * 0.075) + 0.35);
      tl.to("#po-onf", { fill: "#83C167", duration: 0.3 }, at(4, 0.78));
      tl.to("#po-nf7", { fill: "#83C167", stroke: "#83C167", duration: 0.4 }, at(4, 0.8));
      tl.to("#po-nf6", { fill: "#83C167", stroke: "#83C167", duration: 0.4 }, at(4, 0.8));
      IN("#po-t2", at(4, 0.82), 0.5);
      // L5 两条阈值
      OUT("#po-s3", at(5, 0), 0.4);
      IN("#po-pie2", at(5, 0.02), 0.6, { scale: 0.8, svgOrigin: "700 600" }, { scale: 1, svgOrigin: "700 600" });
      IN("#po-r1", at(5, 0.12), 0.4, { x: 20 }, { x: 0 });
      tl.to("#po-r1", { opacity: 0.4, duration: 0.15, yoyo: true, repeat: 3 }, at(5, 0.32));
      IN("#po-r2", at(5, 0.55), 0.4, { x: 20 }, { x: 0 });
      tl.to("#po-r2", { opacity: 0.4, duration: 0.15, yoyo: true, repeat: 3 }, at(5, 0.72));
      // L6 质押集中
      OUT("#po-t2", at(6, 0), 0.4);
      IN("#po-few", at(6, 0.06), 0.4);
      tl.to("#po-pie2", { scale: 1.06, svgOrigin: "700 600", duration: 0.3, yoyo: true, repeat: 1 }, at(6, 0.12));
      IN("#po-inc", at(6, 0.5), 0.4);


      tl.to("#po-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#po-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["pos"] = tl;
    })();
  </script>
</template>
