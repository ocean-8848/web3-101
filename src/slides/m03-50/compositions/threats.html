<template>
  <style>
    #root { position: absolute; inset: 0; background: #0f1117; overflow: hidden; }
    #root svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root text { font-family: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    #root .mono, #root .mono text { font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
    #root .h { opacity: 0; }
    #root .dr { stroke-dasharray: 1; stroke-dashoffset: 1; }
  </style>
  <!-- 场景 threats，id 前缀 th- -->
  <div id="root" data-composition-id="threats" data-duration="88.71" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="th-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8e6df" /></marker>
        <marker id="th-mgr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#83C167" /></marker>
      </defs>
      <g id="th-all">
        <g id="th-hub" class="h"><circle cx="960" cy="600" r="130" fill="#58C4DD" fill-opacity="0.1" stroke="#58C4DD" stroke-width="3"/>
          <circle id="th-ring" cx="960" cy="600" r="160" fill="none" stroke="#FC6255" stroke-width="2" stroke-dasharray="8 10"/>
          <text x="960" y="614" font-size="40" font-weight="700" fill="#e8e6df" text-anchor="middle">托管系统</text></g>
        <text id="th-ten" class="h" x="960" y="1000" font-size="30" fill="#8a8f99" text-anchor="middle">威胁模型 · <tspan class="mono">10</tspan> 条</text>
        <!-- 五个来源标签（基准位置 = 左侧导航） -->
        <g id="th-nav">
          <text id="th-n0" class="h" x="110" y="330" font-size="38" font-weight="700" fill="#FC6255">外部</text>
          <text id="th-n1" class="h" x="110" y="450" font-size="38" font-weight="700" fill="#FC6255">内部</text>
          <text id="th-n2" class="h" x="110" y="570" font-size="38" font-weight="700" fill="#FC6255">签名域</text>
          <text id="th-n3" class="h" x="110" y="690" font-size="38" font-weight="700" fill="#FC6255">链上数据</text>
          <text id="th-n4" class="h" x="110" y="810" font-size="38" font-weight="700" fill="#FC6255">操作失误</text>
          <rect id="th-bar" class="h" x="84" y="294" width="8" height="48" rx="4" fill="#FC6255"/>
        </g>

        <!-- 每组两条：红卡 + 绿色防线列表 -->
        <g id="th-gp"></g>

        <!-- 签名域组的钥匙碎片 -->
        <g id="th-shard" class="h">
          <path id="th-sh1" d="M880 380 L930 380 L918 410 L930 440 L880 440 z" fill="#FC6255"/>
          <path d="M940 380 L990 380 L990 440 L940 440 L952 410 z" fill="none" stroke="#8a8f99" stroke-width="2.5" stroke-dasharray="6 5"/>
          <rect x="1010" y="394" width="44" height="40" rx="6" fill="#83C167"/><path d="M1020 394 L1020 382 A12 12 0 0 1 1044 382 L1044 394" stroke="#83C167" stroke-width="5" fill="none"/></g>
        <!-- 投毒地址 -->
        <g id="th-addr" class="h mono">
          <text x="560" y="412" font-size="32" fill="#e8e6df">0x7e5f…<tspan id="th-ad1" font-weight="700">a1</tspan></text>
          <text x="820" y="412" font-size="32" fill="#e8e6df">0x7e5f…<tspan id="th-ad2" font-weight="700">b1</tspan></text>
        </g>

        <!-- L6 -->
        <g id="th-final" class="h"><rect x="360" y="380" width="1200" height="320" rx="24" fill="#FF9F43" fill-opacity="0.1" stroke="#FF9F43" stroke-width="4"/>
          <text x="960" y="460" font-size="34" fill="#8a8f99" text-anchor="middle">十条里最重要的一条</text></g>
        <text id="th-f1" class="h" x="960" y="560" font-size="60" font-weight="700" fill="#FF9F43" text-anchor="middle">签名域必须假设</text>
        <text id="th-f2" class="h" x="960" y="650" font-size="60" font-weight="700" fill="#FF9F43" text-anchor="middle">核心域已经被攻破</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const PULSE = (s, t, origin, sc = 1.06) => tl.to(s, { scale: sc, svgOrigin: origin, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, attrs, parent, html) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html) e.innerHTML = html; parent.appendChild(e); return e; };

      // 数据：每组两条威胁；title 行（可含第二行）、防线列表（最后一项可为小字灰）
      const G = [
        [{ t: ["<tspan class='mono'>API</tspan> 凭证被盗", "→ 伪造提币"], d: ["<tspan class='mono'>mTLS</tspan> + 请求签名", "业务方级限额", "新地址冷却期", "<tspan class='mono'>KYT</tspan> 链上监控"] },
         { t: ["<tspan class='mono'>DoS</tspan>：大量小额提币"], d: ["最小提币额", "按业务方限流", "~手续费覆盖成本"] }],
        [{ t: ["核心域被入侵", "→ 伪造“已批准”"], d: ["签名域独立核对审批签名", "签名域独立限额"] },
         { t: ["运营私改白名单 / 限额"], d: ["两人审批", "哈希链审计日志", "职责分离"] }],
        [{ t: ["攻破 <tspan class='mono'>MPC</tspan> 节点 A", "→ 只拿到 1 个分片"], d: ["分片在不同信任域", "定期刷新密钥", "<tspan class='mono'>TEE</tspan> + 远程证明"] },
         { t: ["供应链攻击"], d: ["依赖锁定", "镜像签名验证", "签名域最小依赖"] }],
        [{ t: ["恶意节点伪造充值"], d: ["多节点交叉验证", "按区块哈希读取", "~大额充值二次确认"] },
         { t: ["低确认数充值后重组"], d: ["按资产设置确认数", "重组监控", "已入账回滚 → <tspan class='mono'>P0</tspan>"] }],
        [{ t: ["投毒地址"], d: ["只从白名单选", "地址全文比对", "相似度规则"] },
         { t: ["重试另签一笔 → 多付"], d: ["幂等键", "先落库后广播", "同 <tspan class='mono'>nonce</tspan> 签名记录"] }]
      ];
      const gp = document.getElementById("th-gp");
      G.forEach((grp, gi) => grp.forEach((th, k) => {
        const y0 = k === 0 ? 270 : 570, id = `th-${gi}${k}`;
        const card = mk("g", { id: id + "c", class: "h" }, gp);
        mk("rect", { x: 520, y: y0, width: 560, height: 230, rx: 14, fill: "#FC6255", "fill-opacity": 0.08, stroke: "#FC6255", "stroke-width": 2.5 }, card);
        mk("text", { x: 550, y: y0 + 64, "font-size": 34, "font-weight": 700, fill: "#FC6255" }, card, th.t[0]);
        if (th.t[1]) mk("text", { x: 550, y: y0 + 120, "font-size": 30, fill: "#e8e6df" }, card, th.t[1]);
        mk("path", { id: id + "a", class: "dr h", pathLength: 1, d: `M1090 ${y0 + 115} L1150 ${y0 + 115}`, stroke: "#83C167", "stroke-width": 3, fill: "none", "marker-end": "url(#th-mgr)" }, gp);
        mk("rect", { id: id + "s", class: "h", x: 1170, y: y0, width: 6, height: 230, rx: 3, fill: "#83C167" }, gp);
        th.d.forEach((txt, j) => {
          const small = txt[0] === "~";
          mk("text", { id: `${id}d${j}`, class: "h", x: 1200, y: y0 + 46 + 52 * j, "font-size": small ? 28 : 32, fill: small ? "#8a8f99" : "#83C167" }, gp, small ? txt.slice(1) : txt);
        });
      }));

      // 径向位置（L0）与导航位置的差
      const rad = [[900, 360], [1240, 470], [1210, 860], [560, 860], [520, 470]];
      const navY = [330, 450, 570, 690, 810];

      // L0 中心 + 五个方向
      IN("#th-hub", at(0, 0.04), 0.6);
      tl.to("#th-ring", { rotation: 90, svgOrigin: "960 600", duration: 5, ease: "none" }, at(0, 0.05));
      IN("#th-ten", at(0, 0.15), 0.4);
      for (let i = 0; i < 5; i++) tl.fromTo("#th-n" + i, { opacity: 0, x: rad[i][0] - 110, y: rad[i][1] - navY[i] }, { opacity: 1, duration: 0.4 }, at(0, 0.4 + 0.1 * i));

      const SHOW = (gi, li) => {
        const T = i => at(li, i);
        // 导航移动 + 高亮
        for (let i = 0; i < 5; i++) tl.to("#th-n" + i, { attr: { fill: i === gi ? "#FC6255" : "#6b6f7a" }, duration: 0.3 }, T(0.01));
        tl.to("#th-bar", { y: navY[gi] - 330, opacity: 1, duration: 0.4 }, T(0.01));
        [0, 1].forEach(k => {
          const SP = [0.66, 0.52, 0.66, 0.66, 0.52], r = SP[gi];
          const id = `#th-${gi}${k}`, n = G[gi][k].d.length, base = k === 0 ? 0.04 : r, span = k === 0 ? r - 0.1 : 0.84 - r;
          IN(id + "c", T(base), 0.45, { x: -20 }, { x: 0 });
          ARROW(id + "a", T(base + 0.08), 0.35);
          IN(id + "s", T(base + 0.08), 0.3);
          const OV = { "1-0": [0.29, 0.44] }[gi + "-" + k];
          for (let j = 0; j < n; j++) IN(`${id}d${j}`, T(OV ? OV[j] : base + 0.12 + (span - 0.14) * j / Math.max(1, n - 1) ), 0.35, { x: 14 }, { x: 0 });
        });
      };
      const HIDE = (gi, t) => {
        const ids = [];
        [0, 1].forEach(k => { const id = `#th-${gi}${k}`; ids.push(id + "c", id + "a", id + "s"); G[gi][k].d.forEach((_, j) => ids.push(`${id}d${j}`)); });
        OUT(ids, t, 0.35);
      };

      // L1 外部
      OUT(["#th-hub", "#th-ten"], at(1, 0.0), 0.35);
      for (let i = 0; i < 5; i++) tl.to("#th-n" + i, { x: 0, y: 0, duration: 0.6, ease: "power2.inOut" }, at(1, 0.0));
      SHOW(0, 1);
      // L2 内部
      HIDE(0, at(2, 0.0)); SHOW(1, 2);
      // L3 签名域
      HIDE(1, at(3, 0.0)); SHOW(2, 3);
      IN("#th-shard", at(3, 0.14), 0.4);
      tl.to("#th-sh1", { x: 14, y: -10, duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.2));
      PULSE("#th-shard", at(3, 0.3), "967 410", 1.1);
      OUT("#th-shard", at(4, 0.0), 0.3);
      // L4 链上数据
      HIDE(2, at(4, 0.0)); SHOW(3, 4);
      // L5 操作失误
      HIDE(3, at(5, 0.0)); SHOW(4, 5);
      IN("#th-addr", at(5, 0.08), 0.4);
      tl.to(["#th-ad1", "#th-ad2"], { attr: { fill: "#FC6255" }, duration: 0.3 }, at(5, 0.18));
      PULSE("#th-addr", at(5, 0.24), "790 400", 1.06);

      // L6 收起 → 最重要的一条
      HIDE(4, at(6, 0.0));
      OUT(["#th-addr", "#th-nav"], at(6, 0.0), 0.35);
      IN("#th-final", at(6, 0.1), 0.6);
      IN("#th-f1", at(6, 0.46), 0.5, { y: 14 }, { y: 0 });
      IN("#th-f2", at(6, 0.68), 0.5, { y: 14 }, { y: 0 });
      PULSE(["#th-final", "#th-f1", "#th-f2"], at(6, 0.88), "960 540", 1.04);

      tl.to("#th-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["threats"] = tl;
    })();
  </script>
</template>
