      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);

        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0

      IN("#fi-doc", at(0, 0.62), 0.5, { x: 30 }, { x: 0 });

      tl.to("#fi-docS", { scale: 1.5, svgOrigin: "1485 370", duration: 0.8, ease: "power2.inOut" }, at(1, 0.04));
      tl.to("#fi-docT", { x: 0, y: 0, duration: 0.8, ease: "power2.inOut" }, at(1, 0.94));
      tl.to("#fi-docS", { scale: 1, svgOrigin: "1485 370", duration: 0.8, ease: "power2.inOut" }, at(1, 0.94));
      [0, 1, 2].forEach(k => IN(`#fi-row${k}`, at(1, 0.24 + k * 0.08), 0.4, { x: 16 }, { x: 0 }));
      [0, 1, 2].forEach(k => tl.to(`#fi-row${k} rect`, { fillOpacity: 0.45, duration: 0.25, yoyo: true, repeat: 1 }, at(1, 0.6) + k * 0.3));
      IN("#fi-fmt", at(1, 0.82), 0.4);
      OUT("#fi-term", at(1, 0.02) + 7.6, 0.4);
      // L2 match in list
      ARROW("#fi-aA", at(2, 0.0), 0.3);
      IN("#fi-D1", at(2, 0.03), 0.5);
      DRAW("#fi-match", at(2, 0.14), 0.6); IN("#fi-match", at(2, 0.14), 0.01);
      tl.to("#fi-doc path", { strokeWidth: 6, duration: 0.25, yoyo: true, repeat: 1 }, at(2, 0.2));
      ARROW("#fi-aY1", at(2, 0.28), 0.4); IN("#fi-y1", at(2, 0.28), 0.3);
      IN("#fi-ok", at(2, 0.32), 0.4);
      ARROW("#fi-aN1", at(2, 0.42), 0.3); IN("#fi-n1", at(2, 0.42), 0.3);
      IN("#fi-warn", at(2, 0.45), 0.4, { y: -12 }, { y: 0 });
      ARROW("#fi-aW", at(2, 0.6), 0.3);
      IN("#fi-read", at(2, 0.63), 0.4, { y: -12 }, { y: 0 });

      // L3 simulate sell
      ARROW("#fi-aR", at(3, 0.0), 0.3);
      IN("#fi-sim", at(3, 0.04), 0.5);
      IN("#fi-sc", at(3, 0.25), 0.3);
      tl.to("#fi-sc", { attr: { cx: 1150 }, duration: 0.8, ease: "power2.inOut" }, at(3, 0.3));
      tl.to("#fi-sc", { attr: { cx: 1010 }, duration: 0.8, ease: "power2.inOut" }, at(3, 0.56));
      tl.to("#fi-sc", { fill: "#83C167", duration: 0.3 }, at(3, 0.56) + 0.8);
      tl.to("#fi-sim rect", { strokeWidth: 6, duration: 0.25, yoyo: true, repeat: 1 }, at(3, 0.85));
      // L4 decision
      ARROW("#fi-aS", at(4, 0.0), 0.3);
      IN("#fi-D2", at(4, 0.03), 0.5);
      ARROW("#fi-aY2", at(4, 0.24), 0.4); IN("#fi-y2", at(4, 0.24), 0.3);
      IN("#fi-allow", at(4, 0.28), 0.4);
      ARROW("#fi-aN2", at(4, 0.6), 0.3); IN("#fi-n2", at(4, 0.6), 0.3);
      IN("#fi-hp", at(4, 0.63), 0.4, { y: -10 }, { y: 0 });
      // L5 expiry
      IN("#fi-stamp", at(5, 0.04), 0.5, { scale: 1.4, svgOrigin: "250 650" }, { scale: 1, svgOrigin: "250 650" });
      IN("#fi-cond", at(5, 0.12), 0.5);
      tl.to("#fi-stamp", { opacity: 0.3, duration: 3.0, ease: "none" }, at(5, 0.18));
      tl.to("#fi-allow rect", { stroke: "#FC6255", duration: 0.3, yoyo: true, repeat: 3 }, at(5, 0.47));
      IN("#fi-hg", at(5, 0.6), 0.5);
      tl.fromTo("#fi-sand", { attr: { d: "M446 718 L494 718 L470 680 Z" } }, { attr: { d: "M462 718 L478 718 L470 706 Z" }, duration: 2.5, ease: "none", immediateRender: false }, at(5, 0.64));
      ARROW("#fi-loop", at(5, 0.82), 0.8);
      tl.to("#fi-stamp", { opacity: 1, duration: 0.5 }, at(5, 0.86));
      IN("#fi-lt", at(5, 0.86), 0.4);
      // L6 routing engine
      OUT("#fi-flow, #fi-stamp, #fi-loop, #fi-lt, #fi-hg, #fi-cond", at(6, 0.0), 0.5);
      [0, 1, 2].forEach(k => IN(`#fi-p${k}`, at(6, 0.08 + k * 0.05), 0.4, { scale: 0.8, svgOrigin: `${420 + k * 540} 480` }, { scale: 1, svgOrigin: `${420 + k * 540} 480` }));

      IN("#fi-fee", at(6, 0.3), 0.4);
      IN("#fi-f1, #fi-fcut", at(6, 0.32), 0.01);
      tl.fromTo("#fi-f1, #fi-fcut", { attr: { width: 0 } }, { attr: { width: 372 }, duration: 0.6, immediateRender: false }, at(6, 0.32));
      tl.to("#fi-fcut", { y: 40, opacity: 0, duration: 0.6, ease: "power2.in" }, at(6, 0.45));
      IN("#fi-real", at(6, 0.48), 0.4);
      IN("#fi-rb", at(6, 0.66), 0.4);
      IN("#fi-bar", at(6, 0.72), 0.3);

      tl.to("#fi-rb circle", { attr: { cx: 300 }, duration: 0.5, ease: "back.out(2)" }, at(6, 0.76) + 0.5);

      tl.to("#fi-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#fi-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
