        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const TO = (s, t, v, d = 0.5) => tl.to(s, { duration: d, ease: "power2.inOut", ...v }, t);
// L0 时间牌 + 根因（先居中，L1 上移）

IN("#ky-name", at(0, 0.3), 0.5);
PULSE("#ky-date", at(0, 0.5), 0.5);
IN("#ky-tag", at(0, 0.66), 0.5, { y: 215 }, { y: 200 });

// L1 tick 尺：真实价格越过，合约认为没越过

TO("#ky-card", at(1, 0.02), { y: 0 }, 0.6);
TO("#ky-cardi", at(1, 0.02), { scale: 1, svgOrigin: "960 305" }, 0.6);
DRAW("#ky-ruler", at(1, 0.04), 0.8);

IN("#ky-bd", at(1, 0.18), 0.4);

IN("#ky-do", at(1, 0.3), 0.3);

TO("#ky-do", at(1, 0.36), { attr: { cx: 1072 } }, 1.2);
TO("#ky-dr", at(1, 0.5), { attr: { cx: 1132 } }, 0.6);

// L2 流动性被计两次 + 多链

IN("#ky-blk2", at(2, 0.16), 0.2);
TO("#ky-blk2", at(2, 0.16), { x: 220 }, 0.7);

IN("#ky-ch0", at(2, 0.58), 0.4, { y: 15 }, { y: 0 });
IN("#ky-ch1", at(2, 0.68), 0.4, { y: 15 }, { y: 0 });
IN("#ky-ch2", at(2, 0.78), 0.4, { y: 15 }, { y: 0 });
IN("#ky-ch3", at(2, 0.86), 0.4);
// L3 损失数字
OUT("#ky-mech", at(3, 0), 0.4);
IN("#ky-loss", at(3, 0.06), 0.5);
COUNT("#ky-n", 0, 4800, at(3, 0.06), 1.4, v => Math.round(v).toLocaleString("en-US"));

IN("#ky-rec", at(3, 0.56), 0.5, { y: 15 }, { y: 0 });

// L4 术语 + 启示
OUT("#ky-card", at(4, 0), 0.4);
OUT("#ky-num", at(4, 0), 0.4);
IN("#ky-term", at(4, 0.03), 0.5);
IN("#ky-u", at(4, 0.08), 0.4);
IN("#ky-p", at(4, 0.08), 0.4);
IN("#ky-rem", at(4, 0.12), 0.4);
ARROW("#ky-ar", at(4, 0.16), 0.5);

PULSE("#ky-p", at(4, 0.34), 0.4);

IN("#ky-c0", at(4, 0.36), 0.5, { x: -20 }, { x: 0 });

      tl.to("#ky-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
