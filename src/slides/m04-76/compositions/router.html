      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power3.in" }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const LY = i => 320 + i * 40.6 - 29;
      // L0 router + call data + pools
      IN("#ro-rt", at(0, 0.04), 0.5, { scale: 0.9, svgOrigin: "960 380" }, { scale: 1, svgOrigin: "960 380" });
      IN("#ro-pp", at(0, 0.5), 0.5, { x: -40 }, { x: 0 });
      ARROW("#ro-ain", at(0, 0.62), 0.3);
      [0, 1, 2].forEach(k => { IN(`#ro-pl${k}`, at(0, 0.25 + k * 0.06), 0.4); ARROW(`#ro-po${k}`, at(0, 0.82) + k * 0.15, 0.4); });
      // L1 malicious call data
      OUT("#ro-pp0", at(1, 0.02), 0.3);
      tl.to("#ro-ppr", { stroke: "#FC6255", duration: 0.3 }, at(1, 0.04));
      IN("#ro-pp1", at(1, 0.06), 0.4);
      IN("#ro-pp2", at(1, 0.16), 0.4);
      OUT("#ro-pools", at(1, 0.24), 0.4);
      IN("#ro-tok", at(1, 0.3), 0.4);
      ARROW("#ro-at", at(1, 0.32), 0.4);
      [0, 1, 2].forEach(k => { IN(`#ro-w${k}, #ro-c${k}`, at(1, 0.42 + k * 0.04), 0.4); });
      IN("#ro-atk", at(1, 0.5), 0.4);
      [0, 1, 2].forEach(k => {
        ARROW(`#ro-wa${k}`, at(1, 0.58) + k * 0.15, 0.4);
        tl.to(`#ro-c${k}`, { attr: { cx: 960, cy: 400 }, fill: "#FC6255", duration: 0.7, ease: "power2.in" }, at(1, 0.6) + k * 0.25);
        tl.to(`#ro-c${k}`, { attr: { cx: 1398 + k * 25, cy: 530 }, duration: 0.6, ease: "power2.out" }, at(1, 0.6) + k * 0.25 + 0.7);
      });
      tl.to("#ro-rtr", { stroke: "#FC6255", duration: 0.3, yoyo: true, repeat: 3 }, at(1, 0.88));
      // L2 rule one
      OUT("#ro-pp", at(2, 0.02), 0.3);
      [0, 1, 2].forEach(k => IN(`#ro-x${k}`, at(2, 0.3) + k * 0.15, 0.25, { scale: 1.6, svgOrigin: `${[772.5, 960, 1147.5][k]} 491` }, { scale: 1, svgOrigin: `${[772.5, 960, 1147.5][k]} 491` }));
      IN("#ro-rule1", at(2, 0.12), 0.5, { y: 20 }, { y: 0 });
      IN("#ro-ms", at(2, 0.5), 0.4, { x: -20 }, { x: 0 });
      ARROW("#ro-msa", at(2, 0.55), 0.4);
      IN("#ro-rule1b", at(2, 0.72), 0.4, { y: 12 }, { y: 0 });
      tl.to("#ro-rule1 rect", { strokeWidth: 6, duration: 0.25, yoyo: true, repeat: 1 }, at(2, 0.85));
      // L3 rule two
      IN("#ro-gate", at(3, 0.05), 0.4, { y: -20 }, { y: 0 });
      IN("#ro-gx", at(3, 0.14), 0.25);
      tl.to("#ro-at", { opacity: 0.25, duration: 0.3 }, at(3, 0.2));
      OUT("#ro-tok, #ro-atk, #ro-c0, #ro-c1, #ro-c2, #ro-at, #ro-gx", at(3, 0.34), 0.4);
      tl.to("#ro-pools", { opacity: 1, duration: 0.5 }, at(3, 0.42));
      [0, 1, 2].forEach(k => tl.to(`#ro-po${k}`, { stroke: "#83C167", duration: 0.3 }, at(3, 0.5) + k * 0.15));
      IN("#ro-rule2", at(3, 0.3), 0.5, { y: 20 }, { y: 0 });
      IN("#ro-rule2b", at(3, 0.72), 0.4, { y: 12 }, { y: 0 });
      // L4 code
      OUT("#ro-scene", at(4, 0.0), 0.4);
      IN("#ro-code", at(4, 0.05), 0.6);
      tl.set("#ro-hl", { attr: { y: LY(2), height: 40 } }, at(4, 0.05));
      const STEP = (k, line, n, f) => {
        tl.to("#ro-hl", { attr: { y: LY(line), height: 40.6 * n }, duration: 0.4, ease: "power2.inOut" }, at(4, f));
        IN(`#ro-n${k}`, at(4, f) + 0.25, 0.35);
      };
      tl.fromTo("#ro-hl", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, at(4, 0.08));
      STEP(0, 2, 1, 0.08); STEP(1, 3, 3, 0.3); STEP(2, 6, 1, 0.55); STEP(3, 7, 1, 0.8);
      // L5 not production
      OUT("#ro-n0, #ro-n1, #ro-n2, #ro-n3", at(5, 0.12), 0.3);
      tl.to("#ro-hl", { opacity: 0, duration: 0.3 }, at(5, 0.12));
      [0.32, 0.48, 0.62].forEach((f, k) => IN(`#ro-td${k}`, at(5, f), 0.4, { y: 16 }, { y: 0 }));
      IN("#ro-adm", at(5, 0.78), 0.4);
      IN("#ro-adm2", at(5, 0.84), 0.4, { y: -10 }, { y: 0 });
      // L6 common pattern
      OUT("#ro-code, #ro-td0, #ro-td1, #ro-td2, #ro-adm, #ro-adm2", at(6, 0.0), 0.4);
      [0, 1, 2].forEach(k => IN(`#ro-h${k}`, at(6, 0.06 + k * 0.07), 0.4, { x: -20 }, { x: 0 }));
      [0.42, 0.66, 0.8].forEach((f, k) => tl.to(`#ro-hk${k}`, { fill: "#FC6255", duration: 0.3 }, at(6, f)));
      DRAW("#ro-br", at(6, 0.5), 0.5);
      IN("#ro-q", at(6, 0.56), 0.5, { y: 16 }, { y: 0 });

      tl.to("#ro-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["router"] = tl;
