  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const F = v => Math.round(v).toLocaleString("en-US");
      const ANG = p => -60 + (p - 3000) / 9000 * 125;
      const TANK = (k, h, t, d = 1.2) => tl.to(`#ca-f${k}`, { attr: { y: 880 - h, height: h }, duration: d, ease: "power2.inOut" }, t);
      const NEEDLE = (p, t, d = 1.0, ease = "power2.inOut") => tl.to("#ca-ndl", { rotation: ANG(p), svgOrigin: "500 330", duration: d, ease }, t);
      tl.set("#ca-ndl", { rotation: -90, svgOrigin: "500 330" }, 0);
      // L0 recall
      IN("#ca-prev", at(0, 0.04), 0.5, { y: 16 }, { y: 0 });
      IN("#ca-dex", at(0, 0.6), 0.4, { y: 16 }, { y: 0 });
      IN("#ca-int", at(0, 0.72), 0.4, { y: 16 }, { y: 0 });
      OUT("#ca-prev, #ca-dex, #ca-int", at(1, 0.0), 0.4);
      // L1 spot price
      DRAW("#ca-t0", at(1, 0.08), 0.7); DRAW("#ca-t1", at(1, 0.14), 0.7);
      IN("#ca-tn0, #ca-tn1", at(1, 0.2), 0.4);
      IN("#ca-term", at(1, 0.1), 0.5);
      IN("#ca-g", at(1, 0.3), 0.4);
      IN("#ca-gl", at(1, 0.34), 0.4);
      NEEDLE(3000, at(1, 0.36), 0.6);
      NEEDLE(9000, at(1, 0.66), 0.5); NEEDLE(3000, at(1, 0.66) + 0.6, 0.5);
      OUT("#ca-term", at(1, 0.1) + 7.2, 0.4);
      // L2 reserves and k
      IN("#ca-n0, #ca-u0, #ca-n1, #ca-u1", at(2, 0.06), 0.3);
      TANK(0, 200, at(2, 0.06)); TANK(1, 200, at(2, 0.14));
      COUNT("#ca-n0", 0, 100, at(2, 0.06), 1.2, F); COUNT("#ca-n1", 0, 300000, at(2, 0.14), 1.2, F);
      IN("#ca-gv", at(2, 0.3), 0.4);
      tl.to("#ca-gv", { scale: 1.15, svgOrigin: "660 334", duration: 0.25, yoyo: true, repeat: 1 }, at(2, 0.33));
      IN("#ca-cond", at(2, 0.42), 0.4);
      IN("#ca-l1", at(2, 0.62), 0.5, { x: -16 }, { x: 0 });
      tl.to("#ca-l1", { scale: 1.05, svgOrigin: "1000 405", duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.88));
      // L3 flash loan swap
      IN("#ca-fl", at(3, 0.04), 0.4, { x: 20 }, { x: 0 });
      ARROW("#ca-flow", at(3, 0.14), 0.6);
      TANK(1, 400, at(3, 0.26), 1.4); COUNT("#ca-n1", 300000, 600000, at(3, 0.26), 1.4, F);
      tl.to("#ca-flow", { opacity: 0, duration: 0.4 }, at(3, 0.26) + 1.5);
      TANK(0, 100, at(3, 0.44), 1.2); COUNT("#ca-n0", 100, 50, at(3, 0.44), 1.2, F);
      NEEDLE(12000, at(3, 0.44), 1.4, "back.out(1.4)");
      COUNT("#ca-gv", 3000, 12000, at(3, 0.44), 1.4, F);
      IN("#ca-l2", at(3, 0.6), 0.5, { x: -16 }, { x: 0 });
      IN("#ca-50b", at(3, 0.84), 0.4, { scale: 1.3, svgOrigin: "1720 602" }, { scale: 1, svgOrigin: "1720 602" });
      // L4 new spot price
      IN("#ca-l3", at(4, 0.04), 0.5, { x: -16 }, { x: 0 });
      tl.to("#ca-gv", { scale: 1.15, svgOrigin: "680 334", duration: 0.25, yoyo: true, repeat: 1 }, at(4, 0.3));
      IN("#ca-x4", at(4, 0.44), 0.4, { scale: 1.6, svgOrigin: "1640 700" }, { scale: 1, svgOrigin: "1640 700" });
      IN("#ca-got", at(4, 0.7), 0.5, { y: 12 }, { y: 0 });
      // L5 lending protocol
      OUT("#ca-math", at(5, 0.0), 0.4);
      IN("#ca-lend", at(5, 0.04), 0.5);
      ARROW("#ca-read", at(5, 0.14), 0.5);
      tl.to("#ca-gv", { scale: 1.15, svgOrigin: "680 334", duration: 0.25, yoyo: true, repeat: 1 }, at(5, 0.2));
      IN("#ca-col", at(5, 0.34), 0.3);
      tl.to("#ca-col", { y: -160, opacity: 0, duration: 0.8, ease: "power2.in" }, at(5, 0.36));
      ARROW("#ca-out", at(5, 0.46), 0.3);
      IN("#ca-pile", at(5, 0.48), 0.5, { y: 30 }, { y: 0 });
      IN("#ca-borrow", at(5, 0.5), 0.4);
      DRAW("#ca-ax", at(5, 0.6), 0.6);
      IN("#ca-same", at(5, 0.62), 0.4);
      [0, 1, 2, 3].forEach(k => IN(`#ca-s${k}`, at(5, 0.64 + k * 0.05), 0.3));
      TANK(1, 200, at(5, 0.78), 1.0); COUNT("#ca-n1", 600000, 300000, at(5, 0.78), 1.0, F);
      TANK(0, 200, at(5, 0.78), 1.0); COUNT("#ca-n0", 50, 100, at(5, 0.78), 1.0, F);
      NEEDLE(3000, at(5, 0.78), 1.0); COUNT("#ca-gv", 12000, 3000, at(5, 0.78), 1.0, F);
      tl.to("#ca-s3 circle", { attr: { r: 16 }, duration: 0.25, yoyo: true, repeat: 1 }, at(5, 0.9));

      tl.to("#ca-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ca-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["calc"] = tl;
    })();
  </script>
