      [0, 1, 2].forEach(k => {
        tl.to(`#ap-w0c${k}`, { attr: { cx: 410, cy: 640 }, fill: "#FC6255", duration: 0.6, ease: "power2.in" }, at(2, 0.16) + k * 0.2);

      tl.to("#ap-old circle", { strokeWidth: 8, duration: 0.25, yoyo: true, repeat: 3 }, at(2, 0.78));
      // L3 exact approval per swap
      IN("#ap-w1, #ap-w1c0, #ap-w1c1, #ap-w1c2", at(3, 0.02), 0.4);
      IN("#ap-v1, #ap-r1", at(3, 0.08), 0.4);
      FILL("ap-v1", 1, at(3, 0.16)); IN("#ap-v1l", at(3, 0.16), 0.4);
      FILL("ap-v1", 0, at(3, 0.25)); FILL("ap-v1", 1, at(3, 0.3));

      tl.to("#ap-w1c2", { attr: { cx: 1150, cy: 700 }, opacity: 0, duration: 0.5 }, at(3, 0.42) + 0.6);
      IN("#ap-one", at(3, 0.47), 0.4);
      FILL("ap-v1", 0, at(3, 0.47));
      IN("#ap-gas", at(3, 0.66), 0.4, { scale: 0.8, svgOrigin: "960 845" }, { scale: 1, svgOrigin: "960 845" });
      IN("#ap-fit", at(3, 0.86), 0.4);
      // L4 Permit2
      IN("#ap-w2, #ap-w2c0, #ap-w2c1", at(4, 0.02), 0.4);
      IN("#ap-p2", at(4, 0.12), 0.5, { x: -20 }, { x: 0 });
