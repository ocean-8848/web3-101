      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const LIT = (i, t, c) => { tl.to(`#to-ct${i}`, { fill: "#e8e6df", duration: 0.3 }, t); tl.to(`#to-cr${i}`, { stroke: c, duration: 0.3 }, t); };
      // L0 five slots
      [0, 1, 2, 3, 4].forEach(i => IN(`#to-c${i}`, at(0, 0.05 + i * 0.13), 0.5, { y: 24 }, { y: 0 }));
      // L1 counterfeit
      LIT(0, at(1, 0.0), "#FC6255");
      IN("#to-k0", at(1, 0.08), 0.5, { scale: 0.7, svgOrigin: "212 440" }, { scale: 1, svgOrigin: "212 440" });
      IN("#to-k1", at(1, 0.16), 0.5, { scale: 0.7, svgOrigin: "348 440" }, { scale: 1, svgOrigin: "348 440" });
      IN("#to-ka0", at(1, 0.36), 0.4, { y: -12 }, { y: 0 });
      IN("#to-ka1", at(1, 0.42), 0.4, { y: -12 }, { y: 0 });
      tl.to("#to-kc1", { stroke: "#FC6255", duration: 0.3 }, at(1, 0.58));
      IN("#to-fake", at(1, 0.6), 0.35, { scale: 1.6, svgOrigin: "348 650" }, { scale: 1, svgOrigin: "348 650", ease: "back.out(2)" });
      IN("#to-real", at(1, 0.78), 0.4);
      tl.to("#to-ka0, #to-ka1", { fill: "#e8e6df", duration: 0.3 }, at(1, 0.78));
      IN("#to-e0", at(1, 0.84), 0.4);
      // L2 fee-on-transfer
      LIT(1, at(2, 0.0), "#FC6255");
      IN("#to-term", at(2, 0.04), 0.5);
      IN("#to-q, #to-bar, #to-cut", at(2, 0.1), 0.4);
      IN("#to-pool", at(2, 0.18), 0.4);
      tl.to("#to-cut", { y: 70, opacity: 0, duration: 0.7, ease: "power2.in" }, at(2, 0.38));
      tl.to("#to-bar", { attr: { width: 120 }, duration: 0.01 }, at(2, 0.38));
      tl.to("#to-bar", { x: 90, y: 270, duration: 1.0, ease: "power2.inOut" }, at(2, 0.5));
      IN("#to-e1", at(2, 0.72), 0.4);
      OUT("#to-term", at(2, 0.04) + 7.4, 0.4);
      // L3 rebase
      LIT(2, at(3, 0.0), "#FC6255");
      IN("#to-term2", at(3, 0.02), 0.5);
      IN("#to-w", at(3, 0.08), 0.4);
      const wn = document.querySelector("#to-wn"); const wo = { v: 100 };
      [[100, 106, 0.2], [106, 97, 0.36], [97, 103, 0.52], [103, 95, 0.68], [95, 101, 0.84]].forEach(([a, b, f]) =>
        tl.fromTo(wo, { v: a }, { v: b, duration: 0.7, ease: "power1.inOut", immediateRender: false, onUpdate: () => { wn.textContent = Math.round(wo.v); } }, at(3, f)));
      IN("#to-pr", at(3, 0.3), 0.4);
      IN("#to-ne", at(3, 0.5), 0.4, { scale: 1.5, svgOrigin: "960 565" }, { scale: 1, svgOrigin: "960 565" });
      IN("#to-e2", at(3, 0.72), 0.4);
      OUT("#to-term2", at(3, 0.02) + 7.4, 0.4);
      // L4 honeypot

      IN("#to-term3", at(4, 0.02), 0.5);
      IN("#to-door", at(4, 0.08), 0.5);
      IN("#to-hc", at(4, 0.18), 0.3);
      tl.to("#to-hc", { attr: { cx: 1400 }, duration: 1.0, ease: "power2.inOut" }, at(4, 0.24));
      IN("#to-in", at(4, 0.28), 0.4);
      [0.45, 0.6].forEach(f => {

        tl.to("#to-hc", { attr: { cx: 1400 }, duration: 0.35, ease: "back.out(3)" }, at(4, f) + 0.25);

      IN("#to-out", at(4, 0.5), 0.4);
      IN("#to-e3", at(4, 0.78), 0.4);
      OUT("#to-term3", at(4, 0.02) + 7.6, 0.4);
      // L5 blacklist / pause

      IN("#to-adm", at(5, 0.06), 0.5);
      IN("#to-addr", at(5, 0.18), 0.4);
      tl.to("#to-btn", { attr: { cy: 452 }, duration: 0.15, yoyo: true, repeat: 1 }, at(5, 0.3));
