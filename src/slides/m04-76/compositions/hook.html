    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 search
      tl.set("#ho-search", { y: 100 }, 0);
      IN("#ho-box", at(0, 0.0), 0.6, { y: 20 }, { y: 0 });
      IN("#ho-q, #ho-caret", at(0, 0.1), 0.01);
      tl.fromTo("#ho-cliprect", { attr: { width: 0 } }, { attr: { width: 120 }, duration: 1.0, ease: "steps(4)", immediateRender: false }, at(0, 0.12));
      tl.fromTo("#ho-caret", { attr: { x: 604 } }, { attr: { x: 712 }, duration: 1.0, ease: "steps(4)", immediateRender: false }, at(0, 0.12));
      OUT("#ho-caret", at(0, 0.34), 0.2);
      ["#ho-r0", "#ho-r1", "#ho-r2"].forEach((s, i) => IN(s, at(0, 0.38 + i * 0.12), 0.5, { y: -20 }, { y: 0 }));
      [0, 1, 2].forEach(i => tl.to(`#ho-r${i} circle`, { attr: { r: 30 }, duration: 0.25, yoyo: true, repeat: 1 }, at(0, 0.82) + i * 0.15));
      // L1 buy -> next day -> sell fails
      IN("#ho-cheap", at(1, 0.0), 0.4);
      IN("#ho-cur", at(1, 0.05), 0.3, { x: 1500, y: 900 }, { x: 1160, y: 610 });
      tl.to("#ho-rr2", { stroke: "#F0B90B", strokeWidth: 4, duration: 0.2 }, at(1, 0.16));
      IN("#ho-ok", at(1, 0.22), 0.4, { x: -20 }, { x: 0 });
      IN("#ho-cal", at(1, 0.38), 0.4);
      OUT("#ho-d1", at(1, 0.48), 0.2);
      IN("#ho-d2", at(1, 0.5), 0.3, { y: -16 }, { y: 0 });
      IN("#ho-sell", at(1, 0.56), 0.3);
      tl.to("#ho-cur", { x: 1500, y: 730, duration: 0.4, ease: "power2.inOut" }, at(1, 0.56));
      tl.to("#ho-sellr", { fill: "#2a2f3a", duration: 0.12, yoyo: true, repeat: 1 }, at(1, 0.64));
      [0, 1, 2].forEach(i => {
        tl.fromTo("#ho-fail", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, at(1, 0.68) + i * 0.45);
        if (i < 2) tl.to("#ho-fail", { opacity: 0.15, duration: 0.15 }, at(1, 0.68) + i * 0.45 + 0.25);
      });
      tl.to("#ho-sellr", { stroke: "#FC6255", duration: 0.2 }, at(1, 0.7));
      // L2 market
