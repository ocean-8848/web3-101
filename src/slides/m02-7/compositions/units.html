      };

[[0, 0.06], [1, 0.4], [2, 0.5], [3, 0.7]].forEach(([i, f]) => {

  IN(`#un-r${i}t`, at(0, f) + 0.4, 0.6);
});

HL("un-code", 7, [0], at(2, 0.1), 0.85);
[0, 1, 2, 3].forEach(i => { IN(`#un-sn${i}, #un-sg${i}`, at(2, 0.14) + i * 0.12, 0.4); });
HL("un-code", 7, [3], at(2, 0.33));

[0, 1, 2, 3].forEach(i => { const ys = [640, 705, 770, 835]; MOVE(`#un-sg${i}`, at(2, 0.52), { y: 930 - ys[i] }, 0.8); });

IN("#un-gr", at(2, 0.66), 0.4);
