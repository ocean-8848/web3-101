      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0: 术语卡 + 积木板 + 6 块积木落下
      IN("#sd-term", at(0, 0.04), 0.5);
      IN("#sd-base", at(0, 0.12), 0.6, { y: 24 }, { y: 0 });
      ["#sd-b0", "#sd-b1", "#sd-b2", "#sd-b3", "#sd-b4", "#sd-b5"].forEach((s, i) => {
        IN(s, at(0, 0.28 + i * 0.10), 0.45, { y: -36 }, { y: 0 });
      });

      // L1: 切面 + 原子回滚
      OUT("#sd-board", at(1, 0.0), 0.35);
      IN("#sd-mod", at(1, 0.05), 0.55, { x: -24 }, { x: 0 });
      IN("#sd-msg", at(1, 0.12), 0.5, { y: 14 }, { y: 0 });
      OUT("#sd-term", at(1, 0.14), 0.4);
      IN("#sd-kpr", at(1, 0.28), 0.5, { y: 14 }, { y: 0 });
      IN("#sd-aux", at(1, 0.40), 0.45);
      IN("#sd-tx", at(1, 0.50), 0.5, { x: 24 }, { x: 0 });
      IN("#sd-m1", at(1, 0.56), 0.35);
      IN("#sd-m2", at(1, 0.61), 0.35);
      IN("#sd-m3", at(1, 0.66), 0.35);
      IN("#sd-m1s", at(1, 0.70), 0.25);
      tl.to("#sd-m1r", { stroke: "#83C167", duration: 0.25 }, at(1, 0.70));
      IN("#sd-m2s", at(1, 0.75), 0.25);
      tl.to("#sd-m2r", { stroke: "#83C167", duration: 0.25 }, at(1, 0.75));
      IN("#sd-m3s", at(1, 0.81), 0.25);
      tl.to("#sd-m3r", { stroke: "#FC6255", duration: 0.25 }, at(1, 0.81));
      // 整笔回滚
      tl.to("#sd-m1, #sd-m2, #sd-m3", { x: -22, duration: 0.45, ease: "power2.inOut" }, at(1, 0.88));
      tl.to("#sd-m1r, #sd-m2r", { stroke: "#FC6255", duration: 0.35 }, at(1, 0.88));
      IN("#sd-rb", at(1, 0.90), 0.45, { y: 14 }, { y: 0 });

      // L2: 对照表前两行
      OUT("#sd-p1", at(2, 0.0), 0.35);
      IN("#sd-mini", at(2, 0.05), 0.5);
      IN("#sd-tblh", at(2, 0.08), 0.45);
      IN("#sd-tr0", at(2, 0.14), 0.5, { x: 20 }, { x: 0 });
      tl.to("#sd-mb0", { stroke: "#58C4DD", duration: 0.35 }, at(2, 0.14));
      IN("#sd-tr1", at(2, 0.52), 0.5, { x: 20 }, { x: 0 });
      tl.to("#sd-mb1", { stroke: "#F0B90B", duration: 0.35 }, at(2, 0.52));
      tl.to("#sd-tr1e1, #sd-tr1e2", { fill: "#F0B90B", duration: 0.45 }, at(2, 0.78));

      // L3: 后三行
      IN("#sd-tr2", at(3, 0.04), 0.5, { x: 20 }, { x: 0 });
      tl.to("#sd-mb2", { stroke: "#B48EF0", duration: 0.35 }, at(3, 0.04));
      IN("#sd-tr3", at(3, 0.30), 0.5, { x: 20 }, { x: 0 });
      tl.to("#sd-mb3", { stroke: "#FF9F43", duration: 0.35 }, at(3, 0.30));
      tl.to("#sd-tr3e", { fill: "#FF9F43", duration: 0.45 }, at(3, 0.54));
      IN("#sd-tr4", at(3, 0.74), 0.5, { x: 20 }, { x: 0 });
      tl.to("#sd-mb4", { stroke: "#58C4DD", duration: 0.35 }, at(3, 0.74));
      tl.to("#sd-tr4e", { fill: "#58C4DD", duration: 0.4 }, at(3, 0.90));

      // L4: 确定性检查
      OUT("#sd-p2", at(4, 0.0), 0.35);
      IN("#sd-n1", at(4, 0.06), 0.45, { y: 16 }, { y: 0 });
      IN("#sd-n2", at(4, 0.13), 0.45, { y: 16 }, { y: 0 });
      IN("#sd-n3", at(4, 0.20), 0.45, { y: 16 }, { y: 0 });
      IN("#sd-h1b, #sd-h1t, #sd-h2b, #sd-h2t", at(4, 0.30), 0.45);
      IN("#sd-bad0", at(4, 0.42), 0.35, { y: -12 }, { y: 0 });
      IN("#sd-bad1", at(4, 0.52), 0.35, { y: -12 }, { y: 0 });
      IN("#sd-bad2", at(4, 0.62), 0.35, { y: -12 }, { y: 0 });
      IN("#sd-h3b, #sd-h3t", at(4, 0.72), 0.4);
      tl.to("#sd-n3r", { stroke: "#FC6255", duration: 0.35 }, at(4, 0.72));
      IN("#sd-halt", at(4, 0.84), 0.45, { y: 16 }, { y: 0 });

      // L5: keeper 权限错误授予
      OUT("#sd-det", at(5, 0.0), 0.35);
      IN("#sd-vL", at(5, 0.06), 0.5, { x: -24 }, { x: 0 });
      IN("#sd-vR", at(5, 0.14), 0.5, { x: 24 }, { x: 0 });
      ARROW("#sd-karr", at(5, 0.28), 0.6);
      IN("#sd-klbl", at(5, 0.32), 0.4);
      IN("#sd-key", at(5, 0.40), 0.4);
      tl.to("#sd-key", { x: 140, duration: 0.9, ease: "power2.inOut" }, at(5, 0.44));
      tl.to("#sd-vRr", { stroke: "#FC6255", duration: 0.4 }, at(5, 0.62));
      IN("#sd-warn", at(5, 0.68), 0.5, { scale: 0.92, svgOrigin: "960 792" }, { scale: 1, svgOrigin: "960 792" });

      tl.to("#sd-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#sd-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["sdk"] = tl;
    })();
  </script>
</template>
