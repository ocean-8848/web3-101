      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0: 两张对比卡
      IN("#vs-hero", at(0, 0.04), 0.6, { y: 16 }, { y: 0 });
      IN("#vs-hero2", at(0, 0.55), 0.5);

      // L1: 对比卡 + 多签桥细节
      OUT(["#vs-hero", "#vs-hero2"], at(1, 0) - 0.35, 0.3);
      IN("#vs-cardL", at(1, 0), 0.5, { x: -24 }, { x: 0 });
      IN("#vs-cardR", at(1, 0.02), 0.5, { x: 24 }, { x: 0 });
      IN("#vs-mid", at(1, 0.04), 0.4);
      IN("#vs-l0note", at(1, 0.08), 0.45);
      IN("#vs-signers", at(1, 0.08), 0.5);
      [0, 1, 2, 3, 4].forEach((k, i) => {
        tl.to(`#vs-sg${k}`, { fill: "#FF9F43", stroke: "#FF9F43", duration: 0.25 }, at(1, 0.16) + i * 0.18);
      });
      IN("#vs-secL", at(1, 0.36), 0.5);
      [0, 1, 2, 3, 4].forEach((k, i) => {
        tl.to(`#vs-sg${k}`, { fill: "#FC6255", stroke: "#FC6255", duration: 0.25 }, at(1, 0.60) + i * 0.12);
      });
      IN("#vs-steal", at(1, 0.68), 0.55, { y: 14 }, { y: 0 });

      // L2: IBC 细节
      IN("#vs-lcR", at(2, 0.06), 0.55, { y: 14 }, { y: 0 });
      IN("#vs-secR", at(2, 0.32), 0.5);
      IN("#vs-relR", at(2, 0.58), 0.55, { y: 14 }, { y: 0 });
      IN("#vs-het", at(2, 0.80), 0.45);

      // L3: 对方链 >2/3 合谋
      OUT("#vs-l0note", at(3, 0), 0.3);
      IN("#vs-collude", at(3, 0.08), 0.5, { y: 18 }, { y: 0 });
      ARROW("#vs-col-a1", at(3, 0.22), 0.45);
      ARROW("#vs-col-a2", at(3, 0.36), 0.45);
      IN("#vs-col-blind", at(3, 0.45), 0.45);

      // L4: 4000 万质押算一算
      OUT("#vs-s1", at(4, 0), 0.4);
      IN("#vs-axis", at(4, 0.05), 0.4);
      IN("#vs-calct", at(4, 0.04), 0.5);
      IN("#vs-bar40", at(4, 0.08), 0.6, { y: 24 }, { y: 0 });
      COUNT("#vs-n40", 0, 4000, at(4, 0.12), 1.4);
      IN("#vs-t13", at(4, 0.38), 0.6, { x: -16 }, { x: 0 });
      COUNT("#vs-n13", 0, 1333, at(4, 0.42), 1.2);
      IN("#vs-t23", at(4, 0.68), 0.6, { x: -16 }, { x: 0 });
      COUNT("#vs-n26", 0, 2667, at(4, 0.72), 1.2);
      IN("#vs-calc13", at(4, 0.40), 0.55, { x: 20 }, { x: 0 });
      IN("#vs-calc23", at(4, 0.70), 0.55, { x: 20 }, { x: 0 });
      tl.to("#vs-t23", { scale: 1.03, svgOrigin: "530 650", duration: 0.35, yoyo: true, repeat: 1 }, at(4, 0.88));

      // L5: 托管 1 亿 + 天平 + 通道限额
      OUT(["#vs-calc13", "#vs-calc23"], at(5, 0) - 0.35, 0.3);
      IN("#vs-bar100", at(5, 0.06), 0.7, { y: 36 }, { y: 0 });
      IN("#vs-scale", at(5, 0.32), 0.65, { y: 16 }, { y: 0 });
      IN("#vs-cap", at(5, 0.64), 0.6, { y: 16 }, { y: 0 });

      // L6: Dragonberry
      OUT("#vs-s2", at(6, 0), 0.4);
      IN("#vs-s3t", at(6, 0.05), 0.5);
      IN("#vs-inc1", at(6, 0.12), 0.55, { y: 18 }, { y: 0 });
      IN("#vs-inc1a", at(6, 0.30), 0.5);
      IN("#vs-inc1b", at(6, 0.52), 0.5);
      IN("#vs-inc1c", at(6, 0.74), 0.55, { y: 12 }, { y: 0 });

      // L7: BNB Token Hub + 总结
      IN("#vs-inc2", at(7, 0.06), 0.55, { y: 18 }, { y: 0 });
      IN("#vs-inc2a", at(7, 0.26), 0.5);
      IN("#vs-inc2b", at(7, 0.46), 0.55, { y: 16 }, { y: 0 });
      IN("#vs-end", at(7, 0.72), 0.6, { y: 16 }, { y: 0 });

      tl.to("#vs-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["vsbridge"] = tl;
    })();
  </script>
</template>
