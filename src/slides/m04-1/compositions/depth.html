      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const TO = (s, v, t) => tl.to(s, v, t);
      const PULSE = (s, t, o, k = 1.08) => tl.to(s, { scale: k, svgOrigin: o, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut" }, t);
      const FL = (s, t, c) => tl.to(s, { fill: c, duration: 0.25, yoyo: true, repeat: 1 }, t);
      const RE = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out", immediateRender: false }, t);
      const W = (s, t, a, d = 0.6) => tl.to(s, { attr: a, duration: d, ease: "power2.inOut" }, t);

// L0 visible fee vs hidden slippage
IN("#de-coin", at(0, 0.05), 0.6); IN("#de-cl", at(0, 0.25), 0.5);
IN("#de-fog", at(0, 0.45), 0.9); IN("#de-fl", at(0, 0.65), 0.5);
// L1 order book, spread, depth

[0,1,2,3].forEach(i => { IN(`#de-a${i}`, at(1, 0.06 + i * 0.03), 0.5, { attr: { width: 0 } }, { attr: { width: [300,220,260,180][i] } }); IN(`#de-d${i}`, at(1, 0.14 + i * 0.03), 0.5, { attr: { width: 0 } }, { attr: { width: [200,280,240,320][i] } }); });

tl.to("#de-ax", { attr: { y2: 600 }, duration: 0.5 }, at(3, 0.05));

IN("#de-ord", at(3, 0.8), 0.6, { y: 20 }, { y: 0 });

// L4 walk the book

W("#de-qb1", at(4, 0.12), { x: 772, width: 0 }, 0.6); COUNT("#de-rem", 3, 2.2, at(4, 0.14), 0.6, rem);

W("#de-qb2", at(4, 0.44), { x: 852, width: 0 }, 0.6); COUNT("#de-rem", 2.2, 1.0, at(4, 0.46), 0.6, rem);
FL("#de-qb3", at(4, 0.66), "#83C167"); OUT("#de-qt3", at(4, 0.7), 0.3);
W("#de-qb3", at(4, 0.7), { width: 200 }, 0.6); IN("#de-qg3", at(4, 0.72), 0.5); COUNT("#de-rem", 1.0, 0, at(4, 0.72), 0.6, rem);

IN("#de-e1", at(5, 0.04), 0.5); FL("#de-p1", at(5, 0.04), "#e8e6df");
IN("#de-e2", at(5, 0.16), 0.5); FL("#de-p2", at(5, 0.16), "#e8e6df");
