  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0: 标题 + 左终端 + 右对象状态面板
      IN("#la-title", at(0, 0.04), 0.45);
      IN("#la-termWin", at(0, 0.28), 0.5, { x: -20 }, { x: 0 });
      IN("#la-objWin", at(0, 0.58), 0.5, { x: 20 }, { x: 0 });

      // L1: localnet 4 条命令 + 右侧 Gas 币出现
      IN("#la-c1_0", at(1, 0.06), 0.4);
      IN("#la-c1_1", at(1, 0.28), 0.4);
      IN("#la-c1_2", at(1, 0.46), 0.4);
      IN("#la-c1_note", at(1, 0.48), 0.4);
      IN("#la-c1_3", at(1, 0.68), 0.4);
      IN("#la-gas0", at(1, 0.54), 0.4, { y: 14 }, { y: 0 });
      IN("#la-gas1", at(1, 0.68), 0.4, { y: 14 }, { y: 0 });
      IN("#la-gas2", at(1, 0.82), 0.4, { y: 14 }, { y: 0 });

      // L2: 换成 Move 计数器代码，逐行高亮 key -> share_object -> increment
      OUT("#la-cli1, #la-winTerm", at(2, 0.0), 0.3);
      IN("#la-winCode, #la-code2", at(2, 0.06), 0.45);
      IN("#la-hl", at(2, 0.14), 0.3);
      tl.to("#la-hl", { attr: { y: 542 }, duration: 0.45, ease: "power2.inOut" }, at(2, 0.50));
      IN("#la-c2note", at(2, 0.55), 0.45);
      tl.to("#la-hl", { attr: { y: 716 }, duration: 0.45, ease: "power2.inOut" }, at(2, 0.78));

      // L3: build / test / publish -> 右面板出现 Package ID 与 UpgradeCap
      OUT("#la-code2, #la-winCode, #la-gasList", at(3, 0.0), 0.3);
      IN("#la-winTerm", at(3, 0.05), 0.3);
      IN("#la-c3_0", at(3, 0.08), 0.4);
      IN("#la-c3_1", at(3, 0.28), 0.4);
      IN("#la-c3_2", at(3, 0.46), 0.4);
      IN("#la-c3_note", at(3, 0.48), 0.4);
      IN("#la-pkgCard", at(3, 0.54), 0.45, { y: 16 }, { y: 0 });
      IN("#la-capCard", at(3, 0.68), 0.45, { y: 16 }, { y: 0 });

      // L4: create + PTB increment -> Counter 卡 Shared, value 0->1, version +1
      OUT("#la-cli3", at(4, 0.0), 0.3);
      IN("#la-c4_0", at(4, 0.05), 0.4);
      IN("#la-ctrCard", at(4, 0.14), 0.5, { y: 18 }, { y: 0 });
      IN("#la-c4_1", at(4, 0.30), 0.35);
      IN("#la-c4_2", at(4, 0.35), 0.35);
      IN("#la-c4_3", at(4, 0.40), 0.35);
      IN("#la-c4_4", at(4, 0.56), 0.4);
      OUT("#la-v0", at(4, 0.72), 0.2);
      IN("#la-v1", at(4, 0.75), 0.35, { scale: 1.25, svgOrigin: "1400 784" }, { scale: 1, svgOrigin: "1400 784" });
      OUT("#la-ver1", at(4, 0.84), 0.2);
      IN("#la-ver2", at(4, 0.87), 0.35);

      // L5: share_object 改为 transfer -> Owner 变地址(绿)，他址调用被拒(红)
      OUT("#la-cli4, #la-pubObjs", at(5, 0.0), 0.3);
      IN("#la-d5old", at(5, 0.08), 0.35);
      IN("#la-d5new", at(5, 0.24), 0.4);
      IN("#la-d5note", at(5, 0.36), 0.4);
      OUT("#la-ownShared", at(5, 0.44), 0.2);
      IN("#la-ownAddr", at(5, 0.48), 0.35);
      tl.to("#la-ctrRect", { stroke: "#83C167", duration: 0.35 }, at(5, 0.48));
      IN("#la-denyOther", at(5, 0.66), 0.5, { scale: 0.94, svgOrigin: "1490 415" }, { scale: 1, svgOrigin: "1490 415" });

      // L6: UpgradeCap 三个安全去处 + 热钱包红线警示
      OUT("#la-ide", at(6, 0.0), 0.35);
      IN("#la-capRoot", at(6, 0.06), 0.5, { scale: 0.92, svgOrigin: "310 540" }, { scale: 1, svgOrigin: "310 540" });
      ARROW("#la-ca0", at(6, 0.20), 0.45);
      IN("#la-cd0", at(6, 0.25), 0.45, { x: 20 }, { x: 0 });
      ARROW("#la-ca1", at(6, 0.35), 0.45);
      IN("#la-cd1", at(6, 0.40), 0.45, { x: 20 }, { x: 0 });
      ARROW("#la-ca2", at(6, 0.50), 0.45);
      IN("#la-cd2", at(6, 0.55), 0.45, { x: 20 }, { x: 0 });
      ARROW("#la-ca3", at(6, 0.62), 0.45);
      IN("#la-cd3", at(6, 0.66), 0.5, { x: 20 }, { x: 0 });

      tl.to("#la-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["lab"] = tl;
    })();
  </script>
