            <text id="bl-spLow" x="140" y="890" font-size="28" fill="#83C167">冲突少 · 加速高</text>
            <text id="bl-spHigh" class="h" x="1120" y="890" font-size="28" fill="#FC6255" text-anchor="end">冲突多 → 退化趋近 1 倍</text>
          </g>
          <g id="bl-paper" class="h">
            <rect x="1220" y="688" width="600" height="250" rx="16" fill="#161a22" stroke="#F0B90B" stroke-width="3" />
            <text x="1260" y="746" font-size="28" fill="#8a8f99">论文基准测试</text>
            <text id="bl-p1" class="h" x="1260" y="806" font-size="34" font-weight="700" fill="#F0B90B">32 线程 · 最高约 17 万 TPS</text>
            <text id="bl-p2" class="h" x="1260" y="864" font-size="34" font-weight="700" fill="#83C167">比顺序快约 17 倍</text>
            <text id="bl-p3" class="h" x="1260" y="914" font-size="28" fill="#8a8f99">论文基准，以官方为准</text>
          </g>
        </g>

        <!-- 阶段 C：自动发现 vs 交易声明 + 验证者确定性状态哈希 (L6) -->
        <g id="bl-diff">
          <g id="bl-dLeft" class="h"><rect x="110" y="150" width="780" height="250" rx="18" fill="#161a22" stroke="#58C4DD" stroke-width="3" /><text x="500" y="226" font-size="38" font-weight="700" fill="#58C4DD" text-anchor="middle">Solana / Sui</text><text x="500" y="302" font-size="34" fill="#e8e6df" text-anchor="middle">交易提前声明读写数据</text><text x="500" y="362" font-size="28" fill="#8a8f99" text-anchor="middle">开发者 / 客户端显式列出</text></g>
          <g id="bl-dRight" class="h"><rect x="1030" y="150" width="780" height="250" rx="18" fill="#161a22" stroke="#83C167" stroke-width="3" /><text x="1420" y="226" font-size="38" font-weight="700" fill="#83C167" text-anchor="middle">Aptos · Block-STM</text><text x="1420" y="302" font-size="34" fill="#e8e6df" text-anchor="middle">无需声明，执行器自动发现</text><text x="1420" y="362" font-size="28" fill="#83C167" text-anchor="middle">乐观并行 + 冲突重算</text></g>
          <text id="bl-detTitle" class="h" x="960" y="512" font-size="38" font-weight="700" fill="#e8e6df" text-anchor="middle">结果确定：线程数不同，状态也相同</text>
          <g id="bl-v0" class="h"><rect x="200" y="566" width="380" height="120" rx="16" fill="#161a22" stroke="#B48EF0" stroke-width="3" /><text x="390" y="618" font-size="32" font-weight="700" fill="#B48EF0" text-anchor="middle">验证者 A</text><text x="390" y="664" font-size="28" fill="#8a8f99" text-anchor="middle">4 线程执行</text></g>
          <g id="bl-v1" class="h"><rect x="770" y="566" width="380" height="120" rx="16" fill="#161a22" stroke="#B48EF0" stroke-width="3" /><text x="960" y="618" font-size="32" font-weight="700" fill="#B48EF0" text-anchor="middle">验证者 B</text><text x="960" y="664" font-size="28" fill="#8a8f99" text-anchor="middle">16 线程执行</text></g>
          <g id="bl-v2" class="h"><rect x="1340" y="566" width="380" height="120" rx="16" fill="#161a22" stroke="#B48EF0" stroke-width="3" /><text x="1530" y="618" font-size="32" font-weight="700" fill="#B48EF0" text-anchor="middle">验证者 C</text><text x="1530" y="664" font-size="28" fill="#8a8f99" text-anchor="middle">32 线程执行</text></g>
          <path id="bl-va0" class="dr h" pathLength="1" d="M390 692 L830 818" stroke="#83C167" stroke-width="4" fill="none" marker-end="url(#bl-mgr)" />
          <path id="bl-va1" class="dr h" pathLength="1" d="M960 692 L960 812" stroke="#83C167" stroke-width="4" fill="none" marker-end="url(#bl-mgr)" />
          <path id="bl-va2" class="dr h" pathLength="1" d="M1530 692 L1090 818" stroke="#83C167" stroke-width="4" fill="none" marker-end="url(#bl-mgr)" />
          <g id="bl-hash" class="h"><rect x="640" y="822" width="640" height="106" rx="18" fill="#83C167" fill-opacity="0.16" stroke="#83C167" stroke-width="3" /><text x="960" y="888" font-size="38" font-weight="700" fill="#83C167" text-anchor="middle">同一个状态哈希 ✓</text></g>
        </g>
      </g>

      <!-- 术语卡（统一样式）：左上角；一次只放一个词 -->
      <g id="bl-term" class="h">
        <rect x="70" y="56" width="630" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">Block-STM <tspan font-size="28" font-weight="400" fill="#8a8f99">软件事务内存</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">乐观并行、冲突重算的执行引擎</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const stepOn = (i, col, t) => {
        tl.to(`#bl-st${i}r`, { stroke: col, fill: col, fillOpacity: 0.16, duration: 0.35 }, t);
        tl.to(`#bl-st${i}t`, { fill: col, duration: 0.35 }, t);
      };
      const stepDim = (i, t) => {
        tl.to(`#bl-st${i}r`, { stroke: "#8a8f99", fill: "#161a22", fillOpacity: 1, duration: 0.3 }, t);
        tl.to(`#bl-st${i}t`, { fill: "#8a8f99", duration: 0.3 }, t);
      };

      // L0: 术语卡 + 四步条依次亮出
      IN("#bl-term", at(0, 0.04), 0.5);
      IN("#bl-st0", at(0, 0.25), 0.45);
      ARROW("#bl-sa0", at(0, 0.36), 0.3);
      IN("#bl-st1", at(0, 0.44), 0.45);
      ARROW("#bl-sa1", at(0, 0.54), 0.3);
      IN("#bl-st2", at(0, 0.62), 0.45);
      ARROW("#bl-sa2", at(0, 0.72), 0.3);
      IN("#bl-st3", at(0, 0.80), 0.45);

      // L1: 预设顺序 T1..T8 + 4 线程乐观执行 + 读写集
      stepOn(0, "#F0B90B", at(1, 0.02));
      IN("#bl-ordLbl", at(1, 0.04), 0.4);
      for (let i = 0; i < 8; i++) IN(`#bl-q${i}`, at(1, 0.08 + i * 0.03), 0.35, { y: 12 }, { y: 0 });
      OUT("#bl-term", at(1, 0.22), 0.4);
      // 二，多线程乐观执行
      stepDim(0, at(1, 0.44));
      stepOn(1, "#58C4DD", at(1, 0.46));
      IN("#bl-lanes", at(1, 0.48), 0.5);
      for (let i = 0; i < 4; i++) IN(`#bl-lT${i}`, at(1, 0.55 + i * 0.025), 0.35, { x: -20 }, { x: 0 });
      for (let i = 4; i < 8; i++) IN(`#bl-lT${i}`, at(1, 0.66 + (i - 4) * 0.025), 0.35, { x: -20 }, { x: 0 });
      for (let i = 0; i < 4; i++) IN(`#bl-rw${i}`, at(1, 0.78 + i * 0.02), 0.35);
      for (let i = 4; i < 8; i++) IN(`#bl-rw${i}`, at(1, 0.86 + (i - 4) * 0.02), 0.35);

      // L2: 校验扫描 + T3 写 X 与 T6 读 X 冲突作废 + 重算 T6
      stepDim(1, at(2, 0.02));
      stepOn(2, "#FF9F43", at(2, 0.04));
      IN("#bl-scan", at(2, 0.08), 0.15);
      tl.fromTo("#bl-scan", { attr: { x1: 230, x2: 230 } }, { attr: { x1: 1400, x2: 1400 }, duration: 2.2, ease: "none" }, at(2, 0.10));
      OUT("#bl-scan", at(2, 0.34), 0.25);
      IN("#bl-okRow", at(2, 0.24), 0.3);
      ARROW("#bl-conf", at(2, 0.32), 0.65);
      tl.to("#bl-t6r, #bl-t6rd", { stroke: "#FC6255", fill: "#FC6255", fillOpacity: 0.22, duration: 0.3 }, at(2, 0.40));
      tl.to("#bl-t6t", { fill: "#FC6255", duration: 0.3 }, at(2, 0.40));
      IN("#bl-abort", at(2, 0.42), 0.35);
      IN("#bl-okRow2, #bl-okRow3", at(2, 0.50), 0.35);
      // 四，只重算 T6
      stepDim(2, at(2, 0.62));
      stepOn(3, "#83C167", at(2, 0.64));
      OUT("#bl-abort", at(2, 0.68), 0.25);
      IN("#bl-reexec", at(2, 0.72), 0.4);
      tl.to("#bl-t6r", { stroke: "#83C167", fill: "#83C167", fillOpacity: 0.2, duration: 0.35 }, at(2, 0.74));
      tl.to("#bl-t6t", { fill: "#83C167", duration: 0.35 }, at(2, 0.74));

      // L3: 算一算 8 笔 4 线程，第一轮 2 时间片
      OUT("#bl-exec, #bl-steps", at(3, 0.0), 0.35);
      IN("#bl-cTitle, #bl-exTag", at(3, 0.06), 0.45);
      IN("#bl-cond0", at(3, 0.16), 0.35);
      IN("#bl-cond1", at(3, 0.26), 0.35);
      IN("#bl-cond2", at(3, 0.38), 0.4);
      IN("#bl-tlPanel", at(3, 0.50), 0.45);
      IN("#bl-r1s1", at(3, 0.62), 0.45, { y: 12 }, { y: 0 });
      IN("#bl-r1s2", at(3, 0.74), 0.45, { y: 12 }, { y: 0 });
      IN("#bl-r1Lbl", at(3, 0.85), 0.4);

      // L4: T6 作废 -> 第二轮重算 1 片 -> 计数 9 次约 3 片 vs 8 片 -> 2.7 倍 -> 冲突倍数条缩短
      tl.to("#bl-cT6r", { stroke: "#FC6255", fill: "#FC6255", fillOpacity: 0.26, duration: 0.3 }, at(4, 0.06));
      tl.to("#bl-cT6t", { fill: "#FC6255", duration: 0.3 }, at(4, 0.06));
      IN("#bl-r2s3", at(4, 0.20), 0.5, { x: -16 }, { x: 0 });
      IN("#bl-sumCard", at(4, 0.34), 0.4);
      IN("#bl-sum1", at(4, 0.38), 0.45);
      IN("#bl-sum2", at(4, 0.52), 0.45);
      IN("#bl-sum3", at(4, 0.64), 0.5, { scale: 0.9, svgOrigin: "1520 520" }, { scale: 1, svgOrigin: "1520 520" });
      IN("#bl-barPanel", at(4, 0.75), 0.4);
      tl.to("#bl-spBar", { attr: { width: 220 }, fill: "#FC6255", duration: 1.8, ease: "power2.inOut" }, at(4, 0.80));
      IN("#bl-spHigh", at(4, 0.88), 0.4);

      // L5: 右下论文数据卡
      IN("#bl-paper", at(5, 0.06), 0.5, { y: 18 }, { y: 0 });
      IN("#bl-p1", at(5, 0.24), 0.5);
      IN("#bl-p2", at(5, 0.52), 0.5);
      IN("#bl-p3", at(5, 0.76), 0.4);

      // L6: 对比声明 vs 自动发现 + 三台验证者同一状态哈希
      OUT("#bl-calc", at(6, 0.0), 0.35);
      IN("#bl-dLeft", at(6, 0.08), 0.5, { x: -24 }, { x: 0 });
      IN("#bl-dRight", at(6, 0.28), 0.5, { x: 24 }, { x: 0 });
      IN("#bl-detTitle", at(6, 0.50), 0.45);
      IN("#bl-v0", at(6, 0.60), 0.4);
      IN("#bl-v1", at(6, 0.66), 0.4);
      IN("#bl-v2", at(6, 0.72), 0.4);
      ARROW("#bl-va0", at(6, 0.76), 0.45);
      ARROW("#bl-va1", at(6, 0.78), 0.45);
      ARROW("#bl-va2", at(6, 0.80), 0.45);
      IN("#bl-hash", at(6, 0.84), 0.5, { scale: 0.92, svgOrigin: "960 875" }, { scale: 1, svgOrigin: "960 875" });

      tl.to("#bl-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#bl-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["blockstm"] = tl;
    })();
  </script>
</template>
