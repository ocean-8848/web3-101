        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

/*ANIM*/
const PULSE = (s, t, o = 0.45) => tl.to(s, { opacity: o, duration: 0.9, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);

// L0

[0.22, 0.52, 0.78].forEach((f, i) => { ARROW(`#re-pa${i}`, at(0, f), 0.4); IN(`#re-s${i}`, at(0, f) + 0.2, 0.5, { x: -20 }, { x: 0 }); });

// L2-L5 cards：2×2 网格，前面的卡保留并压暗
const DIM = (s, t) => tl.to(s, { opacity: 0.55, duration: 0.4 }, t);
const cardIn = (i, prev) => {
  if (prev) OUT(prev, L[i][0], 0.35);
  const t0 = L[i][0] + 0.4;
  IN(`#re-k${i - 2}`, t0, 0.5, { y: 20 }, { y: 0 });
  DRAW(`#re-ks${i - 2}`, at(i, 0.42), 0.5);
};
cardIn(2, "#re-core,#re-d1,#re-d2,#re-d3,#re-da1,#re-da2,#re-c1,#re-c2,#re-ca,#re-sh");
IN("#re-kr0", at(2, 0.5), 0.5, { x: -15 }, { x: 0 });

PULSE("#re-kr0", at(2, 0.82), 0.6);

IN("#re-kr1", at(3, 0.62), 0.5, { x: -15 }, { x: 0 });
DIM("#re-k1,#re-ks1,#re-kr1", L[4][0]); cardIn(4);
IN("#re-kr2", at(4, 0.5), 0.5, { x: -15 }, { x: 0 });
PULSE("#re-kr2", at(4, 0.74), 0.55);
DIM("#re-k2,#re-ks2,#re-kr2", L[5][0]); cardIn(5);
[0, 1, 2].forEach(j => IN(`#re-kd${j}`, at(5, 0.5 + j * 0.13), 0.4, { y: 10 }, { y: 0 }));
// L6
OUT("#re-k0,#re-ks0,#re-kr0,#re-k1,#re-ks1,#re-kr1,#re-k2,#re-ks2,#re-kr2,#re-k3,#re-ks3,#re-kd0,#re-kd1,#re-kd2", at(6, 0), 0.35);

[0, 1, 2, 3].forEach(j => IN(`#re-m${j}`, at(6, 0.35 + j * 0.1), 0.4));

/*ENDANIM*/
