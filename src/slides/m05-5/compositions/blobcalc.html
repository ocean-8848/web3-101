  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      IN("#blo-title", at(0, 0.02), 0.6, { y: -15 }, { y: 0 });
IN("#blo-par", at(0, 0.3), 0.6, { x: -30 }, { x: 0 });

IN("#blo-d1", at(1, 0.05), 0.5, { x: 20 }, { x: 0 });
IN("#blo-d2", at(1, 0.5), 0.5, { x: 20 }, { x: 0 });
// L2 fill a blob
IN("#blo-box", at(2, 0.02), 0.4);
tl.fromTo(".blo-cell", { opacity: 0 }, { opacity: 1, duration: 0.15, stagger: 2.6 / 676, ease: "none" }, at(2, 0.08));
IN("#blo-cntl, #blo-cnt, #blo-cntu", at(2, 0.08), 0.4);
COUNT("#blo-cnt", 0, 3276, at(2, 0.08), 2.8, v => Math.round(v).toLocaleString("en-US"));
IN("#blo-p1", at(2, 0.6), 0.4);
IN("#blo-p2", at(2, 0.72), 0.5);
// L3 calldata comparison
OUT("#blo-boxg, #blo-cntg", at(3, 0), 0.4);
IN("#blo-cd", at(3, 0.06), 0.5, { x: 20 }, { x: 0 });
IN("#blo-ax, #blo-lcd, #blo-lbl", at(3, 0.35), 0.4);
IN("#blo-bbl, #blo-vbl", at(3, 0.42), 0.4);

IN("#blo-brk", at(3, 0.5) + 0.8, 0.2);
IN("#blo-vcd", at(3, 0.62), 0.4);
IN("#blo-x300", at(3, 0.8), 0.5, { scale: 0.7, svgOrigin: "1280 725" }, { scale: 1, svgOrigin: "1280 725" });
