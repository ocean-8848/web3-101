      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const PULSE = (s, x1, y1, x2, y2, t, n, per = 1.0) => {
        tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, t);
        tl.fromTo(s, { attr: { cx: x1, cy: y1 } }, { attr: { cx: x2, cy: y2 }, duration: per, ease: "none", repeat: n - 1, immediateRender: false }, t);
        tl.to(s, { opacity: 0, duration: 0.01 }, t + per * n);
      };
      const TO = (s, v, t) => tl.to(s, v, t);

// L0 axis + trades falling
DRAW("#kl-ax", at(0, 0.0), 0.6);
const OD = [520,600,470,560,640,500,590,540,480,560,430,520,600,460,540,500];

DRAW("#kl-box", at(1, 0.08), 0.7); IN("#kl-1m", at(1, 0.12), 0.4);

OUT(".kl-di", at(1, 0.55), 0.5);
OUT("#kl-term", at(1, 0.58), 0.3);
IN("#kl-term2", at(1, 0.62), 0.5);
OUT(".kl-do", at(1, 0.8), 0.6);

OUT("#kl-box", at(2, 0.0), 0.4); OUT("#kl-1m", at(2, 0.0), 0.4);

// L3 turnover
OUT("#kl-term2", at(3, 0.0), 0.3);
IN("#kl-amt", at(3, 0.15), 0.5, { y: 15 }, { y: 0 });

// L4 formula
IN("#kl-fc", at(4, 0.1), 0.6, { x: 30 }, { x: 0 });
IN("#kl-stl", at(4, 0.2), 0.4);
IN("#kl-st0", at(4, 0.38), 0.4, { y: 15 }, { y: 0 });

// L5 example 10:00:03
OUT("#kl-v", at(5, 0.0)); OUT("#kl-lv", at(5, 0.0)); OUT("#kl-amt", at(5, 0.0));
IN("#kl-t0", at(5, 0.1), 0.3); IN("#kl-tl0", at(5, 0.1), 0.3);
