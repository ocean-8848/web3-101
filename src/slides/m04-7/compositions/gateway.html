    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const RED = "#FC6255", GRN = "#83C167", ORG = "#FF9F43", BLU = "#58C4DD", GLD = "#F0B90B", GRY = "#8a8f99", TXT = "#e8e6df", PUR = "#B48EF0";
      // 周期性脉冲（有限次数，结束回到原值）
      const PULSE = (s, t0, t1, p = 1.2, o = 0.4) => { const k = Math.max(1, Math.floor((t1 - t0) / p)); tl.to(s, { opacity: o, duration: p / 2, yoyo: true, repeat: 2 * k - 1, ease: "sine.inOut" }, t0); };
      const FLOW = (s, t0, t1, dx, dy, p = 1.0) => { const k = Math.max(1, Math.floor((t1 - t0) / p)); tl.fromTo(s, { x: 0, y: 0 }, { x: dx, y: dy, duration: p, repeat: k - 1, ease: "none", immediateRender: false }, t0); };
      const SWAP = (a, b, t, d = 0.35) => { OUT(a, t, d); IN(b, t + d, d + 0.1); };

      const QY = [400, 600, 800];
      // L0 网关实例大框
      DRAW("#ga-frame", at(0, 0.03), 1.4);
      IN("#ga-title", at(0, 0.18), 0.6);
      IN("#ga-cnt", at(0, 0.4), 0.6, { x: 20 }, { x: 0 });
      PULSE("#ga-cnt", at(0, 0.55), at(1, 0), 1.2, 0.5);
      // L1 订阅表
      IN("#ga-tab", at(1, 0.02), 0.5);
      IN("#ga-r0", at(1, 0.2), 0.5, { x: -20 }, { x: 0 });
      IN("#ga-r1", at(1, 0.42), 0.5, { x: -20 }, { x: 0 });
      IN("#ga-r2", at(1, 0.64), 0.5);
      PULSE("#ga-r0", at(1, 0.8), at(2, 0.05), 0.8, 0.5);
      // L2 总线消息 → 序列化一次 → 扇出到每个发送缓冲
      IN("#ga-busl", at(2, 0.02), 0.4); IN("#ga-msg", at(2, 0.02), 0.4);
      IN("#ga-ser", at(2, 0.04), 0.5);
      tl.fromTo("#ga-msgm", { x: 0 }, { x: 560, duration: 1.2, ease: "power2.inOut", immediateRender: false }, at(2, 0.08));
      OUT("#ga-msg", at(2, 0.08) + 1.0, 0.3);
      tl.to("#ga-serr", { fill: "rgba(88,196,221,0.25)", duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.2));
      DRAW("#ga-f0", at(2, 0.3), 0.6); DRAW("#ga-f1", at(2, 0.33), 0.6); DRAW("#ga-f2", at(2, 0.36), 0.6);
      IN("#ga-q0", at(2, 0.42), 0.5); IN("#ga-q1", at(2, 0.46), 0.5); IN("#ga-q2", at(2, 0.5), 0.5);
      [0, 1, 2].forEach(k => { IN(`#ga-fd${k}`, at(2, 0.56), 0.2); FLOW(`#ga-fd${k}`, at(2, 0.56), k < 2 ? at(5, 0.9) : at(5, 0.05), 174, QY[k] - 700, 0.9); });
      tl.to(["#ga-c00", "#ga-c10", "#ga-c20"], { fill: GRN, duration: 0.3 }, at(2, 0.62));
      IN("#ga-term", at(2, 0.7), 0.5);
      // L3 每连接一个有界缓冲；慢连接逐渐填满变橙
      tl.to(["#ga-c01", "#ga-c11"], { fill: GRN, duration: 0.3 }, at(3, 0.05));
      PULSE(["#ga-c00", "#ga-c01", "#ga-c10", "#ga-c11"], at(3, 0.1), at(5, 0.95), 0.9, 0.3);
      for (let i = 0; i < 8; i++) tl.to(`#ga-c2${i}`, { fill: ORG, duration: 0.25 }, at(3, 0.12 + i * 0.1));
      tl.to("#ga-qr2", { stroke: ORG, duration: 0.3 }, at(3, 0.9));
      OUT("#ga-term", at(3, 0.62), 0.4);
      // L4 背压：深度只留最新一帧，成交合并
      IN("#ga-term2", at(4, 0.04), 0.5);
      for (let i = 0; i < 7; i++) tl.to(`#ga-c2${i}`, { y: 40, opacity: 0, duration: 0.4, ease: "power2.in" }, at(4, 0.34 + i * 0.02));
      tl.to("#ga-c27", { fill: BLU, duration: 0.3 }, at(4, 0.42));
      IN("#ga-new", at(4, 0.45), 0.4); IN("#ga-bp1", at(4, 0.5), 0.5);
      IN("#ga-t0", at(4, 0.72), 0.3); IN("#ga-t1", at(4, 0.75), 0.3); IN("#ga-t2", at(4, 0.78), 0.3);
      tl.to("#ga-t0", { x: 42, opacity: 0, duration: 0.5 }, at(4, 0.86)); tl.to("#ga-t2", { x: -42, opacity: 0, duration: 0.5 }, at(4, 0.86));
      IN("#ga-bp2", at(4, 0.88), 0.4);
      OUT("#ga-term2", at(4, 0.62), 0.4);
      // L5 持续积压 → 断开 → 重连、重订阅、重同步
      OUT(["#ga-new", "#ga-bp1", "#ga-bp2", "#ga-tr"], at(5, 0), 0.3);
      tl.to("#ga-f2", { stroke: RED, duration: 0.2 }, at(5, 0.08)); tl.to("#ga-qr2", { stroke: RED, duration: 0.2 }, at(5, 0.08));
      OUT("#ga-fd2", at(5, 0.06), 0.2);
      IN("#ga-brk", at(5, 0.12), 0.25, { scale: 0.4, svgOrigin: "1207 750" }, { scale: 1, svgOrigin: "1207 750" });
      IN("#ga-cut", at(5, 0.16), 0.3);
      tl.to("#ga-q2", { opacity: 0.75, duration: 0.3 }, at(5, 0.32));
