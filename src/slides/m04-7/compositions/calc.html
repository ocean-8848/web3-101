        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const PULSE = (s, x1, y1, x2, y2, t, n, per = 1.0) => {
        tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, t);
        tl.fromTo(s, { attr: { cx: x1, cy: y1 } }, { attr: { cx: x2, cy: y2 }, duration: per, ease: "none", repeat: n - 1, immediateRender: false }, t);
        tl.to(s, { opacity: 0, duration: 0.01 }, t + per * n);
      };
      const TO = (s, v, t) => tl.to(s, v, t);

// L0 table rows
IN("#ca-tab", at(0, 0.05), 0.5);
for (let i = 0; i < 4; i++) IN(`#ca-r${i}`, at(0, 0.3 + i * 0.15), 0.4, { x: -20 }, { x: 0 });

for (let i = 0; i < 4; i++) {

// L5 turnover column
IN("#ca-amh", at(5, 0.02), 0.4);
for (let i = 0; i < 4; i++) { IN(`#ca-hl${i}`, at(5, 0.05 + i * 0.16), 0.25); IN(`#ca-a${i}`, at(5, 0.08 + i * 0.16), 0.4, { x: -15 }, { x: 0 }); OUT(`#ca-hl${i}`, at(5, 0.19 + i * 0.16), 0.25); }

IN("#ca-sum2", at(5, 0.82), 0.5, { y: 15 }, { y: 0 });
// L6 merge five 1m candles
OUT("#ca-left", at(6, 0.0), 0.5); OUT("#ca-chart", at(6, 0.0), 0.5);
for (let i = 0; i < 5; i++) IN(`#ca-s${i}`, at(6, 0.06 + i * 0.03), 0.4, { y: 20 }, { y: 0 });
IN("#ca-1m", at(6, 0.1), 0.4);
ARROW("#ca-marr", at(6, 0.24), 0.6); IN("#ca-mlab", at(6, 0.26), 0.4);
IN("#ca-big", at(6, 0.32), 0.6, { x: -30 }, { x: 0 }); IN("#ca-5m", at(6, 0.34), 0.4);
const HL = (i, t) => TO(`#ca-s${i}`, { opacity: 0.35, duration: 0.25, yoyo: true, repeat: 1 }, t);
