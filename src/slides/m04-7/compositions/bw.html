  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const RED = "#FC6255", GRN = "#83C167", ORG = "#FF9F43", BLU = "#58C4DD", GLD = "#F0B90B", GRY = "#8a8f99", TXT = "#e8e6df", PUR = "#B48EF0";
      // 周期性脉冲（有限次数，结束回到原值）
      const PULSE = (s, t0, t1, p = 1.2, o = 0.4) => { const k = Math.max(1, Math.floor((t1 - t0) / p)); tl.to(s, { opacity: o, duration: p / 2, yoyo: true, repeat: 2 * k - 1, ease: "sine.inOut" }, t0); };
      const FLOW = (s, t0, t1, dx, dy, p = 1.0) => { const k = Math.max(1, Math.floor((t1 - t0) / p)); tl.fromTo(s, { x: 0, y: 0 }, { x: dx, y: dy, duration: p, repeat: k - 1, ease: "none", immediateRender: false }, t0); };
      const SWAP = (a, b, t, d = 0.35) => { OUT(a, t, d); IN(b, t + d, d + 0.1); };

      // L0 标题：示例
      IN("#bw-title", at(0, 0.05), 0.6, { x: -30 }, { x: 0 });
      IN("#bw-tag", at(0, 0.45), 0.4, { scale: 1.4, svgOrigin: "655 132" }, { scale: 1, svgOrigin: "655 132" });
      PULSE("#bw-tag", at(0, 0.7), at(1, 0.1), 0.8, 0.5);
      // L1 四个输入卡
      [0.03, 0.3, 0.55, 0.8].forEach((f, i) => { IN(`#bw-c${i}`, at(1, f), 0.5, { y: 20 }, { y: 0 }); IN(`#bw-n${i}`, at(1, f), 0.5, { y: 20 }, { y: 0 }); });
      // L2 等式一
      tl.to(["#bw-cr0", "#bw-cr1", "#bw-cr2"], { stroke: GLD, duration: 0.3 }, at(2, 0.02));
      IN("#bw-e1a", at(2, 0.1), 0.5);
      IN("#bw-e1b", at(2, 0.55), 0.5, { x: -20 }, { x: 0 });
      tl.to(["#bw-cr0", "#bw-cr1", "#bw-cr2"], { stroke: GRY, duration: 0.3 }, at(2, 0.9));
      // L3 等式二
      tl.to("#bw-cr3", { stroke: GLD, duration: 0.3 }, at(3, 0.02));
      IN("#bw-e2a", at(3, 0.1), 0.5);
      IN("#bw-e2b", at(3, 0.5), 0.5, { x: -20 }, { x: 0 });
      tl.to("#bw-cr3", { stroke: GRY, duration: 0.3 }, at(3, 0.9));
      // L4 12 台填满 120 Gbps；再加 12 台余量
      DRAW("#bw-bar", at(4, 0.02), 0.8); IN("#bw-l0", at(4, 0.02), 0.4); IN("#bw-l1", at(4, 0.08), 0.4);
      for (let i = 0; i < 12; i++) IN(`#bw-x${i}`, at(4, 0.14 + i * 0.022), 0.25, { y: -20 }, { y: 0 });
      IN("#bw-l2", at(4, 0.44), 0.4);
      for (let i = 0; i < 12; i++) IN(`#bw-y${i}`, at(4, 0.6 + i * 0.015), 0.25);
      IN("#bw-l3", at(4, 0.78), 0.5);
      // L5 三个降本手段，每按一个带宽条缩短
      OUT(["#bw-eq", "#bw-srv"], at(5, 0), 0.4);
      IN("#bw-bl", at(5, 0.06), 0.4); IN("#bw-bf", at(5, 0.06), 0.4); IN("#bw-bg", at(5, 0.06), 0.4); IN("#bw-bn", at(5, 0.1), 0.4);
      const press = (i, t, w) => {
        IN(`#bw-k${i}`, t, 0.4, { y: 16 }, { y: 0 });
        tl.to(`#bw-kr${i}`, { fill: "rgba(88,196,221,0.3)", duration: 0.2 }, t + 0.5);
        tl.to(`#bw-bf`, { attr: { width: w }, duration: 0.7, ease: "power2.inOut" }, t + 0.6);
      };
      press(0, at(5, 0.12), 1150); press(1, at(5, 0.45), 850); press(2, at(5, 0.7), 620);
      // L6 小练习：换一组数
      OUT("#bw-cut", at(6, 0), 0.4);
      for (let i = 0; i < 4; i++) { OUT(`#bw-n${i}`, at(6, 0.04 + i * 0.05), 0.25); IN(`#bw-m${i}`, at(6, 0.06 + i * 0.05), 0.35); }
      IN("#bw-f1", at(6, 0.32), 0.5);
      IN("#bw-f2", at(6, 0.5), 0.5, { y: 16 }, { y: 0 });
      IN("#bw-f3", at(6, 0.68), 0.5);
      IN("#bw-f4", at(6, 0.82), 0.5);
      PULSE("#bw-f4", at(6, 0.9), C.d - 0.6, 0.9, 0.55);


      tl.to("#bw-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["bw"] = tl;
    })();
