  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const ROW = (n, t0, ts) => {
        tl.to(`#ty-p${n}`, { opacity: 1, duration: 0.01 }, t0);
        tl.to(`#ty-p${n} text, #ty-p${n}`, { fill: "#e8e6df", duration: 0.4 }, t0);
        IN(`#ty-t${n}`, ts[0], 0.5);
        IN(`#ty-s${n}`, ts[1], 0.6);
        IN(`#ty-sp${n}`, ts[2], 0.6);
        IN(`#ty-v${n}`, ts[3], 0.5);
        IN(`#ty-b${n}`, ts[4], 0.5);
      };
      const HL = (y, t) => tl.to("#ty-hl", { attr: { y }, duration: 0.5, ease: "power2.inOut" }, t);
      const DIM = (n, t, o = 0.35) => tl.to(`#ty-row${n}`, { opacity: o, duration: 0.4 }, t);
      // L0 表头与五个前缀（灰）
      IN("#ty-head", at(0, 0.0), 0.6);
      IN("#ty-hbip", at(0, 0.0), 0.6);
      [1, 2, 3, 4, 5].forEach((n, i) => IN(`#ty-p${n}`, at(0, 0.3 + i * 0.12), 0.5, { x: -20 }, { x: 0 }));
      // L1 P2PKH
      IN("#ty-hl", at(1, 0.0), 0.4);
      ROW(1, at(1, 0.0), [at(1, 0.05), at(1, 0.2), at(1, 0.5), at(1, 0.72), at(1, 0.85)]);
      // L2 P2SH
      HL(420, at(2, 0.0)); DIM(1, at(2, 0.0));
      ROW(2, at(2, 0.0), [at(2, 0.05), at(2, 0.18), at(2, 0.45), at(2, 0.72), at(2, 0.85)]);
      // L3 P2WPKH / P2WSH
      HL(550, at(3, 0.0)); DIM(2, at(3, 0.0));
      ROW(3, at(3, 0.0), [at(3, 0.04), at(3, 0.14), at(3, 0.24), at(3, 0.34), at(3, 0.42)]);
      HL(680, at(3, 0.56)); DIM(3, at(3, 0.56));
      ROW(4, at(3, 0.56), [at(3, 0.6), at(3, 0.72), at(3, 0.84), at(3, 0.9), at(3, 0.94)]);
      // L4 P2TR
      HL(810, at(4, 0.0)); DIM(4, at(4, 0.0));
      ROW(5, at(4, 0.0), [at(4, 0.05), at(4, 0.22), at(4, 0.55), at(4, 0.78), at(4, 0.88)]);
      // L5 输出体积：BIP 列换成输出 vB 条
      OUT("#ty-hl", at(5, 0.0));
      OUT("#ty-hbip, #ty-b1, #ty-b2, #ty-b3, #ty-b4, #ty-b5", at(5, 0.0), 0.4);
      DIM(1, at(5, 0.02), 1); DIM(3, at(5, 0.02), 1); DIM(5, at(5, 0.02), 1);
      IN("#ty-hout", at(5, 0.08), 0.5);
      [[1, 34], [3, 31], [5, 43]].forEach(([n, v], i) => {
        tl.fromTo(`#ty-ob${n}`, { attr: { width: 0 } }, { attr: { width: v / 43 * 150 }, duration: 0.6, ease: "power2.out", immediateRender: false }, at(5, 0.15 + i * 0.2));
        IN(`#ty-on${n}`, at(5, 0.22 + i * 0.2), 0.4);
      });
      IN("#ty-foot", at(5, 0.78), 0.6);
      // L6 vB 术语卡 + 打折示意
      IN("#ty-term", at(6, 0.0), 0.5);
      OUT("#ty-tbl", at(6, 0.08), 0.5);
      IN("#ty-x1", at(6, 0.16), 0.5); IN("#ty-x1t", at(6, 0.18), 0.5);
      IN("#ty-x2", at(6, 0.2), 0.5); IN("#ty-x2t", at(6, 0.22), 0.5);
      IN("#ty-x2d", at(6, 0.3), 0.4);
      tl.to("#ty-x2", { attr: { width: 150 }, duration: 0.8, ease: "power2.inOut" }, at(6, 0.36));
      tl.to("#ty-x2t", { attr: { x: 1055 }, duration: 0.8, ease: "power2.inOut" }, at(6, 0.36));
      tl.to("#ty-x2d", { attr: { x: 1055 }, duration: 0.8, ease: "power2.inOut" }, at(6, 0.36));
      DRAW("#ty-brace", at(6, 0.48), 0.6);
      IN("#ty-xv", at(6, 0.52), 0.5);
      IN("#ty-next", at(6, 0.72), 0.6, { y: 20 }, { y: 0 });
      OUT("#ty-term", at(6, 0.0) + 7.5, 0.4);


      tl.to("#ty-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ty-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["types"] = tl;
    })();
  </script>
