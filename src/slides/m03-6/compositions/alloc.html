    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
const PULSE = (s, t, o, k = 1.06) => tl.to(s, { scale: k, svgOrigin: o, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);

const ATTR = (s, t, v, d = 0.4) => tl.to(s, { attr: v, duration: d, ease: "power2.out" }, t);
const XF = (a, b, t, d = 0.25) => { tl.to(a, { opacity: 0, duration: d }, t); tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: d, immediateRender: false }, t + d + 0.02); };
const CELLC = (pre, k, t, color, fo = 0.15, dash = "none") => ATTR(`#${pre}cr${k}`, t, { stroke: color, fill: color, "fill-opacity": fo, "stroke-dasharray": dash });
const ST = (pre, k, a, b, t) => XF(`#${pre}cs${k}_${a}`, `#${pre}cs${k}_${b}`, t);

const M = (id, t, d = 0.6) => { ARROW(`#al-${id}`, t, d); IN(`#al-${id}l`, t + d * 0.6, 0.35); };
// L0 lanes
for (let i = 0; i < 5; i++) { IN(`#al-hd${i}`, at(0, 0.08) + i * 0.15, 0.4, { y: -12 }, { y: 0 }); DRAW(`#al-ln${i}`, at(0, 0.12) + i * 0.15, 1.0); }

// L1 lock
IN("#al-term", at(1, 0.02), 0.5);
IN("#al-zone, #al-zl", at(1, 0.08), 0.5);
M("m1", at(1, 0.18));
IN("#al-lock", at(1, 0.42), 0.4, { scale: 0.6, svgOrigin: "675 362" }, { scale: 1, svgOrigin: "675 362" });

tl.fromTo("#al-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: 5, ease: "none", immediateRender: false }, at(1, 0.5));
M("m2", at(1, 0.6));
PULSE("#al-lock", at(1, 0.85), "675 362", 1.12);
// L2 transaction + code
OUT("#al-term", at(2, 0.0), 0.3);
tl.to("#al-ln3, #al-ln4", { opacity: 0, duration: 0.4 }, at(2, 0.02));
tl.to("#al-hd3, #al-hd4", { opacity: 0.3, duration: 0.4 }, at(2, 0.02));
