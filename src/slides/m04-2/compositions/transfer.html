      // L0 划转
      IN("#tr-a", at(0, 0.05)); IN("#tr-b", at(0, 0.18));

      IN("#tr-mm", at(4, 0.4)); IN("#tr-mml", at(4, 0.44));
      IN("#tr-rule", at(4, 0.66), 0.6, { y: 20 }, { y: 0 });
      PULSE("#tr-rule", at(4, 0.88), 460, 680, 1.05);
      // L5 保留 6,000，可划 4,000
      IN("#tr-f1a", at(5, 0.03)); IN("#tr-f1b", at(5, 0.09));
      OUT("#tr-mml", at(5, 0.28), 0.25);
      tl.to("#tr-mm", { attr: { width: 504 }, duration: 0.7, ease: "power2.inOut" }, at(5, 0.3));
      IN("#tr-lk", at(5, 0.36)); IN("#tr-kl", at(5, 0.4));
      IN("#tr-f2a", at(5, 0.52)); IN("#tr-f2b", at(5, 0.58));
      IN("#tr-ok", at(5, 0.72)); IN("#tr-ol", at(5, 0.76));
      PULSE("#tr-f2b", at(5, 0.92), 1520, 420, 1.05);
      // L6 申请 5,000 被拒；改 4,000 成功

      IN("#tr-edge", at(6, 0.17), 0.2); tl.to("#tr-edge", { opacity: 0.2, duration: 0.15, yoyo: true, repeat: 3 }, at(6, 0.19));
      POP("#tr-x", at(6, 0.24), 1056, 378); IN("#tr-xl", at(6, 0.26));
