      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      // ===== 测验版式（同 EP009 quiz1）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q5-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q5-q", at(0, 0.03), 0.01);
      tl.fromTo("#q5-qcr1", { attr: { width: 0 } }, { attr: { width: 1222 }, duration: 2.84, ease: "none" }, at(0, 0.04));
      tl.fromTo("#q5-qcr2", { attr: { width: 0 } }, { attr: { width: 550 }, duration: 1.24, ease: "none" }, at(0, 0.04) + 2.84);
      // L1 选项：念到时滑入并提亮描边；下划线随朗读推进
      const UW = {"A": 480, "B": 416, "C": 390, "D": 480};
      const SHOW = (k, t, t2) => {
        IN(`#q5-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q5-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.fromTo(`#q5-o${k}-u`, { attr: { width: 0 } }, { attr: { width: UW[k] }, duration: Math.max(0.6, t2 - t - 0.5), ease: "none" }, t + 0.2);
        tl.to(`#q5-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t2);
        OUT(`#q5-o${k}-u`, t2, 0.3);
      };
      SHOW("A", at(1, 0.0), at(1, 0.231));
      SHOW("B", at(1, 0.231), at(1, 0.436));
      SHOW("C", at(1, 0.436), at(1, 0.769));
      SHOW("D", at(1, 0.769), at(1, 1.0));
      // L2 暂停：倒数圆环到 L3 开头
      IN("#q5-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q5-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#q5-pause", at(3, 0.0), 0.3);
      const RIGHT = (k, t) => {
        tl.to(`#q5-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q5-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q5-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q5-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q5-o${k}-n`, t + 0.3, 0.5);
      };

      // L0 天平：资产（地址签名）重；下方账本借贷平衡
      IN("#q5-bal, #q5-bal2", at(0, 0.18), 0.7, { y: 20 }, { y: 0 });
      IN("#q5-led", at(0, 0.62), 0.6, { y: 20 }, { y: 0 });
      IN("#q5-br", at(0, 0.3), 0.5, { y: 10 }, { y: 0 });
      IN("#q5-bl", at(0, 0.45), 0.5, { y: 10 }, { y: 0 });
      tl.to("#q5-led", { y: -6, duration: 0.3, yoyo: true, repeat: 1 }, at(0, 0.8));
      tl.to("#q5-led line", { stroke: "#83C167", duration: 0.4 }, at(0, 0.88));

      // L3 揭晓 C：大户叶子被抽走，根变小；资产里混着借来的，背后是表外负债
      RIGHT("C", at(3, 0.02));
      OUT("#q5-bal, #q5-bal2, #q5-bl, #q5-br, #q5-led", at(3, 0.08), 0.4);
