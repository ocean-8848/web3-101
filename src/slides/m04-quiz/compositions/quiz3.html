    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      // ===== 测验版式（同 EP009 quiz1）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q3-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q3-q", at(0, 0.03), 0.01);
      tl.fromTo("#q3-qcr1", { attr: { width: 0 } }, { attr: { width: 910 }, duration: 2.1, ease: "none" }, at(0, 0.04));
      tl.fromTo("#q3-qcr2", { attr: { width: 0 } }, { attr: { width: 1142 }, duration: 2.65, ease: "none" }, at(0, 0.04) + 2.1);
      // L1 选项：念到时滑入并提亮描边；下划线随朗读推进
      const UW = {"A": 608, "B": 480, "C": 448, "D": 352};
      const SHOW = (k, t, t2) => {
        IN(`#q3-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q3-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.fromTo(`#q3-o${k}-u`, { attr: { width: 0 } }, { attr: { width: UW[k] }, duration: Math.max(0.6, t2 - t - 0.5), ease: "none" }, t + 0.2);
        tl.to(`#q3-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t2);
        OUT(`#q3-o${k}-u`, t2, 0.3);
      };
      SHOW("A", at(1, 0.0), at(1, 0.338));
      SHOW("B", at(1, 0.338), at(1, 0.581));
      SHOW("C", at(1, 0.581), at(1, 0.811));
      SHOW("D", at(1, 0.811), at(1, 1.0));
      // L2 暂停：倒数圆环到 L3 开头
      IN("#q3-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q3-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#q3-pause", at(3, 0.0), 0.3);
      const RIGHT = (k, t) => {
        tl.to(`#q3-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q3-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q3-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q3-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q3-o${k}-n`, t + 0.3, 0.5);
      };

      // L0 示意区：Kafka 重复投递 → 结算服务 → 账本唯一约束冲突
      IN("#q3-svc", at(0, 0.08), 0.5, { x: 20 }, { x: 0 });
      IN("#q3-kf", at(0, 0.15), 0.5, { y: -10 }, { y: 0 });
      IN("#q3-ptr", at(0, 0.19), 0.4, { y: 10 }, { y: 0 });
      IN("#q3-msg", at(0, 0.23), 0.6, { y: -30 }, { y: 0 });
      ARROW("#q3-a1", at(0, 0.29), 0.5);
      IN("#q3-twice", at(0, 0.33), 0.4, { scale: 1.4, svgOrigin: "1295 600" }, { scale: 1, svgOrigin: "1295 600" });
      ARROW("#q3-a2", at(0, 0.46), 0.5);
      IN("#q3-tb", at(0, 0.49), 0.6, { y: 20 }, { y: 0 });
      IN("#q3-bal", at(0, 0.57), 0.5);
      IN("#q3-cf", at(0, 0.74), 0.4, { scale: 1.04, svgOrigin: "1510 736" }, { scale: 1, svgOrigin: "1510 736" });
      IN("#q3-cfl", at(0, 0.77), 0.4);
      tl.to("#q3-cf", { strokeWidth: 7, duration: 0.25, yoyo: true, repeat: 1 }, at(0, 0.9));

      // L3 揭晓 A：冲突 = 已记过；余额不动；位点前进一格
      RIGHT("A", at(3, 0.02));
      OUT("#q3-cfl", at(3, 0.18), 0.3);
      tl.to("#q3-cf", { stroke: "#83C167", duration: 0.4 }, at(3, 0.22));
      IN("#q3-okl", at(3, 0.3), 0.4);
      tl.to("#q3-balb", { attr: { height: 36, y: 864 }, duration: 0.25, yoyo: true, repeat: 1 }, at(3, 0.5));
      tl.to("#q3-ptr", { x: 80, duration: 0.6, ease: "power2.inOut" }, at(3, 0.62));
      tl.to("#q3-msgb", { stroke: "#8a8f99", duration: 0.4 }, at(3, 0.8));

      // L4 干扰项
      WRONG("B", at(4, 0.02));
      tl.to("#q3-msgb", { stroke: "#F0B90B", duration: 0.4 }, at(4, 0.2));
      WRONG("C", at(4, 0.377));
