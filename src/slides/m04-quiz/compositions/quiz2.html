  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // ===== 测验版式（照 EP009 quiz1）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      const SHOW = (k, t) => {
        IN(`#q2-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q2-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q2-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const RIGHT = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q2-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q2-o${k}-n`, t + 0.3, 0.5);
      };
      const PING = (s, t, o) => tl.to(s, { scale: 1.35, svgOrigin: o, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);

      // L0 题干 + 订单簿两档；限价虚线
      IN("#q2-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q2-calc", at(0, 0.04), 0.4, { x: -10 }, { x: 0 });
      IN("#q2-q1", at(0, 0.08), 0.01);
      tl.fromTo("#q2-qcr1", { attr: { width: 0 } }, { attr: { width: 900 }, duration: 3.6, ease: "none" }, at(0, 0.08));
      IN("#q2-ask1", at(0, 0.12), 0.4, { x: 16 }, { x: 0 });
      IN("#q2-s1a", at(0, 0.16), 0.3, { y: -10 }, { y: 0 }); IN("#q2-s1b", at(0, 0.19), 0.3, { y: -10 }, { y: 0 });
      IN("#q2-ask2", at(0, 0.28), 0.4, { x: 16 }, { x: 0 });
      IN("#q2-q2", at(0, 0.44), 0.01);
      tl.fromTo("#q2-qcr2", { attr: { width: 0 } }, { attr: { width: 1300 }, duration: 5.0, ease: "none" }, at(0, 0.44));
      IN("#q2-g0", at(0, 0.55), 0.3, { y: 16 }, { y: 0 }); IN("#q2-g1", at(0, 0.58), 0.3, { y: 16 }, { y: 0 }); IN("#q2-g2", at(0, 0.61), 0.3, { y: 16 }, { y: 0 });
      IN("#q2-buyl", at(0, 0.6), 0.4);
      IN("#q2-lim", at(0, 0.7), 0.5, { x: -30 }, { x: 0 });
      IN("#q2-liml", at(0, 0.73), 0.4);
      tl.to("#q2-g0, #q2-g1, #q2-g2", { y: -8, duration: 0.2, yoyo: true, repeat: 1, stagger: 0.12 }, at(0, 0.84));

      // L1 选项
      SHOW("A", at(1, 0.0));
      SHOW("B", at(1, 0.22));
      SHOW("C", at(1, 0.38));
      tl.to("#q2-s1a, #q2-s1b", { fillOpacity: 0.6, duration: 0.25, yoyo: true, repeat: 1 }, at(1, 0.5));
      SHOW("D", at(1, 0.68));
      tl.to("#q2-lim", { strokeWidth: 6, duration: 0.25, yoyo: true, repeat: 1 }, at(1, 0.9));

      // L2 暂停
      IN("#q2-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q2-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#q2-pause", at(3, 0.0), 0.3);

      // L3 揭晓 C：吃掉卖一 2 个；第 3 个碰到限价停住，碎成灰点
      RIGHT("C", at(3, 0.02));
      tl.to("#q2-lim", { strokeWidth: 6, duration: 0.25, yoyo: true, repeat: 1 }, at(3, 0.1));
      tl.to("#q2-g0, #q2-g1", { y: -165, duration: 0.7, ease: "power2.inOut", stagger: 0.1 }, at(3, 0.18));
      tl.to("#q2-g0, #q2-g1, #q2-s1a, #q2-s1b", { opacity: 0, duration: 0.4 }, at(3, 0.32));
      OUT("#q2-buyl", at(3, 0.32), 0.3);
      IN("#q2-fill", at(3, 0.36), 0.4);
      tl.to("#q2-ask2", { opacity: 0.4, duration: 0.4 }, at(3, 0.5));
      tl.to("#q2-s2a, #q2-s2b, #q2-s2c", { stroke: "#FC6255", duration: 0.3 }, at(3, 0.5));
      tl.to("#q2-g2", { y: -230, duration: 0.8, ease: "power2.out" }, at(3, 0.6));
      tl.to("#q2-g2", { y: -222, duration: 0.15, yoyo: true, repeat: 1 }, at(3, 0.6) + 0.8);
      tl.to("#q2-g2", { opacity: 0, duration: 0.2 }, at(3, 0.82));
      [[-40, -30], [40, -36], [-50, 20], [46, 26], [0, 44]].forEach(([dx, dy], j) => {
        tl.fromTo(`#q2-p${j}`, { opacity: 1, x: 0, y: 0 }, { x: dx, y: dy, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, at(3, 0.82));

      IN("#q2-cxl", at(3, 0.86), 0.4);

      // L4 干扰项
      WRONG("A", at(4, 0.02));
      WRONG("B", at(4, 0.22));
      WRONG("D", at(4, 0.6));
      tl.to("#q2-g2", { opacity: 0.45, duration: 0.4 }, at(4, 0.8));
      tl.to("#q2-g2", { y: -236, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.88));

      // L5 订单类型 vs 有效期
      OUT("#q2-oA, #q2-oB, #q2-oD", at(5, 0.0), 0.4);
      OUT("#q2-panel", at(5, 0.0), 0.4);
      IN("#q2-row1", at(5, 0.12), 0.5, { x: -20 }, { x: 0 });
      IN("#q2-row2", at(5, 0.5), 0.5, { x: -20 }, { x: 0 });
      IN("#q2-tg0", at(5, 0.62), 0.3, { y: 10 }, { y: 0 });
      IN("#q2-tg1", at(5, 0.68), 0.3, { y: 10 }, { y: 0 });
      IN("#q2-tg2", at(5, 0.74), 0.3, { y: 10 }, { y: 0 });
      tl.to("#q2-tg1r", { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, at(5, 0.82));

      tl.to("#q2-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz2"] = tl;
    })();
