      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      // ===== 测验版式（同 EP009 quiz1）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q4-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });

      tl.fromTo("#q4-qcr2", { attr: { width: 0 } }, { attr: { width: 950 }, duration: 2.19, ease: "none" }, at(0, 0.04) + 2.99);
      // L1 选项：念到时滑入并提亮描边；下划线随朗读推进
      const UW = {"A": 499, "B": 531, "C": 704, "D": 448};
      const SHOW = (k, t, t2) => {
        IN(`#q4-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q4-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.fromTo(`#q4-o${k}-u`, { attr: { width: 0 } }, { attr: { width: UW[k] }, duration: Math.max(0.6, t2 - t - 0.5), ease: "none" }, t + 0.2);
        tl.to(`#q4-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t2);
        OUT(`#q4-o${k}-u`, t2, 0.3);
      };
      SHOW("A", at(1, 0.0), at(1, 0.241));
      SHOW("B", at(1, 0.241), at(1, 0.471));
      SHOW("C", at(1, 0.471), at(1, 0.805));
      SHOW("D", at(1, 0.805), at(1, 1.0));
      // L2 暂停：倒数圆环到 L3 开头
      IN("#q4-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q4-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));

      const RIGHT = (k, t) => {

      };
      const WRONG = (k, t) => {
        tl.to(`#q4-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q4-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q4-o${k}-n`, t + 0.3, 0.5);
      };

      // L0 代币卡（USDT）翻面露出合约地址；已上架列表里没有它

      tl.to("#q4-cards", { scale: 0.45, svgOrigin: "1330 470", duration: 0.6, ease: "power2.inOut" }, at(3, 0.68));
      tl.to("#q4-cardm", { x: 20, y: 320, duration: 0.6, ease: "power2.inOut" }, at(3, 0.68));

      // L4 干扰项；D 时示意区换成“假币进场 → 换真币 → 提币才拦”

      ARROW("#q4-d4", at(4, 0.591 + 0.24), 0.4);
      IN("#q4-d5", at(4, 0.591 + 0.26), 0.4);
      tl.to("#q4-d5b", { stroke: "#FF9F43", strokeWidth: 5, duration: 0.3 }, at(4, 0.87));
      IN("#q4-d6", at(4, 0.86), 0.4);
