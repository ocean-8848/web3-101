    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const PULSE = (s, t, o, k = 1.08) => tl.to(s, { scale: k, svgOrigin: o, duration: 0.45, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const BLINK = (s, t, lo = 0.35) => tl.to(s, { opacity: lo, duration: 0.6, yoyo: true, repeat: 1 }, t);
      // L0 read reserves, quote
      IN("#px-title", at(0, 0.0), 0.5, { y: -15 }, { y: 0 });
      ["#px-ln1", "#px-ln2", "#px-ln3", "#px-ln4", "#px-ln5"].forEach((s, k) => IN(s, at(0, 0.05 + k * 0.06), 0.4));
      ARROW("#px-a1", at(0, 0.38), 0.7);
      IN("#px-t1", at(0, 0.4), 0.4);
      IN("#px-calc", at(0, 0.55), 0.4);
      BLINK("#px-calc", at(0, 0.64), 0.4);
      IN("#px-a2", at(0, 0.74), 0.5, { x: 30 }, { x: 0 });
      IN("#px-t2a", at(0, 0.77), 0.4);
      IN("#px-t2b", at(0, 0.88), 0.4);
      // L1 sign, broadcast, mempool
      ARROW("#px-a3", at(1, 0.03), 0.5);
      IN("#px-t3", at(1, 0.06), 0.3);
      IN("#px-seal", at(1, 0.15), 0.3, { scale: 1.6, svgOrigin: "478 626" }, { scale: 1, svgOrigin: "478 626" });
      ARROW("#px-a4", at(1, 0.38), 0.4);
      IN("#px-t4", at(1, 0.4), 0.3);
      IN("#px-pool", at(1, 0.58), 0.4);
      IN("#px-tx", at(1, 0.7), 0.3);
      tl.to("#px-txr", { attr: { "fill-opacity": 0.5 }, duration: 0.6, yoyo: true, repeat: 5, ease: "sine.inOut" }, at(1, 0.8));
      // L2 execute in same tx
      ARROW("#px-a5", at(2, 0.04), 0.6);
      IN("#px-t5", at(2, 0.08), 0.4);
      ARROW("#px-a6", at(2, 0.3), 0.9);
      IN("#px-t6", at(2, 0.36), 0.4);
      IN("#px-cap", at(2, 0.55), 0.5);
      IN("#px-capt", at(2, 0.6), 0.4);
      IN("#px-nowd", at(2, 0.8), 0.4);
      // L3 rollback
      tl.to("#px-cap", { attr: { stroke: "#FC6255", fill: "#FC6255" }, duration: 0.4 }, at(3, 0.08));
      OUT("#px-capt", at(3, 0.1), 0.25);
      IN("#px-capr", at(3, 0.15), 0.35);
      tl.to(["#px-a6", "#px-t6"], { opacity: 0.25, duration: 0.4 }, at(3, 0.15));
      IN("#px-usdci", at(3, 0.32), 0.5, { x: 80 }, { x: 0 });
      IN("#px-ok", at(3, 0.45), 0.4);
      IN("#px-gas", at(3, 0.64), 0.4, { y: 10 }, { y: 0 });
      BLINK("#px-gas", at(3, 0.82), 0.4);
      // L4 quote can expire
      OUT(["#px-capr", "#px-usdci", "#px-ok", "#px-gas", "#px-nowd"], at(4, 0.0), 0.4);
      tl.to("#px-cap", { attr: { stroke: "#58C4DD", fill: "#58C4DD" }, duration: 0.4 }, at(4, 0.0));
      tl.to(["#px-a6", "#px-t6"], { opacity: 1, duration: 0.4 }, at(4, 0.0));
      IN("#px-capt", at(4, 0.04), 0.4);
      IN("#px-k1", at(4, 0.08), 0.4);
      ARROW("#px-kax", at(4, 0.1), 0.8);
      IN("#px-k2", at(4, 0.18), 0.4);
      IN("#px-rb1", at(4, 0.26), 0.4);
      IN("#px-rb2", at(4, 0.26), 0.4);
      IN("#px-rbt", at(4, 0.3), 0.4);
      tl.to("#px-rb1", { attr: { y: 700, height: 100 }, duration: 0.8, ease: "power2.inOut" }, at(4, 0.42));
      tl.to("#px-rb2", { attr: { y: 660, height: 140 }, duration: 0.8, ease: "power2.inOut" }, at(4, 0.42));
      { const el = document.querySelector("#px-qn"); const o = { v: 0 };
        tl.fromTo(o, { v: 0 }, { v: 1, duration: 2.0, ease: "none", immediateRender: false,
          onUpdate: () => { const q = [3012, 3014, 3011, 3016, 3013, 3012][Math.min(5, Math.floor(o.v * 6))]; el.textContent = String(q); } }, at(4, 0.45)); }
      IN("#px-exp", at(4, 0.58), 0.4);
      IN("#px-demo", at(4, 0.62), 0.4);
      BLINK("#px-t2a", at(4, 0.8), 0.4);
      // L5 sandwich + private channel
      OUT(["#px-k1", "#px-kax", "#px-k2", "#px-rb1", "#px-rb2", "#px-rbt", "#px-exp"], at(5, 0.0), 0.4);
      IN("#px-sw1", at(5, 0.1), 0.35, { x: -20 }, { x: 0 });
      IN("#px-sw2", at(5, 0.16), 0.35, { x: 20 }, { x: 0 });
      IN("#px-swt", at(5, 0.24), 0.4);
      tl.to("#px-txr", { attr: { stroke: "#FC6255" }, duration: 0.3 }, at(5, 0.3));
      ARROW("#px-priv", at(5, 0.5), 0.8);
      IN("#px-privt", at(5, 0.58), 0.4);
      OUT(["#px-sw1", "#px-sw2", "#px-swt"], at(5, 0.74), 0.4);
      tl.to("#px-txr", { attr: { stroke: "#83C167" }, duration: 0.3 }, at(5, 0.76));
      BLINK("#px-priv", at(5, 0.88), 0.4);


      tl.to("#px-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#px-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["pathdex"] = tl;
    })();
