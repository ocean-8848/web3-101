      IN("#s2-quote", at(1, 0.33), 0.4);
      IN("#s2-min", at(1, 0.37), 0.4);

      IN("#s2-dot", at(1, 0.45), 0.3);

      IN("#s2-term2", at(1, 0.67), 0.5);

      IN("#s2-brt", at(1, 0.75), 0.4);
      BLINK("#s2-brt", at(1, 0.9), 0.4);
      // L2 row 5
      OUT(["#s2-ax", "#s2-quote", "#s2-min", "#s2-dot", "#s2-rb", "#s2-hg", "#s2-br", "#s2-brt", "#s2-term2"], at(2, 0.0), 0.4);
      DIM(4, at(2, 0.0));
      LIT(5, at(2, 0.03));
      ["#s2-fl1", "#s2-fl2", "#s2-fl3", "#s2-fl4"].forEach((s, k) => IN(s, at(2, 0.12 + k * 0.08), 0.35, { y: 10 }, { y: 0 }));

      BLINK("#s2-l6", at(3, 0.2), 0.4);

      BLINK("#s2-wd", at(3, 0.48), 0.4);
      IN("#s2-r6", at(3, 0.6), 0.5, { x: -15 }, { x: 0 });
      BLINK("#s2-r6", at(3, 0.86), 0.4);
      // L4 row 7

      DIM(6, at(4, 0.0));
      LIT(7, at(4, 0.03));
      IN("#s2-l7", at(4, 0.1), 0.5, { x: 15 }, { x: 0 });
      BLINK("#s2-l7", at(4, 0.27), 0.4);

      IN("#s2-r7b", at(4, 0.6), 0.5, { x: -15 }, { x: 0 });
