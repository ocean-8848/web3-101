      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const PULSE = (s, t, o, k = 1.08) => tl.to(s, { scale: k, svgOrigin: o, duration: 0.45, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const BLINK = (s, t, lo = 0.35) => tl.to(s, { opacity: lo, duration: 0.6, yoyo: true, repeat: 1 }, t);
      // L0 lanes
      IN("#pa-title", at(0, 0.0), 0.5, { y: -15 }, { y: 0 });
      IN("#pa-ln1", at(0, 0.12), 0.4);
      IN("#pa-bg", at(0, 0.25), 0.6);
      IN("#pa-bgt", at(0, 0.3), 0.4);
      ["#pa-ln2", "#pa-ln3", "#pa-ln4", "#pa-ln5"].forEach((s, k) => IN(s, at(0, 0.35 + k * 0.12), 0.4));
      // L1 order + freeze + into book
      ARROW("#pa-a1", at(1, 0.05), 0.6);
      IN("#pa-t1", at(1, 0.2), 0.5, { y: 10 }, { y: 0 });
      PULSE("#pa-ln2", at(1, 0.32), "600 300", 1.1);
      ARROW("#pa-a2", at(1, 0.42), 0.7);
      IN("#pa-t2a", at(1, 0.45), 0.4);
      IN("#pa-t2b", at(1, 0.5), 0.4);
      IN("#pa-bar", at(1, 0.58), 0.4);
      IN("#pa-barU", at(1, 0.6), 0.4);
      PULSE("#pa-bar", at(1, 0.7), "1400 505", 1.06);
      ARROW("#pa-a3", at(1, 0.86), 0.5);
      IN("#pa-t3", at(1, 0.88), 0.4);
      // L2 match

      ARROW("#pa-a4", at(2, 0.28), 0.6);
      IN("#pa-t4", at(2, 0.32), 0.4);
      OUT(["#pa-barU", "#pa-lock"], at(2, 0.6), 0.3);
      IN("#pa-barE", at(2, 0.66), 0.4);
      PULSE("#pa-bar", at(2, 0.8), "1400 505", 1.06);
      // L3 balance only = claim
      IN("#pa-a5", at(3, 0.04), 0.5, { x: 30 }, { x: 0 });
      IN("#pa-t5", at(3, 0.1), 0.4);
      IN("#pa-debt", at(3, 0.2), 0.5);
      IN("#pa-debtt", at(3, 0.26), 0.4);
      IN("#pa-frm", at(3, 0.45), 0.6);
      IN("#pa-frmt", at(3, 0.52), 0.4);
      BLINK("#pa-frm", at(3, 0.66), 0.3);
      PULSE("#pa-debtc", at(3, 0.82), "170 770", 1.15);
      // L4 withdraw on-chain
      ARROW("#pa-a6", at(4, 0.04), 0.5);
      IN("#pa-t6", at(4, 0.08), 0.4);
      ARROW("#pa-a7", at(4, 0.3), 0.8);
      IN("#pa-t7", at(4, 0.36), 0.4);
      IN("#pa-wal", at(4, 0.5), 0.4);
      OUT("#pa-debtt", at(4, 0.6), 0.3);
      tl.to("#pa-debtc", { attr: { "fill-opacity": 1, stroke: "#F0B90B" }, strokeDasharray: "none", duration: 0.4 }, at(4, 0.6));
      tl.to("#pa-debt", { y: 175, duration: 0.7, ease: "power2.inOut" }, at(4, 0.62));
      // L5 stuck + failure
      OUT("#pa-t7", at(5, 0.0), 0.3);
      OUT("#pa-debt", at(5, 0.0), 0.3);
      tl.set("#pa-debt", { y: 0 }, at(5, 0.04));
      tl.set("#pa-debtc", { attr: { "fill-opacity": 0.15, stroke: "#FF9F43" }, strokeDasharray: "7 5" }, at(5, 0.04));
      IN("#pa-debt", at(5, 0.06), 0.4);
      IN("#pa-debtt", at(5, 0.06), 0.4);
      IN("#pa-mv", at(5, 0.04), 0.3);
      tl.to("#pa-mv", { x: -60, duration: 0.5, ease: "power1.out" }, at(5, 0.07));
      IN("#pa-o1", at(5, 0.12), 0.4, { y: -10 }, { y: 0 });
      IN("#pa-o2", at(5, 0.2), 0.4, { y: -10 }, { y: 0 });
      IN("#pa-o3", at(5, 0.28), 0.4, { y: -10 }, { y: 0 });
      tl.to("#pa-mv", { x: -50, duration: 0.15, yoyo: true, repeat: 3 }, at(5, 0.36));
      tl.to("#pa-bg", { attr: { fill: "#FC6255", stroke: "#FC6255" }, fillOpacity: 0.16, duration: 0.4, yoyo: true, repeat: 1 }, at(5, 0.5));
      IN("#pa-f1", at(5, 0.56), 0.35, { y: 10 }, { y: 0 });
      IN("#pa-f2", at(5, 0.63), 0.35, { y: 10 }, { y: 0 });
      IN("#pa-f3", at(5, 0.7), 0.35, { y: 10 }, { y: 0 });
      tl.to("#pa-debtc", { attr: { stroke: "#FC6255", fill: "#FC6255" }, duration: 0.3 }, at(5, 0.8));
      DRAW("#pa-crack", at(5, 0.82), 0.4);
      tl.set("#pa-crack", { opacity: 1 }, at(5, 0.82));
      tl.to("#pa-debtt", { fill: "#FC6255", duration: 0.3 }, at(5, 0.82));
      // L6 FTX card
      OUT(["#pa-a7", "#pa-mv", "#pa-o1", "#pa-o2", "#pa-o3"], at(6, 0.0), 0.4);
      IN("#pa-card", at(6, 0.1), 0.6, { y: 15 }, { y: 0 });
      BLINK("#pa-f3", at(6, 0.45), 0.4);
      BLINK("#pa-card", at(6, 0.7), 0.6);


      tl.to("#pa-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#pa-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["pathcex"] = tl;
