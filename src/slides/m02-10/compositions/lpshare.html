  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 fees stay in the pool; each LP token is worth more
      IN("#lp-pool", at(0, 0.03), 0.6);
      [0, 1, 2, 3, 4, 5].forEach(i => tl.fromTo(`#lp-fr${i}`, { opacity: 0, y: -260 }, { opacity: 1, y: 0, duration: 0.6, ease: "bounce.out" }, at(0, 0.3 + i * 0.04)));
      tl.to("#lp-s0 #lp-pool, #lp-frag", { scale: 1.08, svgOrigin: "500 660", duration: 0.7, ease: "back.out(1.6)" }, at(0, 0.62));
      IN("#lp-card", at(0, 0.7), 0.5, { x: 20 }, { x: 0 });
      ARROW("#lp-eqa", at(0, 0.76), 0.4);
      IN("#lp-bar, #lp-barl", at(0, 0.8), 0.3);
      tl.fromTo("#lp-bar", { attr: { y: 540, height: 100 } }, { attr: { y: 470, height: 170 }, duration: 0.8, ease: "power2.out", immediateRender: false }, at(0, 0.84));
      // L1 first mint formula
      OUT("#lp-s0", at(1, 0.0), 0.4);
      IN("#lp-f1", at(1, 0.1), 0.6, { x: -16 }, { x: 0 });
      tl.to("#lp-sq", { fill: "#F0B90B", duration: 0.3 }, at(1, 0.55));
      tl.to("#lp-sq", { fill: "#58C4DD", duration: 0.3 }, at(1, 0.85));
      tl.to("#lp-k", { fill: "#FF9F43", duration: 0.3 }, at(1, 0.88));
      // L2 1000 locked to zero address
      IN("#lp-zero", at(2, 0.05), 0.5);
      IN("#lp-blk", at(2, 0.15), 0.3);
      tl.fromTo("#lp-blk", { x: 0, y: 0 }, { x: 728, y: -42, duration: 1.0, ease: "power2.inOut", immediateRender: false }, at(2, 0.2));
      IN("#lp-ghost", at(2, 0.55), 0.4);
      IN("#lp-gx", at(2, 0.82), 0.3, { scale: 0.4, svgOrigin: "1218 530" }, { scale: 1, svgOrigin: "1218 530" });
      tl.to("#lp-ghost", { opacity: 0.45, duration: 0.3 }, at(2, 0.84));
      // L3 worked example
      OUT("#lp-zero, #lp-blk, #lp-ghost, #lp-gx", at(3, 0.0), 0.4);
      IN("#lp-calc", at(3, 0.1), 0.6, { x: -16 }, { x: 0 });
      tl.to("#lp-res", { fill: "#F0B90B", duration: 0.3 }, at(3, 0.5));
      IN("#lp-pie", at(3, 0.6), 0.6, { scale: 0.6, svgOrigin: "1500 690" }, { scale: 1, svgOrigin: "1500 690" });
      IN("#lp-ex", at(3, 0.62), 0.4);
      // L4 later deposits: min
      OUT("#lp-f1, #lp-calc, #lp-pie, #lp-ex", at(4, 0.0), 0.4);
      IN("#lp-f2", at(4, 0.06), 0.5, { x: -16 }, { x: 0 });
      IN("#lp-cand", at(4, 0.3), 0.4);
      IN("#lp-c1, #lp-c1x", at(4, 0.32), 0.3);
      tl.fromTo("#lp-c1", { attr: { width: 0 } }, { attr: { width: 420 }, duration: 0.5, immediateRender: false }, at(4, 0.32));
      tl.fromTo("#lp-c1x", { attr: { width: 0 } }, { attr: { width: 180 }, duration: 0.3, immediateRender: false }, at(4, 0.32) + 0.5);
      IN("#lp-c2", at(4, 0.4), 0.3);
      tl.fromTo("#lp-c2", { attr: { width: 0 } }, { attr: { width: 420 }, duration: 0.5, immediateRender: false }, at(4, 0.4));
      tl.to("#lp-c1, #lp-c2", { fill: "#83C167", duration: 0.3 }, at(4, 0.55));
      tl.to("#lp-c1x", { fill: "#6b6f7a", duration: 0.3 }, at(4, 0.62));
      IN("#lp-mini", at(4, 0.66), 0.4);
      tl.to("#lp-c1x", { x: 520, y: 40, opacity: 0, duration: 0.9, ease: "power2.in" }, at(4, 0.72));
      // L5 remove
      OUT("#lp-f2, #lp-cand, #lp-c1, #lp-c2, #lp-mini", at(5, 0.0), 0.3);
      IN("#lp-f3", at(5, 0.04), 0.4);
      IN("#lp-tok", at(5, 0.1), 0.3);
      IN("#lp-pie2", at(5, 0.16), 0.3);
      tl.to("#lp-tok rect", { stroke: "#FC6255", duration: 0.2 }, at(5, 0.34));
      IN("#lp-burn", at(5, 0.34), 0.2);
      tl.to("#lp-tok", { opacity: 0, duration: 0.5, ease: "power2.in" }, at(5, 0.42));
      IN("#lp-rd, #lp-rc", at(5, 0.55), 0.2);
      tl.fromTo("#lp-rd", { x: -280, y: -40 }, { x: 0, y: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, at(5, 0.55));
      tl.fromTo("#lp-rc", { x: -380, y: -40 }, { x: 0, y: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, at(5, 0.58));
      IN("#lp-ret", at(5, 0.72), 0.3);
      // L6 protocol fee switch
      OUT("#lp-f3, #lp-burn, #lp-pie2, #lp-rd, #lp-rc, #lp-ret", at(6, 0.0), 0.3);
      IN("#lp-sw", at(6, 0.04), 0.4);
      IN("#lp-fee, #lp-sl", at(6, 0.16), 0.4);
      tl.to("#lp-swk", { attr: { cx: 282 }, fill: "#B48EF0", duration: 0.35, ease: "power2.out" }, at(6, 0.26));
      tl.to("#lp-swt", { fill: "#3a2f55", duration: 0.35 }, at(6, 0.26));
      tl.to("#lp-sl", { fill: "#B48EF0", duration: 0.3 }, at(6, 0.36));
      IN("#lp-sll", at(6, 0.42), 0.4);
      IN("#lp-proto", at(6, 0.5), 0.4);
      tl.to("#lp-sl", { y: 190, duration: 0.9, ease: "power2.inOut" }, at(6, 0.55));
      IN("#lp-form", at(6, 0.66), 0.4);
      IN("#lp-gov", at(6, 0.86), 0.4);


      tl.to("#lp-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["lpshare"] = tl;
    })();
