  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const EB = (e, t, d) => {
        tl.to("#ve-be", { attr: { width: 720 * e }, duration: d, ease: "none" }, t);
        tl.to("#ve-bu", { attr: { x: 600 + 720 * e, width: 720 * (1 - e) }, duration: d, ease: "none" }, t);
      };
      const PCT = (a, b, t, d) => { COUNT("#ve-pe", a, b, t, d); COUNT("#ve-pu", 100 - a, 100 - b, t, d); };
      const POP = (s, t) => {
        tl.fromTo(s, { opacity: 0, attr: { y: 440 } }, { opacity: 1, attr: { y: 400 }, duration: 0.4, immediateRender: false }, t);
        tl.to(s, { opacity: 0, attr: { y: 360 }, duration: 0.5 }, t + 0.6);
      };
      const PX = (x, t, d, ease = "power1.inOut") => tl.to("#ve-ptr", { x, duration: d, ease }, t);
      const ON = (t) => { OUT("#ve-off", t, 0.2); IN("#ve-on", t + 0.2, 0.3); tl.to("#ve-band", { attr: { fill: "#83C167", stroke: "#83C167" }, duration: 0.3 }, t); };
      const OFF = (t) => { OUT("#ve-on", t, 0.2); IN("#ve-off", t + 0.2, 0.3); tl.to("#ve-band", { attr: { fill: "#8a8f99", stroke: "#8a8f99" }, duration: 0.3 }, t); };
      // L0
      IN("#ve-ax", at(0, 0), 0.4); IN("#ve-band", at(0, 0.08), 0.5); IN("#ve-l1, #ve-l2", at(0, 0.12), 0.4);
      IN("#ve-ptr", at(0, 0.2), 0.4);
      IN("#ve-card", at(0, 0.32), 0.5);
      IN("#ve-on", at(0, 0.7), 0.4);
      POP("#ve-f0", at(0, 0.72)); POP("#ve-f1", at(0, 0.9));
      // L1 price rises through the range
      PX(213, at(1, 0.1), 4.5); EB(0, at(1, 0.1), 4.5); PCT(50, 0, at(1, 0.1), 4.5);
      POP("#ve-f0", at(1, 0.15)); POP("#ve-f1", at(1, 0.32));
      PX(400, at(1, 0.66), 0.8);
      OFF(at(1, 0.68));
      // L2 price falls through the range, then rebalance
      PX(213, at(2, 0.0), 0.6);
      ON(at(2, 0.05));
      PX(-192, at(2, 0.08), 1.6); EB(1, at(2, 0.08), 1.6); PCT(0, 100, at(2, 0.08), 1.6);
      OFF(at(2, 0.28));
      PX(-350, at(2, 0.28), 0.6);
      OUT("#ve-l1, #ve-l2", at(2, 0.55), 0.3);
      ARROW("#ve-drag", at(2, 0.6), 0.6); IN("#ve-dragl", at(2, 0.62), 0.4);
      tl.to("#ve-band", { attr: { x: 248 }, duration: 0.9, ease: "power2.inOut" }, at(2, 0.66));
      ON(at(2, 0.74)); EB(0.5, at(2, 0.74), 0.6); PCT(100, 50, at(2, 0.74), 0.6);
      // L3 quiz: rises to 4,000
      OUT("#ve-drag, #ve-dragl", at(3, 0), 0.3);
      tl.to("#ve-band", { attr: { x: 608 }, duration: 0.6, ease: "power2.inOut" }, at(3, 0));
      PX(0, at(3, 0), 0.6);
      IN("#ve-l1, #ve-l2", at(3, 0.06), 0.4);
      IN("#ve-q", at(3, 0.04), 0.5);
      IN("#ve-l3", at(3, 0.24), 0.4);
      PX(640, at(3, 0.3), 1.6); EB(0, at(3, 0.3), 0.8); PCT(50, 0, at(3, 0.3), 0.8);
      OFF(at(3, 0.34));
      IN("#ve-ans", at(3, 0.44), 0.5);
      IN("#ve-liq", at(3, 0.72), 0.5);
      // L4 NFT
      OUT("#ve-ax, #ve-band, #ve-l1, #ve-l2, #ve-l3, #ve-ptr, #ve-q, #ve-ans, #ve-liq, #ve-off, #ve-on", at(4, 0), 0.4);
      tl.to("#ve-cardin", { scaleX: 0, svgOrigin: "960 355", duration: 0.35, ease: "power2.in" }, at(4, 0.1));
      tl.set("#ve-card", { opacity: 0 }, at(4, 0.1) + 0.36);
      tl.fromTo("#ve-nft", { opacity: 0 }, { opacity: 1, duration: 0.01 }, at(4, 0.1) + 0.36);
      tl.fromTo("#ve-nftin", { scaleX: 0, svgOrigin: "960 355" }, { scaleX: 1, svgOrigin: "960 355", duration: 0.35, ease: "power2.out", immediateRender: false }, at(4, 0.1) + 0.36);
      tl.to("#ve-btn", { attr: { "fill-opacity": 0.3 }, duration: 0.3, yoyo: true, repeat: 3 }, at(4, 0.72));
      IN("#ve-claim", at(4, 0.4), 0.4);
      tl.fromTo("#ve-coin", { opacity: 0, attr: { cx: 960, cy: 423 } }, { opacity: 1, attr: { cx: 1500, cy: 423 }, duration: 1.0, ease: "power2.out", immediateRender: false }, at(4, 0.74));
      // L5 narrow vs wide
      OUT("#ve-nft, #ve-claim, #ve-coin", at(5, 0), 0.4);
      IN("#ve-cmp", at(5, 0.04), 0.6);
      tl.to("#ve-pa, #ve-pb", { x: 120, duration: 0.8, ease: "power1.inOut" }, at(5, 0.18));
      tl.to("#ve-pa, #ve-pb", { x: 300, duration: 1.0, ease: "power1.inOut" }, at(5, 0.3));
      tl.to("#ve-na", { attr: { fill: "#FC6255", stroke: "#FC6255" }, duration: 0.3 }, at(5, 0.36));
      IN("#ve-nred", at(5, 0.5), 0.5);
      IN("#ve-wok", at(5, 0.78), 0.5);
      // L6 professional LPs + gas per tick
      OUT("#ve-cmp, #ve-nred, #ve-wok", at(6, 0), 0.4);
      IN("#ve-pie", at(6, 0.06), 0.7, { scale: 0.85, svgOrigin: "520 560" }, { scale: 1, svgOrigin: "520 560" });
      IN("#ve-piel", at(6, 0.18), 0.5); IN("#ve-bot", at(6, 0.2), 0.5); IN("#ve-piel2", at(6, 0.26), 0.5);
      IN("#ve-rul", at(6, 0.56), 0.5);
      IN("#ve-cnt, #ve-gasl, #ve-gas", at(6, 0.6), 0.4);
      const t0 = at(6, 0.64), dd = 2.6;
      tl.set("#ve-ord", { opacity: 1 }, t0); DRAW("#ve-ord", t0, dd);
      for (let k = 0; k < 10; k++) {
        const tk = t0 + dd * (40 + 80 * k) / 790;
        tl.to(`#ve-t${k}`, { attr: { stroke: "#FF9F43" }, duration: 0.12 }, tk);
      }
      tl.to("#ve-gas", { attr: { width: 600 }, duration: dd, ease: "none" }, t0);
      COUNT("#ve-cn", 0, 10, t0, dd, v => Math.floor(v));

      tl.to("#ve-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["v3range"] = tl;
    })();
