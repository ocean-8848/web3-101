        <text id="cu-kl" class="mono h" x="1400" y="760" font-size="40" font-weight="700" fill="#58C4DD">x · y = k</text>

        <g id="cu-g" class="h">
          <rect x="1700" y="300" width="40" height="400" rx="6" fill="#161a22" stroke="#8a8f99" stroke-width="2"/>

        </g>
        <g id="cu-gB" class="h">
          <line x1="1688" y1="497" x2="1752" y2="497" stroke="#FC6255" stroke-width="3"/>
          <text x="1764" y="507" font-size="28" font-weight="700" fill="#FC6255">B</text>

        <path id="cu-gap2" class="dr h" pathLength="1" d="M1560 840 L1560 892" stroke="#FF9F43" stroke-width="3.5" fill="none" marker-start="url(#cu-arrO)" marker-end="url(#cu-arrO)"/>
        <text id="cu-note" class="h" x="900" y="230" font-size="32" fill="#e8e6df">碰不到坐标轴：买不空，但价格趋向无穷</text>
      </g>
      <!-- 术语卡 -->
<g id="cu-term" class="h">
        <rect x="70" y="56" width="560" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">恒定乘积 <tspan font-size="28" font-weight="400" fill="#8a8f99">Constant Product</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">两种代币数量之积 <tspan class="mono" fill="#58C4DD">x·y = k</tspan> 不变</text>
      </g>

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const K = 90000, P = { a: 300 };
      const dot = document.querySelector("#cu-p"), lab = document.querySelector("#cu-pl"), tan = document.querySelector("#cu-tan"), gf = document.querySelector("#cu-gf");
      const place = () => {
        const a = P.a, b = K / a, X = 260 + a, Y = 900 - b;
        dot.setAttribute("cx", X); dot.setAttribute("cy", Y);
        lab.setAttribute("x", X + 18); lab.setAttribute("y", Y - 18);
        const s = K / (a * a), n = Math.hypot(1, s), dx = 150 / n, dy = 150 * s / n;
        const u = Math.min(1, Math.max(0, (Y - 268) / dy));
        tan.setAttribute("x1", X - dx * u); tan.setAttribute("y1", Y - dy * u); tan.setAttribute("x2", X + dx); tan.setAttribute("y2", Y + dy);
        const h = Math.min(400, 90 * b / a);
        gf.setAttribute("y", 700 - h); gf.setAttribute("height", h);
      };
      place();
      const SLIDE = (a0, a1, t, d) => tl.fromTo(P, { a: a0 }, { a: a1, duration: d, ease: "power1.inOut", immediateRender: false, onUpdate: place }, t);
      // L0 axes + curve
      ARROW("#cu-ay", at(0, 0.03), 0.6); ARROW("#cu-ax", at(0, 0.06), 0.7);
      IN("#cu-lx", at(0, 0.2), 0.4); IN("#cu-ly", at(0, 0.38), 0.4);
      IN("#cu-term", at(0, 0.6), 0.5);
      DRAW("#cu-curve", at(0, 0.58), 1.6);
      IN("#cu-kl", at(0, 0.85), 0.5);
      // L1 state point A, price = y/x
      OUT("#cu-term", at(1, 0.4), 0.4);
      IN("#cu-A", at(1, 0.05), 0.4, { scale: 0.3, svgOrigin: "560 600" }, { scale: 1, svgOrigin: "560 600" });
      IN("#cu-guide", at(1, 0.3), 0.5);
      IN("#cu-pb", at(1, 0.6), 0.5, { x: -16 }, { x: 0 });
      IN("#cu-g", at(1, 0.78), 0.5);
      IN("#cu-gA", at(1, 0.82), 0.4);
      // L2 buy ETH: y up, x down, A -> B
      OUT("#cu-pb", at(2, 0.0), 0.3);
      OUT("#cu-guide", at(2, 0.0), 0.3);
      ARROW("#cu-ag", at(2, 0.2), 0.6); IN("#cu-n1", at(2, 0.25), 0.3); IN("#cu-lg1", at(2, 0.22), 0.4, { x: 16 }, { x: 0 });
      ARROW("#cu-ar", at(2, 0.5), 0.5); IN("#cu-n2", at(2, 0.55), 0.3); IN("#cu-lg2", at(2, 0.52), 0.4, { x: 16 }, { x: 0 });
      IN("#cu-p", at(2, 0.68), 0.2);
      SLIDE(300, 200, at(2, 0.7), 1.6);
      IN("#cu-pl", at(2, 0.7) + 1.6, 0.3);
      // L3 higher price at B; keep buying -> steeper
      OUT("#cu-ag, #cu-ar, #cu-n1, #cu-n2, #cu-lg1, #cu-lg2", at(3, 0.0), 0.4);
      IN("#cu-gB", at(3, 0.12), 0.4);
      ARROW("#cu-up", at(3, 0.18), 0.5);
      OUT("#cu-pl", at(3, 0.4), 0.3);
      IN("#cu-tan", at(3, 0.42), 0.4);
      SLIDE(200, 160, at(3, 0.48), 2.0);
      IN("#cu-pi", at(3, 0.72), 0.5);
      // L4 sell ETH: slide to lower right, price falls
      OUT("#cu-pi, #cu-up", at(4, 0.0), 0.3);
      SLIDE(160, 600, at(4, 0.08), 2.6);
      // L5 never touches the axes
      OUT("#cu-tan", at(5, 0.0), 0.3);
      SLIDE(600, 150, at(5, 0.04), 1.5);
      ARROW("#cu-gap1", at(5, 0.24), 0.5);
      IN("#cu-inf", at(5, 0.26), 0.4);
      SLIDE(150, 1300, at(5, 0.42), 1.6);
      ARROW("#cu-gap2", at(5, 0.42) + 1.6, 0.5);
      IN("#cu-note", at(5, 0.68), 0.5);


      tl.to("#cu-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#cu-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["curve"] = tl;
    })();
  </script>
