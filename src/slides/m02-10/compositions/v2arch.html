    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const P = (pts, t, seg = 0.45) => pts.forEach((p, i) => tl.to("#v2-pt", { attr: { cx: p[0], cy: p[1] }, duration: seg, ease: "none" }, t + i * seg));
      // L0 three contracts

      IN("#v2-fac", at(0, 0.55), 0.5, { y: -16 }, { y: 0 });
      IN("#v2-p1, #v2-pt0", at(0, 0.7), 0.5, { y: -16 }, { y: 0 });
      IN("#v2-router", at(0, 0.86), 0.5, { y: -16 }, { y: 0 });
      // L1 Factory deploys pairs; Pair keeps reserves and is an ERC-20
      tl.to("#v2-fac rect", { fill: "#1d3440", duration: 0.25, yoyo: true, repeat: 1 }, at(1, 0.03));
      ARROW("#v2-d1", at(1, 0.08), 0.6);
      OUT("#v2-pt0", at(1, 0.1), 0.3); IN("#v2-pt1", at(1, 0.14), 0.4);
      ARROW("#v2-d2", at(1, 0.18), 0.7);
      IN("#v2-p2", at(1, 0.22), 0.5, { scale: 0.85, svgOrigin: "1680 520" }, { scale: 1, svgOrigin: "1680 520" });
      IN("#v2-c2", at(1, 0.3), 0.5);
      IN("#v2-cells", at(1, 0.6), 0.5);
      IN("#v2-lpt", at(1, 0.84), 0.5);
      // L2 Router: user-facing, checks, no funds
      OUT("#v2-d1, #v2-d2", at(2, 0.0), 0.3);
      IN("#v2-user", at(2, 0.04), 0.4, { x: -16 }, { x: 0 });
      ARROW("#v2-ua", at(2, 0.1), 0.4);
      IN("#v2-ck3", at(2, 0.3), 0.4, { y: -10 }, { y: 0 });
      IN("#v2-ck1", at(2, 0.46), 0.4, { y: -10 }, { y: 0 });
      IN("#v2-ck2", at(2, 0.6), 0.4, { y: -10 }, { y: 0 });
      IN("#v2-wal", at(2, 0.78), 0.4);
      // L3 one swap, multi-hop
      tl.to("#v2-ua", { stroke: "#F0B90B", duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.08));
      ARROW("#v2-tf", at(3, 0.25), 0.8);
      IN("#v2-tfl", at(3, 0.28), 0.4);
      IN("#v2-pt", at(3, 0.25), 0.2);
      P([[160, 380], [1180, 380], [1180, 470]], at(3, 0.27), 0.4);
      ARROW("#v2-sw", at(3, 0.5), 0.6);
      IN("#v2-swl", at(3, 0.52), 0.4);
      ARROW("#v2-hop", at(3, 0.66), 0.4);
      IN("#v2-hopl", at(3, 0.66), 0.4);
      P([[1520, 520], [1680, 600]], at(3, 0.68), 0.35);
      ARROW("#v2-ret", at(3, 0.8), 0.9);
      P([[1680, 960], [160, 960], [160, 650]], at(3, 0.8), 0.3);
      OUT("#v2-pt", at(3, 0.8) + 0.95, 0.3);
      // L4 cumulative price -> TWAP
      OUT("#v2-ret, #v2-hop, #v2-hopl, #v2-tf, #v2-tfl", at(4, 0.0), 0.4);
      IN("#v2-cum", at(4, 0.08), 0.5, { y: 12 }, { y: 0 });
      const fmt = v => Math.round(v).toLocaleString("en-US");
      COUNT("#v2-cn", 0, 18240, at(4, 0.15), 0.8, fmt);
      COUNT("#v2-cn", 18240, 36510, at(4, 0.35), 0.8, fmt);
      COUNT("#v2-cn", 36510, 54730, at(4, 0.55), 0.8, fmt);
      COUNT("#v2-cn", 54730, 73020, at(4, 0.75), 0.8, fmt);
      IN("#v2-tw", at(4, 0.42), 0.5, { x: 16 }, { x: 0 });
      ARROW("#v2-twa", at(4, 0.5), 0.4);
      IN("#v2-twl", at(4, 0.8), 0.5);


      tl.to("#v2-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
