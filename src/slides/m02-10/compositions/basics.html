    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 pool + users
      IN("#ba-pool", at(0, 0.05), 0.7, { scale: 0.95, svgOrigin: "960 520" }, { scale: 1, svgOrigin: "960 520" });
      IN("#ba-term", at(0, 0.3), 0.5);
      IN("#ba-users", at(0, 0.55), 0.4);
      ARROW("#ba-u1", at(0, 0.62)); ARROW("#ba-u2", at(0, 0.7));
      ARROW("#ba-u3", at(0, 0.75)); ARROW("#ba-u4", at(0, 0.83));
      // L1 LP deposits, gets LP token
      OUT("#ba-term", at(1, 0.02), 0.4);
      OUT("#ba-users, #ba-u1, #ba-u2, #ba-u3, #ba-u4", at(1, 0.0), 0.4);
      IN("#ba-lp", at(1, 0.08), 0.5, { x: -20 }, { x: 0 });
      IN("#ba-dd, #ba-dc", at(1, 0.3), 0.2);
      tl.fromTo("#ba-dd", { x: 0, y: 0 }, { x: 370, y: -170, duration: 0.9, ease: "power2.inOut", immediateRender: false }, at(1, 0.32));
      tl.fromTo("#ba-dc", { x: 0, y: 0 }, { x: 630, y: -210, duration: 0.9, ease: "power2.inOut", immediateRender: false }, at(1, 0.36));
      OUT("#ba-dd, #ba-dc", at(1, 0.36) + 0.9, 0.2);
      IN("#ba-tk", at(1, 0.55), 0.8, { x: 220, y: -150 }, { x: 0, y: 0 });
      IN("#ba-term2", at(1, 0.6), 0.5);
      tl.fromTo("#ba-tk path", { scale: 1 }, { scale: 1.25, svgOrigin: "775 820", duration: 0.3, yoyo: true, repeat: 1, immediateRender: false }, at(1, 0.85));
      // L2 arbitrageur
      OUT("#ba-term2", at(2, 0.45), 0.4);
      IN("#ba-arb", at(2, 0.05), 0.5, { y: 20 }, { y: 0 });
      IN("#ba-pt", at(2, 0.3), 0.4);
      IN("#ba-mt", at(2, 0.42), 0.4);
      IN("#ba-ex", at(2, 0.45), 0.4);
      ARROW("#ba-loop", at(2, 0.62), 0.7);
      IN("#ba-loopl", at(2, 0.7), 0.4);
      // L3 formula
      OUT("#ba-s1", at(3, 0.0), 0.5);
      IN("#ba-f1", at(3, 0.12), 0.7, { scale: 0.85, svgOrigin: "960 470" }, { scale: 1, svgOrigin: "960 470" });
      ARROW("#ba-ul", at(3, 0.3), 0.8);
      tl.to("#ba-f1", { y: -10, duration: 0.5, yoyo: true, repeat: 1 }, at(3, 0.55));
      tl.to("#ba-f1", { fill: "#83C167", duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.6));
      IN("#ba-f2", at(3, 0.78), 0.6, { y: 16 }, { y: 0 });
      // L4 balance machine
      OUT("#ba-f1, #ba-f2, #ba-ul", at(4, 0.0), 0.4);
      IN("#ba-bal", at(4, 0.04), 0.7, { y: 20 }, { y: 0 });
      IN("#ba-k", at(4, 0.18), 0.5);
      const tilt = (ang, t) => {
        const dy = 300 * Math.sin(ang * Math.PI / 180);
        tl.to("#ba-beam", { rotation: -ang, svgOrigin: "960 600", duration: 0.6, ease: "back.out(1.6)" }, t);
        tl.to("#ba-panL", { y: dy, duration: 0.6, ease: "back.out(1.6)" }, t);
        tl.to("#ba-panR", { y: -dy, duration: 0.6, ease: "back.out(1.6)" }, t);
      };
      const drop = (k, ang, t) => {
        tl.fromTo(`#ba-d${k}`, { opacity: 0, y: -260 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, t);
        tilt(ang, t + 0.5);
        tl.fromTo(`#ba-r${k - 1}`, { opacity: 0, x: -160, y: 120 - (k - 1) * 40 }, { opacity: 1, x: 0, y: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, t + 0.7);
      };
      drop(1, 4, at(4, 0.32));
      IN("#ba-sy", at(4, 0.4), 0.4);
      drop(2, 8, at(4, 0.55));
      drop(3, 11, at(4, 0.76));
      // L5 the balance cannot see market price
      OUT("#ba-r0, #ba-r1, #ba-r2, #ba-sy", at(5, 0.0), 0.4);
      IN("#ba-mk", at(5, 0.08), 0.5, { x: 20 }, { x: 0 });
      IN("#ba-eye", at(5, 0.22), 0.4);
      IN("#ba-arb2", at(5, 0.4), 0.5);
