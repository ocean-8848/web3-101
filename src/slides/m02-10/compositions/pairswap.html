  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const HL = (y, h, t) => tl.to("#pa-hl", { attr: { y, height: h }, duration: 0.4, ease: "power2.inOut" }, t);
      // L0
      IN("#pa-code", at(0, 0.0), 0.6);
      IN("#pa-s1", at(0, 0.35), 0.4); IN("#pa-s2", at(0, 0.55), 0.4); IN("#pa-s3", at(0, 0.75), 0.4);
      // L1 step 1
      IN("#pa-hl", at(1, 0.0), 0.3);
      IN("#pa-pair", at(1, 0.08)); IN("#pa-to", at(1, 0.16));
      IN("#pa-coin", at(1, 0.26), 0.3);
      ARROW("#pa-a1", at(1, 0.3)); IN("#pa-a1l", at(1, 0.33), 0.4);
      tl.to("#pa-coin", { attr: { cx: 1690 }, duration: 0.9, ease: "power2.inOut" }, at(1, 0.36));
      ARROW("#pa-cb", at(1, 0.66), 0.8); IN("#pa-cbl", at(1, 0.74), 0.4);
      // L2 step 2
      OUT("#pa-to, #pa-a1, #pa-a1l, #pa-coin, #pa-cb, #pa-cbl", at(2, 0), 0.4);
      HL(434, 82, at(2, 0.02));
      IN("#pa-bal", at(2, 0.18), 0.5, { y: 10 }, { y: 0 });
      IN("#pa-eq", at(2, 0.42), 0.5);
      IN("#pa-who", at(2, 0.72), 0.5);
      // L3 step 3
      OUT("#pa-bal, #pa-eq, #pa-who", at(3, 0), 0.4);
      HL(516, 82, at(3, 0.02));
      IN("#pa-k1", at(3, 0.32), 0.5);
      IN("#pa-k1c", at(3, 0.5), 0.4, { scale: 0.5, svgOrigin: "1440 585" }, { scale: 1, svgOrigin: "1440 585" });
      IN("#pa-k2", at(3, 0.72), 0.4);
      IN("#pa-k2b", at(3, 0.8), 0.3);
      IN("#pa-k2c", at(3, 0.84), 0.4);
      tl.to("#pa-pair rect", { stroke: "#FC6255", duration: 0.2 }, at(3, 0.82));
      tl.to("#pa-pair rect", { stroke: "#58C4DD", duration: 0.4 }, at(3, 0.98));
      // L4 flash swap
      OUT("#pa-k1, #pa-k1c, #pa-k2, #pa-k2b, #pa-k2c", at(4, 0), 0.4);
      IN("#pa-term", at(4, 0.1), 0.5);
      DRAW("#pa-tl", at(4, 0.16), 2.0);
      IN("#pa-n0", at(4, 0.16), 0.4); IN("#pa-n1", at(4, 0.27), 0.4); IN("#pa-n2", at(4, 0.4), 0.4);
      IN("#pa-br", at(4, 0.46), 0.5); IN("#pa-n3", at(4, 0.56), 0.4);
      OUT("#pa-term", at(4, 0.74), 0.4);
      HL(311, 41, at(4, 0.8));
      IN("#pa-lock", at(4, 0.8), 0.3);
      tl.to("#pa-lock", { opacity: 0.2, duration: 0.25, yoyo: true, repeat: 3 }, at(4, 0.84));
      IN("#pa-lockl", at(4, 0.84), 0.4);
      // L5 integration trap
      OUT("#pa-pair, #pa-tl, #pa-n0, #pa-n1, #pa-n2, #pa-n3, #pa-br, #pa-lock, #pa-lockl, #pa-hl", at(5, 0), 0.4);
      IN("#pa-warn", at(5, 0.06), 0.6);
      IN("#pa-wsub", at(5, 0.18), 0.5);
      IN("#pa-w0", at(5, 0.4), 0.4); IN("#pa-w1", at(5, 0.46), 0.4); IN("#pa-w2", at(5, 0.52), 0.4); IN("#pa-w3", at(5, 0.58), 0.4);
      DRAW("#pa-c0", at(5, 0.62), 0.4); DRAW("#pa-c1", at(5, 0.72), 0.4); DRAW("#pa-c2", at(5, 0.82), 0.4); DRAW("#pa-c3", at(5, 0.92), 0.4);
      // L6 capital efficiency
      OUT("#pa-code, #pa-s1, #pa-s2, #pa-s3, #pa-warn, #pa-wsub, #pa-w0, #pa-w1, #pa-w2, #pa-w3, #pa-c0, #pa-c1, #pa-c2, #pa-c3", at(6, 0), 0.4);
      IN("#pa-ax", at(6, 0.06), 0.5);
      IN("#pa-band", at(6, 0.12), 0.8, { attr: { width: 0 } }, { attr: { width: 1600 } });
      IN("#pa-bandl", at(6, 0.2), 0.5);
      IN("#pa-ptr", at(6, 0.45), 0.4); IN("#pa-cur", at(6, 0.48), 0.4);
      tl.to("#pa-band", { attr: { fill: "#8a8f99" }, fillOpacity: 0.22, duration: 0.6 }, at(6, 0.55));
      IN("#pa-low", at(6, 0.78), 0.5, { y: 12 }, { y: 0 });

      tl.to("#pa-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#pa-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
