      IN("#v3-r0", at(2, 0.12), 0.4); IN("#v3-r1", at(2, 0.27), 0.4); IN("#v3-r2", at(2, 0.42), 0.4);
      IN("#v3-rowhl", at(2, 0.58), 0.4);

      OUT("#v3-r0, #v3-r1, #v3-r2, #v3-rowhl, #v3-sb, #v3-bl, #v3-br, #v3-snapl, #v3-sl", at(3, 0), 0.4);
      IN("#v3-sq", at(3, 0.15), 0.6, { y: 10 }, { y: 0 });
      IN("#v3-sq2", at(3, 0.5), 0.5);
      // L4 virtual reserves
      OUT("#v3-sq, #v3-sq2, #v3-ticks, #v3-ax", at(4, 0), 0.4);
      IN("#v3-gax", at(4, 0.04), 0.5);
      tl.set("#v3-seg", { opacity: 1 }, at(4, 0.08)); DRAW("#v3-seg", at(4, 0.08), 0.8);
      IN("#v3-segl", at(4, 0.16), 0.4);

      IN("#v3-ef", at(5, 0.12), 0.6, { y: 10 }, { y: 0 });

      IN("#v3-c1", at(6, 0.5), 0.5);
