      // L3 只有 pause()

      IN("#ro-pauseL", at(3, 0.3), 0.5);
      IN("#ro-lk0", at(3, 0.55), 0.4, { x: 30 }, { x: 0 });
      IN("#ro-lk1", at(3, 0.67), 0.4, { x: 30 }, { x: 0 });
      IN("#ro-lk2", at(3, 0.79), 0.4, { x: 30 }, { x: 0 });
      // L4 第二层速率熔断 + 术语卡

      IN("#ro-term", at(4, 0.05), 0.5);

      IN("#ro-gearLk", at(4, 0.82), 0.4, { y: -30 }, { y: 0 });
      OUT("#ro-term", at(4, 0.05) + 7, 0.4);
      // L5 第三层核心治理
