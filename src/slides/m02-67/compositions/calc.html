      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      // L0 规则卡
      IN("#ca-rule", at(0, 0.1), 0.6, { y: 20 }, { y: 0 });
      tl.to("#ca-ruleR", { strokeWidth: 6, duration: 0.3, yoyo: true, repeat: 1 }, at(0, 0.4));

      tl.to("#ca-pct", { fill: "#ffffff", duration: 0.25, yoyo: true, repeat: 1 }, at(0, 0.72));

      IN("#ca-pool", at(1, 0.02), 0.2);
      tl.fromTo("#ca-pool", { attr: { width: 0 } }, { attr: { width: 1400 }, duration: 0.9, ease: "power2.out", immediateRender: false }, at(1, 0.02));
      IN("#ca-tvlL", at(1, 0.15), 0.5);
      IN("#ca-tick", at(1, 0.5), 0.4);
      IN("#ca-f1", at(1, 0.55), 0.5);
      IN("#ca-f2", at(1, 0.78), 0.5, { x: -16 }, { x: 0 });
      // L2 被搬走 1000 万，闸门落下
      OUT("#ca-f1, #ca-f2", at(2, 0), 0.4);
      IN("#ca-cut", at(2, 0.05), 0.4);
      tl.to("#ca-cut", { attr: { y: 720 }, duration: 0.9, ease: "power2.in" }, at(2, 0.18));
      IN("#ca-outL", at(2, 0.35), 0.5);
      IN("#ca-gate", at(2, 0.45), 0.2);
      tl.fromTo("#ca-gate", { y: -90 }, { y: 0, duration: 0.5, ease: "bounce.out", immediateRender: false }, at(2, 0.45));
      IN("#ca-restL", at(2, 0.62), 0.5);
      IN("#ca-restS", at(2, 0.82), 0.5);
      // L3 两栏：1/3 vs 4/7

      IN("#ca-pL", at(3, 0.05), 0.6);
      IN("#ca-hl0, #ca-hl1, #ca-hl2", at(3, 0.15), 0.4);
      tl.to("#ca-hl1", { fill: "#83C167", duration: 0.3 }, at(3, 0.32));

      for (let k = 0; k < 7; k++) IN(`#ca-hr${k}`, at(3, 0.55) + k * 0.06, 0.3);
      for (let k = 0; k < 4; k++) tl.to(`#ca-hr${k}`, { fill: "#B48EF0", duration: 0.25 }, at(3, 0.75) + k * 0.15);
      // L4 凌晨三点：一人秒按 vs 凑人太慢
      IN("#ca-clock", at(4, 0.02), 0.5, { scale: 1.3, svgOrigin: "960 195" }, { scale: 1, svgOrigin: "960 195" });
      for (let k = 0; k < 4; k++) tl.to(`#ca-hr${k}`, { fill: "rgba(0,0,0,0)", stroke: "#5a5f69", duration: 0.3 }, at(4, 0.08));
      IN("#ca-trL, #ca-trR", at(4, 0.12), 0.5);
      IN("#ca-fillL", at(4, 0.25), 0.05);
      tl.fromTo("#ca-fillL", { attr: { width: 0 } }, { attr: { width: 70 }, duration: 0.6, ease: "power2.out", immediateRender: false }, at(4, 0.25));
      IN("#ca-okL", at(4, 0.35), 0.4);

      for (let k = 0; k < 4; k++) tl.to(`#ca-hr${k}`, { fill: "#B48EF0", stroke: "#B48EF0", duration: 0.3 }, at(4, 0.42) + k * 1.1);
