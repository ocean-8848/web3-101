      IN("#wa-axis", at(2, 0.03), 0.5);

      tl.fromTo("#wa-g1", { attr: { width: 0 } }, { attr: { width: 460 }, duration: 0.8, ease: "power2.out", immediateRender: false }, at(2, 0.06));
      IN("#wa-l1", at(2, 0.1), 0.5);
      IN("#wa-bell", at(2, 0.2), 0.4);
      tl.to("#wa-bell", { x: 5, duration: 0.07, yoyo: true, repeat: 5, ease: "none" }, at(2, 0.24));
      ARROW("#wa-a1", at(2, 0.3), 0.4);
      IN("#wa-eng", at(2, 0.34), 0.5);
      ARROW("#wa-a2", at(2, 0.5), 0.4);
      IN("#wa-room", at(2, 0.54), 0.5);
      IN("#wa-star", at(2, 0.66), 0.5, { scale: 0.5, svgOrigin: "1150 640" }, { scale: 1, svgOrigin: "1150 640" });
      DRAW("#wa-r0, #wa-r1, #wa-r2", at(2, 0.76), 0.4);
      IN("#wa-c0", at(2, 0.8), 0.3); IN("#wa-c1", at(2, 0.85), 0.3); IN("#wa-c2", at(2, 0.9), 0.3);
      // L3 5–15 分钟 止损

      IN("#wa-l2", at(3, 0.08), 0.5);

      ARROW("#wa-a3", at(3, 0.38), 0.4);
      for (let k = 0; k < 3; k++) {
        tl.to(`#wa-mr${k}`, { stroke: "#5a5f69", duration: 0.3 }, at(3, 0.45) + k * 0.2);

        IN(`#wa-lk${k}`, at(3, 0.48) + k * 0.2, 0.3, { y: -20 }, { y: 0 });
      }
      IN("#wa-pausedL", at(3, 0.64), 0.4);
      // L4 判断剩余资金
      OUT("#wa-d2", at(4, 0), 0.4);

      tl.fromTo("#wa-g3", { attr: { width: 0 } }, { attr: { width: 680 }, duration: 0.9, ease: "power2.out", immediateRender: false }, at(5, 0.03));
      IN("#wa-l3", at(5, 0.06), 0.5);
      IN("#wa-atk", at(5, 0.1), 0.5);
      DRAW("#wa-p0", at(5, 0.2), 0.5); IN("#wa-t0", at(5, 0.24), 0.4, { x: 20 }, { x: 0 });
      DRAW("#wa-p1", at(5, 0.3), 0.5); IN("#wa-t1", at(5, 0.34), 0.4, { x: 20 }, { x: 0 });

      for (let k = 0; k < 3; k++) {

      IN("#wa-shield", at(5, 0.68), 0.4, { scale: 0.6, svgOrigin: "1490 960" }, { scale: 1, svgOrigin: "1490 960" });

      tl.to("#wa-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#wa-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["warroom"] = tl;
    })();
  </script>
