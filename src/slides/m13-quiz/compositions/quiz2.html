  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q2-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q2-calc", at(0, 0.04), 0.4);
      IN("#q2-q1", at(0, 0.06), 0.01);
      tl.fromTo("#q2-qcr1", { attr: { width: 0 } }, { attr: { width: 1300 }, duration: 3.0, ease: "none" }, at(0, 0.08));
      IN("#q2-q2", at(0, 0.55), 0.01);
      tl.fromTo("#q2-qcr2", { attr: { width: 0 } }, { attr: { width: 1300 }, duration: 2.6, ease: "none" }, at(0, 0.57));
      IN("#q2-pool", at(0, 0.2), 0.6, { scale: 0.92, svgOrigin: "1510 590" }, { scale: 1, svgOrigin: "1510 590" });
      IN("#q2-chip", at(0, 0.62), 0.5, { y: 20 }, { y: 0 });
      ARROW("#q2-ca", at(0, 0.68), 0.4);

      const SHOW = (k, t) => {
        IN(`#q2-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q2-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q2-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.0);
      };
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.26)); SHOW("C", at(1, 0.52)); SHOW("D", at(1, 0.76));

      IN("#q2-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q2-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#q2-pause", at(3, 0.0), 0.3);

      const RIGHT = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q2-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q2-o${k}-n`, t + 0.3, 0.5);
      };
      // L3 揭晓 B：10 ETH 进池 → 1,010 ETH → 算式
      RIGHT("B", at(3, 0.03));
      tl.to("#q2-oA-dim, #q2-oC-dim, #q2-oD-dim", { opacity: 0.6, duration: 0.4 }, at(3, 0.05));
      OUT("#q2-ca", at(3, 0.12), 0.2);
      tl.to("#q2-chipM", { y: -220, duration: 0.7, ease: "power2.in" }, at(3, 0.14));
      OUT("#q2-chip", at(3, 0.14) + 0.4, 0.3);
      COUNT("#q2-eth", 1000, 1010, at(3, 0.2), 0.9, v => Math.round(v).toLocaleString("en-US"));
      IN("#q2-f1", at(3, 0.45), 0.6, { y: 10 }, { y: 0 });
      IN("#q2-f2", at(3, 0.78), 0.5, { scale: 0.85, svgOrigin: "1340 870" }, { scale: 1, svgOrigin: "1340 870" });
      // L4 干扰项
      WRONG("A", at(4, 0.02));
      WRONG("C", at(4, 0.6));
      WRONG("D", at(4, 0.66));
      // L5 两个池子对比
      OUT("#q2-oA, #q2-oB, #q2-oC, #q2-oD, #q2-panel", at(5, 0.0), 0.4);
      IN("#q2-s", at(5, 0.08), 0.5);
      IN("#q2-d", at(5, 0.14), 0.5);
      IN("#q2-sc, #q2-dc", at(5, 0.3), 0.4, { y: -15 }, { y: 0 });
      ARROW("#q2-sa", at(5, 0.36), 0.3);
      ARROW("#q2-da", at(5, 0.36), 0.3);
      IN("#q2-sb", at(5, 0.5), 0.8, { scaleX: 0, svgOrigin: "260 820" }, { scaleX: 1, svgOrigin: "260 820" });
      IN("#q2-db", at(5, 0.5), 0.8, { scaleX: 0, svgOrigin: "1060 820" }, { scaleX: 1, svgOrigin: "1060 820" });
      IN("#q2-sbl, #q2-dbl", at(5, 0.56), 0.4);
      tl.to("#q2-s rect", { strokeWidth: 5, duration: 0.25, yoyo: true, repeat: 1 }, at(5, 0.78));

      tl.to("#q2-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz2"] = tl;
    })();
