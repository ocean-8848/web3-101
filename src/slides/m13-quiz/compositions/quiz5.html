    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // ===== 测验版式（同 EP009 quiz1）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q5-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q5-q", at(0, 0.03), 0.01);
      tl.fromTo("#q5-qcr1", { attr: { width: 0 } }, { attr: { width: 1480 }, duration: 2.4, ease: "none" }, at(0, 0.04));
      tl.fromTo("#q5-qcr2", { attr: { width: 0 } }, { attr: { width: 1480 }, duration: 1.8, ease: "none" }, at(0, 0.04) + 2.4);
      const SHOW = (k, t) => {
        IN(`#q5-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q5-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q5-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.0);
      };
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.12)); SHOW("C", at(1, 0.42)); SHOW("D", at(1, 0.72));
      IN("#q5-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q5-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#q5-pause", at(3, 0.0), 0.3);
      const RIGHT = (k, t) => {
        tl.to(`#q5-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q5-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q5-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q5-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q5-o${k}-n`, t + 0.3, 0.5);
      };

      // L0 份额与时间轴
      IN("#q5-r1", at(0, 0.22)); IN("#q5-axis", at(0, 0.42), 0.6); IN("#q5-r2", at(0, 0.62));
      tl.to("#q5-axis rect", { opacity: 0.3, duration: 0.4, yoyo: true, repeat: 1 }, at(0, 0.85));
      // L3 揭晓 C：悬崖日一根大柱，之后每月小柱
      RIGHT("C", at(3, 0.02));
      tl.to("#q5-big", { attr: { y: 520, height: 240 }, duration: 0.9, ease: "power3.out" }, at(3, 0.25));
      IN("#q5-bl", at(3, 0.32), 0.4);
      IN("#q5-f1", at(3, 0.45), 0.6, { x: -20 }, { x: 0 });
      for (let m = 7; m <= 24; m++) tl.to(`#q5-b${m}`, { attr: { y: 720, height: 40 }, duration: 0.3, ease: "power2.out" }, at(3, 0.6) + (m - 7) * 0.06);
      // L4 干扰项
      WRONG("B", at(4, 0.02));
      tl.to("#q5-b7", { fill: "#FF9F43", duration: 0.25, yoyo: true, repeat: 3 }, at(4, 0.1));
      WRONG("A", at(4, 0.55));
      WRONG("D", at(4, 0.75));
      // L5 选项淡出，比值条
      OUT("#q5-oA, #q5-oB, #q5-oC, #q5-oD", at(5, 0.0), 0.4);
      IN("#q5-rt", at(5, 0.08), 0.5);
      IN("#q5-cl", at(5, 0.12), 0.4); IN("#q5-cb", at(5, 0.12), 0.6, { attr: { width: 0 } }, { attr: { width: 900 } });
      IN("#q5-ul", at(5, 0.28), 0.4); IN("#q5-ub", at(5, 0.28), 0.8, { attr: { width: 0 } }, { attr: { width: 540 } });
      IN("#q5-pc", at(5, 0.45), 0.5, { scale: 1.3, svgOrigin: "790 705" }, { scale: 1, svgOrigin: "790 705" });
      IN("#q5-sp", at(5, 0.62), 0.5);
      tl.to("#q5-big", { opacity: 0.5, duration: 0.3, yoyo: true, repeat: 1 }, at(5, 0.7));

      tl.to("#q5-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
