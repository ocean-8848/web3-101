      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const FLIP = (n, t) => {
  const X = [90, 690, 1290, 90, 690, 1290][n - 1] + 270, Y = [210, 210, 210, 490, 490, 490][n - 1] + 115, o = `${X} ${Y}`;
  tl.to(`#st-k${n}`, { scaleX: 0, svgOrigin: o, duration: 0.22, ease: "power2.in" }, t);
  tl.fromTo(`#st-f${n}`, { opacity: 1, scaleX: 0, svgOrigin: o }, { scaleX: 1, svgOrigin: o, duration: 0.28, ease: "power2.out", immediateRender: false }, t + 0.22);
};

IN("#st-tt", at(0, 0.02), 0.5);
[1, 2, 3, 4, 5, 6].forEach((n, k) => IN(`#st-k${n}`, at(0, 0.2) + k * 0.12, 0.4));
// L1 wallet backend
FLIP(1, at(1, 0.02));
IN("#st-1a", at(1, 0.3), 0.4, { x: -16 }, { x: 0 });
IN("#st-1b", at(1, 0.45), 0.4, { x: -16 }, { x: 0 });

IN("#st-1d", at(1, 0.82), 0.4);

tl.to("#st-2a .st-tk", { stroke: "#F0B90B", duration: 0.2, stagger: 0.1 }, at(2, 0.38));

// L4 SRE

[0, 1, 2].forEach(k => {
  const t = at(4, 0.22 + k * 0.17);
  IN(`#st-4b${k}, #st-4l${k}`, t, 0.4);
  tl.fromTo(`#st-4b${k}`, { rotation: 0 }, { rotation: 12, svgOrigin: `${[160, 310, 460][k]} 618`, duration: 0.08, repeat: 3, yoyo: true, immediateRender: false }, t + 0.3);
});
IN("#st-4p", at(4, 0.8), 0.5);
// L5 admin + security
FLIP(5, at(5, 0.02)); FLIP(6, at(5, 0.02));
IN("#st-5a", at(5, 0.12), 0.4);
IN("#st-5b", at(5, 0.25), 0.4);
tl.fromTo("#st-5a", { rotation: 0 }, { rotation: -30, svgOrigin: "750 655", duration: 0.4, repeat: 1, yoyo: true, immediateRender: false }, at(5, 0.4));
tl.to("#st-5b rect", { stroke: "#F0B90B", duration: 0.4 }, at(5, 0.48));
IN("#st-6a", at(5, 0.6), 0.4); IN("#st-6b", at(5, 0.66), 0.4);
IN("#st-6c", at(5, 0.76), 0.4, { scale: 1.5, svgOrigin: "1760 655" }, { scale: 1, svgOrigin: "1760 655" });

// L6 read vs write

IN("#st-Lx", at(6, 0.22), 0.3);

IN("#st-Lv, #st-Ll", at(6, 0.38), 0.4);
IN("#st-Rt", at(6, 0.5), 0.4);

IN("#st-Rc2", at(6, 0.66), 0.4, { y: 20 }, { y: 0 });
