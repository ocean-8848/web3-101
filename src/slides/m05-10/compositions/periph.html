    (function () {

      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const FLOW = (t, col) => {
  for (let k = 0; k < 3; k++) {
    const s = t + k * 0.45;
    if (col) tl.set(`#pe-d${k}, #pe-e${k}`, { attr: { fill: col } }, s);
    tl.fromTo(`#pe-d${k}`, { opacity: 1, x: 0 }, { x: 700, duration: 0.9, ease: "none", immediateRender: false }, s);
    tl.set(`#pe-d${k}`, { opacity: 0 }, s + 0.9);
    tl.fromTo(`#pe-e${k}`, { opacity: 1, x: 0, y: 0 }, { x: 306, y: 44, duration: 0.6, ease: "none", immediateRender: false }, s + 0.95);
    tl.set(`#pe-e${k}`, { opacity: 0 }, s + 1.55);
  }
};
const PULSE = (k, t) => {
  tl.fromTo(`#pe-p${k}`, { opacity: 1, attr: { cy: 940 } }, { attr: { cy: 425 }, duration: 0.9, ease: "power1.inOut", immediateRender: false }, t);
  tl.to(`#pe-p${k}`, { opacity: 0, duration: 0.2 }, t + 0.9);
};

IN("#pe-ne", at(2, 0.3), 0.5); ARROW("#pe-lne", at(2, 0.36), 0.5);

IN("#pe-hc", at(3, 0.08), 0.5);
IN("#pe-u0", at(3, 0.14), 0.4); IN("#pe-u1", at(3, 0.18), 0.4); IN("#pe-u2", at(3, 0.22), 0.4);
IN("#pe-tr", at(3, 0.26), 0.4);

ARROW("#pe-hw", at(3, 0.55), 0.3);

PULSE(1, at(3, 0.8));
// L4 separation
DRAW("#pe-rq1", at(4, 0.03), 0.5); ARROW("#pe-rq2", at(4, 0.08), 0.4);
FLOW(at(4, 0.12));
IN("#pe-rd2", at(4, 0.4), 0.4);

// L5 Redis down
OUT("#pe-key", at(5, 0), 0.3);
tl.to("#pe-rdb, #pe-rdt", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.05));

IN("#pe-x", at(5, 0.08), 0.3, { scale: 1.6, svgOrigin: "440 622" }, { scale: 1, svgOrigin: "440 622" });

tl.to("#pe-rq1, #pe-rq2", { stroke: "#83C167", duration: 0.4 }, at(5, 0.66));
IN("#pe-ok", at(5, 0.72), 0.4);
