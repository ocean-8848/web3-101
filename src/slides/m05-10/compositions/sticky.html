    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0
      IN("#sy-lost", at(0, 0.0), 0.8, { x: -760, y: 420 }, { x: 0, y: 0 });
      ["#sy-ln0", "#sy-ln1", "#sy-ln2", "#sy-ln3", "#sy-ln4"].forEach((s, i) => IN(s, at(0, 0.3 + i * 0.12), 0.5, { y: 20 }, { y: 0 }));

      ARROW("#sy-m1", at(1, 0.05), 0.7); IN("#sy-m1t", at(1, 0.1), 0.5);
      ARROW("#sy-m1s", at(1, 0.45), 0.6); IN("#sy-m1st", at(1, 0.5), 0.5);
      // L2
      ARROW("#sy-m2", at(2, 0.05), 0.9); IN("#sy-m2t", at(2, 0.1), 0.5);
      ARROW("#sy-m2r", at(2, 0.65), 0.9); IN("#sy-m2rt", at(2, 0.7), 0.5);
      // L3
      ARROW("#sy-m3", at(3, 0.05), 0.6); IN("#sy-m3t", at(3, 0.08), 0.4);
      IN("#sy-term", at(3, 0.1), 0.5);
      IN("#sy-card", at(3, 0.3), 0.6, { scale: 0.85, svgOrigin: "1160 630" }, { scale: 1, svgOrigin: "1160 630" });
      tl.fromTo("#sy-cv", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, at(3, 0.5));
      tl.fromTo("#sy-ct", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, at(3, 0.72));
      tl.set("#sy-cv, #sy-ct", { opacity: 0 }, at(3, 0.3));
      // L4
      ARROW("#sy-m4", at(4, 0.1), 0.9); IN("#sy-m4t", at(4, 0.2), 0.5);
      OUT("#sy-term", at(4, 0.9), 0.4);
      // L5 second round
      OUT("#sy-r1", at(5, 0.0), 0.4);
      ARROW("#sy-n1", at(5, 0.05), 0.6); IN("#sy-n1t", at(5, 0.08), 0.4);
      ARROW("#sy-n2", at(5, 0.25), 0.5); IN("#sy-n2t", at(5, 0.27), 0.4);
      tl.to("#sy-cardr", { strokeWidth: 5, duration: 0.3, yoyo: true, repeat: 1 }, at(5, 0.3));
      ARROW("#sy-n3", at(5, 0.36), 0.5); IN("#sy-n3t", at(5, 0.38), 0.4);
      ARROW("#sy-n4", at(5, 0.5), 0.7); IN("#sy-n4t", at(5, 0.52), 0.4);
      ARROW("#sy-n5", at(5, 0.68), 0.7); IN("#sy-n5t", at(5, 0.7), 0.4);
      ARROW("#sy-n6", at(5, 0.8), 0.5); IN("#sy-n6t", at(5, 0.82), 0.4);
      IN("#sy-n6c", at(5, 0.88), 0.5, { y: 10 }, { y: 0 });
      // L6 async broadcast replies
      OUT("#sy-r2", at(6, 0.0), 0.4);
      ARROW("#sy-k1", at(6, 0.05), 0.7);
      IN("#sy-k2", at(6, 0.12), 0.4, { scale: 0.6, svgOrigin: "1160 812" }, { scale: 1, svgOrigin: "1160 812" });
      IN("#sy-k3", at(6, 0.22), 0.4, { scale: 0.6, svgOrigin: "1160 860" }, { scale: 1, svgOrigin: "1160 860" });
      IN("#sy-ctr", at(6, 0.45), 0.5);
      tl.to("#sy-k2o", { x: -360, y: 110, opacity: 0, duration: 0.6, ease: "power2.in" }, at(6, 0.6));
      tl.to("#sy-k3o", { x: -360, y: 62, opacity: 0, duration: 0.6, ease: "power2.in" }, at(6, 0.7));
      COUNT("#sy-ctrn", 0, 1, at(6, 0.66), 0.2); COUNT("#sy-ctrn", 1, 2, at(6, 0.76), 0.2);
      // L7 front-running risk
      OUT("#sy-r3", at(7, 0.0), 0.4);
      OUT("#sy-card", at(7, 0.0), 0.4);
      tl.to("#sy-hA", { stroke: "#FC6255", duration: 0.4 }, at(7, 0.05));
      IN("#sy-tx", at(7, 0.08), 0.5, { x: -200 }, { x: 0 });
      IN("#sy-eye", at(7, 0.2), 0.5, { scale: 0.4, svgOrigin: "1465 400" }, { scale: 1, svgOrigin: "1465 400" });
      IN("#sy-eyet", at(7, 0.26), 0.4);
      ARROW("#sy-pa", at(7, 0.6), 0.6); IN("#sy-pat", at(7, 0.62), 0.4);
      IN("#sy-pool", at(7, 0.7), 0.6, { x: 40 }, { x: 0 });


      tl.to("#sy-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#sy-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);

    })();
