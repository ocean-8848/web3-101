  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const HL = (line, n, t) => { const y = 262 + line * 41 - 30; tl.to("#sc-hl", { attr: { y: y, height: 41 * n }, duration: 0.4, ease: "power2.inOut" }, t); };
      tl.set("#sc-hl", { attr: { y: 232 } }, 0);
      // L0
      IN("#sc-title", at(0, 0.0), 0.5, { x: -30 }, { x: 0 });
      ["#sc-t0", "#sc-t1", "#sc-t2", "#sc-t3"].forEach((s, i) => IN(s, at(0, 0.15 + i * 0.15), 0.45, { y: 16 }, { y: 0 }));
      ARROW("#sc-fk", at(0, 0.8), 0.4);
      // L1 api_keys
      IN("#sc-panel", at(1, 0.0), 0.5);
      IN("#sc-k1", at(1, 0.03), 0.6);
      tl.to("#sc-t0r", { strokeWidth: 5, duration: 0.3 }, at(1, 0.03));
      IN("#sc-hl", at(1, 0.15), 0.3); HL(1, 2, at(1, 0.15));
      IN("#sc-n1", at(1, 0.2), 0.5); IN("#sc-n2", at(1, 0.3), 0.5);
      IN("#sc-pk", at(1, 0.3), 0.4);
      ARROW("#sc-ha1", at(1, 0.42), 0.3); IN("#sc-fun", at(1, 0.46), 0.4);
      ARROW("#sc-ha2", at(1, 0.56), 0.3); IN("#sc-hv", at(1, 0.6), 0.4, { scale: 0.7, svgOrigin: "1520 774" }, { scale: 1, svgOrigin: "1520 774" });
      IN("#sc-px", at(1, 0.75), 0.3); IN("#sc-pxt", at(1, 0.77), 0.3);
      tl.to("#sc-pk", { opacity: 0.25, duration: 0.4 }, at(1, 0.8));
      // L2 why hash only: leak-safe, hash then lookup
      tl.to("#sc-hv", { scale: 1.12, svgOrigin: "1520 774", duration: 0.3, repeat: 1, yoyo: true }, at(2, 0.08));
      IN("#sc-lk", at(2, 0.12), 0.5, { y: 12 }, { y: 0 });
      OUT("#sc-px, #sc-pxt", at(2, 0.5), 0.3);
      tl.to("#sc-pk", { opacity: 1, duration: 0.3 }, at(2, 0.55));
      tl.to("#sc-fun", { scale: 1.1, svgOrigin: "1520 643", duration: 0.3, repeat: 1, yoyo: true }, at(2, 0.62));
      IN("#sc-lk2", at(2, 0.6), 0.5, { y: 12 }, { y: 0 });
      HL(2, 1, at(2, 0.78));
      tl.to("#sc-t0r", { stroke: "#83C167", duration: 0.3, repeat: 1, yoyo: true }, at(2, 0.82));
      // L3 quotas
      HL(3, 5, at(3, 0.05));
      OUT("#sc-n1, #sc-n2", at(3, 0.05), 0.3);
      IN("#sc-n3", at(3, 0.25), 0.4); IN("#sc-n4", at(3, 0.45), 0.4); IN("#sc-n5", at(3, 0.7), 0.4);
      // L4 method_weights + CU
      OUT("#sc-title", at(4, 0.0), 0.3);
      OUT("#sc-k1, #sc-hl, #sc-n3, #sc-n4, #sc-n5, #sc-hash", at(4, 0.0), 0.35);
      tl.to("#sc-t0r", { strokeWidth: 2.5, duration: 0.3 }, at(4, 0.0));
      tl.to("#sc-t2r", { strokeWidth: 5, duration: 0.3 }, at(4, 0.05));
      IN("#sc-term", at(4, 0.06), 0.5);
      IN("#sc-k2", at(4, 0.08), 0.5);
      IN("#sc-hl", at(4, 0.2), 0.3); HL(2, 1, at(4, 0.2));
      [0, 1, 2].forEach(i => IN(`#sc-b${i}l`, at(4, 0.45 + i * 0.12), 0.3));
      [[0, 1, 1250], [1, 5, 1350], [2, 20, 1752]].forEach(([i, v, nx]) => { IN(`#sc-b${i}`, at(4, 0.5 + i * 0.12), 0.1); tl.to(`#sc-b${i}`, { attr: { width: v * 25 }, duration: 0.6, ease: "power2.out" }, at(4, 0.5 + i * 0.12)); IN(`#sc-b${i}n`, at(4, 0.56 + i * 0.12), 0.3); });
      IN("#sc-bx", at(4, 0.88), 0.4);
      // L5 usage_daily
      OUT("#sc-term", at(5, 0.0), 0.4);
      OUT("#sc-k2, #sc-hl, #sc-bars", at(5, 0.0), 0.35);
      tl.to("#sc-t2r", { strokeWidth: 2.5, duration: 0.3 }, at(5, 0.0));
      tl.to("#sc-t1r", { strokeWidth: 5, duration: 0.3 }, at(5, 0.05));
      IN("#sc-k3", at(5, 0.06), 0.5);
