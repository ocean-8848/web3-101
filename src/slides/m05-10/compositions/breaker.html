      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0
      IN("#br-term", at(0, 0.02), 0.5);
      IN("#br-icon", at(0, 0.15), 0.6);
      tl.to("#br-lever", { y: 80, duration: 0.25, ease: "power3.in" }, at(0, 0.5));

      IN("#br-trip", at(0, 0.56), 0.3);
      tl.to("#br-lever", { y: 0, duration: 0.4, ease: "power2.inOut" }, at(0, 0.85));
      tl.to("#br-lever rect", { fill: "#83C167", duration: 0.2 }, at(0, 0.88));
      OUT("#br-trip", at(0, 0.85), 0.3);
      OUT("#br-term", at(0, 0.95), 0.4);
      // L1
      OUT("#br-icon", at(1, 0.0), 0.4);
      IN("#br-c0", at(1, 0.15), 0.6, { scale: 0.6, svgOrigin: "520 520" }, { scale: 1, svgOrigin: "520 520" });
      IN("#br-c1", at(1, 0.4), 0.6, { scale: 0.6, svgOrigin: "1400 520" }, { scale: 1, svgOrigin: "1400 520" });
      IN("#br-c2", at(1, 0.65), 0.6, { scale: 0.6, svgOrigin: "960 860" }, { scale: 1, svgOrigin: "960 860" });
      // L2
      ARROW("#br-a0", at(2, 0.1), 0.8); IN("#br-a0t", at(2, 0.15), 0.5);
      ARROW("#br-a1", at(2, 0.65), 0.8); IN("#br-a1t", at(2, 0.7), 0.5);
      // L3
      ARROW("#br-a2", at(3, 0.02), 0.6); IN("#br-a2t", at(3, 0.05), 0.4);
      COUNT("#br-cd", 0, 30, at(3, 0.08), 2.4);
      ARROW("#br-a3", at(3, 0.4), 0.6); IN("#br-a3t", at(3, 0.42), 0.4);
      [0,1,2,3,4].forEach(i => IN("#br-d" + i, at(3, 0.42), 0.3));
      [0,1,2,3,4].forEach(i => tl.to("#br-d" + i, { fill: "#83C167", duration: 0.15 }, at(3, 0.47 + i * 0.04)));
      ARROW("#br-a4", at(3, 0.78), 0.5); IN("#br-a4t", at(3, 0.8), 0.4);
      // L4 minimum requests
      OUT("#br-sm", at(4, 0.0), 0.5);
      IN("#br-one", at(4, 0.15), 0.5, { y: -30 }, { y: 0 });
      IN("#br-onet", at(4, 0.3), 0.5);
      IN("#br-gate", at(4, 0.58), 0.5, { y: -40 }, { y: 0 });
      IN("#br-gatet", at(4, 0.62), 0.4);
      tl.to("#br-one", { x: -100, duration: 0.5, ease: "power2.in" }, at(4, 0.72));
      tl.to("#br-one", { x: -60, duration: 0.4, ease: "back.out(3)" }, at(4, 0.72) + 0.5);
