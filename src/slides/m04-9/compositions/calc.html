  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const BLUE = "#58C4DD", GOLD = "#F0B90B", RED = "#FC6255", ORG = "#FF9F43", GRN = "#83C167", PUR = "#B48EF0", GRAY = "#8a8f99", TXT = "#e8e6df";
      // 术语卡：淡入，停留到 t1 淡出
      const TERM = (s, t0, t1) => { IN(s, t0, 0.5); OUT(s, t1, 0.4); };
      // 轻微呼吸，避免长时间静止（有限次重复）
      const PULSE = (s, t, n = 3, d = 0.7, o = 0.55) => tl.to(s, { opacity: o, duration: d, yoyo: true, repeat: n * 2 - 1, ease: "sine.inOut" }, t);
      const TO = (s, t, v, d = 0.4) => tl.to(s, { duration: d, ease: "power2.out", ...v }, t);

      // L0 这些秒数为什么要紧？目标 99.95%
      IN("#ca-c10", at(0, 0.04), 0.5, { y: 14 }, { y: 0 }); IN("#ca-c30", at(0, 0.12), 0.5, { y: 14 }, { y: 0 });
      PULSE(["#ca-c10", "#ca-c30"], at(0, 0.25), 1, 0.35, 0.5);
      OUT(["#ca-c10", "#ca-c30"], at(0, 0.5), 0.4);
      IN("#ca-ti", at(0, 0.6), 0.6, { scale: 0.85, svgOrigin: "960 190" }, { scale: 1, svgOrigin: "960 190" });
      // L1 365 × 24 × 60 = 525,600 分钟
      IN("#ca-a0", at(1, 0.1), 0.4); IN("#ca-a1", at(1, 0.22), 0.4); IN("#ca-a2", at(1, 0.36), 0.4);
      IN(["#ca-a3", "#ca-a4"], at(1, 0.55), 0.4);
      COUNT("#ca-a3n", 0, 525600, at(1, 0.55), 1.2, v => Math.round(v).toLocaleString("en-US"));
      // L2 × 0.05% ≈ 262.8 分钟 ≈ 4.4 小时
      IN("#ca-b0", at(2, 0.05), 0.5);
      IN("#ca-b1", at(2, 0.3), 0.5);
      IN("#ca-b2", at(2, 0.6), 0.5);
      IN(["#ca-bo", "#ca-bl"], at(2, 0.72), 0.4);
      IN("#ca-bar", at(2, 0.74), 0.8, { scaleX: 0, svgOrigin: "260 620" }, { scaleX: 1, svgOrigin: "260 620" });
      // L3 撮合切换只吃掉 0.8%
      IN("#ca-sl", at(3, 0.15), 0.4, { scaleX: 0, svgOrigin: "260 620" }, { scaleX: 1, svgOrigin: "260 620" });
      PULSE("#ca-sl", at(3, 0.25), 2, 0.3, 0.3);
      IN("#ca-sll", at(3, 0.3), 0.3); IN("#ca-slt", at(3, 0.34), 0.5, { y: 10 }, { y: 0 });
      // L4 两次手工恢复吃掉几乎全部预算
      TO("#ca-slt", at(3, 0.72), { fill: "#83C167" }, 0.5);
      OUT(["#ca-sll", "#ca-slt"], at(4, 0.0), 0.3);
      IN("#ca-r0", at(4, 0.2), 0.6, { scaleX: 0, svgOrigin: "271 620" }, { scaleX: 1, svgOrigin: "271 620" });
      IN("#ca-r1", at(4, 0.45), 0.6, { scaleX: 0, svgOrigin: "910 620" }, { scaleX: 1, svgOrigin: "910 620" });
      IN("#ca-used", at(4, 0.7), 0.5, { y: 10 }, { y: 0 });
      PULSE("#ca-used", at(4, 0.8), 1, 0.3, 0.5);
      // L5 99.99%：52.6 分钟；两次 30 分钟就超出 → 自动故障转移
      OUT(["#ca-r0", "#ca-r1", "#ca-used", "#ca-sl", "#ca-ti", "#ca-bl"], at(5, 0.0), 0.35);
      IN("#ca-ti2", at(5, 0.05), 0.5);
      OUT(["#ca-b0", "#ca-b1", "#ca-b2"], at(5, 0.0), 0.3);
      IN("#ca-b0n", at(5, 0.1), 0.4); IN("#ca-b1n", at(5, 0.16), 0.4);
      tl.to(["#ca-bar", "#ca-bo"], { attr: { width: 280 }, duration: 0.9, ease: "power2.inOut" }, at(5, 0.1));
      IN("#ca-bl2", at(5, 0.2), 0.4);
      IN("#ca-s0", at(5, 0.36), 0.4, { scaleX: 0, svgOrigin: "260 620" }, { scaleX: 1, svgOrigin: "260 620" });
      IN("#ca-s1", at(5, 0.44), 0.4, { scaleX: 0, svgOrigin: "420 620" }, { scaleX: 1, svgOrigin: "420 620" });
      TO("#ca-bo", at(5, 0.48), { stroke: RED }, 0.2);
      IN("#ca-over", at(5, 0.5), 0.3, { scale: 1.4, svgOrigin: "646 620" }, { scale: 1, svgOrigin: "646 620" });
      OUT(["#ca-s0", "#ca-s1", "#ca-over"], at(5, 0.7), 0.4);
      TO("#ca-bo", at(5, 0.72), { stroke: GOLD }, 0.3);
      [0, 1, 2].forEach(i => IN(`#ca-gr${i}`, at(5, 0.74) + i * 0.15, 0.25, { scaleY: 0, svgOrigin: `${275 + i * 34} 620` }, { scaleY: 1, svgOrigin: `${275 + i * 34} 620` }));
