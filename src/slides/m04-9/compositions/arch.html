  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const BLUE = "#58C4DD", GOLD = "#F0B90B", RED = "#FC6255", ORG = "#FF9F43", GRN = "#83C167", PUR = "#B48EF0", GRAY = "#8a8f99", TXT = "#e8e6df";
      // 术语卡：淡入，停留到 t1 淡出
      const TERM = (s, t0, t1) => { IN(s, t0, 0.5); OUT(s, t1, 0.4); };
      // 轻微呼吸，避免长时间静止（有限次重复）
      const PULSE = (s, t, n = 3, d = 0.7, o = 0.55) => tl.to(s, { opacity: o, duration: d, yoyo: true, repeat: n * 2 - 1, ease: "sine.inOut" }, t);
      const TO = (s, t, v, d = 0.4) => tl.to(s, { duration: d, ease: "power2.out", ...v }, t);

      const DOT = (s, a, b, t, n) => tl.fromTo(s, { attr: { cx: a[0], cy: a[1] } }, { attr: { cx: b[0], cy: b[1] }, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: n, immediateRender: false }, t);
      // L0 GSLB + 两个机房 + 健康检查
      IN("#ar-gslb", at(0, 0.03), 0.6, { y: -20 }, { y: 0 });
      ARROW("#ar-a1", at(0, 0.15)); ARROW("#ar-a2", at(0, 0.2));
      IN("#ar-za", at(0, 0.3)); IN("#ar-zb", at(0, 0.36));
      IN(["#ar-d1", "#ar-d2"], at(0, 0.42), 0.3);
      DOT("#ar-d1", [860, 282], [524, 324], at(0, 0.42), 9);
      DOT("#ar-d2", [1060, 282], [1396, 324], at(0, 0.42), 9);
      // L1 无状态服务，双活，坏一个换一个
      for (let i = 0; i < 5; i++) { IN(`#ar-sa${i}`, at(1, 0.04) + i * 0.12, 0.4, { y: 16 }, { y: 0 }); IN(`#ar-sb${i}`, at(1, 0.12) + i * 0.12, 0.4, { y: 16 }, { y: 0 }); }
      IN(["#ar-la", "#ar-lb"], at(1, 0.3));
      IN(["#ar-sta", "#ar-stb"], at(1, 0.42));
      OUT(["#ar-d1", "#ar-d2"], at(1, 0.5), 0.3);
      TO("#ar-sb2r", at(1, 0.72), { stroke: RED }, 0.2);
      TO("#ar-sb2", at(1, 0.76), { opacity: 0.25 }, 0.4);
      IN("#ar-sb5", at(1, 0.8), 0.4, { y: 16 }, { y: 0 });
      ARROW("#ar-mv", at(1, 0.8), 0.5);
      OUT(["#ar-sta", "#ar-stb"], at(1, 0.86), 0.25);
      IN(["#ar-sta2", "#ar-stb2"], at(1, 0.9), 0.4);
      // L2 有状态：撮合 + 账本，只在 A 写
      OUT("#ar-mv", at(2, 0.02), 0.3);
      IN("#ar-me", at(2, 0.12), 0.5, { y: 20 }, { y: 0 });
      IN("#ar-db", at(2, 0.3), 0.5, { y: 20 }, { y: 0 });
      PULSE(["#ar-mer", "#ar-dbr"], at(2, 0.5), 1, 0.35, 0.4);
      IN("#ar-rep", at(2, 0.7)); IN("#ar-mb", at(2, 0.78));
      // L3 同步复制
      TERM("#ar-term", at(3, 0.02), at(4, 0.0));
      DRAW("#ar-rl", at(3, 0.15), 0.5);
      IN("#ar-pk", at(3, 0.3), 0.2);
      tl.fromTo("#ar-pk", { x: 0 }, { x: 190, duration: 0.9, ease: "power1.inOut", immediateRender: false }, at(3, 0.32));
      OUT("#ar-pk", at(3, 0.32) + 0.9, 0.2);
      IN("#ar-ack", at(3, 0.5), 0.2);
      tl.fromTo("#ar-ack", { x: 0 }, { x: -170, duration: 0.9, ease: "power1.inOut", immediateRender: false }, at(3, 0.53));
      OUT("#ar-ack", at(3, 0.53) + 0.9, 0.2);
      IN("#ar-cm", at(3, 0.8), 0.4, { y: 10 }, { y: 0 });
      // L4 A 断电，数据一条不丢，RPO = 0
      OUT("#ar-cm", at(4, 0.0), 0.3);
      TO("#ar-A", at(4, 0.05), { opacity: 0.25 }, 0.5);
      IN("#ar-bolt", at(4, 0.07), 0.3, { scale: 1.5, svgOrigin: "856 385" }, { scale: 1, svgOrigin: "856 385" });
      PULSE("#ar-repr", at(4, 0.2), 3, 0.5, 0.4);
      TERM("#ar-term2", at(4, 0.5), at(5, 0.6));
      IN("#ar-rpo", at(4, 0.76), 0.6, { scale: 0.8, svgOrigin: "1220 595" }, { scale: 1, svgOrigin: "1220 595" });
      // L5 Kafka 跨机房复制 + 异地冷备
      // L5 对比：异步复制 / 每日备份
      OUT("#ar-rpo", at(5, 0.0), 0.3);
      IN("#ar-pk2", at(5, 0.08), 0.2);
