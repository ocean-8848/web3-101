    (function () {

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const BLUE = "#58C4DD", GOLD = "#F0B90B", RED = "#FC6255", ORG = "#FF9F43", GRN = "#83C167", PUR = "#B48EF0", GRAY = "#8a8f99", TXT = "#e8e6df";
      // 术语卡：淡入，停留到 t1 淡出
      const TERM = (s, t0, t1) => { IN(s, t0, 0.5); OUT(s, t1, 0.4); };
      // 轻微呼吸，避免长时间静止（有限次重复）
      const PULSE = (s, t, n = 3, d = 0.7, o = 0.55) => tl.to(s, { opacity: o, duration: d, yoyo: true, repeat: n * 2 - 1, ease: "sine.inOut" }, t);
      const TO = (s, t, v, d = 0.4) => tl.to(s, { duration: d, ease: "power2.out", ...v }, t);

      // L0 撮合与账本，中间红色闪电

      TERM("#dr-term", at(1, 0.03), at(2, 0.3));
      IN("#dr-sw", at(1, 0.4), 0.5, { scale: 0.7, svgOrigin: "1680 330" }, { scale: 1, svgOrigin: "1680 330" });
      tl.to("#dr-swh", { rotation: 720, svgOrigin: "1680 330", duration: 7, ease: "none" }, at(1, 0.45));

      OUT(["#dr-l0", "#dr-sw"], at(2, 0.0), 0.4);

      const flow = (i, t) => { IN(`#dr-o${i}`, t, 0.2); tl.to(`#dr-o${i}`, { x: 870, duration: 1.6, ease: "none" }, t + 0.2); OUT(`#dr-o${i}`, t + 1.7, 0.15); };
      flow(0, at(2, 0.12)); flow(1, at(2, 0.25)); flow(2, at(2, 0.38));
      IN("#dr-disk", at(2, 0.16), 0.3, { scale: 1.4, svgOrigin: "445 368" }, { scale: 1, svgOrigin: "445 368" });
      IN("#dr-mp", at(2, 0.3), 0.5); IN("#dr-lease", at(2, 0.34), 0.4); ARROW("#dr-f1", at(2, 0.3), 0.5);
      IN("#dr-mb", at(2, 0.5), 0.5); ARROW("#dr-f2", at(2, 0.5), 0.5);
      const fork = (i, t, up) => { IN(`#dr-fd${i}`, t, 0.1); tl.fromTo(`#dr-fd${i}`, { attr: { cx: 1084, cy: 425 } }, { attr: { cx: 1268, cy: up ? 320 : 540 }, duration: 0.5, ease: "none", immediateRender: false }, t); OUT(`#dr-fd${i}`, t + 0.5, 0.1); };
