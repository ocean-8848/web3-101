  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
      const RED = "#FC6255", GRN = "#83C167", ORG = "#FF9F43", GOLD = "#F0B90B", BLUE = "#58C4DD", PUR = "#B48EF0", GRAY = "#8a8f99", TXT = "#e8e6df";
      const POP = (s, t, o, d = 0.45) => IN(s, t, d, { scale: 0.6, svgOrigin: o }, { scale: 1, svgOrigin: o, ease: "back.out(1.7)" });
      const UP = (s, t, d = 0.6) => IN(s, t, d, { y: 18 }, { y: 0 });
      const TO = (s, t, props, d = 0.4) => tl.to(s, { duration: d, ...props }, t);
      const CUT = (id, t) => { OUT("#" + id, t, 0.3); IN("#" + id + "g", t + 0.15, 0.4); };

      // L0 未演练会失效 → 混沌工程
      UP("#ch-doc", at(0, 0.03));
      DRAW("#ch-crack", at(0, 0.14), 0.5); UP("#ch-fail", at(0, 0.17));
      ["#ch-doc", "#ch-crack", "#ch-fail"].forEach(s => OUT(s, at(0, 0.46), 0.4));
      IN("#ch-term", at(0, 0.5), 0.5);
      IN("#ch-bench", at(0, 0.55), 0.6); UP("#ch-bl0", at(0, 0.6));
      [0, 1, 2, 3].forEach(i => UP(`#ch-ph${i}`, at(0, 0.62) + i * 0.18));
      POP("#ch-hyp", at(0, 0.8), "1550 342");
      OUT(["#ch-ph0", "#ch-ph1", "#ch-ph2", "#ch-ph3"], at(0, 0.96), 0.3);
      OUT("#ch-term", at(1, 0.22), 0.5);
      // L1 杀撮合主；断账本主库网络
      UP("#ch-mm", at(1, 0.02)); UP("#ch-mb", at(1, 0.04));
      POP("#ch-bolt", at(1, 0.1), "520 420"); UP("#ch-kill", at(1, 0.11));
      TO("#ch-mmr", at(1, 0.15), { stroke: GRAY, opacity: 0.5 });
      TO("#ch-mbr", at(1, 0.24), { stroke: ORG, strokeDasharray: "none" }); UP("#ch-tm", at(1, 0.25));
      IN("#ch-sqh", at(1, 0.3), 0.4);
      [0, 1, 2].forEach(i => { UP(`#ch-sq${i}`, at(1, 0.32) + i * 0.4); POP(`#ch-sk${i}`, at(1, 0.34) + i * 0.4 + 0.2, `900 ${490 + i * 50}`); });
      UP("#ch-sql", at(1, 0.48));
      UP("#ch-lm", at(1, 0.55)); UP("#ch-ls", at(1, 0.57)); POP("#ch-p0", at(1, 0.58), "1360 470");
      DRAW("#ch-net", at(1, 0.6), 0.5); IN("#ch-sw", at(1, 0.6));
      POP("#ch-cut", at(1, 0.7), "1480 470"); TO("#ch-net", at(1, 0.7), { stroke: RED });
      OUT("#ch-p0", at(1, 0.74), 0.3); TO("#ch-lmr", at(1, 0.74), { opacity: 0.4 });
      POP("#ch-p1", at(1, 0.8), "1360 650"); UP("#ch-one", at(1, 0.86));
      // L2 KYT 延迟；推送网关 CPU 打满
      ["#ch-mm", "#ch-mb", "#ch-bolt", "#ch-kill", "#ch-tm", "#ch-sqh", "#ch-sq0", "#ch-sq1", "#ch-sq2", "#ch-sk0", "#ch-sk1", "#ch-sk2", "#ch-sql",
       "#ch-lm", "#ch-ls", "#ch-p1", "#ch-net", "#ch-sw", "#ch-cut", "#ch-one"].forEach(s => OUT(s, at(2, 0), 0.35));
      UP("#ch-wd", at(2, 0.04)); ARROW("#ch-b1", at(2, 0.06), 0.3); UP("#ch-kyt", at(2, 0.08));
      ARROW("#ch-b2", at(2, 0.1), 0.3); UP("#ch-auto", at(2, 0.12));
      UP("#ch-5s", at(2, 0.16)); TO("#ch-kytr", at(2, 0.18), { stroke: ORG });
      CUT("ch-b2", at(2, 0.27)); TO("#ch-auto", at(2, 0.27), { opacity: 0.4 });
      ARROW("#ch-b3", at(2, 0.32), 0.4); UP("#ch-man", at(2, 0.36));
      UP("#ch-gA", at(2, 0.5)); UP("#ch-gB", at(2, 0.52));
      IN("#ch-cl", at(2, 0.53)); UP("#ch-cll", at(2, 0.54)); DRAW("#ch-lA", at(2, 0.56), 0.4);
      IN("#ch-th", at(2, 0.62), 0.3); UP("#ch-cpu", at(2, 0.63));
      tl.to("#ch-thf", { attr: { y: 386, height: 60 }, duration: 0.8, ease: "power2.in" }, at(2, 0.64));
      TO("#ch-gAr", at(2, 0.7), { stroke: RED });

      ["#ch-wd", "#ch-b1", "#ch-kyt", "#ch-b2g", "#ch-auto", "#ch-b3", "#ch-man", "#ch-5s", "#ch-gA", "#ch-gB", "#ch-th", "#ch-cpu", "#ch-cl", "#ch-cll", "#ch-lB"].forEach(s => OUT(s, at(3, 0), 0.35));

      TO("#ch-bench", at(3, 0.1), { stroke: ORG });
