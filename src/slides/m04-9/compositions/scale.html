    (function () {

      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const BLUE = "#58C4DD", GOLD = "#F0B90B", RED = "#FC6255", ORG = "#FF9F43", GRN = "#83C167", PUR = "#B48EF0", GRAY = "#8a8f99", TXT = "#e8e6df";

      // 轻微呼吸，避免长时间静止（有限次重复）

      const TO = (s, t, v, d = 0.4) => tl.to(s, { duration: d, ease: "power2.out", ...v }, t);

      DRAW("#sc-cu2", at(0, 0.62), 1.4);
      OUT("#sc-i5", at(0, 0.8), 0.4); OUT("#sc-i4", at(0, 0.86), 0.4);

      IN("#sc-ms", at(1, 0.06), 0.5, { y: -20 }, { y: 0 });
      [0, 1, 2].forEach(i => { ARROW(`#sc-ra${i}`, at(1, 0.22) + i * 0.15, 0.5); IN(`#sc-r${i}`, at(1, 0.28) + i * 0.15, 0.5); });

      // L2 分库分表：主库裂成四个分片
      OUT(["#sc-l1", "#sc-sy"], at(2, 0.0), 0.4);
      OUT("#sc-ms", at(2, 0.12), 0.4);
      [400, 760, 1120, 1480].forEach((x, i) => {
        IN(`#sc-s${i}`, at(2, 0.14), 0.5);
        tl.fromTo(`#sc-sm${i}`, { x: 960 - x, y: -260 }, { x: 0, y: 0, duration: 0.9, ease: "power3.out", immediateRender: false }, at(2, 0.14));
      });
      IN("#sc-fn", at(2, 0.34), 0.5, { y: -20 }, { y: 0 });
      IN(["#sc-u0", "#sc-u1", "#sc-u2", "#sc-u3"], at(2, 0.42), 0.3);
      [400, 760, 1120, 1480].forEach((x, i) => {
        const t = at(2, 0.48) + i * 0.75;
        tl.to(`#sc-u${i}`, { attr: { cx: 960, cy: 392 }, duration: 0.35, ease: "power1.in" }, t);

      // L3 同一用户的余额和流水在同一分片
      OUT("#sc-fn", at(3, 0.0), 0.4);
      IN("#sc-wang", at(3, 0.05)); IN("#sc-wn", at(3, 0.08));
      IN("#sc-cb", at(3, 0.25), 0.4, { y: -12 }, { y: 0 }); IN("#sc-cf", at(3, 0.3), 0.4, { y: -12 }, { y: 0 });
      tl.to(["#sc-cb", "#sc-cf"], { y: 140, opacity: 0, duration: 0.7, ease: "power2.in" }, at(3, 0.52));
      TO("#sc-sc1", at(3, 0.62), { opacity: 1 }, 0.01);

      // L4 成交有两方：分片 1 买家、分片 3 卖家
      OUT(["#sc-wang", "#sc-wn", "#sc-tx"], at(4, 0.0), 0.35);
      tl.to("#sc-sc1 path, #sc-sc1 ellipse", { stroke: BLUE, duration: 0.3 }, at(4, 0.0));

      IN("#sc-sel", at(4, 0.3), 0.5, { y: -16 }, { y: 0 }); IN("#sc-sn", at(4, 0.34));
