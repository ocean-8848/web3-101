        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
      const RED = "#FC6255", GRN = "#83C167", ORG = "#FF9F43", GOLD = "#F0B90B", BLUE = "#58C4DD", PUR = "#B48EF0", GRAY = "#8a8f99", TXT = "#e8e6df";

      const UP = (s, t, d = 0.6) => IN(s, t, d, { y: 18 }, { y: 0 });
      const TO = (s, t, props, d = 0.4) => tl.to(s, { duration: d, ...props }, t);
      const CUT = (id, t) => { OUT("#" + id, t, 0.3); IN("#" + id + "g", t + 0.15, 0.4); };

      // L0 告警 → 确认 → 定级
      UP("#in-f0", at(0, 0.05));
      ARROW("#in-a0", at(0, 0.38), 0.4); UP("#in-f1", at(0, 0.42));

      // L1 P0、P1
      IN("#in-th", at(1, 0.02), 0.5);
      const ROW = (i, li, f) => { UP(`#in-r${i}`, at(li, f[0])); IN(`#in-r${i}d`, at(li, f[1]), 0.4); IN(`#in-r${i}r`, at(li, f[2]), 0.4); IN(`#in-r${i}e`, at(li, f[3]), 0.4); };
      ROW(0, 1, [0.06, 0.1, 0.27, 0.36]);
      ROW(1, 1, [0.52, 0.56, 0.76, 0.84]);
      // L2 P2、P3、SLA

      ROW(3, 2, [0.36, 0.39, 0.48, 0.54]);
      IN("#in-ex", at(2, 0.6), 0.4);
      POP("#in-sla", at(2, 0.78), "340 370");
      // L3 P0 先止损
      ["#in-th", "#in-r1", "#in-r2", "#in-r3", "#in-sla", "#in-ex"].forEach(s => OUT(s, at(3, 0), 0.4));
