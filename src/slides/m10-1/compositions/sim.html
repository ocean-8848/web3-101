    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
// L0
IN("#si-term", at(0, 0.3), 0.5);
// L1 two reels, identical
IN("#si-L, #si-Ll", at(1, 0.04), 0.6, { x: -30 }, { x: 0 });

IN("#si-R, #si-Rl", at(1, 0.3), 0.6, { x: 30 }, { x: 0 });
IN("#si-eq", at(1, 0.62), 0.5, { scale: 0.5, svgOrigin: "960 410" }, { scale: 1, svgOrigin: "960 410" });
// L2 unroll the simulator reel, cut failures
for (let i = 0; i < 8; i++) IN("#si-u" + i, at(2, 0.04) + i * 0.12, 0.35, { y: -30 }, { y: 0 });
IN("#si-sc", at(2, 0.32), 0.3);
tl.to("#si-sc", { x: 1420, duration: 2.0, ease: "none" }, at(2, 0.36));
const bad = [1, 2, 4, 7], good = [0, 3, 5, 6];
bad.forEach(i => tl.to("#si-u" + i, { y: 120, opacity: 0, duration: 0.4, ease: "power2.in" }, at(2, 0.36) + 2.0 * (i * 175 + 210) / 1420));
OUT("#si-sc", at(2, 0.36) + 2.05, 0.3);
good.forEach((i, k) => tl.to("#si-u" + i, { x: (k - i) * 175, duration: 0.6, ease: "power2.inOut" }, at(2, 0.8)));
// L3 a recording convinces no third party
OUT("#si-L, #si-Ll, #si-R, #si-Rl, #si-eq", at(3, 0), 0.4);
IN("#si-obs", at(3, 0.1), 0.5, { x: 30 }, { x: 0 });

IN("#si-crowd", at(4, 0.08), 0.7, { scale: 0.8, svgOrigin: "1520 780" }, { scale: 1, svgOrigin: "1520 780" });
IN("#si-any", at(4, 0.3), 0.6, { y: 12 }, { y: 0 });


      tl.to("#si-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#si-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["sim"] = tl;
