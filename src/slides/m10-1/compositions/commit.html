      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      IN("#ct-card", at(0, 0.2), 0.5);

      DRAW("#ct-flap", at(0, 0.66), 0.7);
      OUT("#ct-term", at(1, 0.75), 0.5);

      IN("#ct-bind", at(1, 0.5), 0.5, { x: 20 }, { x: 0 });

      tl.to("#ct-fake", { x: -110, y: 60, duration: 0.6, ease: "power2.in" }, at(1, 0.66));

      IN("#ct-ra2, #ct-rb2", at(3, 0.8), 0.4);
      IN("#ct-ma2, #ct-mb2", at(3, 0.88), 0.4);
      // L4 skeleton flow

      IN("#ct-s1", at(4, 0.08), 0.5, { y: 20 }, { y: 0 });
      ARROW("#ct-a1", at(4, 0.16)); IN("#ct-s2", at(4, 0.2), 0.5, { y: 20 }, { y: 0 });

      tl.fromTo("#ct-cdot", { y: 0 }, { y: -40, duration: 0.8, ease: "power2.inOut", immediateRender: false }, at(4, 0.82));
