        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      // ===== 测验版式（同 EP009 quiz1）=====

        tl.to(`#q4-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);

        tl.to(`#q4-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);

      const WRONG = (k, t) => {
        tl.to(`#q4-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q4-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);

      };

      // L0 时间线：存款 → 池 → 新地址；Gas 细金线

      IN("#q4-new", at(0, 0.42), 0.5, { x: 20 }, { x: 0 });
      ARROW("#q4-a2", at(0, 0.45), 0.3);
      ARROW("#q4-gas", at(0, 0.7), 0.8);
      IN("#q4-gasl", at(0, 0.78), 0.4);
      // L3 揭晓 D；匿名集逐层熄灭
      RIGHT("D", at(3, 0.03));
      IN("#q4-dots", at(3, 0.08), 0.4);
      IN("#q4-chips", at(3, 0.08), 0.4);

      tl.to("#q4-c1", { fill: "#FF9F43", duration: 0.3 }, at(3, 0.47));
      tl.to("#q4-d1, #q4-d4, #q4-d9, #q4-d12, #q4-d15, #q4-d20", { fill: "#3a3f4a", duration: 0.4 }, at(3, 0.47) + 0.1);
      tl.to("#q4-c2", { fill: "#FF9F43", duration: 0.3 }, at(3, 0.64));
      tl.to("#q4-d6, #q4-d11, #q4-d22", { fill: "#3a3f4a", duration: 0.4 }, at(3, 0.64) + 0.1);
      tl.to("#q4-c3", { fill: "#FF9F43", duration: 0.3 }, at(3, 0.81));
      tl.to("#q4-d17", { fill: "#FC6255", duration: 0.4 }, at(3, 0.81) + 0.1);
      // L4 干扰项：Gas 线 = 签名

      OUT("#q4-oA, #q4-oB, #q4-oC, #q4-oD", at(5, 0.0), 0.4);
      OUT("#q4-gas, #q4-gasl", at(5, 0.04), 0.4);

      ARROW("#q4-rela", at(5, 0.18), 0.4);
      tl.to("#q4-dots circle", { fill: "#58C4DD", duration: 0.5, stagger: 0.02 }, at(5, 0.3));

      IN("#q4-big", at(5, 0.6), 0.6, { y: 10 }, { y: 0 });
