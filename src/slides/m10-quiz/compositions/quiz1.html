  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      const SHOW = (k, t) => {
        IN(`#qu-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#qu-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#qu-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#qu-pause", at(2, 0.0), 0.3);
        tl.fromTo("#qu-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#qu-pause", at(3, 0.0), 0.3);
      };
      const RIGHT = (k, t) => {
        tl.to(`#qu-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#qu-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#qu-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#qu-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#qu-o${k}-n`, t + 0.3, 0.5);
      };
      IN("#qu-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#qu-tag", at(0, 0.04), 0.4);
      IN("#qu-q1", at(0, 0.03), 0.01);
      IN("#qu-q2", at(0, 0.45), 0.01);
      tl.fromTo("#qu-qcr1", { attr: { width: 0 } }, { attr: { width: 1300 }, duration: 2.0, ease: "none" }, at(0, 0.05));
      tl.fromTo("#qu-qcr2", { attr: { width: 0 } }, { attr: { width: 1300 }, duration: 2.2, ease: "none" }, at(0, 0.46));
      // L0 右侧：c = hash(t)，y 与公开输入在哈希外
      IN("#qu-hb", at(0, 0.3), 0.5);
      IN("#qu-f1", at(0, 0.34), 0.5);
      IN("#qu-gy", at(0, 0.55), 0.5, { y: 20 }, { y: 0 });
      IN("#qu-gp", at(0, 0.66), 0.5, { y: 20 }, { y: 0 });
      tl.to("#qu-gy, #qu-gp", { opacity: 0.5, duration: 0.3, yoyo: true, repeat: 1 }, at(0, 0.85));

      // L1 选项
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.2)); SHOW("C", at(1, 0.42)); SHOW("D", at(1, 0.8));
      // L2 暂停
      PAUSE();
      // L3 揭晓 C：先挑挑战，再拼证明
      RIGHT("C", at(3, 0.04));
      tl.to("#qu-oA-dim, #qu-oB-dim, #qu-oD-dim", { opacity: 0.6, duration: 0.4 }, at(3, 0.06));
      tl.to("#qu-hb", { stroke: "#FF9F43", duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.2));
      IN("#qu-wl", at(3, 0.5), 0.4);
      IN("#qu-w1", at(3, 0.52), 0.4, { y: 10 }, { y: 0 });
      ARROW("#qu-wa1", at(3, 0.62), 0.3);
      IN("#qu-w2", at(3, 0.65), 0.4, { y: 10 }, { y: 0 });
      ARROW("#qu-wa2", at(3, 0.78), 0.3);
      IN("#qu-w3", at(3, 0.82), 0.4, { scale: 0.7, svgOrigin: "1750 810" }, { scale: 1, svgOrigin: "1750 810" });
      // L4 干扰项
      WRONG("A", at(4, 0.02));
      WRONG("B", at(4, 0.12));
      WRONG("D", at(4, 0.5));
      // L5 哈希框扩大，纳入 y 和公开输入，伪造失败；选项退场
      OUT("#qu-oA, #qu-oB, #qu-oC, #qu-oD", at(5, 0.0), 0.4);
      tl.to("#qu-hb", { attr: { x: 1190, y: 410, width: 600, height: 280 }, stroke: "#83C167", duration: 0.7, ease: "power2.inOut" }, at(5, 0.02));
      OUT("#qu-f1", at(5, 0.02), 0.3);
      tl.to("#qu-f2", { opacity: 1, duration: 0.4 }, at(5, 0.12));
      tl.to("#qu-gy-box, #qu-gp-box", { stroke: "#83C167", strokeDasharray: "none", duration: 0.4 }, at(5, 0.12));
      tl.to("#qu-w3-box", { fill: "#FC6255", duration: 0.4 }, at(5, 0.25));
      tl.to("#qu-w3-ok", { opacity: 0, duration: 0.3 }, at(5, 0.25));
      tl.to("#qu-w3-no", { opacity: 1, duration: 0.3 }, at(5, 0.3));
      IN("#qu-sum1", at(5, 0.08), 0.5, { x: -20 }, { x: 0 });
      IN("#qu-sum2", at(5, 0.3), 0.5);
      IN("#qu-sum3", at(5, 0.55), 0.5);

      tl.to("#qu-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz1"] = tl;
    })();
  </script>
