  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // ===== 测验版式（同 EP009 quiz1）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q3-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q3-q", at(0, 0.03), 0.01);
      tl.fromTo("#q3-qcr1", { attr: { width: 0 } }, { attr: { width: 1480 }, duration: 3.6, ease: "none" }, at(0, 0.04));
      tl.fromTo("#q3-qcr2", { attr: { width: 0 } }, { attr: { width: 1480 }, duration: 2.6, ease: "none" }, at(0, 0.04) + 3.6);
      const SHOW = (k, t) => {
        IN(`#q3-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q3-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q3-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.0);
      };
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.25)); SHOW("C", at(1, 0.5)); SHOW("D", at(1, 0.72));
      IN("#q3-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q3-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#q3-pause", at(3, 0.0), 0.3);
      OUT("#q3-badge", at(3, 0.0), 0.3);
      const RIGHT = (k, t) => {
        tl.to(`#q3-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q3-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q3-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q3-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q3-o${k}-n`, t + 0.3, 0.5);
      };

      // L0 验证合约：公开输入只有 S0、S1
      IN("#q3-pan", at(0, 0.35), 0.6, { x: 30 }, { x: 0 });
      IN("#q3-s0", at(0, 0.45), 0.4, { y: 10 }, { y: 0 });
      IN("#q3-s1", at(0, 0.55), 0.4, { y: 10 }, { y: 0 });
      IN("#q3-s2", at(0, 0.72), 0.5);
      IN("#q3-s2l", at(0, 0.78), 0.4);
      // L3 揭晓 B
      RIGHT("B", at(3, 0.03));
      tl.to("#q3-s0b, #q3-s1b", { strokeWidth: 6, duration: 0.3 }, at(3, 0.12));
      tl.to("#q3-s0b, #q3-s1b", { strokeWidth: 3, duration: 0.4 }, at(3, 0.3));
      IN("#q3-ex", at(3, 0.32), 0.5, { x: -20 }, { x: 0 });
      IN("#q3-pub", at(3, 0.5), 0.5, { x: 20 }, { x: 0 });
      IN("#q3-neq", at(3, 0.6), 0.4);
      IN("#q3-lost", at(3, 0.76), 0.5, { y: 10 }, { y: 0 });
      // L4 干扰项
      WRONG("A", at(4, 0.02));
      WRONG("C", at(4, 0.3));
      WRONG("D", at(4, 0.6));
      // L5 选项退场；数据被扣留 → 无法强制退出；数据承诺入公开输入后恢复
      OUT("#q3-oA, #q3-oB, #q3-oC, #q3-oD", at(5, 0.0), 0.4);
      OUT("#q3-ex, #q3-pub, #q3-neq, #q3-lost", at(5, 0.0), 0.4);
      IN("#q3-user", at(5, 0.06), 0.5);
      IN("#q3-xr", at(5, 0.12), 0.5, { x: -30 }, { x: 0 });
      IN("#q3-xlr", at(5, 0.2), 0.4);
      IN("#q3-xs", at(5, 0.3), 0.4);
      OUT("#q3-s2l, #q3-s2q", at(5, 0.5), 0.3);
      tl.to("#q3-s2b", { stroke: "#83C167", strokeDasharray: "none", duration: 0.3 }, at(5, 0.55));
      tl.to("#q3-s2f", { opacity: 1, duration: 0.4 }, at(5, 0.55));
      IN("#q3-s2t", at(5, 0.58), 0.4);
      OUT("#q3-xr, #q3-xlr", at(5, 0.66), 0.3);
      ARROW("#q3-xg", at(5, 0.7), 0.6);
      IN("#q3-xlg", at(5, 0.76), 0.4);
      tl.to("#q3-xs", { fill: "#83C167", duration: 0.4 }, at(5, 0.8));

      tl.to("#q3-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz3"] = tl;
    })();
