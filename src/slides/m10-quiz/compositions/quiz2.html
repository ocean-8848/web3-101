          </g>
          <text id="q2-oC-n" class="h" x="190" y="747" font-size="28" fill="#FC6255">这是安全问题，不是性能问题</text>

        <g id="q2-oD" class="h">

          <g id="q2-oD-dim">

          <text id="q2-oD-n" class="h" x="190" y="882" font-size="28" fill="#FC6255">开头的陷阱：验证通过只说明符合已写下的规则</text>

        <!-- 右侧示意区 x 1160–1850：代码卡 -->

          <rect x="1160" y="380" width="690" height="200" rx="14" fill="#161a22" stroke="#4a4f59" stroke-width="2" />

        <text id="q2-cm2" class="h" x="1170" y="628" font-size="28" fill="#83C167">赋值 + 约束</text>
        <!-- L3 恶意见证 -->
        <text id="q2-w0" class="h" x="1170" y="702" font-size="30" fill="#e8e6df"><tspan class="mono">out = a * b</tspan></text>
        <text id="q2-w1" class="h" x="1170" y="702" font-size="30" fill="#FC6255"><tspan class="mono">out = </tspan>任意值</text>

        <g id="q2-cg">

          <path id="q2-e2" class="dr" pathLength="1" d="M1262 830 L1408 794" fill="none" stroke="#83C167" stroke-width="3" />

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      const SHOW = (k, t) => {
        IN(`#q2-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q2-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q2-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#q2-pause", at(2, 0.0), 0.3);
        tl.fromTo("#q2-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#q2-pause", at(3, 0.0), 0.3);
      };
      const RIGHT = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q2-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q2-o${k}-n`, t + 0.3, 0.5);
      };
      IN("#q2-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q2-tag", at(0, 0.04), 0.4);
      IN("#q2-q1", at(0, 0.03), 0.01);
      IN("#q2-q2", at(0, 0.3), 0.01);
      tl.fromTo("#q2-qcr1", { attr: { width: 0 } }, { attr: { width: 1300 }, duration: 2.0, ease: "none" }, at(0, 0.05));
      tl.fromTo("#q2-qcr2", { attr: { width: 0 } }, { attr: { width: 1300 }, duration: 3.0, ease: "none" }, at(0, 0.31));
      // L0 代码卡；缺失的约束位置
      IN("#q2-code", at(0, 0.38), 0.5);
      IN("#q2-l2a", at(0, 0.5), 0.4);
      tl.fromTo("#q2-hl", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, at(0, 0.52));
      IN("#q2-gap", at(0, 0.72), 0.4);
      tl.to("#q2-gap", { opacity: 0.3, duration: 0.35, yoyo: true, repeat: 3 }, at(0, 0.8));

      // L1 选项
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.56)); SHOW("C", at(1, 0.69)); SHOW("D", at(1, 0.83));
      tl.to("#q2-gap", { opacity: 0.3, duration: 0.35, yoyo: true, repeat: 3 }, at(1, 0.2));
      tl.to("#q2-hl", { opacity: 0.4, duration: 0.35, yoyo: true, repeat: 3 }, at(1, 0.38));
      // L2 暂停
      PAUSE();
      // L3 揭晓 A：out 可填任意值
      RIGHT("A", at(3, 0.04));
      tl.to("#q2-oB-dim, #q2-oC-dim, #q2-oD-dim", { opacity: 0.6, duration: 0.4 }, at(3, 0.06));
      IN("#q2-cm1", at(3, 0.16), 0.4);
      IN("#q2-w0", at(3, 0.42), 0.4);
      OUT("#q2-w0", at(3, 0.62), 0.25);
      IN("#q2-w1", at(3, 0.66), 0.35);
      IN("#q2-pass", at(3, 0.82), 0.4, { scale: 0.7, svgOrigin: "1705 692" }, { scale: 1, svgOrigin: "1705 692" });
      // L4 干扰项
      WRONG("B", at(4, 0.02));
      WRONG("C", at(4, 0.36));
      WRONG("D", at(4, 0.55));
      IN("#q2-vt", at(4, 0.62), 0.4);
      IN("#q2-vn", at(4, 0.72), 0.4);
      // L5 改成 <==，约束把 out 绑住
      OUT("#q2-oA, #q2-oB, #q2-oC, #q2-oD, #q2-w1, #q2-pass, #q2-vt, #q2-vn, #q2-cm1, #q2-gap", at(5, 0.0), 0.4);
      OUT("#q2-l2a", at(5, 0.02), 0.3);
      IN("#q2-l2b", at(5, 0.08), 0.4);
      tl.to("#q2-hl", { fill: "#83C167", duration: 0.4 }, at(5, 0.08));
      IN("#q2-cm2", at(5, 0.14), 0.4);
      IN("#q2-sum1", at(5, 0.1), 0.5, { x: -20 }, { x: 0 });
      IN("#q2-na", at(5, 0.2), 0.3); IN("#q2-nb", at(5, 0.22), 0.3); IN("#q2-nm", at(5, 0.26), 0.3);
      DRAW("#q2-e1", at(5, 0.3), 0.4); DRAW("#q2-e2", at(5, 0.3), 0.4);
      IN("#q2-no", at(5, 0.38), 0.3); ARROW("#q2-e3", at(5, 0.4), 0.4);
      IN("#q2-sum2", at(5, 0.5), 0.5);
      tl.to("#q2-no", { scale: 1.08, svgOrigin: "1700 785", duration: 0.3, yoyo: true, repeat: 1 }, at(5, 0.75));

      tl.to("#q2-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz2"] = tl;
    })();
  </script>
