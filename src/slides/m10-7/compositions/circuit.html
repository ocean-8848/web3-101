      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/

const Y0 = 290, PITCH = 40;
const HL = (pid, i, n, t) => {
  tl.to([`#${pid}-hlr`, `#${pid}-hls`], { attr: { y: Y0 - 28 + PITCH * i, height: PITCH * n - 2 }, duration: 0.35, ease: "power2.inOut" }, t);
};
const FOCUS = (pfx, count, i, n, t) => {
  const on = [], off = [];
  for (let k = 0; k < count; k++) (k >= i && k < i + n ? on : off).push(`#${pfx}${k}`);
  if (on.length) tl.to(on, { opacity: 1, duration: 0.3 }, t);
  if (off.length) tl.to(off, { opacity: 0.4, duration: 0.3 }, t);
};

IN("#ci-hl", at(0, 0.05), 0.3);
HL("ci", 1, 1, at(0, 0.3));
IN("#ci-a", at(0, 0.32), 0.5, { y: 10 }, { y: 0 });
HL("ci", 2, 1, at(0, 0.45));
IN("#ci-b", at(0, 0.47), 0.5, { y: 10 }, { y: 0 });
HL("ci", 3, 1, at(0, 0.64));
IN("#ci-bit", at(0, 0.66), 0.5, { scale: 0.6, svgOrigin: "770 770" }, { scale: 1, svgOrigin: "770 770" });

// L1 loop
OUT("#ci-A", at(1, 0.0), 0.3);
IN("#ci-B", at(1, 0.1), 0.4);
HL("ci", 0, 1, at(1, 0.05));
FOCUS("ci-B", 11, 0, 1, at(1, 0.1));
DRAW("#ci-ldl", at(1, 0.2), 1.2);
tl.fromTo(['#ci-ld0', '#ci-ld1', '#ci-ld2', '#ci-ld3', '#ci-ld4'], { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.25, immediateRender: false }, at(1, 0.2));

OUT("#ci-at1", at(2, 0.3), 0.2); IN("#ci-at2", at(2, 0.32), 0.3);
tl.to("#ci-ar", { attr: { "stroke-width": 6 }, duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.55));
OUT("#ci-b0", at(2, 0.74), 0.2); IN("#ci-b1", at(2, 0.76), 0.3);
tl.to("#ci-ao", { x: 260, duration: 0.6, ease: "power2.inOut" }, at(2, 0.8));
tl.to("#ci-bo", { x: -260, duration: 0.6, ease: "power2.inOut" }, at(2, 0.8));
// L3 Poseidon up
HL("ci", 6, 2, at(3, 0.04)); FOCUS("ci-B", 11, 6, 2, at(3, 0.04));
IN("#ci-pos", at(3, 0.08), 0.4);
ARROW("#ci-pa1", at(3, 0.12), 0.4); ARROW("#ci-pa2", at(3, 0.12), 0.4);
tl.to("#ci-mv", { y: -130, opacity: 0, duration: 0.6, ease: "power2.in" }, at(3, 0.28));
ARROW("#ci-pa3", at(3, 0.38), 0.3);
IN("#ci-cur", at(3, 0.42), 0.4, { y: 20 }, { y: 0 });
tl.to("#ci-ld1", { fill: "#58C4DD", duration: 0.3 }, at(3, 0.45));
HL("ci", 9, 1, at(3, 0.7)); FOCUS("ci-B", 11, 9, 1, at(3, 0.7));
OUT("#ci-pos, #ci-pa1, #ci-pa2, #ci-pa3", at(3, 0.68), 0.3);
tl.to("#ci-cur", { y: -200, opacity: 0, duration: 0.6, ease: "power2.inOut" }, at(3, 0.72));
IN("#ci-root", at(3, 0.8), 0.4);
tl.to(['#ci-ld0', '#ci-ld1', '#ci-ld2', '#ci-ld3', '#ci-ld4'], { fill: "#58C4DD", duration: 0.2, stagger: 0.1 }, at(3, 0.74));
// L4 boolean constraint
OUT("#ci-sl, #ci-sr, #ci-bit, #ci-ldl, #ci-ld0, #ci-ld1, #ci-ld2, #ci-ld3, #ci-ld4", at(4, 0.02), 0.4);
HL("ci", 1, 1, at(4, 0.04)); FOCUS("ci-B", 11, 1, 1, at(4, 0.04));
IN("#ci-gf", at(4, 0.08), 0.4, { scale: 1.08, svgOrigin: "1380 321" }, { scale: 1, svgOrigin: "1380 321" });
IN("#ci-eq1", at(4, 0.3), 0.5, { x: -20 }, { x: 0 });
IN("#ci-eq2", at(4, 0.7), 0.5, { x: -20 }, { x: 0 });
// L5 under-constrained
OUT("#ci-gf", at(5, 0.04), 0.2); IN("#ci-rf", at(5, 0.06), 0.3); IN("#ci-del", at(5, 0.08), 0.3);
tl.to("#ci-B1", { opacity: 0.25, duration: 0.3 }, at(5, 0.1));
OUT("#ci-eq1, #ci-eq2", at(5, 0.1), 0.3);
OUT("#ci-b1", at(5, 0.18), 0.01); IN("#ci-b2", at(5, 0.2), 0.3);

FOCUS("ci-B", 11, 0, 11, at(6, 0.1));
