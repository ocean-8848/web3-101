      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const HLY = (c, i) => c.y0 + i * c.lh;
      const CODEIN = (c, t, step = 0.1) => { IN(`#${c.id}p`, t, 0.4); for (let i = 0; i < c.n; i++) IN(`#${c.id}${i}`, t + 0.1 + i * step, 0.25, { x: -8 }, { x: 0 }); };
      const CODEOUT = (c, t) => { const s = [`#${c.id}p`, `#${c.id}hl`, `#${c.id}hb`]; for (let i = 0; i < c.n; i++) s.push(`#${c.id}${i}`); OUT(s.join(","), t, 0.4); };
      const HL = (c, i, t, k = 1, col) => {
        const s = `#${c.id}hl, #${c.id}hb`;
        if (!c.on) { tl.set(s, { attr: { y: HLY(c, i), height: k * c.lh - 4 } }, t); IN(s, t, 0.3); c.on = 1; }
        else tl.to(s, { attr: { y: HLY(c, i), height: k * c.lh - 4 }, duration: 0.35, ease: "power2.inOut" }, t);
        if (col) { tl.to(`#${c.id}hl`, { attr: { fill: col }, duration: 0.3 }, t); tl.to(`#${c.id}hb`, { attr: { fill: col }, duration: 0.3 }, t); }
        const on = [], off = [];
        for (let j = 0; j < c.n; j++) (j >= i && j < i + k ? on : off).push(`#${c.id}${j}`);
        tl.to(on.join(","), { opacity: 1, duration: 0.3 }, t);
        if (off.length) tl.to(off.join(","), { opacity: 0.6, duration: 0.3 }, t);
      };

      const LAY = (i, t) => { tl.to(`#te-L${i}p`, { attr: { stroke: "#58C4DD", fill: "#1a2a33" }, duration: 0.4 }, t); tl.to(`#te-L${i}t`, { attr: { fill: "#e8e6df" }, duration: 0.4 }, t); };
      const DONE = (i, t) => { tl.to(`#te-L${i}p`, { attr: { stroke: "#83C167", fill: "#161a22" }, duration: 0.4 }, t); };
      // L0
      for (let i = 0; i < 5; i++) IN(`#te-L${i}`, at(0, 0.0) + i * 0.12, 0.4, { y: 16 }, { y: 0 });
      LAY(0, at(0, 0.1));
      ["#te-a0", "#te-a1", "#te-a2", "#te-a3"].forEach((q, k) => IN(q, at(0, 0.14 + k * 0.11), 0.4, { x: 20 }, { x: 0 }));
      OUT("#te-a0, #te-a1, #te-a2, #te-a3", at(0, 0.56), 0.35);
      DONE(0, at(0, 0.58)); LAY(1, at(0, 0.6));
      IN("#te-b0", at(0, 0.62), 0.4, { x: 20 }, { x: 0 });
      IN("#te-b1", at(0, 0.82), 0.4, { x: 20 }, { x: 0 });
      // L1
      OUT("#te-b0, #te-b1", at(1, 0), 0.35);
      DONE(1, at(1, 0.02)); LAY(2, at(1, 0.03));
      for (let k = 0; k < 5; k++) IN(`#te-c${k}`, at(1, 0.06) + k * 0.6, 0.35, { x: 20 }, { x: 0 });
      OUT("#te-c0, #te-c1, #te-c2, #te-c3, #te-c4", at(1, 0.52), 0.35);
      DONE(2, at(1, 0.54)); LAY(3, at(1, 0.55));
      for (let k = 0; k < 8; k++) { const t0 = at(1, 0.57) + (k % 4) * 0.12 + Math.floor(k / 4) * 0.3; tl.fromTo(`#te-x${k}`, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3 }, t0); tl.to(`#te-x${k}`, { y: 140, opacity: 0, duration: 1.4, ease: "power1.in" }, t0 + 0.3); }
      IN("#te-xt", at(1, 0.66), 0.4);
      IN("#te-fr", at(1, 0.82), 0.4, { x: 20 }, { x: 0 });
      // L2
      OUT("#te-xt, #te-fr", at(2, 0), 0.35);
      DONE(3, at(2, 0.02)); LAY(4, at(2, 0.03));
      IN("#te-rps", at(2, 0.06), 0.4);
      IN("#te-rpd", at(2, 0.2), 0.4);
      for (let k = 0; k < 5; k++) IN(`#te-p${k}`, at(2, 0.4) + k * 0.2, 0.25, { y: -20 }, { y: 0 });
      IN("#te-pt", at(2, 0.52), 0.4);
      IN("#te-fi", at(2, 0.64), 0.4);
      // L3 deploy & ops
      OUT("#te-rps, #te-rpd, #te-pt, #te-fi, #te-p0, #te-p1, #te-p2, #te-p3, #te-p4, #te-L0, #te-L1, #te-L2, #te-L3, #te-L4", at(3, 0), 0.4);
      IN("#te-e0", at(3, 0.04), 0.4); ARROW("#te-ea0", at(3, 0.08), 0.3);
      IN("#te-e1", at(3, 0.1), 0.4); ARROW("#te-ea1", at(3, 0.14), 0.3);
      IN("#te-e2", at(3, 0.16), 0.4);
      IN("#te-ci", at(3, 0.24), 0.4);
      for (let k = 0; k < 4; k++) { IN(`#te-ci${k}`, at(3, 0.27) + k * 0.6, 0.3); tl.to(`#te-ci${k}r`, { attr: { stroke: "#83C167" }, duration: 0.3 }, at(3, 0.27) + k * 0.6 + 0.4); }
      IN("#te-zk", at(3, 0.46), 0.4); ARROW("#te-zka", at(3, 0.5), 0.3); IN("#te-zkt", at(3, 0.52), 0.4);
      IN("#te-lg, #te-lgt, #te-lgip", at(3, 0.64), 0.4);
      IN("#te-lgx", at(3, 0.7), 0.3); IN("#te-lgipn", at(3, 0.72), 0.4);
      DRAW("#te-lgu", at(3, 0.84), 0.4); IN("#te-lgul", at(3, 0.86), 0.4);
      // L4 milestones
      OUT("#te-e0, #te-e1, #te-e2, #te-ea0, #te-ea1, #te-ci, #te-ci0, #te-ci1, #te-ci2, #te-ci3, #te-zk, #te-zka, #te-zkt, #te-lg, #te-lgt, #te-lgip, #te-lgx, #te-lgipn, #te-lgu, #te-lgul", at(4, 0), 0.4);
      IN("#te-wt", at(4, 0.02), 0.4); DRAW("#te-wl", at(4, 0.03), 2.0);
      [0.04, 0.12, 0.33, 0.45, 0.6, 0.86].forEach((f, k) => { IN(`#te-w${k}`, at(4, f), 0.4, { x: -16 }, { x: 0 }); if (k < 5) tl.to(`#te-w${k}c`, { attr: { fill: "#58C4DD" }, duration: 0.3 }, at(4, f) + 0.3); });
      IN("#te-wo", at(4, 0.88), 0.4);
      // L5 mini version
      OUT("#te-wt, #te-wl, #te-w0, #te-w1, #te-w2, #te-w3, #te-w4, #te-w5, #te-wo", at(5, 0), 0.4);
      IN("#te-mt", at(5, 0.05), 0.4);
      for (let k = 0; k < 4; k++) IN(`#te-lf${k}`, at(5, 0.08) + k * 0.08, 0.3);
      for (let k = 0; k < 4; k++) DRAW(`#te-ed${k}`, at(5, 0.16), 0.4);
      IN("#te-md0, #te-md1", at(5, 0.2), 0.3);
      DRAW("#te-ed4", at(5, 0.24), 0.4); DRAW("#te-ed5", at(5, 0.24), 0.4);
      IN("#te-rt", at(5, 0.28), 0.4);
      IN("#te-r0", at(5, 0.38), 0.4, { x: 20 }, { x: 0 });
      IN("#te-r1", at(5, 0.56), 0.4, { x: 20 }, { x: 0 });
      IN("#te-r2", at(5, 0.78), 0.4, { x: 20 }, { x: 0 });

      tl.to("#te-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["tests"] = tl;
    })();
  </script>
</template>
