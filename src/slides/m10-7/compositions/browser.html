  <script>
    (function () {

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const HLY = (c, i) => c.y0 + i * c.lh;
      const CODEIN = (c, t, step = 0.1) => { IN(`#${c.id}p`, t, 0.4); for (let i = 0; i < c.n; i++) IN(`#${c.id}${i}`, t + 0.1 + i * step, 0.25, { x: -8 }, { x: 0 }); };
      const CODEOUT = (c, t) => { const s = [`#${c.id}p`, `#${c.id}hl`, `#${c.id}hb`]; for (let i = 0; i < c.n; i++) s.push(`#${c.id}${i}`); OUT(s.join(","), t, 0.4); };
      const HL = (c, i, t, k = 1, col) => {
        const s = `#${c.id}hl, #${c.id}hb`;
        if (!c.on) { tl.set(s, { attr: { y: HLY(c, i), height: k * c.lh - 4 } }, t); IN(s, t, 0.3); c.on = 1; }
        else tl.to(s, { attr: { y: HLY(c, i), height: k * c.lh - 4 }, duration: 0.35, ease: "power2.inOut" }, t);
        if (col) { tl.to(`#${c.id}hl`, { attr: { fill: col }, duration: 0.3 }, t); tl.to(`#${c.id}hb`, { attr: { fill: col }, duration: 0.3 }, t); }
        const on = [], off = [];
        for (let j = 0; j < c.n; j++) (j >= i && j < i + k ? on : off).push(`#${c.id}${j}`);
        tl.to(on.join(","), { opacity: 1, duration: 0.3 }, t);

      IN("#br-z3", at(1, 0.68), 0.4);

      // L2 index walk
      OUT("#br-dice, #br-da, #br-sec, #br-dr, #br-drl, #br-drk, #br-note, #br-zt, #br-z0, #br-z1, #br-z2, #br-z3, #br-lf0, #br-lf1, #br-lf2, #br-lf3, #br-e0, #br-e1, #br-e2, #br-e3, #br-e4, #br-e5, #br-n0, #br-n1, #br-rt, #br-rule", at(2, 0), 0.4);

      tl.to("#br-c4r", { attr: { stroke: "#FF9F43" }, duration: 0.3 }, at(2, 0.3));
      IN("#br-t1", at(2, 0.3), 0.4);
      HL(CA, 3, at(2, 0.48), 2);
      HL(CA, 7, at(2, 0.62));
      ARROW("#br-dv", at(2, 0.64), 0.4); IN("#br-dvl", at(2, 0.66), 0.3);
      for (let k = 0; k < 4; k++) IN(`#br-u${k}`, at(2, 0.66) + k * 0.05, 0.3);
      tl.to("#br-u2r", { attr: { stroke: "#58C4DD", fill: "#1d3440" }, duration: 0.3 }, at(2, 0.74));
      tl.to("#br-u3r", { attr: { stroke: "#FF9F43" }, duration: 0.3 }, at(2, 0.78));
      IN("#br-t2", at(2, 0.76), 0.4);
      HL(CA, 5, at(2, 0.9), 2);

      OUT("#br-t1, #br-t2, #br-dv, #br-dvl, " + [...Array(8).keys()].map(k => `#br-c${k}`).join(",") + "," + [...Array(4).keys()].map(k => `#br-u${k}`).join(","), at(3, 0), 0.4);
      IN("#br-pj, #br-pjl", at(3, 0.08), 0.4);
      IN("#br-pc, #br-pcl", at(3, 0.18), 0.4);
      IN("#br-eq", at(3, 0.3), 0.3);

      CODEIN(CB, at(4, 0) + 0.45, 0.06);

      tl.to("#br-m3r", { attr: { stroke: "#FF9F43", "stroke-width": 4 }, duration: 0.3 }, at(4, 0.26));
      ARROW("#br-ma", at(4, 0.34), 0.4);
      IN("#br-pa", at(4, 0.38), 0.4);
      HL(CB, 3, at(4, 0.52));
      IN("#br-gd", at(4, 0.54), 0.4); IN("#br-gdl", at(4, 0.58), 0.4);
      HL(CB, 4, at(4, 0.76), 3);
      ARROW("#br-pa2", at(4, 0.78), 0.4); ARROW("#br-ga", at(4, 0.78), 0.4);
      IN("#br-sj", at(4, 0.82), 0.4);

      IN("#br-ww, #br-wwb, #br-wwt", at(6, 0.12), 0.4); IN("#br-wwm", at(6, 0.14), 0.3);
      tl.to("#br-mtf", { attr: { width: 640 }, duration: 4.0, ease: "none" }, at(6, 0.16));
      tl.fromTo("#br-wwm", { x: 0 }, { x: 560, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, at(6, 0.16));
      IN("#br-ui", at(6, 0.3), 0.4);
      IN("#br-zf", at(6, 0.42), 0.4); IN("#br-zfl", at(6, 0.46), 0.4);
      ARROW("#br-za", at(6, 0.55), 0.3);
      IN("#br-cdn", at(6, 0.58), 0.4);
      ARROW("#br-ca", at(6, 0.64), 0.5);
      IN("#br-sh", at(6, 0.76), 0.4); IN("#br-sht", at(6, 0.78), 0.4);
      IN("#br-shk", at(6, 0.84), 0.3); IN("#br-shl", at(6, 0.86), 0.4);

      tl.to("#br-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["browser"] = tl;
