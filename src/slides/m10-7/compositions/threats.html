    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const HLY = (c, i) => c.y0 + i * c.lh;
      const CODEIN = (c, t, step = 0.1) => { IN(`#${c.id}p`, t, 0.4); for (let i = 0; i < c.n; i++) IN(`#${c.id}${i}`, t + 0.1 + i * step, 0.25, { x: -8 }, { x: 0 }); };
      const CODEOUT = (c, t) => { const s = [`#${c.id}p`, `#${c.id}hl`, `#${c.id}hb`]; for (let i = 0; i < c.n; i++) s.push(`#${c.id}${i}`); OUT(s.join(","), t, 0.4); };
      const HL = (c, i, t, k = 1, col) => {
        const s = `#${c.id}hl, #${c.id}hb`;
        if (!c.on) { tl.set(s, { attr: { y: HLY(c, i), height: k * c.lh - 4 } }, t); IN(s, t, 0.3); c.on = 1; }
        else tl.to(s, { attr: { y: HLY(c, i), height: k * c.lh - 4 }, duration: 0.35, ease: "power2.inOut" }, t);
        if (col) { tl.to(`#${c.id}hl`, { attr: { fill: col }, duration: 0.3 }, t); tl.to(`#${c.id}hb`, { attr: { fill: col }, duration: 0.3 }, t); }
        const on = [], off = [];
        for (let j = 0; j < c.n; j++) (j >= i && j < i + k ? on : off).push(`#${c.id}${j}`);
        tl.to(on.join(","), { opacity: 1, duration: 0.3 }, t);
        if (off.length) tl.to(off.join(","), { opacity: 0.6, duration: 0.3 }, t);
      };

      const more = {
        1: [at(1, 0.36)],
        5: [at(2, 0.36), at(2, 0.48)],
        7: [at(2, 0.84), at(2, 0.9)],
        9: [at(4, 0.3), at(4, 0.45)],
        8: [at(3, 0.8)],
        10: [at(4, 0.82)],
      };
      const LIGHT = (i, t) => {
