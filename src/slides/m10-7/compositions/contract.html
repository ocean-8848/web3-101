    (function () {

      // L3 code A, checks 1-2
      OUT("#co-n1, #co-t1, #co-pbl, #co-pbb, #co-pbf, #co-one, #co-rb, #co-fail, #co-n2, #co-t2, #co-rm, #co-rmx, #co-rma, #co-rmt, #co-n3, #co-ok, " + [...Array(14).keys()].map(k => `#co-q${k}`).join(","), at(3, 0), 0.4);
