    (function () {
      const C = /*CUES*/{}/*END*/;

      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

const CODE = {};
const HL = (name, a, b, t, col = "#58C4DD") => {
  const P = CODE[name]; const y = P.y0 + P.lh * (a - 1), h = P.lh * (b - a + 1);
  tl.to(`#${P.pf}${name}hl`, { attr: { y, height: h }, fill: col, opacity: 1, duration: 0.45, ease: "power2.inOut" }, t);
  tl.to(`#${P.pf}${name}hb`, { attr: { y, height: h }, fill: col, opacity: 1, duration: 0.45, ease: "power2.inOut" }, t);
  for (let i = 1; i <= P.n; i++) tl.to(`#${P.pf}${name}${i}`, { opacity: (i >= a && i <= b) ? 1 : 0.5, duration: 0.4 }, t);
};
const SHOW = (name, t) => { const P = CODE[name]; IN(`#${P.pf}${name}`, t, 0.5);
  for (let i = 1; i <= P.n; i++) IN(`#${P.pf}${name}${i}`, t + 0.1 + i * 0.05, 0.3, {}, { opacity: 0.8 }); };
const HIDE = (name, t) => { const P = CODE[name]; const ids = [`#${P.pf}${name}`]; for (let i = 1; i <= P.n; i++) ids.push(`#${P.pf}${name}${i}`); OUT(ids.join(","), t, 0.4); };
const POP = (s, t, o) => IN(s, t, 0.45, { scale: 0.6, svgOrigin: o }, { scale: 1, svgOrigin: o, ease: "back.out(2)" });
const PULSE = (s, t, o, k = 1.08) => tl.to(s, { scale: k, svgOrigin: o, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, t);
const CHG = (s, t, v, d = 0.35) => tl.to(s, { ...v, duration: d }, t);
const SLIDE = (s, t, dx = -16, dy = 0, d = 0.5) => IN(s, t, d, { x: dx, y: dy }, { x: 0, y: 0 });


const CX = i => 80 + (i % 4) * 445 + 212.5, CY = i => 230 + Math.floor(i / 4) * 360 + 165;
const FLIP = (i, t) => {
  const o = `${CX(i)} ${CY(i)}`;
  tl.to(`#se-b${i}`, { scaleX: 0, svgOrigin: o, duration: 0.22, ease: "power2.in" }, t);
  tl.set(`#se-b${i}`, { opacity: 0 }, t + 0.22);
  tl.fromTo(`#se-f${i}`, { opacity: 1, scaleX: 0, svgOrigin: o }, { scaleX: 1, svgOrigin: o, duration: 0.28, ease: "power2.out", immediateRender: false }, t + 0.22);
};
const PROT = (i, k, t) => IN(`#se-p${i}_${k}`, t, 0.4, { x: -12 }, { x: 0 });
const GOOD = (i, t) => CHG(`#se-fr${i}`, t, { stroke: "#83C167" }, 0.4);
// L0 八张卡背面
for (let i = 0; i < 8; i++) IN(`#se-b${i}`, at(0, 0.05) + i * 0.07, 0.4, { y: 20 }, { y: 0 });
for (let i = 0; i < 8; i++) PULSE(`#se-b${i}`, at(0, 0.72) + i * 0.04, `${CX(i)} ${CY(i)}`, 1.03);
// L1 报价过期
FLIP(0, at(1, 0.02));
[0.07, 0.3, 0.55, 0.75].forEach((f, k) => PROT(0, k, at(1, f)));
GOOD(0, at(1, 0.9));
// L2 恶意代币、假池子
FLIP(1, at(2, 0.02)); PROT(1, 0, at(2, 0.14)); PROT(1, 1, at(2, 0.28)); GOOD(1, at(2, 0.36));
FLIP(2, at(2, 0.42)); PROT(2, 0, at(2, 0.76)); PROT(2, 1, at(2, 0.86)); GOOD(2, at(2, 0.94));
// L3 交易目标被篡改
FLIP(3, at(3, 0.02)); PROT(3, 0, at(3, 0.3)); PROT(3, 1, at(3, 0.6)); PROT(3, 2, at(3, 0.82)); GOOD(3, at(3, 0.92));
// L4 拒绝服务、RPC 错误数据
FLIP(4, at(4, 0.02)); PROT(4, 0, at(4, 0.1)); PROT(4, 1, at(4, 0.24)); PROT(4, 2, at(4, 0.36)); PROT(4, 3, at(4, 0.42)); GOOD(4, at(4, 0.5));
FLIP(5, at(4, 0.56)); PROT(5, 0, at(4, 0.74)); PROT(5, 1, at(4, 0.86)); GOOD(5, at(4, 0.94));
// L5 私钥泄露、回调冒充
FLIP(6, at(5, 0.02)); FLIP(7, at(5, 0.1));
PROT(6, 0, at(5, 0.4)); GOOD(6, at(5, 0.5));
PROT(7, 0, at(5, 0.74)); GOOD(7, at(5, 0.84));
PULSE("#se-f6", at(5, 0.6), `${CX(6)} ${CY(6)}`, 1.04);
// L6 构造交易 vs 代用户发交易
const NP = [4, 2, 2, 3, 4, 2, 1, 1];
for (let i = 0; i < 8; i++) { OUT(`#se-f${i}`, at(6, 0.0), 0.35); for (let k = 0; k < NP[i]; k++) OUT(`#se-p${i}_${k}`, at(6, 0.0), 0.35); }
tl.set("#se-div", { opacity: 1 }, at(6, 0.04)); DRAW("#se-div", at(6, 0.04), 0.6);
IN("#se-lt", at(6, 0.06), 0.4); IN("#se-wal", at(6, 0.1), 0.4, { y: 12 }, { y: 0 }); IN("#se-wt", at(6, 0.14), 0.4);
IN("#se-rt", at(6, 0.2), 0.4); IN("#se-srv", at(6, 0.26), 0.4, { y: 12 }, { y: 0 }); IN("#se-st", at(6, 0.3), 0.4);
IN("#se-lb", at(6, 0.46), 0.5, { attr: { width: 0 } }, { attr: { width: 120 } }); IN("#se-lbt", at(6, 0.48), 0.4);
IN("#se-rb", at(6, 0.66), 0.8, { attr: { width: 0 } }, { attr: { width: 720 } }); IN("#se-rbt", at(6, 0.7), 0.4);
PULSE("#se-rb", at(6, 0.82), "1420 642", 1.04);
IN("#se-aa", at(6, 0.72), 0.5);

      tl.to("#se-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      
      window.__timelines["security"] = tl;
