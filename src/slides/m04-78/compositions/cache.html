    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

const CODE = {};
const HL = (name, a, b, t, col = "#58C4DD") => {
  const P = CODE[name]; const y = P.y0 + P.lh * (a - 1), h = P.lh * (b - a + 1);
  tl.to(`#${P.pf}${name}hl`, { attr: { y, height: h }, fill: col, opacity: 1, duration: 0.45, ease: "power2.inOut" }, t);
  tl.to(`#${P.pf}${name}hb`, { attr: { y, height: h }, fill: col, opacity: 1, duration: 0.45, ease: "power2.inOut" }, t);
  for (let i = 1; i <= P.n; i++) tl.to(`#${P.pf}${name}${i}`, { opacity: (i >= a && i <= b) ? 1 : 0.5, duration: 0.4 }, t);
};
const SHOW = (name, t) => { const P = CODE[name]; IN(`#${P.pf}${name}`, t, 0.5);
  for (let i = 1; i <= P.n; i++) IN(`#${P.pf}${name}${i}`, t + 0.1 + i * 0.05, 0.3, {}, { opacity: 0.8 }); };
const HIDE = (name, t) => { const P = CODE[name]; const ids = [`#${P.pf}${name}`]; for (let i = 1; i <= P.n; i++) ids.push(`#${P.pf}${name}${i}`); OUT(ids.join(","), t, 0.4); };
const POP = (s, t, o) => IN(s, t, 0.45, { scale: 0.6, svgOrigin: o }, { scale: 1, svgOrigin: o, ease: "back.out(2)" });
const PULSE = (s, t, o, k = 1.08) => tl.to(s, { scale: k, svgOrigin: o, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, t);
const CHG = (s, t, v, d = 0.35) => tl.to(s, { ...v, duration: d }, t);
const SLIDE = (s, t, dx = -16, dy = 0, d = 0.5) => IN(s, t, d, { x: dx, y: dy }, { x: 0, y: 0 });

CODE["cd"] = {pf:"ca-", y0:304, lh:44, n:4};

const OG = "#FF9F43";
// L0 引擎 + 门 + 面板
IN("#ca-eng", at(0, 0.02), 0.6, { scale: 0.9, svgOrigin: "710 570" }, { scale: 1, svgOrigin: "710 570" });
IN("#ca-door", at(0, 0.2), 0.5);
ARROW("#ca-req", at(0, 0.32), 0.5); IN("#ca-reqt", at(0, 0.36), 0.4);
SHOW("cd", at(0, 0.45));
// L1 秒表：快照年龄 > maxLag
HL("cd", 1, 1, at(1, 0.02));
IN("#ca-w", at(1, 0.05), 0.5); IN("#ca-wh", at(1, 0.05), 0.5); IN("#ca-wn", at(1, 0.05), 0.4);
IN("#ca-wl1", at(1, 0.1), 0.4); IN("#ca-wl2", at(1, 0.2), 0.4);
HL("cd", 2, 3, at(1, 0.3), OG);
tl.to("#ca-wh", { rotation: 400, svgOrigin: "330 365", duration: at(1, 0.6) - at(1, 0.25), ease: "none" }, at(1, 0.25));
COUNT("#ca-wn", 0, 40, at(1, 0.25), at(1, 0.6) - at(1, 0.25), v => Math.round(v) + " s");
CHG("#ca-wc", at(1, 0.52), { stroke: OG });
IN("#ca-dot", at(1, 0.3), 0.3);
tl.to("#ca-dot", { attr: { cx: 520 }, duration: 0.9, ease: "power1.in" }, at(1, 0.32));
CHG("#ca-dot", at(1, 0.6), { fill: OG }, 0.2);
tl.to("#ca-dot", { attr: { cx: 330 }, duration: 0.6, ease: "power2.out" }, at(1, 0.62));
POP("#ca-stale", at(1, 0.64), "280 649");
CHG("#ca-door rect", at(1, 0.64), { stroke: OG });
PULSE("#ca-stale", at(1, 0.9), "280 649", 1.06);
// L2 按区块组织的缓存
OUT("#ca-w, #ca-wh, #ca-wn, #ca-wl1, #ca-wl2, #ca-stale, #ca-dot", at(2, 0.0), 0.35);
CHG("#ca-door rect", at(2, 0.0), { stroke: "#e8e6df" });
HIDE("cd", at(2, 0.0));
IN("#ca-cab", at(2, 0.06), 0.5); IN("#ca-hN", at(2, 0.08), 0.4);
for (let i = 0; i < 3; i++) { IN(`#ca-dr${i}`, at(2, 0.1) + i * 0.08, 0.35); IN(`#ca-dk${i}`, at(2, 0.14) + i * 0.08, 0.35); }
ARROW("#ca-ec", at(2, 0.2), 0.4);
// 新区块：整柜作废
OUT("#ca-hN", at(2, 0.42), 0.3); IN("#ca-hN1", at(2, 0.42) + 0.35, 0.4);
for (let i = 0; i < 3; i++) { OUT(`#ca-dk${i}`, at(2, 0.42) + i * 0.06, 0.3); }
CHG("#ca-cabr", at(2, 0.42), { stroke: "#58C4DD" }, 0.2); CHG("#ca-cabr", at(2, 0.42) + 0.5, { stroke: "#8a8f99" }, 0.4);
