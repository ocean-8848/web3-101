  tl.to(`#${P.pf}${name}hl`, { attr: { y, height: h }, fill: col, opacity: 1, duration: 0.45, ease: "power2.inOut" }, t);
  tl.to(`#${P.pf}${name}hb`, { attr: { y, height: h }, fill: col, opacity: 1, duration: 0.45, ease: "power2.inOut" }, t);
  for (let i = 1; i <= P.n; i++) tl.to(`#${P.pf}${name}${i}`, { opacity: (i >= a && i <= b) ? 1 : 0.5, duration: 0.4 }, t);
};
const SHOW = (name, t) => { const P = CODE[name]; IN(`#${P.pf}${name}`, t, 0.5);
  for (let i = 1; i <= P.n; i++) IN(`#${P.pf}${name}${i}`, t + 0.1 + i * 0.05, 0.3, {}, { opacity: 0.8 }); };
