  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

const CODE = {};
const HL = (name, a, b, t, col = "#58C4DD") => {
  const P = CODE[name]; const y = P.y0 + P.lh * (a - 1), h = P.lh * (b - a + 1);
  tl.to(`#${P.pf}${name}hl`, { attr: { y, height: h }, fill: col, opacity: 1, duration: 0.45, ease: "power2.inOut" }, t);
  tl.to(`#${P.pf}${name}hb`, { attr: { y, height: h }, fill: col, opacity: 1, duration: 0.45, ease: "power2.inOut" }, t);
  for (let i = 1; i <= P.n; i++) tl.to(`#${P.pf}${name}${i}`, { opacity: (i >= a && i <= b) ? 1 : 0.5, duration: 0.4 }, t);
};
const SHOW = (name, t) => { const P = CODE[name]; IN(`#${P.pf}${name}`, t, 0.5);
  for (let i = 1; i <= P.n; i++) IN(`#${P.pf}${name}${i}`, t + 0.1 + i * 0.05, 0.3, {}, { opacity: 0.8 }); };
const HIDE = (name, t) => { const P = CODE[name]; const ids = [`#${P.pf}${name}`]; for (let i = 1; i <= P.n; i++) ids.push(`#${P.pf}${name}${i}`); OUT(ids.join(","), t, 0.4); };
const POP = (s, t, o) => IN(s, t, 0.45, { scale: 0.6, svgOrigin: o }, { scale: 1, svgOrigin: o, ease: "back.out(2)" });
const PULSE = (s, t, o, k = 1.08) => tl.to(s, { scale: k, svgOrigin: o, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, t);
const CHG = (s, t, v, d = 0.35) => tl.to(s, { ...v, duration: d }, t);
const SLIDE = (s, t, dx = -16, dy = 0, d = 0.5) => IN(s, t, d, { x: dx, y: dy }, { x: 0, y: 0 });

CODE["m"] = {pf:"te-", y0:284, lh:40, n:8};
CODE["f"] = {pf:"te-", y0:284, lh:40, n:6};

const LY = i => [`#te-ly${i}`, `#te-lt${i}`];
const LIT = (i, t, col = "#58C4DD") => { CHG(`#te-ly${i}`, t, { fill: "#14222a", stroke: col, strokeWidth: 4 }, 0.4); CHG(`#te-lt${i}`, t, { fill: "#e8e6df" }, 0.4); PULSE(`#te-ly${i}`, t, `420 ${950 - i * 106}`, 1.04); };
const DONE = (i, t) => { CHG(`#te-ly${i}`, t, { stroke: "#83C167", strokeWidth: 3 }, 0.4); };
// L0 金字塔
tl.set("#te-pyr", { x: 540 }, 0);
for (let i = 0; i < 7; i++) { IN(`#te-ly${i}`, at(0, 0.02) + i * 0.1, 0.4, { y: 20 }, { y: 0 }); IN(`#te-lt${i}`, at(0, 0.06) + i * 0.1, 0.4); }
tl.to("#te-pyr", { x: 0, duration: 0.9, ease: "power2.inOut" }, at(0, 0.72));
// L1 数学单元
LIT(0, at(1, 0.0));
SHOW("m", at(1, 0.03));
HL("m", 1, 4, at(1, 0.12), "#F0B90B");
HL("m", 5, 8, at(1, 0.36), "#F0B90B");
IN("#te-bdl", at(1, 0.6), 0.4);
for (let i = 0; i < 3; i++) POP(`#te-bd${i}`, at(1, 0.64) + i * 0.1 * (L[1][1] - L[1][0]), ["950 712", "1200 712", "1490 712"][i]);
IN("#te-exact", at(1, 0.4), 0.4);
// L2 路由单元
HIDE("m", at(2, 0.0)); OUT("#te-bdl, #te-bd0, #te-bd1, #te-bd2, #te-exact", at(2, 0.0), 0.35);
DONE(0, at(2, 0.0)); LIT(1, at(2, 0.02));
[0.1, 0.3, 0.5, 0.75].forEach((f, i) => IN(`#te-rc${i}`, at(2, f), 0.4, { x: -16 }, { x: 0 }));
for (let i = 0; i < 10; i++) POP(`#te-sq${i}`, at(2, 0.78) + i * 0.06, `${1318 + i * 46 + (i >= 7 ? 24 : 0)} 650`);
IN("#te-sqt", at(2, 0.9), 0.4);
// L3 性质测试
OUT("#te-rc0, #te-rc1, #te-rc2, #te-rc3, #te-sqt", at(3, 0.0), 0.35);
for (let i = 0; i < 10; i++) OUT(`#te-sq${i}`, at(3, 0.0), 0.35);
DONE(1, at(3, 0.0)); LIT(2, at(3, 0.02));
IN("#te-term", at(3, 0.02), 0.5);
SHOW("f", at(3, 0.05));
HL("f", 1, 1, at(3, 0.15));
for (let c = 0; c < 10; c++) for (let k = 0; k < 3; k++) {
  const t0 = at(3, 0.15) + ((c * 7 + k * 3) % 10) * 0.22;
  tl.fromTo(`#te-rn${c}_${k}`, { opacity: 0, y: -30 }, { opacity: 0.9, y: 0, duration: 0.5, ease: "power1.out", immediateRender: false }, t0);
  tl.to(`#te-rn${c}_${k}`, { opacity: 0, y: 40, duration: 0.7, ease: "power1.in" }, at(3, 0.52) + (c % 3) * 0.08);
}
HL("f", 2, 3, at(3, 0.45), "#83C167");
IN("#te-fz", at(3, 0.66), 0.5, { y: 10 }, { y: 0 });
// L4 索引器
OUT("#te-term, #te-fz", at(4, 0.0), 0.35); HIDE("f", at(4, 0.0));
DONE(2, at(4, 0.0)); LIT(3, at(4, 0.02));
IN("#te-frpc", at(4, 0.04), 0.4);
for (let i = 0; i < 3; i++) IN(`#te-ib${i}`, at(4, 0.06) + i * 0.08, 0.4, { x: -16 }, { x: 0 });
ARROW("#te-ia0", at(4, 0.12), 0.3); ARROW("#te-ia1", at(4, 0.2), 0.3);
CHG("#te-ibr2", at(4, 0.28), { stroke: "#FC6255", fill: "#2a1616" }); CHG("#te-ibt2", at(4, 0.28), { fill: "#FC6255" });
ARROW("#te-ia2", at(4, 0.32), 0.4); IN("#te-ib3", at(4, 0.36), 0.4, { y: 16 }, { y: 0 });
IN("#te-flag", at(4, 0.46), 0.4, { y: 16 }, { y: 0 });
IN("#te-ias0", at(4, 0.5), 0.4, { x: -16 }, { x: 0 });
OUT("#te-ib2, #te-ia1", at(4, 0.62), 0.4);
IN("#te-ias1", at(4, 0.66), 0.4, { x: -16 }, { x: 0 });
IN("#te-ias2", at(4, 0.82), 0.4, { x: -16 }, { x: 0 });
// L5 分叉测试
OUT("#te-frpc, #te-ib0, #te-ib1, #te-ib3, #te-ia0, #te-ia2, #te-flag, #te-ias0, #te-ias1, #te-ias2", at(5, 0.0), 0.35);
DONE(3, at(5, 0.0)); LIT(4, at(5, 0.02));
IN("#te-anv", at(5, 0.04), 0.4, { y: -20 }, { y: 0 }); IN("#te-anvt", at(5, 0.08), 0.4);
[0.18, 0.3, 0.42, 0.62, 0.84, 0.74].forEach((f, i) => { IN(`#te-fk${i}`, at(5, f), 0.4, { x: -16 }, { x: 0 }); POP(`#te-fkc${i}`, at(5, f) + 0.5, `1785 ${428 + i * 82}`); });
// L6 故障注入
OUT("#te-anv, #te-anvt", at(6, 0.0), 0.35);
for (let i = 0; i < 6; i++) OUT(`#te-fk${i}, #te-fkc${i}`, at(6, 0.0), 0.35);
DONE(4, at(6, 0.0)); LIT(5, at(6, 0.02));
IN("#te-svc", at(6, 0.05), 0.4); IN("#te-rpc", at(6, 0.05), 0.4);
tl.set("#te-wire", { opacity: 1 }, at(6, 0.08)); DRAW("#te-wire", at(6, 0.08), 0.5);
POP("#te-valve", at(6, 0.16), "1340 510"); IN("#te-tox", at(6, 0.18), 0.4);
IN("#te-plus", at(6, 0.22), 0.4);
CHG("#te-wire", at(6, 0.24), { stroke: "#FF9F43" });
IN("#te-snp", at(6, 0.32), 0.4);
POP("#te-st", at(6, 0.44), "1350 681");
tl.to("#te-wire", { opacity: 0.15, duration: 0.2 }, at(6, 0.58));
tl.to("#te-wire", { opacity: 1, stroke: "#58C4DD", duration: 0.3 }, at(6, 0.68));
OUT("#te-st", at(6, 0.7), 0.3);
IN("#te-rec", at(6, 0.74), 0.4, { y: 10 }, { y: 0 });
LIT(6, at(6, 0.76)); IN("#te-k6", at(6, 0.78), 0.4);
// L7 动手练习
OUT("#te-svc, #te-rpc, #te-wire, #te-valve, #te-tox, #te-plus, #te-snp, #te-rec, #te-k6", at(7, 0.0), 0.35);
IN("#te-pc", at(7, 0.04), 0.5);
IN("#te-p1", at(7, 0.14), 0.4); IN("#te-p2", at(7, 0.36), 0.4);
IN("#te-p3", at(7, 0.58), 0.4); IN("#te-p4", at(7, 0.72), 0.4);
for (let i = 0; i < 7; i++) CHG(`#te-ly${i}`, at(7, 0.4) + i * 0.08, { stroke: "#83C167", fill: "#17241a", strokeWidth: 3 }, 0.3);
PULSE("#te-pyr", at(7, 0.9), "420 630", 1.03);

      tl.to("#te-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#te-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["tests"] = tl;
    })();
  </script>
