};

  for (let i = 1; i <= P.n; i++) IN(`#${P.pf}${name}${i}`, t + 0.1 + i * 0.05, 0.3, {}, { opacity: 0.8 }); };

OUT(ALL.join(","), at(4, 0.0), 0.4);

[0.06, 0.2, 0.66, 0.73, 0.81, 0.9].forEach((f, i) => { tl.set(`#rp-sc${i}`, { opacity: 1 }, at(4, f)); DRAW(`#rp-sc${i}`, at(4, f), 0.4); IN(`#rp-s${i}`, at(4, f) + 0.2, 0.45, { x: i % 2 ? 20 : -20 }, { x: 0 }); });

OUT("#rp-v4q", at(5, 0.0), 0.35);
