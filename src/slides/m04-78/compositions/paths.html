};

tl.fromTo(".pa-xe", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.04 }, at(0, 0.12));

DRAW("#pa-cut", at(0, 0.82), 0.35); tl.set("#pa-cut", { opacity: 1 }, at(0, 0.82));

OUT("#pa-cut", at(0, 0.97), 0.3);
// L1 hubs + rules
IN("#pa-term", at(1, 0.0), 0.5);
IN("#pa-nWETH", at(1, 0.06), 0.4, { y: 14 }, { y: 0 });
IN("#pa-nUSDT", at(1, 0.1), 0.4, { y: 14 }, { y: 0 });
IN("#pa-nWBTC", at(1, 0.14), 0.4, { y: 14 }, { y: 0 });

for (let i = 0; i < 4; i++) IN(`#pa-r${i}`, at(1, 0.3 + i * 0.16), 0.4, { y: 15 }, { y: 0 });
OUT("#pa-term", at(1, 0.97), 0.4);
// L2 dfs
HL("pa-pa", 3, 2, at(2, 0.02));
tl.to("#pa-e-USDC-WETH", { stroke: "#F0B90B", duration: 0.3 }, at(2, 0.12));
HL("pa-pa", 3, 2, at(2, 0.14));
IN("#pa-ex1, #pa-nx", at(2, 0.28), 0.3);
tl.to("#pa-ex1", { stroke: "#8a8f99", duration: 0.2 }, at(2, 0.32));
IN("#pa-stop", at(2, 0.36), 0.3);
HL("pa-pa", 8, 2, at(2, 0.36));
tl.to("#pa-e-WETH-DAI", { stroke: "#F0B90B", duration: 0.3 }, at(2, 0.55));
HL("pa-pa", 6, 2, at(2, 0.55));
IN("#pa-res", at(2, 0.66), 0.5, { x: 40, y: 40 }, { x: 0, y: 0 });
HL("pa-pa", 11, 1, at(2, 0.84));
tl.to("#pa-e-WETH-DAI", { stroke: "#4a4f5a", duration: 0.3 }, at(2, 0.86));
// L3 per-hop quote
OUT("#pa-G, #pa-r0, #pa-r1, #pa-r2, #pa-r3, #pa-res, #pa-pa", at(3, 0.0), 0.4);
IN("#pa-pb", at(3, 0.0) + 0.45, 0.4);
for (let i = 0; i < 4; i++) IN(`#pa-c${i}`, at(3, 0.08 + i * 0.06), 0.3);

IN("#pa-ceg", at(3, 0.15), 0.3);
HL("pa-pb", 1, 3, at(3, 0.35));
IN("#pa-h1", at(3, 0.4), 0.4); IN("#pa-h3", at(3, 0.5), 0.4);
tl.to("#pa-ce0, #pa-ce2", { stroke: "#58C4DD", duration: 0.3 }, at(3, 0.55));
// L4 QuoterV2
IN("#pa-term2", at(4, 0.00), 0.4);
IN("#pa-h2", at(4, 0.03), 0.4);
tl.to("#pa-ce1", { stroke: "#B48EF0", duration: 0.3 }, at(4, 0.03));
HL("pa-pb", 4, 3, at(4, 0.07));
IN("#pa-q", at(4, 0.10), 0.4, { x: 20 }, { x: 0 });
ARROW("#pa-qo", at(4, 0.21), 0.5); IN("#pa-qol", at(4, 0.22), 0.3);
