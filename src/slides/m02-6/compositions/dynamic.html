        <path id="dy-a2" class="dr h" pathLength="1" d="M880 840 C 980 840, 1020 630, 1136 630" fill="none" stroke="#58C4DD" stroke-width="3" marker-end="url(#dy-arr)" />

        <g id="dy-bk" class="h">

        <g id="dy-l2" class="h"><rect x="1150" y="740" width="240" height="60" rx="6" fill="#1b3a44" stroke="#58C4DD" stroke-width="2.5" /><text x="1270" y="780" class="mono" font-size="28" fill="#e8e6df" text-anchor="middle">list[2]</text></g>

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); const P = document.querySelector(p); P.insertBefore(e, P.firstChild); return e; };
      const SLOT = (p, x, y, w, h = 76) => { for (let i = 31; i >= 1; i--) { const xx = x + w * i / 32; mk("line", { x1: xx, y1: y + 6, x2: xx, y2: y + h - 6, stroke: "#2a2f3a", "stroke-width": 1.5 }, p); } mk("rect", { x, y, width: w, height: h, rx: 4, fill: "#12151c", stroke: "#3a404c", "stroke-width": 2 }, p); };
      [0, 1, 2, 3].forEach(i => SLOT(`#dy-s${i}`, 180, 300 + i * 120, 640));
      const grid = document.querySelector("#dy-grid");
      for (let x = 1040; x < 1860; x += 40) { const e = document.createElementNS(NS, "line"); e.setAttribute("x1", x); e.setAttribute("y1", 290); e.setAttribute("x2", x); e.setAttribute("y2", 996); e.setAttribute("stroke", "#1a1e27"); e.setAttribute("stroke-width", 1); grid.appendChild(e); }
      for (let y = 300; y < 1000; y += 40) { const e = document.createElementNS(NS, "line"); e.setAttribute("x1", 1004); e.setAttribute("y1", y); e.setAttribute("x2", 1856); e.setAttribute("y2", y); e.setAttribute("stroke", "#1a1e27"); e.setAttribute("stroke-width", 1); grid.appendChild(e); }

      // L0 长度不固定，排不进格子
      [0, 1, 2, 3].forEach(i => IN(`#dy-s${i}`, at(0, 0.03 + i * 0.05), 0.5));
      IN("#dy-mp, #dy-ar", at(0, 0.2), 0.5, { y: -30 }, { y: 0 });
      tl.fromTo("#dy-mpr", { attr: { width: 260 } }, { attr: { width: 180 }, duration: 0.45, yoyo: true, repeat: 7, ease: "sine.inOut", immediateRender: false }, at(0, 0.3));
      tl.fromTo("#dy-arrb", { attr: { width: 260 } }, { attr: { width: 340 }, duration: 0.5, yoyo: true, repeat: 7, ease: "sine.inOut", immediateRender: false }, at(0, 0.3));
      IN("#dy-hs", at(0, 0.55), 0.8);

      // L1 槽 0 a+c、槽 1 b、槽 2 mapping 只占位
      IN("#dy-bc, #dy-ba", at(1, 0.05), 0.5, { y: -30 }, { y: 0 });
      IN("#dy-bb", at(1, 0.15), 0.5, { y: -30 }, { y: 0 });
      OUT("#dy-ar", at(1, 0.25), 0.4);
      tl.to("#dy-mp", { y: 342, x: -20, duration: 0.8, ease: "power2.in" }, at(1, 0.3));
      OUT("#dy-mp", at(1, 0.42), 0.3);
      IN("#dy-ph", at(1, 0.44), 0.6);

      // L2 k ++ 2 → keccak256 → 远处的格子
      IN("#dy-ck", at(2, 0.05), 0.4, { y: 20 }, { y: 0 });
      IN("#dy-c2", at(2, 0.12), 0.6, { x: -200, y: -250 }, { x: 0, y: 0, ease: "power2.inOut" });
      IN("#dy-pp", at(2, 0.22), 0.3);
      IN("#dy-fun", at(2, 0.25), 0.5);
      tl.to("#dy-kk", { x: 290, y: -30, scale: 0.5, svgOrigin: "276 828", opacity: 0, duration: 0.8, ease: "power2.in" }, at(2, 0.36));
      IN("#dy-stir", at(2, 0.42), 0.2);
      tl.fromTo("#dy-stir", { rotation: 0 }, { rotation: 720, svgOrigin: "560 830", duration: 1.2, ease: "power1.inOut", immediateRender: false }, at(2, 0.42));
      OUT("#dy-stir", at(2, 0.56), 0.2);
      IN("#dy-h1", at(2, 0.56), 0.4, { x: -30 }, { x: 0 });
      ARROW("#dy-a1", at(2, 0.64), 0.9);
      IN("#dy-bk", at(2, 0.74), 0.5, { scale: 0.6, svgOrigin: "1620 410" }, { scale: 1, svgOrigin: "1620 410" });
      IN("#dy-nest", at(2, 0.85), 0.5);

      // L3 数组：槽 3 存长度，元素从 keccak256(3) 开始
      OUT("#dy-h1, #dy-a1", at(3, 0), 0.4);
      IN("#dy-ls", at(3, 0.06), 0.5, { y: -60 }, { y: 0 });
      IN("#dy-c3", at(3, 0.3), 0.5, { x: 120, y: -120 }, { x: 0, y: 0 });
      tl.to("#dy-c3", { x: 220, y: -30, scale: 0.5, svgOrigin: "340 828", opacity: 0, duration: 0.7, ease: "power2.in" }, at(3, 0.4));
      IN("#dy-stir", at(3, 0.46), 0.2);
      tl.fromTo("#dy-stir", { rotation: 0 }, { rotation: 720, svgOrigin: "560 830", duration: 1.0, ease: "power1.inOut", immediateRender: false }, at(3, 0.46));
      OUT("#dy-stir", at(3, 0.57), 0.2);
      IN("#dy-h2", at(3, 0.58), 0.4, { x: -30 }, { x: 0 });
      ARROW("#dy-a2", at(3, 0.64), 0.6);
      IN("#dy-l0", at(3, 0.72), 0.3);
      IN("#dy-l1", at(3, 0.77), 0.3);
      IN("#dy-l2", at(3, 0.82), 0.3);
      IN("#dy-fx", at(3, 0.88), 0.4);

      // L4 拿槽号直接读格子
      OUT("#dy-nest", at(4, 0), 0.3);
      IN("#dy-beam", at(4, 0.3), 0.4, {}, { opacity: 0.7 });
      tl.to("#dy-bkr", { attr: { fill: "#3a3014" }, duration: 0.3 }, at(4, 0.36));
      IN("#dy-hex, #dy-hexn", at(4, 0.42), 0.5);
      IN("#dy-cast", at(4, 0.6), 0.5);

      // L5 forge inspect storage-layout
      OUT("#dy-beam, #dy-cast, #dy-l0, #dy-l1, #dy-l2, #dy-fx, #dy-a2, #dy-h2, #dy-fun", at(5, 0), 0.4);
      IN("#dy-term", at(5, 0.08), 0.5);
      IN("#dy-th", at(5, 0.3), 0.3);
      IN("#dy-r0", at(5, 0.4), 0.3); IN("#dy-r1", at(5, 0.48), 0.3); IN("#dy-r2", at(5, 0.56), 0.3);
      DRAW("#dy-k0", at(5, 0.66), 0.5); IN("#dy-k0", at(5, 0.66), 0.1);
      tl.to("#dy-bar", { stroke: "#F0B90B", duration: 0.3 }, at(5, 0.7));
      DRAW("#dy-k1", at(5, 0.72), 0.5); IN("#dy-k1", at(5, 0.72), 0.1);
      tl.to("#dy-bcr", { stroke: "#F0B90B", duration: 0.3 }, at(5, 0.76));
      DRAW("#dy-k2", at(5, 0.78), 0.5); IN("#dy-k2", at(5, 0.78), 0.1);
      tl.to("#dy-bbr", { stroke: "#F0B90B", duration: 0.3 }, at(5, 0.82));
      /*ENDANIM*/

      tl.to("#dy-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["dynamic"] = tl;
    })();
  </script>
