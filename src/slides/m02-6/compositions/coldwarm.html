  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); (typeof p === "string" ? document.querySelector(p) : p).appendChild(e); return e; };
      const ICE = (p, cx, cy, r, c = "#FC6255") => { for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3, dx = r * Math.cos(a), dy = r * Math.sin(a); mk("line", { x1: cx - dx, y1: cy - dy, x2: cx + dx, y2: cy + dy, stroke: c, "stroke-width": Math.max(2.5, r / 7), "stroke-linecap": "round" }, p); } mk("circle", { cx, cy, r: r / 5, fill: c }, p); };
      const FIRE = (p, cx, cy, r, c = "#FF9F43") => { const s = r / 16, P = (x, y) => `${cx + x * s} ${cy + y * s}`; mk("path", { d: `M${P(0, 16)} C${P(-12, 16)} ${P(-14, 2)} ${P(-6, -6)} C${P(-5, -1)} ${P(-2, 0)} ${P(-1, 1)} C${P(-3, -7)} ${P(0, -13)} ${P(5, -17)} C${P(4, -8)} ${P(13, -4)} ${P(11, 6)} C${P(10, 12)} ${P(6, 16)} ${P(0, 16)} Z`, fill: c }, p); };
      const fmt = v => Math.round(v).toLocaleString("en-US");
      ICE("#co-tci", 690, 535, 26); FIRE("#co-twi", 1090, 537, 30);
      ICE("#co-ci", 1060, 610, 16); FIRE("#co-wi", 1060, 690, 18);
      // 5 个保险柜，每个带门、冷/热小标
      const SX = [520, 740, 960, 1180, 1400];
      SX.forEach((x, i) => {
        mk("rect", { id: `co-sf${i}`, x, y: 300, width: 160, height: 140, rx: 10, fill: "#12202a", stroke: "#58C4DD", "stroke-width": 3 }, "#co-safes");
        mk("rect", { id: `co-dr${i}`, x: x + 10, y: 310, width: 140, height: 120, rx: 6, fill: "#1b3a44", stroke: "#58C4DD", "stroke-width": 1.5 }, "#co-safes");
        mk("circle", { cx: x + 60, cy: 370, r: 24, fill: "none", stroke: "#58C4DD", "stroke-width": 3 }, `#co-safes`);
        const gi = mk("g", { id: `co-ic${i}`, class: "h" }, "#co-ices"); ICE(gi, x + 122, 340, 16);
        const gf = mk("g", { id: `co-fi${i}`, class: "h" }, "#co-fires"); FIRE(gf, x + 122, 342, 18);
      });
      // 外部账户：3 扇门
      [520, 680, 840].forEach((x, i) => {
        mk("rect", { id: `co-d${i}`, x, y: 560, width: 120, height: 160, rx: 8, fill: "#1d1728", stroke: "#B48EF0", "stroke-width": 3 }, "#co-doors");
        mk("circle", { cx: x + 96, cy: 645, r: 7, fill: "#B48EF0" }, "#co-doors");
      });
      const OPEN = (i, t) => { tl.to(`#co-dr${i}`, { scaleX: 0.12, svgOrigin: `${SX[i] + 10} 370`, duration: 0.35, ease: "power2.out" }, t); tl.to(`#co-dr${i}`, { scaleX: 1, svgOrigin: `${SX[i] + 10} 370`, duration: 0.35, ease: "power2.in" }, t + 0.9); };
      const HOT = (i, t) => { OUT(`#co-ic${i}`, t, 0.2); IN(`#co-fi${i}`, t + 0.15, 0.3); };
      const COLD = (i, t) => { OUT(`#co-fi${i}`, t, 0.2); IN(`#co-ic${i}`, t + 0.15, 0.3); };

      // L0 冷 / 热
      IN("#co-badge", at(0, 0.05), 0.5);
      IN("#co-tc", at(0, 0.35), 0.6, { x: -300 }, { x: 0 });
      IN("#co-tw", at(0, 0.5), 0.6, { x: 300 }, { x: 0 });

      // L1 保险柜 / 书桌 / 手
      OUT("#co-tc, #co-tw", at(1, 0), 0.4);
      IN("#co-safes", at(1, 0.1), 0.6, { y: -20 }, { y: 0 });
      IN("#co-desk", at(1, 0.45), 0.6, { y: -20 }, { y: 0 });
      IN("#co-hand", at(1, 0.72), 0.6, { y: -20 }, { y: 0 });

      // L2 冷访问排队 2,100；热访问 100
      SX.forEach((_, i) => IN(`#co-ic${i}`, at(2, 0.02), 0.4));
      IN("#co-man, #co-q0, #co-q1, #co-q2", at(2, 0.05), 0.5);
      IN("#co-term", at(2, 0.14), 0.5);
      IN("#co-meter", at(2, 0.1), 0.4);
      OUT("#co-q2", at(2, 0.2), 0.3); OUT("#co-q1", at(2, 0.25), 0.3); OUT("#co-q0", at(2, 0.3), 0.3);
      OPEN(0, at(2, 0.34));
      tl.to("#co-ic0", { scale: 1.5, svgOrigin: "642 340", duration: 0.2, yoyo: true, repeat: 1 }, at(2, 0.36));
      IN("#co-m1", at(2, 0.37), 0.3);
      COUNT("#co-mn", 0, 2100, at(2, 0.37), 0.4, fmt);
      IN("#co-note", at(2, 0.5), 0.5);
      OUT("#co-m1", at(2, 0.66), 0.2);
      OPEN(0, at(2, 0.72));
      HOT(0, at(2, 0.74));
      IN("#co-m2", at(2, 0.76), 0.3);
      COUNT("#co-mn", 2100, 2200, at(2, 0.76), 0.4, fmt);
      IN("#co-st", at(2, 0.84), 0.5);

      // L3 只在一笔交易内有效
      OUT("#co-term, #co-man, #co-desk, #co-hand, #co-st, #co-m2, #co-note", at(3, 0), 0.4);
      IN("#co-tx, #co-ph", at(3, 0.06), 0.5);
      HOT(1, at(3, 0.14)); HOT(2, at(3, 0.18));
      tl.fromTo("#co-ph", { attr: { cx: 520 } }, { attr: { cx: 1060 }, duration: 1.6, ease: "none", immediateRender: false }, at(3, 0.1));
      IN("#co-sep", at(3, 0.3), 0.3);
      [0, 1, 2].forEach(i => COLD(i, at(3, 0.34)));
      tl.to("#co-ph", { attr: { cx: 1340 }, duration: 1.0, ease: "power1.out" }, at(3, 0.36));
      IN("#co-per, #co-day", at(3, 0.55), 0.5);
      IN("#co-one", at(3, 0.7), 0.5, { x: 20 }, { x: 0 });

      // L4 外部账户：冷 2,600 / 热 100
      OUT("#co-tx, #co-ph, #co-sep, #co-per, #co-day, #co-one", at(4, 0), 0.4);
      IN("#co-doors", at(4, 0.06), 0.5);
      tl.to("#co-d0", { scaleX: 0.15, svgOrigin: "520 640", duration: 0.35, ease: "power2.out" }, at(4, 0.22));
      tl.to("#co-d0", { scaleX: 1, svgOrigin: "520 640", duration: 0.35, ease: "power2.in" }, at(4, 0.32));
      IN("#co-m3", at(4, 0.24), 0.3);
      COUNT("#co-mn", 2200, 4800, at(4, 0.24), 0.4, fmt);
      IN("#co-cost", at(4, 0.3), 0.5);
      OUT("#co-m3", at(4, 0.4), 0.2);
      tl.to("#co-d0", { scaleX: 0.15, svgOrigin: "520 640", duration: 0.35, ease: "power2.out" }, at(4, 0.45));
      tl.to("#co-d0", { scaleX: 1, svgOrigin: "520 640", duration: 0.35, ease: "power2.in" }, at(4, 0.55));
      IN("#co-m4", at(4, 0.47), 0.3);
      COUNT("#co-mn", 4800, 4900, at(4, 0.47), 0.3, fmt);
      IN("#co-eip", at(4, 0.7), 0.5);

      // L5 循环：热读 100 vs 局部变量约 3
      OUT("#co-doors, #co-cost, #co-eip, #co-m4, #co-meter", at(5, 0), 0.4);
      IN("#co-loop, #co-l1, #co-l2, #co-tA, #co-tB", at(5, 0.05), 0.5);
      HOT(3, at(5, 0.05));
      tl.fromTo("#co-l1", { rotation: 0 }, { rotation: 1800, svgOrigin: "580 560", duration: 4.0, ease: "none", immediateRender: false }, at(5, 0.12));
      tl.fromTo("#co-l2", { rotation: 0 }, { rotation: 1800, svgOrigin: "580 700", duration: 4.0, ease: "none", immediateRender: false }, at(5, 0.12));
      for (let k = 0; k < 5; k++) {
        const t = at(5, 0.12) + k * 0.8;
        tl.to("#co-bA", { attr: { width: 160 * (k + 1) }, duration: 0.3 }, t);
        tl.to("#co-tA", { attr: { x: 646 + 160 * (k + 1) }, duration: 0.3 }, t);
        tl.to("#co-sf3", { stroke: "#FF9F43", duration: 0.1, yoyo: true, repeat: 1 }, t);
        const wB = k === 0 ? 160 : 160 + 4.8 * k;
        tl.to("#co-bB", { attr: { width: wB }, duration: 0.3 }, t);
        tl.to("#co-tB", { attr: { x: 646 + wB }, duration: 0.3 }, t);
      }
      IN("#co-cmp", at(5, 0.6), 0.5);
