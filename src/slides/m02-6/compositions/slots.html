    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); const P = document.querySelector(p); P.insertBefore(e, P.firstChild); return e; };
      const SLOT = (p, x, y, w, h = 76) => { for (let i = 31; i >= 1; i--) { const xx = x + w * i / 32; mk("line", { x1: xx, y1: y + 6, x2: xx, y2: y + h - 6, stroke: "#2a2f3a", "stroke-width": 1.5 }, p); } mk("rect", { x, y, width: w, height: h, rx: 4, fill: "#12151c", stroke: "#3a404c", "stroke-width": 2 }, p); };
      [0, 1, 2, 3, 4].forEach(i => SLOT(`#sl-s${i}`, 680, 300 + i * 100, 512));
      [0, 1].forEach(i => SLOT(`#sl-g${i}`, 1332, 300 + i * 100, 512));
      SLOT("#sl-p0", 760, 330, 1024); SLOT("#sl-p1", 760, 480, 1024);
      [0, 1, 2].forEach(i => SLOT(`#sl-m${i}`, 700, 300 + i * 100, 768));
      const HL = (k, t) => tl.to("#sl-hl", { attr: { y: 344 + k * 38 }, opacity: 1, duration: 0.3 }, t);

      // L0 存储槽：一排 32 字节的格子
      IN("#sl-term", at(0, 0.6), 0.6);
      [0, 1, 2, 3, 4].forEach(i => IN(`#sl-s${i}`, at(0, 0.08 + i * 0.07), 0.5, { x: -30 }, { x: 0 }));

      // L1 按声明顺序
      OUT("#sl-term", at(1, 0), 0.4);
      IN("#sl-panel", at(1, 0.05), 0.5);
      IN("#sl-bd", at(1, 0.12), 0.5);
      IN("#sl-rh", at(1, 0.3), 0.3);
      tl.to("#sl-rh", { y: 38, duration: 0.35 }, at(1, 0.5));
      tl.to("#sl-rh", { y: 76, duration: 0.35 }, at(1, 0.72));

      // L2 规则：放得下就挤，放不下开新格
      OUT("#sl-rh", at(2, 0), 0.3);
      IN("#sl-d1", at(2, 0.08), 0.5);
      IN("#sl-d2", at(2, 0.25), 0.6, { x: 420 }, { x: 0, ease: "power2.out" });
      IN("#sl-ok", at(2, 0.38), 0.3);
      IN("#sl-rule", at(2, 0.42), 0.5);
      OUT("#sl-ok", at(2, 0.52), 0.25);
      IN("#sl-d3", at(2, 0.55), 0.5, { x: 640, y: -100 }, { x: 400, y: -100, ease: "power2.out" });
      tl.to("#sl-d3", { x: 340, duration: 0.15, ease: "power2.in" }, at(2, 0.61));
      tl.to("#sl-d3r", { stroke: "#FC6255", duration: 0.15 }, at(2, 0.62));
      tl.to("#sl-d3", { x: 420, duration: 0.3, ease: "power2.out" }, at(2, 0.64));
      tl.to("#sl-d3", { x: 0, y: 0, duration: 0.6, ease: "bounce.out" }, at(2, 0.7));
      tl.to("#sl-d3r", { stroke: "#58C4DD", duration: 0.3 }, at(2, 0.75));
      IN("#sl-dn", at(2, 0.76), 0.3);
      OUT("#sl-d1, #sl-d2, #sl-d3, #sl-dn, #sl-rule", at(2, 0.96), 0.3);

      // L3 Bad：3 个槽
      OUT("#sl-s3, #sl-s4", at(3, 0), 0.4);
      IN("#sl-bw", at(3, 0.02), 0.5);
      HL(1, at(3, 0.1));
      IN("#sl-a", at(3, 0.12), 0.6, { y: -80 }, { y: 0 });
      HL(2, at(3, 0.28));
      IN("#sl-b", at(3, 0.3), 0.5, { y: -260 }, { y: -100 });
      tl.to("#sl-br", { stroke: "#FC6255", duration: 0.15 }, at(3, 0.36));
      tl.to("#sl-b", { x: -14, duration: 0.08, yoyo: true, repeat: 3 }, at(3, 0.36));
      tl.to("#sl-b", { y: 0, duration: 0.6, ease: "bounce.out" }, at(3, 0.47));
      tl.to("#sl-br", { stroke: "#58C4DD", duration: 0.3 }, at(3, 0.52));
      IN("#sl-e0", at(3, 0.55), 0.5);
