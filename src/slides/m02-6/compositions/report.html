    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); document.querySelector(p).appendChild(e); return e; };
      const ICE = (p, cx, cy, r, c = "#FC6255") => { for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3, dx = r * Math.cos(a), dy = r * Math.sin(a); mk("line", { x1: cx - dx, y1: cy - dy, x2: cx + dx, y2: cy + dy, stroke: c, "stroke-width": Math.max(2, r / 7), "stroke-linecap": "round" }, p); } mk("circle", { cx, cy, r: r / 5, fill: c }, p); };
      const FIRE = (p, cx, cy, r, c = "#FF9F43") => { const s = r / 16, P = (x, y) => `${cx + x * s} ${cy + y * s}`; mk("path", { d: `M${P(0, 16)} C${P(-12, 16)} ${P(-14, 2)} ${P(-6, -6)} C${P(-5, -1)} ${P(-2, 0)} ${P(-1, 1)} C${P(-3, -7)} ${P(0, -13)} ${P(5, -17)} C${P(4, -8)} ${P(13, -4)} ${P(11, 6)} C${P(10, 12)} ${P(6, 16)} ${P(0, 16)} Z`, fill: c }, p); };
      const R = "#FC6255", O = "#FF9F43", G = "#F0B90B";
      // 访问条：每次访问一个小方块
      const MARKS = (p, x, y, cols) => cols.forEach((c, i) => mk("rect", { x: x + i * 26, y, width: 20, height: 10, rx: 2, fill: c }, p));
      const SHOWM = (p, t, st = 0.05) => tl.fromTo(`${p} rect`, { opacity: 0 }, { opacity: 1, duration: 0.15, stagger: st }, t);

      // 表格线
      for (let r = 0; r < 5; r++) mk("line", { x1: 500, y1: 380 + r * 90, x2: 1840, y2: 380 + r * 90, stroke: "#2a2f3a", "stroke-width": 2 }, "#rt-grid");
      mk("line", { x1: 810, y1: 220, x2: 810, y2: 740, stroke: "#2a2f3a", "stroke-width": 2 }, "#rt-grid");
      mk("line", { x1: 1400, y1: 220, x2: 1400, y2: 380, stroke: "#2a2f3a", "stroke-width": 2 }, "#rt-grid");
      mk("line", { x1: 1400, y1: 470, x2: 1400, y2: 740, stroke: "#2a2f3a", "stroke-width": 2 }, "#rt-grid");
      // 左侧数组 10 格
      for (let i = 0; i < 10; i++) {
        const x = 100 + (i % 5) * 74, y = 336 + Math.floor(i / 5) * 68;
        mk("rect", { x, y, width: 62, height: 56, rx: 5, fill: "#1b3a44", stroke: "#58C4DD", "stroke-width": 2 }, "#rt-cells");
        const g = mk("g", { id: `rt-ic${i}`, opacity: 0 }, "#rt-ices");
        g.id = `rt-ic${i}`; ICE(`#rt-ic${i}`, x + 31, y + 28, 16);
      }
      ICE("#rt-lenice", 232, 306, 13);
      FIRE("#rt-lenfire", 266, 306, 15);
      ICE("#rt-rateice", 232, 550, 13);
      MARKS("#rt-m1n", 830, 356, [R, ...Array(10).fill(O)]);
      MARKS("#rt-m1o", 1420, 356, [R]);
      MARKS("#rt-m2", 974, 446, Array(10).fill(R));
      MARKS("#rt-m3n", 830, 536, [R, ...Array(9).fill(O)]);
      MARKS("#rt-m4n", 830, 626, [R, ...Array(9).fill(O)]);
      MARKS("#rt-m4o", 1420, 626, [R]);
      MARKS("#rt-m5n", 830, 716, [G, ...Array(9).fill(O)]);
      MARKS("#rt-m5o", 1420, 716, [G]);
      // 终端列高亮（等宽字宽 ≈ 0.6em）
      const hdr = "| Function | min | avg | median | max | # calls |";
      const hdrEl = document.querySelector("#rt-t2");
      let cw = 28 * 0.6;
      try { const w = hdrEl.getComputedTextLength() / hdr.length; if (w > 10 && w < 25) cw = w; } catch (e) {}
      // 数据行：每个字符段按表头同列位置摆放（"…" 用其他字体时宽度不同，逐段定位保证对齐）
      const row = "| accrue   |  …  |  …  |   …    |  …  |    1    |";
      row.split(/(…)/).reduce((idx, seg) => {
        if (seg) { const t = mk("tspan", { x: 280 + idx * cw }, "#rt-t3"); t.textContent = seg; if (seg === "…") t.setAttribute("fill", "#F0B90B"); }
        return idx + seg.length;
      }, 0);
