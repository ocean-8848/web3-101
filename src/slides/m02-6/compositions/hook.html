  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); document.querySelector(p).appendChild(e); return e; };
      const SLOT = (p, x, y, w, h = 76) => { mk("rect", { x, y, width: w, height: h, rx: 4, fill: "#12151c", stroke: "#3a404c", "stroke-width": 2 }, p); for (let i = 1; i < 32; i++) { const xx = x + w * i / 32; mk("line", { x1: xx, y1: y + 6, x2: xx, y2: y + h - 6, stroke: "#2a2f3a", "stroke-width": 1.5 }, p); } };
      const ICE = (p, cx, cy, r, c = "#FC6255") => { for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3, dx = r * Math.cos(a), dy = r * Math.sin(a); mk("line", { x1: cx - dx, y1: cy - dy, x2: cx + dx, y2: cy + dy, stroke: c, "stroke-width": Math.max(2, r / 7), "stroke-linecap": "round" }, p); } mk("circle", { cx, cy, r: r / 5, fill: c }, p); };
      const FIRE = (p, cx, cy, r, c = "#FF9F43") => { const s = r / 16, P = (x, y) => `${cx + x * s} ${cy + y * s}`; mk("path", { d: `M${P(0, 16)} C${P(-12, 16)} ${P(-14, 2)} ${P(-6, -6)} C${P(-5, -1)} ${P(-2, 0)} ${P(-1, 1)} C${P(-3, -7)} ${P(0, -13)} ${P(5, -17)} C${P(4, -8)} ${P(13, -4)} ${P(11, 6)} C${P(10, 12)} ${P(6, 16)} ${P(0, 16)} Z`, fill: c }, p); };
      const fmt = v => Math.round(v).toLocaleString("en-US");

      // 结构：两个合约里的存储格
      for (let i = 0; i < 5; i++) {
        mk("rect", { x: 300, y: 380 + i * 42, width: 480, height: 32, rx: 4, fill: "#12151c", stroke: "#3a404c", "stroke-width": 2 }, "#ho-cellsA");
        mk("rect", { x: 1140, y: 380 + i * 42, width: 480, height: 32, rx: 4, fill: "#12151c", stroke: "#3a404c", "stroke-width": 2 }, "#ho-cellsB");
        mk("rect", { id: `ho-fa${i}`, x: 300, y: 380 + i * 42, width: 480, height: 32, rx: 4, fill: "#58C4DD", opacity: 0 }, "#ho-flA");
        mk("rect", { id: `ho-fb${i}`, x: 1140, y: 380 + i * 42, width: 480, height: 32, rx: 4, fill: "#58C4DD", opacity: 0 }, "#ho-flB");
      }
      SLOT("#ho-slot", 200, 470, 720);
      ICE("#ho-ice1", 392, 628, 15);
      ICE("#ho-ice2", 918, 478, 34);
      FIRE("#ho-fire2", 1004, 480, 36);

      // L0 两个合约 + Gas 条
      IN("#ho-boxA", at(0, 0.03), 0.7, { x: -30 }, { x: 0 });
      IN("#ho-boxB", at(0, 0.08), 0.7, { x: 30 }, { x: 0 });
      IN("#ho-eq", at(0, 0.3), 0.6);
      IN("#ho-gA, #ho-gB", at(0, 0.5), 0.4);
      tl.fromTo("#ho-barA", { attr: { width: 0 } }, { attr: { width: 440 }, duration: 1.4, ease: "power1.out", immediateRender: false }, at(0, 0.55));
      tl.fromTo("#ho-barB", { attr: { width: 0 } }, { attr: { width: 528 }, duration: 2.2, ease: "power1.out", immediateRender: false }, at(0, 0.55));
      tl.to("#ho-rB", { stroke: "#FC6255", duration: 0.4 }, at(0, 0.85));

      // L1 透视：B 碰存储的次数更多
      tl.to("#ho-rA, #ho-rB", { attr: { fill: "#0f1117" }, duration: 0.5 }, at(1, 0.02));
      IN("#ho-cellsA, #ho-cellsB", at(1, 0.05), 0.5);
      const flash = (cell, pulse, t) => {
        tl.fromTo(cell, { opacity: 0 }, { opacity: 0.9, duration: 0.12, immediateRender: false }, t);
        tl.to(cell, { opacity: 0.3, duration: 0.3 }, t + 0.14);
        tl.fromTo(pulse, { opacity: 0 }, { opacity: 0.45, duration: 0.1, immediateRender: false }, t);
        tl.to(pulse, { opacity: 0, duration: 0.25 }, t + 0.12);
      };
      [0, 1, 2, 3, 4].forEach(i => flash(`#ho-fb${i}`, "#ho-pB", at(1, 0.2 + i * 0.15)));
      [1, 3].forEach((i, k) => flash(`#ho-fa${i}`, "#ho-pA", at(1, 0.28 + k * 0.3)));

      // L2 推近：写一个新格子
      OUT("#ho-p1", at(2, 0), 0.5);
      IN("#ho-zl, #ho-slot", at(2, 0.05), 0.5);
      IN("#ho-meter", at(2, 0.08), 0.5);
      IN("#ho-wb", at(2, 0.22), 0.5, { y: -160 }, { y: 0, ease: "bounce.out", duration: 0.8 });
      IN("#ho-i1", at(2, 0.32), 0.4);
      COUNT("#ho-mn", 0, 20000, at(2, 0.32), 0.6, fmt);
      IN("#ho-i2", at(2, 0.42), 0.4);
      COUNT("#ho-mn", 20000, 22100, at(2, 0.42), 0.4, fmt);
      IN("#ho-sum", at(2, 0.55), 0.5);
      IN("#ho-chart", at(2, 0.62), 0.5);
      const bar = (k, h, t) => { tl.fromTo(`#ho-b${k}`, { attr: { y: 740, height: 0 } }, { attr: { y: 740 - h, height: h }, duration: 0.5, ease: "power2.out", immediateRender: false }, t); IN(`#ho-v${k}`, t + 0.35, 0.3); };
      bar(0, 40, at(2, 0.66)); bar(1, 40, at(2, 0.72)); bar(2, 268, at(2, 0.8)); bar(3, 346, at(2, 0.88));

      // L3 路线图
      OUT("#ho-p2", at(3, 0), 0.5);
      IN("#ho-r1", at(3, 0.08), 0.5, { y: 20 }, { y: 0 });
      ARROW("#ho-a1", at(3, 0.3), 0.5);
      IN("#ho-r2", at(3, 0.38), 0.5, { y: 20 }, { y: 0 });
      ARROW("#ho-a2", at(3, 0.6), 0.5);
      IN("#ho-r3", at(3, 0.68), 0.5, { y: 20 }, { y: 0 });

      // L4 一句话，然后缩进右上角
      OUT("#ho-p3", at(4, 0), 0.5);
      IN("#ho-big", at(4, 0.12), 0.7, { scale: 0.85, svgOrigin: "960 505" }, { scale: 1, svgOrigin: "960 505" });
      IN("#ho-sub", at(4, 0.5), 0.6);
      OUT("#ho-sub", at(4, 0.8), 0.3);
      IN("#ho-frame", at(4, 0.84), 0.3);
      tl.to("#ho-motS", { scale: 0.4, svgOrigin: "960 505", duration: 0.7, ease: "power2.inOut" }, at(4, 0.88));
      tl.to("#ho-motO", { x: 680, y: -375, duration: 0.7, ease: "power2.inOut" }, at(4, 0.88));
      /*ENDANIM*/

      tl.to("#ho-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["hook"] = tl;
    })();
  </script>
