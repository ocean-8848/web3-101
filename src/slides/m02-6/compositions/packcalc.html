    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, a, p, txt) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt) e.textContent = txt; const P = document.querySelector(p); P.insertBefore(e, P.firstChild); return e; };
      const SLOT = (p, x, y, w, h = 76) => { for (let i = 31; i >= 1; i--) { const xx = x + w * i / 32; mk("line", { x1: xx, y1: y + 6, x2: xx, y2: y + h - 6, stroke: "#2a2f3a", "stroke-width": 1.5 }, p); } mk("rect", { x, y, width: w, height: h, rx: 4, fill: "#12151c", stroke: "#3a404c", "stroke-width": 2 }, p); };
      const GEAR = (p, cx, cy, r) => { const g = document.querySelector(p); const pts = []; for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, rr = i % 2 ? r * 0.78 : r; pts.push(`${cx + rr * Math.cos(a)},${cy + rr * Math.sin(a)}`); } const e1 = document.createElementNS(NS, "polygon"); e1.setAttribute("points", pts.join(" ")); e1.setAttribute("fill", "none"); e1.setAttribute("stroke", "#8a8f99"); e1.setAttribute("stroke-width", 3); e1.setAttribute("stroke-linejoin", "round"); g.appendChild(e1); const e2 = document.createElementNS(NS, "circle"); e2.setAttribute("cx", cx); e2.setAttribute("cy", cy); e2.setAttribute("r", r * 0.3); e2.setAttribute("fill", "none"); e2.setAttribute("stroke", "#8a8f99"); e2.setAttribute("stroke-width", 3); g.appendChild(e2); };
      const fmt = v => Math.round(v).toLocaleString("en-US");
      [0, 1, 2].forEach(i => SLOT(`#pa-bs${i}`, 180, 260 + i * 96, 640));
      [0, 1].forEach(i => SLOT(`#pa-gs${i}`, 1060, 260 + i * 96, 640));
      [0, 1, 2].forEach(i => SLOT(`#pa-q${i}`, 760, 300 + i * 140, 1024));
      SLOT("#pa-u0", 300, 340, 768); SLOT("#pa-u1", 300, 560, 768);
      GEAR("#pa-gear1", 1140, 378, 32); GEAR("#pa-gear2", 1230, 598, 32);

      // 变量块：灰（值 0）→ 写入后变蓝（非 0）
      const B = [
        ["b0", 500, 260, 320, "a"], ["b1", 180, 356, 640, "b"], ["b2", 500, 452, 320, "c"],
        ["g0", 1060, 260, 320, "c"], ["g1", 1380, 260, 320, "a"], ["g2", 1060, 356, 640, "b"]];
      const E = [[182, 262, 316], [182, 454, 316]];
      const blk = document.querySelector("#pa-blk");
      const add = (tag, a, txt) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt) e.textContent = txt; blk.appendChild(e); return e; };
      E.forEach(([x, y, w], i) => add("rect", { id: `pa-e${i}`, class: "h", x, y, width: w, height: 72, rx: 4, fill: "#12151c", stroke: "#8a8f99", "stroke-width": 2, "stroke-dasharray": "8 6" }));
      B.forEach(([id, x, y, w, n]) => {
        add("rect", { id: `pa-${id}r`, class: "h", x, y, width: w, height: 76, rx: 4, fill: "#161a22", stroke: "#6b6f7a", "stroke-width": 2.5 });
        add("text", { id: `pa-${id}z`, class: "h mono", x: x + w / 2, y: y + 48, "font-size": 28, fill: "#8a8f99", "text-anchor": "middle" }, `${n} = 0`);

      });
      const WRITE = (id, t) => {
        tl.to(`#pa-${id}r`, { attr: { fill: "#1b3a44" }, stroke: "#58C4DD", duration: 0.3 }, t);
        OUT(`#pa-${id}z`, t, 0.2); IN(`#pa-${id}n`, t + 0.2, 0.3);
      };

      // L0 两列槽格，全部为 0
      IN("#pa-tb, #pa-bs0, #pa-bs1, #pa-bs2", at(0, 0.05), 0.6);
      IN("#pa-tg, #pa-gs0, #pa-gs1", at(0, 0.12), 0.6);
      IN("#pa-e0, #pa-e1", at(0, 0.25), 0.4);
      B.forEach(([id], i) => IN(`#pa-${id}r, #pa-${id}z`, at(0, 0.28 + i * 0.04), 0.4));
      IN("#pa-note", at(0, 0.55), 0.5);

      // L1 一个槽 = 20,000 + 2,100
      IN("#pa-meter", at(1, 0.02), 0.4);
      WRITE("b0", at(1, 0.08));
      IN("#pa-tag0a", at(1, 0.2), 0.3);
      COUNT("#pa-mn", 0, 20000, at(1, 0.2), 0.6, fmt);
      IN("#pa-der", at(1, 0.25), 0.5);
      IN("#pa-d1", at(1, 0.3), 0.4);
      IN("#pa-d2", at(1, 0.55), 0.4);
      COUNT("#pa-mn", 20000, 22100, at(1, 0.6), 0.4, fmt);
      OUT("#pa-tag0a", at(1, 0.8), 0.2);
      IN("#pa-tag0", at(1, 0.84), 0.3);

      IN("#pa-lb, #pa-nb", at(2, 0.04), 0.4);
      tl.fromTo("#pa-barB", { attr: { width: 0 } }, { attr: { width: 300 }, duration: 0.4, immediateRender: false }, at(2, 0.06));
      COUNT("#pa-nb", 0, 22100, at(2, 0.06), 0.4, fmt);
