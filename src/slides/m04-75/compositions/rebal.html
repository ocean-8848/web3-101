    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); document.querySelector(p).appendChild(e); return e; };
      // L0 再平衡：旧区间拖走，新区间落下
      IN("#re-term", at(0, 0.04), 0.5);
      DRAW("#re-ax", at(0, 0.06), 0.8);
      IN("#re-old, #re-oldl, #re-now", at(0, 0.12), 0.5);
      tl.to("#re-now", { attr: { x1: 1250, x2: 1250 }, duration: 1.2, ease: "power2.inOut" }, at(0, 0.25));
      tl.to("#re-old", { fill: "#8a8f99", stroke: "#8a8f99", duration: 0.4 }, at(0, 0.42));
      tl.to("#re-oldg", { y: 60, opacity: 0, duration: 0.8, ease: "power2.in" }, at(0, 0.55));
      IN("#re-newg", at(0, 0.66), 0.6, { y: -160 }, { y: 0, ease: "bounce.out" });
      // L1 三个收费站
      OUT("#re-term", at(1, 0.1), 0.4);
      IN("#re-coin", at(1, 0.02), 0.3);
      const booth = (n, t, cx, r) => {
        tl.to("#re-coin", { attr: { cx }, duration: 1.0, ease: "power2.inOut" }, t - 1.0);
        IN(`#re-bt${n}`, t, 0.45, { y: 40 }, { y: 0, ease: "back.out(1.7)" });
        tl.to(`#re-bt${n}r`, { strokeWidth: 7, duration: 0.25, yoyo: true, repeat: 1 }, t + 0.5);
        tl.to("#re-coin", { attr: { r }, duration: 0.3 }, t + 0.5);
      };
      booth(1, at(1, 0.18), 500, 15);
      booth(2, at(1, 0.32), 960, 12.5);
      booth(3, at(1, 0.66), 1420, 10);
      tl.to("#re-bt2r", { strokeWidth: 6, duration: 0.25, yoyo: true, repeat: 1 }, at(1, 0.5));
      IN("#re-bt3b", at(1, 0.86), 0.5, { x: -15 }, { x: 0 });
      tl.to("#re-coin", { attr: { cx: 1250, cy: 760 }, duration: 0.8, ease: "power2.in" }, at(1, 0.9));
      // L2 四种做法：宽区间
      tl.to("#re-sA", { opacity: 0, duration: 0.5 }, at(2, 0));
      tl.to("#re-booths", { y: -320, duration: 0.8, ease: "power2.inOut" }, at(2, 0.02));
      IN("#re-fr", at(2, 0.12), 0.5);
      IN("#re-c1", at(2, 0.3), 0.5);
      tl.to("#re-fr1", { stroke: "#83C167", duration: 0.3 }, at(2, 0.3));
      tl.to("#re-c1d", { attr: { cx: 700 }, duration: 1.4, ease: "sine.inOut" }, at(2, 0.42));
      IN("#re-c1p", at(2, 0.58), 0.4);
      tl.to("#re-c1d", { attr: { cx: 520 }, duration: 1.2, ease: "sine.inOut" }, at(2, 0.62));
      IN("#re-c1n", at(2, 0.84), 0.4);
      // L3 窄区间频繁调整
      tl.to("#re-fr1", { stroke: "#8a8f99", duration: 0.3 }, at(3, 0.0));
      IN("#re-c2", at(3, 0.02), 0.4);
      tl.to("#re-fr2", { stroke: "#83C167", duration: 0.3 }, at(3, 0.02));
      [[1330, 1], [1500, 2], [1250, 3], [1420, 1]].forEach(([x, b], k) => {
        const t = at(3, 0.14 + k * 0.2);
        tl.to("#re-c2d", { attr: { cx: x + 60 + (k % 2 ? -70 : 70) }, duration: 0.45, ease: "sine.inOut" }, t);
        tl.to("#re-c2b", { attr: { x }, duration: 0.3, ease: "power2.inOut" }, t + 0.45);
        tl.to(`#re-bt${b}r`, { fill: "#4a1f1c", strokeWidth: 6, duration: 0.2, yoyo: true, repeat: 1 }, t + 0.5);
      });
      IN("#re-c2p", at(3, 0.3), 0.4);
      IN("#re-c2n", at(3, 0.6), 0.4);
      // L4 单边区间
      tl.to("#re-fr2", { stroke: "#8a8f99", duration: 0.3 }, at(4, 0.0));
      IN("#re-c3", at(4, 0.02), 0.4);
      tl.to("#re-fr3", { stroke: "#83C167", duration: 0.3 }, at(4, 0.02));
      const ks = [0, 1, 2, 3].map(i => mk("rect", { x: 530 + i * 58, y: 834, width: 48, height: 48, rx: 5, fill: "#F0B90B", stroke: "#F0B90B", "stroke-width": 2.5 }, "#re-c3k"));
      tl.fromTo(ks, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.12, immediateRender: false }, at(4, 0.12));
      const tA = at(4, 0.32);
      tl.to("#re-c3d", { attr: { cx: 820 }, duration: 2.4, ease: "none" }, tA);
      ks.forEach((k, i) => tl.to(k, { fill: "#4a3b0e", duration: 0.25 }, tA + 0.55 + i * 0.42));
      IN("#re-c3p", at(4, 0.48), 0.4);
      tl.to("#re-c3d", { attr: { cx: 350 }, duration: 2.4, ease: "none" }, at(4, 0.74));
      ks.slice().reverse().forEach((k, i) => tl.to(k, { fill: "#F0B90B", duration: 0.25 }, at(4, 0.74) + 0.3 + i * 0.42));
      IN("#re-c3n", at(4, 0.84), 0.4);
      // L5 托管金库 / ALM
      tl.to("#re-booths", { opacity: 0, duration: 0.4 }, at(5, 0));
      tl.to("#re-fr3", { stroke: "#8a8f99", duration: 0.3 }, at(5, 0.02));
      IN("#re-term2", at(5, 0.04), 0.5);
      IN("#re-c4", at(5, 0.1), 0.4);
      tl.to("#re-fr4", { stroke: "#B48EF0", duration: 0.3 }, at(5, 0.1));
      [1030, 1080, 1130].forEach((x, i) => {
        const c = mk("circle", { cx: x, cy: 790, r: 10, fill: "#F0B90B", stroke: "#0f1117", "stroke-width": 2.5, opacity: 0 }, "#re-c4c");
        const t = at(5, 0.18) + i * 0.45;
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, t);
        tl.to(c, { attr: { cx: 1285, cy: 805 }, duration: 0.6, ease: "power2.in" }, t + 0.2);
        tl.to(c, { opacity: 0, duration: 0.2 }, t + 0.8);
      });
      [1520, 1600, 1470].forEach((x, i) => tl.to("#re-c4b", { attr: { x }, duration: 0.6, ease: "power2.inOut" }, at(5, 0.32 + i * 0.16)));

      IN("#re-c4n", at(5, 0.56), 0.4);
      OUT("#re-term2", at(5, 0.6), 0.4);
      tl.to("#re-c4n", { opacity: 0.4, duration: 0.25, yoyo: true, repeat: 1 }, at(5, 0.86));
      // L6 不是投资建议
      tl.to("#re-grid", { opacity: 0, duration: 0.5 }, at(6, 0));
      IN("#re-warn", at(6, 0.06), 0.5, { scale: 0.9, svgOrigin: "960 376" }, { scale: 1, svgOrigin: "960 376" });
      IN("#re-same", at(6, 0.28), 0.4);
      IN("#re-pA", at(6, 0.3), 0.5, { y: 20 }, { y: 0 });
      IN("#re-pB", at(6, 0.36), 0.5, { y: 20 }, { y: 0 });
      DRAW("#re-ok", at(6, 0.52), 0.4);
      DRAW("#re-x1", at(6, 0.74), 0.25);
      DRAW("#re-x2", at(6, 0.78), 0.25);

      tl.to("#re-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
