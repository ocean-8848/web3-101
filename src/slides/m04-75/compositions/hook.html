    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); document.querySelector(p).appendChild(e); return e; };
      const X = p => 200 + (p - 60) * 15.2;
      [60, 80, 100, 120, 140, 160].forEach(p => {
        mk("line", { x1: X(p), y1: 760, x2: X(p), y2: 772, stroke: "#58C4DD", "stroke-width": 2 }, "#ho-ticks");
        const t = mk("text", { x: X(p), y: 808, "font-size": 28, fill: "#8a8f99", "text-anchor": "middle" }, "#ho-ticks"); t.textContent = p;
      });
      // L0 两位 LP
      DRAW("#ho-axis", at(0, 0.02), 1.0);
      IN("#ho-ticks", at(0, 0.1), 0.5);
      IN("#ho-pA", at(0, 0.15), 0.6, { y: 20 }, { y: 0 });
      IN("#ho-barA", at(0, 0.3), 0.2);
      tl.fromTo("#ho-barA", { attr: { width: 0 } }, { attr: { width: 1520 }, duration: 1.4, ease: "power2.out", immediateRender: false }, at(0, 0.3));
      IN("#ho-labA", at(0, 0.45), 0.4);
      IN("#ho-pB", at(0, 0.55), 0.6, { y: 20 }, { y: 0 });
      IN("#ho-barB", at(0, 0.68), 0.2);
      tl.fromTo("#ho-barB", { attr: { y: 735, height: 0 } }, { attr: { y: 535, height: 200 }, duration: 1.0, ease: "power2.out", immediateRender: false }, at(0, 0.68));
      IN("#ho-labB", at(0, 0.8), 0.4);
      IN("#ho-now, #ho-nowl", at(0, 0.9), 0.5);
      // L1 本金与手续费
      IN("#ho-bagB", at(1, 0.03), 0.5, { y: -15 }, { y: 0 });
      IN("#ho-bagA", at(1, 0.15), 0.5, { y: -15 }, { y: 0 });
      IN("#ho-same", at(1, 0.38), 0.6, { scale: 0.8, svgOrigin: "960 290" }, { scale: 1, svgOrigin: "960 290" });
      tl.to("#ho-barA", { attr: { y: 730, height: 25 }, duration: 0.4, yoyo: true, repeat: 1 }, at(1, 0.42));
      tl.to("#ho-barB", { fill: "#ffd04a", duration: 0.4, yoyo: true, repeat: 1 }, at(1, 0.42));
      const coin = (sel, cx, y0, y1, t) => {
        const c = mk("circle", { cx, cy: y0, r: 13, fill: "#F0B90B", stroke: "#0f1117", "stroke-width": 3, opacity: 0 }, sel);
        tl.fromTo(c, { opacity: 0, attr: { cy: y0 } }, { opacity: 1, attr: { cy: y1 }, duration: 0.55, ease: "power2.in", immediateRender: false }, t);
        tl.to(c, { opacity: 0, duration: 0.2 }, t + 0.55);
        return c;
      };
      [1470, 1530, 1490, 1515, 1480, 1520, 1500, 1470, 1530].forEach((cx, i) => coin("#ho-coins", cx, 100, 205, at(1, 0.55) + i * 0.32));
      coin("#ho-coins", 300, 100, 205, at(1, 0.75));
      // L2 三个镜头
      tl.to("#ho-s1", { opacity: 0, duration: 0.5 }, at(2, 0));
      IN("#ho-p1", at(2, 0.05), 0.5, { y: 20 }, { y: 0 });
      [280, 320, 300].forEach((cx, i) => coin("#ho-p1c", cx, 395, 515, at(2, 0.07) + i * 0.35));
      tl.to("#ho-p1now", { attr: { x1: 455, x2: 455 }, duration: 1.0, ease: "power2.inOut" }, at(2, 0.17));
      tl.to("#ho-p1bar", { fill: "#8a8f99", duration: 0.4 }, at(2, 0.25));
      IN("#ho-p1t", at(2, 0.27), 0.4);
      IN("#ho-p2", at(2, 0.35), 0.5, { y: 20 }, { y: 0 });
      ARROW("#ho-p2arr", at(2, 0.41), 0.6);
      IN("#ho-brick", at(2, 0.44), 0.35, { y: -90 }, { y: 0, ease: "back.out(1.6)" });
      for (let i = 0; i < 10; i++) {
        const c = mk("circle", { cx: 860 + i * 22, cy: 420, r: 10, fill: "#F0B90B", stroke: "#0f1117", "stroke-width": 2.5, opacity: 0 }, "#ho-p2c");
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, at(2, 0.5) + i * 0.04);
        const tx = i === 9 ? 950 : 1060 + (i % 3) * 22, ty = i === 9 ? 560 : 520 + Math.floor(i / 3) * 26;
        tl.to(c, { attr: { cx: tx, cy: ty }, duration: 0.7, ease: "power2.inOut" }, at(2, 0.56) + i * 0.05);
      }
      IN("#ho-p2t", at(2, 0.62), 0.4);
      IN("#ho-p3", at(2, 0.69), 0.5, { y: 20 }, { y: 0 });

      tl.to("#ho-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
