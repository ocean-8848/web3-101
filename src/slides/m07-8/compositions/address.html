          <rect x="1450" y="600" width="240" height="210" rx="14" fill="#161a22" stroke="#8a8f99" stroke-width="3"/>
          <rect x="1450" y="600" width="240" height="50" rx="14" fill="#FC6255"/>
          <text id="ad-day" class="mono" x="1570" y="760" font-size="64" font-weight="700" fill="#e8e6df" text-anchor="middle">0</text>
        </g>
        <text id="ad-dayl" class="h" x="1720" y="760" font-size="32" fill="#e8e6df">天</text>
        <g id="ad-con" class="h"><rect x="560" y="880" width="800" height="90" rx="45" fill="#83C16722" stroke="#83C167" stroke-width="3"/><text x="960" y="938" font-size="40" font-weight="700" fill="#83C167" text-anchor="middle">完整比对 40 个字符</text></g>
      </g>
<g id="ad-term" class="h">
        <rect x="70" y="56" width="600" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">EIP-55 <tspan font-size="28" font-weight="400" fill="#8a8f99">Mixed-case Checksum</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">用字母大小写编码校验信息</text>
      </g>
      <g id="ad-term2" class="h">
        <rect x="70" y="56" width="580" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">地址投毒 <tspan font-size="28" font-weight="400" fill="#8a8f99">Address Poisoning</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">用前后相同的假地址诱导转错账</text>
      </g>

  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const G = i => "#ad-g" + i;
      const ORANGE = (ids, t) => tl.to(ids.map(G).join(","), { fill: "#FF9F4333", stroke: "#FF9F43", duration: 0.3, stagger: 0.05 }, t);
      // L0 EIP-55
      IN("#ad-term", at(0, 0.02), 0.5);
      IN("#ad-low", at(0, 0.1), 0.5);
      ARROW("#ad-ga", at(0, 0.3), 0.6); IN("#ad-gal", at(0, 0.3), 0.4);
      IN("#ad-mix", at(0, 0.38), 0.6, { x: -20 }, { x: 0 });
      IN("#ad-cpl, #ad-cp", at(0, 0.7), 0.5);
      tl.to("#ad-bad", { fill: "#FC6255", duration: 0.2 }, at(0, 0.78));
      IN("#ad-fail", at(0, 0.84), 0.4);
      OUT("#ad-term", at(0, 0.97), 0.4);
      // L1 hardcode per chain
      OUT("#ad-l0", at(1, 0), 0.4);
      IN("#ad-tb", at(1, 0.06), 0.6);
      IN("#ad-in1", at(1, 0.5), 0.4); IN("#ad-in2", at(1, 0.58), 0.4);
      tl.to("#ad-in1r, #ad-in2r", { stroke: "#FC6255", duration: 0.2 }, at(1, 0.78));
      IN("#ad-x1", at(1, 0.78), 0.25); IN("#ad-x2", at(1, 0.84), 0.25);
      // L2 code hash
      IN("#ad-gc", at(2, 0.05), 0.5);
      ARROW("#ad-c1", at(2, 0.15), 0.4); IN("#ad-kk", at(2, 0.18), 0.5);
      ARROW("#ad-c2", at(2, 0.3), 0.4); IN("#ad-hl1, #ad-hv1", at(2, 0.33), 0.4);
      IN("#ad-hl2", at(2, 0.4), 0.4);
      IN("#ad-hok", at(2, 0.48), 0.4);
      OUT("#ad-hok, #ad-hv1", at(2, 0.62), 0.25);
      IN("#ad-hv1b", at(2, 0.66), 0.3);
      IN("#ad-hno", at(2, 0.7), 0.4);
      IN("#ad-px", at(2, 0.8), 0.5);
      // L3 full compare
      OUT("#ad-l12", at(3, 0), 0.4);
      IN("#ad-r1", at(3, 0.06), 0.4); IN("#ad-r2", at(3, 0.12), 0.4);
      IN("#ad-mh, #ad-mt, #ad-mhl", at(3, 0.25), 0.4);
      OUT("#ad-mh, #ad-mt, #ad-mhl", at(3, 0.45), 0.3);
      IN("#ad-sw", at(3, 0.5), 0.1);
      tl.to("#ad-sw", { attr: { width: 930 }, duration: 1.4, ease: "none" }, at(3, 0.5));
      tl.to("#ad-mid", { fill: "#FC6255", duration: 0.4 }, at(3, 0.5) + 0.5);
      IN("#ad-eq", at(3, 0.5) + 1.4, 0.4);
      // L4 the math
      OUT("#ad-l3", at(4, 0), 0.4);
      IN("#ad-gt", at(4, 0.05), 0.4);
      IN("#ad-grid", at(4, 0.08), 0.6);
      ORANGE([0, 1, 2, 3], at(4, 0.3)); ORANGE([36, 37, 38, 39], at(4, 0.38));
      IN("#ad-f1", at(4, 0.55), 0.6, { y: 20 }, { y: 0 });
      tl.to([0,1,2,3,36,37,38,39].map(G).join(","), { fill: "#FF9F4388", duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.8));
      IN("#ad-f1b", at(4, 0.84), 0.5);
      // L5 GPU speed
      IN("#ad-gpu", at(5, 0.02), 0.5);
      IN("#ad-rate, #ad-rex", at(5, 0.12), 0.5);
      IN("#ad-sw2, #ad-sec", at(5, 0.4), 0.4);
      IN("#ad-f2", at(5, 0.45), 0.5);
      tl.fromTo("#ad-hand", { rotation: 0 }, { rotation: 309.6, svgOrigin: "1560 700", duration: 1.6, ease: "power1.inOut", immediateRender: false }, at(5, 0.55));
      COUNT("#ad-sec", 0, 8.6, at(5, 0.55), 1.6, v => v.toFixed(1) + " s");
      // L6 address poisoning
      OUT("#ad-l5", at(6, 0), 0.4);
      IN("#ad-term2", at(6, 0.05), 0.5);
      IN("#ad-p1l, #ad-p1", at(6, 0.15), 0.4); IN("#ad-p2l, #ad-p2", at(6, 0.3), 0.4);
      ARROW("#ad-pa", at(6, 0.6), 0.5); IN("#ad-pal", at(6, 0.6), 0.4);
      // L7 6+6
      OUT("#ad-l6", at(7, 0), 0.4);
      OUT("#ad-term2", at(7, 0), 0.4);
      OUT("#ad-f1, #ad-f1b", at(7, 0.02), 0.3);
      ORANGE([4, 5], at(7, 0.06)); ORANGE([34, 35], at(7, 0.1));
      IN("#ad-f3", at(7, 0.12), 0.5);
      IN("#ad-f4", at(7, 0.32), 0.5);
      IN("#ad-cal, #ad-dayl", at(7, 0.4), 0.4);
      COUNT("#ad-day", 0, 6.5, at(7, 0.42), 1.6, v => v.toFixed(1));
      IN("#ad-con", at(7, 0.7), 0.5, { scale: 0.8, svgOrigin: "960 925" }, { scale: 1, svgOrigin: "960 925" });


      tl.to("#ad-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ad-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["address"] = tl;
    })();
  </script>
</template>
