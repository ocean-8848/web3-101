      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 CDN -> browser

      IN("#sr-file", at(0, 0.12), 0.5);
      IN("#sr-br", at(0, 0.25), 0.6);
      tl.to("#sr-file", { x: 905, duration: 1.6, ease: "power2.inOut" }, at(0, 0.45));
      // L1 hash = fingerprint
      IN("#sr-term", at(1, 0), 0.5);
      IN("#sr-hdoc", at(1, 0.05), 0.5);
      ARROW("#sr-harr", at(1, 0.15), 0.5);
      IN("#sr-hbar", at(1, 0.25), 0.5);
      IN("#sr-h1", at(1, 0.3), 0.5);
      IN("#sr-byte", at(1, 0.6), 0.3);
      OUT("#sr-h1", at(1, 0.68), 0.2);
      IN("#sr-h2", at(1, 0.74), 0.3);
      tl.to("#sr-hbar", { stroke: "#FC6255", duration: 0.2 }, at(1, 0.74));
      tl.to("#sr-hbar", { strokeWidth: 6, duration: 0.15, yoyo: true, repeat: 3 }, at(1, 0.76));
      // L2 script tag with integrity

      IN("#sr-code", at(2, 0.15), 0.6, { y: 20 }, { y: 0 });
      tl.fromTo("#sr-hl", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, at(2, 0.55));

      // L3 compare in browser

      IN("#sr-lb, #sr-cb", at(3, 0.12), 0.5, { x: -30 }, { x: 0 });

      OUT("#sr-file", at(3, 0.48), 0.3);

      IN("#sr-no", at(3, 0.88), 0.4);
      // L4 openssl

      tl.to("#sr-hl", { fillOpacity: 0.35, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.6));
      tl.to("#sr-term2 rect", { stroke: "#83C167", duration: 0.4 }, at(4, 0.82));
      // L5 even if replaced -> not run; checklist
