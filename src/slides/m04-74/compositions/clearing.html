  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const FMT = v => Math.round(v).toLocaleString("en-US");
      // 轻微呼吸：n 次往返（不用无限循环）
      const PULSE = (s, t, n, origin, k = 1.05) => tl.to(s, { scale: k, svgOrigin: origin, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 2 * n - 1 }, t);


      // L0 标题
      IN("#cl-title", at(0, 0.05), 0.6, { y: 16 }, { y: 0 });
      // L1 表格逐行
      IN("#cl-tbl", at(0, 0.5), 0.6, { y: 16 }, { y: 0 });
      IN("#cl-r0", at(1, 0.04), 0.5, { x: -30 }, { x: 0 });
      IN("#cl-r1", at(1, 0.42), 0.5, { x: -30 }, { x: 0 });
      IN("#cl-r2", at(1, 0.72), 0.5, { x: -30 }, { x: 0 });
      [0.2, 0.58, 0.88].forEach((f, k) => tl.to(`#cl-l${k}`, { fill: "#F0B90B", duration: 0.3, yoyo: true, repeat: 1 }, at(1, f)));
      // L2 方向抵消
      IN("#cl-sell, #cl-s1", at(2, 0.02), 0.6, { x: 30 }, { x: 0 });
      IN("#cl-buy", at(2, 0.22), 0.6, { x: 30 }, { x: 0 });
      tl.to("#cl-s9, #cl-b6, #cl-b3", { fill: "#83C167", duration: 0.5 }, at(2, 0.45));
      IN("#cl-cow", at(2, 0.55), 0.5, { y: 12 }, { y: 0 });
      IN("#cl-term", at(2, 0.68), 0.5);
      tl.to("#cl-term rect", { stroke: "#F0B90B", strokeWidth: 4, duration: 0.4 }, at(2, 0.88));
      tl.to("#cl-term rect", { stroke: "#58C4DD", strokeWidth: 2.5, duration: 0.4 }, at(3, 0.2));
      // L3 剩余 1 ETH 进池子，统一清算价
      ARROW("#cl-a1", at(3, 0.05), 0.7);
      IN("#cl-pool", at(3, 0.12), 0.5);
      tl.to("#cl-s1", { attr: { y: 560 }, opacity: 0, duration: 1.2, ease: "power2.in" }, at(3, 0.22));
      IN("#cl-poolp", at(3, 0.45), 0.5);
      OUT("#cl-term", at(3, 0.55), 0.4);
      DRAW("#cl-line", at(3, 0.66), 0.9);
      IN("#cl-cpl", at(3, 0.8), 0.5);
      // L4 资金核对
      IN("#cl-fl", at(4, 0.06), 0.5, { x: -20 }, { x: 0 });
      tl.fromTo("#cl-fcr", { attr: { width: 0 } }, { attr: { width: 900 }, duration: 4.2, ease: "none" }, at(4, 0.24));
      tl.to("#cl-fl", { fill: "#F0B90B", duration: 0.4, yoyo: true, repeat: 1 }, at(4, 0.3));
      tl.to("#cl-s9, #cl-b6, #cl-b3", { fill: "#a6d98a", duration: 0.4, yoyo: true, repeat: 1 }, at(4, 0.48));
      tl.to("#cl-pool rect", { stroke: "#F0B90B", duration: 0.4, yoyo: true, repeat: 1 }, at(4, 0.64));
      IN("#cl-ok", at(4, 0.8), 0.4, { scale: 0.5, svgOrigin: "490 780" }, { scale: 1, svgOrigin: "490 780" });
      IN("#cl-okt", at(4, 0.86), 0.4);
      // L5 用户剩余
      IN("#cl-term2", at(5, 0.02), 0.5);
      IN("#cl-base", at(5, 0.1), 0.4);
      const COL = (k, h, t) => {
        tl.fromTo(`#cl-c${k}`, { attr: { y: 990, height: 0 } }, { attr: { y: 990 - h, height: h }, duration: 0.8, ease: "power2.out", immediateRender: false }, t);
        IN(`#cl-n${k}`, t, 0.4);
        IN(`#cl-v${k}`, t + 0.6, 0.4);
      };
      COL(0, 120, at(5, 0.16)); COL(1, 72, at(5, 0.42)); COL(2, 18, at(5, 0.64));
      OUT("#cl-term2", at(5, 0.62), 0.4);
      IN("#cl-sum", at(5, 0.84), 0.5, { x: -20 }, { x: 0 });
      // L6 另一个 solver：池价 3,002
      OUT("#cl-fund", at(6, 0.0), 0.4);
      IN("#cl-sol", at(6, 0.06), 0.6, { x: 60 }, { x: 0 });
      COUNT("#cl-pp", 3000, 3002, at(6, 0.26), 0.8, FMT);
      COUNT("#cl-cp", 3000, 3002, at(6, 0.26), 0.8, FMT);
      PULSE("#cl-cpl", at(6, 0.26), 1, "300 688", 1.06);
      OUT("#cl-n0, #cl-n1, #cl-n2", at(6, 0.4), 0.3);
      IN("#cl-m0, #cl-m1, #cl-m2", at(6, 0.4) + 0.35, 0.4);
      [[0, 120, 144], [1, 72, 57.6], [2, 18, 10.8]].forEach(([k, a, b]) => {
        tl.to(`#cl-c${k}`, { attr: { y: 990 - b, height: b }, duration: 0.9, ease: "power2.inOut" }, at(6, 0.45));
        tl.to(`#cl-v${k}`, { attr: { y: 990 - b - 14 }, duration: 0.9, ease: "power2.inOut" }, at(6, 0.45));
      });
      COUNT("#cl-v0", 100, 120, at(6, 0.45), 0.9); COUNT("#cl-v1", 60, 48, at(6, 0.45), 0.9); COUNT("#cl-v2", 15, 9, at(6, 0.45), 0.9);
      COUNT("#cl-sv", 175, 177, at(6, 0.62), 0.8);
      IN("#cl-win", at(6, 0.76), 0.5, { x: -16 }, { x: 0 });
      tl.to("#cl-solb", { stroke: "#83C167", strokeWidth: 4, duration: 0.4 }, at(6, 0.8));

      tl.to("#cl-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#cl-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      tl.to("#cl-term2", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["clearing"] = tl;
    })();
  </script>
