      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const TAB = (k, t) => {
        [0, 1, 2].forEach(j => {
          tl.to(`#vu-tb${j}`, { stroke: j === k ? "#FC6255" : "#6b6f7a", duration: 0.3 }, t);
          tl.to(`#vu-tt${j}`, { fill: j === k ? "#e8e6df" : "#6b6f7a", duration: 0.3 }, t);
        });
      };
      // L0 shields -> tabs
      IN("#vu-sh0", at(0, 0.05), 0.5, { y: 30 }, { y: 0 });
      IN("#vu-sh1", at(0, 0.25), 0.5, { y: 30 }, { y: 0 });
      IN("#vu-sh2", at(0, 0.45), 0.5, { y: 30 }, { y: 0 });
      tl.to("#vu-sh", { opacity: 0, scale: 0.4, svgOrigin: "960 225", duration: 0.6, ease: "power2.in" }, at(1, 0.0));
      IN("#vu-tabs", at(1, 0.08), 0.4);
      TAB(0, at(1, 0.08));
      // L1 reentrancy setup
      IN("#vu-term", at(1, 0.05), 0.5);
      IN("#vu-hA", at(1, 0.14), 0.4); IN("#vu-hV", at(1, 0.2), 0.4);
      IN("#vu-lns", at(1, 0.24), 0.5);
      IN("#vu-pile", at(1, 0.3), 0.4);
      ARROW("#vu-a1", at(1, 0.38), 0.5); IN("#vu-k1", at(1, 0.4), 0.3);
      IN("#vu-bal", at(1, 0.5), 0.4, { x: -16 }, { x: 0 });
      IN("#vu-zero", at(1, 0.8), 0.4); IN("#vu-last", at(1, 0.84), 0.4);
      // L2 reentry loop
      ARROW("#vu-a2", at(2, 0.02), 0.5); IN("#vu-k2", at(2, 0.04), 0.3);
      IN("#vu-ctl", at(2, 0.12), 0.4);
      OUT("#vu-term", at(2, 0.2), 0.4);
      IN("#vu-rcv", at(2, 0.28), 0.3);
      ARROW("#vu-a3", at(2, 0.34), 0.5); IN("#vu-k3", at(2, 0.36), 0.3);
      IN("#vu-loopT", at(2, 0.46), 0.3);
      tl.fromTo("#vu-loopT", { rotation: 0 }, { rotation: 1080, svgOrigin: "560 800", duration: 3.6, ease: "none", immediateRender: false }, at(2, 0.48));
      [2, 1, 0].forEach((c, k) => {
        const t = at(2, 0.48) + 1.2 * (k + 1) - 0.3;
        tl.to(`#vu-c${c}`, { opacity: 0, x: -40, duration: 0.3 }, t);
        tl.to("#vu-bal", { fill: "#FF9F43", duration: 0.15, yoyo: true, repeat: 1 }, t);
      });
