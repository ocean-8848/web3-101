      const fmtN = v => String(Math.round(v));

      IN("#ev-term", at(0, 0.02), 0.5);

      IN("#ev-t2", at(1, 0.3), 0.4);
      OUT("#ev-term", at(1, 0.3), 0.4);
      DRAW("#ev-zm", at(1, 0.42), 0.4); IN("#ev-zm", at(1, 0.42), 0.1);
      IN("#ev-sel", at(1, 0.45), 0.5, { scale: 0.7, svgOrigin: "420 588" }, { scale: 1, svgOrigin: "420 588" });

      IN("#ev-sl2", at(1, 0.6), 0.4);
      tl.to("#ev-sel rect", { fillOpacity: 0.6, duration: 0.3, yoyo: true, repeat: 1, stagger: 0.08 }, at(1, 0.66));
      IN("#ev-abi", at(1, 0.8), 0.5, { attr: { width: 0 } }, { attr: { width: 680 } });
      IN("#ev-abl", at(1, 0.84), 0.4);
      // L2 checks + load
      OUT("#ev-tx", at(2, 0.0), 0.4);
      IN("#ev-ln0, #ev-ln1, #ev-ln2, #ev-ln3", at(2, 0.04), 0.5);
      ARROW("#ev-r2", at(2, 0.08), 0.5);
      IN("#ev-c1", at(2, 0.14), 0.3); IN("#ev-c2", at(2, 0.26), 0.3); IN("#ev-c3", at(2, 0.42), 0.3);
      IN("#ev-gas", at(2, 0.48), 0.4);
      ARROW("#ev-r3", at(2, 0.62), 0.6);
      IN("#ev-k3", at(2, 0.66), 0.4);
      // L3 transfer
      const HL = (row, t) => tl.to("#ev-hl", { attr: { y: 772 + row * 40 }, duration: 0.3, ease: "power2.inOut" }, t);
      IN("#ev-st", at(3, 0.02), 0.4);
      IN("#ev-code", at(3, 0.04), 0.5);
      COUNT("#ev-gn", 0, 51234, at(3, 0.05), 7.0, fmtN);
      ARROW("#ev-r4", at(3, 0.1), 0.5); IN("#ev-k4", at(3, 0.12), 0.3); HL(2, at(3, 0.1));
      tl.to("#ev-st rect:first-child", { stroke: "#e8e6df", duration: 0.2, yoyo: true, repeat: 1 }, at(3, 0.18));
      ARROW("#ev-r5", at(3, 0.24), 0.5); IN("#ev-k5", at(3, 0.26), 0.3); IN("#ev-k5ok", at(3, 0.32), 0.2);
      ARROW("#ev-r6", at(3, 0.42), 0.5); IN("#ev-k6", at(3, 0.44), 0.3); HL(3, at(3, 0.42)); HL(4, at(3, 0.54));
      COUNT("#ev-va", 500, 400, at(3, 0.47), 0.6); COUNT("#ev-vb", 0, 100, at(3, 0.55), 0.6);
      tl.to("#ev-va, #ev-vb", { fill: "#F0B90B", duration: 0.2, yoyo: true, repeat: 1 }, at(3, 0.5));

      IN("#ev-r8", at(3, 0.84), 0.4, { x: 30 }, { x: 0 }); IN("#ev-k8", at(3, 0.86), 0.3);

      IN("#ev-term2", at(4, 0.03), 0.5);
      IN("#ev-g1", at(4, 0.12), 0.4);

      IN("#ev-b2", at(4, 0.47), 0.3); IN("#ev-g2", at(4, 0.48), 0.4);
      IN("#ev-mag", at(4, 0.53), 0.4, { scale: 0.5, svgOrigin: "260 628" }, { scale: 1, svgOrigin: "260 628" });
      IN("#ev-eq1", at(4, 0.62), 0.4); IN("#ev-eq2", at(4, 0.68), 0.4, { x: -20 }, { x: 0 });
      OUT("#ev-term2", at(4, 0.7), 0.4);
      IN("#ev-con", at(4, 0.8), 0.5, { y: 20 }, { y: 0 });

      tl.to("#ev-k5", { fill: "#FC6255", duration: 0.2 }, at(5, 0.14));
      OUT("#ev-k5ok", at(5, 0.14), 0.15); IN("#ev-k5no", at(5, 0.16), 0.2);
      OUT("#ev-r6, #ev-k6, #ev-r7, #ev-k7, #ev-r8, #ev-k8", at(5, 0.22), 0.3);
      tl.to("#ev-r1, #ev-r2, #ev-r3, #ev-r4, #ev-r5", { stroke: "#FC6255", duration: 0.2, yoyo: true, repeat: 1, stagger: { each: 0.06, from: "end" } }, at(5, 0.26));
      COUNT("#ev-va", 400, 500, at(5, 0.38), 0.5); COUNT("#ev-vb", 100, 0, at(5, 0.38), 0.5);
      tl.to("#ev-va, #ev-vb", { fill: "#FC6255", duration: 0.2, yoyo: true, repeat: 1 }, at(5, 0.38));

      IN("#ev-ctr", at(6, 0.06), 0.5);
