      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 复制钥匙
      IN("#ap-term", at(0, 0.3), 0.5);
      IN("#ap-you", at(0, 0.05), 0.6);
      IN("#ap-k1", at(0, 0.15), 0.5, { scale: 0.6, svgOrigin: "800 500" }, { scale: 1, svgOrigin: "800 500" });

      tl.fromTo("#ap-k2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, at(0, 0.7));

      // L1 方便 → 风险；空白支票
      OUT("#ap-term", at(1, 0.1));
      IN("#ap-easy", at(1, 0.0), 0.4);
      tl.to(["#ap-coh", "#ap-cob"], { stroke: "#FC6255", duration: 0.5 }, at(1, 0.2));
      tl.to("#ap-col", { fill: "#FC6255", duration: 0.5 }, at(1, 0.2));
      OUT("#ap-easy", at(1, 0.3), 0.3);
      IN("#ap-tag", at(1, 0.34), 0.5);
      IN("#ap-chq", at(1, 0.6), 0.6, { y: 20 }, { y: 0 });
      IN("#ap-pen", at(1, 0.72), 0.4, { x: 30, y: -30 }, { x: 0, y: 0 });
      IN("#ap-look", at(1, 0.82), 0.5);
      // L2 泳道
      OUT("#ap-ph1", at(2, 0), 0.4);
      ["#ap-h0", "#ap-h1", "#ap-h2", "#ap-h3", "#ap-h4"].forEach((s, i) => IN(s, at(2, 0.08) + i * 0.15, 0.5, { y: -15 }, { y: 0 }));
      ARROW("#ap-m1", at(2, 0.4));
      IN("#ap-m1l", at(2, 0.45), 0.4);
      tl.to("#ap-m1l", { fill: "#e8e6df", duration: 0.2, yoyo: true, repeat: 1 }, at(2, 0.85));
      // L3 签名请求
      ARROW("#ap-m2", at(3, 0.05), 0.7);
      IN("#ap-m2l", at(3, 0.1), 0.4);
      IN("#ap-card", at(3, 0.35), 0.5, { scale: 0.85, svgOrigin: "920 495" }, { scale: 1, svgOrigin: "920 495" });
      tl.to("#ap-cardb", { stroke: "#FC6255", attr: { "stroke-width": 4 }, duration: 0.4 }, at(3, 0.72));
      // L4 确认上链
      tl.to("#ap-cardb", { fill: "#3a2a14", duration: 0.2, yoyo: true, repeat: 1 }, at(4, 0.1));
      ARROW("#ap-m3", at(4, 0.22));
      IN("#ap-m3l", at(4, 0.25), 0.4);
      IN("#ap-led", at(4, 0.45), 0.5);
      tl.fromTo("#ap-lbar", { opacity: 1, attr: { width: 0 } }, { attr: { width: 288 }, duration: 1.0, ease: "power2.out" }, at(4, 0.62));
      // L5 几个月后 transferFrom
      IN("#ap-bal", at(5, 0.0), 0.4);
      tl.fromTo("#ap-bbar", { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(5, 0.0));
      IN("#ap-clock", at(5, 0.22), 0.4);
      tl.fromTo("#ap-hand", { rotation: 0, svgOrigin: "920 890" }, { rotation: 720, svgOrigin: "920 890", duration: 1.6, ease: "power1.inOut" }, at(5, 0.25));
      ARROW("#ap-m4", at(5, 0.55));
      IN("#ap-m4a", at(5, 0.58), 0.4);
      IN("#ap-m4b", at(5, 0.62), 0.4);
      DRAW("#ap-flow", at(5, 0.74), 0.6);
      IN("#ap-coin", at(5, 0.74), 0.2);
      tl.to("#ap-bbar", { attr: { width: 0 }, duration: 0.8, ease: "power2.in" }, at(5, 0.76));
      tl.to("#ap-coin", { attr: { cx: 1640, r: 22 }, duration: 1.0, ease: "power2.inOut" }, at(5, 0.8));
      // L6 标注
      OUT("#ap-clock", at(6, 0));
      IN("#ap-cardhl", at(6, 0.05), 0.4);
      IN("#ap-auth", at(6, 0.08), 0.5);
      IN("#ap-tfhl", at(6, 0.2), 0.4);
      IN("#ap-real", at(6, 0.23), 0.5);
      OUT(["#ap-flow", "#ap-coin"], at(6, 0.5));
      IN("#ap-limit", at(6, 0.58), 0.6);
      tl.to("#ap-lbar", { opacity: 0.4, duration: 0.3, yoyo: true, repeat: 3 }, at(6, 0.8));
      // L7 三个问题

      IN("#ap-q0", at(7, 0.12), 0.5);
      IN("#ap-q1", at(7, 0.42), 0.4, { y: 20 }, { y: 0 });
      IN("#ap-q2", at(7, 0.58), 0.4, { y: 20 }, { y: 0 });
