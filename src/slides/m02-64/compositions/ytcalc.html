  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 lever: tiny YT lifts a whole asset's yield
      IN("#yt-ful", at(0, 0.03), 0.4);
      IN("#yt-beam", at(0, 0.05), 0.5);
      tl.fromTo("#yt-beam", { rotation: 5, svgOrigin: "1150 640" }, { rotation: -5, svgOrigin: "1150 640", duration: 1.6, ease: "back.out(1.6)", immediateRender: true }, at(0, 0.35));
      IN("#yt-lx", at(0, 0.65), 0.6, { y: -15 }, { y: 0 });
      IN("#yt-lxl", at(0, 0.72), 0.4);
      // L1 scenario A
      OUT("#yt-lev", at(1, 0), 0.4);
      IN("#yt-a", at(1, 0.06), 0.6);
      IN("#yt-a2", at(1, 0.35), 0.4); IN("#yt-a3", at(1, 0.55), 0.4);
      IN("#yt-cost", at(1, 0.6), 0.4);
      IN("#yt-ar", at(1, 0.8), 0.5, { scale: 0.8, svgOrigin: "320 555" }, { scale: 1, svgOrigin: "320 555" });
      // L2 scenario B
      IN("#yt-b", at(2, 0.05), 0.6);
      IN("#yt-b2", at(2, 0.3), 0.4); IN("#yt-b3", at(2, 0.5), 0.4);
      IN("#yt-br", at(2, 0.65), 0.5, { scale: 0.8, svgOrigin: "1160 555" }, { scale: 1, svgOrigin: "1160 555" });
      // L3 slider over actual APY
      OUT("#yt-cards", at(3, 0), 0.4);
      IN("#yt-slax", at(3, 0.05), 0.4);
      IN("#yt-imp, #yt-impl", at(3, 0.08), 0.4);
      IN("#yt-knob, #yt-pnl, #yt-rd", at(3, 0.14), 0.3);
      IN("#yt-tv", at(3, 0.55), 0.5);
      (() => {
        const o = { k: 600 }, kn = document.querySelector("#yt-knob"), b = document.querySelector("#yt-pnl"), rd = document.querySelector("#yt-rd");
        const upd = () => {
          const r = (o.k - 300) / 10000, v = (Math.pow(1 + r, 0.4932) - 1) / 0.0283 - 1;
          const w = v * 400, col = v < 0 ? "#FC6255" : "#83C167";
          kn.setAttribute("cx", o.k);
          b.setAttribute("x", Math.min(900, 900 + w)); b.setAttribute("width", Math.abs(w)); b.setAttribute("fill", col);
          rd.textContent = (v < 0 ? "−" : "+") + Math.round(Math.abs(v) * 100) + "%"; rd.setAttribute("fill", col);
        };
        tl.fromTo(o, { k: 600 }, { k: 1200, duration: 3.4, ease: "power1.inOut", immediateRender: false, onUpdate: upd }, at(3, 0.25));
      })();
      // L4 days 180 → 30
      OUT("#yt-sl", at(4, 0), 0.4);
      IN("#yt-dt, #yt-dpt, #yt-dyt, #yt-dpl, #yt-dyl", at(4, 0.06), 0.4);
      (() => {
        const o = { d: 180 }, n = document.querySelector("#yt-dn"), p = document.querySelector("#yt-dpt"), y = document.querySelector("#yt-dyt"),
          pl = document.querySelector("#yt-dpl"), yl = document.querySelector("#yt-dyl");
        tl.fromTo(o, { d: 180 }, { d: 30, duration: 2.6, ease: "power1.inOut", immediateRender: false, onUpdate: () => {
          const pt = 1 / Math.pow(1.06, o.d / 365), w = pt * 1000;
          n.textContent = Math.round(o.d);
          p.setAttribute("width", w); y.setAttribute("x", 460 + w); y.setAttribute("width", 1000 - w);
          pl.textContent = "PT " + pt.toFixed(4); yl.textContent = "YT " + (1 - pt).toFixed(4);
        } }, at(4, 0.2));
      })();
      // L5 maturity gate
      OUT("#yt-days", at(5, 0), 0.4);
      IN("#yt-gate", at(5, 0.05), 0.4);
      IN("#yt-ptm, #yt-ytm, #yt-val", at(5, 0.1), 0.4);
      DRAW("#yt-pipe", at(5, 0.1), 0.5); IN("#yt-pipel", at(5, 0.12), 0.4);
      tl.to("#yt-ptm", { x: 540, duration: 1.0, ease: "power2.inOut" }, at(5, 0.22));
      IN("#yt-ptok", at(5, 0.22) + 0.9, 0.4);
      IN("#yt-cutx", at(5, 0.55), 0.3);
      tl.to("#yt-pipe, #yt-pipel", { opacity: 0, duration: 0.5 }, at(5, 0.6));
      OUT("#yt-cutx", at(5, 0.6) + 0.4, 0.3);
      COUNT("#yt-vn", 0.0048, 0, at(5, 0.6), 0.8, v => v.toFixed(4));
      tl.to("#yt-val", { fill: "#FC6255", duration: 0.3 }, at(5, 0.7));
      IN("#yt-zero", at(5, 0.75), 0.4);
      // L6 only two exits
      OUT("#yt-mat, #yt-cutx, #yt-zero", at(6, 0), 0.4);
      IN("#yt-o1", at(6, 0.1), 0.4, { x: 20 }, { x: 0 });
      IN("#yt-o2", at(6, 0.3), 0.4, { x: 20 }, { x: 0 });
      IN("#yt-o3", at(6, 0.5), 0.4, { x: 20 }, { x: 0 });
      DRAW("#yt-o3x", at(6, 0.65), 0.4);
      tl.to("#yt-o3", { opacity: 0.35, duration: 0.4 }, at(6, 0.75));


      tl.to("#yt-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["ytcalc"] = tl;
    })();
