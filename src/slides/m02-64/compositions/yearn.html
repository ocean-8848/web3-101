    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 title
      IN("#ye-title", at(0, 0.05), 0.8, { y: 20 }, { y: 0 });
      // L1 move title to top-right corner, strategy + two entrances
      OUT("#ye-title", at(1, 0), 0.35);
      IN("#ye-title2", at(1, 0.06), 0.5);
      IN("#ye-s2", at(1, 0.1), 0.7, { scale: 0.9, svgOrigin: "960 635" }, { scale: 1, svgOrigin: "960 635" });
      IN("#ye-person", at(1, 0.45), 0.6);
      ARROW("#ye-ap", at(1, 0.5), 0.7);
      IN("#ye-vault", at(1, 0.7), 0.6);
      ARROW("#ye-a2", at(1, 0.78), 0.6);
      // L2 allocator vault feeds three strategies; Debt Allocator tunes bars

      IN("#ye-s1, #ye-s3", at(2, 0.1), 0.6);
      ARROW("#ye-a1", at(2, 0.15), 0.6); ARROW("#ye-a3", at(2, 0.15), 0.6);
      IN("#ye-bars", at(2, 0.3), 0.5);
      IN("#ye-da", at(2, 0.45), 0.6, { x: 30 }, { x: 0 });
      const tb = at(2, 0.65);
      tl.to("#ye-b1", { attr: { width: 84 }, duration: 1.2, ease: "power2.inOut" }, tb);
      tl.to("#ye-b2", { attr: { width: 126 }, duration: 1.2, ease: "power2.inOut" }, tb);
      COUNT("#ye-p1", 40, 30, tb, 1.2); COUNT("#ye-p2", 35, 45, tb, 1.2);
      // L3 report → profit unlock gradually

      IN("#ye-term", at(3, 0.05), 0.5);
      IN("#ye-rep", at(3, 0.1), 0.5);
      IN("#ye-axes", at(3, 0.15), 0.5);
      tl.fromTo("#ye-ramp", { strokeDashoffset: 1 }, { strokeDashoffset: 0.6, duration: 0.6, ease: "power2.out" }, at(3, 0.2));

        const t0 = at(3, 0.35) + k * 0.9;
        IN(s, t0, 0.2);
        tl.to(s, { attr: { x: 940, y: 300 }, duration: 0.7, ease: "power2.in" }, t0 + 0.15);

        tl.to("#ye-ramp", { strokeDashoffset: 0.6 - (k + 1) * 0.12, duration: 0.8, ease: "none" }, t0 + 0.1);
      });
      OUT("#ye-rep", at(3, 0.95), 0.3);
      // L4 instant step vs ramp
      OUT("#ye-term", at(4, 0), 0.4);
      tl.to("#ye-ramp", { opacity: 0, duration: 0.3 }, at(4, 0.02));
      DRAW("#ye-step", at(4, 0.08), 0.7);
      IN("#ye-spec", at(4, 0.25), 0.6);
      OUT("#ye-spec, #ye-step", at(4, 0.68), 0.35);
      tl.to("#ye-ramp", { opacity: 1, duration: 0.4 }, at(4, 0.74));
      IN("#ye-small", at(4, 0.8), 0.4);
      // L5 fee tree
      OUT("#ye-axes, #ye-ramp, #ye-small, #ye-vault", at(5, 0), 0.4);
      IN("#ye-root", at(5, 0.08), 0.6, { y: -20 }, { y: 0 });

      IN("#ye-fee", at(5, 0.3), 0.5);
      DRAW("#ye-l2", at(5, 0.5), 0.5); DRAW("#ye-l3", at(5, 0.5), 0.5);
      IN("#ye-t10", at(5, 0.4), 0.4);
      IN("#ye-recv", at(5, 0.7), 0.5);

      // L6 note
