  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/

// L0 path only, no direct channel
IN("#ht-n0", at(0, 0.02), 0.4); IN("#ht-n3", at(0, 0.06), 0.4);
IN("#ht-dir", at(0, 0.12), 0.5);
DRAW("#ht-x", at(0, 0.25), 0.4); IN("#ht-nc", at(0, 0.28), 0.4);
IN("#ht-n1", at(0, 0.55), 0.4); IN("#ht-n2", at(0, 0.6), 0.4);
DRAW("#ht-p0", at(0, 0.66), 0.5); DRAW("#ht-p1", at(0, 0.74), 0.5); DRAW("#ht-p2", at(0, 0.82), 0.5);
// L1 secret r -> payment hash -> invoice to Alice
OUT("#ht-dir, #ht-x, #ht-nc", at(1, 0), 0.4);
IN("#ht-rk", at(1, 0.05), 0.4, { y: 20 }, { y: 0 });
IN("#ht-fun", at(1, 0.2), 0.4);
IN("#ht-rk2", at(1, 0.25), 0.1);
tl.to("#ht-rk2", { x: -150, y: -125, duration: 0.6, ease: "power2.in" }, at(1, 0.25));
tl.to("#ht-rk2", { opacity: 0, duration: 0.15 }, at(1, 0.25) + 0.55);
IN("#ht-inv", at(1, 0.4), 0.4, { y: -20 }, { y: 0 });
IN("#ht-ph", at(1, 0.45), 0.5);
OUT("#ht-ph, #ht-fun", at(1, 0.8), 0.3);
tl.to("#ht-inv", { x: -1240, duration: 1.0, ease: "power2.inOut" }, at(1, 0.8));
// L2 HTLC term + first box
IN("#ht-term", at(2, 0.02), 0.5);
IN("#ht-b0", at(2, 0.45), 0.5, { scale: 0.5, svgOrigin: "510 560" }, { scale: 1, svgOrigin: "510 560" });
tl.to("#ht-hg0", { opacity: 0.3, duration: 0.3, yoyo: true, repeat: 3 }, at(2, 0.7));
OUT("#ht-term", at(3, 0.1), 0.4);
// L3 lock left -> right
OUT("#ht-inv", at(3, 0), 0.3);
ARROW("#ht-ga", at(3, 0.05), 1.2);
IN("#ht-m0", at(3, 0.2), 0.4);
IN("#ht-b1", at(3, 0.42), 0.5, { scale: 0.5, svgOrigin: "960 560" }, { scale: 1, svgOrigin: "960 560" }); IN("#ht-m1", at(3, 0.45), 0.4);
IN("#ht-b2", at(3, 0.68), 0.5, { scale: 0.5, svgOrigin: "1410 560" }, { scale: 1, svgOrigin: "1410 560" }); IN("#ht-m2", at(3, 0.71), 0.4);
// L4 claim right -> left with r
OUT("#ht-ga", at(4, 0), 0.3);
ARROW("#ht-gr", at(4, 0.05), 1.2);
tl.to("#ht-rko", { y: -30, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.08));
tl.to("#ht-br2", { stroke: "#83C167", duration: 0.3 }, at(4, 0.2)); tl.to("#ht-m2", { fill: "#83C167", duration: 0.3 }, at(4, 0.2));
tl.to("#ht-rko", { x: -500, duration: 0.7, ease: "power2.inOut" }, at(4, 0.38));
tl.to("#ht-br1", { stroke: "#83C167", duration: 0.3 }, at(4, 0.52)); tl.to("#ht-m1", { fill: "#83C167", duration: 0.3 }, at(4, 0.52));
tl.to("#ht-rko", { x: -900, duration: 0.7, ease: "power2.inOut" }, at(4, 0.68));
tl.to("#ht-br0", { stroke: "#83C167", duration: 0.3 }, at(4, 0.82)); tl.to("#ht-m0", { fill: "#83C167", duration: 0.3 }, at(4, 0.82));
// L5 same payment hash; r becomes proof of payment
tl.to(".ht-lk", { opacity: 0.2, duration: 0.25, yoyo: true, repeat: 3 }, at(5, 0.05));
IN("#ht-same", at(5, 0.08), 0.5);
tl.to("#ht-rko", { x: -1400, duration: 0.8, ease: "power2.inOut" }, at(5, 0.55));
tl.to("#ht-rko", { opacity: 0, duration: 0.3 }, at(5, 0.55) + 0.8);
IN("#ht-rc", at(5, 0.72), 0.5, { scale: 0.6, svgOrigin: "260 435" }, { scale: 1, svgOrigin: "260 435" });
// L6 failure: all or nothing
OUT("#ht-b0, #ht-b1, #ht-b2, #ht-m0, #ht-m1, #ht-m2, #ht-gr, #ht-same, #ht-rc", at(6, 0), 0.4);
tl.set("#ht-br0, #ht-br1, #ht-br2", { stroke: "#F0B90B" }, at(6, 0) + 0.45);
tl.set("#ht-m0, #ht-m1, #ht-m2", { fill: "#F0B90B" }, at(6, 0) + 0.45);
IN("#ht-b0", at(6, 0.1), 0.4); IN("#ht-m0", at(6, 0.1), 0.4);
tl.to("#ht-p1", { stroke: "#FC6255", duration: 0.3 }, at(6, 0.25));
IN("#ht-low", at(6, 0.27), 0.4);
ARROW("#ht-er", at(6, 0.4), 0.8);
tl.to("#ht-b0", { opacity: 0, scale: 1.3, svgOrigin: "510 560", duration: 0.5 }, at(6, 0.58));
OUT("#ht-m0", at(6, 0.6), 0.4);
IN("#ht-whole", at(6, 0.72), 0.5, { y: 15 }, { y: 0 });
// L7 middle node cannot keep the money
OUT("#ht-whole, #ht-er, #ht-low", at(7, 0), 0.4);
tl.to("#ht-p1", { stroke: "#8a8f99", duration: 0.3 }, at(7, 0));
tl.set("#ht-b0", { scale: 1, svgOrigin: "510 560" }, at(7, 0.05));
IN("#ht-b0", at(7, 0.06), 0.4); IN("#ht-m0", at(7, 0.06), 0.4);
tl.to("#ht-b0o", { x: 10, duration: 0.07, yoyo: true, repeat: 7 }, at(7, 0.25));
tl.to("#ht-hg0", { opacity: 0.25, duration: 0.3, yoyo: true, repeat: 5 }, at(7, 0.35));
tl.to("#ht-br0", { stroke: "#FF9F43", duration: 0.3 }, at(7, 0.55));
OUT("#ht-m0", at(7, 0.6), 0.3);
tl.to("#ht-b0o", { x: -250, duration: 0.7, ease: "power2.inOut" }, at(7, 0.62));
tl.to("#ht-b0", { opacity: 0, duration: 0.4 }, at(7, 0.62) + 0.6);
IN("#ht-hold", at(7, 0.7), 0.5);

/*ENDANIM*/

      tl.to("#ht-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ht-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["htlc"] = tl;
    })();
  </script>
