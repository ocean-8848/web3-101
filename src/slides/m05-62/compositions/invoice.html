  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

const B = "#58C4DD", Y = "#F0B90B", W = "#e8e6df";
// L0 QR -> strip
IN("#in-qr", at(0, 0), 0.5);
tl.to("#in-qr", { scaleX: 0, svgOrigin: "960 560", duration: 0.5, ease: "power2.in" }, at(0, 0.25));
IN("#in-strip", at(0, 0.32), 0.5, { scaleX: 0, svgOrigin: "960 310" }, { scaleX: 1, svgOrigin: "960 310" });
IN("#in-seg, #in-sig", at(0, 0.42), 0.6);
IN("#in-b11", at(0, 0.62), 0.5);
// L1 prefix
tl.to("#in-s0", { fill: B, duration: 0.3 }, at(1, 0.08));
IN("#in-pre", at(1, 0.15), 0.5, { y: -10 }, { y: 0 });
// L2 amount
tl.to("#in-s0", { fill: W, duration: 0.3 }, at(2, 0));
OUT("#in-pre", at(2, 0), 0.3);
tl.to("#in-s1", { fill: Y, duration: 0.3 }, at(2, 0.08));
IN("#in-amt-l", at(2, 0.1), 0.3);
IN("#in-mul", at(2, 0.22), 0.6);
IN("#in-calc", at(2, 0.55), 0.6, { x: 20 }, { x: 0 });
IN("#in-calc2", at(2, 0.86), 0.5);
// L3 field chips
tl.to("#in-s1", { fill: W, duration: 0.3 }, at(3, 0));
OUT("#in-amt-l, #in-mul, #in-calc, #in-calc2", at(3, 0), 0.3);
const PULL = (seg, chip, t) => { tl.to(seg, { fill: B, duration: 0.2 }, t); IN(chip, t + 0.1, 0.5, { y: -90 }, { y: 0 }); };
PULL("#in-sp", "#in-cp", at(3, 0.06));
PULL("#in-ss", "#in-cs", at(3, 0.3));
PULL("#in-sd", "#in-cd", at(3, 0.66));
PULL("#in-sx", "#in-cx", at(3, 0.78));
// L4 route hint + signature
tl.to("#in-sp, #in-ss, #in-sd, #in-sx", { fill: W, duration: 0.3 }, at(4, 0));
OUT("#in-cp, #in-cs, #in-cd, #in-cx", at(4, 0), 0.3);
PULL("#in-sr", "#in-cr", at(4, 0.06));
tl.to("#in-sig", { fill: B, duration: 0.2 }, at(4, 0.42));
IN("#in-sg", at(4, 0.46), 0.5, { y: -90 }, { y: 0 });
ARROW("#in-sga", at(4, 0.62), 0.5);
IN("#in-key", at(4, 0.7), 0.5);
// L5 one-time
tl.to("#in-sr, #in-sig", { fill: W, duration: 0.3 }, at(5, 0));
OUT("#in-cr, #in-sg, #in-sga, #in-key", at(5, 0), 0.3);
IN("#in-paid", at(5, 0.06), 0.3, { scale: 1.6, svgOrigin: "1540 448" }, { scale: 1, svgOrigin: "1540 448" });
IN("#in-x", at(5, 0.3), 0.3);
IN("#in-once", at(5, 0.34), 0.5);
IN("#in-hg", at(5, 0.6), 0.4);
tl.fromTo("#in-sand", { scaleY: 1, svgOrigin: "790 756" }, { scaleY: 0, svgOrigin: "790 756", duration: 1.2, ease: "none", immediateRender: false }, at(5, 0.62));
IN("#in-exp", at(5, 0.8), 0.4);
// L6 reusable alternatives
OUT("#in-paid, #in-x, #in-once, #in-hg, #in-exp", at(6, 0), 0.3);
tl.to("#in-strip, #in-seg, #in-sig, #in-b11", { opacity: 0.35, duration: 0.4 }, at(6, 0));
IN("#in-re", at(6, 0.06), 0.5);
IN("#in-t1", at(6, 0.2), 0.4, { y: 15 }, { y: 0 });
IN("#in-t2", at(6, 0.42), 0.4, { y: 15 }, { y: 0 });
IN("#in-t3", at(6, 0.56), 0.4, { y: 15 }, { y: 0 });
IN("#in-sup", at(6, 0.78), 0.5);

      tl.to("#in-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["invoice"] = tl;
    })();
  </script>
