  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const PULSE = (s, t, o = 0.45) => tl.to(s, { opacity: o, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const TO = (s, t, v, d = 0.5) => tl.to(s, { duration: d, ease: "power2.out", ...v }, t);
      const TXT = (s, t, str) => tl.call(() => { document.querySelector(s).textContent = str; }, null, t);
      const TYPE = (s, t, str, d = 1.2) => { const o = { v: 0 }, el = document.querySelector(s); tl.fromTo(o, { v: 0 }, { v: str.length, duration: d, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = str.slice(0, Math.round(o.v)); } }, t); };
// 把伪代码行挪到面板之上
["#ti-k0", "#ti-k1", "#ti-k2", "#ti-k3", "#ti-k4", "#ti-k4b", "#ti-k5"].forEach(s => document.querySelector("#ti-code").appendChild(document.querySelector(s)));
// L0 三个输入 → 估算器
IN("#ti-term", at(0, 0.02), 0.5);
IN("#ti-i0", at(0, 0.1), 0.4, { x: -30 }, { x: 0 }); IN("#ti-i1", at(0, 0.17), 0.4, { x: -30 }, { x: 0 }); IN("#ti-i2", at(0, 0.24), 0.4, { x: -30 }, { x: 0 });
IN("#ti-es", at(0, 0.35), 0.5);
ARROW("#ti-b0", at(0, 0.5), 0.4); ARROW("#ti-b1", at(0, 0.56), 0.4); ARROW("#ti-b2", at(0, 0.62), 0.4);
PULSE("#ti-es", at(0, 0.85));
// L1 三档
ARROW("#ti-a0", at(1, 0.04), 0.4); IN("#ti-n0", at(1, 0.08), 0.4); IN("#ti-f0", at(1, 0.16), 0.4);
PULSE("#ti-n0", at(1, 0.27));
OUT("#ti-term", at(1, 0.28), 0.4);
ARROW("#ti-a1", at(1, 0.38), 0.4); IN("#ti-n1", at(1, 0.42), 0.4); IN("#ti-f1", at(1, 0.48), 0.4);
ARROW("#ti-a2", at(1, 0.6), 0.4); IN("#ti-n2", at(1, 0.64), 0.4); IN("#ti-f2", at(1, 0.7), 0.4);
ARROW("#ti-up", at(1, 0.84), 0.6); IN("#ti-upt", at(1, 0.9), 0.4);
// L2 慢档业务
PULSE("#ti-es", at(2, 0.05));
IN("#ti-l0", at(2, 0.3), 0.5, { x: -20 }, { x: 0 });
IN("#ti-l0b", at(2, 0.66), 0.5, { x: -20 }, { x: 0 });
PULSE("#ti-n0", at(2, 0.88));
// L3 标准 / 快档业务
IN("#ti-l1", at(3, 0.08), 0.5, { x: -20 }, { x: 0 });
IN("#ti-l1b", at(3, 0.3), 0.5, { x: -20 }, { x: 0 });
IN("#ti-l2", at(3, 0.55), 0.5, { x: -20 }, { x: 0 });
PULSE("#ti-n2", at(3, 0.85));
// L4 紧急档
ARROW("#ti-a3", at(4, 0.02), 0.4);
IN("#ti-n3", at(4, 0.06), 0.5, { x: 60 }, { x: 0 });
IN("#ti-g0", at(4, 0.14), 0.3); IN("#ti-g1", at(4, 0.22), 0.3); IN("#ti-g2", at(4, 0.3), 0.3);
ARROW("#ti-ga", at(4, 0.36), 0.4);
IN("#ti-f3", at(4, 0.46), 0.4);
PULSE("#ti-f3", at(4, 0.6));
IN("#ti-u2a", at(4, 0.72), 0.4);
IN("#ti-u2b", at(4, 0.85), 0.4);
// L5 伪代码
OUT("#ti-main", at(5, 0), 0.4);
IN("#ti-panel", at(5, 0.03), 0.4);
for (let i = 0; i < 6; i++) IN("#ti-k" + i, at(5, 0.05 + i * 0.02), 0.3);
IN("#ti-hl", at(5, 0.2), 0.3);
PULSE("#ti-k2", at(5, 0.36), 0.6);
PULSE("#ti-hl", at(5, 0.5), 0.5);
TO("#ti-hl", at(5, 0.65), { y: 62 }, 0.4);
PULSE("#ti-k3", at(5, 0.84), 0.6);
// L6 系数用 ×10 的整数
TO("#ti-hl", at(6, 0.04), { y: 124 }, 0.4);
OUT("#ti-k4", at(6, 0.2), 0.3);
IN("#ti-k4b", at(6, 0.28), 0.4);
PULSE("#ti-k4b", at(6, 0.62), 0.6);
TO("#ti-hl", at(6, 0.56), { attr: { fill: "#F0B90B", "fill-opacity": 0.3 } }, 0.5);
PULSE("#ti-hl", at(6, 0.85), 0.5);

      tl.to("#ti-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ti-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["tiers"] = tl;
    })();
  </script>
