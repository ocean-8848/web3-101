    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const PULSE = (s, t, o = 0.45) => tl.to(s, { opacity: o, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const TO = (s, t, v, d = 0.5) => tl.to(s, { duration: d, ease: "power2.out", ...v }, t);
      const TXT = (s, t, str) => tl.call(() => { document.querySelector(s).textContent = str; }, null, t);
      const TYPE = (s, t, str, d = 1.2) => { const o = { v: 0 }, el = document.querySelector(s); tl.fromTo(o, { v: 0 }, { v: str.length, duration: d, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = str.slice(0, Math.round(o.v)); } }, t); };
// L0 最近的区块与小费
for (let i = 0; i < 5; i++) IN("#ft-k" + i, at(0, 0.02 + i * 0.06), 0.4, { y: 20 }, { y: 0 });
for (let i = 0; i < 5; i++) IN("#ft-g" + i, at(0, 0.36 + i * 0.03), 0.3, { y: -12 }, { y: 0 });
IN("#ft-q", at(0, 0.6), 0.5);
PULSE(["#ft-g0", "#ft-g1", "#ft-g2", "#ft-g3", "#ft-g4"], at(0, 0.86));
// L1 RPC 请求
OUT("#ft-q", at(1, 0), 0.3);
IN("#ft-term", at(1, 0.02), 0.5);
IN("#ft-rpc", at(1, 0.15), 0.5, { y: 20 }, { y: 0 });
ARROW("#ft-ra", at(1, 0.46), 0.6);
PULSE(["#ft-k0", "#ft-k1", "#ft-k2", "#ft-k3", "#ft-k4"], at(1, 0.72));
// L2 baseFeePerGas
IN("#ft-r1l", at(2, 0.05), 0.4);
OUT("#ft-term", at(2, 0.2), 0.4);
for (let i = 0; i < 5; i++) IN("#ft-c" + i, at(2, 0.12 + i * 0.05), 0.3, { y: -16 }, { y: 0 });
IN("#ft-c5", at(2, 0.6), 0.4);
IN("#ft-c5t", at(2, 0.72), 0.4);
PULSE("#ft-c5", at(2, 0.9));
// L3 gasUsedRatio
IN("#ft-r2l", at(3, 0.03), 0.4);
for (let i = 0; i < 5; i++) IN("#ft-u" + i, at(3, 0.1 + i * 0.08), 0.4);
ARROW("#ft-tr", at(3, 0.68), 0.6);
// L4 reward 分位
IN("#ft-r3l", at(4, 0.02), 0.4);
for (let j = 0; j < 15; j++) IN("#ft-d" + j, at(4, 0.05 + j * 0.008), 0.3);
for (let j = 0; j < 15; j++) TO("#ft-d" + j, at(4, 0.28), { attr: { cx: 820 + j * 45 } }, 1.0);
IN("#ft-p10", at(4, 0.42), 0.4, { y: -10 }, { y: 0 });
IN("#ft-p50", at(4, 0.52), 0.4, { y: -10 }, { y: 0 });
IN("#ft-med", at(4, 0.6), 0.4);
IN("#ft-p90", at(4, 0.8), 0.4, { y: -10 }, { y: 0 });
