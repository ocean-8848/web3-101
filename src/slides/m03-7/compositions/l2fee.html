      };

      const PULSE = (s, t, o = 0.5) => tl.to(s, { opacity: o, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const TO = (s, t, v, d = 0.5) => tl.to(s, { duration: d, ease: "power2.out", ...v }, t);

[0.3, 0.7].forEach(f => PULSE("#l2-dots", at(3, f), 0.2));

tl.to("#l2-floor", { attr: { x1: 900, x2: 900 }, duration: 0.8, ease: "power2.inOut" }, at(4, 0.66));

PULSE("#l2-fus", at(4, 0.88), 0.5);
// L5 占比因链而异
IN("#l2-share", at(5, 0.06), 0.5);

// L6 OP Stack
OUT("#l2-main", at(6, 0), 0.5);
IN("#l2-op", at(6, 0.06), 0.5);
IN("#l2-oph", at(6, 0.16), 0.5);
PULSE("#l2-oph", at(6, 0.34));
IN("#l2-opl", at(6, 0.46), 0.5);
IN("#l2-orc", at(6, 0.62), 0.5, { y: 16 }, { y: 0 });
