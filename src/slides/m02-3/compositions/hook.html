  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 金库 + 用户存币
      IN("#ho-vault", at(0, 0.02), 0.8, { y: 30 }, { y: 0 });
      IN("#ho-num, #ho-eth", at(0, 0.12), 0.5);
      IN("#ho-users", at(0, 0.18), 0.6, { x: -30 }, { x: 0 });
      for (let k = 0; k < 6; k++) {
        const t = at(0, 0.3 + k * 0.1), dy = [135, -10, -155][k % 3];
        tl.fromTo(`#ho-c${k}`, { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.15 }, t);
        tl.to(`#ho-c${k}`, { x: 540, y: dy, duration: 0.55, ease: "power2.in" }, t + 0.1);
        tl.to(`#ho-c${k}`, { opacity: 0, duration: 0.12 }, t + 0.6);
      }
      COUNT("#ho-num", 0, 12, at(0, 0.42), 2.6);
      // L1 两个问号气泡
      IN("#ho-q1", at(1, 0.08), 0.5, { y: 20 }, { y: 0 });
      IN("#ho-q2", at(1, 0.55), 0.5, { y: 20 }, { y: 0 });
      // L2 第三个气泡 + 两张卡片来回交换
      IN("#ho-q3", at(2, 0.05), 0.5, { y: -20 }, { y: 0 });
      IN("#ho-kA, #ho-kB, #ho-o1, #ho-o2", at(2, 0.3), 0.5);
      const SW = (t, a) => { // a=1 交换到下/上；a=0 回原位
        tl.to("#ho-kA", { keyframes: [{ x: 190, duration: 0.25 }, { y: a ? 120 : 0, duration: 0.3 }, { x: 0, duration: 0.25 }], ease: "power1.inOut" }, t);
        tl.to("#ho-kB", { keyframes: [{ x: 0, duration: 0.25 }, { y: a ? -120 : 0, duration: 0.3 }, { x: 0, duration: 0.25 }], ease: "power1.inOut" }, t);
      };
      SW(at(2, 0.48), 1); SW(at(2, 0.74), 0);
      // L3 停在“先转账”，红手取币
      SW(at(3, 0.0), 1);
      OUT("#ho-q1, #ho-q2", at(3, 0.02), 0.4);
      IN("#ho-hand", at(3, 0.2), 0.5, { x: 300, y: -70 }, { x: 0, y: 0 });
      for (let k = 0; k < 3; k++) {
        const t = at(3, 0.32 + k * 0.14);
        tl.fromTo(`#ho-t${k}`, { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.1 }, t);
        tl.to(`#ho-t${k}`, { x: 960, y: -235, duration: 0.6, ease: "power2.in" }, t + 0.05);
        tl.to(`#ho-t${k}`, { opacity: 0, duration: 0.1 }, t + 0.6);
      }
      COUNT("#ho-num", 12, 0, at(3, 0.34), 2.0);
      tl.to("#ho-num", { fill: "#FC6255", duration: 0.3 }, at(3, 0.6));
      IN("#ho-norev", at(3, 0.72), 0.5, { scale: 0.8, svgOrigin: "1660 785" }, { scale: 1, svgOrigin: "1660 785" });
      // L4 复原 + 四个标签
      OUT("#ho-hand, #ho-norev, #ho-q3, #ho-kA, #ho-kB, #ho-o1, #ho-o2, #ho-users", at(4, 0.0), 0.4);
      tl.to("#ho-num", { fill: "#F0B90B", duration: 0.3 }, at(4, 0.05));
      COUNT("#ho-num", 0, 12, at(4, 0.05), 0.8);
      const LAB = (k, t) => { IN(`#ho-l${k}`, t, 0.4); DRAW(`#ho-l${k} line`, t + 0.1, 0.5); };
      LAB(3, at(4, 0.2));
      tl.to("#ho-door", { stroke: "#FF9F43", duration: 0.4 }, at(4, 0.24));
      LAB(2, at(4, 0.4));
      IN("#ho-grid", at(4, 0.42), 0.5);
      LAB(1, at(4, 0.6));
      IN("#ho-bell", at(4, 0.6), 0.3);
      tl.to("#ho-bell", { keyframes: [{ rotation: 14, duration: 0.1 }, { rotation: -14, duration: 0.15 }, { rotation: 10, duration: 0.12 }, { rotation: 0, duration: 0.12 }], svgOrigin: "975 346" }, at(4, 0.66));
      LAB(4, at(4, 0.8));
      tl.to("#ho-win", { stroke: "#F0B90B", duration: 0.4 }, at(4, 0.84));
      // L5 左右对比
      tl.to("#ho-main", { opacity: 0, scale: 0.9, svgOrigin: "960 560", duration: 0.6, ease: "power2.inOut" }, at(5, 0.0));
      IN("#ho-div", at(5, 0.1), 0.5);
      IN("#ho-bank", at(5, 0.18), 0.6, { x: -30 }, { x: 0 });
      IN("#ho-chain", at(5, 0.5), 0.6, { x: 30 }, { x: 0 });
      tl.fromTo("#ho-chain path:nth-of-type(2)", { x: -60 }, { x: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, at(5, 0.55));

      tl.to("#ho-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["hook"] = tl;
    })();
