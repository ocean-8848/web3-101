  <script>

      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      [["#va-p1", -700, -260], ["#va-p2", 700, -300], ["#va-p3", -600, 300], ["#va-p4", 700, 300]].forEach(([s, x, y], i) => {
        IN(s, at(0, 0.05) + i * 0.12, 1.1, { x, y }, { x: 0, y: 0, ease: "power3.out" });
      });
      IN("#va-title", at(0, 0.55), 0.6, { y: 16 }, { y: 0 });
      // L1 面板 A，角色
      OUT("#va-body, #va-p1, #va-p2, #va-p3, #va-p4, #va-title", at(1, 0.0), 0.4);
      IN("#va-pa", at(1, 0.03), 0.5);
      for (let k = 1; k <= 12; k++) IN(`#va-L${k}`, at(1, 0.05) + (k - 1) * 0.12, 0.3, { x: -12 }, { x: 0 });

      IN("#va-kc", at(1, 0.28), 0.4);
      IN("#va-b1", at(1, 0.36), 0.5, { y: -90 }, { y: 0 });
      IN("#va-b2", at(1, 0.46), 0.5, { y: -90 }, { y: 0 });
      IN("#va-ac", at(1, 0.6), 0.4);
      IN("#va-b3", at(1, 0.7), 0.5, { y: -90 }, { y: 0 });
      IN("#va-three", at(1, 0.84), 0.4);
      // L2 三本账本
      HL(4, 3, at(2, 0.02));
      OUT("#va-kc, #va-b1, #va-b2, #va-ac, #va-b3, #va-three", at(2, 0.0), 0.35);
      IN("#va-k1", at(2, 0.12), 0.4, { x: 30 }, { x: 0 });
      IN("#va-k2", at(2, 0.32), 0.4, { x: 30 }, { x: 0 });
      IN("#va-k3", at(2, 0.55), 0.4, { x: 30 }, { x: 0 });
      // L3 面板 B，存款入口
      OUT("#va-pa, #va-hl, #va-hlb, #va-k1, #va-k2, #va-k3" + Array.from({ length: 12 }, (_, i) => `, #va-L${i + 1}`).join(""), at(3, 0.0), 0.4);
      IN("#va-pb", at(3, 0.03), 0.4);
      for (let k = 1; k <= 6; k++) IN(`#va-B-L${k}`, at(3, 0.04) + (k - 1) * 0.1, 0.3, { x: -12 }, { x: 0 });
      IN("#va-hl2, #va-hlb2", at(3, 0.1), 0.3);
      IN("#va-laneA", at(3, 0.1), 0.4);
      IN("#va-gate", at(3, 0.14), 0.4);
      HL2(2, 1, at(3, 0.2));
      IN("#va-k0w", at(3, 0.22), 0.3);
      tl.to("#va-k0", { x: 450, duration: 0.5, ease: "power1.inOut" }, at(3, 0.24));
      tl.to("#va-k0", { x: 598, duration: 0.35, ease: "power1.inOut" }, at(3, 0.24) + 0.6);
      tl.to("#va-dep", { stroke: "#FC6255", duration: 0.2 }, at(3, 0.24) + 0.95);
      tl.to("#va-k0", { x: 450, duration: 0.4, ease: "power2.out" }, at(3, 0.24) + 1.0);
      IN("#va-zero", at(3, 0.24) + 1.0, 0.3);
      OUT("#va-k0w", at(3, 0.42), 0.3);
      tl.to("#va-dep", { stroke: "#58C4DD", duration: 0.3 }, at(3, 0.42));
      HL2(5, 1, at(3, 0.44));
      IN("#va-k1w", at(3, 0.46), 0.3);
      tl.to("#va-k1p", { x: 450, duration: 0.5, ease: "power1.inOut" }, at(3, 0.48));
      tl.to("#va-k1p", { x: 598, duration: 0.35 }, at(3, 0.48) + 0.6);
      tl.to("#va-k1p", { x: 1000, duration: 0.5 }, at(3, 0.48) + 1.0);
      tl.to("#va-k1p", { x: 1060, opacity: 0, duration: 0.3 }, at(3, 0.48) + 1.55);
      IN("#va-plus", at(3, 0.48) + 1.8, 0.3);
      HL2(6, 1, at(3, 0.74));
      IN("#va-laneB", at(3, 0.74), 0.4);

      IN("#va-unk", at(3, 0.78) + 0.45, 0.3);

      OUT("#va-pb, #va-hl2, #va-hlb2, #va-laneA, #va-laneB, #va-gate, #va-plus, #va-zero, #va-unk, #va-kuw" + Array.from({ length: 6 }, (_, i) => `, #va-B-L${i + 1}`).join(""), at(4, 0.0), 0.4);
      IN("#va-user", at(4, 0.04), 0.5);
      IN("#va-cyl", at(4, 0.06), 0.5);
      ARROW("#va-in", at(4, 0.1), 0.5); ARROW("#va-out", at(4, 0.14), 0.5);

      IN("#va-glow", at(5, 0.12), 0.5);
      tl.fromTo("#va-glow", { attr: { "stroke-width": 10 } }, { attr: { "stroke-width": 22 }, duration: 0.6, yoyo: true, repeat: 1, immediateRender: false }, at(5, 0.16));
      IN("#va-t1", at(5, 0.2), 0.3); ARROW("#va-g1", at(5, 0.2), 0.4);
      IN("#va-t2", at(5, 0.27), 0.3); ARROW("#va-g2", at(5, 0.27), 0.4);

      tl.set("#va-wd", { opacity: 1 }, at(6, 0.12));
      DRAW("#va-wd", at(6, 0.12), 0.8);
      tl.to("#va-knob", { attr: { cy: 330 }, fill: "#FF9F43", duration: 0.35, ease: "back.out(2)" }, at(6, 0.3));
      IN("#va-bar", at(6, 0.33), 0.3, { y: -30 }, { y: 0 });
      OUT("#va-wd", at(6, 0.33), 0.3); IN("#va-wd2", at(6, 0.33), 0.4);
      IN("#va-pub", at(6, 0.55), 0.4);
      IN("#va-q1", at(6, 0.62), 0.4);
      IN("#va-q2", at(6, 0.74), 0.4);

      tl.to("#va-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);

    })();
