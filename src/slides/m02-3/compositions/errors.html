  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const RING = (t, n = 5) => tl.fromTo("#er-bellR", { rotation: -14 }, { rotation: 14, duration: 0.09, repeat: n, yoyo: true, ease: "sine.inOut", svgOrigin: "960 122", immediateRender: false }, t)
        .to("#er-bellR", { rotation: 0, duration: 0.1, svgOrigin: "960 122" }, t + 0.09 * (n + 1));
      const SOLID = (s, t, c = "#8a8f99") => tl.to(s, { attr: { "stroke-dasharray": "none" }, stroke: c, duration: 0.3 }, t);

      // L0 报警铃 + 四个空槽
      IN("#er-bell", at(0, 0), 0.6, { scale: 0.6, svgOrigin: "960 175" }, { scale: 1, svgOrigin: "960 175" });
      RING(at(0, 0.15));
      tl.fromTo(["#er-s1", "#er-s2", "#er-s3", "#er-s4"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.15, ease: "power3.out" }, at(0, 0.45));
      IN("#er-nums", at(0, 0.7), 0.5);

      // L1 require + 字符串
      SOLID("#er-s1", at(1, 0));
      IN("#er-c1", at(1, 0.05));
      IN("#er-bc", at(1, 0.3), 0.5);
      tl.fromTo("#er-bcg", { attr: { width: 0 } }, { attr: { width: 200 }, duration: 1.0, ease: "power2.out" }, at(1, 0.45));
      IN("#er-bcm", at(1, 0.6), 0.4);
      IN("#er-cost", at(1, 0.75));

      // L2 if + revert 自定义错误
      SOLID("#er-s2", at(2, 0), "#83C167");
      IN("#er-tag", at(2, 0.05), 0.5);
      IN("#er-c2", at(2, 0.1));
      IN("#er-rdl", at(2, 0.42), 0.5);
      IN("#er-rd1", at(2, 0.47), 0.5, { y: -20 }, { y: 0 });
      IN("#er-rd2", at(2, 0.55), 0.5, { y: -20 }, { y: 0 });
      IN("#er-rd3", at(2, 0.6), 0.5, { y: -20 }, { y: 0 });
      IN("#er-4b", at(2, 0.66), 0.5);
      IN("#er-best", at(2, 0.8));

      // L3 require + 自定义错误，版本时间轴
      SOLID("#er-s3", at(3, 0));
      IN("#er-c3", at(3, 0.05));
      DRAW("#er-tline", at(3, 0.35), 0.8);
      IN("#er-v1", at(3, 0.42), 0.6, { x: -20 }, { x: 0 });
      IN("#er-v2", at(3, 0.74), 0.6, { x: -20 }, { x: 0 });

      // L4 assert → Panic
      SOLID("#er-s4", at(4, 0));
      IN("#er-c4", at(4, 0.05));
      IN("#er-pn", at(4, 0.42), 0.5, { scale: 0.7, svgOrigin: "1563 545" }, { scale: 1, svgOrigin: "1563 545", ease: "back.out(2)" });
      RING(at(4, 0.42), 3);
      IN("#er-term", at(4, 0.45), 0.5);
      IN("#er-pnt", at(4, 0.66));

      // L5 四槽缩成一排小图标；try/catch 面板
      OUT(["#er-k1 > *", "#er-k2 > *", "#er-k3 > *", "#er-k4 > *", "#er-nums", "#er-bell"], at(5, 0), 0.35);
      [1, 2, 3, 4].forEach((k, i) => tl.to(`#er-s${k}`, { attr: { x: 90 + i * 320, y: 215, width: 300, height: 58, rx: 12 }, duration: 0.8, ease: "power3.inOut" }, at(5, 0.06)));
      IN("#er-chips", at(5, 0.22), 0.5);
      IN("#er-panel", at(5, 0.3), 0.5);
      tl.fromTo("#er-code .er-ln", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.06 }, at(5, 0.34));
      IN("#er-hl", at(5, 0.62), 0.4);
      IN("#er-me", at(5, 0.55), 0.5);
      ARROW("#er-call", at(5, 0.66), 0.6);
      IN("#er-calll", at(5, 0.72), 0.4);
      IN("#er-feed", at(5, 0.78), 0.5);
      OUT("#er-term", at(5, 0.85), 0.4);

      // L6 三个 catch 分支依次接住
      const HL = (row, t) => tl.to("#er-hl", { y: (row - 1) * 40, duration: 0.45, ease: "power2.inOut" }, t);
      HL(3, at(6, 0.02)); IN("#er-b1", at(6, 0.08), 0.6, { y: -40 }, { y: 0, ease: "bounce.out" });
      HL(5, at(6, 0.36)); IN("#er-b2", at(6, 0.42), 0.6, { y: -40 }, { y: 0, ease: "bounce.out" });
      HL(7, at(6, 0.68)); IN("#er-b3", at(6, 0.74), 0.6, { y: -40 }, { y: 0, ease: "bounce.out" });

      tl.to("#er-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#er-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["errors"] = tl;
    })();
