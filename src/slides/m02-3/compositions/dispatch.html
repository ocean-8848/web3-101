      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const GR = "#83C167", RD = "#FC6255", OR = "#FF9F43", GY = "#8a8f99", BL = "#58C4DD";

      const COL = (s, c, t, d = 0.25) => tl.to(s, { stroke: c, duration: d }, t);
      const NODE = (id, t, d = 0.45) => IN(`#di-${id}`, t, d, { y: -12 }, { y: 0 });
      const MV = (pts, t, d = 0.32) => { pts.forEach((p, i) => tl.to("#di-env", { x: p[0], y: p[1], duration: d, ease: "power1.inOut" }, t + i * d)); return t + pts.length * d; };
      const ENV = (x, y, t, bytes = 0) => {
        tl.fromTo("#di-env", { x, y, opacity: 0 }, { x, y, opacity: 1, duration: 0.25, immediateRender: false }, t);
        tl.set(["#di-envr", "#di-envf"], { stroke: BL }, t);
        tl.set("#di-eb", { opacity: bytes }, t);
      };
      const ABSORB = (id, x, y, t) => { tl.to("#di-env", { x, y, duration: 0.4, ease: "power2.in" }, t); tl.to("#di-env", { opacity: 0, duration: 0.2 }, t + 0.35); COL(`#di-${id}s`, GR, t + 0.35); tl.to(`#di-${id}s`, { strokeWidth: 6, duration: 0.15, yoyo: true, repeat: 1 }, t + 0.35); };
      const REJECT = (id, x, y, t) => {
        tl.to("#di-env", { x, y, duration: 0.4, ease: "power2.in" }, t);
        COL(["#di-envr", "#di-envf"], RD, t + 0.35, 0.1);
        tl.to(`#di-${id}s`, { fill: "#3a1a1c", duration: 0.2 }, t + 0.35);
        tl.to("#di-env", { y: y - 80, duration: 0.45, ease: "power2.out" }, t + 0.45);
        tl.to("#di-env", { opacity: 0, duration: 0.25 }, t + 0.8);
      };
      const OFF = (id, t) => { tl.to(`#di-${id}`, { opacity: 0.3, duration: 0.3 }, t); tl.set(`#di-${id}s`, { attr: { "stroke-dasharray": "10 8" } }, t); };
      const ON = (id, t, c = BL) => { tl.to(`#di-${id}`, { opacity: 1, duration: 0.3 }, t); tl.set(`#di-${id}s`, { attr: { "stroke-dasharray": "none" } }, t); COL(`#di-${id}s`, c, t); };
      const RESET = t => COL(ALLE, GY, t, 0.3);

      // L0 出纳窗口滑入，变成流程入口
      IN("#di-win", at(0, 0), 0.4, { x: -700 }, { x: -700 });
      tl.to("#di-win", { x: 0, duration: 1.1, ease: "power3.out" }, at(0, 0.05));
      OUT("#di-win", at(0, 0.62), 0.35);
      NODE("A", at(0, 0.62));

      // L1 第一个判断：calldata 为空？
      ARROW(E("AB"), at(1, 0), 0.4);
      NODE("B", at(1, 0.05));
      ENV(960, 158, at(1, 0.22));
      COL("#di-Bs", OR, at(1, 0.4));
