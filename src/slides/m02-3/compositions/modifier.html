    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const HL = (k, n, t) => tl.to("#mo-hl, #mo-hlb", { attr: { y: 280 + 42 * (k - 1) - 30, height: 42 * n }, duration: 0.35, ease: "power2.inOut" }, t);
      // L0 代码逐行打出，高亮 owner
      IN("#mo-panel", at(0, 0.0), 0.5);
      for (let k = 1; k <= 12; k++) IN(`#mo-L${k}`, at(0, 0.04) + (k - 1) * 0.22, 0.3, { x: -12 }, { x: 0 });
      tl.set("#mo-hl, #mo-hlb", { attr: { y: 292, height: 42 } }, 0);
      IN("#mo-hl, #mo-hlb", at(0, 0.72), 0.3);
      IN("#mo-tag, #mo-tag1", at(0, 0.78), 0.5, { x: 20 }, { x: 0 });
      // L1 构造函数：只运行一次
      HL(4, 3, at(1, 0.02));
      IN("#mo-tlg", at(1, 0.1), 0.5);
      IN("#mo-d0, #mo-run", at(1, 0.16), 0.3);
      tl.fromTo("#mo-flash", { opacity: 1, attr: { r: 14 } }, { opacity: 0, attr: { r: 50 }, duration: 0.7, ease: "power2.out", immediateRender: false }, at(1, 0.16));
      IN("#mo-c1", at(1, 0.3), 0.4); IN("#mo-c2", at(1, 0.38), 0.4);
      OUT("#mo-tag1", at(1, 0.42), 0.25);
      IN("#mo-tag2", at(1, 0.46), 0.4);
      tl.to("#mo-tag rect", { stroke: "#F0B90B", duration: 0.2, yoyo: true, repeat: 1 }, at(1, 0.46));
      IN("#mo-once", at(1, 0.55), 0.5);
      IN("#mo-pay", at(1, 0.78), 0.5);
      // L2 修饰器：陌生人被门挡下
      OUT("#mo-tag, #mo-tag2, #mo-tlg, #mo-d0, #mo-run, #mo-c1, #mo-c2, #mo-once, #mo-pay", at(2, 0.0), 0.4);
      IN("#mo-term", at(2, 0.05), 0.5);
      HL(7, 2, at(2, 0.1));
      IN("#mo-floor, #mo-door", at(2, 0.22), 0.5);
      tl.fromTo("#mo-pw", { opacity: 0, x: 160 }, { opacity: 1, x: 0, duration: 1.0, ease: "power1.out" }, at(2, 0.36));
      tl.to("#mo-pw", { keyframes: [{ x: -30, duration: 0.2, ease: "power2.in" }, { x: 10, duration: 0.3, ease: "power2.out" }] }, at(2, 0.55));
      tl.to("#mo-door", { fill: "#FC6255", duration: 0.15, yoyo: true, repeat: 1 }, at(2, 0.58));
      IN("#mo-bub", at(2, 0.66), 0.4, { y: 10 }, { y: 0 });
      // L3 自定义错误：参数是谁
      OUT("#mo-term", at(3, 0.0), 0.3);
      IN("#mo-term2", at(3, 0.06), 0.5);
      tl.to("#mo-pglow", { opacity: 0.3, duration: 0.4 }, at(3, 0.45));
      tl.to("#mo-param", { fill: "#ffe2df", duration: 0.4 }, at(3, 0.45));
      IN("#mo-who", at(3, 0.6), 0.4);
      ARROW("#mo-whoa", at(3, 0.62), 0.4);
      // L4 _; 插入函数体
      OUT("#mo-term2", at(4, 0.0), 0.3);
      OUT("#mo-pw, #mo-bub, #mo-who, #mo-whoa", at(4, 0.0), 0.4);
      HL(9, 1, at(4, 0.05));
      IN("#mo-slot, #mo-us", at(4, 0.18), 0.5);
      tl.fromTo("#mo-cw", { opacity: 0, y: -330 }, { opacity: 1, y: 0, duration: 0.9, ease: "bounce.out" }, at(4, 0.38));
      tl.to("#mo-door", { fill: "#83C167", duration: 0.3 }, at(4, 0.6));
      tl.to("#mo-door", { scaleX: 0.2, svgOrigin: "1590 570", duration: 0.5, ease: "power2.inOut" }, at(4, 0.64));
      tl.to("#mo-card rect", { fill: "#24414d", duration: 0.25, yoyo: true, repeat: 1 }, at(4, 0.76));
      DRAW("#mo-ok", at(4, 0.78), 0.4);
      tl.set("#mo-ok", { opacity: 1 }, at(4, 0.78));
      // L5 多个修饰器：从左到右一层套一层
      OUT("#mo-slot, #mo-us, #mo-cw, #mo-ok, #mo-door, #mo-floor", at(5, 0.0), 0.4);
      OUT("#mo-hl, #mo-hlb", at(5, 0.0), 0.4);
      IN("#mo-hd", at(5, 0.08), 0.5);
      tl.to("#mo-hd1", { fill: "#FF9F43", duration: 0.3 }, at(5, 0.26));
      IN("#mo-n1", at(5, 0.26), 0.5, { scale: 1.05, svgOrigin: "1550 570" }, { scale: 1, svgOrigin: "1550 570" });
      tl.to("#mo-hd2", { fill: "#FF9F43", duration: 0.3 }, at(5, 0.42));
      IN("#mo-n2", at(5, 0.42), 0.5, { scale: 1.05, svgOrigin: "1550 580" }, { scale: 1, svgOrigin: "1550 580" });
      IN("#mo-n3", at(5, 0.58), 0.5);
      IN("#mo-lr", at(5, 0.7), 0.5);

      tl.to("#mo-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#mo-term, #mo-term2", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["modifier"] = tl;
    })();
