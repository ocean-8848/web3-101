  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const DROP = (s, t, d = 0.9) => tl.fromTo(s, { opacity: 1, attr: { cy: 240 } }, { opacity: 1, attr: { cy: 600 }, duration: d, ease: "power1.in", immediateRender: false }, t);
      // L0 出纳把钱递出：三条管道
      IN("#se-win", at(0, 0), 0.5, { y: -20 }, { y: 0 });
      DRAW("#se-man", at(0, 0.12), 0.8);
      tl.fromTo(["#se-p1", "#se-p2", "#se-p3"], { opacity: 0, attr: { height: 0 } }, { opacity: 1, attr: { height: 400 }, duration: 0.6, stagger: 0.12, ease: "power2.out" }, at(0, 0.3));
      tl.fromTo(["#se-n1", "#se-n2", "#se-n3"], { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.25 }, at(0, 0.45));
      tl.set(["#se-c1", "#se-c2", "#se-c3"], { opacity: 1 }, at(0, 0.75));
      DROP(["#se-c1", "#se-c2", "#se-c3"], at(0, 0.75));
      tl.set(["#se-c1", "#se-c2", "#se-c3"], { opacity: 0 }, at(0, 0.75) + 0.9);
      // L1 transfer / send：2300 Gas
      tl.to(["#se-p1", "#se-p2"], { attr: { x: (i) => [292, 952][i], width: 16 }, duration: 0.6, ease: "power2.inOut" }, at(1, 0.03));
      tl.to("#se-p3", { attr: { x: 1592, width: 56 }, duration: 0.6, ease: "power2.inOut" }, at(1, 0.03));
      IN(["#se-g1", "#se-g2"], at(1, 0.12), 0.5);
      tl.set("#se-c1", { opacity: 1, attr: { cy: 240 } }, at(1, 0.36));
      tl.to("#se-c1", { attr: { cy: 560 }, duration: 0.6, ease: "power1.in" }, at(1, 0.36));
      tl.to("#se-p1", { stroke: "#FC6255", duration: 0.15 }, at(1, 0.36) + 0.6);
      tl.to("#se-c1", { attr: { cy: 240 }, duration: 0.6, ease: "power2.out" }, at(1, 0.36) + 0.62);
      tl.to("#se-c1", { opacity: 0, duration: 0.2 }, at(1, 0.36) + 1.2);
      IN("#se-rb", at(1, 0.44), 0.5);
      tl.to("#se-p1", { stroke: "#F0B90B", duration: 0.4 }, at(1, 0.56));
      IN("#se-f1", at(1, 0.62), 0.3, { y: -30 }, { y: 0 });
      tl.to("#se-f1o", { x: 240, y: -60, rotation: 25, svgOrigin: "960 668", duration: 1.6, ease: "sine.inOut" }, at(1, 0.68));
      IN("#se-forget", at(1, 0.74), 0.5);
      tl.to("#se-f1", { opacity: 0, duration: 0.5 }, at(1, 0.9));
      // L2 call：转发全部剩余 Gas，检查返回值
      tl.to("#se-p3", { stroke: "#83C167", duration: 0.3 }, at(2, 0.02));
      IN("#se-g3", at(2, 0.1), 0.5);
      tl.set("#se-c3", { opacity: 1, attr: { cy: 240 } }, at(2, 0.12));
      tl.to("#se-c3", { attr: { cy: 600 }, duration: 0.7, ease: "power1.in" }, at(2, 0.12));
      tl.to("#se-c3", { opacity: 0, duration: 0.2 }, at(2, 0.12) + 0.7);
      IN("#se-f2", at(2, 0.42), 0.3, { y: -30 }, { y: 0 });
      IN("#se-chk", at(2, 0.52), 0.5);
      tl.to("#se-f2o", { y: 110, duration: 0.5, ease: "power2.in" }, at(2, 0.68));
      tl.to("#se-f2", { opacity: 0, duration: 0.2 }, at(2, 0.68) + 0.4);
      tl.to("#se-chkr", { strokeWidth: 7, duration: 0.15, yoyo: true, repeat: 1 }, at(2, 0.68) + 0.45);
      // L3 合约钱包：2300 Gas 不够
      OUT(["#se-top > *"], at(3, 0), 0.4);
      IN("#se-wp", at(3, 0.05), 0.5, { x: -40 }, { x: 0 });
      IN("#se-wal", at(3, 0.25), 0.6);
      tl.fromTo("#se-wbar", { attr: { width: 0 } }, { attr: { width: 330 }, duration: 1.8, ease: "none" }, at(3, 0.5));
      tl.to("#se-wbar", { fill: "#FC6255", duration: 0.2 }, at(3, 0.5) + 1.8);
      IN("#se-wx", at(3, 0.5) + 1.9, 0.5, { scale: 0.6, svgOrigin: "1550 545" }, { scale: 1, svgOrigin: "1550 545" });
      // L4 2019 伊斯坦布尔 · EIP-1884
      OUT(["#se-wp", "#se-wal", "#se-wbar", "#se-wx"], at(4, 0), 0.4);
      DRAW("#se-tl", at(4, 0.04), 0.8);
      IN("#se-yr", at(4, 0.1), 0.6, { y: 20 }, { y: 0 });
      IN("#se-tag", at(4, 0.5), 0.5, { x: -40 }, { x: 0 });
      IN("#se-v200", at(4, 0.6), 0.4);
      IN("#se-arw", at(4, 0.78), 0.3);
      IN("#se-v800", at(4, 0.82), 0.4, { scaleY: 0, svgOrigin: "1135 450" }, { scaleY: 1, svgOrigin: "1135 450" });
      // L5 fallback 的 Gas 条越过 2300 线
      DRAW("#se-lim2300", at(5, 0), 0.5); IN("#se-liml", at(5, 0.02), 0.4);
      IN("#se-lab", at(5, 0.05), 0.4);
      tl.fromTo("#se-b1", { attr: { width: 0 } }, { attr: { width: 840 }, duration: 0.9, ease: "power2.out" }, at(5, 0.1));
      tl.fromTo("#se-b2", { attr: { width: 0 } }, { attr: { width: 1140 }, duration: 1.4, ease: "power1.in" }, at(5, 0.4));
      tl.to("#se-b2", { fill: "#FC6255", duration: 0.2 }, at(5, 0.4) + 1.0);
      IN("#se-bx", at(5, 0.4) + 1.4, 0.4);
      // L6 启示

      IN("#se-sum", at(6, 0.05), 0.6);
      IN("#se-cp", at(6, 0.4), 0.5, { scaleY: 0.3, svgOrigin: "960 840" }, { scaleY: 1, svgOrigin: "960 840" });
      IN("#se-s1", at(6, 0.6), 0.5, { y: -20 }, { y: 0 });
      IN("#se-s2", at(6, 0.78), 0.5, { y: -20 }, { y: 0 });

      tl.to("#se-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["sendeth"] = tl;
    })();
