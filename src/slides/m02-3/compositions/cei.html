        <g class="ce-ln h"><text class="mono" x="110" y="400" font-size="28" fill="#6b6f7a" text-anchor="end">4</text><text class="mono" x="197" y="400" font-size="28" fill="#e8e6df">balances[msg.sender] = bal - amount;</text></g>
        <g class="ce-ln h"><text class="mono" x="110" y="440" font-size="28" fill="#6b6f7a" text-anchor="end">5</text><text class="mono" x="197" y="440" font-size="28" fill="#e8e6df">(<tspan fill="#58C4DD">bool</tspan> ok, ) = <tspan fill="#58C4DD">payable</tspan>(msg.sender).call{value: amount}(<tspan fill="#F0B90B">""</tspan>);</text></g>
        <g class="ce-ln h"><text class="mono" x="110" y="480" font-size="28" fill="#6b6f7a" text-anchor="end">6</text><text class="mono" x="197" y="480" font-size="28" fill="#e8e6df"><tspan fill="#58C4DD">if</tspan> (!ok) <tspan fill="#FC6255">revert TransferFailed</tspan>();</text></g>
        <g class="ce-ln h"><text class="mono" x="110" y="520" font-size="28" fill="#6b6f7a" text-anchor="end">7</text><text class="mono" x="130" y="520" font-size="28" fill="#e8e6df">}</text></g>

        <g id="ce-nok" class="h"><line x1="1420" y1="460" x2="1446" y2="486" stroke="#FC6255" stroke-width="5" stroke-linecap="round" /><line x1="1446" y1="460" x2="1420" y2="486" stroke="#FC6255" stroke-width="5" stroke-linecap="round" /></g>

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const MV = (s, pts, t, d = 0.4) => { pts.forEach((p, i) => tl.to(s, { x: p[0], y: p[1], duration: d, ease: "power1.inOut" }, t + i * d)); };
      const HL = (y, h, c, t) => { tl.to("#ce-hl", { attr: { y, height: h }, duration: 0.4, ease: "power2.inOut" }, t); tl.to("#ce-hlb", { attr: { y, height: h }, fill: c, duration: 0.4, ease: "power2.inOut" }, t); };
      // L0 call 交出 ETH 与控制权，接力棒回到 withdraw
      IN("#ce-v", at(0, 0), 0.6);
      IN("#ce-a", at(0, 0.04), 0.6);
      ARROW("#ce-call", at(0, 0.1), 0.7); IN("#ce-calll", at(0, 0.12), 0.4);
      IN("#ce-coin", at(0, 0.15), 0.3, { x: 650, y: 480 }, { x: 650, y: 480 });
      IN("#ce-baton", at(0, 0.15), 0.3, { x: 660, y: 520 }, { x: 660, y: 520 });
      tl.to("#ce-coin", { x: 1440, y: 560, duration: 1.3, ease: "power2.inOut" }, at(0, 0.2));
      tl.to("#ce-baton", { x: 1510, y: 520, duration: 1.3, ease: "power2.inOut" }, at(0, 0.2));
      tl.to("#ce-coin", { opacity: 0, duration: 0.3 }, at(0, 0.2) + 1.3);
      DRAW("#ce-loop", at(0, 0.5), 1.2); tl.set("#ce-loop", { opacity: 1 }, at(0, 0.5));
      MV("#ce-baton", [[1510, 830], [410, 830], [410, 700]], at(0, 0.55), 0.55);
      tl.to("#ce-v rect:nth-of-type(2)", { stroke: "#FC6255", duration: 0.2, yoyo: true, repeat: 1 }, at(0, 0.55) + 1.65);
      IN("#ce-term", at(0, 0.84), 0.5);
      // L1 错误顺序：先转账，后扣账
      IN("#ce-wrong", at(1, 0), 0.5);
      IN(["#ce-ledg", "#ce-l3"], at(1, 0.05), 0.5);
      [0, 1, 2].forEach(k => {
        const t = at(1, 0.15 + k * 0.23);
        IN("#ce-ok", t, 0.25); OUT("#ce-ok", t + 0.7, 0.2);
        tl.to("#ce-l3", { fill: "#F0B90B", duration: 0.15, yoyo: true, repeat: 1 }, t);
        tl.fromTo("#ce-coin", { x: 640, y: 480, opacity: 1 }, { x: 1420 + k * 90, y: 600, opacity: 1, duration: 0.6, ease: "power2.inOut", immediateRender: false }, t + 0.4);
        tl.set("#ce-coin", { opacity: 0 }, t + 1.0);
        tl.set(`#ce-got${k}`, { opacity: 1 }, t + 1.0);
        tl.set("#ce-baton", { x: 1510, y: 560 }, t + 1.0);
        MV("#ce-baton", [[1510, 830], [410, 830], [410, 700]], t + 1.05, 0.38);
      });
      OUT("#ce-l3", at(1, 0.86), 0.2); IN("#ce-l0", at(1, 0.88), 0.3);
      tl.to("#ce-ledg rect", { stroke: "#FC6255", strokeWidth: 5, duration: 0.15, yoyo: true, repeat: 3 }, at(1, 0.88));
      // L2 推荐写法：① 检查
      OUT(["#ce-big", "#ce-wrong", "#ce-coin", "#ce-baton", "#ce-term"], at(2, 0), 0.4);
      IN("#ce-panel", at(2, 0.04), 0.5);
      tl.fromTo(".ce-ln", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.07 }, at(2, 0.06));
      IN(["#ce-mv", "#ce-m3"], at(2, 0.14), 0.5);
      IN("#ce-ma", at(2, 0.18), 0.5);
      IN(["#ce-hl", "#ce-hlb"], at(2, 0.3), 0.4);
      IN("#ce-s1", at(2, 0.32), 0.4);
      IN("#ce-bub", at(2, 0.62), 0.5, { x: -20 }, { x: 0 });
      // L3 ② 生效：账本先扣
      OUT("#ce-bub", at(3, 0), 0.3);
      HL(372, 38, "#58C4DD", at(3, 0.02));
      IN("#ce-s2", at(3, 0.06), 0.4);
      OUT("#ce-m3", at(3, 0.32), 0.2); IN("#ce-m0", at(3, 0.38), 0.3);
      tl.to("#ce-mv rect:nth-of-type(2)", { strokeWidth: 5, duration: 0.15, yoyo: true, repeat: 1 }, at(3, 0.38));
      // L4 ③ 交互：最后才转账
      HL(412, 78, "#F0B90B", at(4, 0.02));
      IN("#ce-s3", at(4, 0.06), 0.4);
      IN("#ce-mc", at(4, 0.25), 0.3);
      tl.to("#ce-mc", { attr: { cx: 1500 }, duration: 0.9, ease: "power2.inOut" }, at(4, 0.3));
      IN("#ce-nok", at(4, 0.7), 0.4, { scale: 0.5, svgOrigin: "1433 473" }, { scale: 1, svgOrigin: "1433 473" });
      // L5 重入被余额检查拦下
      HL(332, 38, "#FF9F43", at(5, 0.02));
      ARROW("#ce-re", at(5, 0.08), 0.8);
      IN("#ce-gate", at(5, 0.25), 0.3);
      tl.to("#ce-m0", { fill: "#FF9F43", duration: 0.2, yoyo: true, repeat: 1 }, at(5, 0.35));
      IN("#ce-rev", at(5, 0.5), 0.4, { scale: 0.6, svgOrigin: "960 758" }, { scale: 1, svgOrigin: "960 758", ease: "back.out(2)" });
      // L6 nonReentrant 重入锁
      OUT(["#ce-rev", "#ce-re", "#ce-gate"], at(6, 0), 0.4);
      HL(252, 38, "#83C167", at(6, 0.02));
      tl.to("#ce-hl", { fill: "#83C167", duration: 0.3 }, at(6, 0.02));
      IN("#ce-lock", at(6, 0.06), 0.5, { y: -24 }, { y: 0, ease: "bounce.out" });
      IN("#ce-glk", at(6, 0.12), 0.5, { y: -24 }, { y: 0, ease: "bounce.out" });
      ARROW("#ce-re2", at(6, 0.2), 0.8);
      IN("#ce-x2", at(6, 0.27), 0.3, { scale: 0.5, svgOrigin: "715 625" }, { scale: 1, svgOrigin: "715 625" });
      IN("#ce-term2", at(6, 0.42), 0.5);
      IN("#ce-sv", at(6, 0.62), 0.6);
      [0.78, 0.9].forEach(f => {
        tl.to(["#ce-glk", "#ce-lock"], { opacity: 0.45, duration: 0.25, yoyo: true, repeat: 1 }, at(6, f));
        tl.to("#ce-x2", { opacity: 0.3, duration: 0.25, yoyo: true, repeat: 1 }, at(6, f));
      });
      tl.to("#ce-term2", { opacity: 0, duration: 0.3 }, C.d - 0.5);

      tl.to("#ce-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ce-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["cei"] = tl;
    })();
  </script>
