        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

IN("#cl-er0", at(2, 0.2), 0.4); IN("#cl-er1", at(2, 0.3), 0.4); IN("#cl-er2", at(2, 0.42), 0.4);

IN("#cl-cr0", at(3, 0.15), 0.4); IN("#cl-cr1", at(3, 0.27), 0.4); IN("#cl-cr2", at(3, 0.42), 0.4);

IN("#cl-term3", at(4, 0.55), 0.5);
