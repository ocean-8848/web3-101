    (function () {
      const C = /*CUES*/{}/*END*/;

      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

// L0 server + example tag
IN("#ha-box", at(0, 0.05), 0.7, { y: 20 }, { y: 0 });
IN("#ha-ex", at(0, 0.6), 0.5);
// L1 CPU / RAM
IN("#ha-cpu", at(1, 0.05), 0.5, { scale: 0.9, svgOrigin: "310 450" }, { scale: 1, svgOrigin: "310 450" });
IN("#ha-ram", at(1, 0.3), 0.5, { scale: 0.9, svgOrigin: "570 450" }, { scale: 1, svgOrigin: "570 450" });
IN("#ha-16", at(1, 0.62), 0.5);
// L2 disk: 1.5 + 0.2
IN("#ha-ssd", at(2, 0.02), 0.5);
IN("#ha-cap", at(2, 0.1), 0.4);
const GROW = (s, w, t, d = 0.7) => tl.fromTo(s, { attr: { width: 0 } }, { attr: { width: w }, duration: d, ease: "power2.out", immediateRender: false }, t);
GROW("#ha-s1", 337, at(2, 0.15));
GROW("#ha-s2", 45, at(2, 0.5), 0.4);
IN("#ha-f1", at(2, 0.3), 0.5);
IN("#ha-l1", at(2, 0.8), 0.4);
// L3 one year growth
IN("#ha-f2", at(3, 0.1), 0.5);
GROW("#ha-s3", 176, at(3, 0.55));
IN("#ha-l3", at(3, 0.6), 0.4);
IN("#ha-f3", at(3, 0.75), 0.5);
// L4 30% free -> 3.5 -> 4 TB
IN("#ha-s4", at(4, 0.08), 0.5);
IN("#ha-l4", at(4, 0.12), 0.4);
IN("#ha-f4", at(4, 0.35), 0.5);
IN("#ha-rul", at(4, 0.55), 0.5);
IN("#ha-mk", at(4, 0.62), 0.3, { y: -15 }, { y: 0 });
ARROW("#ha-up", at(4, 0.72), 0.5);
IN("#ha-4tb", at(4, 0.8), 0.5, { scale: 0.85, svgOrigin: "1700 917" }, { scale: 1, svgOrigin: "1700 917" });
tl.to("#ha-ssdr", { stroke: "#83C167", duration: 0.4 }, at(4, 0.85));
// L5 bandwidth
DRAW("#ha-cab", at(5, 0.05), 0.4);
IN("#ha-net", at(5, 0.2), 0.5);
// L6 random IO
OUT("#ha-calc", at(6, 0), 0.4);
const RISE = (s, h, t, d = 1.0) => tl.fromTo(s, { attr: { y: 850, height: 0 } }, { attr: { y: 850 - h, height: h }, duration: d, ease: "power2.out", immediateRender: false }, t);
IN("#ha-iot", at(6, 0.04), 0.4);
DRAW("#ha-need", at(6, 0.05), 0.6);
IN("#ha-needl", at(6, 0.1), 0.4);
IN("#ha-dk0", at(6, 0.12), 0.4); RISE("#ha-c0", 90, at(6, 0.14));
IN("#ha-dk1", at(6, 0.2), 0.4); RISE("#ha-c1", 170, at(6, 0.22));
IN("#ha-dk2", at(6, 0.3), 0.4); RISE("#ha-c2", 220, at(6, 0.32));
IN("#ha-lag", at(6, 0.4), 0.4);
COUNT("#ha-lagn", 0, 300, at(6, 0.42), 5, v => Math.round(v));
tl.to("#ha-ssdr", { stroke: "#FC6255", duration: 0.3 }, at(6, 0.42));
IN("#ha-dk3", at(6, 0.7), 0.4); RISE("#ha-c3", 440, at(6, 0.72));
tl.to("#ha-ssdr", { stroke: "#83C167", duration: 0.3 }, at(6, 0.85));


      tl.to("#ha-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["hardware"] = tl;
    })();
