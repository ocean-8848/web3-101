  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // ===== 测验版式（与 quiz1 一致）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q4-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q4-q", at(0, 0.05), 0.01);
      tl.fromTo("#q4-qcr", { attr: { width: 0 } }, { attr: { width: 1200 }, duration: 2.4, ease: "none" }, at(0, 0.08));
      IN("#q4-q2", at(0, 0.05), 0.01);
      tl.fromTo("#q4-qcr2", { attr: { width: 0 } }, { attr: { width: 1050 }, duration: 2.0, ease: "none" }, at(0, 0.08) + 2.4);
      const SHOW = (k, t) => {
        IN(`#q4-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q4-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q4-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#q4-pause", at(2, 0.0), 0.3);
        tl.fromTo("#q4-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#q4-pause", at(3, 0.0), 0.3);
      };
      const RIGHT = (k, t) => {
        tl.to(`#q4-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q4-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q4-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q4-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q4-o${k}-t`, { attr: { y: Y0[k] + 52 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q4-o${k}-n`, t + 0.3, 0.5);
      };
      const POP = (s, t, ox, oy, d = 0.45) => IN(s, t, d, { scale: 0.6, svgOrigin: `${ox} ${oy}` }, { scale: 1, svgOrigin: `${ox} ${oy}`, ease: "back.out(2)" });
      const PULSE = (s, t, color, back) => {
        tl.to(s, { stroke: color, strokeWidth: 5, duration: 0.25 }, t);
        tl.to(s, { stroke: back, strokeWidth: 3, duration: 0.5 }, t + 1.2);
      };

      // L0 计算板备好
      IN("#q4-board", at(0, 0.5), 0.6);
      // L1 选项
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.25)); SHOW("C", at(1, 0.477)); SHOW("D", at(1, 0.727));
      // L2 暂停
      PAUSE();
      // L3 公式：基础费那部分销毁，小费给出块者
      IN("#q4-f", at(3, 0.128), 0.8, { x: -14 }, { x: 0 });
      POP("#q4-fire", at(3, 0.745), 1560, 490);
      tl.to("#q4-fire path", { scale: 1.15, svgOrigin: "1560 512", duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, at(3, 0.936));
      IN("#q4-crown", at(3, 0.936) + 0.3, 0.4);
      IN("#q4-coin", at(3, 0.936) + 0.5, 0.2);
      tl.to("#q4-coin", { attr: { cx: 1796 }, duration: 0.8, ease: "power2.inOut" }, at(3, 0.936) + 0.7);
      tl.to("#q4-coin", { opacity: 0, duration: 0.2 }, at(3, 0.936) + 1.5);
      // L4 代入
      IN("#q4-r1", at(4, 0.133), 0.5, { x: -12 }, { x: 0 });
      IN("#q4-r2", at(4, 0.417), 0.5, { x: -12 }, { x: 0 });
      IN("#q4-r3", at(4, 0.633), 0.5, { x: -12 }, { x: 0 });
      RIGHT("B", at(4, 0.9));
      // L5 A、C 的来源
      IN("#q4-sep", at(5, 0.0), 0.3);
      WRONG("A", at(5, 0.02));
      IN("#q4-ra", at(5, 0.08), 0.5, { x: -12 }, { x: 0 });
      PULSE("#q4-oA-box", at(5, 0.12), "#ffffff", "#FC6255");
      WRONG("C", at(5, 0.519));
      IN("#q4-rc", at(5, 0.519) + 0.06, 0.5, { x: -12 }, { x: 0 });
      PULSE("#q4-oC-box", at(5, 0.519) + 0.1, "#ffffff", "#FC6255");
      // L6 D 错 + 单位换算
      WRONG("D", at(6, 0.02));
      IN("#q4-rd", at(6, 0.429), 0.6, { y: 10 }, { y: 0 });

      tl.to("#q4-ra", { fill: "#FF9F43", duration: 0.3, yoyo: true, repeat: 1 }, at(6, 0.12));
      // L7 补充：失败的交易照扣 Gas（计算板清空后复用）
      OUT("#q4-f, #q4-fire, #q4-crown, #q4-r1, #q4-r2, #q4-r3, #q4-sep, #q4-ra, #q4-rc, #q4-rd", at(7, 0.0), 0.4);
      IN("#q4-fail", at(7, 0.04), 0.5, { x: -12 }, { x: 0 });
      IN("#q4-fq", at(7, 0.12), 0.4);
      POP("#q4-fqx", at(7, 0.27), 1626, 430);
      IN("#q4-fblk", at(7, 0.33), 0.5, { y: 10 }, { y: 0 });
      IN("#q4-fs", at(7, 0.52), 0.5, { x: -12 }, { x: 0 });
      IN("#q4-fg", at(7, 0.78), 0.5, { x: -12 }, { x: 0 });
      POP("#q4-ffire", at(7, 0.86), 1700, 750);
      tl.to("#q4-ffire", { scale: 1.15, svgOrigin: "1700 772", duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, at(7, 0.86) + 0.5);

      tl.to("#q4-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz4"] = tl;
    })();
