    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // ===== 测验版式（quiz2–6 照此）=====
      // 题号徽章 L0 起；题干用 clipPath 宽度 0→1300 打出
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#qu-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#qu-q", at(0, 0.05), 0.01);
      tl.fromTo("#qu-qcr", { attr: { width: 0 } }, { attr: { width: 1300 }, duration: 2.6, ease: "none" }, at(0, 0.08));
      IN("#qu-paper", at(0, 0.72), 0.6, { scale: 0.9, svgOrigin: "1500 620" }, { scale: 1, svgOrigin: "1500 620" });
      // L1 选项：按旁白念到的位置滑入；正在念的那张描边提亮
      const SHOW = (k, t) => {
        IN(`#qu-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#qu-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#qu-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.16)); SHOW("C", at(1, 0.55)); SHOW("D", at(1, 0.77));
      // L2 暂停：选项不动；暂停图标 + 圆环倒数到 L3 开头
      IN("#qu-pause", at(2, 0.0), 0.3);
      tl.fromTo("#qu-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#qu-pause", at(3, 0.0), 0.3);
      // 揭晓：正确项 = 描边 + 圆标变绿、绿底 15%
      const RIGHT = (k, t) => {
        tl.to(`#qu-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#qu-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      // 干扰项 = 红描边、内容降到 60%，选项文字上移到 y0+52，卡内第二行 y0+97 出红色短评（28px）
      const WRONG = (k, t) => {
        tl.to(`#qu-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#qu-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#qu-o${k}-n`, t + 0.3, 0.5);
      };
      RIGHT("B", at(3, 0.02));
      IN("#qu-stamp", at(3, 0.3), 0.4, { scale: 1.8, svgOrigin: "1592 762" }, { scale: 1, svgOrigin: "1592 762", ease: "back.out(2)" });
      tl.to("#qu-pfr", { stroke: "#58C4DD", duration: 0.4 }, at(3, 0.45));
      IN("#qu-lock", at(3, 0.45), 0.5, { scale: 1.05, svgOrigin: "1500 620" }, { scale: 1, svgOrigin: "1500 620" });
      IN("#qu-lockl", at(3, 0.5), 0.5);
      tl.to("#qu-fake", { scale: 1.12, svgOrigin: "1500 650", duration: 0.25, yoyo: true, repeat: 1 }, at(3, 0.68));
      IN("#qu-neq", at(3, 0.72), 0.5);
      WRONG("A", at(4, 0.02));
      WRONG("C", at(4, 0.42));
      WRONG("D", at(5, 0.02));
      // L5 纸片变玻璃（公开），四只眼睛看向它
      tl.to("#qu-pbg", { opacity: 0.25, duration: 0.6 }, at(5, 0.4));
      IN("#qu-glass", at(5, 0.4), 0.6);
      [0, 1, 2, 3].forEach(j => IN(`#qu-eye${j}`, at(5, 0.5) + j * 0.15, 0.4, { scale: 0.5, svgOrigin: `${j < 2 ? 1230 : 1770} ${j % 2 ? 720 : 520}` }, { scale: 1, svgOrigin: `${j < 2 ? 1230 : 1770} ${j % 2 ? 720 : 520}` }));
      // L6 干扰项完全淡出，让出左下；链外 → 预言机 → 链上
      OUT("#qu-oA, #qu-oC, #qu-oD", at(6, 0.0), 0.4);
      IN("#qu-earth", at(6, 0.1), 0.5);
      IN("#qu-d1", at(6, 0.22), 0.4, { x: -20 }, { x: 0 });
      IN("#qu-obox", at(6, 0.3), 0.5, { scale: 0.85, svgOrigin: "570 760" }, { scale: 1, svgOrigin: "570 760" });
      IN("#qu-d2", at(6, 0.42), 0.4, { x: -20 }, { x: 0 });
      IN("#qu-chain", at(6, 0.5), 0.5);
      IN("#qu-trust", at(6, 0.6), 0.5);
      IN("#qu-dot", at(6, 0.55), 0.2);
      tl.to("#qu-dot", { attr: { cx: 885 }, duration: 1.4, ease: "power1.inOut" }, at(6, 0.6));
      tl.to("#qu-dot", { opacity: 0, duration: 0.2 }, at(6, 0.6) + 1.4);

      tl.to("#qu-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz1"] = tl;
    })();
