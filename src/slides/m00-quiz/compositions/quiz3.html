      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

        IN(`#q3-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q3-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q3-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#q3-pause", at(2, 0.0), 0.3);
        tl.fromTo("#q3-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#q3-pause", at(3, 0.0), 0.3);
      };
      const RIGHT = (k, t) => {
        tl.to(`#q3-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q3-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q3-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q3-o${k}-t`, { attr: { y: Y0[k] + 52 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q3-o${k}-n`, t + 0.3, 0.5);
      };
      const POP = (s, t, ox, oy, d = 0.45) => IN(s, t, d, { scale: 0.6, svgOrigin: `${ox} ${oy}` }, { scale: 1, svgOrigin: `${ox} ${oy}`, ease: "back.out(2)" });
      const PULSE = (s, t, color, back) => {
        tl.to(s, { stroke: color, strokeWidth: 5, duration: 0.25 }, t);
        tl.to(s, { stroke: back, strokeWidth: 3, duration: 0.5 }, t + 1.2);
      };

      // L0 交易卡 + 签名印章
      IN("#q3-tx", at(0, 0.673), 0.6, { y: 16 }, { y: 0 });
      tl.fromTo("#q3-seal", { opacity: 0, scale: 1.8, svgOrigin: "1660 550" }, { opacity: 1, scale: 1, svgOrigin: "1660 550", duration: 0.4, ease: "back.out(2)" }, at(0, 0.8));
      // L1 选项
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.204)); SHOW("C", at(1, 0.398)); SHOW("D", at(1, 0.741));

      // L3 揭晓 C：交易卡变玻璃，八只眼睛；三个保证 + 划掉的保密
      RIGHT("C", at(3, 0.03));
      tl.to("#q3-txb", { fill: "#1a2a30", stroke: "#9fd8e8", duration: 0.6 }, at(3, 0.143));
      IN("#q3-glass", at(3, 0.143), 0.6);
      POP("#q3-eye0", at(3, 0.143) + 0.00, 1210, 450, 0.35);
      POP("#q3-eye1", at(3, 0.143) + 0.12, 1210, 570, 0.35);
      POP("#q3-eye2", at(3, 0.143) + 0.24, 1800, 450, 0.35);
      POP("#q3-eye3", at(3, 0.143) + 0.36, 1800, 570, 0.35);
      POP("#q3-eye4", at(3, 0.143) + 0.48, 1400, 395, 0.35);
      POP("#q3-eye5", at(3, 0.143) + 0.60, 1610, 395, 0.35);
      POP("#q3-eye6", at(3, 0.143) + 0.72, 1400, 630, 0.35);
      POP("#q3-eye7", at(3, 0.143) + 0.84, 1610, 630, 0.35);
      POP("#q3-t0", at(3, 0.548), 1233, 692);
      POP("#q3-t1", at(3, 0.619), 1351, 692);
      POP("#q3-t2", at(3, 0.714), 1497, 692);
      POP("#q3-t3", at(3, 0.929) - 0.3, 1629, 692);
      ARROW("#q3-t3x", at(3, 0.929) + 0.2, 0.3);
      // L4 A 错：签名 ≠ 加密

      IN("#q3-cmp", at(4, 0.111), 0.6, { y: 12 }, { y: 0 });
      // L5 B、D 错：公钥公开；出块者也在看
      OUT("#q3-cmp", at(5, 0.0), 0.4);
      WRONG("B", at(5, 0.03));
      IN("#q3-key", at(5, 0.154), 0.5, { x: -16 }, { x: 0 });
      IN("#q3-pub", at(5, 0.269), 0.4, { x: -12 }, { x: 0 });
      WRONG("D", at(5, 0.346));
