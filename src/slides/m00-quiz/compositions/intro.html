  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const DC = ["#58C4DD", "#58C4DD", "#F0B90B", "#F0B90B", "#B48EF0", "#83C167", "#e8e6df"];
      // L0 七个圆点依次亮起，再连线
      for (let i = 0; i < 7; i++) {
        const t = at(0, 0.08 + i * 0.09);
        tl.to(`#in-d${i}`, { fill: DC[i], stroke: DC[i], duration: 0.3 }, t);
        tl.fromTo(`#in-d${i}`, { scale: 1 }, { scale: 1.35, svgOrigin: `${360 + 200 * i} 540`, duration: 0.18, yoyo: true, repeat: 1, immediateRender: false }, t);
        IN(`#in-dl${i}`, t + 0.1, 0.4);
      }
      DRAW("#in-dline", at(0, 0.74), 0.9);
      // L1 圆点缩小上移，大字两行
      OUT("#in-dlabs", at(1, 0.0), 0.3);
      tl.to("#in-dots", { scale: 0.6, y: -280, svgOrigin: "960 540", duration: 0.8, ease: "power2.inOut" }, at(1, 0.03));
      IN("#in-s1", at(1, 0.12), 0.7, { y: 20 }, { y: 0 });
      IN("#in-s2", at(1, 0.66), 0.7, { y: 20 }, { y: 0 });
      // L2 银行保险箱，钥匙挂在银行墙上，银行能冻结
      OUT("#in-s1, #in-s2, #in-dots", at(2, 0.0), 0.4);
      IN("#in-bank", at(2, 0.12), 0.7, { y: 20 }, { y: 0 });
      tl.fromTo("#in-bkey", { opacity: 0.3 }, { opacity: 1, duration: 0.3, yoyo: true, repeat: 3, immediateRender: false }, at(2, 0.42));
      IN("#in-frz", at(2, 0.72), 0.4, { y: -30 }, { y: 0, ease: "back.out(2)" });
      tl.to("#in-bsafe", { stroke: "#FC6255", duration: 0.3 }, at(2, 0.8));
      // L3 家里的保险箱 + 术语卡；钥匙掉落碎掉
      IN("#in-term", at(3, 0.0), 0.5);
      IN("#in-house", at(3, 0.03), 0.6, { y: 20 }, { y: 0 });
      IN("#in-hsafe, #in-dial", at(3, 0.08), 0.5);
      IN("#in-man, #in-hkey", at(3, 0.2), 0.5);
      IN("#in-nofrz", at(3, 0.42), 0.5, { y: 10 }, { y: 0 });
      const tk = at(3, 0.68);
      tl.to("#in-hkey", { y: 132, duration: 0.5, ease: "power2.in" }, tk);
      tl.to("#in-hkey", { opacity: 0, duration: 0.2 }, tk + 0.5);
      IN("#in-frag", tk + 0.5, 0.2);
      ["#in-f0", "#in-f1", "#in-f2", "#in-f3"].forEach((f, j) => tl.to(f, { x: (j - 1.5) * 22, y: -6 + j * 3, duration: 0.5, ease: "power2.out" }, tk + 0.5));
      IN("#in-lost", tk + 0.7, 0.4);
      // L4 术语卡与银行淡出；保险箱变透明，金币可见，眼睛围观，锁仍是绿色闭合
      OUT("#in-term", at(4, 0.0), 0.4);
      OUT("#in-bank, #in-frz, #in-man, #in-frag, #in-lost", at(4, 0.0), 0.4);
      tl.to("#in-hsafe", { fill: "#58C4DD", fillOpacity: 0.12, stroke: "#58C4DD", duration: 0.6 }, at(4, 0.15));
      OUT("#in-dial", at(4, 0.15), 0.4);
      IN("#in-coins", at(4, 0.25), 0.5);
      IN("#in-glock", at(4, 0.32), 0.4);
      [0, 1, 2, 3, 4].forEach(j => IN(`#in-eye${j}`, at(4, 0.42) + j * 0.15, 0.4));
      IN("#in-see", at(4, 0.6), 0.6, { y: 15 }, { y: 0 });
      // L5 收起，知识地图 → 六道题
      tl.to("#in-home, #in-house, #in-nofrz, #in-see", { opacity: 0, duration: 0.6, ease: "power2.in" }, at(5, 0.0));
      tl.to("#in-home", { scale: 0.7, svgOrigin: "1390 700", duration: 0.6, ease: "power2.in" }, at(5, 0.0));
      IN("#in-n1", at(5, 0.15), 0.6, { scale: 0.85, svgOrigin: "700 540" }, { scale: 1, svgOrigin: "700 540" });
      ARROW("#in-n2a", at(5, 0.5), 0.5);
      IN("#in-n3", at(5, 0.58), 0.6, { scale: 0.85, svgOrigin: "1230 540" }, { scale: 1, svgOrigin: "1230 540" });

      tl.to("#in-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#in-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["intro"] = tl;
    })();
  </script>
