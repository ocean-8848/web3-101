  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const POP = (s, t, ox, oy, d = 0.45) => IN(s, t, d, { scale: 0.6, svgOrigin: `${ox} ${oy}` }, { scale: 1, svgOrigin: `${ox} ${oy}`, ease: "back.out(2)" });

      const LINK = (k, t) => { ARROW(`#ma-a${k}`, t, 0.5); IN(`#ma-l${k}`, t + 0.2, 0.4); };
      // L0 节点 1 账本，数字跳动
      NODE(1, at(0, 0.05), 250, 360);
      IN("#ma-led", at(0, 0.3), 0.5);
      COUNT("#ma-la", 500, 400, at(0, 0.55), 0.8); COUNT("#ma-lb", 200, 300, at(0, 0.55), 0.8);
      // L1 银行 → 划掉 → 共识难题
      OUT("#ma-led", at(1, 0.0), 0.3);
      IN("#ma-bank", at(1, 0.04), 0.5, { y: 10 }, { y: 0 });
      IN("#ma-bok", at(1, 0.18), 0.3, { scale: 0.5, svgOrigin: "710 172" }, { scale: 1, svgOrigin: "710 172" });
      IN("#ma-bx", at(1, 0.38), 0.3);
      OUT("#ma-bank, #ma-bx, #ma-bok", at(1, 0.52), 0.4);
      LINK("12", at(1, 0.55));
      NODE(2, at(1, 0.62), 670, 360);
      IN("#ma-cons", at(1, 0.68), 0.5);
      tl.fromTo("#ma-q", { scale: 0.4 }, { scale: 1, svgOrigin: "670 170", duration: 0.5, ease: "back.out(3)", immediateRender: false }, at(1, 0.86));
      // L2 三件套，哈希链一块变红后面跟着对不上
      OUT("#ma-cons", at(2, 0.0), 0.3);
      LINK("23", at(2, 0.02));
      NODE(3, at(2, 0.1), 1090, 360);
      IN("#ma-chain", at(2, 0.42), 0.5);
      [1, 2, 3, 4].forEach((j, n) => tl.to(`#ma-c${j}`, { stroke: "#FC6255", fill: "#FC6255", duration: 0.25 }, at(2, 0.7) + n * 0.3));
      IN("#ma-bad", at(2, 0.78), 0.3);
      tl.to("#ma-chain", { opacity: 0, scale: 0.3, svgOrigin: "1090 360", duration: 0.5, ease: "power2.in" }, at(2, 0.95));
      // L3 签名与地址，单向
      LINK("34", at(3, 0.0));
      NODE(4, at(3, 0.08), 1510, 360);
      IN("#ma-k0", at(3, 0.12), 0.4);
      IN("#ma-k1", at(3, 0.3), 0.4); ARROW("#ma-ka", at(3, 0.3), 0.4);
      IN("#ma-k2", at(3, 0.5), 0.4); ARROW("#ma-kb", at(3, 0.5), 0.4);
      IN("#ma-rev", at(3, 0.75), 0.5);
      // L4 一笔转账的路径
      OUT("#ma-k0, #ma-k1, #ma-k2, #ma-ka, #ma-kb, #ma-rev", at(4, 0.0), 0.4);
      const PT = [0.18, 0.26, 0.33, 0.45, 0.56, 0.65, 0.73];
      PT.forEach((f, j) => { IN(`#ma-p${j}`, at(4, f), 0.5, { y: 12 }, { y: 0 }); if (j) ARROW(`#ma-pa${j - 1}`, at(4, f) - 0.25, 0.3); });
      const TXX = [236, 590, 820, 1000, 1200, 1520];
      IN("#ma-tx", at(4, 0.28), 0.3);
      [1, 2, 3, 4, 5].forEach(j => tl.to("#ma-tx", { attr: { x: TXX[j] }, duration: 0.8, ease: "power1.inOut" }, at(4, PT[j + 1]) - 0.4));
      tl.to("#ma-tx", { opacity: 0, duration: 0.3 }, at(4, 0.8));
      tl.to("#ma-ring", { opacity: 1, duration: 0.4 }, at(4, 0.84));
      tl.fromTo("#ma-ring", { scale: 1 }, { scale: 1.15, svgOrigin: "174 620", duration: 0.35, yoyo: true, repeat: 3, immediateRender: false }, at(4, 0.86));
      // L5 路径行收拢成一条细线；节点 5
      tl.to("#ma-path", { opacity: 0, scaleY: 0.05, svgOrigin: "960 620", duration: 0.5, ease: "power2.in" }, at(5, 0.0));
      IN("#ma-trace", at(5, 0.03), 0.4, {}, { opacity: 0.35 });
      LINK("45", at(5, 0.06));
      NODE(5, at(5, 0.12), 1510, 870);
      IN("#ma-i0", at(5, 0.3), 0.4, { y: 10 }, { y: 0 });
      IN("#ma-i1", at(5, 0.5), 0.4, { y: 10 }, { y: 0 });
      IN("#ma-i2", at(5, 0.72), 0.4, { y: 10 }, { y: 0 });
      // L6 币记在链上，钱包只管私钥；换钱包导入助记词，资产照样在
      OUT("#ma-i0, #ma-i1, #ma-i2, #ma-trace", at(6, 0.0), 0.3);
      IN("#ma-own", at(6, 0.0), 0.01);
      IN("#ma-wa", at(6, 0.05), 0.5, { y: 12 }, { y: 0 });
      IN("#ma-ch", at(6, 0.16), 0.5, { y: 12 }, { y: 0 });
      POP("#ma-coin", at(6, 0.26), 244, 590);
      IN("#ma-chl", at(6, 0.3), 0.4);
      ARROW("#ma-wl", at(6, 0.4), 0.6);
      IN("#ma-wal", at(6, 0.45), 0.4);
      tl.fromTo("#ma-wkey", { scale: 1 }, { scale: 1.25, svgOrigin: "580 592", duration: 0.3, yoyo: true, repeat: 1, immediateRender: false }, at(6, 0.5));
      IN("#ma-pp", at(6, 0.62), 0.4, { y: 10 }, { y: 0 });
      IN("#ma-ppl", at(6, 0.64), 0.4);
      ARROW("#ma-pw", at(6, 0.72), 0.4);
      IN("#ma-wb", at(6, 0.76), 0.5, { y: 12 }, { y: 0 });
      ARROW("#ma-wbl", at(6, 0.85), 0.8);
      IN("#ma-wbt", at(6, 0.9), 0.4);
      // L7 密码只解锁这台设备；丢了助记词，密码帮不上忙
      POP("#ma-lock", at(7, 0.04), 650, 548);

      IN("#ma-wal2", at(7, 0.16), 0.4);

      [0, 1, 2, 3].forEach(j => IN(`#ma-e${j}`, at(8, 0.14) + j * 0.35, 0.4, { y: 10 }, { y: 0 }));
      [1, 2].forEach(j => tl.fromTo(`#ma-e${j}`, { x: 0 }, { x: j === 1 ? 14 : -14, duration: 0.3, yoyo: true, repeat: 1, ease: "power2.inOut", immediateRender: false }, at(8, 0.48) + j * 0.25));
      DRAW("#ma-crack", at(8, 0.68), 1.6);
      [0, 1, 2, 3].forEach(j => tl.to(`#ma-e${j}r`, { stroke: "#FC6255", strokeWidth: 3, duration: 0.25 }, at(8, 0.68) + j * 0.4));
      // L9 保住私钥、学习路线；整条路径亮点流过

      LINK("67", at(9, 0.02));
      NODE(7, at(9, 0.06), 670, 870);

      LINK("78", at(9, 0.36));
      NODE(8, at(9, 0.42), 250, 870);
      [0, 1, 2].forEach(j => IN(`#ma-w${j}`, at(9, 0.48) + j * 0.15, 0.3, { y: 10 }, { y: 0 }));
      const tg = at(9, 0.68);
      const END = { "12": [512, 360], "23": [932, 360], "34": [1352, 360], "45": [1510, 792], "56": [1248, 870], "67": [828, 870], "78": [408, 870] };
      ["12", "23", "34", "45", "56", "67", "78"].forEach((k, n) => {
        const t = tg + n * 0.3, E = END[k];
        tl.to(`#ma-g${k}`, { opacity: 1, duration: 0.05 }, t);
        tl.to(`#ma-g${k}`, { attr: { cx: E[0], cy: E[1] }, duration: 0.3, ease: "none" }, t);
        tl.to(`#ma-g${k}`, { opacity: 0, duration: 0.05 }, t + 0.3);
        tl.to(`#ma-a${k}`, { stroke: "#e8e6df", duration: 0.2 }, t);
      });
      for (let i = 1; i <= 8; i++) tl.to(`#ma-n${i}r`, { strokeWidth: 6, duration: 0.25, yoyo: true, repeat: 1 }, tg + (i - 1) * 0.3);

      tl.to("#ma-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["map"] = tl;
    })();
  </script>
