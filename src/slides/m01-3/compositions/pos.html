          const cx = x + 90 + j * 40;
          mk("circle", { cx, cy: 712, r: 11, fill: "#8a8f99" }, c);
          mk("path", { d: `M${cx - 9} ${670} L${cx - 2} ${678} L${cx + 10} ${662}`, fill: "none", stroke: "#83C167", "stroke-width": 4, "stroke-linecap": "round", "stroke-linejoin": "round" }, c);

      // L1 staking

      IN("#ps-coins", at(1, 0.05), 0.5, { y: 20 }, { y: 0 });
      IN("#ps-term", at(1, 0.15), 0.5);
      IN("#ps-safe", at(1, 0.3), 0.5); IN("#ps-dial", at(1, 0.3), 0.5);
