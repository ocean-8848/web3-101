  </style>
  <!-- 场景 prob，id 前缀 pr- -->
  <div id="root" data-composition-id="prob" data-duration="46.25" data-width="1920" data-height="1080">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>

        </g>
        <text id="pr-end" class="h" x="960" y="580" font-size="64" font-weight="700" fill="#e8e6df" text-anchor="middle"><tspan fill="#58C4DD">PoW</tspan> 安全 = 诚实算力 <tspan fill="#83C167">&gt; 50%</tspan></text>
      </g>
      <g id="pr-term" class="h">
        <rect x="70" y="56" width="640" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">概率最终性 <tspan font-size="28" font-weight="400" fill="#8a8f99">Probabilistic Finality</tspan></text>

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const TK = document.querySelector("#pr-ticks");
      ["100%", "1%", "0.01%", "1e-6", "1e-8"].forEach((s, k) => { const y = 300 + k * 162.5; mk("line", { x1: 292, y1: y, x2: 300, y2: y, stroke: "#8a8f99", "stroke-width": 3 }, TK); const t = mk("text", { class: "mono", x: 284, y: y + 10, "font-size": 28, fill: "#8a8f99", "text-anchor": "end" }, TK); t.textContent = s; });
      for (let z = 0; z <= 30; z += 5) { const x = 300 + z * 1400 / 30; mk("line", { x1: x, y1: 950, x2: x, y2: 958, stroke: "#8a8f99", "stroke-width": 3 }, TK); const t = mk("text", { class: "mono", x, y: 992, "font-size": 28, fill: "#8a8f99", "text-anchor": "middle" }, TK); t.textContent = String(z); }
      // Nakamoto whitepaper §11
      const P = (q, z) => { const p = 1 - q, l = z * q / p; let s = 1, po = Math.exp(-l); for (let k = 0; k <= z; k++) { if (k > 0) po *= l / k; s -= po * (1 - Math.pow(q / p, z - k)); } return Math.min(1, Math.max(1e-12, s)); };
      const Y = v => 300 - Math.max(-9, Math.log10(v)) * 81.25;
      const CV = document.querySelector("#pr-cv"), SLF = document.querySelector("#pr-slf"), KN = document.querySelector("#pr-kn"), QV = document.querySelector("#pr-qv");
      const setQ = q => {
        let d = ""; for (let z = 0; z <= 30; z++) d += (z ? " L" : "M") + (300 + z * 1400 / 30).toFixed(1) + " " + Y(P(q, z)).toFixed(1);
        CV.setAttribute("d", d); const kx = 1230 + q / 0.5 * 400; KN.setAttribute("cx", kx.toFixed(1)); SLF.setAttribute("x2", kx.toFixed(1)); QV.textContent = Math.round(q * 100) + "%";
      };
      setQ(0.1);
      const qo = { q: 0.1 };
      const QTO = (a, b, t, d) => tl.fromTo(qo, { q: a }, { q: b, duration: d, ease: "power2.inOut", immediateRender: false, onUpdate: () => setQ(qo.q) }, t);

      // L0 axes + formula
      DRAW("#pr-ay", at(0, 0.02), 0.7); DRAW("#pr-ax", at(0, 0.08), 0.8);
      IN("#pr-ticks", at(0, 0.18), 0.6); IN("#pr-yt", at(0, 0.24), 0.5); IN("#pr-xt", at(0, 0.3), 0.5);
      IN("#pr-src", at(0, 0.45), 0.5);
      IN("#pr-thr", at(0, 0.72), 0.5);
      // L1 q = 10%
      IN("#pr-sl", at(1, 0.02), 0.5);
      DRAW("#pr-cv", at(1, 0.15), 1.2);
      IN("#pr-m6", at(1, 0.6), 0.5, { scale: 0.5, svgOrigin: "580 594" }, { scale: 1, svgOrigin: "580 594" });
      // L2 q = 25% -> 15, 30% -> 24
      OUT("#pr-m6", at(2, 0), 0.3);
      QTO(0.1, 0.25, at(2, 0.04), 1.1);
      IN("#pr-m15", at(2, 0.3), 0.5);
      QTO(0.25, 0.3, at(2, 0.62), 0.9);
      IN("#pr-m24", at(2, 0.8), 0.5);
      // L3 never zero
      IN("#pr-mag", at(3, 0.2), 0.5);
      IN("#pr-ins", at(3, 0.3), 0.5);
      DRAW("#pr-icv", at(3, 0.36), 1.0);
      IN("#pr-ilb", at(3, 0.5), 0.5);
      IN("#pr-term", at(3, 0.7), 0.5);
      // L4 q = 50%
      OUT("#pr-mag, #pr-ins, #pr-icv, #pr-ilb, #pr-m15, #pr-m24", at(4, 0), 0.4);
      QTO(0.3, 0.5, at(4, 0.12), 1.4);
      tl.to("#pr-cv", { stroke: "#FC6255", duration: 0.5 }, at(4, 0.3));
      IN("#pr-flat", at(4, 0.5), 0.5);
      OUT("#pr-term", at(4, 0.6), 0.4);
      // L5 conclusion
      OUT("#pr-plot", at(5, 0), 0.5);
      IN("#pr-end", at(5, 0.1), 0.7, { scale: 0.85, svgOrigin: "960 560" }, { scale: 1, svgOrigin: "960 560" });

      tl.to("#pr-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#pr-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["prob"] = tl;
    })();
  </script>
