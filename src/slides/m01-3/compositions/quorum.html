    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


// L0 formula

IN("#qu-un", at(0, 0.18), 0.3); DRAW("#qu-un", at(0, 0.18), 0.5);
IN("#qu-uf", at(0, 0.36), 0.3); DRAW("#qu-uf", at(0, 0.36), 0.5);

IN("#qu-f2", at(0, 0.62), 0.6, { y: -40 }, { y: 0 });

IN("#qu-c2b", at(4, 0.76), 0.3);
IN("#qu-no", at(4, 0.82), 0.4);
// L5 safety
OUT("#qu-q1, #qu-q2, #qu-nA, #qu-nB, #qu-nC, #qu-nD, #qu-oB, #qu-oD, #qu-once, #qu-nf, #qu-qn, #qu-r1, #qu-r2, #qu-c2b, #qu-xB, #qu-no", at(5, 0), 0.4);

IN("#qu-six", at(6, 0.06), 0.6);
IN("#qu-bx", at(6, 0.4), 0.5, { x: 20 }, { x: 0 });
IN("#qu-by", at(6, 0.55), 0.5, { x: 20 }, { x: 0 });
IN("#qu-q4", at(6, 0.6), 0.4);

tl.to("#qu-spark", { opacity: 0.3, duration: 0.15, yoyo: true, repeat: 5 }, at(6, 0.75));
IN("#qu-fail", at(6, 0.82), 0.5);

OUT("#qu-six, #qu-bx, #qu-by, #qu-q4, #qu-spark, #qu-fail", at(7, 0), 0.4);
IN("#qu-card", at(7, 0.05), 0.6, { y: 20 }, { y: 0 });

IN("#qu-pow", at(7, 0.82), 0.5);
