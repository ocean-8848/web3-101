  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => { const z = {}; if ("x" in from) z.x = 0; if ("y" in from) z.y = 0; if ("scale" in from) z.scale = 1; return tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...z, ...to }, t); };
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const LN = [0, 1, 2, 3, 4, 5, 6];
      LN.forEach(i => { IN("#st-ln" + i, at(0, 0.02) + i * 0.08, 0.4); IN("#st-lt" + i, at(0, 0.05) + i * 0.08, 0.4); });
      for (let i = 0; i < 8; i++) IN("#st-c" + i, at(0, 0.3) + i * 0.1, 0.35, { x: -16 });
      const LIT = (i, t) => { tl.to("#st-cr" + i, { stroke: "#58C4DD", duration: 0.3 }, t); tl.to("#st-cn" + i, { fill: "#58C4DD", duration: 0.3 }, t); tl.to("#st-ct" + i, { fill: "#e8e6df", duration: 0.3 }, t); };
      const LINK = (i, t, d = 0.6) => { DRAW("#st-l" + i, t, d); IN("#st-dt" + i, t + d - 0.1, 0.25); };
      // L1 US-1 / US-2 → gateway
      LIT(0, at(1, 0.03)); LINK(0, at(1, 0.08), 0.4); IN("#st-b0", at(1, 0.28), 0.4);
      LIT(1, at(1, 0.6)); LINK(1, at(1, 0.64), 0.4); IN("#st-b1", at(1, 0.8), 0.4);
      // L2 US-3 wallet → ledger
      LIT(2, at(2, 0.03));
      IN("#st-pg", at(2, 0.1), 0.4);
      tl.fromTo("#st-pb", { attr: { width: 0 } }, { attr: { width: 87.5 }, duration: 1.4, ease: "power1.out" }, at(2, 0.14));
      COUNT("#st-pn", 0, 7, at(2, 0.14), 1.4);
      LINK(2, at(2, 0.42), 0.7); ARROW("#st-ar2", at(2, 0.56), 0.5); IN("#st-dd2", at(2, 0.6), 0.25);
      IN("#st-b2", at(2, 0.74), 0.4);
      // L3 US-4 order → matching；US-5 settlement → ledger
      LIT(3, at(3, 0.03)); LINK(3, at(3, 0.07), 0.5); ARROW("#st-ar3", at(3, 0.16), 0.4); IN("#st-dd3", at(3, 0.2), 0.25);
      IN("#st-b3", at(3, 0.3), 0.4);
      LIT(4, at(3, 0.55)); LINK(4, at(3, 0.59), 0.6); ARROW("#st-ar4", at(3, 0.69), 0.4); IN("#st-dd4", at(3, 0.73), 0.25);
      IN("#st-b4", at(3, 0.84), 0.4);
      // L4 US-6 → market-data
      LIT(5, at(4, 0.03)); LINK(5, at(4, 0.1), 0.7); IN("#st-b5", at(4, 0.58), 0.4);
      // L5 US-7 → wallet
      LIT(6, at(5, 0.03)); LINK(6, at(5, 0.1), 0.6);
      IN("#st-b6a", at(5, 0.44), 0.4); IN("#st-b6b", at(5, 0.74), 0.4);
      // L6 US-8 → 全部
      LIT(7, at(6, 0.05)); LINK(7, at(6, 0.12), 0.8);
      tl.to(LN.map(i => "#st-ln" + i), { fill: "rgba(255,159,67,0.28)", duration: 0.3, yoyo: true, repeat: 1, stagger: 0.05 }, at(6, 0.32));
      IN("#st-b7", at(6, 0.55), 0.4);
      tl.fromTo("#st-b7 path", { rotation: -12 }, { rotation: 12, svgOrigin: "989 " + (290 + 88 * 7 + 38 + 8), duration: 0.15, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, at(6, 0.62));

      tl.to("#st-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["stories"] = tl;
    })();
