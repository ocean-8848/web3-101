      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => { const z = {}; if ("x" in from) z.x = 0; if ("y" in from) z.y = 0; if ("scale" in from) z.scale = 1; return tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...z, ...to }, t); };
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const ROW = (i, t) => { OUT("#go-bar" + i, t, 0.25); IN("#go-lb" + i, t + 0.1, 0.4, { x: -10 }); DRAW("#go-ck" + i, t + 0.15, 0.4); tl.to("#go-row" + i + " rect", { stroke: "#83C167", duration: 0.3 }, t + 0.15); };
      // L0
      IN("#go-title", at(0, 0.04), 0.5);
      for (let i = 0; i < 10; i++) IN("#go-row" + i, at(0, 0.14) + i * 0.12, 0.4);
      IN("#go-card", at(0, 0.66), 0.6);
      // L1 账户
      ROW(0, at(1, 0.04));
      IN("#go-jwt", at(1, 0.22), 0.5, { y: 14 });
      IN("#go-p0", at(1, 0.44), 0.4); IN("#go-p1", at(1, 0.54), 0.4); IN("#go-p2", at(1, 0.64), 0.4);
      IN("#go-ip", at(1, 0.84), 0.5);
      // L2 充值
      OUT("#go-c1", at(2, 0), 0.35);
      ROW(1, at(2, 0.03));
      IN("#go-m1", at(2, 0.1), 0.4); ARROW("#go-m1a", at(2, 0.2), 0.5); IN("#go-m1b", at(2, 0.28), 0.4);
      IN("#go-m2", at(2, 0.42), 0.4); ARROW("#go-m2a", at(2, 0.55), 0.3);
      IN("#go-m2c", at(2, 0.62), 0.3);
      COUNT("#go-n12", 0, 12, at(2, 0.62), 1.0);
      ARROW("#go-m2d", at(2, 0.8), 0.3); IN("#go-m2b", at(2, 0.86), 0.4);
      // L3 交易 + 结算 + 行情
      OUT("#go-c2", at(3, 0), 0.35);
      ROW(2, at(3, 0.03));
      ["#go-f0", "#go-f1", "#go-f2", "#go-f3"].forEach((s, i) => IN(s, at(3, 0.12) + i * 0.55, 0.4, { y: 12 }));
      IN("#go-mk", at(3, 0.4), 0.4);
      ROW(3, at(3, 0.62));
      IN("#go-fee1", at(3, 0.68), 0.4); IN("#go-fee2", at(3, 0.82), 0.4);
      ROW(4, at(3, 0.5)); IN("#go-mkt", at(3, 0.52), 0.4);
      // L4 性能 + 可靠性
      OUT("#go-c3", at(4, 0), 0.35);
      ROW(6, at(4, 0.02));
      IN("#go-g0", at(4, 0.06), 0.4); DRAW("#go-ga0", at(4, 0.08), 1.0);
      COUNT("#go-cnt", 0, 50000, at(4, 0.08), 1.4);
      IN("#go-g1", at(4, 0.2), 0.4); DRAW("#go-ga1", at(4, 0.22), 1.0);
      IN("#go-g2", at(4, 0.32), 0.4); DRAW("#go-ga2", at(4, 0.34), 1.0);
      ROW(7, at(4, 0.48));
      IN("#go-mx", at(4, 0.5), 0.4);
