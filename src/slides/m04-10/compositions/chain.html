        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      STEP(12, at(3, 0.42), 0.35); STEP(13, at(3, 0.5), 0.35);
      STEP(14, at(3, 0.7), 0.35); STEP(15, at(3, 0.78), 0.35);

      IN("#ch-clk", at(4, 0.52), 0.5);
      IN("#ch-pd", at(4, 0.64), 0.4);

      ARROW("#ch-f2", at(4, 0.88), 0.4); IN("#ch-f2t", at(4, 0.9), 0.4);
      // L5 出事点二：settlement 记账失败
      OUT(["#ch-comp", "#ch-boom"], at(5, 0), 0.35);
      tl.to(S(7), { opacity: 1, duration: 0.3 }, at(5, 0));
      tl.to("#ch-p13", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.08));
      tl.to("#ch-t13", { fill: "#FC6255", duration: 0.3 }, at(5, 0.08));

      tl.to("#ch-p13", { stroke: "#e8e6df", duration: 0.3 }, at(6, 0));
      tl.to("#ch-t13", { fill: "#F0B90B", duration: 0.3 }, at(6, 0));

      tl.to("#ch-t2", { fill: "#FF9F43", duration: 0.4 }, at(6, 0.06));
      tl.to([S(4), S(5), S(6), S(7)], { opacity: 0.25, duration: 0.5 }, at(6, 0.16));
      IN("#ch-cn", at(6, 0.3), 0.4, { x: -20 });
