        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      ARROW("#ar-wl", at(2, 0.224), 0.5); IN("#ar-lw", at(2, 0.272), 0.4);

      // L3 异步一半
      IN("#ar-t2", at(3, 0.02), 0.5);
      IN("#ar-o2", at(3, 0.08), 0.4);

      IN("#ar-snap", at(3, 0.8), 0.5);
      // L4 match.events 两路

      ARROW("#ar-sl", at(4, 0.24), 0.5); IN("#ar-lp", at(4, 0.3), 0.4);
      ARROW("#ar-b5", at(4, 0.44), 0.4); IN("#ar-md", at(4, 0.49), 0.4);
      ARROW("#ar-b6", at(4, 0.62), 0.3); IN("#ar-rd", at(4, 0.65), 0.4);
      ARROW("#ar-loop", at(4, 0.78), 1.0);

      tl.to("#ar-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["arch"] = tl;
