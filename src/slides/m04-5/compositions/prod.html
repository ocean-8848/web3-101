  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

            const ACT = (i, t) => { tl.to(`#pr-w${i}r`, { stroke: "#58C4DD", duration: 0.3 }, t); tl.to(`#pr-w${i}t`, { fill: "#e8e6df", duration: 0.3 }, t); };
      const DONE = (i, t) => { DRAW(`#pr-ck${i}`, t, 0.4); tl.to(`#pr-w${i}r`, { stroke: "#83C167", duration: 0.3 }, t); tl.to(`#pr-w${i}b`, { stroke: "#83C167", duration: 0.3 }, t); };
      // L0 清单
      IN("#pr-title", at(0, 0.03), 0.4, { y: 15 }, { y: 0 });
      for (let i = 1; i <= 6; i++) IN(`#pr-w${i}`, at(0, 0.2) + (i - 1) * 0.3, 0.35, { x: -20 }, { x: 0 });
      // L1 幂等键：重放两次余额不变
      ACT(1, at(1, 0.02));
      IN("#pr-bat", at(1, 0.4), 0.4, { y: 15 }, { y: 0 });
      IN("#pr-bal", at(1, 0.45), 0.4, { y: 15 }, { y: 0 });
      ARROW("#pr-v1a", at(1, 0.48), 0.4);
      IN("#pr-x1", at(1, 0.4), 0.3);
      tl.fromTo("#pr-pk", { opacity: 1, x: 0 }, { x: 70, duration: 0.5, immediateRender: false }, at(1, 0.42));
      tl.to("#pr-pk", { opacity: 0, duration: 0.1 }, at(1, 0.42) + 0.5);
      OUT("#pr-x1", at(1, 0.68), 0.2); IN("#pr-x2", at(1, 0.68) + 0.2, 0.3);
      tl.fromTo("#pr-pk", { opacity: 1, x: 0 }, { x: 70, duration: 0.5, immediateRender: false }, at(1, 0.7));
      tl.to("#pr-pk", { opacity: 0, duration: 0.1 }, at(1, 0.7) + 0.5);
      tl.to("#pr-balr", { strokeWidth: 6, duration: 0.25, yoyo: true, repeat: 1 }, at(1, 0.76));
      IN("#pr-same", at(1, 0.8), 0.4); DONE(1, at(1, 0.9));
      // L2 先记账后提交：kill 后重启
      OUT("#pr-v1", at(2, 0), 0.4); ACT(2, at(2, 0.02));
      tl.to("#pr-w2t", { x: 8, duration: 0.2, yoyo: true, repeat: 1 }, at(2, 0.22));
      IN("#pr-s1", at(2, 0.4), 0.4, { y: -12 }, { y: 0 }); IN("#pr-s1a", at(2, 0.48), 0.3);
      IN("#pr-bolt", at(2, 0.6), 0.3, { scale: 1.6, svgOrigin: "1452 446" }, { scale: 1, svgOrigin: "1452 446" });
      IN("#pr-kill", at(2, 0.62), 0.3); IN("#pr-nc", at(2, 0.66), 0.3);
      IN("#pr-s2a", at(2, 0.72), 0.3); IN("#pr-s3", at(2, 0.73), 0.4, { y: -12 }, { y: 0 });
      IN("#pr-s3a", at(2, 0.82), 0.3); IN("#pr-s4", at(2, 0.85), 0.4, { y: -12 }, { y: 0 });
      DONE(2, at(2, 0.93));
      // L3 序号缺口告警
      OUT("#pr-v2", at(3, 0), 0.4); ACT(3, at(3, 0.02));
      ["#pr-m1", "#pr-m2", "#pr-m3", "#pr-m4"].forEach((s, i) => IN(s, at(3, 0.12) + i * 0.18, 0.3, { x: -20 }, { x: 0 }));
      tl.to("#pr-m3", { opacity: 0, y: -40, duration: 0.4 }, at(3, 0.48));
      IN("#pr-gap", at(3, 0.56), 0.3); IN("#pr-gapt", at(3, 0.58), 0.3);
      IN("#pr-bell", at(3, 0.72), 0.3);
      tl.to("#pr-bell", { rotation: 12, svgOrigin: "1450 562", duration: 0.1, yoyo: true, repeat: 5 }, at(3, 0.75));
      IN("#pr-al", at(3, 0.76), 0.3);
