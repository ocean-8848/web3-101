  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
IN("#tx-term", at(0, 0.08), 0.5);
IN("#tx-card", at(0, 0.2), 0.6, { y: 20 }, { y: 0 });
IN("#tx-c0", at(0, 0.32), 0.4); IN("#tx-c1", at(0, 0.45), 0.4); IN("#tx-c2", at(0, 0.58), 0.4);
IN("#tx-g1", at(0, 0.82), 0.4); IN("#tx-g2", at(0, 0.88), 0.4);
// L1 tree root, signatures, message
OUT("#tx-term", at(1, 0), 0.3); OUT("#tx-ins", at(1, 0), 0.4);
IN("#tx-root", at(1, 0.06), 0.5, { y: -20 }, { y: 0 });
DRAW("#tx-e1", at(1, 0.15), 0.5); DRAW("#tx-e2", at(1, 0.15), 0.5);
IN("#tx-sig", at(1, 0.25), 0.5);
IN("#tx-msg", at(1, 0.35), 0.5);
IN("#tx-seal", at(1, 0.6), 0.4, { scale: 1.6, svgOrigin: "360 460" }, { scale: 1, svgOrigin: "360 460" });
tl.to("#tx-sig", { scale: 1.05, svgOrigin: "360 430", duration: 0.3, yoyo: true, repeat: 1 }, at(1, 0.72));
// L2 header
IN("#tx-hd", at(2, 0.1), 0.5, { y: -15 }, { y: 0 });
// L3 address list + instruction list
IN("#tx-al", at(3, 0.05), 0.5, { y: -15 }, { y: 0 });
IN("#tx-il", at(3, 0.5), 0.5, { y: -15 }, { y: 0 });
ARROW("#tx-p0", at(3, 0.7), 0.5); ARROW("#tx-p1", at(3, 0.76), 0.5);
// L4 signer / writable flags
OUT("#tx-p0, #tx-p1", at(4, 0), 0.4);
for (let i = 0; i < 3; i++) IN(`#tx-s${i}, #tx-w${i}`, at(4, 0.05) + i * 0.15, 0.4);
const LIT = (id, col, t) => { tl.to(`${id}c`, { fill: col, fillOpacity: 0.85, stroke: col, duration: 0.3 }, t); tl.to(`${id}t`, { fill: "#0f1117", duration: 0.3 }, t); };
LIT("#tx-s0", "#FF9F43", at(4, 0.2)); LIT("#tx-w0", "#58C4DD", at(4, 0.42));
LIT("#tx-w1", "#58C4DD", at(4, 0.72));
tl.to("#tx-w1c", { attr: { r: 30 }, duration: 0.25, yoyo: true, repeat: 1 }, at(4, 0.8));
tl.to("#tx-s1c", { stroke: "#FC6255", duration: 0.25, yoyo: true, repeat: 1 }, at(4, 0.88));
// L5 recent blockhash expiry
IN("#tx-bh", at(5, 0.02), 0.5, { y: 15 }, { y: 0 });
IN("#tx-rg0", at(5, 0.12), 0.3);
ARROW("#tx-rg", at(5, 0.12), 2.6);
tl.to("#tx-rg", { stroke: "#FC6255", duration: 0.2 }, at(5, 0.12) + 2.6);
tl.to("#tx-rootr", { stroke: "#FC6255", duration: 0.2 }, at(5, 0.12) + 2.6);
IN("#tx-bnf", at(5, 0.12) + 2.7, 0.3, { scale: 1.3, svgOrigin: "1500 836" }, { scale: 1, svgOrigin: "1500 836" });
IN("#tx-retry", at(5, 0.68), 0.5, { x: -20 }, { x: 0 });
tl.to("#tx-rootr", { stroke: "#e8e6df", duration: 0.3 }, at(5, 0.92));
// L6 size limit
OUT("#tx-bnf, #tx-rg, #tx-rg0", at(6, 0), 0.3);
IN("#tx-fr", at(6, 0.05), 0.6, { scale: 1.03, svgOrigin: "930 610" }, { scale: 1, svgOrigin: "930 610" });
IN("#tx-frl", at(6, 0.15), 0.5);
IN("#tx-new", at(6, 0.45), 0.4, { x: 80 }, { x: 0 });
tl.to("#tx-new", { x: -10, duration: 0.2, ease: "power2.in" }, at(6, 0.6));
tl.to("#tx-newr", { stroke: "#FC6255", duration: 0.2 }, at(6, 0.6) + 0.2);
tl.to("#tx-newt", { fill: "#FC6255", duration: 0.2 }, at(6, 0.6) + 0.2);
tl.to("#tx-new", { x: 0, duration: 0.4, ease: "back.out(3)" }, at(6, 0.6) + 0.2);
// L7 atomicity
OUT("#tx-tree, #tx-fr, #tx-frl, #tx-new", at(7, 0), 0.4);
IN("#tx-a1", at(7, 0.08), 0.5, { y: 20 }, { y: 0 });
IN("#tx-a2", at(7, 0.14), 0.5, { y: 20 }, { y: 0 });
IN("#tx-atom", at(7, 0.25), 0.5);
tl.to("#tx-a2r", { stroke: "#FC6255", duration: 0.3 }, at(7, 0.45));
IN("#tx-ax", at(7, 0.45), 0.3);
tl.to("#tx-a1r", { stroke: "#8a8f99", duration: 0.4 }, at(7, 0.62));
tl.to("#tx-a2r", { stroke: "#8a8f99", duration: 0.4 }, at(7, 0.62));
tl.to("#tx-a1, #tx-a2", { opacity: 0.55, duration: 0.4 }, at(7, 0.62));
IN("#tx-rb", at(7, 0.66), 0.5);
      /*ENDANIM*/

      tl.to("#tx-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#tx-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["txmsg"] = tl;
    })();
