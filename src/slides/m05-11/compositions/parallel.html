  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
IN("#pa-sch", at(0, 0.05), 0.6);
["#pa-q0", "#pa-q1", "#pa-q2"].forEach((s, i) => IN(s, at(0, 0.15 + i * 0.06), 0.4, { x: -40 }, { x: 0 }));
["#pa-q2", "#pa-q1", "#pa-q0"].forEach((s, i) => tl.to(s, { x: 640 - (2 - i) * 210 + 210 * 0, opacity: 0, duration: 0.8, ease: "power2.in" }, at(0, 0.5 + i * 0.12)));
// L1 many readers, one writer
OUT("#pa-sch", at(1, 0), 0.4);
IN("#pa-acc", at(1, 0.03), 0.5);
IN("#pa-rl", at(1, 0.08), 0.4);
for (let i = 0; i < 3; i++) { IN(`#pa-rd${i}`, at(1, 0.1 + i * 0.04), 0.3); DRAW(`#pa-rln${i}`, at(1, 0.15 + i * 0.04), 0.5); }
tl.to("#pa-rln0, #pa-rln1, #pa-rln2", { strokeDasharray: "0.03 0.02", duration: 0.01 }, at(1, 0.15) + 0.62);
IN("#pa-wl", at(1, 0.48), 0.4);
IN("#pa-w0", at(1, 0.5), 0.3); DRAW("#pa-wln0", at(1, 0.53), 0.5);
IN("#pa-w1", at(1, 0.68), 0.3); DRAW("#pa-wln1", at(1, 0.71), 0.4);
tl.to("#pa-w1r", { stroke: "#FC6255", duration: 0.2 }, at(1, 0.8));
tl.to("#pa-w1t", { fill: "#FC6255", duration: 0.2 }, at(1, 0.8));
IN("#pa-wx", at(1, 0.8), 0.2);
// L2 tx A and B in parallel
OUT("#pa-rw", at(2, 0), 0.4);
IN("#pa-X, #pa-Y, #pa-Z", at(2, 0.04), 0.5);
IN("#pa-ta", at(2, 0.12), 0.5, { x: -30 }, { x: 0 });
DRAW("#pa-aX", at(2, 0.2), 0.5); DRAW("#pa-aZ", at(2, 0.3), 0.6);
tl.to("#pa-aZ", { strokeDasharray: "0.025 0.018", duration: 0.01 }, at(2, 0.3) + 0.62);
IN("#pa-tb", at(2, 0.42), 0.5, { x: -30 }, { x: 0 });
DRAW("#pa-bY", at(2, 0.5), 0.5); DRAW("#pa-bZ", at(2, 0.58), 0.6);
tl.to("#pa-bZ", { strokeDasharray: "0.025 0.018", duration: 0.01 }, at(2, 0.58) + 0.62);
IN("#pa-s0, #pa-s1", at(2, 0.78), 0.5);
tl.to("#pa-tar, #pa-tbr", { stroke: "#83C167", duration: 0.4 }, at(2, 0.78));
// L3 tx C conflicts on X
IN("#pa-tc", at(3, 0.03), 0.4, { x: -30 }, { x: 0 });
tl.to("#pa-tc", { x: 60, duration: 0.4, ease: "power2.in" }, at(3, 0.2));
tl.to("#pa-tcr, #pa-tar", { stroke: "#FC6255", duration: 0.15 }, at(3, 0.2) + 0.4);
tl.to("#pa-tar", { stroke: "#83C167", duration: 0.3 }, at(3, 0.62));
tl.to("#pa-tc", { x: 0, y: -150, duration: 0.6, ease: "power2.inOut" }, at(3, 0.55));
tl.to("#pa-tcr", { stroke: "#FF9F43", duration: 0.3 }, at(3, 0.62));
// L4 Ethereum single lane vs Solana lanes
OUT("#pa-ex", at(4, 0), 0.4);
IN("#pa-road", at(4, 0.06), 0.6);
for (let k = 0; k < 4; k++) tl.to(`#pa-ec${k}`, { attr: { x: 140 + k * 90 + 220 }, duration: 6, ease: "none" }, at(4, 0.1));
for (let l = 0; l < 4; l++) for (let k = 0; k < 3; k++) tl.to(`#pa-car${l}${k}`, { attr: { x: 980 + k * 100 + 400 }, duration: 5, ease: "none" }, at(4, 0.15));
IN("#pa-unit", at(4, 0.6), 0.5, { y: 15 }, { y: 0 });
// L5 hot account collapses lanes
OUT("#pa-unit", at(5, 0), 0.3);
OUT("#pa-ll0, #pa-ll1, #pa-ll2, #pa-ll3", at(5, 0.02), 0.3);
IN("#pa-hot", at(5, 0.08), 0.4);
tl.to("#pa-ln0", { fill: "#FC6255", duration: 0.4 }, at(5, 0.08));
for (let l = 0; l < 4; l++) for (let k = 0; k < 3; k++) {
  const n = l * 3 + k;
  tl.to(`#pa-car${l}${k}`, { attr: { x: 960 + (11 - n) * 65, y: 362 }, fill: "#FC6255", duration: 0.9, ease: "power2.inOut" }, at(5, 0.15) + n * 0.12);
}
OUT("#pa-ln1, #pa-ln2, #pa-ln3", at(5, 0.6), 0.5);
// L6 split state into many accounts
OUT("#pa-hot", at(6, 0), 0.3);
tl.to("#pa-ln0", { fill: "#83C167", duration: 0.4 }, at(6, 0.05));
tl.to("#pa-ln1, #pa-ln2, #pa-ln3", { opacity: 1, duration: 0.4 }, at(6, 0.05));
for (let l = 0; l < 4; l++) for (let k = 0; k < 3; k++)
  tl.to(`#pa-car${l}${k}`, { attr: { x: 1380 + k * 100, y: [340, 480, 620, 760][l] + 22 }, fill: "#83C167", duration: 0.9, ease: "power2.inOut" }, at(6, 0.1) + l * 0.08);
tl.to("#pa-ll0, #pa-ll1, #pa-ll2, #pa-ll3", { opacity: 1, duration: 0.4 }, at(6, 0.45));
IN("#pa-own", at(6, 0.55), 0.5);
      /*ENDANIM*/

      tl.to("#pa-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#pa-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["parallel"] = tl;
    })();
