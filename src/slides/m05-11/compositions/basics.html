      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
// L0 slot timeline
IN("#ba-tlg", at(0, 0.05), 0.6);
for (let i = 0; i < 10; i++) tl.to(`#ba-c${i}`, { attr: { "fill-opacity": 0.55 }, stroke: "#58C4DD", duration: 0.15 }, at(0, 0.25) + i * 0.45);

IN("#ba-eq", at(1, 0.1), 0.7, { scale: 0.85, svgOrigin: "960 540" }, { scale: 1, svgOrigin: "960 540" });
IN("#ba-wei", at(1, 0.75), 0.5);
// L2 program
OUT("#ba-term2", at(2, 0), 0.3); OUT("#ba-eq, #ba-wei", at(2, 0), 0.4);
IN("#ba-term3", at(2, 0.1), 0.5);
IN("#ba-code", at(2, 0.15), 0.7, { y: 30 }, { y: 0 });
// L3 everything is an account
OUT("#ba-term3", at(3, 0), 0.3);
tl.to("#ba-codei", { scale: 0.4, svgOrigin: "960 540", duration: 0.7, ease: "power2.in" }, at(3, 0));
OUT("#ba-code", at(3, 0.02), 0.6);
IN("#ba-term4", at(3, 0.08), 0.5);
["#ba-i0", "#ba-i1", "#ba-i2", "#ba-i3"].forEach((s, i) => IN(s, at(3, 0.2 + i * 0.09), 0.5, { y: 20 }, { y: 0 }));
["#ba-f0", "#ba-f1", "#ba-f2", "#ba-f3"].forEach((s, i) => IN(s, at(3, 0.62 + i * 0.06), 0.5, { scale: 1.08, svgOrigin: `${420 + i * 360} 560` }, { scale: 1, svgOrigin: `${420 + i * 360} 560` }));
// L4 shops
OUT("#ba-term4", at(4, 0), 0.3);
OUT("#ba-i0, #ba-i1, #ba-i2, #ba-i3, #ba-f0, #ba-f1, #ba-f2, #ba-f3", at(4, 0), 0.4);
IN("#ba-eth", at(4, 0.12), 0.7, { y: 20 }, { y: 0 });
[0, 1, 2].forEach(i => tl.to(`#ba-s${i}`, { scale: 1.06, svgOrigin: `${240 + i * 240} 480`, duration: 0.25, yoyo: true, repeat: 1 }, at(4, 0.5) + i * 0.3));
// L5 archive room
IN("#ba-room", at(5, 0.05), 0.8, { x: 30 }, { x: 0 });
IN("#ba-clerks", at(5, 0.4), 0.6, { y: 20 }, { y: 0 });
[0, 1, 2, 3].forEach(i => tl.to(`#ba-k${i}`, { scale: 1.05, svgOrigin: `${[1135, 1315, 1495, 1675][i]} 465`, duration: 0.25, yoyo: true, repeat: 1 }, at(5, 0.68) + i * 0.2));
// L6 gatekeeper and visitors
OUT("#ba-eth", at(6, 0), 0.4);
IN("#ba-gate", at(6, 0.05), 0.5);
IN("#ba-v1, #ba-v2, #ba-v3", at(6, 0.2), 0.4);
tl.to("#ba-v1", { x: 835, duration: 1.4, ease: "power2.inOut" }, at(6, 0.4));
tl.to("#ba-v2", { x: 1045, duration: 1.4, ease: "power2.inOut" }, at(6, 0.4));
tl.to("#ba-v3", { x: 190, duration: 0.9, ease: "power2.out" }, at(6, 0.45));
IN("#ba-wait", at(6, 0.72), 0.4);
// L7 deposit
OUT("#ba-v1, #ba-v2, #ba-v3, #ba-wait, #ba-gate", at(7, 0), 0.4);
["#ba-dp0", "#ba-dp1", "#ba-dp2"].forEach((s, i) => IN(s, at(7, 0.12 + i * 0.05), 0.4, { y: -20 }, { y: 0 }));
tl.to("#ba-kr3", { stroke: "#8a8f99", fillOpacity: 0, duration: 0.4 }, at(7, 0.5));
OUT("#ba-k3", at(7, 0.62), 0.6);
IN("#ba-lim", at(7, 0.08), 0.5);
      /*ENDANIM*/

      tl.to("#ba-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ba-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["basics"] = tl;
    })();
  </script>
