  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const RED = "#FC6255", GRN = "#83C167", ORG = "#FF9F43";
      let curCode = -1;
      const setCode = (i, t) => { if (curCode >= 0) OUT(`#ch-cd${curCode}`, t - 0.35, 0.3); IN(`#ch-cd${i}`, t, 0.4); curCode = i; };
      // 卡片推进：从左边推到闸门前（x 860），被拦下：闸门与卡片变红、打叉、弹回淡出
      const push = (k, t) => { IN(`#ch-k${k}`, t, 0.4); tl.fromTo(`#ch-k${k}m`, { x: 340 }, { x: 860, duration: 0.9, ease: "power2.out", immediateRender: false }, t); };
      const block = (k, t) => {
        tl.to("#ch-gr", { fill: RED, duration: 0.2 }, t);
        tl.to(`#ch-k${k}r`, { stroke: RED, duration: 0.2 }, t);
        IN("#ch-xm", t, 0.25, { scale: 1.6, svgOrigin: "1160 400" }, { scale: 1, svgOrigin: "1160 400" });
      };
      const back = (k, t) => {
        tl.to(`#ch-k${k}m`, { x: 640, duration: 0.6, ease: "power2.in" }, t);
        OUT(`#ch-k${k}`, t + 0.2, 0.4); OUT("#ch-xm", t, 0.3);
        tl.to("#ch-gr", { fill: ORG, duration: 0.3 }, t + 0.3);
      };
      const chip = (i, t) => IN(`#ch-c${i}`, t, 0.5, { y: -16 }, { y: 0 });
      const ok = (i, t) => { tl.to(`#ch-cr${i}`, { stroke: GRN, duration: 0.3 }, t); tl.to(`#ch-ct${i}`, { fill: GRN, duration: 0.3 }, t); };

      // L0 调用方把账户推进来；以太坊对照
      IN("#ch-prog", at(0, 0.03));
      IN("#ch-caller", at(0, 0.12));
      push(0, at(0, 0.25));
      IN("#ch-eth", at(0, 0.62), 0.7, { y: 20 }, { y: 0 });
      // L1 签名
      OUT("#ch-eth", at(1, 0)); OUT("#ch-k0", at(1, 0), 0.3);
      chip(0, at(1, 0.05));
      IN("#ch-gate", at(1, 0.08), 0.5, { scaleY: 0, svgOrigin: "1221 690" }, { scaleY: 1, svgOrigin: "1221 690" });
      push(1, at(1, 0.2)); block(1, at(1, 0.38)); back(1, at(1, 0.6));
      setCode(0, at(1, 0.8)); ok(0, at(1, 0.8));
      // L2 owner
      chip(1, at(2, 0.04));
      push(2, at(2, 0.2)); block(2, at(2, 0.45)); back(2, at(2, 0.66));
      setCode(1, at(2, 0.84)); ok(1, at(2, 0.84));
      // L3 类型（鉴别码）
      chip(2, at(3, 0.04));
      push(3, at(3, 0.14)); IN("#ch-why3", at(3, 0.3)); block(3, at(3, 0.62)); OUT("#ch-why3", at(3, 0.78)); back(3, at(3, 0.8));
      setCode(2, at(3, 0.3)); ok(2, at(3, 0.3));
      // L4 种子
      chip(3, at(4, 0.04));
      push(4, at(4, 0.12)); IN("#ch-why4", at(4, 0.3)); block(4, at(4, 0.45)); OUT("#ch-why4", at(4, 0.8)); back(4, at(4, 0.8));
      setCode(3, at(4, 0.6)); ok(3, at(4, 0.6));
      // L5 字段关系 + 重复初始化
      chip(4, at(5, 0.03));
      push(5, at(5, 0.1));
      block(5, at(5, 0.28)); back(5, at(5, 0.4));
      setCode(4, at(5, 0.36)); ok(4, at(5, 0.36));
      chip(5, at(5, 0.55));
      push(6, at(5, 0.6)); block(6, at(5, 0.72)); back(6, at(5, 0.84));
      setCode(5, at(5, 0.78)); ok(5, at(5, 0.78));
      // L6 Wormhole：没装闸的门，伪造账户穿过，签名校验被绕过
      OUT(["#ch-c0", "#ch-c1", "#ch-c2", "#ch-c3", "#ch-c4", "#ch-c5", "#ch-cd5", "#ch-gate"], at(6, 0));
      IN("#ch-date", at(6, 0.08));
      IN("#ch-lamp", at(6, 0.2));
      push(7, at(6, 0.35));
      tl.to("#ch-k7m", { x: 950, opacity: 0, duration: 0.7, ease: "power1.in" }, at(6, 0.35) + 1.2);
      tl.to("#ch-lc", { fill: RED, duration: 0.3 }, at(6, 0.6));
      IN("#ch-byp", at(6, 0.64));
      // L7 结论
      OUT(["#ch-main", "#ch-wh"], at(7, 0), 0.5);
      IN("#ch-end", at(7, 0.12), 0.8, { scale: 0.92, svgOrigin: "960 550" }, { scale: 1, svgOrigin: "960 550" });


      tl.to("#ch-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["checks"] = tl;
    })();
  </script>
