  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 普通地址：私钥 → 公钥地址 → 签名
      IN("#pd-key", at(0, 0.05));
      ARROW("#pd-a0", at(0, 0.3));
      IN("#pd-addr", at(0, 0.4));
      IN("#pd-sig", at(0, 0.7));
      OUT("#pd-g0", at(1, 0));
      // L1 PDA：种子 + 程序 ID → 派生函数
      IN("#pd-term", at(1, 0.1), 0.5);
      IN("#pd-seed", at(1, 0.3));
      IN("#pd-pid", at(1, 0.45));
      ARROW("#pd-a1", at(1, 0.6)); ARROW("#pd-a2", at(1, 0.62));
      IN("#pd-fn", at(1, 0.75), 0.7, { scale: 0.9, svgOrigin: "940 450" }, { scale: 1, svgOrigin: "940 450" });
      // L2 种子展开
      IN("#pd-chip1", at(2, 0.25), 0.5, { y: -20 }, { y: 0 });
      IN("#pd-chip2", at(2, 0.55), 0.5, { y: -20 }, { y: 0 });
      OUT("#pd-term", at(2, 0.35));
      // L3 bump：255 在曲线上 → 254 在曲线外
      IN("#pd-term2", at(3, 0.12), 0.5);
      IN("#pd-bump", at(3, 0.08));
      DRAW("#pd-curve", at(3, 0.18), 1.0); IN("#pd-cl0", at(3, 0.2));
      IN("#pd-p1", at(3, 0.32), 0.4, { scale: 1.8, svgOrigin: "1420 520" }, { scale: 1, svgOrigin: "1420 520" });
      IN("#pd-l1", at(3, 0.35));
      COUNT("#pd-bv", 255, 254, at(3, 0.5), 0.4);
      IN("#pd-p2", at(3, 0.56), 0.4, { scale: 1.8, svgOrigin: "1640 520" }, { scale: 1, svgOrigin: "1640 520" });
      IN("#pd-l2", at(3, 0.58));
      ARROW("#pd-a3", at(3, 0.68));
      IN("#pd-out", at(3, 0.72));
      IN("#pd-nokey", at(3, 0.84));
      OUT("#pd-term2", at(3, 0.76));
      // L4 确定性：客户端和程序各自算出同一个地址
      OUT("#pd-g1", at(4, 0));
      tl.to("#pd-outm", { x: 1300, y: 490, duration: 0.8, ease: "power2.inOut" }, at(4, 0.06));
      IN("#pd-cl", at(4, 0.2));
      IN("#pd-pg", at(4, 0.3));
      ARROW("#pd-a4", at(4, 0.42)); ARROW("#pd-a5", at(4, 0.46));
      IN("#pd-same", at(4, 0.56));
      IN("#pd-map", at(4, 0.72));
      IN("#pd-mapx", at(4, 0.84), 0.4, { scale: 1.5, svgOrigin: "1460 770" }, { scale: 1, svgOrigin: "1460 770" });
      // L5 invoke_signed 代签
      OUT(["#pd-cl", "#pd-a4", "#pd-a5", "#pd-same", "#pd-map", "#pd-mapx"], at(5, 0));
      tl.to("#pd-pgm", { x: 120, y: 300, duration: 0.8, ease: "power2.inOut" }, at(5, 0.03));
      tl.to("#pd-outm", { x: 1560, y: 360, duration: 0.8, ease: "power2.inOut" }, at(5, 0.03));
      ARROW("#pd-a6", at(5, 0.2)); IN("#pd-inv", at(5, 0.21)); IN("#pd-inv2", at(5, 0.26));
      IN("#pd-rt", at(5, 0.32));
      IN("#pd-rc1", at(5, 0.42));
      IN("#pd-rc2", at(5, 0.52));
      ARROW("#pd-a7", at(5, 0.58));
      IN("#pd-stamp", at(5, 0.64), 0.5, { scale: 1.6, svgOrigin: "1560 510" }, { scale: 1, svgOrigin: "1560 510" });
      IN("#pd-op", at(5, 0.78));
      DRAW("#pd-a8", at(5, 0.84), 0.5); tl.set("#pd-a8", { opacity: 1 }, at(5, 0.84));
      IN("#pd-x", at(5, 0.9), 0.4);
      // L6 规范 bump
      OUT(["#pd-g5", "#pd-pgm", "#pd-outm"], at(6, 0));
      IN("#pd-sd", at(6, 0.06));
      ARROW("#pd-a9", at(6, 0.16)); ARROW("#pd-a10", at(6, 0.2));
      IN("#pd-ba", at(6, 0.26)); IN("#pd-bb", at(6, 0.32));
      IN("#pd-lock", at(6, 0.42));
      tl.to("#pd-shk", { y: -22, stroke: "#FC6255", duration: 0.4 }, at(6, 0.55));
      tl.to("#pd-lkb", { fill: "#FC6255", duration: 0.4 }, at(6, 0.55));
      IN("#pd-byp", at(6, 0.56));
