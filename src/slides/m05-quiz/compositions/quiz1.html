    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const QT1 = 2.4, QT2 = 1.2;
      // ===== 测验版式（照 EP009 / EP050 quiz）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#qu-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#qu-q", at(0, 0.03), 0.01);
      tl.fromTo("#qu-qcr1", { attr: { width: 0 } }, { attr: { width: 1440 }, duration: QT1, ease: "none" }, at(0, 0.05));
      tl.fromTo("#qu-qcr2", { attr: { width: 0 } }, { attr: { width: 1440 }, duration: QT2, ease: "none" }, at(0, 0.05) + QT1);
      IN("#qu-q2t", at(0, 0.05) + QT1, 0.3, { x: -10 }, { x: 0 });
      const SHOW = (k, t) => {
        IN(`#qu-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#qu-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#qu-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      IN("#qu-pause", at(2, 0.0), 0.3);
      tl.fromTo("#qu-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#qu-pause", at(3, 0.0), 0.3);
      const RIGHT = (k, t) => {
        tl.to(`#qu-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#qu-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#qu-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#qu-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#qu-o${k}-t`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#qu-o${k}-n`, t + 0.3, 0.5);
      };

      // L0 面板：钱包成功 → 排序器；L1 还没收到
      IN("#qu-phone", at(0, 0.3), 0.5, { y: 20 }, { y: 0 });
      ARROW("#qu-a1", at(0, 0.42), 0.5);
      IN("#qu-seq", at(0, 0.45), 0.5);
      IN("#qu-l1", at(0, 0.62), 0.5);
      IN("#qu-gap", at(0, 0.66), 0.4); IN("#qu-gapt", at(0, 0.7), 0.4);
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.2)); SHOW("C", at(1, 0.48)); SHOW("D", at(1, 0.76));
      tl.to("#qu-seqr", { fill: "#2a2040", duration: 0.3, yoyo: true, repeat: 1 }, at(1, 0.55));
      // L3 揭晓 + 三层确认
      RIGHT("C", at(3, 0.02));
      OUT("#qu-badge", at(3, 0.0), 0.3);
      IN("#qu-term", at(3, 0.08));
      OUT("#qu-s0", at(3, 0.1), 0.4);
      IN("#qu-lad0", at(3, 0.3), 0.5, { x: 20 }, { x: 0 });
      IN("#qu-lad1", at(3, 0.42), 0.5, { x: 20 }, { x: 0 });
      IN("#qu-lad2", at(3, 0.54), 0.5, { x: 20 }, { x: 0 });
      tl.to("#qu-lad1, #qu-lad2", { opacity: 0.4, duration: 0.4 }, at(3, 0.8));
      // L4 干扰项
      OUT("#qu-term", at(4, 0.0), 0.3);
      WRONG("A", at(4, 0.02)); tl.to("#qu-lad2", { opacity: 1, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.04));
      WRONG("D", at(4, 0.2)); tl.to("#qu-lad1", { opacity: 1, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.22));
      WRONG("B", at(4, 0.42));
      IN("#qu-wd", at(4, 0.5), 0.5, { y: 15 }, { y: 0 });
      IN("#qu-in", at(4, 0.78), 0.5, { y: 10 }, { y: 0 });
      // L5 选项淡出，入账门槛
      ["A", "B", "C", "D"].forEach(k => OUT(`#qu-o${k}`, at(5, 0.0), 0.4));
      OUT("#qu-panel", at(5, 0.0), 0.4);
      IN("#qu-b0", at(5, 0.08), 0.4); IN("#qu-b1", at(5, 0.12), 0.4); IN("#qu-b2", at(5, 0.16), 0.4);
      IN("#qu-dot", at(5, 0.2), 0.3);
      tl.to("#qu-dot", { attr: { cx: 1227 }, duration: 1.0, ease: "power1.inOut" }, at(5, 0.24));
      IN("#qu-m1", at(5, 0.44), 0.5, { y: -10 }, { y: 0 });
      tl.to("#qu-dot", { attr: { cx: 1744 }, fill: "#83C167", duration: 0.8, ease: "power1.inOut" }, at(5, 0.6));
      IN("#qu-m2", at(5, 0.74), 0.5, { y: -10 }, { y: 0 });


      tl.to("#qu-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#qu-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["quiz1"] = tl;
    })();
