  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
// L0 deposit record flies in
IN("#cr-card", at(0, 0.05), 0.7, { x: -80 }, { x: 0 });
IN("#cr-led", at(0, 0.45), 0.6);
// L1 three validations
IN("#cr-c0", at(1, 0.15), 0.4, { x: -16 }, { x: 0 });
IN("#cr-c1", at(1, 0.55), 0.4, { x: -16 }, { x: 0 });
IN("#cr-c2", at(1, 0.78), 0.4, { x: -16 }, { x: 0 });
// L2 confirmations tick, still on main chain
IN("#cr-stk", at(2, 0.02), 0.4);
IN("#cr-k3", at(2, 0.22), 0.3, { y: -16 }, { y: 0 });
COUNT("#cr-cn", 7, 8, at(2, 0.22), 0.2);
IN("#cr-k4", at(2, 0.45), 0.3, { y: -16 }, { y: 0 });
COUNT("#cr-cn", 8, 9, at(2, 0.45), 0.2);
tl.to("#cr-main", { opacity: 1, duration: 0.3 }, at(2, 0.6));
tl.to("#cr-main", { opacity: 0.4, duration: 0.25, yoyo: true, repeat: 3 }, at(2, 0.72));
// L3 reach threshold -> Post with idempotency key
COUNT("#cr-cn", 9, 12, at(3, 0.02), 1.2);
tl.to("#cr-cf", { attr: { fill: "#83C167" }, duration: 0.3 }, at(3, 0.14));
tl.to("#cr-main", { opacity: 0, duration: 0.3 }, at(3, 0.14));
ARROW("#cr-post", at(3, 0.2), 0.6);
IN("#cr-postt", at(3, 0.22), 0.4);
tl.to("#cr-av", { attr: { width: 280 }, duration: 0.7, ease: "power2.out" }, at(3, 0.3));
tl.to("#cr-st0", { opacity: 0, duration: 0.3 }, at(3, 0.34));
tl.to("#cr-st1", { opacity: 1, duration: 0.3 }, at(3, 0.36));
IN("#cr-key", at(3, 0.48), 0.5, { y: 16 }, { y: 0 });
IN("#cr-kv", at(3, 0.76), 0.4, { x: -12 }, { x: 0 });
tl.to("#cr-key", { y: -6, duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.85));
// L4 why not txHash alone
IN("#cr-ins", at(4, 0.15), 0.6);
IN("#cr-insx", at(4, 0.7), 0.4);
// L5 idempotent replay blocked
OUT(["#cr-ins", "#cr-insx"], at(5, 0.0), 0.4);
IN("#cr-shd", at(5, 0.1), 0.4);
IN("#cr-ghost", at(5, 0.2), 0.3);
tl.to("#cr-ghost", { x: 70, duration: 0.5, ease: "power2.in" }, at(5, 0.25));
tl.to("#cr-ghost", { x: 0, duration: 0.5, ease: "power2.out" }, at(5, 0.25) + 0.5);
tl.to("#cr-shd path", { attr: { "fill-opacity": 0.6 }, duration: 0.2, yoyo: true, repeat: 1 }, at(5, 0.25) + 0.45);
IN("#cr-shdt", at(5, 0.45), 0.4);
tl.to("#cr-ghost", { opacity: 0, duration: 0.4 }, at(5, 0.8));
// L6 large deposit: credit but restrict withdrawal
IN("#cr-lock", at(6, 0.2), 0.5, { y: -12 }, { y: 0 });
tl.to("#cr-lock", { opacity: 0.5, duration: 0.3, yoyo: true, repeat: 1 }, at(6, 0.68));
// L7 push notifications
IN("#cr-n0", at(7, 0.1), 0.4, { x: 30 }, { x: 0 });
IN("#cr-n1", at(7, 0.5), 0.4, { x: 30 }, { x: 0 });
// extra motion to avoid static frames
tl.to("#cr-c0", { opacity: 0.5, duration: 0.25, yoyo: true, repeat: 1 }, at(1, 0.35));
tl.to("#cr-av", { opacity: 0.5, duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.68));
tl.to("#cr-ins text", { opacity: 0.45, duration: 0.25, yoyo: true, repeat: 1, stagger: 0.35 }, at(4, 0.3));
tl.to("#cr-av", { opacity: 0.5, duration: 0.3, yoyo: true, repeat: 1 }, at(6, 0.45));
tl.to("#cr-lock", { y: -6, duration: 0.25, yoyo: true, repeat: 1 }, at(6, 0.9));
      /*ENDANIM*/

      tl.to("#cr-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["credit"] = tl;
    })();
  </script>
