tl.to(CAPS, { opacity: 0.35, duration: 0.3 }, at(0, 0.0) + 1.0);
// L1 apply
ACT(0, at(1, 0.0));
[0, 1, 2, 3, 4].forEach(i => IN(`#wst-k${i}`, at(1, 0.15 + i * 0.15), 0.35, { x: -16 }, { x: 0 }));

IN("#wst-rq", at(2, 0.62), 0.3, { x: 40 }, { x: 0 });
tl.to("#wst-rq", { x: -150, duration: 0.4, ease: "power2.in" }, at(2, 0.7));
tl.to("#wst-rq", { x: 0, duration: 0.4, ease: "power2.out" }, at(2, 0.7) + 0.4);
tl.to("#wst-shd path", { attr: { "fill-opacity": 0.6 }, duration: 0.2, yoyo: true, repeat: 1 }, at(2, 0.7) + 0.35);
// L3 risk gauges
OUT("#wst-d2", at(3, 0.0), 0.3);
ACT(2, at(3, 0.0));
[0, 1, 2, 3].forEach(i => {
  const cx = [920, 1420, 920, 1420][i], cy = [450, 450, 730, 730][i];
  IN(`#wst-g${i}`, at(3, 0.08 + i * 0.17), 0.4);
  tl.to(`#wst-nd${i}`, { rotation: 40 + i * 25, svgOrigin: `${cx} ${cy}`, duration: 1.2, ease: "power2.out" }, at(3, 0.1 + i * 0.17));
});
IN("#wst-n3", at(3, 0.78), 0.4);
// L4 approval: threshold + four eyes
OUT("#wst-d3", at(4, 0.0), 0.3);
ACT(3, at(4, 0.0));
IN("#wst-th", at(4, 0.05), 0.4);
tl.set("#wst-amt", { opacity: 1 }, at(4, 0.12));
tl.to("#wst-amt", { attr: { y: 400, height: 460 }, duration: 1.2, ease: "power2.out" }, at(4, 0.12));
IN("#wst-p0", at(4, 0.45), 0.4);
IN("#wst-p1", at(4, 0.5), 0.4);
IN("#wst-st0", at(4, 0.62), 0.3, { y: -20 }, { y: 0 });
IN("#wst-st1", at(4, 0.62), 0.3, { y: -20 }, { y: 0 });
IN("#wst-4e", at(4, 0.75), 0.4);
// L5 signing service
OUT("#wst-d4", at(5, 0.0), 0.3);
ACT(4, at(5, 0.0));
IN("#wst-ws", at(5, 0.05), 0.4);
ARROW("#wst-sa", at(5, 0.15), 0.5); IN("#wst-sat", at(5, 0.17), 0.4);
IN("#wst-ss", at(5, 0.25), 0.4);
IN("#wst-hsm", at(5, 0.35), 0.4, { y: 12 }, { y: 0 });
IN("#wst-mpc", at(5, 0.45), 0.4, { y: 12 }, { y: 0 });
ARROW("#wst-ra", at(5, 0.58), 0.6);
IN("#wst-key", at(5, 0.64), 0.4, { x: 40 }, { x: 0 });
IN("#wst-n5", at(5, 0.8), 0.4);
// L6 broadcast to multiple nodes
OUT("#wst-d5", at(6, 0.0), 0.3);
ACT(5, at(6, 0.0));
IN("#wst-tx", at(6, 0.05), 0.4);
ARROW("#wst-f0", at(6, 0.18), 0.4); ARROW("#wst-f1", at(6, 0.18), 0.4); ARROW("#wst-f2", at(6, 0.18), 0.4);

IN("#wst-th6", at(6, 0.45), 0.4);
