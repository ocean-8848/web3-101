ARROW("#ws-e12", at(4, 0.22), 0.5); IN("#ws-e12t", at(4, 0.25), 0.4);

// L5 failure -> refunded ; ends
ARROW("#ws-e13", at(5, 0.04), 1.0); IN("#ws-e13t", at(5, 0.15), 0.4);
tl.to("#ws-r-fail", { attr: { "fill-opacity": 0.4 }, duration: 0.25, yoyo: true, repeat: 1 }, at(5, 0.3));
ARROW("#ws-e14", at(5, 0.45), 0.4); IN("#ws-e14t", at(5, 0.48), 0.4);

tl.to(["#ws-f1", "#ws-f2", "#ws-f3"], { attr: { "stroke-width": 5 }, duration: 0.3, yoyo: true, repeat: 1 }, at(6, 0.85));

IN("#ws-b0", at(7, 0.06), 0.4);
