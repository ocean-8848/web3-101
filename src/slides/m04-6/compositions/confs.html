  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
// L0 confirmations stack up
IN("#co-term", at(0, 0.02), 0.5);
IN("#co-b0", at(0, 0.1), 0.4);
IN("#co-bt0", at(0, 0.1), 0.4);
IN("#co-ctr", at(0, 0.15), 0.4);
for (let i = 1; i <= 12; i++) {
  IN(`#co-b${i}`, at(0, 0.2 + i * 0.06), 0.25, { y: -14 }, { y: 0 });
  IN(`#co-bt${i}`, at(0, 0.2 + i * 0.06), 0.25);
}
COUNT("#co-n", 0, 12, at(0, 0.26), at(0, 0.92) - at(0, 0.26));
// L1 tiers
OUT("#co-term", at(1, 0.0), 0.4);
IN("#co-ex", at(1, 0.05), 0.4);
IN("#co-r1", at(1, 0.1), 0.5, { x: -16 }, { x: 0 });
ARROW("#co-tl", at(1, 0.38), 0.6);
IN("#co-r2", at(1, 0.45), 0.5, { x: -16 }, { x: 0 });
IN("#co-r3", at(1, 0.72), 0.5);
tl.to(["#co-b0", "#co-b12"], { attr: { "fill-opacity": 0.5 }, duration: 0.3, yoyo: true, repeat: 1 }, at(1, 0.88));
// L2 3 ETH
IN("#co-a", at(2, 0.1), 0.4, { y: -12 }, { y: 0 });
IN("#co-af", at(2, 0.4), 0.5, { x: -12 }, { x: 0 });
IN("#co-ar", at(2, 0.72), 0.5, { y: 12 }, { y: 0 });
tl.to("#co-r1", { opacity: 0.5, duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.25));
// L3 50 ETH
IN("#co-b", at(3, 0.03), 0.4, { y: -12 }, { y: 0 });
IN("#co-bf", at(3, 0.18), 0.5, { x: -12 }, { x: 0 });
IN("#co-br", at(3, 0.36), 0.5, { y: 12 }, { y: 0 });
IN("#co-fin", at(3, 0.58), 0.5, { x: -12 }, { x: 0 });
tl.to("#co-fin", { opacity: 0.4, duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.86));
// L4 BTC
OUT(["#co-eth", "#co-ctr"], at(4, 0.0), 0.4);
IN("#co-btcl", at(4, 0.12), 0.4);
[0, 1, 2, 3].forEach(i => {
  IN(`#co-c${i}`, at(4, 0.1 + i * 0.13), 0.3, { y: -14 }, { y: 0 });
  if (i < 3) { IN(`#co-cl${i}`, at(4, 0.15 + i * 0.13), 0.3); IN(`#co-ct${i}`, at(4, 0.17 + i * 0.13), 0.3); }
});
IN("#co-bt", at(4, 0.62), 0.5, { x: -12 }, { x: 0 });
// L5 balance: more money, longer wait
OUT("#co-panel", at(5, 0.0), 0.4);
IN("#co-base", at(5, 0.04), 0.3);
IN(["#co-g1t", "#co-g2t"], at(5, 0.06), 0.4);
tl.to("#co-g1", { attr: { y: 600, height: 300 }, duration: 2.4, ease: "power1.inOut" }, at(5, 0.08));
tl.to("#co-g2", { attr: { y: 600, height: 300 }, duration: 2.4, ease: "power1.inOut" }, at(5, 0.08));
IN("#co-rg", at(5, 0.35), 0.5, { x: 16 }, { x: 0 });
tl.to("#co-rg", { x: 6, duration: 0.08, yoyo: true, repeat: 5 }, at(5, 0.48));

tl.to(["#co-g1", "#co-g2"], { opacity: 0.6, duration: 0.3, yoyo: true, repeat: 1 }, at(5, 0.85));

OUT(["#co-btc", "#co-bal"], at(6, 0.0), 0.4);
IN("#co-web", at(6, 0.02), 0.5);
IN("#co-tt", at(6, 0.17), 0.4, { y: 10 }, { y: 0 });
