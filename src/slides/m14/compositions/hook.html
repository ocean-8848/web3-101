    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
      // L0 withdraw panel + fork
      IN("#ho-pan", at(0, 0.0), 0.7, { scale: 0.96, svgOrigin: "960 430" }, { scale: 1, svgOrigin: "960 430" });
      IN("#ho-usdt", at(0, 0.14), 0.5, { x: -20 }, { x: 0 });
      IN("#ho-net", at(0, 0.3), 0.5);
      DRAW("#ho-stem", at(0, 0.45), 0.4);
      DRAW("#ho-fl", at(0, 0.52), 0.7); IN("#ho-eth", at(0, 0.6), 0.5);
      DRAW("#ho-fr", at(0, 0.7), 0.7); IN("#ho-tron", at(0, 0.78), 0.5);
      IN("#ho-qt", at(0, 0.82), 0.3);
      tl.fromTo("#ho-q", { opacity: 1 }, { opacity: 0.25, duration: 0.35, repeat: 3, yoyo: true, ease: "sine.inOut", immediateRender: false }, at(0, 0.88));
      // L1 panel recedes, bridge
      tl.to("#ho-p1", { scale: 0.55, svgOrigin: "560 300", opacity: 0, duration: 0.6, ease: "power2.in" }, at(1, 0));
      IN("#ho-term", at(1, 0.06), 0.5);
      DRAW("#ho-deck", at(1, 0.1), 0.6); DRAW("#ho-arch", at(1, 0.18), 0.7); IN("#ho-pil", at(1, 0.3), 0.4);
      IN("#ho-lock", at(1, 0.34), 0.5, { y: 20 }, { y: 0 });
      IN("#ho-coin, #ho-btcl", at(1, 0.16), 0.5);
      IN("#ho-tok, #ho-sol", at(1, 0.24), 0.5);
      const tf = at(1, 0.45);
      tl.to("#ho-coin", { x: 680, duration: 2.0, ease: "power1.inOut" }, tf);
      tl.to("#ho-coin", { y: -200, duration: 1.0, ease: "power2.out" }, tf);
      tl.to("#ho-coin", { y: 0, duration: 1.0, ease: "power2.in" }, tf + 1.0);
      tl.to("#ho-coin", { opacity: 0, duration: 0.3 }, tf + 1.8);
      tl.fromTo("#ho-tok0", { scale: 1 }, { scale: 1.18, svgOrigin: "1740 640", duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, tf + 1.9);
      // L2 EVM + seven chains
      tl.to("#ho-br", { opacity: 0, duration: 0.5, ease: "power2.in" }, at(2, 0));
      OUT("#ho-term", at(2, 0.02), 0.4);
      IN("#ho-evm", at(2, 0.08), 0.7, { scale: 0.6, svgOrigin: "960 590" }, { scale: 1, svgOrigin: "960 590" });
      [0, 1, 6, 2, 5, 3, 4].forEach((k, j) => IN("#ho-bi" + k, at(2, 0.22) + j * 0.22, 0.5, { scale: 0.5, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0" }));
      const CX = 960, CY = 590, RX = 690, RY = 350;
      const orb = { d: 0 };
      tl.fromTo(orb, { d: 0 }, { d: 10, duration: at(3, 0) - at(2, 0.1), ease: "sine.inOut", immediateRender: false, onUpdate: () => {
        for (let k = 0; k < 7; k++) {
          const a = (-90 + k * 360 / 7 + orb.d) * Math.PI / 180;
          document.querySelector("#ho-b" + k).setAttribute("transform", `translate(${(CX + RX * Math.cos(a)).toFixed(1)} ${(CY + RY * Math.sin(a)).toFixed(1)})`);
        }
      } }, at(2, 0.1));
      // L3 differences
      const LB = [["#ho-l0", 0.02, [0, 1]], ["#ho-l1", 0.26, [2, 1]], ["#ho-l2", 0.5, [5, 6]], ["#ho-l3", 0.72, [4, 3]]];
      LB.forEach(([s, f, ks]) => {
        IN(s, at(3, f), 0.5, { y: 12 }, { y: 0 });
        ks.forEach(k => tl.to("#ho-bc" + k, { stroke: "#FF9F43", duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, at(3, f) + 0.1));
      });
      // L4 connect
      OUT("#ho-labs", at(4, 0), 0.4);
      for (let k = 0; k < 7; k++) DRAW("#ho-sp" + k, at(4, 0.06) + k * 0.06, 0.5);
      DRAW("#ho-ring", at(4, 0.22), 1.1);
      OUT("#ho-sp0, #ho-sp1, #ho-sp2, #ho-sp3, #ho-sp4, #ho-sp5, #ho-sp6", at(4, 0.5), 0.4);
      IN("#ho-slo", at(4, 0.6), 0.6, { y: 16 }, { y: 0 });
      /*ENDANIM*/

      tl.to("#ho-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ho-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["hook"] = tl;
    })();
