      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
      // L0 three cards
      IN("#le-c0", at(0, 0.3), 0.6, { y: 20 }, { y: 0 });

      // L2 execution
      IN("#le-e0", at(2, 0.12), 0.5);
      [0, 1, 2].forEach(k => { const t = at(2, 0.16) + k * 0.7; IN("#le-q" + k, t, 0.2); tl.to("#le-q" + k, { x: 376 - k * 52, duration: 0.9, ease: "power2.inOut" }, t); });

      IN("#le-box", at(4, 0.06), 0.7, { y: -20 }, { y: 0 });

        IN("#le-n" + k, t, 0.4); DRAW("#le-ln" + k, t, 0.7); IN("#le-v" + k, t + 0.4, 0.4);

        tl.to("#le-m" + k, { x: 760 + k * 40, duration: at(5, 0) - t - 0.6, ease: "sine.inOut" }, t + 0.3);

      tl.to("#le-ln0", { attr: { d: "M430 600 C640 600 700 690 852 690" }, duration: 0.9, ease: "power2.inOut" }, at(5, 0.02) + 0.00);
