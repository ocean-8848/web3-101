  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const IDS = ["utxo","segwit","ln","insc","rust","pda","prod","anchor","move","cosmos","tron","bridge","intent"];
      const REQ = { utxo: 1, bridge: 1 };
      const CH = (id, st, t, d = 0.4) => {
        const base = REQ[id] ? "#83C167" : "#8a8f99";
        const o = { hi: 1, mid: 0.55, dim: 0.22, base: 1 }[st];
        tl.to(`#pi-c-${id}`, { opacity: o, duration: d, ease: "power2.out" }, t);
        tl.to(`#pi-c-${id}-r`, st === "hi"
          ? { stroke: REQ[id] ? "#83C167" : "#e8e6df", strokeWidth: 4.5, fill: "#1e2836", duration: d }
          : { stroke: base, strokeWidth: 2.5, fill: "#161a22", duration: d }, t);
      };
      const ROW = (i, on, t) => {
        tl.to(`#pi-r${i}-b`, on ? { stroke: "#e8e6df", strokeWidth: 3, duration: 0.4 } : { stroke: "#6b6f7a", strokeWidth: 2, duration: 0.4 }, t);
        tl.to(`#pi-r${i}-t`, { fill: on ? "#e8e6df" : "#6b6f7a", duration: 0.4 }, t);
        if (on) IN(`#pi-r${i}-s`, t + 0.2, 0.5); else tl.to(`#pi-r${i}-s`, { opacity: 0.45, duration: 0.4 }, t);
      };
      // L0 map at left, the two required chips glow and fly right
      IN("#pi-map", at(0, 0), 0.8, { x: 300 }, { x: 0 });
      tl.to("#pi-c-utxo-r, #pi-c-bridge-r", { strokeWidth: 7, duration: 0.35, yoyo: true, repeat: 3 }, at(0, 0.25));
      IN("#pi-mustl", at(0, 0.45), 0.5);
      IN("#pi-ca", at(0, 0.5), 0.9, { x: -900, y: -64 }, { x: 0, y: 0 });
      IN("#pi-cb", at(0, 0.72), 0.9, { x: -1320, y: 582 }, { x: 0, y: 0 });
      // L1 second ledger / attack surface
      IN("#pi-led", at(1, 0.08), 0.6, { y: 20 }, { y: 0 });
      IN("#pi-ledl", at(1, 0.18), 0.5);
      IN("#pi-tgt", at(1, 0.42), 0.6, { scale: 0.6, svgOrigin: "1610 545" }, { scale: 1, svgOrigin: "1610 545" });
      IN("#pi-tgtl", at(1, 0.5), 0.5);
      IN("#pi-lock", at(1, 0.66), 0.5, { y: -30 }, { y: 0 });
      tl.to("#pi-tgt1", { attr: { r: 88 }, strokeWidth: 6, duration: 0.3, yoyo: true, repeat: 3 }, at(1, 0.82));
      // L2 filter: wallet / exchange
      OUT("#pi-must", at(2, 0), 0.4);
      [0, 1, 2, 3].forEach(i => IN(`#pi-r${i}`, at(2, 0.03) + 0.12 * i, 0.5, { x: 30 }, { x: 0 }));
      ROW(0, true, at(2, 0.1));
      ["utxo", "segwit", "tron", "bridge"].forEach((k, i) => CH(k, "hi", at(2, 0.2) + 0.35 * i));
      ["rust", "pda", "prod", "anchor", "move", "cosmos", "intent"].forEach(k => CH(k, "mid", at(2, 0.3)));
      ["ln", "insc"].forEach(k => CH(k, "dim", at(2, 0.42)));
      IN("#pi-usdt", at(2, 0.74), 0.5, { y: 14 }, { y: 0 });
      tl.to("#pi-usdt", { attr: { "font-size": 38 }, duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.8));
      // L3 Solana engineering
      OUT("#pi-usdt", at(3, 0), 0.3);
      ROW(0, false, at(3, 0)); ROW(1, true, at(3, 0.04));
      IDS.forEach(k => CH(k, "mid", at(3, 0.05)));
      CH("rust", "hi", at(3, 0.14)); ARROW("#pi-a1", at(3, 0.24), 0.4);
      CH("pda", "hi", at(3, 0.3)); ARROW("#pi-a2", at(3, 0.38), 0.4);
      CH("anchor", "hi", at(3, 0.44)); ARROW("#pi-a3", at(3, 0.52), 0.4);
      CH("prod", "hi", at(3, 0.58));
      ["ln", "insc", "cosmos"].forEach(k => CH(k, "dim", at(3, 0.74)));
      // L4 cross-chain product
      OUT("#pi-a1, #pi-a2, #pi-a3", at(4, 0), 0.3);
      ROW(1, false, at(4, 0)); ROW(2, true, at(4, 0.04));
      ["utxo", "segwit", "ln", "insc", "rust", "pda", "prod", "anchor"].forEach(k => CH(k, "dim", at(4, 0.08)));
      ["bridge", "intent"].forEach((k, i) => CH(k, "hi", at(4, 0.15) + 0.3 * i));
      ["move", "cosmos", "tron"].forEach(k => CH(k, "mid", at(4, 0.6)));
      // L5 protocol research: everything, then the recap chip
      ROW(2, false, at(5, 0)); ROW(3, true, at(5, 0.04));
      IDS.forEach((k, i) => CH(k, "hi", at(5, 0.1) + 0.06 * i));
      IN("#pi-c-recap", at(5, 0.62), 0.6, { y: 30 }, { y: 0 });

      tl.to("#pi-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["pick"] = tl;
    })();
