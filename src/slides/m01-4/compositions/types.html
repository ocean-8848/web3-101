IN("#ty-p0", at(2, 0.05), 0.3); IN("#ty-r0", at(2, 0.05), 0.5, { x: -16 }, { x: 0 });

IN("#ty-i3", at(5, 0.45), 0.5, { scale: 0.8, svgOrigin: "1004 785" }, { scale: 1, svgOrigin: "1004 785" });

// L7 type 4 delegation + authorizationList
["#ty-f3", "#ty-f3a", "#ty-f3an", "#ty-f3b", "#ty-f3bn"].forEach(e => OUT(e, at(7, 0), 0.3));
IN("#ty-p4", at(7, 0.03), 0.3); IN("#ty-r4", at(7, 0.03), 0.5, { x: -16 }, { x: 0 });
