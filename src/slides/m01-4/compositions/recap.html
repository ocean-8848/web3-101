      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        ["m3", 400, "交易里有 from", 240, "从签名恢复"],
        ["m3", 540, "maxFee = 实际单价", 312, "只是上限"],
        ["m4", 380, "上链 = 成功", 184, "看 status"],
        ["m4", 520, "ERC-20 的 to = 收款人", 352, "to = 代币合约"],
        ["m4", 660, "发出可撤回", 180, "打包前只能同 nonce 替换"],
      ];

        const p = document.getElementById("rp-" + g);
        mk("text", { id: `rp-x${i}a`, class: "h", x: 880, y, "font-size": 36, fill: "#FC6255", "text-anchor": "end" }, p, a);
        mk("line", { id: `rp-x${i}s`, class: "dr", pathLength: 1, x1: 872 - w, y1: y - 12, x2: 888, y2: y - 12, stroke: "#FC6255", "stroke-width": 4 }, p);
        mk("path", { id: `rp-x${i}r`, class: "dr h", pathLength: 1, d: `M940 ${y - 12} H1050`, stroke: "#83C167", "stroke-width": 3, fill: "none", "marker-end": "url(#rp-arrg)" }, p);
        mk("text", { id: `rp-x${i}b`, class: "h", x: 1090, y, "font-size": 36, fill: "#83C167" }, p, b);
      });
      const MYTH = (i, t, step = 1.0) => {
        IN(`#rp-x${i}a`, t, 0.5, { x: -16 }, { x: 0 });
        DRAW(`#rp-x${i}s`, t + step * 0.9, 0.4);
        ARROW(`#rp-x${i}r`, t + step * 1.1, 0.4);
        IN(`#rp-x${i}b`, t + step * 1.3, 0.5, { x: -16 }, { x: 0 });
      };
      const ANS = (k, t) => {
        tl.to(`#rp-q${k} .rp-qr, #rp-q${k} .rp-qc`, { stroke: "#83C167", duration: 0.3 }, t);
        OUT(`#rp-q${k}a`, t, 0.2);
        IN(`#rp-q${k}b`, t + 0.15, 0.3, { scale: 0.5, svgOrigin: `170 ${[0, 258, 378, 798][k]}` }, { scale: 1, svgOrigin: `170 ${[0, 258, 378, 798][k]}` });
        ARROW(`#rp-a${k}`, t + 0.2, 0.4);

      // L0：前两个问号回来并给答案
      IN("#rp-q1, #rp-q1a", at(0, 0.02), 0.5, { x: -20 }, { x: 0 });

      ANS(1, at(0, 0.2));

      ARROW("#rp-r3", at(1, 0.22), 0.3); IN("#rp-b4", at(1, 0.24), 0.4);
      ARROW("#rp-r4", at(1, 0.3), 0.3); IN("#rp-b5", at(1, 0.32), 0.4, { scale: 0.9, svgOrigin: "1290 550" }, { scale: 1, svgOrigin: "1290 550" });
      ARROW("#rp-r5", at(1, 0.42), 0.3); IN("#rp-b6", at(1, 0.44), 0.4);

      IN("#rp-pint", at(1, 0.52), 0.4);
      IN("#rp-sh", at(1, 0.7), 0.6, { scale: 0.8, svgOrigin: "1760 552" }, { scale: 1, svgOrigin: "1760 552" });

      IN("#rp-q3, #rp-q3a", at(2, 0.02), 0.4, { x: -20 }, { x: 0 });

      IN("#rp-nl", at(2, 0.4), 0.4);
      IN("#rp-oldi", at(2, 0.55), 0.3);
      IN("#rp-newi", at(2, 0.6), 0.3, { x: 30 }, { x: 0 });

      OUT("#rp-ra, #rp-rl", at(2, 0.78), 0.3);
      tl.to("#rp-new", { x: -360, duration: 0.6, ease: "power2.inOut" }, at(2, 0.84));
      // L3：误区 1–2
      OUT("#rp-p1", at(3, 0), 0.5);
      IN("#rp-mh", at(3, 0.06), 0.4);
      MYTH(0, at(3, 0.1)); MYTH(1, at(3, 0.55));
      // L4：误区 3–5（先清掉前两行）
      OUT("#rp-m3", at(4, 0), 0.4);
      MYTH(2, at(4, 0.05)); MYTH(3, at(4, 0.3)); MYTH(4, at(4, 0.6), 1.3);
