      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      /*ANIM*/

OUT("#fi-term", at(1, 0.3), 0.4);
// L2 fee fields + chainId + signature stamp
[[4, 0.05], [5, 0.1], [6, 0.15]].forEach(([k, f]) => IN(`#fi-r${k}`, at(2, f), 0.5, { x: -16 }, { x: 0 }));
IN("#fi-fbox", at(2, 0.22), 0.4);
IN("#fi-cap", at(2, 0.26), 0.4);
IN("#fi-r7", at(2, 0.45), 0.5, { x: -16 }, { x: 0 });

tl.fromTo("#fi-stamp", { scale: 1.5, svgOrigin: "470 875" }, { scale: 1, svgOrigin: "470 875", duration: 0.35, ease: "power4.in", immediateRender: false }, at(2, 0.78));

DRAW("#fi-k1", at(3, 0.62), 0.6);
DRAW("#fi-sig", at(3, 0.78), 0.8);
DRAW("#fi-k2", at(3, 0.82), 0.7);

IN("#fi-yes", at(4, 0.2), 0.5);
IN("#fi-pkw", at(4, 0.55), 0.3);
tl.fromTo("#fi-pk", { scale: 1.5, svgOrigin: "730 875" }, { scale: 1, svgOrigin: "730 875", duration: 0.3, ease: "power4.in", immediateRender: false }, at(4, 0.55));

// L5 unit ladder
tl.to("#fi-cheque", { opacity: 0, duration: 0.5 }, at(5, 0));
IN("#fi-l0", at(5, 0.1), 0.5, { y: -16 }, { y: 0 });
IN("#fi-l1", at(5, 0.45), 0.5, { y: -16 }, { y: 0 });
IN("#fi-l2", at(5, 0.6), 0.5, { y: -16 }, { y: 0 });
tl.to("#fi-l1r", { stroke: "#F0B90B", strokeWidth: 4, duration: 0.3 }, at(5, 0.82));
IN("#fi-ltag", at(5, 0.84), 0.5, { x: -12 }, { x: 0 });

      /*ENDANIM*/

      tl.to("#fi-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#fi-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
