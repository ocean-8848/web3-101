        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

const HB = (base, t) => tl.to("#rt-hb", { attr: { y: base - 31, "fill-opacity": 0.15 }, duration: 0.4, ease: "power2.inOut" }, t);

tl.to("#rt-cht", { x: 250, y: -306, opacity: 0, duration: 0.8, ease: "power2.in" }, at(6, 0.45));

      tl.to("#rt-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
