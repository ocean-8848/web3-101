  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
// bar helper: set segment [y0 bottom, h]
const SEG = (s, y, h, t, d = 0.8) => tl.to(s, { attr: { y, height: h }, duration: d, ease: "power2.out" }, t);
const SWAPV = (k, t) => { OUT(`#fe-v${k}a`, t, 0.2); IN(`#fe-v${k}b`, t + 0.25, 0.3); };
// L0 formula + term
IN("#fe-fm", at(0, 0.05), 0.8, { y: 16 }, { y: 0 });
IN("#fe-term", at(0, 0.7), 0.5);
// L1 price bar: red base (burn) + gold tip (proposer)   scale 14 px / gwei
IN("#fe-base", at(1, 0.0), 0.3);
SEG("#fe-red", 760, 140, at(1, 0.05));
IN("#fe-lr", at(1, 0.15), 0.5);
SEG("#fe-gold", 732, 28, at(1, 0.55), 0.5);
IN("#fe-lg", at(1, 0.6), 0.5);
OUT("#fe-term", at(2, 0.0), 0.4);
// L2 parameter card
IN("#fe-pc", at(2, 0.05), 0.5);
IN("#fe-p0", at(2, 0.3), 0.4, { x: -12 }, { x: 0 });
IN("#fe-p1, #fe-v1a", at(2, 0.5), 0.4, { x: -12 }, { x: 0 });
IN("#fe-p2, #fe-v2a", at(2, 0.7), 0.4, { x: -12 }, { x: 0 });
IN("#fe-p3, #fe-v3a", at(2, 0.88), 0.4, { x: -12 }, { x: 0 });
// L3 substitute
IN("#fe-c0", at(3, 0.08), 0.5, { x: -16 }, { x: 0 });
IN("#fe-c1", at(3, 0.45), 0.5, { x: -16 }, { x: 0 });
IN("#fe-c2", at(3, 0.8), 0.5, { x: -16 }, { x: 0 });
// L4 split amounts + cap box
OUT("#fe-lr, #fe-lg", at(4, 0.0), 0.3);
IN("#fe-nr", at(4, 0.08), 0.4);
IN("#fe-ng", at(4, 0.3), 0.4);
IN("#fe-cap", at(4, 0.55), 0.6);
IN("#fe-nc", at(4, 0.6), 0.4);
IN("#fe-gap", at(4, 0.82), 0.4);
// L5 balance check, node rejects
OUT("#fe-calc", at(5, 0.0), 0.35);
IN("#fe-k0", at(5, 0.08) + 0.3, 0.5);
IN("#fe-node", at(5, 0.5), 0.4);
IN("#fe-txw", at(5, 0.55), 0.3);
tl.to("#fe-tx", { x: 300, duration: 0.5, ease: "power2.in" }, at(5, 0.6));
tl.to("#fe-txr", { stroke: "#FC6255", duration: 0.15 }, at(5, 0.6) + 0.5);
tl.to("#fe-tx", { x: 40, duration: 0.6, ease: "back.out(2)" }, at(5, 0.6) + 0.52);
IN("#fe-rej", at(5, 0.6) + 0.6, 0.3);
// L6 cap binds: baseFee 40, tip 10, maxFee 45   scale 8 px / gwei
tl.to("#fe-chk", { opacity: 0, duration: 0.35 }, at(6, 0.0));
OUT("#fe-nr, #fe-ng, #fe-nc, #fe-gap, #fe-cap", at(6, 0.0), 0.35);
tl.to("#fe-p0", { opacity: 0.35, duration: 0.3 }, at(6, 0.05));
SWAPV(1, at(6, 0.1));
SWAPV(2, at(6, 0.2));
SWAPV(3, at(6, 0.3));
SEG("#fe-red", 580, 320, at(6, 0.12), 0.8);
SEG("#fe-gold", 540, 40, at(6, 0.22), 0.6);
SEG("#fe-goldh", 500, 40, at(6, 0.22), 0.6);
IN("#fe-6r", at(6, 0.2), 0.4);
IN("#fe-c6", at(6, 0.5), 0.5, { x: -16 }, { x: 0 });
IN("#fe-ceil", at(6, 0.68), 0.3, { scaleX: 0, svgOrigin: "440 540" }, { scaleX: 1, svgOrigin: "440 540" });
IN("#fe-6c", at(6, 0.7), 0.4);
tl.to("#fe-goldh", { fill: "#3a3d45", duration: 0.4 }, at(6, 0.8));
IN("#fe-6g", at(6, 0.84), 0.4);
// L7 takeaway
tl.to("#fe-main", { opacity: 0, duration: 0.5 }, at(7, 0.0));
IN("#fe-end", at(7, 0.12), 0.7, { scale: 0.85, svgOrigin: "960 540" }, { scale: 1, svgOrigin: "960 540" });

      /*ENDANIM*/

      tl.to("#fe-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#fe-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["fee"] = tl;
    })();
  </script>
