  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // ---- 生成 68 个字节格子（真实值：transfer(0x5aAeb6053F3E94C9b9A09f33669435E7Ef1BeAed, 100000000)）
      const NS = "http://www.w3.org/2000/svg";
      const mk = (tag, a, parent, txt) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; parent.appendChild(e); return e; };
      const addr = "5a ae b6 05 3f 3e 94 c9 b9 a0 9f 33 66 94 35 e7 ef 1b ea ed".split(" ");
      const Z = n => Array(n).fill("00");
      const rows = [
        { y: 300, segs: [["s", "a9 05 9c bb".split(" ")]] },
        { y: 460, segs: [["z1", Z(12)], ["ad", addr]] },
        { y: 660, segs: [["z2", Z(28)], ["am", "05 f5 e1 00".split(" ")]] },
      ];
      const gR = document.getElementById("de-rects"), gT = document.getElementById("de-texts");
      const tcol = { s: "#e8e6df", z1: "#8a8f99", ad: "#e8e6df", z2: "#8a8f99", am: "#F0B90B" };
      rows.forEach((r, ri) => {
        let i = 0;
        r.segs.forEach(([k, bytes]) => {
          bytes.forEach(b => {
            const x = 96 + i * 54;
            mk("rect", { class: `h de-r de-r${ri} de-k${k}`, x, y: r.y, width: 50, height: 56, rx: 6, fill: "#161a22", stroke: "#8a8f99", "stroke-width": 2 }, gR);
            mk("text", { class: `h mono de-t de-t${k}`, x: x + 25, y: r.y + 38, "font-size": 28, fill: tcol[k], "text-anchor": "middle" }, gT, b);
            i++;
          });
        });
      });

      // L0：Alice → USDT 合约 → 0x5aAe…
      IN("#de-alice", at(0, 0.03), 0.6, { x: -20 }, { x: 0 });
      ARROW("#de-a1", at(0, 0.2), 0.7);
      IN("#de-amt", at(0, 0.3), 0.5);
      IN("#de-usdt", at(0, 0.38), 0.6, { scale: 0.9, svgOrigin: "960 430" }, { scale: 1, svgOrigin: "960 430" });
      ARROW("#de-a2", at(0, 0.55), 0.6);
      IN("#de-rcv", at(0, 0.62), 0.6, { x: 20 }, { x: 0 });
      IN("#de-ex", at(0, 0.8), 0.5);
      // L1：100 × 10⁶ = 100,000,000 = 0x5f5e100
      IN("#de-f1", at(1, 0.05), 0.6, { y: 16 }, { y: 0 });
      IN("#de-f1s", at(1, 0.2), 0.5);
      IN("#de-f2", at(1, 0.4), 0.6, { x: -20 }, { x: 0 });
      IN("#de-f3", at(1, 0.68), 0.6, { x: -20 }, { x: 0 });
      // L2：68 字节带 + 选择器
      OUT("#de-intro", at(2, 0), 0.4);
      IN("#de-term", at(2, 0.05), 0.5);
      IN("#de-hd", at(2, 0.1), 0.5);
      IN(".de-r", at(2, 0.12), 0.3, {}, { stagger: 0.012 });
      tl.to(".de-ks", { stroke: "#58C4DD", fill: "#1d3a46", strokeWidth: 3, duration: 0.4 }, at(2, 0.3));
      IN(".de-ts", at(2, 0.3), 0.4, { y: -8 }, { y: 0, stagger: 0.1 });
      ARROW("#de-ka", at(2, 0.48), 0.5);
      IN("#de-kc", at(2, 0.5), 0.6);
      IN("#de-kc2", at(2, 0.58), 0.5);
      OUT("#de-term", at(2, 0.6), 0.4);
      IN("#de-abi", at(2, 0.8), 0.5);
      // L3：参数 1：12 个 00 + 20 字节地址
      IN("#de-l1", at(3, 0.04), 0.5);
      IN(".de-tz1", at(3, 0.3), 0.3, {}, { stagger: 0.04 });
      IN("#de-l1z", at(3, 0.38), 0.5);
      tl.to(".de-kad", { stroke: "#58C4DD", fill: "#1d3a46", duration: 0.4, stagger: 0.02 }, at(3, 0.55));
      IN(".de-tad", at(3, 0.55), 0.3, {}, { stagger: 0.03 });
      IN("#de-l1a", at(3, 0.7), 0.5);
      // L4：参数 2：28 个 00 + 05 f5 e1 00
      IN("#de-l2", at(4, 0.04), 0.5);
      IN(".de-tz2", at(4, 0.14), 0.3, {}, { stagger: 0.03 });
      IN("#de-l2z", at(4, 0.3), 0.5);
      tl.to(".de-kam", { stroke: "#F0B90B", fill: "#3a3214", duration: 0.4, stagger: 0.08 }, at(4, 0.5));
      IN(".de-tam", at(4, 0.5), 0.3, {}, { stagger: 0.08 });
      IN("#de-l2a", at(4, 0.72), 0.6, { x: 16 }, { x: 0 });
      // L5：to 是合约、value 0，收款人只在 data 里
      IN("#de-tx", at(5, 0.04), 0.6, { y: 20 }, { y: 0 });
      IN("#de-fr", at(5, 0.25), 0.6, { y: 20 }, { y: 0 });
      IN("#de-q", at(5, 0.3), 0.4, { scale: 0.6, svgOrigin: "1700 918" }, { scale: 1, svgOrigin: "1700 918" });
      IN("#de-ahl", at(5, 0.5), 0.4);
      ARROW("#de-gl", at(5, 0.56), 0.9);
      OUT("#de-q", at(5, 0.72), 0.25);
      IN("#de-ok", at(5, 0.75), 0.4, { scale: 0.6, svgOrigin: "1700 918" }, { scale: 1, svgOrigin: "1700 918" });
      tl.to("#de-fr rect", { stroke: "#83C167", duration: 0.4 }, at(5, 0.75));
      // L6：回执日志
      OUT("#de-tx, #de-fr, #de-ok, #de-gl, #de-ahl", at(6, 0), 0.4);
      IN("#de-log", at(6, 0.08), 0.6, { y: 20 }, { y: 0 });
      IN("#de-hb1", at(6, 0.25), 0.3);
      OUT("#de-hb1", at(6, 0.45), 0.3);
      IN("#de-hb2", at(6, 0.47), 0.3);
      tl.to(".de-kad", { stroke: "#83C167", duration: 0.3 }, at(6, 0.47));
      OUT("#de-hb2", at(6, 0.68), 0.3);
      tl.to(".de-kad", { stroke: "#58C4DD", duration: 0.3 }, at(6, 0.68));
      IN("#de-hb3", at(6, 0.7), 0.3);
      tl.to(".de-kam", { strokeWidth: 4, duration: 0.3 }, at(6, 0.7));

      tl.to("#de-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#de-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["decode"] = tl;
    })();
  </script>
