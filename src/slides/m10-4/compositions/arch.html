      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 zones

DRAW("#ar-zR", at(0, 0.5), 0.9);
IN("#ar-zLd", at(0, 0.05) + 0.9, 0.3); tl.to("#ar-zL", { opacity: 0, duration: 0.3 }, at(0, 0.05) + 0.9);
IN("#ar-zRd", at(0, 0.5) + 0.9, 0.3); tl.to("#ar-zR", { opacity: 0, duration: 0.3 }, at(0, 0.5) + 0.9);
IN("#ar-zLt", at(0, 0.15), 0.5);
IN("#ar-zRt", at(0, 0.6), 0.5);
// L1 sequencer executes a batch
IN("#ar-seq", at(1, 0.0), 0.5);
for (let i = 0; i < 5; i++) IN(`#ar-t${i}`, at(1, 0.15 + i * 0.07), 0.3, { x: -30 }, { x: 0 });
IN("#ar-s01", at(1, 0.75), 0.5);
// L2 state root
IN("#ar-term", at(2, 0.02), 0.5);
IN("#ar-tree", at(2, 0.2), 0.6, { y: 20 }, { y: 0 });
tl.to("#ar-leaf", { fill: "#F0B90B", duration: 0.4 }, at(2, 0.72));
tl.to("#ar-r0", { opacity: 0, duration: 0.3 }, at(2, 0.8));
tl.to("#ar-r1", { opacity: 1, duration: 0.3 }, at(2, 0.8) + 0.3);
tl.to("#ar-rootR", { stroke: "#F0B90B", duration: 0.3 }, at(2, 0.8) + 0.3);
// L3 state transition formula
OUT("#ar-term", at(3, 0.0), 0.3);
IN("#ar-term2", at(3, 0.0) + 0.35, 0.5);
OUT("#ar-s01", at(3, 0.05), 0.3);
IN("#ar-fx", at(3, 0.2), 0.6, { x: -20 }, { x: 0 });
tl.fromTo("#ar-txs", { x: 0 }, { x: 14, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, at(3, 0.55));
tl.to("#ar-fx rect", { stroke: "#F0B90B", duration: 0.4 }, at(3, 0.82));
// L4 prover
OUT("#ar-term2", at(4, 0.85), 0.4);
ARROW("#ar-a1", at(4, 0.0), 0.5);
IN("#ar-prv", at(4, 0.08), 0.5);
IN("#ar-wit", at(4, 0.3), 0.5, { x: 20 }, { x: 0 });
IN("#ar-gpu", at(4, 0.72), 0.5, { y: 15 }, { y: 0 });
// L5 two contracts on L1
OUT("#ar-tree", at(5, 0.0), 0.4);
IN("#ar-rc", at(5, 0.08), 0.5);
ARROW("#ar-cm", at(5, 0.2), 0.8);
IN("#ar-cmT", at(5, 0.25), 0.4);
IN("#ar-vc", at(5, 0.5), 0.5);
ARROW("#ar-pf", at(5, 0.6), 0.7);
IN("#ar-pfT", at(5, 0.65), 0.4);
ARROW("#ar-up", at(5, 0.85), 0.5);
// L6 validity proof + risk bar
IN("#ar-term3", at(6, 0.02), 0.5);
tl.to("#ar-vc rect", { fill: "#1d2a1b", duration: 0.5 }, at(6, 0.2));
IN("#ar-risk", at(6, 0.6), 0.7);
tl.to("#ar-term2, #ar-term3", { opacity: 0, duration: 0.3 }, C.d - 0.5);

      tl.to("#ar-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ar-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["arch"] = tl;
    })();
