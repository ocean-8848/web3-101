      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      // 代码逐行高亮
      const HLON = (top, t) => { tl.set(["#te-hlbg", "#te-hlbar"], { attr: { y: top } }, t); IN("#te-hl", t, 0.3); };
      const HL = (grp, n, i, top, t, lh = LH) => {
        tl.to(["#te-hlbg", "#te-hlbar"], { attr: { y: top + i * lh }, duration: 0.35, ease: "power2.inOut" }, t);
        for (let k = 0; k < n; k++) tl.to(`#${grp}-l${k}`, { opacity: k === i ? 1 : 0.55, duration: 0.3 }, t);
      };
      // 文字换一条：旧的先淡出，再出新的
      const SWAP = (a, b, t) => { if (a) OUT(a, t, 0.3); IN(b, t + 0.35, 0.4); };

      const LH = 40, TOP = 286;
      const GREEN = (i, t) => tl.to("#te-lp" + i, { attr: { fill: "#83C167" }, duration: 0.3 }, t);
      const REDL = (i, t) => tl.to("#te-lp" + i, { attr: { fill: "#FC6255" }, duration: 0.3 }, t);
      // L0
      IN("#te-pn", at(0, 0.02), 0.6);
      IN("#te-k", at(0, 0.08), 0.6);
      IN("#te-file", at(0, 0.12), 0.6, { y: 20 }, { y: 0 });
      tl.to("#te-sfx", { attr: { fill: "#83C167" }, duration: 0.4 }, at(0, 0.35));
      HLON(TOP, at(0, 0.6)); HL("te-k", 12, 0, TOP, at(0, 0.6));
      tl.to("#te-test", { attr: { fill: "#83C167" }, duration: 0.4 }, at(0, 0.65));
      OUT("#te-file", at(1, 0) - 0.3, 0.3);
      // L1 术语卡 + 表格
      IN("#te-term", at(1, 0.02), 0.5);
      OUT("#te-term", at(1, 0.02) + 7.5, 0.4);
      HL("te-k", 12, 2, TOP, at(1, 0.1));
      IN("#te-hd", at(1, 0.15), 0.5);
      for (let i = 0; i < 5; i++) IN(["#te-r" + i, "#te-lp" + i, "#te-w" + i], at(1, 0.25) + i * 0.25, 0.4, { x: -60 }, { x: 0 });
      ARROW("#te-loop", at(1, 0.6), 1.4);
      IN("#te-loopt", at(1, 0.7), 0.4);
      HL("te-k", 12, 10, TOP, at(1, 0.7));
      // L2 逐行
      for (let i = 0; i < 5; i++) {
        const t = at(2, 0.04 + i * 0.12);
        HL("te-k", 12, 4 + i, TOP, t);
        tl.to("#te-w" + i, { attr: { fill: "#ffffff" }, duration: 0.25, yoyo: true, repeat: 1 }, t + 0.1);
      }
      // L3 子测试
      OUT(["#te-loop", "#te-loopt"], at(3, 0) - 0.2, 0.3);
      HL("te-k", 12, 10, TOP, at(3, 0.02));
      for (let i = 0; i < 5; i++) GREEN(i, at(3, 0.04) + i * 0.3);
      SWAP("#te-w1", "#te-wbad", at(3, 0.24));
      REDL(1, at(3, 0.3));
      IN("#te-fail", at(3, 0.3), 0.4);
      OUT("#te-fail", at(3, 0.47), 0.3);
      SWAP("#te-wbad", "#te-w1", at(3, 0.47));
      GREEN(1, at(3, 0.52));
      IN(["#te-r5", "#te-lp5", "#te-w5"], at(3, 0.55), 0.5, { x: -60 }, { x: 0 });
      GREEN(5, at(3, 0.62));
      IN("#te-ftu", at(3, 0.66), 0.5);
      IN("#te-cards", at(3, 0.72), 0.5);
      IN(["#te-x1", "#te-x2"], at(3, 0.84), 0.3);
      IN("#te-clear", at(3, 0.78), 0.4);
      // L4 终端
      OUT(["#te-r0", "#te-lp0", "#te-w0","#te-r1", "#te-lp1", "#te-w1","#te-r2", "#te-lp2", "#te-w2","#te-r3", "#te-lp3", "#te-w3","#te-r4", "#te-lp4", "#te-w4","#te-r5", "#te-lp5", "#te-w5", "#te-hd", "#te-cards", "#te-x1", "#te-x2", "#te-clear"], at(4, 0) - 0.3, 0.3);
      IN("#te-term2", at(4, 0.0), 0.4);
      const TT = [0.03, 0.12, 0.24, 0.32, 0.35, 0.38, 0.5, 0.66, 0.8, 0.9];
      TT.forEach((f, i) => IN("#te-t" + i, at(4, f), 0.3, { x: -10 }, { x: 0 }));
      IN("#te-race", at(4, 0.55), 0.4); IN("#te-racet", at(4, 0.58), 0.4);
      // L5 负数
      OUT(["#te-term2", "#te-race", "#te-racet", "#te-t0","#te-t1","#te-t2","#te-t3","#te-t4","#te-t5","#te-t6","#te-t7","#te-t8","#te-t9"], at(5, 0) - 0.3, 0.3);
      IN(["#te-r0", "#te-lp0", "#te-w0","#te-r1", "#te-lp1", "#te-w1","#te-r2", "#te-lp2", "#te-w2","#te-r3", "#te-lp3", "#te-w3","#te-r4", "#te-lp4", "#te-w4","#te-r5", "#te-lp5", "#te-w5", "#te-hd"], at(5, 0.02), 0.4);
      IN(["#te-r6", "#te-lp6", "#te-w6"], at(5, 0.12), 0.5, { x: -60 }, { x: 0 });
      GREEN(6, at(5, 0.3));
      IN("#te-dep", at(5, 0.48), 0.5); IN("#te-q", at(5, 0.52), 0.4);
      SWAP("#te-w6", "#te-w6e", at(5, 0.64));
      REDL(6, at(5, 0.7));
      SWAP("#te-q", "#te-q2", at(5, 0.72));
      // L6 再加三条
      OUT(["#te-dep", "#te-q2"], at(6, 0) - 0.3, 0.3);
      for (let i = 7; i < 10; i++) IN(["#te-r" + i, "#te-lp" + i], at(6, 0.2) + (i - 7) * 0.5, 0.4, { x: -60 }, { x: 0 });
      IN(["#te-w7", "#te-w8"], at(6, 0.55), 0.4); GREEN(7, at(6, 0.6)); GREEN(8, at(6, 0.62));
      IN("#te-emp", at(6, 0.58), 0.4);
      IN("#te-w9", at(6, 0.86), 0.4); GREEN(9, at(6, 0.9));


      tl.to("#te-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#te-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["testing"] = tl;
    })();
  </script>
</template>
