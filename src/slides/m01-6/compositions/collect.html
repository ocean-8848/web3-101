  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const PF = "#co";

      const HL = (t, ids, a, b, y0, lh) => {
        const yy = y0 + (a - 1) * lh - 31, hh = (b - a + 1) * lh;
        tl.to([PF + "-hl", PF + "-bar"], { opacity: 1, attr: { y: yy, height: hh }, duration: 0.35, ease: "power2.inOut" }, t);
        ids.forEach((id, i) => { const n = i + 1; tl.to("#" + id, { opacity: (n >= a && n <= b) ? 1 : 0.55, duration: 0.35 }, t); });
      };
      const HLOFF = (t) => tl.to([PF + "-hl", PF + "-bar"], { opacity: 0, duration: 0.3 }, t);
      const LIDS = (p, n) => Array.from({ length: n }, (_, i) => p + (i + 1));
      const POP = (s, t, o) => { tl.fromTo(s, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.5, ease: "back.out(2)" }, t); };
      const COL = (s, t, attr, d = 0.4) => tl.to(s, { attr: attr, duration: d, ease: "power2.out" }, t);

      const AI = LIDS("co-ca", 12), BI = LIDS("co-cb", 5);
      // L0 接口
      IN("#co-p", at(0, 0.02));
      AI.forEach((id, i) => IN("#" + id, at(0, 0.05) + i * 0.06, 0.35));
      HL(at(0, 0.15), AI, 1, 3, 320, 42);
      IN("#co-skt", at(0, 0.3)); IN("#co-sk", at(0, 0.35), 0.6); IN("#co-skn", at(0, 0.6), 0.5);
      // L1 隐式实现：插头吻合
      HL(at(1, 0.02), AI, 5, 12, 320, 42);
      OUT("#co-skn", at(1, 0.12), 0.3);
      IN("#co-pl", at(1, 0.18), 0.9, { x: 140 }, { x: 0, ease: "power3.out" });
      COL(["#co-skp", "#co-plp"], at(1, 0.38), { stroke: "#83C167" }, 0.3);
      IN("#co-ok", at(1, 0.46), 0.5, { y: 10 }, { y: 0 });
      IN("#co-impl", at(1, 0.66), 0.4); ARROW("#co-implx", at(1, 0.78), 0.4);
      // L2 指针接收者：计数
      HL(at(2, 0.02), AI, 9, 9, 320, 42);
      IN("#co-cap1", at(2, 0.05), 0.4);
      COL(["#co-skp", "#co-plp"], at(2, 0.0), { stroke: "#58C4DD" }, 0.4);
      [1, 2].forEach((k, i) => {
        const t = at(2, 0.22 + i * 0.36);
        tl.fromTo("#co-env" + k, { opacity: 0, x: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25 }, t);
        tl.to("#co-env" + k, { x: 200, y: -40, opacity: 0, duration: 0.7, ease: "power1.in" }, t + 0.3);
        COUNT("#co-cnt", k - 1, k, t, 0.3, v => "sent: " + Math.round(v));
      });
      // L3 接口要小，换假实现
      OUT("#co-cap1", at(3, 0.0)); OUT("#co-ok", at(3, 0.0)); OUT("#co-impl", at(3, 0.0)); OUT("#co-implx", at(3, 0.0));
      HL(at(3, 0.02), AI, 1, 3, 320, 42);
      IN("#co-small", at(3, 0.08), 0.5);
      IN("#co-bw", at(3, 0.18), 0.4); IN("#co-biz", at(3, 0.2));
      tl.to("#co-pl", { x: 160, opacity: 0, duration: 0.6, ease: "power2.in" }, at(3, 0.42));
      IN("#co-fk", at(3, 0.42) + 0.6, 0.7, { x: 140 }, { x: 0 });
      IN("#co-same", at(3, 0.74), 0.5);
      // L4 切片与 append
      ["#co-skt", "#co-sk", "#co-fk", "#co-bw", "#co-biz", "#co-same", "#co-small"].forEach(s => OUT(s, at(4, 0.0)));
      AI.forEach(id => OUT("#" + id, at(4, 0.0), 0.3)); HLOFF(at(4, 0.0));
      tl.to("#co-pbox", { attr: { height: 290 }, duration: 0.6, ease: "power2.inOut" }, at(4, 0.03));
      BI.forEach((id, i) => IN("#" + id, at(4, 0.06) + i * 0.08, 0.35));
      HL(at(4, 0.1), BI, 1, 1, 320, 42);
