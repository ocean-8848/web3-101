        <text x="100" y="160" font-size="28" fill="#e8e6df">Go 运行时调度的轻量级线程</text></g>
        <g id="go-term-b" class="h"><text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">通道 <tspan font-size="28" font-weight="400" fill="#8a8f99">Channel</tspan></text>

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const MOVE = (s, t, x, y, d = 0.7, e = "power2.inOut") => tl.to(s, { x, y, duration: d, ease: e }, t);
      const COL = (s, t, props, d = 0.4) => tl.to(s, { ...props, duration: d }, t);
      const SPIN = (s, ox, oy, t, d, turns = 2) => tl.to(s, { rotation: 360 * turns, svgOrigin: ox + " " + oy, duration: d, ease: "none" }, t);

      const HL = (ids, t) => { for (let i = 1; i <= 12; i++) { const on = ids.includes(i);
        tl.to("#go-hl" + i, { opacity: on ? 1 : 0, duration: 0.3 }, t);
        tl.to("#go-l" + i, { opacity: ids.length ? (on ? 1 : 0.55) : 1, duration: 0.3 }, t); } };

      // L0
      IN("#go-code", at(0, 0.0), 0.6);
      IN("#go-title", at(0, 0.3), 0.6, { y: 12 }, { y: 0 });
      // L1 goroutine
      OUT("#go-title", at(1, 0.0), 0.3);
      IN("#go-term", at(1, 0.03), 0.5);
      IN("#go-main", at(1, 0.06), 0.5);
      const SW = [[1091,404],[1160,409],[1247,401],[1321,413],[1380,404],[1456,410],[1542,411],[1598,400],[1680,410],[1757,403],[1080,463],[1157,468],[1239,462],[1321,463],[1392,462],[1458,461],[1540,457],[1614,466],[1684,457],[1752,468],[1092,517],[1154,524],[1230,518],[1310,515],[1379,513],[1455,523],[1528,520],[1610,524],[1684,516],[1746,519],[1085,581],[1163,577],[1239,574],[1312,573],[1390,569],[1455,578],[1539,568],[1609,575],[1677,578],[1764,579]];
      SW.forEach(([fx, fy], i) => {
        tl.fromTo("#go-s" + i, { opacity: 0, attr: { x: 1157, y: 267 } }, { opacity: 1, attr: { x: fx, y: fy }, duration: 0.6, ease: "power2.out" }, at(1, 0.15) + i * 0.02);
        tl.to("#go-s" + i, { opacity: 0, attr: { x: 1107, y: 447 }, duration: 0.5, ease: "power2.in" }, at(1, 0.62) + i * 0.01);
      });

      IN("#go-cheap", at(1, 0.3), 0.5);
      OUT("#go-cheap", at(1, 0.6), 0.3);
      OUT("#go-term", at(1, 0.85), 0.4);
      IN("#go-w0", at(1, 0.72), 0.4);
      IN("#go-gof", at(1, 0.76), 0.4);
      HL([5], at(1, 0.74));
      SPIN("#go-w0-g", 1160, 420, at(1, 0.76), 7, 4);
      // L2 channel
      tl.set("#go-term-a", { opacity: 0 }, at(2, 0.0));
      tl.set("#go-term-b", { opacity: 1 }, at(2, 0.0));
      IN("#go-term", at(2, 0.02), 0.4);
      HL([1], at(2, 0.1));
      IN("#go-pipe0", at(2, 0.15), 0.5);
      IN("#go-w9", at(2, 0.2), 0.4);
      IN("#go-pk0", at(2, 0.35), 0.2);
      tl.to("#go-pk0", { attr: { x: 1664 }, duration: 1.2, ease: "power1.inOut" }, at(2, 0.4));
      tl.to("#go-pk0", { opacity: 0, duration: 0.2 }, at(2, 0.4) + 1.15);
      tl.to("#go-w9-r", { fillOpacity: 0.4, duration: 0.2, yoyo: true, repeat: 1 }, at(2, 0.4) + 1.15);
      // L3 五个 goroutine + 缓冲 5
      OUT(["#go-w0", "#go-w9", "#go-pipe0", "#go-gof"], at(3, 0.0), 0.4);
      OUT("#go-term", at(3, 0.3), 0.4);
      HL([1, 3, 5], at(3, 0.05));
      IN("#go-n1", at(3, 0.08), 0.4);
      for (let k = 0; k < 5; k++) {
        IN("#go-k" + k, at(3, 0.15 + 0.08 * k), 0.4, { y: -30 }, { y: 0 });
        SPIN("#go-k" + k + "-g", 1160 + 150 * k, 420, at(3, 0.15 + 0.08 * k), 18, 6);
      }
      IN("#go-slots", at(3, 0.6), 0.5);
      IN("#go-buf", at(3, 0.66), 0.4);
      // L4 WaitGroup
      OUT("#go-n1", at(4, 0.0), 0.3);
      HL([2, 4, 6, 10], at(4, 0.02));
      IN("#go-n2", at(4, 0.08), 0.4);
      IN("#go-wg", at(4, 0.04), 0.4);
      COUNT("#go-wgn", 0, 5, at(4, 0.1), 0.9);
      IN("#go-hg", at(4, 0.3), 0.4);
      [0, 1, 3, 4].forEach((k, j) => {
        const t = at(4, 0.45 + 0.12 * j);
        OUT("#go-k" + k + "-g", t, 0.2);
        tl.to("#go-k" + k + "-r", { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        DRAW("#go-c" + k, t + 0.1, 0.3);
        COUNT("#go-wgn", 5 - j, 4 - j, t + 0.1, 0.3);
      });
      // L5 defer
      OUT("#go-n2", at(5, 0.0), 0.3);
      HL([6], at(5, 0.02));
      tl.to("#go-k2-r", { stroke: "#FC6255", fill: "#FC6255", duration: 0.15, yoyo: true, repeat: 3 }, at(5, 0.15));
      IN("#go-def", at(5, 0.35), 0.4, { y: 20 }, { y: 0 });
      OUT("#go-k2-g", at(5, 0.5), 0.2);
      COUNT("#go-wgn", 1, 0, at(5, 0.55), 0.3);
      tl.to("#go-k2-r", { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, at(5, 0.6));
      DRAW("#go-c2", at(5, 0.62), 0.3);
      OUT("#go-hg", at(5, 0.7), 0.4);
      OUT("#go-def", at(5, 0.9), 0.3);
      // L6 close + range
      HL([7, 11, 12], at(6, 0.0));
      IN("#go-n3", at(6, 0.05), 0.4);
      for (let k = 0; k < 5; k++) IN("#go-p" + k, at(6, 0.04 + 0.05 * k), 0.4, { y: -180 }, { y: 0 });
      OUT("#go-buf", at(6, 0.3), 0.3);
      IN("#go-cap", at(6, 0.34), 0.4);
      IN("#go-h1", at(6, 0.42), 0.3);
      for (let k = 0; k < 5; k++) { OUT("#go-p" + k, at(6, 0.45 + 0.04 * k), 0.25); IN("#go-o" + k, at(6, 0.46 + 0.04 * k), 0.3, { x: -20 }, { x: 0 }); }
      IN("#go-h2", at(6, 0.7), 0.3);
      for (let k = 0; k < 5; k++) IN("#go-q" + k, at(6, 0.72 + 0.03 * k), 0.3, { x: -20 }, { x: 0 });
      IN("#go-ord", at(6, 0.88), 0.4);
      // L7 泄漏
      OUT("#go-stage", at(7, 0.0), 0.4);
      OUT("#go-n3", at(7, 0.0), 0.3);
      HL([], at(7, 0.0));
      IN("#go-nb", at(7, 0.05), 0.4);
      IN("#go-lw", at(7, 0.08), 0.4);
      IN("#go-lp", at(7, 0.12), 0.4);
      IN("#go-rcv", at(7, 0.18), 0.4);
      IN("#go-lpk", at(7, 0.25), 0.3);
      tl.to("#go-lpk", { attr: { x: 1220 }, duration: 0.3, yoyo: true, repeat: 5 }, at(7, 0.3));
      tl.to("#go-lwr", { stroke: "#FC6255", fill: "#FC6255", duration: 0.4 }, at(7, 0.5));
      tl.to("#go-lpk", { fill: "#FC6255", duration: 0.4 }, at(7, 0.5));
      IN("#go-chain", at(7, 0.55), 0.4);
      IN("#go-clk", at(7, 0.6), 0.4);
      SPIN("#go-hand", 1150, 760, at(7, 0.6), 4.5, 6);
      IN("#go-leak", at(7, 0.72), 0.5);


      tl.to("#go-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["gorout"] = tl;
    })();
  </script>
