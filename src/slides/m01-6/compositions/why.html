    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const PF = "#wh";

      const HL = (t, ids, a, b, y0, lh) => {
        const yy = y0 + (a - 1) * lh - 31, hh = (b - a + 1) * lh;
        tl.to([PF + "-hl", PF + "-bar"], { opacity: 1, attr: { y: yy, height: hh }, duration: 0.35, ease: "power2.inOut" }, t);
        ids.forEach((id, i) => { const n = i + 1; tl.to("#" + id, { opacity: (n >= a && n <= b) ? 1 : 0.55, duration: 0.35 }, t); });
      };
      const HLOFF = (t) => tl.to([PF + "-hl", PF + "-bar"], { opacity: 0, duration: 0.3 }, t);
      const LIDS = (p, n) => Array.from({ length: n }, (_, i) => p + (i + 1));
      const POP = (s, t, o) => { tl.fromTo(s, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, svgOrigin: o, duration: 0.5, ease: "back.out(2)" }, t); };
      const COL = (s, t, attr, d = 0.4) => tl.to(s, { attr: attr, duration: d, ease: "power2.out" }, t);

      // L0 四块拼图
      IN("#wh-go", at(0, 0.08), 0.6, { y: -12 }, { y: 0 });
      IN("#wh-pz0", at(0, 0.3), 0.6, { x: -200 }, { x: 0 });
      IN("#wh-pz1", at(0, 0.47), 0.6, { y: -200 }, { y: 0 });
      IN("#wh-pz2", at(0, 0.64), 0.6, { y: 200 }, { y: 0 });
      IN("#wh-pz3", at(0, 0.8), 0.6, { x: 200 }, { x: 0 });
      tl.to("#wh-frame", { opacity: 1, duration: 0.01 }, at(0, 0.93)); DRAW("#wh-frame", at(0, 0.93), 0.7);
      // L1 缩到左边，右边 Geth 占比环
      tl.to("#wh-blks", { scale: 0.7, svgOrigin: "960 470", duration: 0.9, ease: "power2.inOut" }, at(1, 0.0));
      tl.to("#wh-blk", { x: -330, duration: 0.9, ease: "power2.inOut" }, at(1, 0.0));
      IN("#wh-ring", at(1, 0.15)); DRAW("#wh-arc", at(1, 0.2), 1.2);
      IN("#wh-rc", at(1, 0.45), 0.5, { y: 10 }, { y: 0 });
      ARROW("#wh-lk", at(1, 0.66), 0.6);
      tl.to("#wh-frame", { attr: { "stroke-width": 7 }, duration: 0.3, yoyo: true, repeat: 1 }, at(1, 0.7));
      // L2 编译型语言
      OUT("#wh-blk", at(2, 0.0)); OUT("#wh-ring", at(2, 0.0)); OUT("#wh-lk", at(2, 0.0)); OUT("#wh-rc", at(2, 0.0));
      IN("#wh-term", at(2, 0.02), 0.5);
      IN("#wh-gof", at(2, 0.1));
      ARROW("#wh-a1", at(2, 0.22)); IN("#wh-gearg", at(2, 0.24));
      tl.fromTo("#wh-gear", { rotation: 0 }, { rotation: 180, svgOrigin: "740 490", duration: 2.2, ease: "power1.inOut" }, at(2, 0.24));
      ARROW("#wh-a2", at(2, 0.42)); IN("#wh-bin", at(2, 0.46), 0.6, { x: -20 }, { x: 0 });
      IN("#wh-srv", at(2, 0.62)); ARROW("#wh-a3", at(2, 0.7)); IN("#wh-sapp", at(2, 0.74), 0.5, { x: -30 }, { x: 0 });
      ARROW("#wh-x", at(2, 0.86), 0.5);
      OUT("#wh-term", at(2, 0.97), 0.4);
      // L3 瑞士军刀 vs 工具箱
      ["#wh-gof", "#wh-a1", "#wh-gearg", "#wh-a2", "#wh-bin", "#wh-a3", "#wh-srv", "#wh-x", "#wh-sapp"].forEach(s => OUT(s, at(3, 0.0)));
