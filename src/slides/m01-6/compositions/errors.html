  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const MOVE = (s, t, x, y, d = 0.7, e = "power2.inOut") => tl.to(s, { x, y, duration: d, ease: e }, t);
      const COL = (s, t, props, d = 0.4) => tl.to(s, { ...props, duration: d }, t);
      const SPIN = (s, ox, oy, t, d, turns = 2) => tl.to(s, { rotation: 360 * turns, svgOrigin: ox + " " + oy, duration: d, ease: "none" }, t);

      const HL = (ids, t) => { for (let i = 1; i <= 12; i++) { const on = ids.includes(i);
        tl.to("#er-hl" + i, { opacity: on ? 1 : 0, duration: 0.3 }, t);
        tl.to("#er-l" + i, { opacity: ids.length ? (on ? 1 : 0.55) : 1, duration: 0.3 }, t); } };

      // L0 返回值：数据 + error
      IN("#er-code", at(0, 0.0), 0.6);
      HL([3], at(0, 0.25));
      IN("#er-fn", at(0, 0.2), 0.5);
      DRAW("#er-f1", at(0, 0.38), 0.4); DRAW("#er-f2", at(0, 0.4), 0.4);
      IN("#er-b1", at(0, 0.5), 0.4, { y: -40 }, { y: 0 });
      IN("#er-b2", at(0, 0.58), 0.4, { y: -40 }, { y: 0 });
      IN("#er-thr", at(0, 0.8), 0.4);
      // L1 调用栈 + 闸门
      OUT("#er-g0", at(1, 0.0), 0.3);
      HL([5, 6], at(1, 0.05));
      IN("#er-stk", at(1, 0.1), 0.5);
      IN("#er-gates", at(1, 0.3), 0.4);
      IN("#er-gl", at(1, 0.35), 0.4);
