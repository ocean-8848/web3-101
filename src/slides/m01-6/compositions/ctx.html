  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const MOVE = (s, t, x, y, d = 0.7, e = "power2.inOut") => tl.to(s, { x, y, duration: d, ease: e }, t);
      const COL = (s, t, props, d = 0.4) => tl.to(s, { ...props, duration: d }, t);
      const SPIN = (s, ox, oy, t, d, turns = 2) => tl.to(s, { rotation: 360 * turns, svgOrigin: ox + " " + oy, duration: d, ease: "none" }, t);

      const HL = (ids, t) => { for (let i = 1; i <= 11; i++) { const on = ids.includes(i);
        tl.to("#ct-hl" + i, { opacity: on ? 1 : 0, duration: 0.3 }, t);
        tl.to("#ct-l" + i, { opacity: ids.length ? (on ? 1 : 0.55) : 1, duration: 0.3 }, t); } };

      // L0 被锁住的工人 + 出口门
      IN("#ct-code", at(0, 0.0), 0.6);
      IN("#ct-door", at(0, 0.25), 0.5);
      OUT("#ct-chain", at(0, 0.6), 0.3);
      tl.to("#ct-wkr", { stroke: "#58C4DD", fill: "#58C4DD", duration: 0.3 }, at(0, 0.6));
      MOVE("#ct-wk", at(0, 0.7), 300, -20, 0.8);
      OUT("#ct-wk", at(0, 0.85), 0.3);
      // L1 select
      OUT("#ct-g0", at(1, 0.0), 0.3);
      HL([3, 4, 5, 6], at(1, 0.02));
      DRAW("#ct-pu", at(1, 0.05), 0.5); DRAW("#ct-pd", at(1, 0.05), 0.5);
      IN("#ct-l1a", at(1, 0.1), 0.3); IN("#ct-l1b", at(1, 0.1), 0.3);
      IN("#ct-sel", at(1, 0.12), 0.4);
      IN("#ct-pkb", at(1, 0.25), 0.2); IN("#ct-pko", at(1, 0.25), 0.2);
      tl.to("#ct-pkb", { keyframes: [{ attr: { cx: 1300, cy: 420 }, duration: 0.6 }, { attr: { cx: 1480, cy: 540 }, duration: 0.5 }], ease: "none" }, at(1, 0.3));
      tl.to("#ct-pko", { keyframes: [{ attr: { cx: 1260, cy: 720 }, duration: 1.1 }], ease: "none" }, at(1, 0.3));
      DRAW("#ct-puL", at(1, 0.6), 0.4);
      ARROW("#ct-out", at(1, 0.7), 0.4);
      OUT("#ct-pko", at(1, 0.65), 0.3);
      // L2 context 树
      OUT("#ct-g1", at(2, 0.0), 0.3);
      HL([], at(2, 0.0));
      IN("#ct-term", at(2, 0.02), 0.5);
      for (let i = 0; i < 6; i++) IN("#ct-n" + i, at(2, 0.1 + 0.06 * i), 0.4);
      for (let i = 0; i < 5; i++) DRAW("#ct-e" + i, at(2, 0.45 + 0.08 * i), 0.5);
