      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      // L0：存款人、借款人 → 资金池

      ARROW("#ld-a1", at(0, 0.6), 0.6);
      ARROW("#ld-a2", at(0, 0.75), 0.6);

      tl.to("#ld-eth", { x: 0, y: 0, duration: 1.0, ease: "power2.inOut" }, at(1, 0.1));
      ARROW("#ld-a3", at(1, 0.42), 0.5);
      IN("#ld-usdc", at(1, 0.5), 0.3, { x: 420, y: -210 }, { x: 420, y: -210 });

      IN("#ld-ltv", at(1, 0.78), 0.5);
      IN("#ld-rate", at(1, 0.88), 0.5);

      // L2：术语卡 + 预言机 → HF

      IN("#ld-orc, #ld-orcv", at(2, 0.1), 0.5, { y: -16 }, { y: 0 });
      ARROW("#ld-a5", at(2, 0.3), 0.5);
      POP("#ld-hf", at(2, 0.4));
      ARROW("#ld-a4", at(2, 0.55), 0.5);
      tl.fromTo("#ld-orcv", { fill: "#e8e6df" }, { fill: "#58C4DD", duration: 0.3, yoyo: true, repeat: 1, immediateRender: false }, at(2, 0.6));
      tl.to("#ld-hf polygon", { strokeWidth: 5, duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.85));
      OUT("#ld-term", at(3, 0.05), 0.4);

      // L3：两路 + 清算 + 小插图
      ARROW("#ld-ag", at(3, 0.02), 0.5); IN("#ld-safe", at(3, 0.08), 0.4);
      ARROW("#ld-ar", at(3, 0.14), 0.6); IN("#ld-bad", at(3, 0.18), 0.4);
      POP("#ld-liq", at(3, 0.26));
      ARROW("#ld-aret", at(3, 0.4), 0.9);
      IN("#ld-bonus", at(3, 0.62), 0.5);
      IN("#ld-ins, #ld-liqp", at(3, 0.72), 0.4);
      COUNT("#ld-insv", 5000, 7500, at(3, 0.78), 1.2, v => Math.round(v).toLocaleString("en-US"));
      tl.to("#ld-liqp", { y: -64, duration: 1.2, ease: "power2.out" }, at(3, 0.78));

      // L4：2020-03 清算失灵
      OUT("#ld-ins, #ld-liqp, #ld-ag, #ld-safe, #ld-ltv", at(4, 0.0), 0.4);
      IN("#ld-day", at(4, 0.05), 0.5);
      ARROW("#ld-px", at(4, 0.12), 2.0);
      IN("#ld-gas", at(4, 0.35), 0.4);
      tl.fromTo("#ld-gasf", { opacity: 1, attr: { y: 850, height: 0 } }, { opacity: 1, attr: { y: 698, height: 152 }, duration: 1.2, ease: "power2.in", immediateRender: false }, at(4, 0.38));

      tl.to("#ld-liqt", { fill: "#6b6f7a", duration: 0.4 }, at(4, 0.55));
      tl.to("#ld-aret", { opacity: 0.0, duration: 0.4 }, at(4, 0.55));
      OUT("#ld-bonus", at(4, 0.55), 0.4);
      IN("#ld-x", at(4, 0.6), 0.3, { scale: 0.4, svgOrigin: "1560 796" }, { scale: 1, svgOrigin: "1560 796" });
      IN("#ld-gap", at(4, 0.74), 0.5);
      IN("#ld-gapt", at(4, 0.8), 0.5, { y: -10 }, { y: 0 });

      // L5：预言机被操纵
      OUT("#ld-day, #ld-px, #ld-gas, #ld-gasf, #ld-x, #ld-gap, #ld-gapt", at(5, 0.0), 0.4);
      IN("#ld-bolt", at(5, 0.1), 0.15);
      IN("#ld-boltt", at(5, 0.14), 0.4);
      tl.to("#ld-orc rect", { stroke: "#FC6255", duration: 0.2 }, at(5, 0.16));

      tl.to("#ld-over", { x: 0, y: 0, duration: 1.0, ease: "power2.inOut" }, at(5, 0.55));
      IN("#ld-bzx", at(5, 0.72), 0.5);

      // L6：传染链
      OUT("#ld-main", at(6, 0.0), 0.5);
      POP("#ld-c0", at(6, 0.12));
      ARROW("#ld-c01", at(6, 0.35), 0.5);
      POP("#ld-c1", at(6, 0.45));
      ARROW("#ld-c12", at(6, 0.66), 0.5);
      POP("#ld-c2", at(6, 0.76));

      tl.to("#ld-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ld-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["lend"] = tl;
