  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 部署交易：to 为空
      IN("#de-lanes", at(0, 0.02), 0.6);
      IN("#de-term", at(0, 0.12), 0.5);
      IN("#de-tx", at(0, 0.3), 0.6, { x: -30 }, { x: 0 });
      ARROW("#de-a0", at(0, 0.75), 0.5);
      // L1 算地址 → 空账户 → ETH → 执行创建代码 → 写初始状态
      IN("#de-nonce", at(1, 0.0), 0.4);
      IN("#de-sa", at(1, 0.04), 0.5, { y: -10 }, { y: 0 });
      IN("#de-boxd", at(1, 0.22), 0.5);
      IN("#de-coin", at(1, 0.32), 0.2);
      tl.fromTo("#de-coin", { x: -880, y: 15 }, { x: 0, y: 0, duration: 0.9, ease: "power2.inOut", immediateRender: false }, at(1, 0.32));
      IN("#de-ccb", at(1, 0.5), 0.5, { scale: 0.9, svgOrigin: "960 455" }, { scale: 1, svgOrigin: "960 455" });
      IN("#de-gear", at(1, 0.55), 0.4);
      tl.fromTo("#de-gear", { rotation: 0 }, { rotation: 360, svgOrigin: "1100 470", duration: 3.2, ease: "none", immediateRender: false }, at(1, 0.58));
      OUT("#de-term", at(1, 0.68), 0.4);
      IN("#de-s0", at(1, 0.78), 0.4, { scale: 0.6, svgOrigin: "1555 416" }, { scale: 1, svgOrigin: "1555 416" });
      IN("#de-s1", at(1, 0.86), 0.4, { scale: 0.6, svgOrigin: "1735 416" }, { scale: 1, svgOrigin: "1735 416" });
      // L2 返回运行时代码，存到新地址，按字节收费
      IN("#de-term2", at(2, 0.02), 0.5);
      IN("#de-rtm", at(2, 0.1), 0.2);
      tl.fromTo("#de-rtm", { x: -680, y: 70 }, { x: 0, y: 0, duration: 1.2, ease: "power2.inOut", immediateRender: false }, at(2, 0.1));
      tl.fromTo("#de-rtmi", { scale: 0.6, svgOrigin: "1640 521" }, { scale: 1, svgOrigin: "1640 521", duration: 1.2, ease: "power2.inOut", immediateRender: false }, at(2, 0.1));
      IN("#de-boxs", at(2, 0.33), 0.4); OUT("#de-boxd", at(2, 0.33), 0.4);
      IN("#de-fee", at(2, 0.4), 0.5, { y: -10 }, { y: 0 });
      ARROW("#de-k0", at(2, 0.66), 0.4); ARROW("#de-k1", at(2, 0.71), 0.4); ARROW("#de-k2", at(2, 0.76), 0.4);
      IN("#de-kl", at(2, 0.72), 0.4);
      tl.to("#de-rtmi rect", { attr: { "stroke-width": 5 }, duration: 0.25, yoyo: true, repeat: 1 }, at(2, 0.8));
      OUT("#de-term2", at(2, 0.97), 0.4);
      // L3 构造函数只跑一次；immutable 嵌进运行时代码
      OUT("#de-k0, #de-k1, #de-k2, #de-kl, #de-fee", at(3, 0), 0.4);
      OUT("#de-ccb, #de-gear", at(3, 0.06), 0.5);
      for (let i = 0; i < 10; i++) {
        IN(`#de-dt${i}`, at(3, 0.06), 0.1);
        tl.to(`#de-dt${i}`, { x: (i - 4.5) * 14, y: 60 + (i % 3) * 30, opacity: 0, duration: 1.4, ease: "power2.out" }, at(3, 0.08));
      }
      IN("#de-once", at(3, 0.18), 0.5);
      IN("#de-imm", at(3, 0.52), 0.5, { y: -40 }, { y: 0 });
      IN("#de-sl", at(3, 0.66), 0.5);
      // L4 大小上限
      OUT("#de-once", at(4, 0), 0.4);
      IN("#de-bl1", at(4, 0.05), 0.4);
      tl.to("#de-bf1", { opacity: 1, attr: { width: 550 }, duration: 0.9, ease: "power2.out" }, at(4, 0.1));
      IN("#de-bl2", at(4, 0.35), 0.4);
      tl.to("#de-bf2", { opacity: 1, attr: { width: 1100 }, duration: 0.9, ease: "power2.out" }, at(4, 0.4));
      tl.to("#de-bf1", { attr: { width: 800 }, fill: "#FC6255", duration: 0.8, ease: "power2.in" }, at(4, 0.7));
      IN("#de-fail", at(4, 0.8), 0.4, { x: -10 }, { x: 0 });
      // L5 构造函数 revert：无代码，但 nonce +1
      OUT("#de-bars, #de-sl", at(5, 0), 0.4);
      IN("#de-rv", at(5, 0.04), 0.3);
      tl.to("#de-rvr", { fill: "#FC625555", duration: 0.2, yoyo: true, repeat: 3 }, at(5, 0.08));
      OUT("#de-box", at(5, 0.3), 0.5);
      OUT("#de-boxs", at(5, 0.3), 0.5); tl.to("#de-boxd", { opacity: 1, duration: 0.5 }, at(5, 0.3));
      IN("#de-nocode", at(5, 0.4), 0.5);
      tl.to("#de-nv", { fill: "#FF9F43", duration: 0.2 }, at(5, 0.6));
      COUNT("#de-nv", 5, 6, at(5, 0.62), 0.3);
      IN("#de-p1", at(5, 0.62), 0.3, { y: 8 }, { y: 0 });
      tl.to("#de-nonce rect", { stroke: "#FF9F43", duration: 0.2 }, at(5, 0.6));
      tl.to("#de-term2", { opacity: 0, duration: 0.3 }, C.d - 0.5);

      tl.to("#de-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#de-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["deploy"] = tl;
    })();
  </script>
