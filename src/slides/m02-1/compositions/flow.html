      IN("#fl-tank", at(0, 0.72), 0.6);
      // L1 节点校验
      ARROW("#fl-a12", at(1, 0.02), 0.3);
      IN("#fl-n2", at(1, 0.05), 0.5, { scale: 0.8, svgOrigin: "960 392" }, { scale: 1, svgOrigin: "960 392" });

        IN(`#fl-lt${i}`, at(1, 0.12 + i * 0.1), 0.3);
        tl.to(`#fl-lc${i}`, { fill: "#83C167", duration: 0.2 }, at(1, 0.16 + i * 0.1));
      });
      tl.to("#fl-lc2", { fill: "#FC6255", duration: 0.2 }, at(1, 0.6));
      ARROW("#fl-rj", at(1, 0.64), 0.3);
      IN("#fl-rjt", at(1, 0.67), 0.4, { x: -10 }, { x: 0 });

      tl.to("#fl-lc2", { fill: "#83C167", duration: 0.2 }, at(2, 0.01));

      IN("#fl-n3", at(2, 0.05), 0.4);
      IN("#fl-gold", at(2, 0.06), 0.1); GOLD(300, at(2, 0.06), 1.0); IN("#fl-gl", at(2, 0.12), 0.4);
      tl.to("#fl-n3r", { attr: { "stroke-width": 5 }, duration: 0.25, yoyo: true, repeat: 1 }, at(2, 0.2));
      IN("#fl-used", at(2, 0.3), 0.1); USED(80, at(2, 0.3), 0.6); GOLD(380, at(2, 0.3), 0.6);
      IN("#fl-u1, #fl-u2", at(2, 0.34), 0.4);
      ARROW("#fl-a34", at(2, 0.5), 0.3);
      IN("#fl-n4", at(2, 0.53), 0.4);
