  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;

      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
// L0 chain, contract rises, three labels
IN("#co-term", at(0, 0.02), 0.5);
IN("#co-chain", at(0, 0.02), 0.6);
IN("#co-ct", at(0, 0.12), 0.9, { y: 560 }, { y: 0, ease: "power3.out" });
tl.fromTo("#co-hex", { opacity: 0 }, { opacity: 1, duration: 0.6, immediateRender: false }, at(0, 0.3));
IN("#co-l1", at(0, 0.55), 0.5, { x: -20 }, { x: 0 });
IN("#co-l2", at(0, 0.7), 0.5, { x: -20 }, { x: 0 });
IN("#co-l3", at(0, 0.84), 0.5, { x: -20 }, { x: 0 });
OUT("#co-term", at(1, 0.6), 0.4);
// L1 EOA sends tx, 8 nodes execute, new block
IN("#co-eoa", at(1, 0), 0.5);
ARROW("#co-tx", at(1, 0.08), 0.6); IN("#co-txl", at(1, 0.12), 0.4);
for (let i = 0; i < 8; i++) {
  DRAW("#co-fan" + i, at(1, 0.25), 0.5); tl.set("#co-fan" + i, { opacity: 0.6 }, at(1, 0.25));
  IN("#co-nd" + i, at(1, 0.3) + i * 0.04, 0.35);
  COUNT("#co-ndv" + i, 1, 9, at(1, 0.4), 1.8, v => Math.max(1, Math.round(v)));
  tl.to("#co-ndr" + i, { stroke: "#83C167", duration: 0.25 }, at(1, 0.68));
  ARROW("#co-cv" + i, at(1, 0.76), 0.5); tl.set("#co-cv" + i, { opacity: 0.7 }, at(1, 0.77));
}
IN("#co-nl, #co-nb", at(1, 0.84), 0.4, { scale: 0.7, svgOrigin: "1375 935" }, { scale: 1, svgOrigin: "1375 935" });
// L2 public calculator
OUT("#co-s1", at(2, 0), 0.5);
IN("#co-term2", at(2, 0.04), 0.5);
IN("#co-calc", at(2, 0.05), 0.8, { scale: 0.9, svgOrigin: "960 580" }, { scale: 1, svgOrigin: "960 580" });
IN("#co-hA", at(2, 0.3), 0.4); IN("#co-hB", at(2, 0.34), 0.4); IN("#co-hC", at(2, 0.38), 0.4);
const PRESS = (h, dx, dy, key, t) => {
  tl.to("#co-h" + h, { x: dx, y: dy, duration: 0.15, ease: "power2.in" }, t);
  tl.to("#co-h" + h, { x: 0, y: 0, duration: 0.25, ease: "power2.out" }, t + 0.15);
  tl.to("#co-k" + key, { fill: "#58C4DD", duration: 0.12 }, t + 0.12);
  tl.to("#co-k" + key, { fill: "#2a2f3a", duration: 0.4 }, t + 0.3);
};
PRESS("A", 14, 0, 4, at(2, 0.44)); PRESS("B", -14, 0, 7, at(2, 0.52)); PRESS("C", 0, -14, 9, at(2, 0.6));
IN("#co-gas", at(2, 0.74), 0.5);
[["A", 14, 0, 0], ["B", -14, 0, 11], ["C", 0, -14, 8]].forEach(([h, dx, dy, k], c) => {
  const t = at(2, 0.78) + c * 0.75;
  PRESS(h, dx, dy, k, t);
  tl.fromTo("#co-coin" + c, { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.15 }, t + 0.1);
  tl.to("#co-coin" + c, { x: -170, y: 38, duration: 0.45, ease: "power2.in" }, t + 0.2);
  tl.to("#co-coin" + c, { opacity: 0, duration: 0.12 }, t + 0.62);
  COUNT("#co-gn", c, c + 1, t + 0.62, 0.2);
});
// L3 limits: no self-run, no internet
OUT("#co-term2", at(3, 0), 0.4);
OUT("#co-hA, #co-hB, #co-hC", at(3, 0), 0.4);
IN("#co-gear", at(3, 0.12), 0.5);
tl.to("#co-gearr", { rotation: 90, svgOrigin: "800 150", duration: 1.2, ease: "power1.inOut" }, at(3, 0.12));
IN("#co-x1", at(3, 0.3), 0.25, { scale: 1.4, svgOrigin: "800 150" }, { scale: 1, svgOrigin: "800 150" });
IN("#co-scr2", at(3, 0.5), 0.5); OUT("#co-scr1", at(3, 0.46), 0.3);
IN("#co-cloud", at(3, 0.72), 0.5);
IN("#co-x2", at(3, 0.84), 0.25, { scale: 1.4, svgOrigin: "1178 144" }, { scale: 1, svgOrigin: "1178 144" });
// L4 can do
OUT("#co-s2", at(4, 0), 0.5);
IN("#co-canh", at(4, 0.04), 0.5);
[0.1, 0.24, 0.38, 0.56, 0.76].forEach((f, i) => IN("#co-can" + i, at(4, f), 0.5, { x: -40 }, { x: 0 }));
// L5 cannot -> alternatives
IN("#co-noh", at(5, 0.02), 0.5);
[0.08, 0.42, 0.7].forEach((f, i) => {
  IN("#co-no" + i, at(5, f), 0.5, { x: 40 }, { x: 0 });
  ARROW("#co-na" + i, at(5, f) + 0.5, 0.4);
  IN("#co-alt" + i, at(5, f) + 0.8, 0.5, { x: 20 }, { x: 0 });
});
// L6 public data + immutable code
[0.06, 0.6].forEach((f, j) => {
  const i = j + 3;
  IN("#co-no" + i, at(6, f), 0.5, { x: 40 }, { x: 0 });
  ARROW("#co-na" + i, at(6, f) + 0.5, 0.4);
  IN("#co-alt" + i, at(6, f) + 0.8, 0.5, { x: 20 }, { x: 0 });
});
tl.to("#co-priv", { fill: "#FC6255", duration: 0.3 }, at(6, 0.4));


      tl.to("#co-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#co-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["contract"] = tl;
    })();
  </script>
