    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
// L0 EOA card: key -> pubkey -> keccak -> last 20 bytes
IN("#ac-cl", at(0, 0), 0.6, { scale: 0.96, svgOrigin: "520 590" }, { scale: 1, svgOrigin: "520 590" });
IN("#ac-lt", at(0, 0.05), 0.5);
IN("#ac-key", at(0, 0.18), 0.4);
ARROW("#ac-a1", at(0, 0.3), 0.3); IN("#ac-pub", at(0, 0.36), 0.4);
ARROW("#ac-a2", at(0, 0.5), 0.3); IN("#ac-kec", at(0, 0.55), 0.4);
ARROW("#ac-a3", at(0, 0.64), 0.3);
tl.to("#ac-hl", { opacity: 1, duration: 0.01 }, at(0, 0.68));
tl.fromTo("#ac-hl rect", { opacity: 0 }, { opacity: 0.8, duration: 0.2, stagger: 0.015, immediateRender: false }, at(0, 0.68));
const cutL = at(0, 0.82);
for (let i = 0; i < 32; i++) tl.to("#ac-hl" + i, i < 12 ? { opacity: 0.18, duration: 0.4 } : { fill: "#B48EF0", opacity: 1, duration: 0.4 }, cutL);
IN("#ac-hll", cutL + 0.2, 0.4);
IN("#ac-nocode", at(0, 0.96), 0.4);
IN("#ac-div", at(1, 0), 0.4);
// L1 contract card
IN("#ac-cr", at(1, 0), 0.6, { scale: 0.96, svgOrigin: "1400 590" }, { scale: 1, svgOrigin: "1400 590" });
IN("#ac-rt", at(1, 0.05), 0.5);
IN("#ac-code", at(1, 0.14), 0.4);
IN("#ac-lock", at(1, 0.3), 0.4, { y: -14 }, { y: 0 });
IN("#ac-dep", at(1, 0.48), 0.4); IN("#ac-plus", at(1, 0.55), 0.3); IN("#ac-ns", at(1, 0.6), 0.4);
ARROW("#ac-a4", at(1, 0.72), 0.3);
tl.to("#ac-hr", { opacity: 1, duration: 0.01 }, at(1, 0.78));
tl.fromTo("#ac-hr rect", { opacity: 0 }, { opacity: 0.8, duration: 0.2, stagger: 0.012, immediateRender: false }, at(1, 0.78));
for (let i = 0; i < 32; i++) tl.to("#ac-hr" + i, i < 12 ? { opacity: 0.18, duration: 0.4 } : { fill: "#58C4DD", opacity: 1, duration: 0.4 }, at(1, 0.9));
IN("#ac-hrl", at(1, 0.92), 0.4);
// L2 only EOA signs; CA cannot initiate; sub-call
IN("#ac-pen", at(2, 0.05), 0.4);
