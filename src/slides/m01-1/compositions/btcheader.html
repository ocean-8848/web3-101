      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const TXT = (sel, arr, t, d) => {
        const o = { v: 0 }, el = document.querySelector(sel), n = arr.length;
        tl.fromTo(o, { v: 0 }, { v: n - 0.001, duration: d, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = arr[Math.floor(o.v)]; } }, t);

      let _s = 12345; const rnd = () => (_s = (_s * 16807) % 2147483647) / 2147483647;

// L1 version

IN("#bt-card", at(1, 0.08), 0.4);
IN("#bt-k0", at(1, 0.12), 0.5);

OUT("#bt-k0", at(2, 0.0), 0.3); DIM(0, at(2, 0.0));

tl.fromTo("#bt-pd", { x: 0 }, { x: -365, duration: 0.9, ease: "power1.in", repeat: 2, immediateRender: false }, at(2, 0.48));
tl.to("#bt-pd", { opacity: 0, duration: 0.1 }, at(2, 0.48) + 2.7);
IN("#bt-lk", at(2, 0.66), 0.4);
tl.fromTo("#bt-sh", { y: -10 }, { y: 0, duration: 0.3, ease: "bounce.out", immediateRender: false }, at(2, 0.72));
// L3 merkleRoot
OUT("#bt-k1, #bt-parr, #bt-pd", at(3, 0.0), 0.3); DIM(1, at(3, 0.0));
LIT(2, at(3, 0.02)); IN("#bt-n2", at(3, 0.04), 0.4);
IN("#bt-k2", at(3, 0.08), 0.5);

// L4 timestamp
OUT("#bt-k2", at(4, 0.0), 0.3); DIM(2, at(4, 0.0));
LIT(3, at(4, 0.02)); IN("#bt-l3", at(4, 0.04), 0.4);
IN("#bt-k3", at(4, 0.08), 0.5);

LIT(4, at(5, 0.04), "#FF9F43", "#3a2a17"); IN("#bt-l4", at(5, 0.05), 0.4);
IN("#bt-k4", at(5, 0.08), 0.5);
LIT(5, at(5, 0.5), "#58C4DD", "#3a3f4a"); IN("#bt-l5", at(5, 0.52), 0.4);
IN("#bt-k4b", at(5, 0.52), 0.4);
IN("#bt-nn, #bt-k4c", at(5, 0.62), 0.3);

      tl.to("#bt-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
