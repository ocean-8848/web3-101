tl.to("#et-t0", { opacity: 1, duration: 0.3 }, at(2, 0.16)); FLASH("#et-c0", at(2, 0.16));
IN("#et-term2", at(2, 0.22), 0.5);

tl.to("#et-t2", { opacity: 1, duration: 0.3 }, at(2, 0.36)); FLASH("#et-c2", at(2, 0.36));

// L3 交易列表 → 交易树 → transactionsRoot；→ EVM
OUT("#et-rlp", at(3, 0), 0.35);
IN("#et-txl", at(3, 0.06), 0.5, { x: -20 }, { x: 0 });
ARROW("#et-a1t", at(3, 0.2), 0.5);
IN("#et-tt", at(3, 0.26), 0.5, { scale: 0.6, ...O(426, 445) }, { scale: 1, ...O(426, 445) });
ARROW("#et-a1r", at(3, 0.36), 0.4);
FLASH("#et-c0", at(3, 0.42));
OUT("#et-term2", at(3, 0.5), 0.4);
ARROW("#et-a2g", at(3, 0.6), 0.5);
IN("#et-gear", at(3, 0.65), 0.5);
SPIN("#et-gp", 680, 730, at(3, 0.66), 3.2, 180);
IN("#et-gl", at(3, 0.75), 0.5);
// L4 EVM 输出：状态 → stateRoot；回执 → receiptsRoot
SPIN("#et-gp", 680, 730, at(4, 0.02), 3, 180);

COUNT("#et-wsn", 12.5, 11.2, at(4, 0.16), 1.0, v => v.toFixed(2));
IN("#et-st", at(4, 0.26), 0.5, { scale: 0.6, ...O(960, 445) }, { scale: 1, ...O(960, 445) });
ARROW("#et-a3r", at(4, 0.24), 0.3);
ARROW("#et-a3s", at(4, 0.34), 0.4);
FLASH("#et-c1", at(4, 0.4));
ARROW("#et-a4", at(4, 0.5), 0.6);
IN("#et-rc", at(4, 0.56), 0.5);
IN("#et-rok, #et-rlog", at(4, 0.62), 0.4);
IN("#et-rno", at(4, 0.68), 0.4);
ARROW("#et-a5", at(4, 0.8), 0.4);
IN("#et-rt", at(4, 0.83), 0.5, { scale: 0.6, ...O(1493, 445) }, { scale: 1, ...O(1493, 445) });
ARROW("#et-a5s", at(4, 0.88), 0.4);

[0, 1, 2].forEach(n => IN(`#et-n${n}`, at(5, 0.06 + 0.05 * n), 0.5, { y: 15 }, { y: 0 }));

tl.fromTo("#et-fb2", { opacity: 1 }, { opacity: 0.4, duration: 0.4, yoyo: true, repeat: 3, immediateRender: false }, at(6, 0.8));
/*ENDANIM*/

      tl.to("#et-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#et-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["ethstate"] = tl;
    })();
  </script>
