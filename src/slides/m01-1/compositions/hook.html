    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const TXT = (sel, arr, t, d) => {
        const o = { v: 0 }, el = document.querySelector(sel), n = arr.length;
        tl.fromTo(o, { v: 0 }, { v: n - 0.001, duration: d, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = arr[Math.floor(o.v)]; } }, t);
      };
      let _s = 12345; const rnd = () => (_s = (_s * 16807) % 2147483647) / 2147483647;
      const hex = n => { let s = ""; for (let i = 0; i < n; i++) s += "0123456789abcdef"[Math.floor(rnd() * 16)]; return s; };

// L0 box + transactions stacking
IN("#ho-box", at(0, 0.0), 0.6, { scale: 0.94, svgOrigin: "960 530" }, { scale: 1, svgOrigin: "960 530" });
tl.fromTo(".ho-cd", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", stagger: 0.075 }, at(0, 0.15));
IN("#ho-cnt, #ho-cnt2", at(0, 0.2), 0.5);
COUNT("#ho-cntn", 0, 3000, at(0, 0.2), 2.6);
// L1 header strip + pickaxe hashing
IN("#ho-hdr", at(1, 0.05), 0.5);
IN("#ho-hl1", at(1, 0.15), 0.4);
IN("#ho-pickw", at(1, 0.3), 0.3);
tl.fromTo("#ho-pick", { rotation: -22, svgOrigin: "1150 170" }, { rotation: 0, svgOrigin: "1150 170", duration: 0.22, ease: "power2.in", yoyo: true, repeat: 11, immediateRender: false }, at(1, 0.32));
IN("#ho-hash", at(1, 0.35), 0.15);
const hs = []; for (let i = 0; i < 24; i++) hs.push(hex(8) + "…" + hex(8));
TXT("#ho-hash", hs, at(1, 0.35), 2.64);
// L2 it's the header; questions
OUT("#ho-pickw, #ho-hash", at(2, 0.0), 0.3);
OUT("#ho-hl1", at(2, 0.02), 0.25);
IN("#ho-hl2", at(2, 0.08), 0.4);
tl.to("#ho-hdrr", { attr: { "stroke-width": 5 }, fill: "#22404d", duration: 0.4 }, at(2, 0.08));
tl.to("#ho-cards, #ho-cnt, #ho-cnt2", { opacity: 0.3, duration: 0.5 }, at(2, 0.12));
IN("#ho-q1", at(2, 0.3), 0.5, { x: -12 }, { x: 0 });
tl.fromTo(".ho-lk", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.12 }, at(2, 0.62));
IN("#ho-q2", at(2, 0.8), 0.5);
// L3 zoom out to a chain; old byte flips
tl.to("#ho-s1", { opacity: 0, scale: 0.6, svgOrigin: "960 450", duration: 0.5, ease: "power2.in" }, at(3, 0.0));
IN("#ho-s2", at(3, 0.06), 0.6, { scale: 1.3, svgOrigin: "960 520" }, { scale: 1, svgOrigin: "960 520" });
tl.fromTo(".ho-ar", { opacity: 0 }, { opacity: 1, duration: 0.01 }, at(3, 0.15));
tl.fromTo(".ho-ar", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, stagger: 0.08 }, at(3, 0.15));
IN("#ho-old, #ho-now", at(3, 0.25), 0.4);
IN("#ho-byte", at(3, 0.42), 0.2);
tl.to("#ho-byte", { opacity: 0.2, duration: 0.18, yoyo: true, repeat: 5 }, at(3, 0.47));
tl.fromTo(".ho-q", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.15 }, at(3, 0.6));
// L4 title
OUT(".ho-q", at(4, 0.0), 0.3);
tl.to("#ho-s2w", { y: 150, duration: 0.7, ease: "power2.inOut" }, at(4, 0.02));
IN("#ho-title", at(4, 0.1), 0.6, { y: 10 }, { y: 0 });
tl.to("#ho-s2", { scale: 1.06, svgOrigin: "960 520", duration: 6.5, ease: "sine.inOut" }, at(4, 0.15));
tl.to(".ho-hs", { attr: { "fill-opacity": 0.6 }, duration: 0.35, stagger: 0.12 }, at(4, 0.25));
tl.to(".ho-hs", { attr: { "fill-opacity": 0.2 }, duration: 0.35, stagger: 0.12 }, at(4, 0.42));
tl.to(".ho-hs", { attr: { "fill-opacity": 0.6 }, duration: 0.35, stagger: 0.12 }, at(4, 0.6));
tl.to("#ho-title", { opacity: 0, duration: 0.6 }, at(4, 0.88));

      tl.to("#ho-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["hook"] = tl;
    })();
