    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      // 小油箱 / 2025 柱 / 大计量表 / 基础费柱
      const TANK = (h, t, d = 0.6) => tl.to("#ga-fill", { attr: { y: 618 - h, height: h }, duration: d, ease: "power2.out" }, t);
      const YBAR = (k, h, t) => tl.fromTo(`#ga-b${k}`, { attr: { y: 960, height: 0 } }, { attr: { y: 960 - h, height: h }, duration: 0.7, ease: "power2.out", immediateRender: false }, t);
      const FILL = (m, t, d = 1.0) => tl.to("#ga-f2", { attr: { y: 898 - m * 10, height: m * 10 }, duration: d, ease: "power2.inOut" }, t);
      const BAR = (g, t, d = 1.0) => {
        tl.to("#ga-bf", { attr: { y: 900 - g * 25, height: g * 25 }, duration: d, ease: "power2.inOut" }, t);
        tl.to("#ga-bfv", { attr: { y: 884 - g * 25 }, duration: d, ease: "power2.inOut" }, t);
      };
      const GU = (a, b, t, d = 1.0) => COUNT("#ga-guv", a, b, t, d);
      const BF = (a, b, t, d = 1.0) => COUNT("#ga-bfv", a, b, t, d, v => (Math.round(v * 1000) / 1000) + " gwei");

      // L0 比特币：按权重称
      IN("#ga-btc", at(0, 0.0), 0.5);
      IN("#ga-sc", at(0, 0.05), 0.6);
      tl.fromTo("#ga-blk", { opacity: 0, y: -220 }, { opacity: 1, y: 0, duration: 0.9, ease: "bounce.out" }, at(0, 0.1));
      IN("#ga-sw", at(0, 0.2), 0.5);
      IN("#ga-sclab", at(0, 0.36), 0.5);
      IN("#ga-mb", at(0, 0.58), 0.5);
      IN("#ga-rule", at(0, 0.84), 0.5);

      // L1 以太坊：Gas 倒进油箱
      IN("#ga-eth", at(1, 0.0), 0.5);
      IN("#ga-tank", at(1, 0.04), 0.5);
      IN("#ga-term", at(1, 0.3), 0.5);
      IN("#ga-c1", at(1, 0.38), 0.4, { x: -30 }, { x: 0 });
      IN("#ga-c2", at(1, 0.43), 0.4, { x: -30 }, { x: 0 });
      IN("#ga-c3", at(1, 0.48), 0.4, { x: -30 }, { x: 0 });
      [["#ga-c1", 50, 0.56], ["#ga-c2", 120, 0.64], ["#ga-c3", 230, 0.72]].forEach(([s, h, f]) => {
        tl.to(s, { x: 240, opacity: 0, duration: 0.6, ease: "power2.in" }, at(1, f));
        TANK(h, at(1, f) + 0.45);
      });
      IN("#ga-rule2", at(1, 0.84), 0.5);
      OUT("#ga-term", at(1, 0.98), 0.4);

      // L2 gasLimit：每块 ±1/1024，2025 年上调
      IN("#ga-lim", at(2, 0.02), 0.4);
      IN("#ga-liml", at(2, 0.05), 0.4);
      ARROW("#ga-adj", at(2, 0.12), 0.5);
      IN("#ga-adjl", at(2, 0.14), 0.5);
      IN("#ga-term2", at(2, 0.2), 0.5);
      tl.to("#ga-fill", { attr: { y: 618 - 270, height: 270 }, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, at(2, 0.3));
      IN("#ga-yr, #ga-base", at(2, 0.48), 0.5);
      YBAR(1, 90, at(2, 0.56)); IN("#ga-bl1", at(2, 0.58), 0.4);
      YBAR(2, 108, at(2, 0.68)); IN("#ga-bl2", at(2, 0.7), 0.4);
      OUT("#ga-term2", at(2, 0.7), 0.4);
      YBAR(3, 135, at(2, 0.78)); IN("#ga-bl3", at(2, 0.8), 0.4);
      YBAR(4, 180, at(2, 0.9)); IN("#ga-bl4", at(2, 0.92), 0.4);

      // L3 目标 = 一半；超了涨、低了跌
      OUT("#ga-L, #ga-R", at(3, 0.0), 0.4);
      IN("#ga-t2, #ga-t2l", at(3, 0.06), 0.5);
      DRAW("#ga-tg", at(3, 0.14), 0.6); IN("#ga-tgl", at(3, 0.18), 0.4);
      IN("#ga-bfn", at(3, 0.3), 0.4);
      tl.fromTo("#ga-bf", { attr: { y: 900, height: 0 } }, { attr: { y: 650, height: 250 }, duration: 0.6, ease: "power2.out", immediateRender: false }, at(3, 0.3));
      FILL(50, at(3, 0.4), 0.8); BAR(11.7, at(3, 0.5), 0.7); IN("#ga-up", at(3, 0.5), 0.3);
      OUT("#ga-up", at(3, 0.7), 0.3);
      FILL(15, at(3, 0.72), 0.8); BAR(9, at(3, 0.8), 0.7); IN("#ga-dn", at(3, 0.8), 0.3);
      OUT("#ga-dn", at(4, 0.0), 0.3);

      // L4 EIP-1559：基础费销毁，小费给出块者
      IN("#ga-eip", at(4, 0.02), 0.5);
      IN("#ga-fl", at(4, 0.28), 0.5, { scale: 0.6, svgOrigin: "980 900" }, { scale: 1, svgOrigin: "980 900" });
      ["#ga-co1", "#ga-co2", "#ga-co3"].forEach((s, k) => {
        const t = at(4, 0.34) + k * 0.25;
        tl.fromTo(s, { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.15 }, t);
        tl.to(s, { x: 980 - (785 + 27 * k), y: 190, duration: 0.7, ease: "power2.in" }, t + 0.15);
        tl.to(s, { opacity: 0, duration: 0.15 }, t + 0.8);
      });
      IN("#ga-fll", at(4, 0.42), 0.4);
      IN("#ga-pr", at(4, 0.66), 0.5);
      DRAW("#ga-tip", at(4, 0.7), 0.8);
      IN("#ga-tipl", at(4, 0.76), 0.4);

      // L5 算一算：4500 万 → 10.625 gwei
      OUT("#ga-pr, #ga-tip, #ga-tipl", at(5, 0.0), 0.4);
      IN("#ga-card", at(5, 0.03), 0.5);
      IN("#ga-st", at(5, 0.06), 0.4);
      FILL(45, at(5, 0.15)); IN("#ga-gu", at(5, 0.15), 0.4); GU(1500, 4500, at(5, 0.15));
      BAR(10, at(5, 0.2), 0.6); IN("#ga-bfv", at(5, 0.24), 0.4);
      IN("#ga-r1", at(5, 0.45), 0.5, { x: -16 }, { x: 0 });
      IN("#ga-r2", at(5, 0.63), 0.5, { x: -16 }, { x: 0 });
      IN("#ga-r3", at(5, 0.8), 0.5, { x: -16 }, { x: 0 });
      BAR(10.625, at(5, 0.88), 0.7); BF(10, 10.625, at(5, 0.88), 0.7);

      // L6 全满 / 全空：±12.5%；20 gwei 满块 → 22.5
      OUT("#ga-r1, #ga-r2, #ga-r3", at(6, 0.0), 0.35);
      FILL(60, at(6, 0.04), 0.7); GU(4500, 6000, at(6, 0.04), 0.7);
      IN("#ga-bt", at(6, 0.1), 0.3);
      IN("#ga-r4", at(6, 0.12), 0.4, { x: -16 }, { x: 0 });
      FILL(0, at(6, 0.28), 0.8); GU(6000, 0, at(6, 0.28), 0.8);
      IN("#ga-bb", at(6, 0.34), 0.3);
      IN("#ga-r5", at(6, 0.36), 0.4, { x: -16 }, { x: 0 });
      FILL(60, at(6, 0.6), 0.8); GU(0, 6000, at(6, 0.6), 0.8);
      BAR(20, at(6, 0.6), 0.8); BF(10.625, 20, at(6, 0.6), 0.8);
      IN("#ga-r6", at(6, 0.72), 0.4, { x: -16 }, { x: 0 });
      BAR(22.5, at(6, 0.86), 0.6); BF(20, 22.5, at(6, 0.86), 0.6);

      // L7 只用 1500 万：−6.25% → 18.75
