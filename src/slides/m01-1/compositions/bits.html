IN("#bi-f2", at(3, 0.03), 0.7, { y: 20 }, { y: 0 });

IN("#bi-h2", at(3, 0.5), 0.5);
IN("#bi-hf", at(3, 0.62), 0.5, { scale: 1.2, ...O(469, 671) }, { scale: 1, ...O(469, 671) });
// L4 8 个十六进制 0 = 32 位
IN("#bi-exp", at(4, 0.04), 0.6);
tl.fromTo(".bi-q", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.04 }, at(4, 0.08));
IN("#bi-q32", at(4, 0.3), 0.5);
IN("#bi-q43", at(4, 0.62), 0.6, { x: 20 }, { x: 0 });
tl.to(".bi-q", { fillOpacity: 0.7, duration: 0.25, stagger: 0.02, yoyo: true, repeat: 1 }, at(4, 0.75));
// L5 难度定义
OUT("#bi-mid", at(5, 0), 0.4);
IN("#bi-d1", at(5, 0.1), 0.7, { y: 20 }, { y: 0 });
IN("#bi-d2", at(5, 0.6), 0.6, { scale: 0.8, ...O(960, 645) }, { scale: 1, ...O(960, 645) });

OUT("#bi-ev, #bi-gen, #bi-hx", at(6, 0.08), 0.3);
IN("#bi-ev2", at(6, 0.12), 0.4, { scale: 0.6, ...O(810, 260) }, { scale: 1, ...O(810, 260) });
IN("#bi-ex", at(6, 0.12), 0.4);
IN("#bi-hx2", at(6, 0.2), 0.4);
IN("#bi-pl, #bi-pa", at(6, 0.36), 0.5);
IN("#bi-pr, #bi-pb", at(6, 0.46), 0.5);

IN("#bi-arl2", at(6, 0.6), 0.5);

COUNT("#bi-pdn", 1, 256, at(6, 0.76), 1.2);
