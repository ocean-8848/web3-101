  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const TXT = (sel, arr, t, d) => {
        const o = { v: 0 }, el = document.querySelector(sel), n = arr.length;
        tl.fromTo(o, { v: 0 }, { v: n - 0.001, duration: d, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = arr[Math.floor(o.v)]; } }, t);
      };
      let _s = 12345; const rnd = () => (_s = (_s * 16807) % 2147483647) / 2147483647;
      const hex = n => { let s = ""; for (let i = 0; i < n; i++) s += "0123456789abcdef"[Math.floor(rnd() * 16)]; return s; };

const HEIGHTS = [260, 330, 180, 400, 220, 300, 150, 360, 240, 50, 280, 200, 340, 62, 230];
// L0 header strip -> SHA256d -> compare with target
IN("#mi-bar", at(0, 0.0), 0.6, { scale: 1.15, svgOrigin: "500 250" }, { scale: 1, svgOrigin: "500 250" });
ARROW("#mi-a1", at(0, 0.18), 0.5);
IN("#mi-proc", at(0, 0.24), 0.6);
ARROW("#mi-a2", at(0, 0.42), 0.4);
tl.to("#mi-s1", { fill: "#24414e", duration: 0.25, yoyo: true, repeat: 1 }, at(0, 0.38));
tl.to("#mi-s2", { fill: "#24414e", duration: 0.25, yoyo: true, repeat: 1 }, at(0, 0.48));
IN("#mi-hx", at(0, 0.56), 0.4);
IN("#mi-base, #mi-tg, #mi-tgl", at(0, 0.7), 0.5);
// L1 + L2 attempts: each nonce gives a new hash bar
const T = i => i < 9 ? at(1, 0.08) + i * 0.62 : at(2, 0.03) + (i - 9) * 0.6;
IN("#mi-nv, #mi-try", at(1, 0.04), 0.4);
tl.to("#mi-c5", { fill: "#58C4DD", duration: 0.12, yoyo: true, repeat: 1 }, T(0));
const hx = [], nv = [], tv = [];
for (let i = 0; i < 15; i++) {
  const t = T(i);
  tl.fromTo(`#mi-hb${i}`, { opacity: 0, attr: { height: 0, y: 900 } }, { opacity: 1, attr: { height: HEIGHTS[i], y: 900 - HEIGHTS[i] }, duration: 0.3, ease: "power2.out" }, t);
  tl.to("#mi-c5", { fill: "#58C4DD", duration: 0.1, yoyo: true, repeat: 1 }, t);
  if (HEIGHTS[i] < 80) IN(`#mi-ok${i}`, t + 0.2, 0.3);
}
for (let i = 0; i < 9; i++) { hx.push((i === 0 ? "7f3a" : hex(4)) + hex(4) + "…" + hex(4)); nv.push(String(i)); tv.push(String(i + 1)); }
TXT("#mi-hxv", hx, T(0), 9 * 0.62); TXT("#mi-nvv", nv, T(0), 9 * 0.62); TXT("#mi-tryv", tv, T(0), 9 * 0.62);
const hx2 = [], nv2 = [], tv2 = [];
for (let i = 9; i < 15; i++) { hx2.push((HEIGHTS[i] < 80 ? "0000" : hex(4)) + hex(4) + "…" + hex(4)); nv2.push(String(i)); tv2.push(String(i + 1)); }
TXT("#mi-hxv", hx2, T(9), 6 * 0.6); TXT("#mi-nvv", nv2, T(9), 6 * 0.6); TXT("#mi-tryv", tv2, T(9), 6 * 0.6);
IN("#mi-many", at(2, 0.62), 0.5);
// L3 the nonce space runs out in seconds
OUT("#mi-hist, #mi-hx, #mi-nv, #mi-try", at(3, 0.0), 0.4);
IN("#mi-rbg, #mi-rn, #mi-rl", at(3, 0.06), 0.4);
tl.fromTo("#mi-rp", { opacity: 0 }, { opacity: 1, duration: 0.01 }, at(3, 0.1));
tl.fromTo("#mi-rp", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 3.0, ease: "none" }, at(3, 0.1));
const fmt = v => Math.round(v).toLocaleString("en-US");
const o = { v: 0 }, rn = document.querySelector("#mi-rn");
tl.fromTo(o, { v: 0 }, { v: 4294967296, duration: 3.0, ease: "none", immediateRender: false, onUpdate: () => { rn.textContent = fmt(o.v); } }, at(3, 0.1));
tl.to("#mi-rp", { stroke: "#FC6255", duration: 0.3 }, at(3, 0.1) + 3.0);
IN("#mi-done", at(3, 0.1) + 3.05, 0.4);
// L4 extraNonce in coinbase changes the merkle root, nonce space refills
IN("#mi-cb, #mi-txs", at(4, 0.04), 0.5, { y: 20 }, { y: 0 });
IN("#mi-xn1", at(4, 0.06), 0.4);
tl.to("#mi-cbr", { attr: { "stroke-width": 5 }, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.15));
IN("#mi-tree", at(4, 0.2), 0.6);
OUT("#mi-xn1", at(4, 0.32), 0.2);
IN("#mi-xn2", at(4, 0.34), 0.3);
tl.to("#mi-xn", { fill: "#24414e", duration: 0.2, yoyo: true, repeat: 1 }, at(4, 0.34));
IN("#mi-pulse", at(4, 0.4), 0.1);
tl.fromTo("#mi-pulse", { x: 0, y: 0 }, { keyframes: [{ x: 135, y: -90, duration: 0.5 }, { x: 345, y: -190, duration: 0.5 }, { x: 322, y: -500, duration: 0.6 }], ease: "none", immediateRender: false }, at(4, 0.4));
tl.to("#mi-pulse", { opacity: 0, duration: 0.15 }, at(4, 0.4) + 1.6);
tl.to("#mi-e0, #mi-e4, #mi-e6", { stroke: "#e8e6df", duration: 0.3 }, at(4, 0.42));
tl.to("#mi-c2", { fill: "#2a5566", attr: { "stroke-width": 4.5 }, duration: 0.3 }, at(4, 0.4) + 1.6);
tl.to("#mi-e0, #mi-e4, #mi-e6", { stroke: "#58C4DD", duration: 0.4 }, at(4, 0.4) + 1.9);
OUT("#mi-done", at(4, 0.62), 0.3);
tl.to("#mi-rp", { stroke: "#83C167", strokeDashoffset: 1, duration: 0.4 }, at(4, 0.64));
tl.fromTo(o, { v: 4294967296 }, { v: 0, duration: 0.4, immediateRender: false, onUpdate: () => { rn.textContent = fmt(o.v); } }, at(4, 0.64));
tl.to("#mi-rp", { strokeDashoffset: 0, duration: 3.0, ease: "none" }, at(4, 0.68));
tl.fromTo(o, { v: 0 }, { v: 4294967296, duration: 3.0, ease: "none", immediateRender: false, onUpdate: () => { rn.textContent = fmt(o.v); } }, at(4, 0.68));
// L5 tampering: tx -> root -> header hash above target -> invalid; next block breaks
OUT("#mi-ring, #mi-proc, #mi-a1, #mi-a2", at(5, 0.0), 0.4);
tl.to("#mi-c2", { fill: "#1b2a33", attr: { "stroke-width": 2.5 }, duration: 0.3 }, at(5, 0.0));
IN("#mi-cmp", at(5, 0.04), 0.4);
