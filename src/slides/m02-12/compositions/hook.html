  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 pool + faucet + dripping coins
IN("#ho-pool", at(0, 0.02), 0.8, { scale: 0.9, svgOrigin: "960 640" }, { scale: 1, svgOrigin: "960 640" });
IN("#ho-faucet", at(0, 0.15), 0.6);
for (let i = 0; i < 15; i++) {
  const t = at(0, 0.3) + i * 1.0;
  tl.fromTo(`#ho-c${i}`, { opacity: 1, y: 0 }, { y: 225, duration: 0.8, ease: "power2.in", immediateRender: false }, t);
  tl.to(`#ho-c${i}`, { opacity: 0, duration: 0.15 }, t + 0.8);
}
// L1 many people
IN(".ho-dot", at(1, 0.05), 0.35, { scale: 0.3, transformOrigin: "50% 50%" }, { scale: 1, stagger: { each: 0.014 } });
// L2 ledger entries pile up + gauge
IN(".ho-lg1", at(2, 0.05), 0.2, {}, { stagger: { each: 0.008 } });
IN("#ho-gauge", at(2, 0.25), 0.5);
tl.fromTo("#ho-needle", { rotation: -80, svgOrigin: "1640 200" }, { rotation: 80, svgOrigin: "1640 200", duration: 2.2, ease: "power2.in" }, at(2, 0.3));
IN(".ho-lg2", at(2, 0.4), 0.2, {}, { stagger: { each: 0.008 } });
tl.to("#ho-needle", { rotation: 74, svgOrigin: "1640 200", duration: 0.15, yoyo: true, repeat: 5, ease: "none" }, at(2, 0.3) + 2.3);
// L3 comparison
OUT("#ho-dots, #ho-led1, #ho-led2, #ho-gauge, #ho-pool, #ho-faucet", at(3, 0), 0.5);
IN("#ho-cmpL", at(3, 0.08), 0.6);
