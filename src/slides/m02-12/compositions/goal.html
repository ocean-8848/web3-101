}
IN("#go-rwd", at(0, 0.62), 0.6, { x: 30 }, { x: 0 });
IN("#go-axis", at(0, 0.7), 0.5);
for (let i = 0; i < 10; i++) IN(`#go-tc${i}`, at(0, 0.74) + i * 0.75, 0.3, { scale: 0.3, transformOrigin: "50% 50%" }, { scale: 1 });

[[0.12, 0.38], [0.45, 0.62], [0.67, 0.84], [0.87, 0.96]].forEach(([a, b], k) => {

// L5 gas
IN("#go-gas", at(5, 0.02), 0.5);
tl.to("#go-g0", { attr: { width: 550 }, duration: 0.9, ease: "power2.out" }, at(5, 0.15));
IN("#go-gl0", at(5, 0.3), 0.4);
