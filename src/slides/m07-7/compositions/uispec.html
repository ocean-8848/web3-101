      [0, 3, 5, 7].forEach((i, k) => { tl.fromTo([`#ui-r${i}`, `#ui-rb${i}`], { opacity: 0 }, { opacity: 0.35, duration: 0.6 }, at(5, 0.6 + k * 0.06)); });
      // L6 收成左表 + 模拟器
      const RB = [0,1,2,3,4,5,6,7].map(i => `#ui-rb${i}`).concat(["#ui-hash", "#ui-c4x", "#ui-spin", "#ui-h2", "#ui-h3", "#ui-exit"]);
      tl.to(RB, { opacity: 0, duration: 0.4, ease: "power2.in" }, at(6, 0.0));
      UNLIT(6, at(6, 0.0));
      [0,1,2,3,4,5,6,7].forEach(i => tl.to(`#ui-r${i}`, { opacity: 1, duration: 0.4 }, at(6, 0.05)));
      tl.to([0,1,2,3,4,5,6,7].map(i => `#ui-r${i} > rect:first-of-type`), { attr: { width: 732 }, duration: 0.5, ease: "power2.inOut" }, at(6, 0.0));
      [0,1,2,3,4].forEach(k => IN(`#ui-ev${k}`, at(6, 0.07 + k * 0.025), 0.4, { x: 20 }, { x: 0 }));
      IN("#ui-pv", at(6, 0.1), 0.5);
      ARROW("#ui-sa", at(6, 0.14), 0.4);
      const ROW = [1, 2, 3, 4, 2];
      const col = ["#8a8f99", "#8a8f99", "#FF9F43", "#8a8f99", "#FF9F43"];
      ROW.forEach((r, k) => {
        const t = at(6, 0.13 + k * 0.18);
        tl.to(`#ui-evb${k}`, { fill: col[k], fillOpacity: 0.35, duration: 0.15 }, t);
        tl.to(`#ui-evb${k}`, { fill: "#161a22", fillOpacity: 1, duration: 0.4 }, t + 0.35);
        if (k > 0) OUT(`#ui-pv${k - 1}`, t + 0.05, 0.2);
        IN(`#ui-pv${k}`, t + 0.3, 0.35, { x: 12 }, { x: 0 });
        if (k === 0) IN("#ui-cur", t + 0.1, 0.4);
        else tl.to("#ui-cur", { attr: { y: 280 + 80 * r - 6 }, duration: 0.45, ease: "power2.inOut" }, t + 0.1);
      });


      tl.to("#ui-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ui-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["uispec"] = tl;
    })();
  </script>
