      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const ON = (k, t) => { tl.to(`#pi-rr${k}`, { stroke: "#58C4DD", duration: 0.25 }, t); tl.to(`#pi-rc${k}`, { fill: "#58C4DD", stroke: "#58C4DD", duration: 0.25 }, t); };
      const OFF = (k, t) => { tl.to(`#pi-rr${k}`, { stroke: "#6b6f7a", duration: 0.25 }, t); tl.to(`#pi-rc${k}`, { fill: "#161a22", stroke: "#8a8f99", duration: 0.25 }, t); };
      const OPT = ["#pi-o1", "#pi-o2", "#pi-o3", "#pi-o4", "#pi-o5", "#pi-o6", "#pi-o7", "#pi-o8", "#pi-o9"];
      // L0 地图缩到左侧；必修发光，连到 Rollup / 隐私 / 身份

      tl.to("#pi-glow", { opacity: 0.35, duration: 0.5 }, at(0, 0.12));
      DRAW("#pi-u1", at(0, 0.3), 0.7); IN("#pi-i1", at(0, 0.36), 0.5, { y: 12 }, { y: 0 });
      DRAW("#pi-u2", at(0, 0.44), 0.7); IN("#pi-i2", at(0, 0.5), 0.5, { y: 12 }, { y: 0 });
      DRAW("#pi-u3", at(0, 0.58), 0.7); IN("#pi-i3", at(0, 0.64), 0.5, { y: 12 }, { y: 0 });
      tl.to("#pi-u1, #pi-u2, #pi-u3", { attr: { "stroke-width": 5 }, duration: 0.3, yoyo: true, repeat: 1 }, at(0, 0.84));

      // L1 四类方向：每点一行，全部选修 chip 一起高亮
      OUT("#pi-use", at(1, 0), 0.35);
      IN("#pi-r0", at(1, 0) + 0.4, 0.4, { x: 20 }, { x: 0 });
      IN("#pi-r1", at(1, 0) + 0.52, 0.4, { x: 20 }, { x: 0 });
      IN("#pi-r2", at(1, 0) + 0.64, 0.4, { x: 20 }, { x: 0 });
      IN("#pi-r3", at(1, 0) + 0.76, 0.4, { x: 20 }, { x: 0 });
      [0.28, 0.48, 0.66, 0.84].forEach((f, k) => {
        const t = at(1, f);
        if (k) OFF(k - 1, t);
        ON(k, t);
        tl.to(".pi-optr", { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(".pi-optr", { attr: { "stroke-width": 4 }, duration: 0.2, yoyo: true, repeat: 1 }, t);
      });
      // L2 写智能合约：必修 → SNARK 与 STARK → 第一个电路
      OFF(3, at(2, 0));
      IN("#pi-r4", at(2, 0), 0.4, { x: 20 }, { x: 0 });
      ON(4, at(2, 0.06));
      IN("#pi-h4", at(2, 0.1), 0.4);
      tl.to(OPT.slice(2).join(", "), { opacity: 0.3, duration: 0.4 }, at(2, 0.12));
      tl.to("#pi-o1r, #pi-o2r", { stroke: "#58C4DD", duration: 0.3 }, at(2, 0.12));
