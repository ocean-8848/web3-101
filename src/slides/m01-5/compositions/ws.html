      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const SEND = (id, t) => { IN(id, t, 0.25); tl.fromTo(id + "m", { x: 0 }, { x: -880, duration: 1.0, ease: "power1.inOut", immediateRender: false }, t); OUT(id, t + 0.85, 0.2); };

      IN("#ws-be", at(0, 0), 0.5, { x: -20 }, { x: 0 });
      IN("#ws-nd", at(0, 0.03), 0.5, { x: 20 }, { x: 0 });
      IN("#ws-ht", at(0, 0.08), 0.4);
      ARROW("#ws-h1", at(0, 0.1), 0.5);
      ARROW("#ws-h2", at(0, 0.22), 0.5);
      OUT("#ws-h1, #ws-h2, #ws-ht", at(0, 0.42), 0.3);
      IN("#ws-p1", at(0, 0.48), 0.7, { scaleX: 0.2, svgOrigin: "960 305" }, { scaleX: 1, svgOrigin: "960 305" });
      IN("#ws-pt", at(0, 0.6), 0.5);
      tl.to("#ws-p1", { opacity: 0.75, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, at(0, 0.75));
      // L1 订阅编号 + newHeads 卡堆叠
      SEND("#ws-m0", at(1, 0.12));
      IN("#ws-s0", at(1, 0.12) + 1.0, 0.3);
      [0, 1, 2].forEach(k => { SEND("#ws-mh" + k, at(1, 0.42 + k * 0.17)); IN("#ws-sh" + k, at(1, 0.42 + k * 0.17) + 1.0, 0.3, { y: -10 }, { y: 0 }); });
      // L2 第二根订阅：USDC Transfer 日志，重组时重推 removed
      OUT("#ws-s0, #ws-sh0, #ws-sh1, #ws-sh2", at(2, 0), 0.4);
      IN("#ws-p2", at(2, 0.04), 0.6, { scaleX: 0.2, svgOrigin: "960 385" }, { scaleX: 1, svgOrigin: "960 385" });
      IN("#ws-p2t", at(2, 0.12), 0.5);
      [0, 1].forEach(k => { SEND("#ws-ml" + k, at(2, 0.25 + k * 0.14)); IN("#ws-sl" + k, at(2, 0.25 + k * 0.14) + 1.0, 0.3, { y: -10 }, { y: 0 }); });
      SEND("#ws-ml2", at(2, 0.68));
      IN("#ws-sl2", at(2, 0.68) + 1.0, 0.3, { y: -10 }, { y: 0 });
      IN("#ws-rm", at(2, 0.68) + 1.2, 0.3, { scale: 1.6, svgOrigin: "560 614" }, { scale: 1, svgOrigin: "560 614" });
      // L3 断线：3 张卡掉地上变灰，不补发
      OUT("#ws-sl0, #ws-sl1, #ws-sl2, #ws-rm, #ws-p2t", at(3, 0), 0.4);
      IN("#ws-gap1, #ws-gap2", at(3, 0.05), 0.2);
      IN("#ws-bolt", at(3, 0.05), 0.2, { scale: 1.4, svgOrigin: "968 310" }, { scale: 1, svgOrigin: "968 310" });
      [0, 1, 2].forEach(k => {
        const t = at(3, 0.22 + k * 0.1);
        IN("#ws-l" + k, t, 0.2);
        tl.fromTo("#ws-lm" + k, { y: -350, x: 200 - 160 * k }, { y: 0, x: 0, duration: 0.6, ease: "bounce.out", immediateRender: false }, t);
        tl.set("#ws-lm" + k, { y: -350, x: 200 - 160 * k }, 0);
        tl.to("#ws-lr" + k, { stroke: "#6b6f7a", duration: 0.3 }, t + 0.6);
        tl.to("#ws-lt" + k, { fill: "#6b6f7a", duration: 0.3 }, t + 0.6);
      });
      IN("#ws-lost", at(3, 0.6), 0.4);
      OUT("#ws-bolt", at(3, 0.75), 0.3);
      OUT("#ws-gap1, #ws-gap2", at(3, 0.78), 0.3);
      IN("#ws-q", at(3, 0.85), 0.4);
      // L4 订阅只当提醒
      IN("#ws-bell", at(4, 0.05), 0.5);
      tl.to("#ws-bell", { rotation: 8, svgOrigin: "680 492", duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut" }, at(4, 0.2));
      IN("#ws-no", at(4, 0.55), 0.4);
      // L5 按高度拉取 + 游标补拉
      for (let i = 0; i < 12; i++) IN("#ws-c" + i, at(5, 0) + i * 0.04, 0.3, { y: 12 }, { y: 0 });
      IN("#ws-pull", at(5, 0.08), 0.5);
      IN("#ws-cur", at(5, 0.2), 0.4);
      for (let i = 0; i <= 2; i++) tl.to("#ws-cr" + i, { fill: "#1c3440", duration: 0.25 }, at(5, 0.25) + i * 0.4);
      tl.to("#ws-curm", { x: 220, duration: 1.0, ease: "power1.inOut" }, at(5, 0.25));
      tl.to("#ws-curm", { x: 550, duration: 1.4, ease: "power1.inOut" }, at(5, 0.62));
      for (let i = 3; i <= 5; i++) tl.to("#ws-cr" + i, { fill: "#1c3440", duration: 0.25 }, at(5, 0.62) + (i - 2) * 0.42);
      [0, 1, 2].forEach(k => {
        tl.to("#ws-lr" + k, { stroke: "#83C167", duration: 0.3 }, at(5, 0.62) + (k + 1) * 0.42);
        tl.to("#ws-lt" + k, { fill: "#83C167", duration: 0.3 }, at(5, 0.62) + (k + 1) * 0.42);
      });
      OUT("#ws-lost, #ws-q", at(5, 0.8), 0.3);
      IN("#ws-ok", at(5, 0.84), 0.4);

      tl.to("#ws-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
