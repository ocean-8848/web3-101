tl.to("#se-pkm", { y: 365, duration: 0.9, ease: "power2.inOut" }, at(4, 0.22));
OUT("#se-nul", at(4, 0.32), 0.3);
IN("#se-rc", at(4, 0.36), 0.6, { y: 15 }, { y: 0 });

tl.to("#se-rc text", { opacity: 1, duration: 0.3, stagger: 0.6 }, at(4, 0.4));
// L5 入账判断
OUT("#se-q2, #se-rc, #se-qa", at(5, 0), 0.4);

IN("#se-bad", at(5, 0.72), 0.5);
IN("#se-badx", at(5, 0.82), 0.3, { scale: 1.6, svgOrigin: "724 600" }, { scale: 1, svgOrigin: "724 600" });

for (let k = 0; k < 7; k++) {
