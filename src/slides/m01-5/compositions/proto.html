  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
// L0 本地调用 vs 远程调用
IN("#pr-loc", at(0, 0.05), 0.6, { y: 16 }, { y: 0 });
tl.to("#pr-loc rect", { stroke: "#e8e6df", duration: 0.3, yoyo: true, repeat: 1 }, at(0, 0.28));
IN("#pr-m1", at(0, 0.38), 0.5);
IN("#pr-f1", at(0, 0.42), 0.5);
IN("#pr-m2", at(0, 0.5), 0.5);
IN("#pr-net", at(0, 0.55), 0.5);
tl.fromTo("#pr-dot", { opacity: 1, attr: { cx: 1010 } }, { attr: { cx: 1460 }, duration: 1.0, ease: "power1.inOut", immediateRender: false }, at(0, 0.62));
tl.to("#pr-dot", { opacity: 0, duration: 0.2 }, at(0, 0.62) + 1.0);
IN("#pr-f2", at(0, 0.62) + 1.0, 0.4, { scale: 0.6, svgOrigin: "1640 475" }, { scale: 1, svgOrigin: "1640 475" });
IN("#pr-rpc", at(0, 0.78), 0.6, { y: 14 }, { y: 0 });
// L1 f(x) → JSON 卡片外壳
OUT("#pr-loc, #pr-m1, #pr-m2, #pr-f1, #pr-net, #pr-rpc", at(1, 0), 0.4);
tl.to("#pr-f2m", { x: -680, duration: 0.7, ease: "power2.inOut" }, at(1, 0.06));
tl.to("#pr-f2", { opacity: 0, duration: 0.3 }, at(1, 0.06) + 0.6);
IN("#pr-req", at(1, 0.06) + 0.55, 0.6, { scale: 0.4, svgOrigin: "960 470" }, { scale: 1, svgOrigin: "960 470" });
IN("#pr-hd", at(1, 0.5), 0.5, { y: 10 }, { y: 0 });
// L2 四个字段
IN("#pr-r0", at(2, 0.06), 0.4, { x: -10 }, { x: 0 }); IN("#pr-a0", at(2, 0.1), 0.4);
IN("#pr-r1", at(2, 0.3), 0.4, { x: -10 }, { x: 0 }); IN("#pr-a1", at(2, 0.34), 0.4);
IN("#pr-r2", at(2, 0.55), 0.4, { x: -10 }, { x: 0 }); IN("#pr-a2", at(2, 0.59), 0.4);
IN("#pr-r3", at(2, 0.78), 0.4, { x: -10 }, { x: 0 }); IN("#pr-a3", at(2, 0.82), 0.4);
// L3 发出、带同一个 id 回来
OUT("#pr-a0, #pr-a1, #pr-a2, #pr-a3, #pr-hd", at(3, 0), 0.35);
tl.to("#pr-reqm", { x: -460, duration: 0.7, ease: "power2.inOut" }, at(3, 0.04));
IN("#pr-node", at(3, 0.08), 0.5, { x: 20 }, { x: 0 });
tl.fromTo("#pr-dot2", { opacity: 1, attr: { cx: 900 } }, { attr: { cx: 1690 }, duration: 0.6, ease: "power1.in", immediateRender: false }, at(3, 0.2));
tl.to("#pr-dot2", { opacity: 0, duration: 0.15 }, at(3, 0.2) + 0.6);
IN("#pr-res", at(3, 0.34), 0.5);
tl.fromTo("#pr-resm", { x: 140 }, { x: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, at(3, 0.34));
tl.fromTo("#pr-gold", { opacity: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut", immediateRender: false }, at(3, 0.6));
tl.to("#pr-gold", { strokeWidth: 7, duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.6) + 0.6);
// L4 result
IN("#pr-result", at(4, 0.05), 0.5, { x: -10 }, { x: 0 });
tl.to("#pr-res > rect", { strokeWidth: 6, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.1));
IN("#pr-hex", at(4, 0.55), 0.5, { y: 10 }, { y: 0 });
// L5 error 取代 result
OUT("#pr-res, #pr-result, #pr-hex, #pr-gold", at(5, 0), 0.35);
IN("#pr-err", at(5, 0.08), 0.5);
tl.fromTo("#pr-errm", { y: 120 }, { y: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, at(5, 0.08));
tl.to("#pr-err > rect", { strokeWidth: 6, duration: 0.3, yoyo: true, repeat: 1 }, at(5, 0.5));
// L6 curl
IN("#pr-tb", at(6, 0.02), 0.5, { y: 20 }, { y: 0 });
IN("#pr-b0", at(6, 0.12), 0.4, { y: 10 }, { y: 0 });
IN("#pr-b1", at(6, 0.3), 0.4, { y: 10 }, { y: 0 });
IN("#pr-b2", at(6, 0.42), 0.4, { y: 10 }, { y: 0 });
IN("#pr-b3", at(6, 0.54), 0.4, { y: 10 }, { y: 0 });
IN("#pr-os", at(6, 0.8), 0.5);
      /*ENDANIM*/

      tl.to("#pr-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["proto"] = tl;
    })();
  </script>
