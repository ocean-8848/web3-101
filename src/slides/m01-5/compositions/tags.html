      // L0 链长出，latest 标签飞到最右端变成旗

      tl.to("#ta-fl", { y: -10, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, at(0, 0.82));

      IN("#ta-c2", at(2, 0.3), 0.5, { y: 10 }, { y: 0 });
      OUT("#ta-term", at(2, 0.1), 0.4);
      for (let i = 6; i <= 8; i++) tl.to("#ta-b" + i, { stroke: "#83C167", duration: 0.3 }, at(2, 0.6) + (i - 6) * 0.35);
      // L3 finalized + 锁

      IN("#ta-ff", at(3, 0.04), 0.5, { y: -30 }, { y: 0 });

      for (let i = 0; i <= 5; i++) tl.to("#ta-b" + i, { fill: "#83C167", stroke: "#83C167", duration: 0.3 }, at(3, 0.24) + i * 0.05);
      IN("#ta-lockt", at(3, 0.4), 0.5);
      IN("#ta-c3", at(3, 0.7), 0.5, { y: 10 }, { y: 0 });
      // L4 算一算
      OUT("#ta-c3", at(4, 0), 0.3);
      IN("#ta-calc", at(4, 0.03), 0.5);
      IN("#ta-k1", at(4, 0.06), 0.5, { x: -16 }, { x: 0 });
      IN("#ta-rul", at(4, 0.42), 0.5);
      IN("#ta-k2", at(4, 0.45), 0.5, { x: -16 }, { x: 0 });
      IN("#ta-k3", at(4, 0.76), 0.5, { x: -16 }, { x: 0 });
      // L5 50 万 USDC 沿链滑到 finalized
      OUT("#ta-calc, #ta-k1, #ta-k2, #ta-k3, #ta-rul", at(5, 0), 0.4);

      tl.fromTo("#ta-usm", { x: 0 }, { x: -800, duration: 2.0, ease: "power2.inOut", immediateRender: false }, at(5, 0.3));

      tl.to("#ta-usr", { stroke: "#83C167", duration: 0.3 }, at(5, 0.6));
      IN("#ta-ok", at(5, 0.62), 0.4, { scale: 0.4, svgOrigin: "850 690" }, { scale: 1, svgOrigin: "850 690" });
      // L6 pending 虚线块 + 请求卡
      OUT("#ta-us, #ta-ok", at(6, 0), 0.4);
      IN("#ta-pl", at(6, 0.08), 0.3);
      IN("#ta-pb", at(6, 0.1), 0.5, { y: -20 }, { y: 0 });
      IN("#ta-pt", at(6, 0.22), 0.4);
      IN("#ta-rq", at(6, 0.6), 0.5, { y: 14 }, { y: 0 });
