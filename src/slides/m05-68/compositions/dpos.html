      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

      // 静态生成 27 个 SR 圆环节点（确定性几何）
      const ns = "http://www.w3.org/2000/svg";
      const nodesG = document.getElementById("dp-nodes");

        const ang = (-Math.PI / 2) + (i * 2 * Math.PI / 27);
        const cx = 1390 + 230 * Math.cos(ang);
        const cy = 590 + 230 * Math.sin(ang);
        pts.push({ cx, cy });
        const c = document.createElementNS(ns, "circle");
        c.setAttribute("cx", cx.toFixed(1));
        c.setAttribute("cy", cy.toFixed(1));
        c.setAttribute("r", "12");
        c.setAttribute("fill", "#161a22");
        c.setAttribute("stroke", "#B48EF0");
        c.setAttribute("stroke-width", "3");
        nodesG.appendChild(c);
      }

      // L0: DPoS 投票
      IN("#dp-title", at(0, 0.04), 0.5);
      IN("#dp-holders", at(0, 0.14), 0.6, { x: -24 }, { x: 0 });
      ARROW("#dp-a0", at(0, 0.34), 0.5);
      IN("#dp-tp", at(0, 0.40), 0.5, { y: 16 }, { y: 0 });
      IN("#dp-term1", at(0, 0.54), 0.5);
      IN("#dp-cands", at(0, 0.58), 0.55, { x: 24 }, { x: 0 });
      ["#dp-v1", "#dp-v2", "#dp-v3", "#dp-v4"].forEach((s, idx) => ARROW(s, at(0, 0.68 + idx * 0.05), 0.45));

      // L1: 前 27 名成为 SR，圆环轮流出块，每 6 小时刷新
      OUT("#dp-s0", at(1, 0.0), 0.35);
      IN("#dp-rank", at(1, 0.08), 0.45);
      const widths = [580, 520, 470, 390, 310, 200];
      widths.forEach((w, idx) => {
        tl.fromTo(`#dp-b${idx + 1}`, { attr: { width: 0 } }, { attr: { width: w }, duration: 0.65, ease: "power2.out", immediateRender: false }, at(1, 0.14 + idx * 0.05));
      });
      IN("#dp-ring", at(1, 0.36), 0.6);
      // 轮流出块高光沿前几个节点跳动
      const turnKeys = [1, 2, 3, 4, 5, 6].map(k => ({
        attr: { cx: pts[k].cx.toFixed(1), cy: pts[k].cy.toFixed(1) },
        duration: 0.45,
        ease: "power1.inOut"
      }));
      tl.to("#dp-turn", { keyframes: turnKeys }, at(1, 0.44));
      IN("#dp-clk", at(1, 0.64), 0.5, { y: -12 }, { y: 0 });
      OUT("#dp-term1", at(1, 0.84), 0.4);

      // L2: 出块奖励 8 TRX + 投票奖励 128 TRX 分前 127
      OUT("#dp-s1", at(2, 0.0), 0.35);
      IN("#dp-blk", at(2, 0.06), 0.5, { y: -24 }, { y: 0 });
      ARROW("#dp-ra1", at(2, 0.20), 0.5);
      IN("#dp-rw1", at(2, 0.26), 0.55, { y: 20 }, { y: 0 });
      ARROW("#dp-ra2", at(2, 0.52), 0.5);
      IN("#dp-rw2", at(2, 0.58), 0.55, { y: 20 }, { y: 0 });
      IN("#dp-dots", at(2, 0.78), 0.5, { y: -12 }, { y: 0 });

      // L3: 3 秒出块 + 固化块
      OUT("#dp-s2", at(3, 0.0), 0.35);
      IN("#dp-c1", at(3, 0.06), 0.45, { x: -16 }, { x: 0 });
      ARROW("#dp-ca1", at(3, 0.14), 0.35);
      IN("#dp-ct1", at(3, 0.16), 0.3);
      IN("#dp-c2", at(3, 0.22), 0.45, { x: -16 }, { x: 0 });
      ARROW("#dp-ca2", at(3, 0.30), 0.35);
      IN("#dp-ct2", at(3, 0.32), 0.3);
      IN("#dp-c3", at(3, 0.38), 0.45, { x: -16 }, { x: 0 });
      IN("#dp-term2", at(3, 0.46), 0.5);
      ARROW("#dp-ca3", at(3, 0.50), 0.35);
      IN("#dp-ct3", at(3, 0.52), 0.3);
      IN("#dp-c4", at(3, 0.58), 0.45);
      ARROW("#dp-ca4", at(3, 0.66), 0.35);
      IN("#dp-c5", at(3, 0.72), 0.45);
      // 块 N 和 N+1 变绿固化
      tl.to(["#dp-cr1", "#dp-cr2"], { stroke: "#83C167", duration: 0.45 }, at(3, 0.74));
      OUT(["#dp-cs1a", "#dp-cs2a"], at(3, 0.72), 0.25);
      IN(["#dp-cs1b", "#dp-cs2b"], at(3, 0.77), 0.35);
      IN("#dp-sol", at(3, 0.80), 0.5, { y: 12 }, { y: 0 });

      // L4: 算一算 19 块 ≈ 57 秒 + 实测对照
      IN("#dp-calc", at(4, 0.04), 0.5, { y: 20 }, { y: 0 });
      IN("#dp-eq1", at(4, 0.10), 0.5, { x: -16 }, { x: 0 });
      IN("#dp-eq3", at(4, 0.36), 0.5, { x: -16 }, { x: 0 });
      OUT("#dp-term2", at(4, 0.62), 0.4);
      IN("#dp-eql", at(4, 0.68), 0.35);
      IN("#dp-emp", at(4, 0.72), 0.55, { y: 14 }, { y: 0 });

      tl.to("#dp-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#dp-term2", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["dpos"] = tl;
    })();
  </script>
</template>
