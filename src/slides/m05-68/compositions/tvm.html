  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "linear", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const navOn = (id, t) => { IN(id, t, 0.4); tl.to(id, { fill: "#F0B90B", duration: 0.3 }, t); };
      const navDim = (id, t) => tl.to(id, { fill: "#6b6f7a", duration: 0.3 }, t);

      // L0: EVM vs TVM + 表头
      IN("#tv-evm", at(0, 0.06), 0.5, { x: -20 }, { x: 0 });
      IN("#tv-tvm", at(0, 0.18), 0.5, { x: 20 }, { x: 0 });
      ARROW("#tv-compat", at(0, 0.34), 0.65);
      IN("#tv-clb", at(0, 0.44), 0.5);
      IN("#tv-frame", at(0, 0.72), 0.55, { y: 16 }, { y: 0 });

      // L1: 手续费 + fee_limit 滑块
      navOn("#tv-n1", at(1, 0.04));
      IN("#tv-d1", at(1, 0.06), 0.2);
      IN("#tv-d1-evm", at(1, 0.08), 0.5, { x: -16 }, { x: 0 });
      IN("#tv-d1-tvm", at(1, 0.24), 0.5, { x: 16 }, { x: 0 });
      IN("#tv-d1-notip", at(1, 0.42), 0.45, { y: 12 }, { y: 0 });
      IN("#tv-fl", at(1, 0.56), 0.5, { y: 18 }, { y: 0 });
      tl.to("#tv-flbar", { attr: { width: 470 }, duration: 1.8, ease: "power2.inOut" }, at(1, 0.68));
      tl.to("#tv-flknob", { attr: { cx: 1580 }, duration: 1.8, ease: "power2.inOut" }, at(1, 0.68));
      tl.to("#tv-fl rect:first-of-type", { attr: { "stroke-width": 4.5 }, duration: 0.35, yoyo: true, repeat: 1 }, at(1, 0.88));

      // L2: 重放保护（nonce vs TAPOS 60s 倒数）
      OUT("#tv-d1", at(2, 0.0), 0.3);
      navDim("#tv-n1", at(2, 0.0));
      navOn("#tv-n2", at(2, 0.05));
      IN("#tv-d2", at(2, 0.10), 0.5, { x: -16 }, { x: 0 });
      ARROW("#tv-refa", at(2, 0.26), 0.5);
      COUNT("#tv-sec", 60, 0, at(2, 0.38), 2.8, v => `${Math.round(v)} s`);
      tl.to("#tv-tbar", { attr: { width: 0 }, duration: 2.8, ease: "linear" }, at(2, 0.38));
      tl.to("#tv-txr", { stroke: "#6b6f7a", duration: 0.4 }, at(2, 0.72));
      tl.to("#tv-txt", { fill: "#6b6f7a", duration: 0.4 }, at(2, 0.72));
      IN("#tv-exp", at(2, 0.74), 0.45, { y: 12 }, { y: 0 });

      // L3: CREATE2 前缀 0xff vs 0x41
      OUT("#tv-d2", at(3, 0.0), 0.3);
      navDim("#tv-n2", at(3, 0.0));
      navOn("#tv-n3", at(3, 0.05));
      IN("#tv-d3", at(3, 0.08), 0.2);
      IN("#tv-d3-evm", at(3, 0.12), 0.5, { x: -16 }, { x: 0 });
      IN("#tv-d3-tvm", at(3, 0.38), 0.5, { x: 16 }, { x: 0 });
      IN("#tv-c2w", at(3, 0.68), 0.5, { y: 16 }, { y: 0 });

      // L4a: TRX 转入合约
      OUT("#tv-d3", at(4, 0.0), 0.3);
      navDim("#tv-n3", at(4, 0.0));
      navOn("#tv-n4", at(4, 0.04));
      IN("#tv-d4", at(4, 0.07), 0.45);
      IN("#tv-p1", at(4, 0.12), 0.4);
      ARROW("#tv-a41", at(4, 0.16), 0.55);
      IN("#tv-p2", at(4, 0.30), 0.4);
      ARROW("#tv-a42", at(4, 0.34), 0.55);
      IN("#tv-c4ok", at(4, 0.42), 0.35);

      // L4b: 80 ms 时限与 3 MiB 内存上限
      OUT("#tv-d4", at(4, 0.52), 0.3);
      navDim("#tv-n4", at(4, 0.52));
      navOn("#tv-n5", at(4, 0.56));
      IN("#tv-d5", at(4, 0.58), 0.35);
      IN("#tv-lim1", at(4, 0.60), 0.45, { y: 18 }, { y: 0 });
      IN("#tv-lim2", at(4, 0.70), 0.45, { y: 18 }, { y: 0 });
      tl.fromTo("#tv-memf", { attr: { width: 0 } }, { attr: { width: 320 }, duration: 1.0, ease: "power2.out", immediateRender: false }, at(4, 0.74));
