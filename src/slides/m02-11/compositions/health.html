  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // 价格 p、债务 d → 滑块 x 与 HF 指针 x
      const PX = p => 420 + (p - 1800) * 700 / 1500;
      const HX = h => 1260 + (Math.min(Math.max(h, 0.6), 1.8) - 0.6) * 540 / 1.2;
      const st = { p: 3000, d: 5000 };
      const kn = document.querySelector("#he-knc"), knv = document.querySelector("#he-knv");
      const hp = document.querySelector("#he-hp"), hv = document.querySelector("#he-hv");
      const paint = () => {
        const x = PX(st.p), h = st.p * 3 * 0.825 / st.d, hx = HX(h);
        kn.setAttribute("cx", x); knv.setAttribute("x", x);
        knv.textContent = Math.round(st.p).toLocaleString("en-US");
        hp.setAttribute("d", `M${hx - 12} 866 L${hx + 12} 866 L${hx} 882 z`);
        hv.setAttribute("x", hx); hv.textContent = h.toFixed(st.dig || 3);
        hv.setAttribute("fill", h < 1 ? "#FC6255" : "#83C167");
      };
      const MOVE = (to, t, d = 1.2, ease = "power2.inOut") => tl.to(st, { ...to, duration: d, ease, onUpdate: paint }, t);
      // L0 公式 + 刻度表
      IN("#he-f", at(0, 0.05), 0.7, { y: 20 }, { y: 0 });
      IN("#he-term", at(0, 0.12), 0.5);
      IN("#he-g", at(0, 0.5), 0.6);
      IN("#he-gp", at(0, 0.55), 0.3);
      tl.fromTo("#he-gp", { x: 0 }, { x: -440, duration: 1.2, ease: "power2.inOut", immediateRender: false }, at(0, 0.7));
      tl.to("#he-gp", { x: 0, duration: 1.0, ease: "power2.inOut" }, at(0, 0.84));
      OUT("#he-term", at(0, 0.97), 0.4);
      // L1 一图看懂
      OUT("#he-f, #he-g, #he-gp", at(1, 0), 0.4);
      IN("#he-b1", at(1, 0.08), 0.6, { y: -20 }, { y: 0 });
      IN("#he-b2", at(1, 0.3), 0.6, { y: -20 }, { y: 0 });
      IN("#he-b3", at(1, 0.55), 0.6, { y: -20 }, { y: 0 });
      // L2 汇入中框
      ARROW("#he-a1", at(2, 0.02)); ARROW("#he-a2", at(2, 0.06)); ARROW("#he-a3", at(2, 0.1));
      IN("#he-mid", at(2, 0.3), 0.6, { scale: 0.9, svgOrigin: "960 412" }, { scale: 1, svgOrigin: "960 412" });
      COUNT("#he-hfv", 0, 1.485, at(2, 0.4), 1.6, v => v.toFixed(3));
      tl.to("#he-b1, #he-b3", { y: -8, duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.6));
      tl.to("#he-mid", { y: -10, duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.85));
      // L3 清算价
      IN("#he-grn", at(3, 0.02), 0.5);
      IN("#he-redb", at(3, 0.06), 0.5);
      IN("#he-s1", at(3, 0.1), 0.5);
      IN("#he-s2", at(3, 0.2), 0.5);
      IN("#he-s3", at(3, 0.3), 0.5, { scale: 1.3, svgOrigin: "1376 728" }, { scale: 1, svgOrigin: "1376 728" });
      IN("#he-lp1", at(3, 0.34), 0.5);
      ARROW("#he-drop", at(3, 0.5), 0.9); IN("#he-dropt", at(3, 0.56), 0.5);
      IN("#he-sl", at(3, 0.62), 0.5); IN("#he-kn", at(3, 0.62), 0.5);
      MOVE({ p: 2020 }, at(3, 0.7), 3.0);
      // L4 借到 7,500
      OUT("#he-d5", at(4, 0.02), 0.3);
      tl.to("#he-d7", { opacity: 1, duration: 0.4 }, at(4, 0.07));
      tl.to("#he-b3r", { stroke: "#FC6255", duration: 0.4 }, at(4, 0.07));
      OUT("#he-mid, #he-a1, #he-a2, #he-a3", at(4, 0.04), 0.4);
      OUT("#he-s1, #he-s2, #he-s3, #he-drop, #he-dropt, #he-lp1", at(4, 0.1), 0.4);
      MOVE({ p: 3000 }, at(4, 0.1), 1.0);
      MOVE({ d: 7500 }, at(4, 0.2), 1.2);
      IN("#he-t1", at(4, 0.2), 0.5);
      IN("#he-t2", at(4, 0.3), 0.5);
      IN("#he-t3", at(4, 0.42), 0.5, { scale: 1.3, svgOrigin: "1376 728" }, { scale: 1, svgOrigin: "1376 728" });
      IN("#he-lp2", at(4, 0.46), 0.4);
      tl.to("#he-red", { x: 780, duration: 1.2, ease: "power3.inOut" }, at(4, 0.55));
      tl.to("#he-grn rect", { stroke: "#FC6255", duration: 0.3, yoyo: true, repeat: 3 }, at(4, 0.7));
      // L5 回到 5,000，价格抖动
      OUT("#he-t1, #he-t2, #he-t3, #he-lp2", at(5, 0.0), 0.35);
      tl.to("#he-d7", { opacity: 0, duration: 0.3 }, at(5, 0.0));
      tl.to("#he-d5", { opacity: 1, duration: 0.4 }, at(5, 0.06));
      tl.to("#he-b3r", { stroke: "#F0B90B", duration: 0.4 }, at(5, 0.06));
      tl.to("#he-red", { x: 0, duration: 1.0, ease: "power3.inOut" }, at(5, 0.08));
      IN("#he-lp1", at(5, 0.25), 0.4);
      MOVE({ d: 5000 }, at(5, 0.05), 0.9);
      [3080, 2930, 3120, 2890, 3050, 2960, 3010].forEach((p, i) => MOVE({ p }, at(5, 0.25) + i * 0.55, 0.5, "sine.inOut"));

      tl.to("#he-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#he-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["health"] = tl;
    })();
  </script>
