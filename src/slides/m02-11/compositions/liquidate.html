  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const GX = h => 460 + (h - 0.6) * 1000 / 1.2;
      const gk = { h: 1.485 };
      const gp = document.querySelector("#li-gp"), gv = document.querySelector("#li-gv");
      const gpaint = () => { const x = GX(gk.h); gp.setAttribute("d", `M${x - 12} 518 L${x + 12} 518 L${x} 544 z`); gv.setAttribute("x", x); gv.textContent = gk.h < 1 ? gk.h.toFixed(4) : gk.h.toFixed(2); gv.setAttribute("fill", gk.h < 1 ? "#FC6255" : "#83C167"); };
      gpaint();
      // L0 HF 落到 0.9999（3 × 2,020 × 0.825 ÷ 5,000）
      IN("#li-g", at(0, 0.02), 0.5); IN("#li-gk", at(0, 0.05), 0.4);
      tl.to(gk, { h: 0.9999, duration: 2.0, ease: "power2.in", onUpdate: gpaint }, at(0, 0.2));
      tl.to("#li-gr", { opacity: 0.3, duration: 0.25, yoyo: true, repeat: 3 }, at(0, 0.65));
      // L1 时序图
      OUT("#li-g, #li-gk", at(1, 0), 0.4);
      IN("#li-lanes", at(1, 0.06), 0.6);
      IN("#li-mg", at(1, 0.1), 0.5);
      ARROW("#li-m1", at(1, 0.22), 0.6); IN("#li-m1t", at(1, 0.26), 0.4);
      IN("#li-bots", at(1, 0.45), 0.5, { y: 20 }, { y: 0 });
      ARROW("#li-poll", at(1, 0.55), 0.7); IN("#li-pollt", at(1, 0.6), 0.4);
      tl.to("#li-bot1", { x: 12, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, at(1, 0.7));
      tl.to("#li-bot3", { x: -12, duration: 0.35, yoyo: true, repeat: 5, ease: "sine.inOut" }, at(1, 0.72));
      // L2 调用清算 + 两项检查
      IN("#li-term", at(2, 0.0), 0.5);
      tl.to("#li-bot2 rect", { stroke: "#e8e6df", duration: 0.3 }, at(2, 0.02));
      ARROW("#li-m2", at(2, 0.05), 0.6); IN("#li-m2t", at(2, 0.1), 0.5);
      IN("#li-c1", at(2, 0.5), 0.4); DRAW("#li-c1k", at(2, 0.6), 0.4);
      IN("#li-c2", at(2, 0.72), 0.4); DRAW("#li-c2k", at(2, 0.82), 0.4);
      OUT("#li-term", at(2, 0.62), 0.4);
      // L3 算一算 1.30 ETH
      IN("#li-col, #li-cut, #li-c3", at(3, 0.02), 0.5);
      IN("#li-calc", at(3, 0.15), 0.6);
      tl.to("#li-bot2", { y: 12, duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.3));
      tl.to("#li-col", { opacity: 0.5, duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.42));
      tl.to("#li-cut", { y: -150, duration: 1.0, ease: "power2.inOut" }, at(3, 0.55));
      IN("#li-cutt", at(3, 0.8), 0.4);
      // L4 清算后
      OUT("#li-calc, #li-cutt", at(4, 0.0), 0.35);
      OUT("#li-cut", at(4, 0.02), 0.4);
      IN("#li-rem", at(4, 0.1), 0.4);
      IN("#li-post", at(4, 0.15), 0.6);
      const mk = { h: 0.9999 };
      const mp = document.querySelector("#li-mp"), mv = document.querySelector("#li-mv");
      const MX = h => 1300 + (h - 0.8) * 700 / 1;
      tl.to(mk, { h: 1.13, duration: 1.4, ease: "power2.out", onUpdate: () => { const x = MX(mk.h); mp.setAttribute("d", `M${x - 12} 222 L${x + 12} 222 L${x} 240 z`); mv.setAttribute("x", x); mv.textContent = mk.h < 1 ? mk.h.toFixed(4) : mk.h.toFixed(2); mv.setAttribute("fill", mk.h < 1 ? "#FC6255" : "#83C167"); } }, at(4, 0.6));
      // L5 只缩一半
      OUT("#li-lanes, #li-m1, #li-m1t, #li-bots, #li-poll, #li-pollt, #li-m2, #li-m2t, #li-c1, #li-c1k, #li-c2, #li-c2k, #li-col, #li-c3, #li-rem, #li-post, #li-mg", at(5, 0), 0.4);
      IN("#li-half", at(5, 0.08), 0.5);
      tl.to("#li-hd", { attr: { width: 500 }, duration: 1.0, ease: "power2.inOut" }, at(5, 0.2));
      tl.to("#li-hc", { attr: { width: 567 }, duration: 1.0, ease: "power2.inOut" }, at(5, 0.2));
      IN("#li-hdv, #li-hcv", at(5, 0.3), 0.4);
      IN("#li-nc", at(5, 0.4), 0.5);
      IN("#li-nc2", at(5, 0.75), 0.5);
      // L6 天平
      OUT("#li-half, #li-hdv, #li-hcv, #li-nc, #li-nc2", at(6, 0), 0.4);
      IN("#li-scale", at(6, 0.06), 0.6);
      tl.to("#li-beam", { rotation: -8, svgOrigin: "960 420", duration: 0.8, ease: "power2.inOut" }, at(6, 0.2));
      IN("#li-sl", at(6, 0.25), 0.5);
      tl.to("#li-beam", { rotation: 8, svgOrigin: "960 420", duration: 1.0, ease: "power2.inOut" }, at(6, 0.5));
      IN("#li-sr", at(6, 0.55), 0.5);
      tl.to("#li-beam", { rotation: 0, svgOrigin: "960 420", duration: 0.9, ease: "power2.inOut" }, at(6, 0.85));

      tl.to("#li-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#li-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);

    })();
