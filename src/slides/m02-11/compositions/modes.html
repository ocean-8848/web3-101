  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 四个笼子
      ["#mo-k1", "#mo-k2", "#mo-k3", "#mo-k4"].forEach((s, i) => IN(s, at(0, 0.1 + i * 0.15), 0.5, { y: 20 }, { y: 0 }));
      const LIT = (k, t) => { tl.to(`#mo-k${k} .cg`, { stroke: "#e8e6df", duration: 0.4 }, t); if (k > 1) tl.to(`#mo-k${k - 1} .cg`, { stroke: "#8a8f99", duration: 0.4 }, t); };
      // L1 隔离
      LIT(1, at(1, 0.02));
      IN("#mo-term", at(1, 0.05), 0.5);
      IN("#mo-c1", at(1, 0.1), 0.5, { scale: 0.7, svgOrigin: "260 490" }, { scale: 1, svgOrigin: "260 490" });
      DRAW("#mo-c1l", at(1, 0.35), 0.6); IN("#mo-c1lt", at(1, 0.38), 0.4);
      IN("#mo-c1u", at(1, 0.42), 0.4);
      IN("#mo-cost1", at(1, 0.75), 0.5);
      OUT("#mo-term", at(1, 0.8), 0.4);
      // L2 E-mode
      LIT(2, at(2, 0.02));
      IN("#mo-term2", at(2, 0.05), 0.5);
      IN("#mo-c2", at(2, 0.1), 0.5);
      tl.to("#mo-e1", { attr: { cx: 650 }, duration: 0.6 }, at(2, 0.18));
      tl.to("#mo-e4", { attr: { cx: 800 }, duration: 0.6 }, at(2, 0.18));
      IN("#mo-ltv, #mo-ltvt", at(2, 0.3), 0.3);
      tl.to("#mo-ltv", { attr: { width: 276 }, duration: 1.0, ease: "power2.out" }, at(2, 0.3));
      IN("#mo-cost2", at(2, 0.5), 0.5);
      OUT("#mo-term2", at(2, 0.55), 0.4);
      tl.to("#mo-e3", { fill: "#FC6255", duration: 0.3 }, at(2, 0.72));
      tl.to("#mo-e3", { attr: { cy: 520 }, duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.72));
      tl.to("#mo-e1, #mo-e2, #mo-e4", { fill: "#FC6255", duration: 0.5, stagger: 0.12 }, at(2, 0.8));
      tl.to("#mo-k2r", { stroke: "#FC6255", duration: 0.4 }, at(2, 0.85));
      tl.to("#mo-ltv", { fill: "#FC6255", duration: 0.4 }, at(2, 0.85));
      // L3 上限
      LIT(3, at(3, 0.02));
      IN("#mo-c3", at(3, 0.06), 0.4);
      tl.to("#mo-exp", { attr: { y: 492, height: 268 }, duration: 1.4, ease: "power2.out" }, at(3, 0.08));
      DRAW("#mo-lid", at(3, 0.2), 0.5); IN("#mo-lidt", at(3, 0.22), 0.4);
      IN("#mo-boom", at(3, 0.45), 0.2);
      tl.to("#mo-boom", { attr: { r: 140 }, duration: 1.2, ease: "power3.out" }, at(3, 0.45));
      IN("#mo-cost3", at(3, 0.72), 0.5);
      // L4 多预言机
      LIT(4, at(4, 0.02));
      IN("#mo-c4", at(4, 0.06), 0.4);
      DRAW("#mo-c4l", at(4, 0.15), 0.6);
      IN("#mo-c4a", at(4, 0.3), 0.4);
      DRAW("#mo-hb", at(4, 0.45), 1.4);
      IN("#mo-cost4", at(4, 0.7), 0.5);
      tl.to("#mo-k4 .cg", { stroke: "#8a8f99", duration: 0.4 }, at(4, 0.95));
      // L5 闪电贷
      OUT("#mo-cages", at(5, 0), 0.5);
      IN("#mo-fl", at(5, 0.04), 0.5);
      IN("#mo-f1", at(5, 0.08), 0.4); IN("#mo-f2", at(5, 0.13), 0.4); IN("#mo-f3", at(5, 0.18), 0.4);
      ["#mo-u1", "#mo-u2", "#mo-u3", "#mo-u4"].forEach((s, i) => IN(s, at(5, 0.32 + i * 0.07), 0.4, { y: -12 }, { y: 0 }));
      ARROW("#mo-ra", at(5, 0.7), 0.8); IN("#mo-rat", at(5, 0.74), 0.5);
      tl.to("#mo-u1, #mo-u2, #mo-u3, #mo-u4", { y: -10, duration: 0.25, yoyo: true, repeat: 1, stagger: 0.2 }, at(5, 0.88));
      // L6 stETH
      OUT("#mo-fl, #mo-f1, #mo-f2, #mo-f3, #mo-u1, #mo-u2, #mo-u3, #mo-u4, #mo-ra, #mo-rat", at(6, 0), 0.4);
      IN("#mo-col", at(6, 0.08), 0.4);
      IN("#mo-st", at(6, 0.1), 0.6, { scale: 0.6, svgOrigin: "960 520" }, { scale: 1, svgOrigin: "960 520" });
      IN("#mo-qm", at(6, 0.3), 0.4);
      IN("#mo-next", at(6, 0.45), 0.4);

      tl.to("#mo-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#mo-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["modes"] = tl;
    })();
  </script>
