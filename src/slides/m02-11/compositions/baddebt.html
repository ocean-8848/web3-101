        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      ARROW("#ba-ar2", at(3, 0.55), 0.6);

      IN("#ba-rate, #ba-rex", at(3, 0.7), 0.4);
      COUNT("#ba-rv", 0.021, 0.0203, at(3, 0.78), 1.2, v => v.toFixed(4));
      // L4 机器人流程环
      OUT("#ba-hole, #ba-jar, #ba-jf, #ba-ar1, #ba-ar2, #ba-deps, #ba-rate, #ba-rex", at(4, 0), 0.4);

      ["#ba-n1", "#ba-n2", "#ba-n3", "#ba-n4", "#ba-n5"].forEach((s, i) => {
        const t = at(4, 0.08 + i * 0.17);

      });
      tl.to("#ba-n5 rect", { stroke: "#8a8f99", strokeWidth: 3, duration: 0.3 }, at(4, 0.94));
      // L5 赛道
