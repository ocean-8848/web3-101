      IN("#mo-hl", at(4, 0.02), 0.3);
      tl.set("#mo-hl", { attr: { y: rowY(5), height: 44 } }, at(4, 0));
      IN("#mo-toml", at(4, 0.04));
      ARROW("#mo-a1", at(4, 0.12), 0.5);
      IN("#mo-so", at(4, 0.16), 0.5);
      ARROW("#mo-a2", at(4, 0.27), 0.5);
      IN("#mo-libd", at(4, 0.3), 0.5);
      tl.to("#mo-thl", { attr: { y: 350 }, duration: 0.35 }, at(4, 0.42));
      IN("#mo-sw", at(4, 0.45), 0.5);
      tl.to("#mo-knob", { attr: { cx: 1072 }, fill: "#83C167", duration: 0.35 }, at(4, 0.56));
      ARROW("#mo-a3", at(4, 0.6), 0.5);
      IN("#mo-other", at(4, 0.6), 0.5);
      IN("#mo-iface", at(4, 0.66), 0.5, { x: -40 }, { x: 0 });
      tl.to("#mo-thl", { attr: { y: 400 }, duration: 0.35 }, at(4, 0.78));

      // L5 init-if-needed

      IN("#mo-sw2", at(5, 0.05), 0.5);
      IN("#mo-acct", at(5, 0.15), 0.5);
      tl.to("#mo-knob2", { attr: { cx: 1082 }, fill: "#FF9F43", duration: 0.35 }, at(5, 0.3));
      OUT("#mo-off", at(5, 0.3), 0.3);
