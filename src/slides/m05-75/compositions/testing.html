    (function () {

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const rowY = i => 250 + 46 * i;
      const HL = (i, t, n = 1, col = "#58C4DD") => tl.to("#te-hl,#te-hlb", { attr: { y: rowY(i), height: 46 * n - 4 }, fill: col, duration: 0.35, ease: "power2.inOut" }, t);

      IN("#te-sw2", at(0, 0.5), 0.4);
      tl.to("#te-cA", { opacity: 1, duration: 0.4 }, at(0, 0.55));

      // L1 测试金字塔
      OUT(["#te-sw1", "#te-sw2"], at(1, 0), 0.3);
      HL(5, at(1, 0.02));
      IN("#te-py1", at(1, 0.1), 0.6, { y: 20 }, { y: 0 });
      IN("#te-py2", at(1, 0.55), 0.6, { y: 20 }, { y: 0 });

      IN("#te-err", at(2, 0.2), 0.5);
      HL(2, at(2, 0.4), 3);
      HL(5, at(2, 0.6), 4);
      IN("#te-u128", at(2, 0.62), 0.4);
      HL(9, at(2, 0.8), 2, "#83C167");
      IN("#te-try", at(2, 0.82), 0.4);

      // L3 fee 999 × 30 bps

      IN("#te-cC", at(3, 0.04), 0.5);
      HL(2, at(3, 0.06), 2, "#58C4DD");
      IN("#te-f1", at(3, 0.3), 0.5);
      IN("#te-f2", at(3, 0.7), 0.5);
      IN("#te-bx1", at(3, 0.82), 0.4, { y: 12 }, { y: 0 });
      IN("#te-bx2", at(3, 0.88), 0.4, { y: 12 }, { y: 0 });

      IN("#te-dn", at(4, 0.05), 0.4);
      ["#te-p1", "#te-p2", "#te-p3"].forEach((s, i) => IN(s, at(4, 0.25 + i * 0.05), 0.4, { y: -12 }, { y: 0 }));
      ["#te-z1", "#te-z2", "#te-z3"].forEach((s, i) => IN(s, at(4, 0.45 + i * 0.05), 0.35));
      IN("#te-zero", at(4, 0.62), 0.4);
      IN("#te-rule", at(4, 0.8), 0.5, { scale: 0.9, svgOrigin: "1450 750" }, { scale: 1, svgOrigin: "1450 750" });

      IN("#te-t2", at(5, 0.1), 0.3);

      IN("#te-t4", at(5, 0.22), 0.4);
      IN("#te-t5", at(5, 0.38), 0.4);
      IN("#te-t6", at(5, 0.55), 0.4);
      IN("#te-t7", at(5, 0.62), 0.4);
      IN("#te-t8", at(5, 0.68), 0.4);
      IN("#te-repo", at(5, 0.82), 0.5);

      tl.to("#te-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
