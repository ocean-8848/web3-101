      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      HL(0, 2, at(1, 0));
      IN("#sy-vd", at(1, 0.08), 0.4, { y: 15 }, { y: 0 });

      tl.to("#sy-hl, #sy-hb", { opacity: 0, duration: 0.3 }, at(2, 0));
      for (let i = 0; i < 5; i++) IN(`#sy-i${i}`, at(2, 0.06 + i * 0.07), 0.4, { x: -20 }, { x: 0 });
      IN("#sy-i5", at(2, 0.45), 0.5);
      // L3 结构体
      OUT("#sy-ints", at(3, 0), 0.4);
      HL(2, 5, at(3, 0.02));
      IN("#sy-st", at(3, 0.08), 0.7, { scale: 0.9, svgOrigin: "1450 375" }, { scale: 1, svgOrigin: "1450 375" });

      // L4 接收者
      OUT("#sy-new", at(4, 0), 0.3);
      HL(7, 2, at(4, 0.02));
      IN("#sy-r0", at(4, 0.18), 0.5, { y: 20 }, { y: 0 });

      // L5 枚举

      HL(10, 2, at(5, 0.02));
      IN("#sy-et", at(5, 0.06), 0.4);
      IN("#sy-d0", at(5, 0.1), 0.5, { x: 30 }, { x: 0 });
      IN("#sy-d1", at(5, 0.16), 0.5, { x: 30 }, { x: 0 });
      IN("#sy-d2", at(5, 0.22), 0.5, { x: 30 }, { x: 0 });
      IN("#sy-sol", at(5, 0.32), 0.5);
      tl.to("#sy-d0 circle, #sy-d1 circle", { attr: { r: 32 }, duration: 0.25, yoyo: true, repeat: 1 }, at(5, 0.5));
      IN("#sy-anc", at(5, 0.75), 0.5);
      // L6 match 漏分支
      OUT("#sy-code1", at(6, 0), 0.3);
      OUT("#sy-sol, #sy-anc", at(6, 0), 0.3);
      IN("#sy-code2", at(6, 0.06), 0.4);
      HL(3, 1, at(6, 0.1));

      tl.to("#sy-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
