  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

      // ===== 测验版式（与 EP009 quiz 一致）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q2-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q2-q", at(0, 0.05), 0.01);
      tl.fromTo("#q2-qcr", { attr: { width: 0 } }, { attr: { width: 1400 }, duration: 2.4, ease: "none" }, at(0, 0.08));
      IN("#q2-q2", at(0, 0.05), 0.01);
      tl.fromTo("#q2-qcr2", { attr: { width: 0 } }, { attr: { width: 1400 }, duration: 2.4, ease: "none" }, at(0, 0.08) + 2.4);
      const SHOW = (k, t) => {
        IN(`#q2-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q2-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q2-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#q2-pause", at(2, 0.0), 0.3);
        tl.fromTo("#q2-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#q2-pause", at(3, 0.0), 0.3);
      };
      const RIGHT = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q2-o${k}-t`, { attr: { y: Y0[k] + 52 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q2-o${k}-n`, t + 0.3, 0.5);
      };
      const PULSE = (s, t, color, back) => {
        tl.to(s, { stroke: color, strokeWidth: 5, duration: 0.25 }, t);
        tl.to(s, { stroke: back, strokeWidth: 3, duration: 0.5 }, t + 1.2);
      };

      // L0 调用链逐段长出
      IN("#q2-own", at(0, 0.333), 0.5, { y: -10 }, { y: 0 });
      ARROW("#q2-a1", at(0, 0.45), 0.5);
      IN("#q2-mal", at(0, 0.5), 0.5, { y: -10 }, { y: 0 });
      ARROW("#q2-a2", at(0, 0.7), 0.5);
      IN("#q2-vault", at(0, 0.75), 0.5, { y: -10 }, { y: 0 });
      // L1 选项
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.301)); SHOW("C", at(1, 0.645)); SHOW("D", at(1, 0.849));
      PULSE("#q2-malb", at(1, 0.12), "#e8e6df", "#FC6255");
      PULSE("#q2-ownb", at(1, 0.5), "#e8e6df", "#83C167");
      PULSE("#q2-vaultb", at(1, 0.88), "#e8e6df", "#F0B90B");
      // L2 暂停
      PAUSE();
      // L3 揭晓 B：tx.origin 一路不变，检查通过，钱流向恶意合约
      RIGHT("B", at(3, 0.03));
      IN("#q2-to1", at(3, 0.3), 0.5, { x: -10 }, { x: 0 });
      IN("#q2-to2", at(3, 0.5), 0.5, { x: -10 }, { x: 0 });
      IN("#q2-chk1", at(3, 0.7), 0.5);
      PULSE("#q2-vaultb", at(3, 0.7), "#83C167", "#F0B90B");
      ARROW("#q2-money", at(3, 0.82), 0.7);
      // L4 A 错：变的是 msg.sender；C、D 无关
      WRONG("A", at(4, 0.02));
      IN("#q2-ms1", at(4, 0.28), 0.5, { x: -10 }, { x: 0 });
      IN("#q2-ms2", at(4, 0.4), 0.5, { x: -10 }, { x: 0 });
      PULSE("#q2-malb", at(4, 0.4), "#FC6255", "#FC6255");
      WRONG("C", at(4, 0.736));
      WRONG("D", at(4, 0.736));
      // L5 改用 msg.sender，恶意合约被挡回
      OUT("#q2-chk1, #q2-money", at(5, 0.05), 0.4);
      IN("#q2-chk2", at(5, 0.05) + 0.5, 0.5);
      PULSE("#q2-vaultb", at(5, 0.25), "#83C167", "#83C167");
      tl.to("#q2-a2", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.4));
      IN("#q2-x", at(5, 0.45), 0.4, { scale: 0.5, svgOrigin: "1267 750" }, { scale: 1, svgOrigin: "1267 750", ease: "back.out(2)" });

      tl.to("#q2-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz2"] = tl;
    })();
  </script>
