  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

      // ===== 测验版式（与 quiz1 一致）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q5-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q5-q", at(0, 0.05), 0.01);
      tl.fromTo("#q5-qcr", { attr: { width: 0 } }, { attr: { width: 1400 }, duration: 2.2, ease: "none" }, at(0, 0.08));
      IN("#q5-q2", at(0, 0.05), 0.01);
      tl.fromTo("#q5-qcr2", { attr: { width: 0 } }, { attr: { width: 1100 }, duration: 2.0, ease: "none" }, at(0, 0.08) + 2.2);
      const SHOW = (k, t) => {
        IN(`#q5-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q5-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q5-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#q5-pause", at(2, 0.0), 0.3);
        tl.fromTo("#q5-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#q5-pause", at(3, 0.0), 0.3);
      };
      const RIGHT = (k, t) => {
        tl.to(`#q5-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q5-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q5-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q5-o${k}-t`, { attr: { y: Y0[k] + 52 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q5-o${k}-n`, t + 0.3, 0.5);
      };
      const PULSE = (s, t, color, back) => {
        tl.to(s, { stroke: color, strokeWidth: 4, duration: 0.25 }, t);
        tl.to(s, { stroke: back, strokeWidth: 2.5, duration: 0.5 }, t + 1.2);
      };

      // L0 题干 + 计算板与已知数
      IN("#q5-pan", at(0, 0.36), 0.6);
      IN("#q5-r0", at(0, 0.42), 0.5, { x: -12 }, { x: 0 });
      PULSE("#q5-pan", at(0, 0.7), "#58C4DD", "#3a3f4a");
      // L1 选项
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.25)); SHOW("C", at(1, 0.5)); SHOW("D", at(1, 0.8));
      // L2 暂停
      PAUSE();
      // L3 揭晓 D：整数除法截断
      RIGHT("D", at(3, 0.03));
      IN("#q5-r1", at(3, 0.22), 0.5, { x: -12 }, { x: 0 });
      IN("#q5-sc", at(3, 0.36), 0.3, { x: 16 }, { x: 0 });
      DRAW("#q5-cut", at(3, 0.38), 0.4);
      tl.set("#q5-cut", { opacity: 1 }, at(3, 0.38));
      tl.to("#q5-dec", { fill: "#6b6f7a", duration: 0.4 }, at(3, 0.42));
      IN("#q5-r2", at(3, 0.45), 0.5, { x: -12 }, { x: 0 });
      IN("#q5-r3", at(3, 0.6), 0.5, { x: -12 }, { x: 0 });
      IN("#q5-coin", at(3, 0.72), 0.4);
      tl.to("#q5-coinf", { opacity: 0, duration: 0.6 }, at(3, 0.84));
      tl.to("#q5-coinh", { opacity: 1, duration: 0.6 }, at(3, 0.84));
      // L4 A 是先乘后除；C、B 错
      WRONG("A", at(4, 0.02));
      DRAW("#q5-div", at(4, 0.08), 0.5);
      tl.set("#q5-div", { opacity: 1 }, at(4, 0.08));
      IN("#q5-r4l", at(4, 0.1), 0.4);
      IN("#q5-r4", at(4, 0.14), 0.5, { x: -12 }, { x: 0 });
      IN("#q5-r5", at(4, 0.3), 0.5, { x: -12 }, { x: 0 });
      IN("#q5-r5n", at(4, 0.36), 0.5);
      PULSE("#q5-oA-box", at(4, 0.4), "#83C167", "#FC6255");
      WRONG("C", at(4, 0.6));
      WRONG("B", at(4, 0.84));
      // L5 精度三条规矩
      IN("#q5-k1", at(5, 0.08), 0.5, { x: -16 }, { x: 0 });
      IN("#q5-k2", at(5, 0.45), 0.5, { x: -16 }, { x: 0 });
      IN("#q5-k3", at(5, 0.68), 0.5, { x: -16 }, { x: 0 });

      tl.to("#q5-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz5"] = tl;
    })();
