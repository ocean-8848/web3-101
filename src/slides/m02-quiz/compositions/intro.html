  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // ===== L0 两组：必修（蓝实线）/ 选修（橙虚线）=====

      IN("#in-gOpt", at(0, 0.18), 0.6, { scale: 0.85, svgOrigin: "1310 540" }, { scale: 1, svgOrigin: "1310 540", ease: "back.out(1.6)" });

      IN("#in-lAud", at(0, 0.72), 0.5, { y: 10 }, { y: 0 });
      IN("#in-lByte", at(0, 0.86), 0.5, { y: 10 }, { y: 0 });

      // ===== L1 圆点缩小上移；术语卡；三个标签 =====
      OUT("#in-lEVM, #in-lAud, #in-lByte", at(1, 0.0), 0.35);
      tl.to("#in-dotsMove", { y: -300, duration: 0.9, ease: "power2.inOut" }, at(1, 0.03));
      tl.to("#in-dots", { scale: 0.75, svgOrigin: "960 540", duration: 0.9, ease: "power2.inOut" }, at(1, 0.03));
      IN("#in-term", at(1, 0.08), 0.6);
      IN("#in-t1", at(1, 0.38), 0.5, { y: 20 }, { y: 0 });
      IN("#in-t2", at(1, 0.55), 0.5, { y: 20 }, { y: 0 });
      IN("#in-t3", at(1, 0.74), 0.5, { y: 20 }, { y: 0 });

      // ===== L2 售货机 =====
      OUT("#in-term", at(2, 0.0), 0.35);
      OUT("#in-t1, #in-t2, #in-t3, #in-dotsMove", at(2, 0.0), 0.35);
      IN("#in-vm", at(2, 0.06), 0.7, { scale: 0.9, svgOrigin: "960 600" }, { scale: 1, svgOrigin: "960 600" });
      IN("#in-coin", at(2, 0.2), 0.3);
      tl.to("#in-coin", { attr: { cx: 1085 }, duration: 0.6, ease: "power2.in" }, at(2, 0.22));
      tl.to("#in-coin", { opacity: 0, duration: 0.2 }, at(2, 0.22) + 0.6);
      tl.to("#in-btn", { fill: "#83C167", stroke: "#83C167", duration: 0.3 }, at(2, 0.33));
      tl.set("#in-canF", { opacity: 1 }, at(2, 0.43));
      tl.set("#in-can0", { opacity: 0 }, at(2, 0.43));
      tl.to("#in-canF", { attr: { y: 798 }, duration: 0.7, ease: "bounce.out" }, at(2, 0.43));
      IN("#in-rule", at(2, 0.6), 0.6, { scale: 1.15, svgOrigin: "960 703" }, { scale: 1, svgOrigin: "960 703" });
      IN("#in-clerk", at(2, 0.8), 0.5);
      DRAW("#in-x1", at(2, 0.86), 0.5);

      // ===== L3 两格对照 → The DAO =====
      OUT("#in-clerk", at(3, 0.0), 0.35);
      IN("#in-cellA", at(3, 0.04), 0.6, { x: 30 }, { x: 0 });
      IN("#in-cellBbox", at(3, 0.2), 0.5);
      IN("#in-cellB", at(3, 0.2), 0.6, { x: 30 }, { x: 0 });
      ["#in-fc0", "#in-fc1", "#in-fc2"].forEach((s, j) => {
        IN(s, at(3, 0.3) + j * 0.15, 0.2);
        tl.to(s, { attr: { cx: 1860 }, opacity: 0, duration: 1.0, ease: "power2.in" }, at(3, 0.32) + j * 0.15);
      });
      OUT("#in-cellB", at(3, 0.47), 0.4);
      IN("#in-dao", at(3, 0.5), 0.6);
      IN("#in-bar", at(3, 0.5), 0.6);
      // 先转账（三次反复），账面余额一直是 1，金库在流失
      for (let k = 0; k < 3; k++) {
        const t0 = at(3, 0.56) + k * 1.25;
        ARROW("#in-darr", t0, 0.3);
        tl.fromTo("#in-dc", { opacity: 1, attr: { cx: 1470 } }, { attr: { cx: 1590 }, duration: 0.55, ease: "power1.in", immediateRender: false }, t0 + 0.05);
        tl.to("#in-dc", { opacity: 0, duration: 0.1 }, t0 + 0.6);
        tl.to("#in-bar", { attr: { width: 170 * (2 - k) / 3 }, duration: 0.4 }, t0 + 0.5);
        if (k < 2) {
          ARROW("#in-dback", t0 + 0.65, 0.45);
          tl.to("#in-dback", { opacity: 0, duration: 0.15 }, t0 + 1.15);
        }
        tl.to("#in-darr", { opacity: 0, duration: 0.1 }, t0 + 1.1);
        tl.to("#in-bk", { fill: "#FC6255", duration: 0.15, yoyo: true, repeat: 1 }, t0 + 0.6);
      }
      // 最后才记账：账面变 0
      tl.set("#in-bk", { textContent: "0" }, at(3, 0.56) + 3.9);
      tl.to("#in-bk", { fill: "#FC6255", duration: 0.3 }, at(3, 0.56) + 3.9);
      IN("#in-daoBig", at(3, 0.86), 0.6, { scale: 0.9, svgOrigin: "1530 955" }, { scale: 1, svgOrigin: "1530 955" });

      // ===== L4 问题卡 =====
      OUT("#in-vm, #in-canF, #in-rule, #in-cellA, #in-cellBbox, #in-dao, #in-bar, #in-daoBig", at(4, 0.0), 0.4);
      IN("#in-qcard", at(4, 0.06), 0.7, { scale: 0.92, svgOrigin: "960 490" }, { scale: 1, svgOrigin: "960 490" });
      tl.to("#in-w1", { fill: "#58C4DD", duration: 0.3 }, at(4, 0.36));
      tl.to("#in-w2", { fill: "#83C167", duration: 0.3 }, at(4, 0.43));
      tl.to("#in-w3", { fill: "#B48EF0", duration: 0.3 }, at(4, 0.5));
      IN("#in-n1", at(4, 0.7), 0.5, { y: 15 }, { y: 0 });
      ARROW("#in-n12", at(4, 0.8), 0.4);
      IN("#in-n2", at(4, 0.88), 0.5, { y: 15 }, { y: 0 });

      tl.to("#in-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#in-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["intro"] = tl;
