  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

      // ===== 测验版式（与 EP009 quiz 一致）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q3-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q3-q", at(0, 0.05), 0.01);
      tl.fromTo("#q3-qcr", { attr: { width: 0 } }, { attr: { width: 1400 }, duration: 2.4, ease: "none" }, at(0, 0.08));
      IN("#q3-q2", at(0, 0.05), 0.01);
      tl.fromTo("#q3-qcr2", { attr: { width: 0 } }, { attr: { width: 1400 }, duration: 2.4, ease: "none" }, at(0, 0.08) + 2.4);
      const SHOW = (k, t) => {
        IN(`#q3-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q3-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q3-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#q3-pause", at(2, 0.0), 0.3);
        tl.fromTo("#q3-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#q3-pause", at(3, 0.0), 0.3);
      };
      const RIGHT = (k, t) => {
        tl.to(`#q3-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q3-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q3-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q3-o${k}-t`, { attr: { y: Y0[k] + 52 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q3-o${k}-n`, t + 0.3, 0.5);
      };
      const PULSE = (s, t, color, back) => {
        tl.to(s, { stroke: color, strokeWidth: 5, duration: 0.25 }, t);
        tl.to(s, { stroke: back, strokeWidth: 3, duration: 0.5 }, t + 1.2);
      };

      // L0 金库 → Safe 的 Gas 管道
      IN("#q3-vault", at(0, 0.15), 0.5, { y: -10 }, { y: 0 });
      IN("#q3-safe", at(0, 0.45), 0.5, { y: -10 }, { y: 0 });
      IN("#q3-pipe", at(0, 0.62), 0.5);
      IN("#q3-meter", at(0, 0.72), 0.5, { y: 10 }, { y: 0 });
      // L1 选项
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.148)); SHOW("C", at(1, 0.231)); SHOW("D", at(1, 0.472));
      PULSE("#q3-safeb", at(1, 0.03), "#e8e6df", "#B48EF0");
      PULSE("#q3-vaultb", at(1, 0.16), "#e8e6df", "#F0B90B");
      tl.to("#q3-meter", { fill: "#e8e6df", duration: 0.25 }, at(1, 0.6));
      tl.to("#q3-meter", { fill: "#FF9F43", duration: 0.4 }, at(1, 0.6) + 1.2);
      PULSE("#q3-pipe", at(1, 0.787), "#e8e6df", "#58C4DD");
      PULSE("#q3-safeb", at(1, 0.9), "#83C167", "#B48EF0");
      // L2 暂停
      PAUSE();
      // L3 揭晓 D：Gas 流进 Safe，齿轮转一半停下，ETH 退回
      RIGHT("D", at(3, 0.03));
      ["#q3-gas1", "#q3-gas2", "#q3-gas3"].forEach((s, i) => {
        const t = at(3, 0.08) + i * 0.3;
        tl.fromTo(s, { opacity: 1, attr: { cx: 1380 } }, { attr: { cx: 1630 }, duration: 0.8, ease: "none", immediateRender: false }, t);
        tl.to(s, { opacity: 0, duration: 0.1 }, t + 0.8);
      });
      IN("#q3-eth", at(3, 0.1), 0.3);
      tl.to("#q3-eth", { attr: { cx: 1615 }, duration: 1.0, ease: "power1.inOut" }, at(3, 0.15));
      IN("#q3-logic", at(3, 0.3), 0.4);
      tl.fromTo("#q3-g1", { rotation: 0 }, { rotation: 140, svgOrigin: "1705 660", duration: 1.4, ease: "power2.out", immediateRender: false }, at(3, 0.35));
      tl.fromTo("#q3-g2", { rotation: 0 }, { rotation: -160, svgOrigin: "1777 676", duration: 1.4, ease: "power2.out", immediateRender: false }, at(3, 0.35));
      IN("#q3-oog", at(3, 0.6), 0.4, { y: 8 }, { y: 0 });
      tl.to("#q3-eth", { attr: { cx: 1385 }, duration: 0.9, ease: "power1.inOut" }, at(3, 0.7));
      // L4 C 说反了：两根管道对照；A、B 也错
      WRONG("C", at(4, 0.02));
      OUT("#q3-logic, #q3-oog, #q3-eth", at(4, 0.02), 0.4);
      IN("#q3-cmp1", at(4, 0.1), 0.5, { x: -10 }, { x: 0 });
      IN("#q3-cmp2", at(4, 0.377), 0.5, { x: -10 }, { x: 0 });
      WRONG("A", at(4, 0.472));
      WRONG("B", at(4, 0.547));
      // L5 换成 call：ETH 进入 Safe；对方回头再进，被闸门挡下
      OUT("#q3-cmp1, #q3-cmp2, #q3-meter", at(5, 0.0), 0.4);
      tl.to("#q3-pipe", { attr: { y: 450, height: 30 }, fill: "#1d3640", duration: 0.5 }, at(5, 0.04));
      IN("#q3-meter2", at(5, 0.04) + 0.45, 0.5);
      tl.fromTo("#q3-eth", { opacity: 1, attr: { cx: 1385 } }, { attr: { cx: 1740 }, duration: 1.0, ease: "power1.inOut", immediateRender: false }, at(5, 0.1));
      tl.to("#q3-eth", { opacity: 0, duration: 0.3 }, at(5, 0.1) + 1.0);
      IN("#q3-ok", at(5, 0.1) + 1.0, 0.4);
      ARROW("#q3-re", at(5, 0.3), 0.9);
      IN("#q3-rel", at(5, 0.33), 0.4);
      IN("#q3-gate", at(5, 0.6), 0.4, { scaleX: 0.2, svgOrigin: "1270 532" }, { scaleX: 1, svgOrigin: "1270 532" });
      IN("#q3-gatel", at(5, 0.62), 0.5, { y: 8 }, { y: 0 });
      PULSE("#q3-vaultb", at(5, 0.65), "#83C167", "#F0B90B");

      tl.to("#q3-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz3"] = tl;
    })();
