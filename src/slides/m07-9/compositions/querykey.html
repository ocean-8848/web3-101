  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const POP = (s, t, cx, cy, d = 0.4) => IN(s, t, d, { scale: 0.6, svgOrigin: cx + " " + cy }, { scale: 1, svgOrigin: cx + " " + cy });

      // L0 术语卡 + 缓存 + 钥匙由四块拼成
      IN("#qu-term", at(0, 0.02), 0.5);
      OUT("#qu-term", at(0, 0.82), 0.4);
      IN("#qu-cache", at(0, 0.1), 0.6, { y: 20 }, { y: 0 });
      IN("#qu-cell3", at(0, 0.1), 0.6, { y: 20 }, { y: 0 });
      IN("#qu-head", at(0, 0.28), 0.5, { x: -30 }, { x: 0 });
      IN("#qu-kl", at(0, 0.32), 0.5);
      ["#qu-b0", "#qu-b1", "#qu-b2", "#qu-b3"].forEach((s, i) => IN(s, at(0, 0.56 + i * 0.1), 0.45, { y: -40 }, { y: 0 }));
      ARROW("#qu-ins", at(0, 0.88), 0.4);
      tl.to("#qu-cell", { stroke: "#58C4DD", duration: 0.3 }, at(0, 0.91));
      IN(["#qu-vlab", "#qu-vA"], at(0, 0.92), 0.4);

      // L1 少了链 ID 和地址 → 旧数据
      IN("#qu-acct", at(1, 0.02), 0.4);
      IN("#qu-aA", at(1, 0.02), 0.4);
      tl.to(["#qu-b0", "#qu-b1"], { y: -60, opacity: 0, duration: 0.5, ease: "power2.in" }, at(1, 0.08));
      IN(["#qu-g0", "#qu-g1"], at(1, 0.14), 0.4);
      OUT("#qu-aA", at(1, 0.3), 0.25);
      IN("#qu-aB", at(1, 0.33), 0.3, { scale: 0.6, svgOrigin: "760 270" }, { scale: 1, svgOrigin: "760 270" });
      tl.to("#qu-ins", { opacity: 0.3, duration: 0.15, yoyo: true, repeat: 1 }, at(1, 0.42));
      tl.to("#qu-vA", { fill: "#FC6255", duration: 0.2, yoyo: true, repeat: 3 }, at(1, 0.46));
      tl.to("#qu-cell", { stroke: "#FC6255", duration: 0.3 }, at(1, 0.46));
      IN("#qu-old", at(1, 0.5), 0.4);
      OUT(["#qu-old", "#qu-g0", "#qu-g1"], at(1, 0.74), 0.3);
      tl.fromTo(["#qu-b0", "#qu-b1"], { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, at(1, 0.78));
      OUT("#qu-vA", at(1, 0.86), 0.25);
      IN("#qu-vB", at(1, 0.88), 0.4);
      tl.to("#qu-cell", { stroke: "#83C167", duration: 0.3 }, at(1, 0.88));

      // L2 staleTime 卡：名称 / 小数位 → Infinity
      IN("#qu-c1", at(2, 0.03), 0.6, { x: 40 }, { x: 0 });
      tl.to("#qu-cell", { stroke: "#2a2f3a", duration: 0.4 }, at(2, 0.1));
      IN("#qu-ra", at(2, 0.55), 0.5);
      IN("#qu-va", at(2, 0.75), 0.5, { x: 20 }, { x: 0 });
      tl.to("#qu-ra rect", { opacity: 0.55, duration: 0.4, yoyo: true, repeat: 3 }, at(2, 0.82));

      // L3 余额 10 s + 失效；价格 0 + 新区块
      IN("#qu-rb", at(3, 0.02), 0.4);
      tl.to("#qu-fb", { attr: { width: 230 }, duration: 2.2, ease: "none" }, at(3, 0.06));
      IN("#qu-inv", at(3, 0.42), 0.3, { scale: 0.6, svgOrigin: "1543 330" }, { scale: 1, svgOrigin: "1543 330" });
      tl.to("#qu-fb", { attr: { width: 0 }, duration: 0.3, ease: "power2.in" }, at(3, 0.44));
      tl.to("#qu-fb", { attr: { width: 90 }, duration: 1.6, ease: "none" }, at(3, 0.52));
      OUT("#qu-inv", at(3, 0.66), 0.3);
      IN("#qu-rc", at(3, 0.6), 0.4);
      [0.7, 0.8, 0.9].forEach(f => {
        tl.to("#qu-blk", { fill: "#58C4DD", duration: 0.12, yoyo: true, repeat: 1 }, at(3, f));
        tl.fromTo("#qu-fc", { attr: { width: 270 }, opacity: 1 }, { attr: { width: 270 }, opacity: 0, duration: 0.4, immediateRender: false }, at(3, f));
      });

      // L4 gcTime + refetchOnWindowFocus
      IN("#qu-term2", at(4, 0.02), 0.5);
      OUT("#qu-term2", at(4, 0.75), 0.4);
      IN("#qu-c2", at(4, 0.06), 0.5, { x: 40 }, { x: 0 });
      IN("#qu-5m", at(4, 0.2), 0.4);
      IN("#qu-unused", at(4, 0.12), 0.4);
      DRAW("#qu-ring", at(4, 0.14), 1.8);
      tl.to(["#qu-cell3", "#qu-ring"], { opacity: 0, duration: 0.4 }, at(4, 0.14) + 1.9);
      OUT("#qu-unused", at(4, 0.14) + 1.9, 0.4);
      IN("#qu-c3", at(4, 0.56), 0.5, { x: 40 }, { x: 0 });
      tl.to("#qu-tab", { attr: { x: 1480 }, duration: 0.4, ease: "power2.inOut" }, at(4, 0.66));
      IN("#qu-fy", at(4, 0.7), 0.4);
      IN("#qu-fn", at(4, 0.86), 0.4);

      // L5 placeholderData + retry
      OUT(["#qu-c2", "#qu-5m", "#qu-c3", "#qu-fy", "#qu-fn"], at(5, 0), 0.4);
      IN("#qu-c4", at(5, 0.05), 0.5, { x: 40 }, { x: 0 });
      IN("#qu-p1", at(5, 0.05), 0.5, { x: 40 }, { x: 0 });
      OUT("#qu-p1", at(5, 0.18), 0.2);
      IN("#qu-p2", at(5, 0.19), 0.25);
      tl.to("#qu-qb", { opacity: 0.35, duration: 0.25 }, at(5, 0.19));
      IN("#qu-keep", at(5, 0.24), 0.4);
      tl.to("#qu-qb", { attr: { width: 220 }, opacity: 1, duration: 0.8, ease: "power2.inOut" }, at(5, 0.34));
      IN("#qu-c5", at(5, 0.5), 0.5, { x: 40 }, { x: 0 });
      IN("#qu-rt0", at(5, 0.62), 0.3);
      tl.fromTo("#qu-rt0", { rotation: 0, svgOrigin: "1180 820" }, { rotation: 360, svgOrigin: "1180 820", duration: 0.6, immediateRender: false }, at(5, 0.62));
      IN("#qu-rt1", at(5, 0.68), 0.3);
      tl.fromTo("#qu-rt1", { rotation: 0, svgOrigin: "1222 820" }, { rotation: 360, svgOrigin: "1222 820", duration: 0.6, immediateRender: false }, at(5, 0.68));
      IN("#qu-r2", at(5, 0.74), 0.4);
      IN("#qu-r0", at(5, 0.9), 0.4, { scale: 0.6, svgOrigin: "1560 820" }, { scale: 1, svgOrigin: "1560 820" });
