      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 local computer with anvil
      IN("#an-pc", at(0, 0.05), 0.6, { y: 20 }, { y: 0 });
      IN("#an-ham", at(0, 0.45), 0.6, { y: -20 }, { y: 0 });

      for (let i = 0; i < 5; i++) IN(`#an-m${i}`, at(1, 0.04) + i * 0.15, 0.3, { y: 10 }, { y: 0 });
      for (let i = 0; i < 4; i++) DRAW(`#an-ml${i}`, at(1, 0.06) + i * 0.15, 0.3);
      OUT("#an-ham", at(1, 0.12), 0.4);
      IN("#an-st", at(1, 0.16), 0.4);
      tl.to("#an-m3", { strokeWidth: 6, stroke: "#e8e6df", duration: 0.3 }, at(1, 0.2));
      IN("#an-bn", at(1, 0.22), 0.4);
      IN("#an-beam", at(1, 0.28), 0.6);
      IN("#an-box", at(1, 0.32), 0.6, { scale: 0.6, svgOrigin: "1150 480" }, { scale: 1, svgOrigin: "1150 480" });
      IN("#an-bt", at(1, 0.36), 0.4);
      IN("#an-lb", at(1, 0.38), 0.5);
      IN("#an-term", at(1, 0.3), 0.5);
      IN("#an-pool", at(1, 0.5), 0.5, { y: 15 }, { y: 0 });
      IN("#an-usdc", at(1, 0.62), 0.5, { y: 15 }, { y: 0 });
      IN("#an-free", at(1, 0.78), 0.4, { x: -15 }, { x: 0 });
      IN("#an-rew", at(1, 0.88), 0.4, { x: -15 }, { x: 0 });
      OUT("#an-term", at(1, 0.95), 0.4);
      // L2 external RPC jitter, then pin + cache
      OUT("#an-beam", at(2, 0.0), 0.4);
      tl.to("#an-m3", { strokeWidth: 3, stroke: "#58C4DD", duration: 0.3 }, at(2, 0.0));
      DRAW("#an-wire", at(2, 0.04), 0.5);
      IN("#an-wl", at(2, 0.06), 0.4);
      tl.to("#an-wire", { stroke: "#FF9F43", duration: 0.2 }, at(2, 0.14));
      tl.fromTo("#an-wire", { y: 0 }, { y: 7, duration: 0.12, yoyo: true, repeat: 9, ease: "sine.inOut", immediateRender: false }, at(2, 0.14));
      IN("#an-runs", at(2, 0.15), 0.4);
      IN("#an-x0", at(2, 0.2), 0.2); tl.to("#an-rc0", { stroke: "#FC6255", duration: 0.2 }, at(2, 0.2));
      IN("#an-v1", at(2, 0.26), 0.2); tl.to("#an-rc1", { stroke: "#83C167", duration: 0.2 }, at(2, 0.26));
      IN("#an-x2", at(2, 0.32), 0.2); tl.to("#an-rc2", { stroke: "#FC6255", duration: 0.2 }, at(2, 0.32));
      IN("#an-pin", at(2, 0.46), 0.4, { y: -40 }, { y: 0, ease: "back.out(2)" });
      IN("#an-pl", at(2, 0.5), 0.4);
      IN("#an-cache", at(2, 0.58), 0.5, { y: 15 }, { y: 0 });
      tl.to("#an-wire", { stroke: "#83C167", duration: 0.3 }, at(2, 0.62));
      OUT("#an-x0, #an-v1, #an-x2", at(2, 0.66), 0.3);
      tl.to("#an-rc0, #an-rc1, #an-rc2", { stroke: "#8a8f99", duration: 0.2 }, at(2, 0.66));
      [0, 1, 2].forEach(i => { IN(`#an-v${i}`, at(2, 0.74 + i * 0.07), 0.25); tl.to(`#an-rc${i}`, { stroke: "#83C167", duration: 0.25 }, at(2, 0.74 + i * 0.07)); });
      // L3 impersonate whale, transfer USDC (local only)
      OUT("#an-pool, #an-usdc, #an-free, #an-rew, #an-lb, #an-runs", at(3, 0.0), 0.4);
      IN("#an-wh", at(3, 0.12), 0.5);
      IN("#an-ta", at(3, 0.2), 0.5);
      IN("#an-mask", at(3, 0.4), 0.5, { y: -30 }, { y: 0 });
      IN("#an-cl", at(3, 0.52), 0.4);
      [0, 1, 2].forEach(i => { IN(`#an-co${i}`, at(3, 0.52) + i * 0.25, 0.15); tl.to(`#an-co${i}`, { x: 240, duration: 0.8, ease: "power2.inOut" }, at(3, 0.52) + i * 0.25 + 0.1); tl.to(`#an-co${i}`, { opacity: 0, duration: 0.2 }, at(3, 0.52) + i * 0.25 + 0.85); });
      IN("#an-only", at(3, 0.8), 0.5);

      IN("#an-ip", at(4, 0.5), 0.4);
      IN("#an-run", at(4, 0.72), 0.4, { x: -10 }, { x: 0 });
