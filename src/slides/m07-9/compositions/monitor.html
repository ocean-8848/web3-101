      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const RING = (s, cx, cy, t) => { IN(s, t, 0.2); tl.fromTo(s, { rotation: 0 }, { rotation: 16, svgOrigin: `${cx} ${cy - 16}`, duration: 0.1, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, t + 0.1); };

      IN("#mo-term", at(0, 0.02), 0.5);
      IN("#mo-code", at(0, 0.12), 0.5, { y: 20 }, { y: 0 });
      [0, 1, 2].forEach(i => IN(`#mo-pr${i}`, at(0, 0.22) + i * 0.3, 0.3, { scale: 2, svgOrigin: `${[400, 960, 1520][i]} 948` }, { scale: 1, svgOrigin: `${[400, 960, 1520][i]} 948` }));
      [0, 1, 2].forEach(i => IN(`#mo-p${i}`, at(0, 0.45) + i * 0.4, 0.5, { y: 20 }, { y: 0 }));
      [0, 1, 2].forEach(i => DRAW(`#mo-d${i}`, at(0, 0.55) + i * 0.4, 0.5));
      OUT("#mo-term", at(0, 0.78), 0.4);
      IN("#mo-ex", at(0, 0.88), 0.4);
      // L1 RPC failure rate & P95
      IN("#mo-r0", at(1, 0.02), 0.4);
      IN("#mo-t0, #mo-tl0", at(1, 0.06), 0.4);
      DRAW("#mo-c0", at(1, 0.1), 1.4);
      IN("#mo-w0", at(1, 0.28), 0.4);
      tl.to("#mo-c0", { stroke: "#FC6255", duration: 0.3 }, at(1, 0.3));
      RING("#mo-b0", 600, 335, at(1, 0.32));
      IN("#mo-r1", at(1, 0.48), 0.4);
      IN("#mo-t1, #mo-tl1", at(1, 0.52), 0.4);
      DRAW("#mo-c1", at(1, 0.56), 1.4);
      IN("#mo-w1", at(1, 0.78), 0.4);
      tl.to("#mo-c1", { stroke: "#FC6255", duration: 0.3 }, at(1, 0.84));
      RING("#mo-b1", 600, 635, at(1, 0.86));
      // L2 wallet connect funnel
      IN("#mo-f0", at(2, 0.05), 0.4, { x: -20 }, { x: 0 });
