      HL(2, at(1, 0.5));
      IN("#hi-gate", at(1, 0.55), 0.5, { x: -20 }, { x: 0 });
      ARROW("#hi-ga", at(1, 0.65), 0.6);

      // L2 cursor request

      HL(3, at(2, 0.02)); HL(4, at(2, 0.4));
      IN("#hi-req", at(2, 0.1), 0.5);
      ARROW("#hi-ra", at(2, 0.2), 0.7);
      IN("#hi-rl", at(2, 0.25), 0.4);
      for (let i = 0; i < 10; i++) IN(`#hi-r${i}`, at(2, 0.45) + i * 0.08, 0.35, { x: 20 }, { x: 0 });
      IN("#hi-c1", at(2, 0.82), 0.5, { y: -15 }, { y: 0 });
      // L3 getNextPageParam + offset vs cursor
      OUT("#hi-req, #hi-ra, #hi-rl", at(3, 0), 0.35);
      HL(5, at(3, 0.02));
      tl.to("#hi-c1b", { attr: { "stroke-width": 5 }, duration: 0.2, yoyo: true, repeat: 1 }, at(3, 0.05));
      tl.set("#hi-mv", { opacity: 1 }, at(3, 0.08));
      tl.set("#hi-c1", { opacity: 0 }, at(3, 0.08));
      IN("#hi-c1", at(3, 0.08) + 0.7, 0.4);
      tl.to("#hi-mv", { x: -1070, y: -130, duration: 0.8, ease: "power2.inOut" }, at(3, 0.08));

      IN("#hi-cur", at(3, 0.68), 0.6, { x: -20 }, { x: 0 });
      // L4 staleTime

      HL(6, at(4, 0.02));
      IN("#hi-st", at(4, 0.12), 0.5);
      IN("#hi-trk, #hi-tf", at(4, 0.18), 0.4);
      tl.to("#hi-tf", { attr: { width: 860 }, duration: 3.0, ease: "none" }, at(4, 0.22));

      tl.to("#hi-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["history"] = tl;
