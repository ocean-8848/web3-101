          const d = span * w / tot;
          tl.fromTo(`#q4-o${k}-u${j}`, { attr: { width: 0 } }, { attr: { width: w }, duration: d, ease: "none" }, t0);

        tl.to(`#q4-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
