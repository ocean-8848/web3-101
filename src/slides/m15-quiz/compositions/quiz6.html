    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const PULSE = (s, origin, t, k = 1.08) => tl.to(s, { scale: k, svgOrigin: origin, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.inOut" }, t);
      // ===== 测验版式（同 EP009 quiz1）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q6-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q6-q", at(0, 0.03), 0.01);
      tl.fromTo("#q6-qcr1", { attr: { width: 0 } }, { attr: { width: 1076 }, duration: 2.39, ease: "none" }, at(0, 0.04));
      tl.fromTo("#q6-qcr2", { attr: { width: 0 } }, { attr: { width: 420 }, duration: 0.93, ease: "none" }, at(0, 0.04) + 2.39);
      // L1 选项：念到时滑入并提亮描边；下划线随朗读推进
      const UW = {"A": [480], "B": [544], "C": [432], "D": [384]};
      const SHOW = (k, t, t2) => {
        IN(`#q6-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q6-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        const ws = UW[k], tot = ws.reduce((a, b) => a + b, 0), span = Math.max(0.6, t2 - t - 0.5);
        let t0 = t + 0.2;
        ws.forEach((w, j) => {
          const d = span * w / tot;
          tl.fromTo(`#q6-o${k}-u${j}`, { attr: { width: 0 } }, { attr: { width: w }, duration: d, ease: "none" }, t0);
          t0 += d;
          OUT(`#q6-o${k}-u${j}`, t2, 0.3);
        });
        tl.to(`#q6-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t2);
      };
      SHOW("A", at(1, 0.0), at(1, 0.259));
      SHOW("B", at(1, 0.259), at(1, 0.548));
      SHOW("C", at(1, 0.548), at(1, 0.785));
      SHOW("D", at(1, 0.785), at(1, 1.0));
      // L2 暂停：倒数圆环到 L3 开头
      IN("#q6-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q6-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[4][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      tl.to("#q6-ring", { stroke: "#83C167", duration: 0.3 }, at(3, 0.05));
        tl.to("#q6-pause rect", { fill: "#83C167", duration: 0.3 }, at(3, 0.05));
        OUT("#q6-pause", at(4, 0.0), 0.3);
      const RIGHT = (k, t) => {
        tl.to(`#q6-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q6-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q6-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q6-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q6-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q6-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q6-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q6-o${k}-t0`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q6-o${k}-n`, t + 0.3, 0.5);
      };

      // L0 示意区：链头区块串，快照落后 5 格，阈值在 3 格处
      for (let i = 0; i < 8; i++) {
        IN(`#q6-b${i}`, at(0, 0.08) + i * 0.12, 0.3, { y: -10 }, { y: 0 });
        if (i) IN(`#q6-bl${i}`, at(0, 0.08) + i * 0.12, 0.3);
      }
      IN("#q6-headl", at(0, 0.24), 0.4);
      IN("#q6-snap", at(0, 0.38), 0.4, { x: 40 }, { x: 0 });
      IN("#q6-lag", at(0, 0.5), 0.5);
      DRAW("#q6-thr", at(0, 0.64), 0.5);
      IN("#q6-thrl", at(0, 0.66), 0.4);
      IN("#q6-api", at(0, 0.82), 0.5, { y: 20 }, { y: 0 });
      // L1：选项念到时对应部件提示
      PULSE("#q6-lag", "1590 610", at(1, 0.1), 1.06);
      tl.to("#q6-apib", { stroke: "#e8e6df", duration: 0.3, yoyo: true, repeat: 1 }, at(1, 0.3));
      PULSE("#q6-snap", "1380 520", at(1, 0.82), 1.15);
      // L3 揭晓 B：报价接口亮橙灯 STALE_STATE，告警铃响
      RIGHT("B", at(4, 0.02));
      tl.to("#q6-b2", { stroke: "#FF9F43", duration: 0.3 }, at(4, 0.2));
      tl.to("#q6-lamp", { fill: "#FF9F43", stroke: "#FF9F43", duration: 0.3 }, at(4, 0.3));
      tl.to("#q6-apib", { stroke: "#FF9F43", duration: 0.3 }, at(4, 0.3));
      IN("#q6-stale", at(4, 0.34), 0.4, { x: -15 }, { x: 0 });
      IN("#q6-bell", at(4, 0.5), 0.4);
      tl.to("#q6-belli", { rotation: 14, svgOrigin: "1740 716", duration: 0.12, yoyo: true, repeat: 7, ease: "sine.inOut" }, at(4, 0.56));
      tl.to("#q6-lamp", { fill: "#2a2f3a", duration: 0.2, yoyo: true, repeat: 3 }, at(4, 0.78));
      // L4 干扰项
      WRONG("A", at(5, 0.02));
