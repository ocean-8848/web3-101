      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const PULSE = (s, origin, t, k = 1.08) => tl.to(s, { scale: k, svgOrigin: origin, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.inOut" }, t);

      const FOCUS = (k, t) => [0, 1, 2].forEach(j => {
        tl.to(`#pi-c${j}`, { opacity: j === k ? 1 : 0.35, duration: 0.4 }, t);
        tl.to(`#pi-cb${j}`, { strokeWidth: j === k ? 5 : 3, duration: 0.4 }, t);
        tl.to(`#pi-k${j + 1}`, { opacity: j === k ? 1 : 0.35, duration: 0.4 }, t);

      // L0 三张红边误区卡依次飞入
      IN("#pi-hd", at(0, 0.0), 0.4, { x: -20 }, { x: 0 });
      [0, 1, 2].forEach(j => IN(`#pi-c${j}`, at(0, 0.15) + j * 0.3, 0.5, { y: 60 }, { y: 0 }));
      // L1 卡 1：报价 = 成交价
      FOCUS(0, at(1, 0.0));
      IN("#pi-k1a", at(1, 0.08), 0.4);
      IN("#pi-k1b", at(1, 0.1), 0.5, { scale: 0.8, svgOrigin: "220 512" }, { scale: 1, svgOrigin: "220 512" });

      IN("#pi-k1c", at(1, 0.24), 0.5, { x: 20 }, { x: 0 });

      // L2 卡 2：三处划掉
      FOCUS(1, at(2, 0.0));
      IN("#pi-m0", at(2, 0.06), 0.4); IN("#pi-m1", at(2, 0.12), 0.4); IN("#pi-m2", at(2, 0.18), 0.4);
      DRAW("#pi-s0", at(2, 0.26), 0.3); DRAW("#pi-s1", at(2, 0.28), 0.3); DRAW("#pi-s2", at(2, 0.3), 0.3);
      IN("#pi-i0", at(2, 0.34), 0.4, { y: -12 }, { y: 0 });

      IN("#pi-t1", at(2, 0.58), 0.5, { x: -15 }, { x: 0 });

      IN("#pi-t2", at(2, 0.8), 0.5, { x: -15 }, { x: 0 });
      tl.to("#pi-i2b", { stroke: "#8a8f99", duration: 0.3 }, at(2, 0.9));
      OUT("#pi-i2t", at(2, 0.9), 0.2);
      IN("#pi-i2x", at(2, 0.9) + 0.25, 0.3);

      IN("#pi-ad0", at(3, 0.4), 0.4); IN("#pi-ad1", at(3, 0.42), 0.4);
      DRAW("#pi-ck0", at(3, 0.48), 0.4); DRAW("#pi-x0", at(3, 0.5), 0.4);
      tl.to("#pi-tk1 circle", { stroke: "#FC6255", duration: 0.3 }, at(3, 0.5));
      IN("#pi-pen", at(3, 0.56), 0.4, { y: -15 }, { y: 0 });

      IN("#pi-key", at(3, 0.63), 0.4);
      IN("#pi-kl", at(3, 0.65), 0.4);
      IN("#pi-sh", at(3, 0.74), 0.4);
      ARROW("#pi-ph", at(3, 0.84), 0.6);
      tl.to("#pi-sh path", { stroke: "#FC6255", duration: 0.3 }, at(3, 0.9));
      // L4 回到开头：钱包与交易长条；三枚绿勾
      OUT("#pi-hd, #pi-c0, #pi-c1, #pi-c2, #pi-k1, #pi-k2, #pi-k3", at(4, 0.0), 0.4);
      IN("#pi-wal", at(4, 0.06), 0.5, { x: -20 }, { x: 0 });
      IN("#pi-usdc", at(4, 0.12), 0.4);
      IN("#pi-strip", at(4, 0.26), 0.5);
      IN("#pi-same", at(4, 0.3), 0.5, { y: 10 }, { y: 0 });
