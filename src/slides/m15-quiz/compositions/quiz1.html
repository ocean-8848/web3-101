      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const POP = (s, t, o, d = 0.5) => IN(s, t, d, { scale: 0.7, svgOrigin: o }, { scale: 1, svgOrigin: o, ease: "back.out(1.8)" });
      const PULSE = (s, t, o, k = 1.08) => tl.to(s, { scale: k, svgOrigin: o, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);

      tl.fromTo("#qu-qcr2", { attr: { width: 0 } }, { attr: { width: 1500 }, duration: 3.4, ease: "none" }, at(0, 0.42) + 0.01);
      const SHOW = (k, t) => {
        IN(`#qu-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#qu-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#qu-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#qu-pause", at(2, 0.0), 0.3);
        tl.fromTo("#qu-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[4][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));

        tl.to("#qu-pause rect", { fill: "#83C167", duration: 0.3 }, at(3, 0.05));
