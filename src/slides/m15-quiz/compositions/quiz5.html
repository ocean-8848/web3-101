    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const PULSE = (s, origin, t, k = 1.08) => tl.to(s, { scale: k, svgOrigin: origin, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.inOut" }, t);
      // ===== 测验版式（同 EP009 quiz1）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q5-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q5-q", at(0, 0.03), 0.01);
      tl.fromTo("#q5-qcr1", { attr: { width: 0 } }, { attr: { width: 1252 }, duration: 2.78, ease: "none" }, at(0, 0.04));
      tl.fromTo("#q5-qcr2", { attr: { width: 0 } }, { attr: { width: 460 }, duration: 1.02, ease: "none" }, at(0, 0.04) + 2.78);
      // L1 选项：念到时滑入并提亮描边；下划线随朗读推进
      const UW = {"A": [512], "B": [608, 288], "C": [544], "D": [492]};
      const SHOW = (k, t, t2) => {
        IN(`#q5-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q5-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        const ws = UW[k], tot = ws.reduce((a, b) => a + b, 0), span = Math.max(0.6, t2 - t - 0.5);
        let t0 = t + 0.2;
        ws.forEach((w, j) => {
          const d = span * w / tot;
          tl.fromTo(`#q5-o${k}-u${j}`, { attr: { width: 0 } }, { attr: { width: w }, duration: d, ease: "none" }, t0);
          t0 += d;
          OUT(`#q5-o${k}-u${j}`, t2, 0.3);
        });
        tl.to(`#q5-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t2);
      };
      SHOW("A", at(1, 0.0), at(1, 0.214));
      SHOW("B", at(1, 0.214), at(1, 0.567));
      SHOW("C", at(1, 0.567), at(1, 0.793));
      SHOW("D", at(1, 0.793), at(1, 1.0));
      // L2 暂停：倒数圆环到 L3 开头
      IN("#q5-pause", at(2, 0.0), 0.3);
      tl.fromTo("#q5-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[4][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      tl.to("#q5-ring", { stroke: "#83C167", duration: 0.3 }, at(3, 0.05));
        tl.to("#q5-pause rect", { fill: "#83C167", duration: 0.3 }, at(3, 0.05));
        OUT("#q5-pause", at(4, 0.0), 0.3);
      const RIGHT = (k, t) => {
        tl.to(`#q5-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q5-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q5-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q5-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q5-o${k}-t0`, { attr: { y: Y0[k] + 50 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q5-o${k}-n`, t + 0.3, 0.5);
      };

      const F = v => Math.round(v).toLocaleString("en-US");
      // L0 示意区：借贷协议直接读池子储备
      IN("#q5-pool", at(0, 0.3), 0.6, { y: -20 }, { y: 0 });
      IN("#q5-lend", at(0, 0.36), 0.6, { y: 20 }, { y: 0 });
      DRAW("#q5-gr", at(0, 0.5), 0.5);
      IN("#q5-grl", at(0, 0.52), 0.4);
      IN("#q5-px", at(0, 0.62), 0.4);
      IN("#q5-bar", at(0, 0.8), 0.4);
      IN("#q5-barl", at(0, 0.82), 0.4);
      // L1：念到闪电贷、同名代币时提示
      PULSE("#q5-px", "1440 820", at(1, 0.05), 1.15);
      PULSE("#q5-poolb", "1360 465", at(1, 0.25), 1.04);
      tl.to("#q5-bar", { fillOpacity: 1, duration: 0.3, yoyo: true, repeat: 1 }, at(1, 0.4));
      // L3 揭晓 B：100 ETH / 300,000 USDC，换进 300,000 USDC → 50 / 600,000，现价 3,000 → 12,000
      RIGHT("B", at(4, 0.02));
      // “举个例子”起：闪电贷注入，L4 内全部做完
      PULSE("#q5-poolb", "1360 465", at(4, 0.14), 1.04);
      tl.to("#q5-ethn", { fill: "#e8e6df", duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.2));
      tl.to("#q5-usdn", { fill: "#e8e6df", duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.28));
      IN("#q5-fl", at(4, 0.36), 0.4, { x: 20 }, { x: 0 });
      ARROW("#q5-fa", at(4, 0.4), 0.5);
      IN("#q5-fal", at(4, 0.42), 0.4);
      COUNT("#q5-usdn", 300000, 600000, at(4, 0.48), 1.0, F);
      COUNT("#q5-ethn", 100, 50, at(4, 0.48), 1.0, F);
      tl.to("#q5-px", { fill: "#FC6255", duration: 0.3 }, at(4, 0.6));
      COUNT("#q5-px", 3000, 12000, at(4, 0.6), 1.2, F);
      tl.to("#q5-bar", { attr: { y: 680, height: 200 }, duration: 1.0, ease: "power2.out" }, at(4, 0.66));
      IN("#q5-x4", at(4, 0.8), 0.4, { scale: 1.6, svgOrigin: "1620 650" }, { scale: 1, svgOrigin: "1620 650" });
      ARROW("#q5-bw", at(4, 0.84), 0.5);
      IN("#q5-bwl", at(4, 0.86), 0.4);
      // L5 干扰项（示意区保持静止）
      WRONG("A", at(5, 0.02));
      tl.to("#q5-oA-dim", { opacity: 0.4, duration: 1.5, ease: "sine.inOut" }, at(5, 0.2));
      WRONG("C", at(5, 0.42));
      WRONG("D", at(5, 0.7));
      tl.to("#q5-oC-dim, #q5-oD-dim", { opacity: 0.4, duration: 1.4, ease: "sine.inOut" }, at(5, 0.88));
      // L6 开头：闪电贷结清、池子复原，再换成 TWAP / 外部预言机
      tl.to("#q5-flb", { stroke: "#8a8f99", duration: 0.4 }, at(6, 0.0));
      OUT("#q5-fa, #q5-fal", at(6, 0.0), 0.4);
      tl.to("#q5-flt", { opacity: 0, duration: 0.2 }, at(6, 0.0));
      IN("#q5-fld", at(6, 0.03), 0.4);
      COUNT("#q5-usdn", 600000, 300000, at(6, 0.03), 1.0, F);
      COUNT("#q5-ethn", 50, 100, at(6, 0.03), 1.0, F);
      tl.to("#q5-px", { fill: "#F0B90B", duration: 0.3 }, at(6, 0.05));
      COUNT("#q5-px", 12000, 3000, at(6, 0.05), 1.0, F);
      OUT("#q5-x4", at(6, 0.05), 0.3);
