  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const HL = (a, b, t, d = 0.45) => tl.to("#mr-hl, #mr-hlb", { attr: { y: 283 + 40 * (a - 1), height: 40 * (b - a + 1) }, opacity: 1, duration: d, ease: "power2.inOut" }, t);

      // 区块链条：12 块，h … h+11
      const NS = "http://www.w3.org/2000/svg", chain = document.getElementById("mr-chain"), secs = document.getElementById("mr-secs");
      for (let i = 0; i < 12; i++) {
        const x = 140 + 136 * i, g = document.createElementNS(NS, "g");
        g.setAttribute("id", "mr-k" + i); g.setAttribute("class", "h");
        const r = document.createElementNS(NS, "rect");
        Object.entries({ x, y: 400, width: 110, height: 80, rx: 8, fill: "#161a22", stroke: i === 0 ? "#F0B90B" : "#58C4DD", "stroke-width": 2.5 }).forEach(([k, v]) => r.setAttribute(k, v));
        const t = document.createElementNS(NS, "text");
        Object.entries({ x: x + 55, y: 450, "text-anchor": "middle", fill: "#e8e6df", class: "mono" }).forEach(([k, v]) => t.setAttribute(k, v));
        t.textContent = i === 0 ? "h" : "h+" + i;
        g.appendChild(r); g.appendChild(t); chain.appendChild(g);
        if (i > 0) {
          const s = document.createElementNS(NS, "text");
          Object.entries({ id: "mr-s" + i, class: "h", x: x + 55, y: 530, "text-anchor": "middle" }).forEach(([k, v]) => s.setAttribute(k, v));
          s.textContent = "12 s"; secs.appendChild(s);
        }
      }

      // L0 连库连节点 → 校验链 ID
      IN("#mr-panel", at(0, 0.02), 0.5);
      IN("#mr-code", at(0, 0.06), 0.7);
      HL(1, 2, at(0, 0.1));
      HL(3, 5, at(0, 0.4));
      IN("#mr-cm", at(0, 0.44), 0.4);
      IN("#mr-id1", at(0, 0.5), 0.5, { x: -16 }, { x: 0 });
      IN("#mr-id2", at(0, 0.66), 0.5, { x: -16 }, { x: 0 });
      IN("#mr-id3", at(0, 0.76), 0.4);

      // L1 确认规则 + Kafka 写入方
      OUT("#mr-id1, #mr-id2, #mr-id3, #mr-cm", at(1, 0), 0.4);
      HL(6, 9, at(1, 0.02));
      IN("#mr-ad1", at(1, 0.1), 0.4);
      IN("#mr-ad2", at(1, 0.16), 0.4);
      tl.to("#mr-hl, #mr-hlb", { attr: { y: 283 + 40 * 7, height: 80 }, duration: 0.4 }, at(1, 0.3));
      IN("#mr-bd1", at(1, 0.32), 0.4);
      IN("#mr-bd2", at(1, 0.42), 0.5);
      HL(10, 11, at(1, 0.62));
      IN("#mr-key", at(1, 0.64), 0.4);
      ARROW("#mr-ka", at(1, 0.68), 0.4);
      IN("#mr-parts", at(1, 0.7), 0.4);
      IN("#mr-reps", at(1, 0.8), 0.4);
      IN("#mr-ck1", at(1, 0.86), 0.2); IN("#mr-ck2", at(1, 0.89), 0.2); IN("#mr-ck3", at(1, 0.92), 0.2);
      IN("#mr-kt", at(1, 0.93), 0.4);

      // L2 多副本 + 咨询锁
      OUT("#mr-code-part", at(2, 0), 0.5);
      IN("#mr-term", at(2, 0.03), 0.6);
      IN("#mr-r1", at(2, 0.06), 0.5);
      IN("#mr-r2", at(2, 0.1), 0.5);
      IN("#mr-r3", at(2, 0.14), 0.5);
      IN("#mr-lock", at(2, 0.18), 0.5, { y: -20 }, { y: 0 });
      IN("#mr-ll", at(2, 0.22), 0.5);
      tl.to("#mr-lock", { x: -520, y: 110, duration: 0.8, ease: "power2.inOut" }, at(2, 0.34));
      IN("#mr-sc1", at(2, 0.42), 0.4);
      tl.to("#mr-r1r", { fill: "#16303a", duration: 0.4 }, at(2, 0.42));
      tl.to("#mr-r1r", { stroke: "#FC6255", duration: 0.15, yoyo: true, repeat: 3 }, at(2, 0.66));
      IN("#mr-cut", at(2, 0.66), 0.3);
      tl.to("#mr-r1r", { stroke: "#6b6f7a", fill: "#161a22", duration: 0.3 }, at(2, 0.66) + 0.65);
      OUT("#mr-sc1", at(2, 0.7), 0.3);
      tl.to("#mr-lock", { y: 170, opacity: 0.5, duration: 0.35, ease: "power2.in" }, at(2, 0.7));
      tl.to("#mr-lock", { x: 0, y: 110, opacity: 1, duration: 0.7, ease: "power2.inOut" }, at(2, 0.74));
      IN("#mr-sc2", at(2, 0.8), 0.4);
      tl.to("#mr-r2r", { fill: "#16303a", duration: 0.4 }, at(2, 0.8));

      // L3 算一算：h → h+11，确认数 1 → 12
      OUT("#mr-lockpart, #mr-term", at(3, 0), 0.5);
      IN("#mr-cnt0", at(3, 0.06), 0.5);
      IN("#mr-coin", at(3, 0.1), 0.4, { y: -20 }, { y: 0 });
      for (let i = 0; i < 12; i++) IN(`#mr-k${i}`, at(3, 0.12 + i * 0.06), 0.3, { y: 10 }, { y: 0 });
      COUNT("#mr-cnt", 1, 12, at(3, 0.12), 0.66 * (L[3][1] - L[3][0]));

      // L4 132 s + 轮询 ≈ 2 分 16 秒
      IN("#mr-ex", at(4, 0.0), 0.4);
      tl.fromTo("#mr-secs text", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.08 }, at(4, 0.02));
      IN("#mr-f1", at(4, 0.14), 0.5);
      IN("#mr-f2", at(4, 0.44), 0.5);
      IN("#mr-f3", at(4, 0.6), 0.5);
      IN("#mr-fl", at(4, 0.72), 0.3);
      IN("#mr-f4", at(4, 0.76), 0.6);

      // L5 64 确认 ≈ 12.6 分钟：长短进度条
      OUT("#mr-f1, #mr-f2, #mr-f3, #mr-fl, #mr-f4", at(5, 0), 0.4);
      IN("#mr-ga", at(5, 0.08), 0.4);
      IN("#mr-ba", at(5, 0.1), 0.1);
      tl.fromTo("#mr-ba", { attr: { width: 0 } }, { attr: { width: 268 }, duration: 0.6, ease: "power2.out" }, at(5, 0.1));
      IN("#mr-gb", at(5, 0.3), 0.4);
      IN("#mr-bb", at(5, 0.34), 0.1);
      tl.fromTo("#mr-bb", { attr: { width: 0 } }, { attr: { width: 1500 }, duration: 2.0, ease: "power1.inOut" }, at(5, 0.34));

      tl.to("#mr-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#mr-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["mainrun"] = tl;
    })();
  </script>
