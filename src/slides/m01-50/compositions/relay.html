  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const HL = (a, b, t, d = 0.45) => tl.to("#rl-hl, #rl-hlb", { attr: { y: 283 + 40 * (a - 1), height: 40 * (b - a + 1) }, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      // 飞行信封：按关键点移动（x,y 为信封左上角）
      const FLY = (pts, t, seg = 0.45) => {
        tl.fromTo("#rl-fly", { opacity: 0, x: pts[0][0], y: pts[0][1] }, { opacity: 1, duration: 0.15, immediateRender: false }, t);
        for (let i = 1; i < pts.length; i++) tl.to("#rl-fly", { x: pts[i][0], y: pts[i][1], duration: seg, ease: "power1.inOut" }, t + 0.15 + (i - 1) * seg);
        return t + 0.15 + (pts.length - 1) * seg;
      };
      const SPIN = (t, d) => tl.to("#rl-gear", { rotation: "+=" + Math.round(d * 120), svgOrigin: "420 545", duration: d, ease: "none" }, t);
      const OB = [128, 290], GEAR = [394, 528], PIPE0 = [150, 649], PIPE1 = [600, 649], CONS = [600, 782];

      // L0 outbox → Relay
      IN("#rl-panel, #rl-t1", at(0, 0.02), 0.5);
      IN("#rl-code1", at(0, 0.08), 0.7);
      IN("#rl-ob", at(0, 0.04), 0.5);
      tl.fromTo(".rl-e", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.04 }, at(0, 0.14));
      IN("#rl-lk1, #rl-lk2", at(0, 0.2), 0.3);
      IN("#rl-sn", at(0, 0.3), 0.4);
      ARROW("#rl-a1", at(0, 0.36), 0.3);
      IN("#rl-gear, #rl-gl", at(0, 0.42), 0.4);
      SPIN(at(0, 0.42), 2.2);
      ARROW("#rl-a2", at(0, 0.6), 0.3);
      IN("#rl-pipe, #rl-pl", at(0, 0.64), 0.4);
      ARROW("#rl-a3", at(0, 0.76), 0.3);
      IN("#rl-cons", at(0, 0.8), 0.4);
      let e = FLY([OB, [394, 400], GEAR], at(0, 0.5), 0.4);
      OUT("#rl-fly", e, 0.2);

      // L1 第 2–4 行：取 100 条、加锁、跳过别人锁住的
      HL(2, 4, at(1, 0.02));
      IN("#rl-br", at(1, 0.1), 0.5);
      IN("#rl-brl", at(1, 0.22), 0.4);
      tl.to("#rl-lk1, #rl-lk2", { opacity: 0.35, duration: 0.3, yoyo: true, repeat: 3 }, at(1, 0.6));
      SPIN(at(1, 0.3), 3);

      // L2 第 6–9 行：发给 Kafka，再标记已发送
      HL(6, 9, at(2, 0.02));
      e = FLY([GEAR, PIPE0, PIPE1, CONS], at(2, 0.05), 0.4);
      IN("#rl-c1", e, 0.2);
      OUT("#rl-fly", e, 0.1);
      OUT("#rl-sn", at(2, 0.66), 0.2);
      IN("#rl-ss", at(2, 0.72), 0.4);
      SPIN(at(2, 0.05), 2);

      // L3 失败 → 回滚重发；成功但标记前崩溃 → 再发一次
      OUT("#rl-c1, #rl-ss", at(3, 0), 0.3);
      IN("#rl-sn", at(3, 0.04), 0.3);
      HL(7, 7, at(3, 0.02));
      IN("#rl-cm", at(3, 0.06), 0.4);
      IN("#rl-st1", at(3, 0.08), 0.4);
      e = FLY([GEAR, PIPE0], at(3, 0.08), 0.4);
      tl.to("#rl-fly", { x: OB[0], y: OB[1], duration: 0.6, ease: "back.out(1.4)" }, e);
      OUT("#rl-fly", e + 0.6, 0.2);
      OUT("#rl-st1, #rl-cm", at(3, 0.4), 0.3);
      HL(8, 9, at(3, 0.42));
      IN("#rl-st2", at(3, 0.46), 0.4);
      e = FLY([GEAR, PIPE0, PIPE1, CONS], at(3, 0.42), 0.3);
      IN("#rl-c1", e, 0.2);
      OUT("#rl-fly", e, 0.1);
      IN("#rl-bolt", at(3, 0.66), 0.15);
      tl.to("#rl-sn", { fill: "#FC6255", duration: 0.2, yoyo: true, repeat: 3 }, at(3, 0.68));
      OUT("#rl-bolt", at(3, 0.76), 0.25);
      e = FLY([OB, [394, 400], GEAR, PIPE0, PIPE1, [600, 824]], at(3, 0.74), 0.26);
      IN("#rl-c2", e, 0.2);
      OUT("#rl-fly", e, 0.1);
      SPIN(at(3, 0.08), 9);

      // L4 至少一次投递；消费方按 充值 ID + 事件类型 去重
      OUT("#rl-st2, #rl-hl, #rl-hlb", at(4, 0), 0.3);
      IN("#rl-term", at(4, 0.02), 0.6);
      IN("#rl-k1", at(4, 0.24), 0.5);
