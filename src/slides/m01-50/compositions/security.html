      const C = /*CUES*/{}/*END*/;

      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // 行点亮：卡变红描边，连线 + 绿色防护
      const LIT = (k, t, green = false) => {
        tl.to("#se-cr" + k, { stroke: green ? "#83C167" : "#FC6255", duration: 0.3 }, t);
        tl.to("#se-ct" + k, { fill: "#e8e6df", duration: 0.3 }, t);
        DRAW("#se-l" + k, t + 0.15, 0.4); IN("#se-l" + k, t + 0.15, 0.01);
        IN("#se-d" + k, t + 0.4, 0.5, { x: -10 }, { x: 0 });
      };
      const DIM = (ks, t) => tl.to(ks.map(k => "#se-row" + k), { opacity: 0.45, duration: 0.4 }, t);

      // L0 墙 + 10 张卡
      IN("#se-title", at(0, 0.0), 0.5);
      for (let k = 0; k < 10; k++) IN("#se-c" + k, at(0, 0.1 + k * 0.06), 0.4, { x: -16 }, { x: 0 });

      // L1 假币
      LIT(0, at(1, 0.02));
      IN("#se-fake", at(1, 0.12), 0.5);
      IN("#se-real", at(1, 0.2), 0.5);
      IN("#se-gate", at(1, 0.5), 0.5);
      tl.to("#se-fake", { y: 70, duration: 0.4, ease: "power2.in" }, at(1, 0.66));
      tl.to("#se-fake", { y: 0, duration: 0.4, ease: "power2.out" }, at(1, 0.66) + 0.4);
      IN("#se-fx", at(1, 0.66) + 0.4, 0.3);
      tl.to("#se-real", { y: 300, duration: 0.9, ease: "power2.inOut" }, at(1, 0.72));
      IN("#se-rok", at(1, 0.86), 0.3);

      // L2 重组双花 + RPC 欺骗
      OUT(["#se-fake", "#se-real", "#se-gate", "#se-fx", "#se-rok"], at(2, 0) - 0.3, 0.3);
      DIM([0], at(2, 0));
      LIT(1, at(2, 0.02));
      IN("#se-frz", at(2, 0.3), 0.5);
      LIT(2, at(2, 0.54));
      IN("#se-n1", at(2, 0.62), 0.4);
      IN("#se-n2", at(2, 0.68), 0.4);
      IN("#se-nok", at(2, 0.75), 0.3);
      IN("#se-gav", at(2, 0.84), 0.5, { y: -20 }, { y: 0 });

      // L3 地址投毒 / 回调伪造 / 重复入账
      OUT(["#se-frz", "#se-n1", "#se-n2", "#se-nok", "#se-gav"], at(3, 0) - 0.3, 0.3);
      DIM([1, 2], at(3, 0));
