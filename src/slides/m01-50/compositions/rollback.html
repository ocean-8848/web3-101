  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const HL = (a, b, t, d = 0.45) => tl.to("#rb-hl, #rb-hlb", { attr: { y: 283 + 40 * (a - 1), height: 40 * (b - a + 1) }, opacity: 1, duration: d, ease: "power2.inOut" }, t);
      const SWAP = (a, b, t) => { OUT(a, t, 0.25); IN(b, t + 0.3, 0.4); };

      // L0 链条 + 祖先
      IN("#rb-panel", at(0, 0.02), 0.5);
      IN("#rb-code", at(0, 0.08), 0.7);
      for (let i = 0; i < 6; i++) IN(`#rb-b${i}`, at(0, 0.1 + i * 0.06), 0.4, { y: 10 }, { y: 0 });
      IN("#rb-cur", at(0, 0.5), 0.4);
      tl.to("#rb-ancr", { stroke: "#83C167", fill: "#1d2a1a", duration: 0.4 }, at(0, 0.62));
      IN("#rb-anc", at(0, 0.66), 0.4);

      // L1 前 5 行：改状态，记录不删
      HL(1, 5, at(1, 0.02));
      IN("#rb-d1", at(1, 0.06), 0.5, { x: -16 }, { x: 0 });
      IN("#rb-s1a", at(1, 0.08), 0.5);
      IN("#rb-d2", at(1, 0.14), 0.5, { x: -16 }, { x: 0 });
      IN("#rb-s2a", at(1, 0.16), 0.5);
      SWAP("#rb-s1a", "#rb-s1b", at(1, 0.4));
      SWAP("#rb-s2a", "#rb-s2b", at(1, 0.62));
      IN("#rb-keep", at(1, 0.84), 0.5);

      // L2 第 6–8 行：冲正流水 + 已撤销事件 → 风控冻结
      HL(6, 8, at(2, 0.02));
      IN("#rb-led", at(2, 0.06), 0.5);
      IN("#rb-rev", at(2, 0.22), 0.5, { y: -14 }, { y: 0 });
      IN("#rb-sum", at(2, 0.34), 0.5);
      IN("#rb-ob", at(2, 0.44), 0.4);
      IN("#rb-env, #rb-envt", at(2, 0.48), 0.4);
      ARROW("#rb-ar", at(2, 0.58), 0.5);
      tl.fromTo("#rb-fly", { opacity: 0, x: 0 }, { opacity: 1, x: 150, duration: 0.7, ease: "power2.inOut" }, at(2, 0.6));
      OUT("#rb-fly", at(2, 0.6) + 0.7, 0.2);
      IN("#rb-risk", at(2, 0.56), 0.4);
      IN("#rb-lock", at(2, 0.76), 0.4, { y: -12 }, { y: 0 });
      IN("#rb-frz", at(2, 0.84), 0.4);

      // L3 最后 3 行：删祖先后的块，游标拨回，新分叉
      HL(9, 11, at(3, 0.02));
      OUT("#rb-b3, #rb-b4, #rb-b5", at(3, 0.08), 0.5);
      tl.to("#rb-cur", { x: -336, duration: 0.8, ease: "power2.inOut" }, at(3, 0.3));
      IN("#rb-n3", at(3, 0.6), 0.4);
      IN("#rb-n4", at(3, 0.7), 0.4);
      tl.to("#rb-n3r, #rb-n4r", { stroke: "#58C4DD", duration: 0.5 }, at(3, 0.84));

      // L4 同一事务；半途崩溃 → 全部回退
      OUT("#rb-hl, #rb-hlb", at(4, 0), 0.3);
      DRAW("#rb-frame", at(4, 0.02), 0.8);
      IN("#rb-bolt", at(4, 0.24), 0.15);
      tl.to("#rb-frame", { stroke: "#FC6255", duration: 0.2 }, at(4, 0.24));
      OUT("#rb-n3, #rb-n4, #rb-rev, #rb-sum, #rb-env, #rb-envt, #rb-ar, #rb-lock, #rb-frz, #rb-keep", at(4, 0.34), 0.4);
      SWAP("#rb-s1b", "#rb-s1a", at(4, 0.34));
      SWAP("#rb-s2b", "#rb-s2a", at(4, 0.34));
      IN("#rb-b3, #rb-b4, #rb-b5", at(4, 0.42), 0.4);
      tl.to("#rb-cur", { x: 0, duration: 0.6, ease: "power2.inOut" }, at(4, 0.4));
      OUT("#rb-bolt", at(4, 0.52), 0.3);
      tl.to("#rb-frame", { stroke: "#58C4DD", duration: 0.3 }, at(4, 0.56));
      IN("#rb-nada", at(4, 0.62), 0.5);

      // L5 直接删除 vs 状态 + 冲正
      OUT("#rb-main", at(5, 0), 0.5);
      IN("#rb-div", at(5, 0.06), 0.4);
      IN("#rb-at", at(5, 0.08), 0.5);
      IN("#rb-arec", at(5, 0.12), 0.5);
      IN("#rb-agh", at(5, 0.3), 0.2);
      OUT("#rb-arec", at(5, 0.3), 0.5);
      IN("#rb-ax", at(5, 0.4), 0.5);
      IN("#rb-bt", at(5, 0.5), 0.5);
      IN("#rb-brec", at(5, 0.56), 0.5);
      IN("#rb-bl1", at(5, 0.64), 0.4);
      IN("#rb-bl2", at(5, 0.7), 0.4);
      IN("#rb-bok", at(5, 0.76), 0.5);
      IN("#rb-rule", at(5, 0.84), 0.6);

      tl.to("#rb-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["rollback"] = tl;
    })();
  </script>
