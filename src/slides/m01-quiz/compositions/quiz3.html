  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // ===== 测验版式（照 EP009 quiz1/quiz2）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q3-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q3-q", at(0, 0.05), 0.01);
      tl.fromTo("#q3-qcr", { attr: { width: 0 } }, { attr: { width: 1100 }, duration: 2.4, ease: "none" }, at(0, 0.08));
      IN("#q3-q2", at(0, 0.05), 0.01);
      tl.fromTo("#q3-qcr2", { attr: { width: 0 } }, { attr: { width: 1350 }, duration: 2.0, ease: "none" }, at(0, 0.08) + 2.4);
      const SHOW = (k, t) => {
        IN(`#q3-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q3-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q3-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#q3-pause", at(2, 0.0), 0.3);
        tl.fromTo("#q3-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#q3-pause", at(3, 0.0), 0.3);
      };
      const RIGHT = (k, t) => {
        tl.to(`#q3-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q3-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q3-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q3-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q3-o${k}-t`, { attr: { y: Y0[k] + 52 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q3-o${k}-n`, t + 0.3, 0.5);
      };
      const POP = (s, t, ox, oy, d = 0.45) => IN(s, t, d, { scale: 0.6, svgOrigin: `${ox} ${oy}` }, { scale: 1, svgOrigin: `${ox} ${oy}`, ease: "back.out(2)" });
      const PULSE = (s, t, color, back, w = 3) => {
        tl.to(s, { stroke: color, strokeWidth: w + 2, duration: 0.25 }, t);
        tl.to(s, { stroke: back, strokeWidth: w, duration: 0.5 }, t + 1.2);
      };

      // L0 nonce 格子：8 号交易在等
      IN("#q3-slots", at(0, 0.32), 0.6, { y: 16 }, { y: 0 });
      PULSE("#q3-s8", at(0, 0.5), "#e8e6df", "#F0B90B");
      PULSE("#q3-s8", at(0, 0.8), "#e8e6df", "#F0B90B");
      // L1 选项
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.24)); SHOW("C", at(1, 0.481)); SHOW("D", at(1, 0.74));
      // L2 暂停：计算板出现（拿笔算一下）
      PAUSE();
      IN("#q3-pan", at(2, 0.3), 0.5);
      // L3 计算板逐行写；D 压线
      IN("#q3-r1", at(3, 0.03), 0.5, { x: -12 }, { x: 0 });
      PULSE("#q3-s8", at(3, 0.18), "#e8e6df", "#F0B90B");
      tl.to("#q3-r1k", { opacity: 0.3, duration: 0.25, yoyo: true, repeat: 3 }, at(3, 0.3));
      IN("#q3-r2", at(3, 0.458), 0.5, { x: -12 }, { x: 0 });
      IN("#q3-r3", at(3, 0.653), 0.5, { x: -12 }, { x: 0 });
      RIGHT("D", at(3, 0.847));
      IN("#q3-eq1", at(3, 0.88), 0.4, { y: 8 }, { y: 0 });
      IN("#q3-eq2", at(3, 0.88) + 0.3, 0.4, { y: 8 }, { y: 0 });
      // L4 B、C 错；对照两行
      WRONG("B", at(4, 0.02));
      IN("#q3-sep", at(4, 0.08), 0.3);
      IN("#q3-r4", at(4, 0.1), 0.4);
      POP("#q3-r4c", at(4, 0.18), 1453, 604);
      IN("#q3-r4b", at(4, 0.28), 0.4);
      POP("#q3-r4x", at(4, 0.36), 1690, 610);
      WRONG("C", at(4, 0.575));
      IN("#q3-r5", at(4, 0.62), 0.4);
      POP("#q3-r5c", at(4, 0.68), 1450, 662);
      IN("#q3-r5b", at(4, 0.74), 0.4);
      POP("#q3-r5x", at(4, 0.8), 1690, 662);
      // L5 A 错：8 号卡住，9 号只能排队
      WRONG("A", at(5, 0.02));
      tl.to("#q3-s8", { stroke: "#FF9F43", strokeWidth: 4, duration: 0.3 }, at(5, 0.25));
      tl.to("#q3-s8t", { fill: "#FF9F43", duration: 0.3 }, at(5, 0.25));
      IN("#q3-stk", at(5, 0.28), 0.4);
      IN("#q3-t9", at(5, 0.45), 0.6, { x: 140 }, { x: 0 });
      tl.to("#q3-t9b", { stroke: "#8a8f99", fill: "#1d2028", duration: 0.4 }, at(5, 0.68));
      tl.to("#q3-t9t", { fill: "#8a8f99", duration: 0.4 }, at(5, 0.68));
      IN("#q3-wait", at(5, 0.72), 0.4);

      tl.to("#q3-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["quiz3"] = tl;
    })();
