        IN(`#qu-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#qu-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#qu-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);

      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.204)); SHOW("C", at(1, 0.398)); SHOW("D", at(1, 0.777));

      tl.fromTo("#qu-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
      OUT("#qu-pause", at(3, 0.0), 0.3);
      const RIGHT = (k, t) => {
        tl.to(`#qu-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);

        tl.to(`#qu-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
