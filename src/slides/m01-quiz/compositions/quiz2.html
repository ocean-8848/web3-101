      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // ===== 测验版式（照 EP009 quiz1/quiz2）=====
      const Y0 = { A: 380, B: 515, C: 650, D: 785 };
      IN("#q2-badge", at(0, 0.0), 0.5, { x: -20 }, { x: 0 });
      IN("#q2-q", at(0, 0.05), 0.01);
      tl.fromTo("#q2-qcr", { attr: { width: 0 } }, { attr: { width: 1400 }, duration: 2.4, ease: "none" }, at(0, 0.08));
      IN("#q2-q2", at(0, 0.05), 0.01);
      tl.fromTo("#q2-qcr2", { attr: { width: 0 } }, { attr: { width: 600 }, duration: 2.0, ease: "none" }, at(0, 0.08) + 2.4);
      const SHOW = (k, t) => {
        IN(`#q2-o${k}`, t, 0.5, { x: -40 }, { x: 0 });
        tl.to(`#q2-o${k}-box`, { stroke: "#e8e6df", duration: 0.25 }, t);
        tl.to(`#q2-o${k}-box`, { stroke: "#8a8f99", duration: 0.4 }, t + 2.4);
      };
      const PAUSE = () => {
        IN("#q2-pause", at(2, 0.0), 0.3);
        tl.fromTo("#q2-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 1, duration: L[3][0] - L[2][0], ease: "none", immediateRender: false }, at(2, 0.0));
        OUT("#q2-pause", at(3, 0.0), 0.3);
      };
      const RIGHT = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-l`, { fill: "#0f1117", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-tint`, { opacity: 0.15, duration: 0.4 }, t);
      };
      const WRONG = (k, t) => {
        tl.to(`#q2-o${k}-box`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-c`, { stroke: "#FC6255", duration: 0.3 }, t);
        tl.to(`#q2-o${k}-dim`, { opacity: 0.6, duration: 0.4 }, t);
        tl.to(`#q2-o${k}-t`, { attr: { y: Y0[k] + 52 }, duration: 0.4, ease: "power2.out" }, t);
        IN(`#q2-o${k}-n`, t + 0.3, 0.5);
      };
      const POP = (s, t, ox, oy, d = 0.45) => IN(s, t, d, { scale: 0.6, svgOrigin: `${ox} ${oy}` }, { scale: 1, svgOrigin: `${ox} ${oy}`, ease: "back.out(2)" });
      const PULSE = (s, t, color, back, w = 3) => {
        tl.to(s, { stroke: color, strokeWidth: w + 2, duration: 0.25 }, t);
        tl.to(s, { stroke: back, strokeWidth: w, duration: 0.5 }, t + 1.2);
      };

      // L0 示意区：两条链
      IN("#q2-eth", at(0, 0.45), 0.6, { x: 20 }, { x: 0 });
      IN("#q2-lt", at(0, 0.45), 0.6, { x: 20 }, { x: 0 });
      IN("#q2-fin", at(0, 0.6), 0.5);
      IN("#q2-finl", at(0, 0.6), 0.5);
      IN("#q2-lat", at(0, 0.66), 0.5);
      IN("#q2-latl", at(0, 0.66), 0.5);
      IN("#q2-tm", at(0, 0.78), 0.6, { x: 20 }, { x: 0 });
      // L1 选项 + 示意区随念到的词闪一下
      SHOW("A", at(1, 0.0)); SHOW("B", at(1, 0.11)); SHOW("C", at(1, 0.535)); SHOW("D", at(1, 0.843));
      PULSE("#q2-fin", at(1, 0.165), "#e8e6df", "#83C167");
      tl.to("#q2-tm", { opacity: 0.45, duration: 0.25, yoyo: true, repeat: 1 }, at(1, 0.339));
      PULSE("#q2-lat", at(1, 0.591), "#e8e6df", "#FF9F43");
      // L2 暂停
      PAUSE();
      // L3 揭晓 B：latest 两块被替换；finalized 不动；Tendermint 新块提交即最终；故障停链
      RIGHT("B", at(3, 0.03));
      tl.to("#q2-ltw", { x: 7, duration: 0.07, yoyo: true, repeat: 7, ease: "sine.inOut" }, at(3, 0.287));
      IN("#q2-reorg", at(3, 0.287) + 0.2, 0.4);
      OUT("#q2-lt", at(3, 0.287) + 0.65, 0.3);
