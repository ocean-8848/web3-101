      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {

      IN("#be-st1", at(4, 0.3), 0.4);
      IN("#be-rl2", at(4, 0.42), 0.4);
      ["#be-b0", "#be-b1", "#be-b2", "#be-b3"].forEach((s, i) => IN(s, at(4, 0.45) + i * 0.15, 0.4));
      ARROW("#be-ba0", at(4, 0.5)); ARROW("#be-ba1", at(4, 0.56)); ARROW("#be-ba2", at(4, 0.62));
      IN("#be-scl", at(4, 0.58), 0.4);
      IN("#be-gas", at(4, 0.72), 0.4, { y: 10 }, { y: 0 });

      tl.to("#be-b2 rect", { strokeWidth: 6, duration: 0.3, yoyo: true, repeat: 3 }, at(5, 0.6));
      tl.to("#be-k2 rect", { fill: "#2a2140", duration: 0.5 }, at(5, 0.62));

      window.__timelines["beacon"] = tl;
    })();
