  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      IN("#sl-title", at(0, 0.05), 0.6, { scale: 0.8, svgOrigin: "960 280" }, { scale: 1 });
      IN("#sl-term", at(0, 0.35), 0.5);
      tl.to("#sl-title", { opacity: 0.5, duration: 0.25, yoyo: true, repeat: 3 }, at(0, 0.5));
      // L1 EVM 只认编号
      OUT("#sl-title", at(1, 0), 0.3);
      [0, 1, 2, 3, 4].forEach(i => IN("#sl-k" + i, at(1, 0.03) + 0.1 * i, 0.4));
      [0, 1, 2, 3, 4].forEach(i => IN("#sl-v" + i, at(1, 0.18) + 0.35 * i, 0.4, { x: 160 }, { x: 0 }));
      OUT("#sl-term", at(1, 0.6), 0.4);
      [0, 1, 2, 3, 4].forEach(i => OUT("#sl-v" + i, at(1, 0.55) + 0.12 * i, 0.3));
      tl.to(".sl-kn", { fill: "#e8e6df", duration: 0.4 }, at(1, 0.6));
      IN("#sl-rule", at(1, 0.66), 0.5);
      // L2 两个视角
      OUT("#sl-one", at(2, 0), 0.4);
      IN("#sl-L", at(2, 0.05), 0.5); IN("#sl-limpl", at(2, 0.1), 0.5);
      IN("#sl-im", at(2, 0.15), 0.5); ARROW("#sl-ptr", at(2, 0.2), 0.7);
      IN("#sl-R", at(2, 0.5), 0.5);
      IN("#sl-same", at(2, 0.72), 0.4); IN("#sl-samel", at(2, 0.76), 0.4);
      tl.to(["#sl-L0 rect", "#sl-R0 rect"], { stroke: "#FC6255", duration: 0.3 }, at(2, 0.76));
      // L3 setOwner 覆盖实现地址
      IN("#sl-call", at(3, 0.02), 0.4);
      IN("#sl-dot", at(3, 0.1), 0.2);
      tl.to("#sl-dot", { attr: { cx: 1640, cy: 412 }, duration: 0.6, ease: "power1.in" }, at(3, 0.12));
      OUT("#sl-dot", at(3, 0.26), 0.2);
      OUT("#sl-limpl", at(3, 0.32), 0.2); IN("#sl-lbob", at(3, 0.34), 0.3);
      tl.to(["#sl-L0", "#sl-lbob"], { x: 6, duration: 0.05, yoyo: true, repeat: 5 }, at(3, 0.4));
      tl.to("#sl-ptr", { stroke: "#FC6255", duration: 0.3 }, at(3, 0.55));
      IN("#sl-brk", at(3, 0.62), 0.3);
      tl.to("#sl-ptr", { opacity: 0.25, duration: 0.4 }, at(3, 0.7));
      // L4 EIP-1967：搬到远处
      ["#sl-brk", "#sl-ptr", "#sl-im", "#sl-same", "#sl-samel", "#sl-call", "#sl-lbob"].forEach(s => OUT(s, at(4, 0), 0.4));
      tl.to(["#sl-L0 rect", "#sl-R0 rect"], { stroke: "#58C4DD", duration: 0.3 }, at(4, 0.05));
      IN("#sl-fly", at(4, 0.1), 0.3);
      IN("#sl-zig", at(4, 0.2), 0.5);
      tl.to("#sl-flyo", { y: 500, duration: 1.2, ease: "power2.inOut" }, at(4, 0.25));
      tl.to("#sl-flyr", { stroke: "#83C167", duration: 0.4 }, at(4, 0.55));
      IN("#sl-1967", at(4, 0.62), 0.5);
      // L5 公式
      IN("#sl-f", at(5, 0.1), 0.6, { x: 30 }, { x: 0 });
      tl.to("#sl-f text", { fill: "#83C167", duration: 0.4 }, at(5, 0.6));
      tl.to("#sl-zig", { opacity: 0.5, duration: 0.3, yoyo: true, repeat: 3 }, at(5, 0.7));
      // L6 都用这一格
      IN("#sl-b1", at(6, 0.05), 0.5, { x: 300 }, { x: 0 });
      IN("#sl-b2", at(6, 0.25), 0.5, { x: 300 }, { x: 0 });
      IN("#sl-use", at(6, 0.5), 0.5);


      tl.to("#sl-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#sl-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["slots"] = tl;
    })();
