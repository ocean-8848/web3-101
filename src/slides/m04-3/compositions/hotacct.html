  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
const FLASH = (s, t, n = 2, lo = 0.3) => tl.to(s, { opacity: lo, duration: 0.18, yoyo: true, repeat: n * 2 - 1, ease: "sine.inOut" }, t);

const Q = [...Array(12).keys()];
// L0 成交事务都指向手续费账户
Q.forEach(i => IN(`#ht-q${i}`, at(0, 0.04 + i * 0.025), 0.35, { x: -20 }, { x: 0 }));
IN("#ht-cyl, #ht-cyll", at(0, 0.3), 0.6);
Q.forEach(i => { tl.set(`#ht-l${i}`, { opacity: 1 }, at(0, 0.45 + i * 0.03)); DRAW(`#ht-l${i}`, at(0, 0.45 + i * 0.03), 0.6); });
// L1 一把锁、排长队
IN("#ht-lk", at(1, 0.05), 0.4, { y: -20 }, { y: 0 });
OUT(Q.map(i => `#ht-l${i}`).join(","), at(1, 0.2), 0.3);
Q.forEach(i => tl.to(`#ht-q${i}`, { x: (1150 - i * 88) - 160, y: 541 - (232 + i * 62), duration: 0.9, ease: "power2.inOut" }, at(1, 0.25) + i * 0.03));
IN("#ht-qt", at(1, 0.6), 0.4);
[8, 9, 10, 11].forEach((i, k) => tl.to(`#ht-qr${i}`, { stroke: "#FC6255", strokeWidth: 3, duration: 0.3 }, at(1, 0.72) + k * 0.12));
FLASH("#ht-lk", at(1, 0.85), 2);
// L2 吞吐上限
IN("#ht-gt", at(2, 0.03), 0.5);
IN("#ht-gk, #ht-gf", at(2, 0.1), 0.3);
tl.to("#ht-gf", { attr: { width: 696 }, duration: 1.4, ease: "power2.out" }, at(2, 0.12));
FLASH("#ht-gf", at(2, 0.35), 2);
IN("#ht-gs", at(2, 0.5), 0.4);
IN("#ht-term", at(2, 0.72), 0.5);
// L3 分桶
OUT("#ht-gt, #ht-gk, #ht-gf, #ht-gs, #ht-qt, #ht-lk", at(3, 0.0), 0.35);
Q.forEach(i => tl.to(`#ht-q${i}`, { x: 0, y: 0, duration: 0.7, ease: "power2.inOut" }, at(3, 0.02)));
Q.forEach(i => tl.to(`#ht-qr${i}`, { stroke: "#8a8f99", strokeWidth: 2.5, duration: 0.3 }, at(3, 0.02)));
OUT("#ht-cyl, #ht-cyll", at(3, 0.1), 0.4);
tl.fromTo(".ht-cell", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: { each: 0.012, from: "center" } }, at(3, 0.15));
IN("#ht-gl", at(3, 0.3), 0.4);
OUT("#ht-term", at(3, 0.5), 0.4);
IN("#ht-dis", at(3, 0.36), 0.5);
IN("#ht-dl", at(3, 0.42), 0.4);
tl.fromTo(".ht-dln", { opacity: 0, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, duration: 0.5, stagger: 0.03 }, at(3, 0.5));
tl.fromTo(".ht-fan", { opacity: 0, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, duration: 0.4, stagger: 0.04 }, at(3, 0.62));
Q.forEach(i => tl.to(`#ht-qr${i}`, { stroke: "#83C167", duration: 0.2 }, at(3, 0.72) + (i % 4) * 0.08));
IN("#ht-lc", at(3, 0.82), 0.4, { y: 10 }, { y: 0 });
