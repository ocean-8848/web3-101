  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const TERM = (a, b, t) => { OUT(a, t, 0.3); IN(b, t + 0.35, 0.5); };
      const POP = (s, t, ox, oy, d = 0.5) => IN(s, t, d, { scale: 0.6, svgOrigin: ox + " " + oy }, { scale: 1, svgOrigin: ox + " " + oy, ease: "back.out(1.8)" });

      IN("#ho-cab", at(0, 0), 0.7, { scale: 0.95, svgOrigin: "960 530" }, { scale: 1, svgOrigin: "960 530" });
      IN("#ho-cap", at(0, 0.35), 0.5);
      // L1 Geth + chain + progress
      IN("#ho-el", at(1, 0.03), 0.5); IN("#ho-geth", at(1, 0.06), 0.5);
      IN("#ho-b0, #ho-b1, #ho-l1, #ho-b2, #ho-l2, #ho-b3, #ho-l3", at(1, 0.12), 0.5);
      for (let k = 4; k <= 8; k++) IN(`#ho-b${k}, #ho-l${k}`, at(1, 0.3) + (k - 4) * 0.8, 0.3);
      IN("#ho-prog, #ho-pl", at(1, 0.25), 0.4);
      tl.fromTo("#ho-pf", { attr: { width: 0 } }, { attr: { width: 388 }, duration: 3.6, ease: "power1.out", immediateRender: false }, at(1, 0.3));
      COUNT("#ho-pn", 0, 97, at(1, 0.3), 3.6);
      IN("#ho-clock", at(1, 0.55), 0.4);
      tl.to("#ho-hand", { rotation: 360, svgOrigin: "1600 330", duration: 2.4, ease: "none" }, at(1, 0.6));
      // L2 stuck: chain keeps growing, bar turns orange
      for (let i = 0; i < 5; i++) {
        const t = at(2, 0) + i * 1.3;
        tl.to("#ho-chain", { x: -70 * (i + 1), duration: 0.5, ease: "power2.inOut" }, t);
        IN(`#ho-b${9 + i}, #ho-l${9 + i}`, t + 0.15, 0.3);
      }
      tl.to("#ho-pf", { fill: "#FF9F43", duration: 0.3 }, at(2, 0.04));
      tl.to("#ho-prog", { opacity: 0.3, duration: 0.15 }, at(2, 0.08));
      tl.to("#ho-prog", { opacity: 1, duration: 0.15 }, at(2, 0.08) + 0.15);
      tl.to("#ho-prog", { opacity: 0.3, duration: 0.15 }, at(2, 0.08) + 0.3);
      tl.to("#ho-prog", { opacity: 1, duration: 0.15 }, at(2, 0.08) + 0.45);
      IN("#ho-ok1", at(2, 0.08), 0.4, { x: -20 }, { x: 0 });
      IN("#ho-ok2", at(2, 0.24), 0.4, { x: -20 }, { x: 0 });
      OUT("#ho-ok1, #ho-ok2", at(2, 0.62), 0.4);
      tl.to("#ho-cab rect", { stroke: "#e8e6df", duration: 0.3 }, at(2, 0.8));
      tl.to("#ho-cab rect", { stroke: "#8a8f99", duration: 0.4 }, at(2, 0.8) + 0.5);
      // L3 split into two halves
      tl.to("#ho-geth", { attr: { y: 595 }, duration: 0.6, ease: "power2.inOut" }, at(3, 0.05));
      IN("#ho-elt", at(3, 0.15), 0.5); IN("#ho-eld", at(3, 0.3), 0.5);
      IN("#ho-cld", at(3, 0.55), 0.5);
      IN("#ho-clt", at(3, 0.6), 0.5); IN("#ho-cldd", at(3, 0.75), 0.5);
      // L4 CL lights up, engine arrow, catch up
      IN("#ho-cl", at(4, 0.02), 0.5); OUT("#ho-cld", at(4, 0.05), 0.4);
      ARROW("#ho-eng", at(4, 0.1), 0.6);
      tl.to("#ho-pf", { fill: "#83C167", attr: { width: 400 }, duration: 0.8, ease: "power2.out" }, at(4, 0.16));
      OUT("#ho-pl", at(4, 0.16), 0.3); IN("#ho-pl2", at(4, 0.2), 0.4);
      IN("#ho-w1", at(4, 0.3), 0.4, { x: 80 }, { x: 0 });
      tl.to("#ho-w1", { opacity: 0, x: -80, duration: 0.35, ease: "power2.in" }, at(4, 0.47));
      IN("#ho-w2", at(4, 0.52), 0.4, { x: 80 }, { x: 0 });
      tl.to("#ho-w2", { opacity: 0, x: -80, duration: 0.35, ease: "power2.in" }, at(4, 0.69));
      IN("#ho-w3", at(4, 0.74), 0.4, { x: 80 }, { x: 0 });

      tl.to("#ho-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["hook"] = tl;
    })();
  </script>
