  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const TERM = (a, b, t) => { OUT(a, t, 0.3); IN(b, t + 0.35, 0.5); };
      const POP = (s, t, ox, oy, d = 0.5) => IN(s, t, d, { scale: 0.6, svgOrigin: ox + " " + oy }, { scale: 1, svgOrigin: ox + " " + oy, ease: "back.out(1.8)" });

      // L0 hierarchy top-down
      for (let k = 0; k < 5; k++) {
        IN(`#se-h${k}`, at(0, 0.03 + 0.17 * k), 0.4, { y: -15 }, { y: 0 });
        if (k < 4) { ARROW(`#se-ar${k}`, at(0, 0.1 + 0.17 * k), 0.4); IN(`#se-hl${k}`, at(0, 0.12 + 0.17 * k), 0.4); }
      }
      IN("#se-side", at(0, 0.85), 0.5);
      // L1 shift left, slot band
      OUT("#se-side", at(1, 0.0), 0.3);
      tl.to("#se-hier", { x: -560, duration: 0.8, ease: "power2.inOut" }, at(1, 0.04));
      IN("#se-band", at(1, 0.15), 0.7, { y: -40 }, { y: 0 });
      IN("#se-32", at(1, 0.4), 0.4);
      tl.to("#se-c0", { fill: "#F0B90B", fillOpacity: 0.6, stroke: "#F0B90B", duration: 0.3 }, at(1, 0.72));
      IN("#se-ts", at(1, 0.74), 0.4);
      // L2 mapping position
      IN("#se-bA", at(2, 0.25), 0.4, { x: 20 }, { x: 0 });
      IN("#se-bB", at(2, 0.33), 0.4, { x: 20 }, { x: 0 });
      tl.to("#se-ba", { x: -20, y: 200, duration: 0.6, ease: "power2.inOut" }, at(2, 0.55));
      tl.to("#se-bb", { x: 420, y: 110, duration: 0.6, ease: "power2.inOut" }, at(2, 0.55));
      IN("#se-fun", at(2, 0.72), 0.4);
      IN("#se-hash", at(2, 0.84), 0.4, { y: -15 }, { y: 0 });
      // L3 read value
      ARROW("#se-to", at(3, 0.02), 0.5);
      tl.to("#se-c12", { fill: "#F0B90B", fillOpacity: 0.6, stroke: "#F0B90B", duration: 0.3 }, at(3, 0.15));
      IN("#se-form", at(3, 0.2), 0.4);
      IN("#se-val", at(3, 0.45), 0.5, { y: 12 }, { y: 0 });
      // L4 proof
      OUT("#se-bA, #se-bB, #se-fun, #se-hash, #se-to, #se-form, #se-val", at(4, 0.0), 0.4);
      IN("#se-lc", at(4, 0.06), 0.4);
      IN("#se-hd", at(4, 0.1), 0.4, { x: -20 }, { x: 0 });
      IN("#se-gp", at(4, 0.3), 0.4);
      for (let k = 0; k < 5; k++) { POP(`#se-ck${k}`, at(4, 0.42) + k * 0.25, 585, 768 - 140 * (4 - k)); tl.to(`#se-h${k} rect`, { stroke: "#83C167", duration: 0.25 }, at(4, 0.42) + k * 0.25); }
      IN("#se-rpc", at(4, 0.7), 0.4);
      // L5 archive
      tl.to("#se-h0 rect", { stroke: "#e8e6df", duration: 0.4 }, at(5, 0.0));
      tl.to("#se-h1 rect, #se-h2 rect, #se-h3 rect, #se-h4 rect", { stroke: "#58C4DD", duration: 0.4 }, at(5, 0.0));
      OUT("#se-lc, #se-hd, #se-gp, #se-rpc, #se-ck0, #se-ck1, #se-ck2, #se-ck3, #se-ck4", at(5, 0.0), 0.4);
      IN("#se-old", at(5, 0.08), 0.5);
      IN("#se-new", at(5, 0.14), 0.4);
      IN("#se-cur", at(5, 0.2), 0.4, { y: -15 }, { y: 0 });
