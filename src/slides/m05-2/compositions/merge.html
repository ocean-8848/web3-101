<g id="me-t2" class="h"><rect x="70" y="56" width="560" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5"/><text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">验证者 <tspan font-size="28" font-weight="400" fill="#8a8f99">Validator</tspan></text><text x="100" y="160" font-size="28" fill="#e8e6df">质押 ETH、负责出块和投票的身份</text></g>

<g id="me-t3" class="h"><rect x="70" y="56" width="560" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5"/><text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">slot / epoch <tspan font-size="28" font-weight="400" fill="#8a8f99"></tspan></text><text x="100" y="160" font-size="28" fill="#e8e6df">12 秒一格；32 格一轮 ≈ 6.4 分钟</text></g>

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const TERM = (a, b, t) => { OUT(a, t, 0.3); IN(b, t + 0.35, 0.5); };
      const POP = (s, t, ox, oy, d = 0.5) => IN(s, t, d, { scale: 0.6, svgOrigin: ox + " " + oy }, { scale: 1, svgOrigin: ox + " " + oy, ease: "back.out(1.8)" });

      IN("#me-t1", at(0, 0.3), 0.5);
      IN("#me-pc", at(0, 0.05), 0.6, { scale: 0.95, svgOrigin: "960 520" }, { scale: 1, svgOrigin: "960 520" });
      POP("#me-sw", at(0, 0.35), 960, 500);
      IN("#me-node", at(0, 0.72), 0.5, { y: 15 }, { y: 0 });
      // L1 validator
      TERM("#me-t1", "#me-t2", at(1, 0.02));
      IN("#me-coins", at(1, 0.1), 0.6, { y: 20 }, { y: 0 });
      for (let k = 0; k < 4; k++) IN(`#me-v${k}`, at(1, 0.55) + k * 0.25, 0.4, { y: 60 }, { y: 0 });
      IN("#me-vl", at(1, 0.78), 0.4);
      // L2 slot / epoch
      OUT("#me-pc, #me-sw, #me-node, #me-coins, #me-v0, #me-v1, #me-v2, #me-v3, #me-vl, #me-t2", at(2, 0), 0.4);
      IN("#me-t3", at(2, 0.05), 0.5);
      tl.set("#me-band", { opacity: 1 }, at(2, 0.08));
      tl.fromTo("#me-band .me-cell", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.03, immediateRender: false }, at(2, 0.08));
      tl.fromTo("#me-band .me-blk", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, stagger: 0.07, ease: "back.out(2)", immediateRender: false }, at(2, 0.2));
      IN("#me-s1", at(2, 0.15), 0.4);
      IN("#me-emp", at(2, 0.42), 0.4);
      DRAW("#me-brace", at(2, 0.58), 0.8);
      IN("#me-ep", at(2, 0.66), 0.5);
      OUT("#me-t3", at(2, 0.97), 0.4);
      // L3 The Merge date
      OUT("#me-band, #me-s1, #me-emp, #me-brace, #me-ep", at(3, 0), 0.4);
      tl.set("#me-dl", { opacity: 1 }, at(3, 0.3));
      DRAW("#me-dl", at(3, 0.3), 0.8);
      IN("#me-date", at(3, 0.45), 0.6, { y: -15 }, { y: 0 });
      // L4 two chains
      IN("#me-pow", at(4, 0.02), 0.6, { x: -40 }, { x: 0 });
      IN("#me-pick", at(4, 0.08), 0.4); IN("#me-powl", at(4, 0.12), 0.5);
      IN("#me-bead", at(4, 0.45), 0.4);
      IN("#me-bea", at(4, 0.5), 0.8, { x: -40 }, { x: 0 });
      IN("#me-beal", at(4, 0.62), 0.5);
      // L5 merge
      DRAW("#me-j1", at(5, 0.05), 0.8); DRAW("#me-j2", at(5, 0.05), 0.8);
      for (let k = 0; k < 6; k++) IN(`#me-m${k}`, at(5, 0.18) + k * 0.2, 0.35, { x: -20 }, { x: 0 });
      IN("#me-ml1", at(5, 0.3), 0.5); IN("#me-ml2", at(5, 0.42), 0.5);
      IN("#me-pickx", at(5, 0.72), 0.3);
      OUT("#me-pick, #me-pickx", at(5, 0.9), 0.4);
      // L6 energy
      OUT("#me-pow, #me-powl, #me-bea, #me-beal, #me-bead, #me-j1, #me-j2, #me-m0, #me-m1, #me-m2, #me-m3, #me-m4, #me-m5, #me-ml1, #me-ml2, #me-dl, #me-date", at(6, 0), 0.4);
      IN("#me-el, #me-bar, #me-base", at(6, 0.08), 0.4);
      tl.to("#me-bar", { attr: { y: 816, height: 4 }, fill: "#83C167", stroke: "#83C167", duration: 1.2, ease: "power3.in" }, at(6, 0.2));
      IN("#me-e1", at(6, 0.45), 0.5, { scale: 0.8, svgOrigin: "960 620" }, { scale: 1, svgOrigin: "960 620" });
      IN("#me-e2", at(6, 0.7), 0.5);

      tl.to("#me-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["merge"] = tl;
    })();
  </script>
