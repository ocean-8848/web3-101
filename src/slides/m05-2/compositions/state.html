    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const TERM = (a, b, t) => { OUT(a, t, 0.3); IN(b, t + 0.35, 0.5); };
      const POP = (s, t, ox, oy, d = 0.5) => IN(s, t, d, { scale: 0.6, svgOrigin: ox + " " + oy }, { scale: 1, svgOrigin: ox + " " + oy, ease: "back.out(1.8)" });

      IN("#st-t1", at(0, 0.3), 0.5);
      IN("#st-tab", at(0, 0.05), 0.5);
      for (let k = 0; k < 5; k++) IN(`#st-r${k}`, at(0, 0.15) + k * 0.25, 0.4, { x: -20 }, { x: 0 });
      IN("#st-hl", at(0, 0.85), 0.4);
      // L1 card + nonce
      OUT("#st-tab, #st-r0, #st-r1, #st-r2, #st-r3, #st-r4, #st-hl", at(1, 0.0), 0.4);
      IN("#st-card", at(1, 0.05), 0.6, { scale: 0.7, svgOrigin: "960 440" }, { scale: 1, svgOrigin: "960 440" });
      IN("#st-f1", at(1, 0.4), 0.5, { x: -20 }, { x: 0 });
      OUT("#st-t1", at(1, 0.2), 0.4);
      IN("#st-nh", at(1, 0.7), 0.4);
      // L2 balance
      tl.to("#st-nh", { attr: { y: 528, height: 72 }, duration: 0.5, ease: "power2.inOut" }, at(2, 0.05));
      IN("#st-f2", at(2, 0.05), 0.5, { x: -20 }, { x: 0 });
      IN("#st-wei", at(2, 0.5), 0.5, { x: 20 }, { x: 0 });
      // L3 storageRoot + codeHash + EOA
      IN("#st-f3", at(3, 0.02), 0.5, { x: -20 }, { x: 0 });
      tl.to("#st-nh", { attr: { y: 648 }, duration: 0.5, ease: "power2.inOut" }, at(3, 0.02));
      tl.to("#st-nh", { attr: { y: 768 }, duration: 0.5, ease: "power2.inOut" }, at(3, 0.45));
      IN("#st-f4", at(3, 0.45), 0.5, { x: -20 }, { x: 0 });
      IN("#st-eoa", at(3, 0.75), 0.5, { x: 30 }, { x: 0 });
      // L4 tree
      OUT("#st-nh, #st-card, #st-f1, #st-f2, #st-f3, #st-f4, #st-wei, #st-eoa", at(4, 0.0), 0.4);
      IN("#st-t2", at(4, 0.05), 0.5);
      for (let k = 0; k < 8; k++) IN(`#st-lf${k}`, at(4, 0.08) + k * 0.08, 0.35, { y: -30 }, { y: 0 });
      tl.fromTo("#st-all .st-edge, #st-all .st-node", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.05, immediateRender: false }, at(4, 0.25));
      IN("#st-rl", at(4, 0.55), 0.4);
      IN("#st-hdr", at(4, 0.68), 0.5);
      IN("#st-fly", at(4, 0.74), 0.1);
      tl.to("#st-fly", { attr: { cx: 1180, cy: 250, r: 10 }, duration: 0.7, ease: "power2.in" }, at(4, 0.75));
      OUT("#st-fly", at(4, 0.75) + 0.7, 0.2);
      IN("#st-h1", at(4, 0.75) + 0.7, 0.4);
      OUT("#st-t2", at(4, 0.95), 0.4);
      // L5 change propagates
      const t5 = at(5, 0.05);
      tl.to("#st-lr5", { stroke: "#FC6255", fill: "#FC6255", duration: 0.3 }, t5);
      IN("#st-chg", t5, 0.4);
      tl.to("#st-e15", { stroke: "#FC6255", duration: 0.3 }, t5 + 0.5);
      tl.to("#st-n12", { stroke: "#FC6255", duration: 0.3 }, t5 + 0.8);
      tl.to("#st-e22", { stroke: "#FC6255", duration: 0.3 }, t5 + 1.1);
      tl.to("#st-n21", { stroke: "#FC6255", duration: 0.3 }, t5 + 1.4);
      tl.to("#st-e31", { stroke: "#FC6255", duration: 0.3 }, t5 + 1.7);
      tl.to("#st-root", { stroke: "#FC6255", fill: "#FC6255", duration: 0.3 }, t5 + 2.0);
      OUT("#st-h1", t5 + 2.2, 0.3); IN("#st-h2", t5 + 2.55, 0.4);
      IN("#st-cmp", at(5, 0.55), 0.5, { x: 20 }, { x: 0 });
      IN("#st-eq", at(5, 0.75), 0.4, { scale: 0.8, svgOrigin: "1640 730" }, { scale: 1, svgOrigin: "1640 730" });

      tl.to("#st-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#st-t2", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["state"] = tl;
