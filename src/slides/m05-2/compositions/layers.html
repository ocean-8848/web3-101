  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const TERM = (a, b, t) => { OUT(a, t, 0.3); IN(b, t + 0.35, 0.5); };
      const POP = (s, t, ox, oy, d = 0.5) => IN(s, t, d, { scale: 0.6, svgOrigin: ox + " " + oy }, { scale: 1, svgOrigin: ox + " " + oy, ease: "back.out(1.8)" });

      // L0 newsroom
      IN("#la-ed", at(0, 0.02), 0.7, { y: 20 }, { y: 0 });
      IN("#la-edl", at(0, 0.15), 0.5);
      IN("#la-pp0, #la-pp1, #la-pp2", at(0, 0.25), 0.4);
      IN("#la-pl", at(0, 0.27), 0.4);
      for (let k = 0; k < 3; k++) {
        const t = at(0, 0.32) + k * 0.9;
        tl.fromTo(`#la-pp${k}`, { x: 0 }, { x: 260, opacity: 0, duration: 0.8, ease: "power2.in", immediateRender: false }, t);
      }
      OUT("#la-pl", at(0, 0.6), 0.3);
      IN("#la-out", at(0, 0.7), 0.6, { x: -60 }, { x: 0 });
      IN("#la-outl", at(0, 0.82), 0.5);
      // L1 committee
      IN("#la-tab", at(1, 0.02), 0.6, { scale: 0.8, svgOrigin: "1420 560" }, { scale: 1, svgOrigin: "1420 560" });
      IN("#la-tabl", at(1, 0.1), 0.5);
      POP("#la-i1", at(1, 0.28), 1270, 420);
      POP("#la-i2", at(1, 0.5), 1420, 420);
      POP("#la-i3", at(1, 0.72), 1570, 420);
      // L2 limits: millions of validators
      IN("#la-lim", at(2, 0.05), 0.5);
      OUT("#la-i1, #la-i2, #la-i3, #la-tabl", at(2, 0.25), 0.4);
      tl.to("#la-tab", { opacity: 0, attr: { rx: 420, ry: 300 }, duration: 0.7, ease: "power2.out" }, at(2, 0.3));
      tl.set("#la-dots", { opacity: 1 }, at(2, 0.33));
      tl.fromTo("#la-dots .la-dot", { opacity: 0 }, { opacity: 0.85, duration: 0.25, stagger: 0.008, immediateRender: false }, at(2, 0.33));
      IN("#la-no", at(2, 0.72), 0.5);
      // L3 diagram: EL
      OUT("#la-ed, #la-edl, #la-out, #la-outl, #la-dots, #la-no, #la-lim", at(3, 0), 0.5);
      IN("#la-t1", at(3, 0.06), 0.5);
