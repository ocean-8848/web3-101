      IN("#di-a0, #di-a1, #di-a2", at(4, 0.15), 0.4);

      tl.to("#di-flag line, #di-flag path", { stroke: "#FF9F43", fill: "#FF9F43", duration: 0.3 }, at(4, 0.38));

      tl.to("#di-flag line, #di-flag path", { stroke: "#83C167", fill: "#83C167", duration: 0.3 }, at(4, 0.82));
      IN("#di-rec", at(4, 0.86), 0.4);
      // L5 2024-01
