          <circle id="mo-q0" class="h" cx="168" cy="520" r="10" fill="#3a3f4b"/>

          <circle id="mo-q3" class="h" cx="432" cy="520" r="10" fill="#3a3f4b"/>
          <circle id="mo-q4" class="h" cx="520" cy="520" r="10" fill="#3a3f4b"/>

      <g id="mo-term" class="h">
        <rect x="70" y="56" width="560" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">落后高度 <tspan font-size="28" font-weight="400" fill="#8a8f99">Head Lag</tspan></text>

  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const LIGHT = (k, col, t) => {
        tl.to(`#mo-a${k} .lc`, { fill: col, duration: 0.3 }, t);
        tl.to(`#mo-a${k} .lt`, { fill: "#e8e6df", duration: 0.3 }, t);
        IN(`#mo-s${k}`, t, 0.3, { scale: 1.3, svgOrigin: `1760 ${350 + 90 * k}` }, { scale: 1, svgOrigin: `1760 ${350 + 90 * k}` });
      };
      // L0 仪表盘 + 落后高度
      for (let i = 0; i < 8; i++) IN(`#mo-c${i}`, at(0, 0.02) + i * 0.06, 0.4);
      IN("#mo-ap", at(0, 0.05), 0.5);
      for (let k = 0; k < 7; k++) IN(`#mo-a${k}`, at(0, 0.08) + k * 0.05, 0.3);
      IN("#mo-term", at(0, 0.18), 0.5);
      IN("#mo-x0", at(0, 0.38), 0.4);
      IN("#mo-lagv", at(0, 0.4), 0.3);
      DRAW("#mo-lagA", at(0, 0.42), 1.6);
      COUNT("#mo-lagv", 0, 12, at(0, 0.42), 1.6);
      tl.to("#mo-c0 .cr", { stroke: "#FF9F43", duration: 0.3 }, at(0, 0.6));
      tl.to("#mo-lagv", { fill: "#FF9F43", duration: 0.3 }, at(0, 0.6));
      LIGHT(0, "#FF9F43", at(0, 0.62));
      DRAW("#mo-lagB", at(0, 0.8), 0.9);
      COUNT("#mo-lagv", 12, 56, at(0, 0.8), 0.9);
      tl.to("#mo-c0 .cr", { stroke: "#FC6255", duration: 0.3 }, at(0, 0.88));
      tl.to("#mo-lagv", { fill: "#FC6255", duration: 0.3 }, at(0, 0.88));
      LIGHT(1, "#FC6255", at(0, 0.9));
      OUT("#mo-term", at(1, 0.25), 0.4);
      // L1 卡死 + RPC
      IN("#mo-agev", at(1, 0.03), 0.3);
      DRAW("#mo-ageS", at(1, 0.03), 1.5);
      COUNT("#mo-agev", 0, 130, at(1, 0.1), 2.0, v => `${Math.round(v)} s`);
      tl.to("#mo-agev", { fill: "#FC6255", duration: 0.3 }, at(1, 0.36));
      tl.to("#mo-c1 .cr", { stroke: "#FC6255", duration: 0.3 }, at(1, 0.36));
      LIGHT(2, "#FC6255", at(1, 0.38));
      DRAW("#mo-errS", at(1, 0.55), 0.8);
      IN("#mo-errv", at(1, 0.62), 0.3);
      DRAW("#mo-durS", at(1, 0.65), 0.8);
      IN("#mo-durv", at(1, 0.72), 0.3);
      tl.to("#mo-c2 .cr, #mo-c3 .cr", { stroke: "#FF9F43", duration: 0.3 }, at(1, 0.74));
      LIGHT(3, "#FF9F43", at(1, 0.78));
      // L2 重组深度
      IN("#mo-x4, #mo-rdv", at(2, 0.02), 0.3);
      const BAR = (k, h, t) => { IN(`#mo-rb${k}`, t, 0.01); tl.fromTo(`#mo-rb${k}`, { attr: { y: 783, height: 0 } }, { attr: { y: 783 - h, height: h }, duration: 0.5, ease: "power2.out", immediateRender: false }, t); };
      BAR(0, 12, at(2, 0.05)); BAR(1, 20, at(2, 0.12)); BAR(2, 38, at(2, 0.22));
      COUNT("#mo-rdv", 1, 3, at(2, 0.22), 0.5);
      tl.to("#mo-rb2, #mo-rdv", { fill: "#FF9F43", duration: 0.3 }, at(2, 0.3));
      tl.to("#mo-c4 .cr", { stroke: "#FF9F43", duration: 0.3 }, at(2, 0.3));
      LIGHT(4, "#FF9F43", at(2, 0.32));
      BAR(3, 78, at(2, 0.62));
      COUNT("#mo-rdv", 3, 12, at(2, 0.62), 0.5);
      tl.to("#mo-rb3, #mo-rdv", { fill: "#FC6255", duration: 0.3 }, at(2, 0.7));
      tl.to("#mo-c4 .cr", { stroke: "#FC6255", duration: 0.3 }, at(2, 0.7));
      OUT("#mo-s4", at(2, 0.72), 0.2);
      IN("#mo-s4b", at(2, 0.76), 0.3);
      tl.to("#mo-a4 .lc", { fill: "#FC6255", duration: 0.3 }, at(2, 0.76));
      // L3 确认后回滚 = 资金事故
      DRAW("#mo-revL", at(3, 0.02), 0.6);
      IN("#mo-revv", at(3, 0.02), 0.3);
      DRAW("#mo-revS", at(3, 0.14), 0.3);
      COUNT("#mo-revv", 0, 1, at(3, 0.15), 0.2);
      tl.to("#mo-revv", { fill: "#FC6255", duration: 0.2 }, at(3, 0.15));
      tl.to("#mo-c5 .cr", { stroke: "#FC6255", fill: "#3a1a1a", duration: 0.25, yoyo: true, repeat: 3 }, at(3, 0.16));
      tl.to("#mo-c5 .cr", { stroke: "#FC6255", duration: 0.2 }, at(3, 0.16) + 1.0);
      LIGHT(5, "#FC6255", at(3, 0.2));
      tl.to("#mo-s5", { fill: "#ffb0a8", duration: 0.25, yoyo: true, repeat: 3 }, at(3, 0.3));
      DRAW("#mo-f6, #mo-f7", at(3, 0.6), 0.6);
      IN("#mo-v6, #mo-v7", at(3, 0.6), 0.3);
      IN("#mo-g6", at(3, 0.68), 0.4);
      IN("#mo-g7", at(3, 0.76), 0.4);
      tl.to("#mo-c6 .cr, #mo-c7 .cr", { stroke: "#FF9F43", duration: 0.3 }, at(3, 0.78));
      LIGHT(6, "#FC6255", at(3, 0.82));
      // L4 测试台
      OUT("#mo-dash, #mo-alm", at(4, 0), 0.4);
      IN("#mo-bt", at(4, 0) + 0.45, 0.4);
      for (let k = 0; k < 3; k++) IN(`#mo-k${k}`, at(4, 0.1) + k * 0.06, 0.4, { x: -15 }, { x: 0 });
      IN("#mo-kr0", at(4, 0.2), 0.3);
      tl.to("#mo-kr0 .rx", { stroke: "#58C4DD", fill: "#161a22", duration: 0.4 }, at(4, 0.32));
      IN("#mo-ok0", at(4, 0.32), 0.4);
      IN("#mo-kr1", at(4, 0.4), 0.3);
      tl.to("#mo-kr1 .rx", { stroke: "#58C4DD", fill: "#161a22", duration: 0.4 }, at(4, 0.52));
      IN("#mo-ok1", at(4, 0.52), 0.4);
      IN("#mo-kr2", at(4, 0.64), 0.3);
      IN("#mo-ok2", at(4, 0.8), 0.4);
      // L5 20 个区块头
      OUT("#mo-bench", at(5, 0), 0.4);
      IN("#mo-ht", at(5, 0) + 0.45, 0.4);
      for (let j = 0; j < 20; j++) IN(`#mo-h${j}`, at(5, 0.1) + j * 0.05, 0.3, { y: 15 }, { y: 0 });
      for (let j = 0; j < 19; j++) {
        const t = at(5, 0.42) + j * 0.22;
        IN(`#mo-q${j}`, t, 0.01);
        tl.to(`#mo-q${j}`, { fill: j === 12 ? "#FF9F43" : "#83C167", duration: 0.2 }, t);
      }
      IN("#mo-oc", at(5, 0.42) + 12 * 0.22, 0.4);
      IN("#mo-hn", at(5, 0.3), 0.4);

      tl.to("#mo-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#mo-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["monitor"] = tl;
    })();
  </script>
