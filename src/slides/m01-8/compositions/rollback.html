    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const FR = (t, col) => tl.to("#rk-fro", { x: (col - 2) * 350, duration: 0.45, ease: "power2.inOut" }, t);
      const CUR = (t, col, d = 0.6) => tl.to("#rk-curo", { x: (col - 2) * 350, duration: d, ease: "power2.inOut" }, t);
      // L0
      IN("#rk-base", at(0, 0), 0.6);
      IN("#rk-l1g, #rk-l2g", at(0, 0.05), 0.6);
      IN("#rk-cur", at(0, 0.2), 0.5, { y: -20 }, { y: 0 });

      tl.to("#rk-par", { attr: { fill: "#FF9F43" }, duration: 0.3 }, at(0, 0.75));
      DRAW("#rk-k1", at(0, 0.8), 0.4); tl.set("#rk-k1", { opacity: 1 }, at(0, 0.8));
      DRAW("#rk-k2", at(0, 0.86), 0.4); tl.set("#rk-k2", { opacity: 1 }, at(0, 0.86));
      IN("#rk-ne0", at(0, 0.9), 0.3);
      // L1 compare
      OUT("#rk-k1, #rk-k2, #rk-ne0", at(1, 0), 0.3);
      IN("#rk-fr", at(1, 0.02), 0.4);
      IN("#rk-q2", at(1, 0.16), 0.3);
      FR(at(1, 0.3), 1);
      IN("#rk-q1", at(1, 0.44), 0.3);
      FR(at(1, 0.56), 0);
      IN("#rk-q0", at(1, 0.68), 0.3);
      tl.to("#rk-fr", { attr: { stroke: "#83C167" }, duration: 0.3 }, at(1, 0.74));
      tl.to("#rk-l0, #rk-c0", { attr: { stroke: "#83C167" }, duration: 0.3 }, at(1, 0.74));
      IN("#rk-glow", at(1, 0.76), 0.5);
      IN("#rk-anc", at(1, 0.82), 0.4);
      // L2 depth
      IN("#rk-term", at(2, 0), 0.5);
      tl.to("#rk-l1, #rk-l2", { attr: { stroke: "#FC6255" }, duration: 0.4 }, at(2, 0.1));
      IN("#rk-br", at(2, 0.4), 0.5);
      // L3 rollback transaction
      OUT("#rk-term", at(3, 0) - 0.3, 0.3);
      OUT("#rk-chain, #rk-q2, #rk-q1, #rk-q0, #rk-fr, #rk-br, #rk-anc", at(3, 0) - 0.3, 0.3);
      tl.to("#rk-glow", { attr: { height: 130 }, duration: 0.4 }, at(3, 0) - 0.3);
      IN("#rk-tx", at(3, 0.02), 0.5);
      IN("#rk-txl", at(3, 0.02), 0.5);
      IN("#rk-ear, #rk-eat, #rk-ebr, #rk-ebt", at(3, 0.05), 0.4);
      IN("#rk-del", at(3, 0.1), 0.4);
      // (1) shatter blocks + events
      tl.set("#rk-l1g, #rk-l2g", { opacity: 0 }, at(3, 0.16));
      [1, 2].forEach(i => [0, 1, 2, 3].forEach(k => {
        const id = "#rk-s" + i + k;
        tl.set(id, { opacity: 1 }, at(3, 0.16));
        tl.to(id, { x: (k % 2 ? 26 : -26), y: (k < 2 ? -10 : 40) + 30, opacity: 0, duration: 0.9, ease: "power2.in" }, at(3, 0.16));
      }));
      // (2) orphaned
      OUT("#rk-eat", at(3, 0.34), 0.25);
      tl.to("#rk-ear", { attr: { stroke: "#8a8f99" }, duration: 0.3 }, at(3, 0.34));
      IN("#rk-eas", at(3, 0.37), 0.3);
      // (3) reverted + message
      OUT("#rk-ebt", at(3, 0.53), 0.25);
      tl.to("#rk-ebr", { attr: { stroke: "#8a8f99" }, duration: 0.3 }, at(3, 0.53));
      IN("#rk-ebs", at(3, 0.56), 0.3);
      IN("#rk-env", at(3, 0.64), 0.3);
      tl.to("#rk-envo", { x: 400, duration: 0.8, ease: "power2.inOut" }, at(3, 0.66));
      IN("#rk-envl", at(3, 0.72), 0.4);
      // (4) cursor back
      CUR(at(3, 0.86), 0, 0.9);
      // L4 rescan
      OUT("#rk-tx, #rk-txl, #rk-ear, #rk-ebr, #rk-eas, #rk-ebs, #rk-env, #rk-envl, #rk-del", at(4, 0), 0.4);
      IN("#rk-n1", at(4, 0.15), 0.5, { y: 20 }, { y: 0 });
      CUR(at(4, 0.22), 1, 0.4);
      IN("#rk-n2", at(4, 0.4), 0.5, { y: 20 }, { y: 0 });
      CUR(at(4, 0.47), 2, 0.4);
      IN("#rk-n3", at(4, 0.65), 0.5, { y: 20 }, { y: 0 });
      CUR(at(4, 0.72), 3, 0.4);
      // L5 quiz
      OUT("#rk-main", at(5, 0), 0.4);
      IN("#rk-quiz", at(5, 0.03), 0.5);
