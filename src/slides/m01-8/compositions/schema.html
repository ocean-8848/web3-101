  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

const HL = (a, b, t) => tl.to("#sc-hb", { opacity: 1, attr: { y: 218 + 38 * a, height: 38 * (b - a + 1) }, duration: 0.35, ease: "power2.inOut" }, t);
      // L0 tables drop in
      IN("#sc-pg", at(0, 0), 0.5);
      ["#sc-blk", "#sc-txs", "#sc-tfs", "#sc-cur"].forEach((id, k) => IN(id, at(0, 0.12) + 0.3 * k, 0.5, { y: -40 }, { y: 0, ease: "bounce.out" }));
      IN("#sc-code", at(0, 0.55), 0.6);
      // L1 amount NUMERIC(78,0)
      HL(5, 5, at(1, 0));
      IN("#sc-u", at(1, 0.25), 0.5);
      tl.set("#sc-ubar", { opacity: 1 }, at(1, 0.5));
      tl.to("#sc-ucr", { attr: { width: 790 }, duration: 1.6, ease: "none" }, at(1, 0.5));
      IN("#sc-u78", at(1, 0.78), 0.4);
      // L2 BYTEA
      OUT("#sc-u, #sc-ubar, #sc-u78", at(2, 0), 0.3);
      HL(2, 2, at(2, 0.02));
      IN("#sc-h1", at(2, 0.1), 0.5);
      IN("#sc-h2", at(2, 0.25), 0.5);
      IN("#sc-half", at(2, 0.42), 0.4);
      IN("#sc-enc", at(2, 0.72), 0.5);
      // L3 FK + cascade
      OUT("#sc-h1, #sc-h2, #sc-half, #sc-enc", at(3, 0), 0.3);
      HL(7, 9, at(3, 0.02));
      ARROW("#sc-fk1", at(3, 0.1), 0.6);
      ARROW("#sc-fk2", at(3, 0.2), 0.6);
      IN("#sc-fkl", at(3, 0.3), 0.4);
      HL(10, 11, at(3, 0.55));
      tl.to("#sc-bk2", { attr: { fill: "#FC6255", "fill-opacity": 1 }, duration: 0.3 }, at(3, 0.6));
      OUT("#sc-bk2", at(3, 0.68), 0.4);
      OUT("#sc-tx2, #sc-tf2", at(3, 0.78), 0.5);
      // L4 archive before delete
      IN("#sc-arc", at(4, 0.08), 0.5, { x: 20 }, { x: 0 });
      tl.to("#sc-bk1", { attr: { fill: "#FF9F43" }, duration: 0.3 }, at(4, 0.35));
      tl.set("#sc-ghost", { opacity: 1 }, at(4, 0.45));
      tl.to("#sc-ghost", { x: 450, attr: { width: 320 }, duration: 0.8, ease: "power2.inOut" }, at(4, 0.45));
      tl.set("#sc-ghost", { opacity: 0 }, at(4, 0.45) + 0.8);
      tl.set("#sc-abar", { opacity: 1 }, at(4, 0.45) + 0.8);
      tl.to("#sc-bk1", { attr: { fill: "#FC6255" }, duration: 0.2 }, at(4, 0.7));
      OUT("#sc-bk1", at(4, 0.74), 0.4);
      OUT("#sc-tx1, #sc-tf1", at(4, 0.82), 0.4);
      // L5 cursors + partitions
      HL(4, 4, at(5, 0.4));
      [0, 1, 2].forEach(k => IN("#sc-cc" + k, at(5, 0.05) + 0.4 * k, 0.4, { y: 12 }, { y: 0 }));
      IN("#sc-pt", at(5, 0.4), 0.5);
      [0, 1, 2, 3].forEach(k => IN("#sc-p" + k, at(5, 0.45) + 0.2 * k, 0.4));
      tl.to("#sc-pr0, #sc-pr1, #sc-pr2", { attr: { stroke: "#8a8f99", fill: "#8a8f9912" }, duration: 0.4 }, at(5, 0.75));
      tl.to("#sc-pl0, #sc-pl1, #sc-pl2", { attr: { fill: "#8a8f99" }, duration: 0.4 }, at(5, 0.75));
      IN("#sc-lk0, #sc-lk1, #sc-lk2", at(5, 0.77), 0.4);
      IN("#sc-pold", at(5, 0.8), 0.5);


      tl.to("#sc-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["schema"] = tl;
    })();
