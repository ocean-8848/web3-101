  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const HL = (a, b, t, c = "#58C4DD") => tl.to("#lo-hl", { attr: { y: 290 + a * 40 - 29, height: (b - a + 1) * 40 }, fill: c, duration: 0.4, ease: "power2.inOut" }, t);
      const LIT = (i, t, c = "#58C4DD") => { tl.to(`#lo-n${i} .nb`, { stroke: c, duration: 0.3 }, t); tl.to(`#lo-n${i} .nt`, { fill: "#e8e6df", duration: 0.3 }, t); };
      const DIM = (i, t) => { tl.to(`#lo-n${i} .nb`, { stroke: "#3a3f4b", duration: 0.3 }, t); tl.to(`#lo-n${i} .nt`, { fill: "#6b6f7a", duration: 0.3 }, t); };
      // L0 状态机 + 代码；读游标
      IN("#lo-term", at(0, 0.02), 0.5);
      for (let i = 0; i < 6; i++) IN(`#lo-n${i}`, at(0, 0.03 + i * 0.025), 0.4, { x: -16 }, { x: 0 });
      for (let k = 0; k < 5; k++) ARROW(`#lo-e${k}`, at(0, 0.06 + k * 0.025), 0.3);
      ARROW("#lo-ret", at(0, 0.2), 0.8);
      IN("#lo-code", at(0, 0.12), 0.6, { x: 30 }, { x: 0 });
      IN("#lo-omit", at(0, 0.2), 0.5);
      LIT(0, at(0, 0.3));
      IN("#lo-bm, #lo-bt0", at(0, 0.4), 0.5, { y: -16 }, { y: 0 });
      IN("#lo-ex", at(0, 0.45), 0.4);
      tl.to("#lo-bmp", { strokeWidth: 6, duration: 0.3, yoyo: true, repeat: 1 }, at(0, 0.6));
      IN("#lo-first", at(0, 0.76), 0.5);
      OUT("#lo-term", at(1, 0.0), 0.4);
      // L1 读链头；追上就休眠；lag
      OUT("#lo-first", at(1, 0), 0.3);
      DIM(0, at(1, 0.02)); LIT(1, at(1, 0.02));
      HL(2, 3, at(1, 0.02));
      IN("#lo-head", at(1, 0.06), 0.4);
      COUNT("#lo-hn", 1005, 1008, at(1, 0.1), 1.0, v => Math.round(v).toLocaleString("en-US"));
      IN("#lo-zz", at(1, 0.4), 0.4);
      tl.to("#lo-zz", { y: -8, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, at(1, 0.45));
      IN("#lo-lag", at(1, 0.68), 0.5, { x: -16 }, { x: 0 });
      // L2 拉区块头，比父哈希
      OUT("#lo-head, #lo-zz, #lo-lag", at(2, 0), 0.3);
      DIM(1, at(2, 0.02)); LIT(2, at(2, 0.02));
      HL(4, 6, at(2, 0.02));
      IN("#lo-hc, #lo-ph0", at(2, 0.08), 0.5, { y: 16 }, { y: 0 });
      LIT(3, at(2, 0.25), "#FF9F43");
      DRAW("#lo-br", at(2, 0.27), 0.7);
      DRAW("#lo-ok", at(2, 0.4), 0.3);
      OUT("#lo-ph0", at(2, 0.58), 0.25);
      tl.to("#lo-ok", { opacity: 0, duration: 0.2 }, at(2, 0.58));
      IN("#lo-ph1", at(2, 0.6), 0.3);
      tl.to("#lo-br", { stroke: "#FC6255", duration: 0.2 }, at(2, 0.62));
      tl.to("#lo-hcr", { stroke: "#FC6255", duration: 0.2 }, at(2, 0.62));
      DRAW("#lo-ng", at(2, 0.64), 0.3);
      tl.to("#lo-n3 .nb", { stroke: "#FC6255", duration: 0.2 }, at(2, 0.7));
      ARROW("#lo-exit", at(2, 0.72), 0.4);
      IN("#lo-exitl", at(2, 0.75), 0.4, { x: -10 }, { x: 0 });
      // L3 对得上 → 按区块哈希拉日志
      OUT("#lo-hc, #lo-ph1, #lo-br, #lo-ng", at(3, 0), 0.3);
      tl.to("#lo-n3 .nb", { stroke: "#83C167", duration: 0.3 }, at(3, 0.02));
      LIT(4, at(3, 0.1)); DIM(2, at(3, 0.1));
      HL(7, 8, at(3, 0.1));
      IN("#lo-key", at(3, 0.16), 0.4, { x: -16 }, { x: 0 });
      IN("#lo-lb1", at(3, 0.22), 0.4);
      IN("#lo-lb2", at(3, 0.26), 0.4);
      tl.to("#lo-key", { x: 50, duration: 0.7, ease: "power2.inOut" }, at(3, 0.42));
      tl.to("#lo-lb1r", { stroke: "#83C167", strokeWidth: 5, duration: 0.3 }, at(3, 0.42) + 0.7);
      tl.to("#lo-lb2", { opacity: 0.35, duration: 0.4 }, at(3, 0.62));
      IN("#lo-eip", at(3, 0.7), 0.4);
      // L4 坑：负载均衡后面两个分叉
      OUT("#lo-key, #lo-lb1, #lo-lb2, #lo-eip", at(4, 0), 0.3);
      HL(7, 8, at(4, 0.04), "#FF9F43");
      IN("#lo-w", at(4, 0.06), 0.4);
      IN("#lo-lbx", at(4, 0.3), 0.5);
      IN("#lo-cA", at(4, 0.66), 0.4, { y: -12 }, { y: 0 });
      IN("#lo-cB", at(4, 0.78), 0.4, { y: -12 }, { y: 0 });
      DRAW("#lo-x", at(4, 0.88), 0.3);
      // L5 解析 → 一个事务写库 → 游标前移 → Confirmer
