        <g id="im-d1" class="h"><rect x="100" y="520" width="580" height="70" rx="10" fill="#83C16712" stroke="#83C167" stroke-width="2.5" /><text class="mono" x="130" y="566" font-size="28" fill="#e8e6df">0x9f #3</text><text x="660" y="566" font-size="28" fill="#83C167" text-anchor="end">有效 ✓</text></g>
        <g id="im-e0" class="h"><rect id="im-er0" x="100" y="690" width="170" height="80" rx="12" fill="#83C1671a" stroke="#83C167" stroke-width="2.5" /><text x="185" y="741" font-size="30" font-weight="700" fill="#83C167" text-anchor="middle">入账</text></g>
        <g id="im-e1" class="h"><rect id="im-er1" x="300" y="690" width="170" height="80" rx="12" fill="#83C1671a" stroke="#83C167" stroke-width="2.5" /><text x="385" y="741" font-size="30" font-weight="700" fill="#83C167" text-anchor="middle">冲正</text></g>
        <g id="im-e2" class="h"><rect id="im-er2" x="500" y="690" width="170" height="80" rx="12" fill="#FC62551a" stroke="#FC6255" stroke-width="2.5" /><text x="585" y="741" font-size="30" font-weight="700" fill="#FC6255" text-anchor="middle">入账</text></g>
        <path id="im-ex" class="h" d="M480 800 L520 840 M520 800 L480 840" stroke="#FC6255" stroke-width="6" stroke-linecap="round" />
        <text id="im-exl" class="h" x="540" y="832" font-size="28" fill="#FC6255">重复，被拒</text>
        <text id="im-ledl" class="h" x="100" y="664" font-size="28" fill="#8a8f99">同一笔记录的流水</text>
      </g>
      <g id="im-term" class="h">
        <rect x="70" y="56" width="520" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">幂等 <tspan font-size="28" font-weight="400" fill="#8a8f99">Idempotency</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">执行多次 = 执行一次</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const ROW = (i, t) => {
        tl.to("#im-rr0, #im-rr1, #im-rr2, #im-rr3, #im-rr4", { attr: { stroke: "#2a2f3a" }, duration: 0.3 }, t);
        tl.to("#im-rr" + i, { attr: { stroke: "#58C4DD" }, duration: 0.3 }, t);
      };
      // L0 three sources fire the same block
      IN("#im-db", at(0, 0), 0.6);
      [0, 1, 2].forEach(k => {
        const t0 = at(0, 0.12 + 0.28 * k);
        IN("#im-s" + k, t0, 0.4, { x: -20 }, { x: 0 });
        IN("#im-k" + k, t0 + 0.3, 0.3);
        tl.to("#im-k" + k + "o", { x: 560 + 12 * k, y: 490 - [330, 530, 730][k] + 12 * k, duration: 0.8, ease: "power2.inOut" }, t0 + 0.5);
        if (k > 0) tl.to("#im-kt" + (k - 1), { opacity: 0, duration: 0.15 }, t0 + 1.0);
      });
      // L1 idempotent: 3 writes, still 1 row
      IN("#im-term", at(1, 0), 0.5);
      IN("#im-cnt", at(1, 0.05), 0.4);
      [2, 1, 0].forEach((k, j) => {
        const t0 = at(1, 0.15 + 0.27 * j);
        tl.to("#im-k" + k + "o", { x: 880, y: 440 - [330, 530, 730][k], duration: 0.5, ease: "power2.in" }, t0);
        tl.to("#im-k" + k, { opacity: 0, duration: 0.25 }, t0 + 0.3);
        if (k > 0) tl.to("#im-kt" + (k - 1), { opacity: 1, duration: 0.2 }, t0 + 0.4);
        if (j === 0) IN("#im-row", t0 + 0.45, 0.3);
        tl.fromTo("#im-rowr", { attr: { fill: "#83C16766" } }, { attr: { fill: "#58C4DD22" }, duration: 0.6, immediateRender: false }, t0 + 0.45);
        if (j > 0) COUNT("#im-n", j, j + 1, t0 + 0.45, 0.2);
      });
      // L2 table + block key
      OUT("#im-term", at(2, 0) - 0.2, 0.3);
      OUT("#im-src, #im-db, #im-row, #im-cnt", at(2, 0) - 0.2, 0.3);
      IN("#im-r0", at(2, 0.05), 0.5, { y: 20 }, { y: 0 });
      ROW(0, at(2, 0.1));
      IN("#im-slot", at(2, 0.25), 0.4);
      IN("#im-ba", at(2, 0.28), 0.3);
      tl.to("#im-bao", { x: 200, duration: 0.6, ease: "power2.out" }, at(2, 0.32));
      IN("#im-bb", at(2, 0.42), 0.3);
      tl.to("#im-bbo", { x: 120, duration: 0.4, ease: "power2.in" }, at(2, 0.46));
      tl.to("#im-bbo", { x: 0, y: 140, duration: 0.5, ease: "power2.out" }, at(2, 0.46) + 0.4);
      tl.to("#im-bbr", { attr: { stroke: "#FC6255" }, duration: 0.3 }, at(2, 0.46) + 0.4);
      IN("#im-bx", at(2, 0.6), 0.3);
      // L3 tx
      OUT("#im-slot, #im-ba, #im-bb, #im-bx", at(3, 0), 0.4);
      IN("#im-r1", at(3, 0.02), 0.5, { y: 20 }, { y: 0 });
      ROW(1, at(3, 0.05));
      IN("#im-tb", at(3, 0.15), 0.5);
      IN("#im-tx1", at(3, 0.2), 0.4);
      ARROW("#im-tarr", at(3, 0.45), 0.5);
      tl.to("#im-tx1r", { attr: { stroke: "#FC6255" }, duration: 0.3 }, at(3, 0.6));
      tl.to("#im-tx1", { opacity: 0.0, duration: 0.5 }, at(3, 0.66));
      IN("#im-tdel", at(3, 0.62), 0.4);
      IN("#im-tx2", at(3, 0.76), 0.4, { y: -16 }, { y: 0 });
      IN("#im-tins", at(3, 0.8), 0.4);
      // L4 logs
      OUT("#im-tb, #im-tx2, #im-tarr, #im-tdel, #im-tins", at(4, 0), 0.4);
      IN("#im-r2", at(4, 0.02), 0.5, { y: 20 }, { y: 0 });
      ROW(2, at(4, 0.05));
      IN("#im-lb", at(4, 0.2), 0.5);
      IN("#im-ta", at(4, 0.3), 0.4);
      [0, 1, 2, 3].forEach(k => IN("#im-g" + k, at(4, 0.35) + 0.25 * k, 0.3, { y: 12 }, { y: 0 }));
      OUT("#im-ta", at(4, 0.72), 0.3);
      IN("#im-tbb", at(4, 0.76), 0.4);
      IN("#im-repack", at(4, 0.8), 0.4);
      // L5 fifty transfers
      OUT("#im-lb, #im-tbb, #im-g0, #im-g1, #im-g2, #im-g3, #im-repack", at(5, 0), 0.4);
      IN("#im-50t", at(5, 0.1), 0.4);
      tl.fromTo("#im-c0, .im-cx", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.03 }, at(5, 0.22));
      IN("#im-only", at(5, 0.6), 0.4);
      tl.to(".im-cx", { attr: { stroke: "#FC6255", fill: "#FC625522" }, duration: 0.4, stagger: 0.01 }, at(5, 0.64));
      tl.to(".im-cx", { opacity: 0.25, duration: 0.4 }, at(5, 0.78));
      tl.to("#im-c0", { attr: { stroke: "#83C167", fill: "#83C16744" }, duration: 0.3 }, at(5, 0.64));
      IN("#im-plus", at(5, 0.9), 0.4);
      tl.to("#im-c0, .im-cx", { opacity: 1, attr: { stroke: "#83C167", fill: "#83C16733" }, duration: 0.4 }, at(5, 0.92));
      // L6 deposits + ledger
      OUT("#im-50t, #im-c0, .im-cx, #im-only, #im-plus", at(6, 0), 0.4);
      IN("#im-r3", at(6, 0.02), 0.5, { y: 20 }, { y: 0 });
      ROW(3, at(6, 0.05));
      IN("#im-d0", at(6, 0.15), 0.4);
      IN("#im-d1", at(6, 0.3), 0.4, { x: -30 }, { x: 0 });
      IN("#im-r4", at(6, 0.5), 0.5, { y: 20 }, { y: 0 });
      ROW(4, at(6, 0.52));
      IN("#im-ledl", at(6, 0.56), 0.4);
      IN("#im-e0", at(6, 0.6), 0.3);
      IN("#im-e1", at(6, 0.68), 0.3);
      IN("#im-e2", at(6, 0.78), 0.3, { x: 30 }, { x: 0 });
      IN("#im-ex", at(6, 0.84), 0.3);
      IN("#im-exl", at(6, 0.86), 0.3);


      tl.to("#im-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to('[id^="im-term"]', { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["idem"] = tl;
    })();
  </script>
</template>
