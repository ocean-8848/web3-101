  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 标题条 + 数据源
      IN("#ro-bar", at(0, 0.02), 0.6, { y: 120 }, { y: 0 });
      IN("#ro-src", at(0, 0.4), 0.6, { x: -30 }, { x: 0 });
      // L1 Fetcher
      ARROW("#ro-a0", at(1, 0.0), 0.5);
      IN("#ro-fe", at(1, 0.04), 0.5, { scale: 0.9, svgOrigin: "620 345" }, { scale: 1, svgOrigin: "620 345" });
      IN("#ro-t0", at(1, 0.35), 0.4, { x: -14 }, { x: 0 });
      IN("#ro-t1", at(1, 0.52), 0.4, { x: -14 }, { x: 0 });
      IN("#ro-xl", at(1, 0.56), 0.5);
      IN("#ro-xlt", at(1, 0.6), 0.5);
      IN("#ro-t2", at(1, 0.78), 0.4, { x: -14 }, { x: 0 });
      // L2 Parser + 死信表
      OUT("#ro-tags", at(2, 0), 0.4);
      ARROW("#ro-a1", at(2, 0.02), 0.5);
      IN("#ro-pa", at(2, 0.05), 0.5, { scale: 0.9, svgOrigin: "1160 345" }, { scale: 1, svgOrigin: "1160 345" });
      IN("#ro-c1", at(2, 0.14), 0.4, { y: -20 }, { y: 0 });
      tl.to("#ro-c1", { y: 60, opacity: 0, duration: 0.5, ease: "power2.in" }, at(2, 0.22));
      IN("#ro-c2", at(2, 0.32), 0.4, { y: -20 }, { y: 0 });
      tl.to("#ro-c2 .cr", { stroke: "#6b6f7a", duration: 0.3 }, at(2, 0.4));
      tl.to("#ro-c2 .ct", { fill: "#6b6f7a", duration: 0.3 }, at(2, 0.4));
      tl.to("#ro-c2", { keyframes: [{ x: 8, duration: 0.08 }, { x: -8, duration: 0.08 }, { x: 0, duration: 0.08 }] }, at(2, 0.4));
      IN("#ro-c2l", at(2, 0.42), 0.4);
      OUT("#ro-c2, #ro-c2l", at(2, 0.54), 0.3);
      IN("#ro-c3", at(2, 0.58), 0.4, { y: -20 }, { y: 0 });
      IN("#ro-dr", at(2, 0.6), 0.5);
      IN("#ro-term", at(2, 0.6), 0.5);
      OUT("#ro-c3", at(2, 0.72), 0.3);
      IN("#ro-c3b", at(2, 0.75), 0.5, { y: -30 }, { y: 0 });
      // L3 Store：一个事务 → PostgreSQL；演示失败回滚
      OUT("#ro-term", at(3, 0.3), 0.4);
      ARROW("#ro-a2", at(3, 0.02), 0.5);
      IN("#ro-st", at(3, 0.05), 0.5, { scale: 0.9, svgOrigin: "1540 345" }, { scale: 1, svgOrigin: "1540 345" });
      IN("#ro-tx", at(3, 0.14), 0.5);
      IN("#ro-ch0", at(3, 0.2), 0.4, { y: -14 }, { y: 0 });
      IN("#ro-ch1", at(3, 0.24), 0.4, { y: -14 }, { y: 0 });
      IN("#ro-ch2", at(3, 0.28), 0.4, { y: -14 }, { y: 0 });
      IN("#ro-txl", at(3, 0.3), 0.4);
      ARROW("#ro-a3", at(3, 0.4), 0.4);
      IN("#ro-db", at(3, 0.44), 0.5, { y: 20 }, { y: 0 });
      tl.to("#ro-txr", { stroke: "#FC6255", duration: 0.25 }, at(3, 0.62));
      tl.to("#ro-ch0, #ro-ch1, #ro-ch2", { y: -18, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, at(3, 0.64));
      OUT("#ro-txl", at(3, 0.64), 0.25);
      IN("#ro-txf", at(3, 0.7), 0.4);
      tl.to("#ro-txr", { stroke: "#83C167", duration: 0.3 }, at(3, 0.95));
      // L4 Confirmer + outbox
      OUT("#ro-txf", at(4, 0), 0.3);
      IN("#ro-txl", at(4, 0.05), 0.4);
      ARROW("#ro-a4", at(4, 0.02), 0.4);
      IN("#ro-cf", at(4, 0.05), 0.5, { y: 20 }, { y: 0 });
      IN("#ro-th", at(4, 0.16), 0.4);
      tl.fromTo("#ro-thf", { attr: { width: 0 } }, { attr: { width: 200 }, duration: 1.2, ease: "power1.inOut", immediateRender: false }, at(4, 0.2));
      ARROW("#ro-a5", at(4, 0.4), 0.5);
      IN("#ro-kf", at(4, 0.44), 0.5, { x: 20 }, { x: 0 });
      IN("#ro-ob", at(4, 0.6), 0.4);
      IN("#ro-msg", at(4, 0.62), 0.2);
      tl.to("#ro-msg", { keyframes: [{ x: -70, duration: 0.4, ease: "none" }, { y: 50, duration: 0.35, ease: "power2.in" }] }, at(4, 0.64));
      tl.to("#ro-obr", { stroke: "#FF9F43", duration: 0.2, yoyo: true, repeat: 1 }, at(4, 0.64) + 0.75);
      tl.to("#ro-msg", { keyframes: [{ y: 0, x: -110, duration: 0.4 }, { x: -180, opacity: 0, duration: 0.4 }] }, at(4, 0.86));
      // L5 父哈希分支 + Reorg Handler + Reconciler
      OUT("#ro-a1", at(5, 0), 0.25);
      ARROW("#ro-a1a", at(5, 0.03), 0.3);
      IN("#ro-dm", at(5, 0.05), 0.4, { scale: 0.92, svgOrigin: "880 345" }, { scale: 1, svgOrigin: "880 345" });
      ARROW("#ro-a1b", at(5, 0.08), 0.3);
      IN("#ro-yes", at(5, 0.1), 0.3);
      ARROW("#ro-no", at(5, 0.18), 0.4);
      IN("#ro-nol", at(5, 0.2), 0.3);
      IN("#ro-rh", at(5, 0.24), 0.5, { y: 16 }, { y: 0 });
      ARROW("#ro-rp", at(5, 0.36), 0.6);
      IN("#ro-rc", at(5, 0.56), 0.5, { y: 16 }, { y: 0 });
      IN("#ro-rcl", at(5, 0.58), 0.4);
      IN("#ro-al", at(5, 0.68), 0.4);
      IN("#ro-alt", at(5, 0.7), 0.4);
      IN("#ro-rcn", at(5, 0.8), 0.5);
      // L6 三种故障 → 三道防线
      OUT("#ro-xl, #ro-xlt, #ro-al, #ro-alt, #ro-rcn", at(6, 0), 0.4);
      IN("#ro-f0", at(6, 0.1), 0.4, { y: 20 }, { y: 0 });
      DRAW("#ro-l0", at(6, 0.16), 0.6);
      IN("#ro-f1", at(6, 0.3), 0.4, { y: 20 }, { y: 0 });
      DRAW("#ro-l1", at(6, 0.36), 0.6);
