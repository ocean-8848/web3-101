          <g id="co-scan" class="h"><line x1="1100" y1="760" x2="1800" y2="760" stroke="#8a8f99" stroke-width="3" stroke-dasharray="8 8"/>
            <text x="1100" y="818" font-size="28" fill="#8a8f99">扫描继续</text></g>
          <circle id="co-dot" class="h" cx="1100" cy="760" r="11" fill="#58C4DD"/>
          <g id="co-s3" class="h"><rect x="160" y="800" width="280" height="90" rx="14" fill="#161a22" stroke="#B48EF0" stroke-width="3"/><text x="300" y="856" font-size="32" fill="#B48EF0" text-anchor="middle">源 C</text></g>
          <text id="co-lag" class="h" x="480" y="857" font-size="30" fill="#FF9F43">落后 5 块（示例）</text>
          <text id="co-rm" class="h" x="480" y="857" font-size="30" font-weight="700" fill="#FC6255">移出路由</text>
        </g>
      </g>


    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 写库 ≠ 入账：卡片停在闸门前
      IN("#co-card", at(0, 0.03), 0.9, { x: -200 }, { x: 0 });
      IN("#co-gate", at(0, 0.3), 0.6);
      tl.to("#co-gate .gp", { fill: "#FFD08A", duration: 0.25, yoyo: true, repeat: 3 }, at(0, 0.62));
      // L1-L2 分档表逐行长出
      OUT("#co-card, #co-gate", at(1, 0), 0.4);
      IN("#co-tab", at(1, 0) + 0.45, 0.5);
      const ROW = (i, t0, t1, t2) => { IN(`#co-r${i}a`, t0, 0.5, { x: -20 }, { x: 0 }); IN(`#co-r${i}s`, t1, 0.5); IN(`#co-r${i}b`, t2, 0.5); };
      ROW(0, at(1, 0.1), at(1, 0.2), at(1, 0.33));
      ROW(1, at(1, 0.47), at(1, 0.57), at(1, 0.75));
      ROW(2, at(2, 0.03), at(2, 0.1), at(2, 0.2));
      ROW(3, at(2, 0.33), at(2, 0.45), at(2, 0.6));
      ROW(4, at(2, 0.75), at(2, 0.83), at(2, 0.92));
      // L3 算一算：1000 → 1011
      OUT("#co-tab, #co-rows", at(3, 0), 0.4);
      IN("#co-f0", at(3, 0) + 0.45, 0.6, { y: 15 }, { y: 0 });
      for (let i = 0; i < 12; i++) IN(`#co-k${i}`, at(3, 0.25) + i * 0.06, 0.4, { x: -20 }, { x: 0 });
      tl.to("#co-k0 .bk", { stroke: "#F0B90B", duration: 0.3 }, at(3, 0.45));
      IN("#co-dl", at(3, 0.45), 0.4);
      IN("#co-hl", at(3, 0.6), 0.4);
      for (let i = 0; i < 12; i++) IN(`#co-n${i}`, at(3, 0.62) + i * 0.1, 0.25, { y: 10 }, { y: 0 });
      IN("#co-f1", at(3, 0.84), 0.5);
      IN("#co-ok1", at(3, 0.93), 0.4, { scale: 1.3, svgOrigin: "960 785" }, { scale: 1, svgOrigin: "960 785" });
      // L4 大额 64 确认
      OUT("#co-c3", at(4, 0), 0.4);
      IN("#co-f2", at(4, 0) + 0.45, 0.5);
      IN("#co-f3", at(4, 0.3), 0.5, { y: 15 }, { y: 0 });
      IN("#co-f4", at(4, 0.58), 0.5);
      IN("#co-ok2", at(4, 0.82), 0.4, { scale: 1.3, svgOrigin: "960 785" }, { scale: 1, svgOrigin: "960 785" });
      // L5 N=1 vs N=6
      OUT("#co-f0, #co-c4", at(5, 0), 0.4);
      IN("#co-lp, #co-rp", at(5, 0) + 0.45, 0.5);
      for (const s of ["l", "r"]) for (let i = 0; i < 4; i++) IN(`#co-${s}b${i}`, at(5, [0.08, 0.14, 0.24, 0.3][i]), 0.35, { x: -15 }, { x: 0 });
      IN("#co-ls0", at(5, 0.18), 0.4);
      IN("#co-rs0", at(5, 0.18), 0.4);
      IN("#co-lac, #co-rac", at(5, 0.18), 0.4);
      COUNT("#co-rcnt", 1, 2, at(5, 0.26), 0.3, v => `${Math.round(v)}/6`);
      COUNT("#co-rcnt", 2, 3, at(5, 0.32), 0.3, v => `${Math.round(v)}/6`);
      tl.to("#co-lb1 .bk, #co-lb2 .bk, #co-lb3 .bk, #co-rb1 .bk, #co-rb2 .bk, #co-rb3 .bk", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.42));
      tl.to("#co-lb1, #co-lb2, #co-lb3, #co-rb1, #co-rb2, #co-rb3", { y: 160, opacity: 0, duration: 0.7, ease: "power2.in", stagger: 0.05 }, at(5, 0.47));
      for (const s of ["l", "r"]) for (let i = 1; i < 4; i++) IN(`#co-${s}m${i}`, at(5, 0.55) + i * 0.08, 0.35, { x: -15 }, { x: 0 });
      OUT("#co-ls0", at(5, 0.6), 0.3);
      IN("#co-ls1", at(5, 0.63), 0.4);
      COUNT("#co-lacc", 0, 1, at(5, 0.66), 0.4);
      tl.to("#co-lacc", { fill: "#FC6255", duration: 0.3 }, at(5, 0.66));
      tl.to("#co-lp .pf", { stroke: "#FC6255", duration: 0.25, yoyo: true, repeat: 1 }, at(5, 0.66));
      OUT("#co-rs0", at(5, 0.72), 0.3);
      IN("#co-rs1", at(5, 0.75), 0.4);
      tl.to("#co-racc", { fill: "#83C167", duration: 0.3 }, at(5, 0.8));
      IN("#co-note", at(5, 0.88), 0.5);
      // L6 多源校验
      OUT("#co-c5", at(6, 0), 0.4);
      IN("#co-s1", at(6, 0.04), 0.5, { x: -20 }, { x: 0 });
      IN("#co-s2", at(6, 0.08), 0.5, { x: -20 }, { x: 0 });
      IN("#co-h1", at(6, 0.15), 0.4);
      IN("#co-h2", at(6, 0.19), 0.4);
      DRAW("#co-ln1", at(6, 0.22), 0.5);
      DRAW("#co-ln2", at(6, 0.22), 0.5);
      IN("#co-dia", at(6, 0.25), 0.4);
      IN("#co-g2, #co-gbar", at(6, 0.26), 0.4);
      IN("#co-eq", at(6, 0.29), 0.3);
      ARROW("#co-ga", at(6, 0.3), 0.5);
      tl.to("#co-gbar", { y: -80, fill: "#83C167", duration: 0.5, ease: "power2.inOut" }, at(6, 0.33));
      tl.to("#co-g2 .gp", { fill: "#83C167", duration: 0.4 }, at(6, 0.33));
      IN("#co-okt", at(6, 0.34), 0.4);
      OUT("#co-h2", at(6, 0.41), 0.25);
      IN("#co-h2b", at(6, 0.43), 0.3);
      OUT("#co-eq", at(6, 0.45), 0.2);
      IN("#co-ne", at(6, 0.47), 0.3);
      tl.to("#co-dia .dp", { stroke: "#FC6255", duration: 0.3 }, at(6, 0.47));
      OUT("#co-okt", at(6, 0.49), 0.25);
      tl.to("#co-gbar", { y: 0, fill: "#FC6255", duration: 0.4, ease: "power2.in" }, at(6, 0.5));
      tl.to("#co-g2 .gp", { fill: "#FC6255", duration: 0.3 }, at(6, 0.5));
      IN("#co-stt", at(6, 0.53), 0.4);
      IN("#co-scan, #co-dot", at(6, 0.56), 0.4);
      tl.to("#co-dot", { attr: { cx: 1800 }, duration: 3.5, ease: "none" }, at(6, 0.57));
      IN("#co-s3", at(6, 0.7), 0.5, { x: -20 }, { x: 0 });
      IN("#co-lag", at(6, 0.75), 0.4);
      OUT("#co-lag", at(6, 0.86), 0.3);
      tl.to("#co-s3", { x: -40, opacity: 0.3, duration: 0.6, ease: "power2.inOut" }, at(6, 0.87));
      IN("#co-rm", at(6, 0.89), 0.4);

      tl.to("#co-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["confirm"] = tl;
    })();
  </script>
</template>
