        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      // L0

      tl.fromTo("#in-ping", { attr: { cx: 450 } }, { attr: { cx: 680 }, duration: 1.1, ease: "none", repeat: 4, immediateRender: false }, at(1, 0.15));

      tl.fromTo("#in-gap", { attr: { x2: 700 } }, { attr: { x2: 1110 }, duration: 4.4, ease: "none", immediateRender: false }, at(1, 0.33));

      OUT("#in-poll, #in-blocks, #in-ping, #in-gap, #in-gapl", at(2, 0), 0.3);
      IN("#in-val", at(2, 0.05), 0.6);
      IN("#in-gy", at(2, 0.3), 0.6, { x: 20 }, { x: 0 });
      [0, 1, 2, 3, 4, 5].forEach(k => {
        const t = at(2, 0.45) + k * 0.6;
        IN(`#in-f${k}`, t, 0.15);
        tl.to(`#in-f${k}`, { attr: { cx: 500, cy: 530 }, duration: 0.5, ease: "power2.in" }, t + 0.2);
        OUT(`#in-f${k}`, t + 0.6, 0.1);

      // L3 Yellowstone gRPC

      IN("#in-term", at(3, 0.06), 0.5);
      [0, 1, 2, 3].forEach(k => {
        IN(`#in-fd${k}`, at(3, 0.15) + k * 0.4, 0.2);
        tl.fromTo(`#in-fd${k}`, { attr: { cx: 790 } }, { attr: { cx: 1280 }, duration: 1.2, ease: "none", repeat: 4, immediateRender: false }, at(3, 0.15) + k * 0.4);

      IN("#in-fn", at(3, 0.5), 0.5);
      IN("#in-fnl", at(3, 0.56), 0.5);
      // L4 三个确认级别

      IN("#in-db", at(4, 0.04), 0.6, { x: 20 }, { x: 0 });
      DRAW("#in-bus", at(4, 0.12), 0.8);
      ARROW("#in-d0", at(4, 0.2), 0.3); IN("#in-lv0", at(4, 0.22), 0.5, { y: 20 }, { y: 0 });

      ARROW("#in-d2", at(4, 0.72), 0.3); IN("#in-lv2", at(4, 0.74), 0.5, { y: 20 }, { y: 0 });
      // L5 按槽位记录、回滚
      OUT("#in-bus, #in-d0, #in-d1, #in-d2, #in-lv0, #in-lv1, #in-lv2", at(5, 0), 0.3);
      ["#in-c0", "#in-c1", "#in-c2", "#in-c3"].forEach((s, k) => IN(s, at(5, 0.08) + k * 0.12, 0.3));
      tl.to("#in-cr2", { attr: { stroke: "#FC6255" }, duration: 0.3 }, at(5, 0.4));
      IN("#in-skip", at(5, 0.42), 0.3);
