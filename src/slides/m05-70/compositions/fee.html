        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

tl.to("#fe-left", { opacity: 0.35, duration: 0.5 }, at(2, 0));
tl.to("#fe-cr0", { stroke: "#FF9F43", strokeWidth: 4, duration: 0.3 }, at(2, 0.1));

[0, 1, 2].forEach(k => tl.fromTo(`#fe-sp${k}`, { opacity: 1, x: 0, y: 0 }, { opacity: 0, x: (k - 1) * 26, y: -14, duration: 0.8, ease: "power1.out", immediateRender: false }, at(2, 0.18) + 1.0 + 0.1 * k));
tl.to("#fe-gf0", { attr: { width: 230 }, duration: 0.9, ease: "power3.out" }, at(2, 0.32));
IN("#fe-st0", at(2, 0.4), 0.4);

IN("#fe-p0", at(4, 0.05), 0.5);
