    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      // L0
      IN("#ji-ttl", at(0, 0.05), 0.7, { y: 20 }, { y: 0 });
      IN("#ji-tag", at(0, 0.5), 0.5);
      // L1 无公共内存池
      OUT("#ji-ttl", at(1, 0));
      IN("#ji-eth", at(1, 0.05), 0.6);
      IN("#ji-sol", at(1, 0.3), 0.6);
      [0, 1, 2, 3].forEach(i => {
        const t = at(1, 0.38) + i * 0.35;
        IN(`#ji-s${i}`, t, 0.2);
        tl.to(`#ji-s${i}`, { attr: { x: 1430, y: 452 }, duration: 0.9, ease: "power2.in" }, t);
        OUT(`#ji-s${i}`, t + 0.8, 0.2);
      });
      IN("#ji-pie", at(1, 0.62), 0.6, { scale: 0.6, svgOrigin: "1740 290" }, { scale: 1, svgOrigin: "1740 290" });
      OUT("#ji-tag", at(1, 0.9));
      // L2 Bundle
      OUT("#ji-eth, #ji-sol, #ji-pie", at(2, 0));
      IN("#ji-term", at(2, 0.05), 0.5);
      IN("#ji-bfg", at(2, 0.12), 0.6);
      tl.fromTo("#ji-ks", { opacity: 0 }, { opacity: 1, duration: 0.01 }, at(2, 0.2));
      tl.fromTo("#ji-ks > *", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.12 }, at(2, 0.2));
      IN("#ji-tipl", at(2, 0.55), 0.4);
      IN("#ji-be", at(2, 0.7), 0.5);
      ARROW("#ji-ba", at(2, 0.78), 0.5);
      // L3 原子
      OUT("#ji-tipl", at(3, 0));
      OUT("#ji-term", at(3, 0.1));
      tl.to(".ji-k", { attr: { stroke: "#83C167", fill: "#83C167" }, duration: 0.3 }, at(3, 0.05));
      IN("#ji-ok", at(3, 0.08), 0.4);
      tl.to(".ji-k", { attr: { stroke: "#8a8f99", fill: "#8a8f99" }, duration: 0.3 }, at(3, 0.55));
      tl.to("#ji-bfo", { x: -24, duration: 0.15, ease: "power2.out" }, at(3, 0.55));

      tl.to("#ji-bf", { attr: { stroke: "#8a8f99" }, duration: 0.3 }, at(3, 0.55));
      IN("#ji-no", at(3, 0.6), 0.4);
      // L4 套利 + 小费
      OUT("#ji-ks, #ji-ok, #ji-no", at(4, 0), 0.3);
      tl.to("#ji-bf", { attr: { stroke: "#B48EF0" }, duration: 0.3 }, at(4, 0.02));
      IN("#ji-ex", at(4, 0.06), 0.5);
      IN("#ji-w", at(4, 0.2), 0.5);
      tl.to("#ji-a", { attr: { stroke: "#FC6255", fill: "#FC6255" }, duration: 0.3 }, at(4, 0.42));
      IN("#ji-fail", at(4, 0.44), 0.3);
      tl.to("#ji-bf", { attr: { stroke: "#8a8f99" }, duration: 0.3 }, at(4, 0.55));
      IN("#ji-none", at(4, 0.58), 0.4);
      IN("#ji-coin", at(4, 0.66), 0.2);
      tl.to("#ji-coin", { attr: { cy: 690 }, duration: 0.5, ease: "power2.in" }, at(4, 0.68));

      IN("#ji-keep", at(4, 0.85), 0.4);
      // L5 防插队
      OUT("#ji-ex, #ji-w, #ji-fail, #ji-none, #ji-coin, #ji-keep", at(5, 0), 0.3);
      tl.to("#ji-bf", { attr: { stroke: "#B48EF0" }, duration: 0.3 }, at(5, 0.02));
      IN("#ji-cs", at(5, 0.06), 0.5);
      IN("#ji-atk", at(5, 0.22), 0.4);
      tl.to("#ji-atk", { y: 96, duration: 0.5, ease: "power2.in" }, at(5, 0.32));
      tl.to("#ji-bf", { attr: { stroke: "#FC6255" }, duration: 0.15 }, at(5, 0.32) + 0.5);
      tl.to("#ji-atk", { y: 0, duration: 0.7, ease: "back.out(2)" }, at(5, 0.32) + 0.5);
      tl.to("#ji-bf", { attr: { stroke: "#B48EF0" }, duration: 0.4 }, at(5, 0.32) + 0.8);
      IN("#ji-ord", at(5, 0.6), 0.5);
