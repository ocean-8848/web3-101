  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/

// L0 title
IN("#ex-title", at(0, 0.05), 0.6, { y: 10 }, { y: 0 });
// L1 no global mempool: straight to leaders
IN("#ex-card", at(1, 0.04), 0.5);
IN("#ex-pool", at(1, 0.16), 0.5);
DRAW("#ex-px", at(1, 0.3), 0.5);
IN("#ex-ld0, #ex-ld1", at(1, 0.48), 0.5, { x: 16 }, { x: 0 });
ARROW("#ex-a0", at(1, 0.58), 0.8); ARROW("#ex-a1", at(1, 0.62), 0.8);
const fly = (id, p1, p2, t) => {
  tl.fromTo(id, { opacity: 0, x: 0, y: 0 }, { opacity: 1, x: p1[0], y: p1[1], duration: 0.5, ease: "power1.in", immediateRender: false }, t);
  tl.to(id, { x: p2[0], y: p2[1], duration: 0.5, ease: "power1.out" }, t + 0.5);
  tl.to(id, { opacity: 0, duration: 0.3 }, t + 1.0);
};
fly("#ex-m0", [520, -160], [1000, -140], at(1, 0.72));
fly("#ex-m1", [520, 210], [1000, 150], at(1, 0.76));
// L2 recentBlockhash + countdown
IN("#ex-tag", at(2, 0.25), 0.5, { y: 10 }, { y: 0 });
IN("#ex-rg, #ex-ring", at(2, 0.62), 0.5);
tl.fromTo("#ex-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 0.55, duration: 2.5, ease: "none", immediateRender: false }, at(2, 0.7));
// L3 silent expiry
tl.to("#ex-ring", { strokeDashoffset: 1, duration: 1.2, ease: "none" }, at(3, 0));
tl.to("#ex-cr", { stroke: "#FC6255", strokeDasharray: "10 8", duration: 0.4 }, at(3, 0.16));
tl.to("#ex-ct", { opacity: 0.3, duration: 0.4 }, at(3, 0.16));
IN("#ex-dead", at(3, 0.22), 0.5);
IN("#ex-redo", at(3, 0.7), 0.5);
// L4 flowchart with retry loop
OUT("#ex-s1", at(4, 0), 0.5);
IN("#ex-n0", at(4, 0.04), 0.4);
ARROW("#ex-fa0", at(4, 0.08), 0.3); IN("#ex-n1", at(4, 0.1), 0.4);
ARROW("#ex-fa1", at(4, 0.15), 0.3); IN("#ex-n2", at(4, 0.17), 0.4);
IN("#ex-lv", at(4, 0.26), 0.5);
ARROW("#ex-fa2", at(4, 0.38), 0.3); IN("#ex-dia", at(4, 0.4), 0.5);
ARROW("#ex-na", at(4, 0.6), 0.3); IN("#ex-nl", at(4, 0.6), 0.3);
IN("#ex-n4", at(4, 0.64), 0.4);
ARROW("#ex-loop", at(4, 0.8), 0.7);
ARROW("#ex-ya", at(4, 0.9), 0.3); IN("#ex-yl", at(4, 0.9), 0.3); IN("#ex-n3", at(4, 0.93), 0.4);
// L5 confirm old tx expired, else double charge
IN("#ex-warn", at(5, 0.08), 0.5, { scale: 1.1, svgOrigin: "500 600" }, { scale: 1, svgOrigin: "500 600" });
IN("#ex-d0", at(5, 0.42), 0.4); IN("#ex-d1", at(5, 0.5), 0.4);
IN("#ex-g0", at(5, 0.6), 0.4, { y: -10 }, { y: 0 }); IN("#ex-g1", at(5, 0.66), 0.4, { y: -10 }, { y: 0 });
IN("#ex-dbl", at(5, 0.76), 0.5, { x: -12 }, { x: 0 });
// L6 durable nonce
IN("#ex-nc", at(6, 0.05), 0.5);
IN("#ex-nc1", at(6, 0.2), 0.5);
IN("#ex-nc2", at(6, 0.55), 0.5);
IN("#ex-nc3", at(6, 0.85), 0.5);

      /*ENDANIM*/

      tl.to("#ex-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["expiry"] = tl;
    })();
  </script>
