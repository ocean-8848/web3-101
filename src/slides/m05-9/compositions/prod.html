      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const ROW = (i, t) => { IN("#pr-t" + i, t, 0.5, { x: -16 }, { x: 0 }); };
      const TICK = (i, t) => { DRAW("#pr-k" + i, t, 0.4); tl.to("#pr-bx" + i, { stroke: "#83C167", duration: 0.3 }, t); };

      IN("#pr-panel", at(0, 0.1), 0.5);

      // L1 重组 + 可重建
      ROW(0, at(1, 0.03));
      IN("#pr-v1", at(1, 0.4), 0.5, { x: 30 }, { x: 0 });
      TICK(0, at(1, 0.8));
      // L2 已确认数据
      OUT("#pr-v1", at(2, 0), 0.3);
      ROW(1, at(2, 0.04));
      IN("#pr-v2", at(2, 0.42), 0.5, { x: 30 }, { x: 0 });
      TICK(1, at(2, 0.82));
      // L3 预言机读取 + 备用源熔断
      OUT("#pr-v2", at(3, 0), 0.3);
      ROW(2, at(3, 0.04));
      TICK(2, at(3, 0.4));
      ROW(3, at(3, 0.5));
      IN("#pr-v3", at(3, 0.5), 0.4);
      tl.to("#pr-l1", { opacity: 1, duration: 0.2 }, at(3, 0.55));
      tl.to("#pr-src1", { stroke: "#FC6255", duration: 0.3 }, at(3, 0.68));
      IN("#pr-l1x", at(3, 0.68), 0.2);
      tl.to("#pr-l1", { opacity: 0.25, duration: 0.3 }, at(3, 0.7));
      ARROW("#pr-l2", at(3, 0.74), 0.4);
      IN("#pr-fuse", at(3, 0.76), 0.4);
      TICK(3, at(3, 0.88));
      // L4 NFT 元数据
      OUT("#pr-v3, #pr-l1, #pr-l1x, #pr-l2, #pr-fuse", at(4, 0), 0.3);
      ROW(4, at(4, 0.04));
      IN("#pr-v4", at(4, 0.4), 0.4);
      DRAW("#pr-g1", at(4, 0.55), 0.3); DRAW("#pr-g2", at(4, 0.62), 0.3); DRAW("#pr-g3", at(4, 0.69), 0.3);
      TICK(4, at(4, 0.86));
      // L5 延迟监控
      OUT("#pr-v4, #pr-g1, #pr-g2, #pr-g3", at(5, 0), 0.3);
      ROW(5, at(5, 0.04));
      IN("#pr-v5", at(5, 0.12), 0.4);
      IN("#pr-bell", at(5, 0.16), 0.4);
      DRAW("#pr-lag", at(5, 0.24), 1.6);
      tl.to("#pr-bell path", { stroke: "#FC6255", duration: 0.2 }, at(5, 0.24) + 1.3);
      tl.to("#pr-bell circle", { fill: "#FC6255", duration: 0.2 }, at(5, 0.24) + 1.3);
      tl.to("#pr-bell", { rotation: 12, svgOrigin: "1800 256", duration: 0.1, yoyo: true, repeat: 5 }, at(5, 0.24) + 1.4);
      TICK(5, at(5, 0.86));
      // L6 动手试

      IN("#pr-tt", at(6, 0.04), 0.4);
      IN("#pr-c1", at(6, 0.08), 0.5, { y: 20 }, { y: 0 });

      tl.to("#pr-c1 rect", { stroke: "#83C167", duration: 0.5 }, at(6, 0.34));
