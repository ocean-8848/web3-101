      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      IN("#ri-title", at(0, 0));
      IN("#ri-s0", at(0, 0.08), 0.8);
      [0, 1, 2, 3, 4, 5].forEach(i => IN(`#ri-f${i}`, at(0, 0.45 + i * 0.02), 0.6));
      // L1 授权 + 原子结算
      OUT("#ri-s0", at(1, 0));
      IN("#ri-t0", at(1, 0.04));
      IN("#ri-sA", at(1, 0.06));
      ARROW("#ri-ap", at(1, 0.12), 0.5);
      tl.to("#ri-ap", { opacity: 0.25, duration: 0.5, ease: "power2.inOut", yoyo: true, repeat: 1 }, at(1, 0.2));
      IN("#ri-bar", at(1, 0.22), 0.3);
      tl.to("#ri-bar", { attr: { width: 70 }, duration: 0.8, ease: "power3.inOut" }, at(1, 0.3));
      IN("#ri-d0", at(1, 0.33));
      IN("#ri-t1", at(1, 0.5));
      IN("#ri-sB", at(1, 0.52));
      IN("#ri-knob", at(1, 0.55), 0.3);
      tl.to("#ri-knob", { attr: { x: 318 }, duration: 0.5, ease: "power2.inOut", yoyo: true, repeat: 1 }, at(1, 0.6));
      IN("#ri-d1", at(1, 0.75));
      // L2 假币蜜罐
      OUT("#ri-sA, #ri-ap, #ri-bar, #ri-sB, #ri-knob", at(2, 0));
      IN("#ri-t2", at(2, 0.04));
      IN("#ri-s2", at(2, 0.08));
      DRAW("#ri-hook", at(2, 0.2), 0.6); IN("#ri-hook", at(2, 0.2), 0.1);
      IN("#ri-buy", at(2, 0.3), 0.5, { x: -20 }, { x: 0 });
      IN("#ri-sell", at(2, 0.42), 0.5, { x: 20 }, { x: 0 });
      IN("#ri-d2", at(2, 0.62));
      tl.to("#ri-f2", { attr: { stroke: "#83C167" }, duration: 0.4, yoyo: true, repeat: 1, repeatDelay: 1.0 }, at(2, 0.8));
      // L3 路由被攻破
      OUT("#ri-s2, #ri-hook, #ri-buy, #ri-sell", at(3, 0));
      IN("#ri-t3", at(3, 0.04));
      IN("#ri-s3", at(3, 0.08));
      [0, 1, 2].forEach(k => IN(`#ri-cn${k}`, at(3, 0.1 + k * 0.03), 0.4));
      DRAW("#ri-crack", at(3, 0.2), 0.5); IN("#ri-crack", at(3, 0.2), 0.05);
