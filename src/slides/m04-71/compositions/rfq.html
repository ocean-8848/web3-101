  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/

IN("#rf-term", at(0, 0.05), 0.5);
[0, 1, 2, 3].forEach(i => IN(`#rf-h${i}`, at(0, 0.08) + i * 0.06, 0.4, { y: -12 }, { y: 0 }));

ARROW("#rf-m0", at(0, 0.3), 0.6); IN("#rf-m0l", at(0, 0.32), 0.4);
ARROW("#rf-m1", at(0, 0.55), 0.6); IN("#rf-m1l", at(0, 0.57), 0.4);
OUT("#rf-term", at(0, 0.98), 0.4);
// L1 signed quote
ARROW("#rf-m2", at(1, 0.05), 0.6);
IN("#rf-quote", at(1, 0.12), 0.5, { x: 60 }, { x: 0 });
ARROW("#rf-m3", at(1, 0.35), 0.6); IN("#rf-m3l", at(1, 0.37), 0.4);
IN("#rf-rbg", at(1, 0.45), 0.3); tl.fromTo("#rf-ring", { opacity: 0 }, { opacity: 1, duration: 0.01 }, at(1, 0.45));
tl.fromTo("#rf-ring", { strokeDashoffset: 0 }, { strokeDashoffset: 0.25, duration: 2.5, ease: "none", immediateRender: false }, at(1, 0.48));
ARROW("#rf-m4", at(1, 0.68), 0.8); IN("#rf-m4l", at(1, 0.72), 0.4);
// L2 contract checks
ARROW("#rf-loop", at(2, 0.05), 0.6);
IN("#rf-c0", at(2, 0.18), 0.4, { x: -14 }, { x: 0 });
IN("#rf-c1", at(2, 0.38), 0.4, { x: -14 }, { x: 0 });
IN("#rf-c2", at(2, 0.66), 0.4, { x: -14 }, { x: 0 });
IN("#rf-ce, #rf-cu", at(2, 0.7), 0.4);
tl.to("#rf-ce", { x: 160, y: -20, duration: 0.7, ease: "power2.inOut" }, at(2, 0.8));
tl.to("#rf-cu", { x: -160, y: 20, duration: 0.7, ease: "power2.inOut" }, at(2, 0.8));
// L3 firm quote
IN("#rf-term2", at(3, 0.03), 0.5);
tl.to("#rf-qr", { stroke: "#83C167", duration: 0.3 }, at(3, 0.15));
tl.to("#rf-qn", { fill: "#83C167", duration: 0.3 }, at(3, 0.15));
IN("#rf-lock", at(3, 0.2), 0.3, { y: -10 }, { y: 0 });
IN("#rf-sand", at(3, 0.45), 0.3, { x: 120 }, { x: 0 });
tl.to("#rf-sand", { y: -30, duration: 0.3, ease: "power2.out" }, at(3, 0.52));
tl.to("#rf-sand", { y: 0, duration: 0.5, ease: "back.out(3)" }, at(3, 0.52) + 0.3);
IN("#rf-sandl", at(3, 0.62), 0.4);
IN("#rf-mevl, #rf-mev", at(3, 0.8), 0.5);
OUT("#rf-term2", at(3, 0.72), 0.4);
// L4 inventory + latency
IN("#rf-vault", at(4, 0.08), 0.5, { y: 14 }, { y: 0 });
IN("#rf-lp", at(4, 0.35), 0.4);
IN("#rf-tb", at(4, 0.6), 0.5, { x: -20 }, { x: 0 });
IN("#rf-tbl", at(4, 0.66), 0.4);
// L5 failures
tl.to("#rf-ring", { strokeDashoffset: 1, stroke: "#FC6255", duration: 0.8, ease: "power1.in" }, at(5, 0.12));
IN("#rf-exp", at(5, 0.25), 0.4);
tl.to("#rf-quote", { opacity: 0.4, duration: 0.4 }, at(5, 0.3));
tl.to("#rf-c0, #rf-c1, #rf-c2, #rf-loop", { opacity: 0.3, duration: 0.4 }, at(5, 0.05));
IN("#rf-bal", at(5, 0.55), 0.4, { x: 20 }, { x: 0 });
tl.to("#rf-balr", { attr: { "stroke-width": 6 }, duration: 0.3, yoyo: true, repeat: 1 }, at(5, 0.85));
// L6 maker may refuse
OUT("#rf-vault, #rf-lp, #rf-bal", at(6, 0), 0.4);
DRAW("#rf-jit", at(6, 0.1), 1.0); tl.fromTo("#rf-jit", { opacity: 0 }, { opacity: 1, duration: 0.01 }, at(6, 0.1));
IN("#rf-no", at(6, 0.3), 0.4, { scale: 0.8, svgOrigin: "1360 335" }, { scale: 1, svgOrigin: "1360 335" });
IN("#rf-wide", at(6, 0.5), 0.4);
IN("#rf-bal2, #rf-beam", at(6, 0.68), 0.4);
tl.to("#rf-beam", { rotation: 8, svgOrigin: "990 880", duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, at(6, 0.72));
IN("#rf-nb", at(6, 0.82), 0.4);
