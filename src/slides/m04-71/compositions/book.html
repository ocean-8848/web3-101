  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/

[0, 1, 2, 3, 4].forEach(r => IN(`#bo-q${r}`, at(0, 0.58) + r * 0.08, 0.4));

// L1 mainnet gas
OUT("#bo-term", at(1, 0.02), 0.4);

IN("#bo-mm, #bo-mml", at(1, 0.25), 0.4);
for (let i = 0; i < 6; i++) {
  const tc = at(1, 0.42) + i * 0.35;
  IN(`#bo-card${i}`, tc, 0.15);
  tl.to(`#bo-card${i}`, { x: i * 100 - 10, y: -170, duration: 0.45, ease: "power2.out" }, tc);
}
for (let i = 0; i < 9; i++) IN(`#bo-coin${i}`, at(1, 0.5) + i * 0.25, 0.2, { y: -60 }, { y: 0, ease: "bounce.out" });
IN("#bo-gasl", at(1, 0.55), 0.4);
IN("#bo-bad", at(1, 0.86), 0.4, { scale: 0.7, svgOrigin: "1650 990" }, { scale: 1, svgOrigin: "1650 990" });
// L2 app chain
OUT("#bo-eth, #bo-mm, #bo-mml, #bo-card0, #bo-card1, #bo-card2, #bo-card3, #bo-card4, #bo-card5, #bo-coin0, #bo-coin1, #bo-coin2, #bo-coin3, #bo-coin4, #bo-coin5, #bo-coin6, #bo-coin7, #bo-coin8, #bo-gasl, #bo-bad", at(2, 0), 0.4);

IN("#bo-ac", at(2, 0.35), 0.6, { y: 40 }, { y: 0 });
IN("#bo-blks", at(2, 0.55), 0.6, { x: 40 }, { x: 0 });

// L3 Hyperliquid
const t3 = at(3, 0);
OUT("#bo-tb, #bo-ts, #bo-pb0, #bo-pb1, #bo-pb2, #bo-pb3, #bo-pb4, #bo-ps0, #bo-ps1, #bo-ps2, #bo-ps3, #bo-ps4, #bo-q0, #bo-q1, #bo-q2, #bo-q3, #bo-q4, #bo-lv, #bo-ql, #bo-ac, #bo-blks, #bo-blkl, #bo-term2", t3, 0.4);
IN("#bo-Lt", at(3, 0.08), 0.4);
IN("#bo-L0", at(3, 0.18), 0.4); ARROW("#bo-La0", at(3, 0.26), 0.3);
IN("#bo-L1", at(3, 0.32), 0.4); ARROW("#bo-La1", at(3, 0.42), 0.3);
IN("#bo-L2", at(3, 0.5), 0.4); ARROW("#bo-La2", at(3, 0.75), 0.3);
IN("#bo-L3", at(3, 0.82), 0.4);
// L4 dYdX v4
IN("#bo-Rt", at(4, 0.04), 0.4);
IN("#bo-R0", at(4, 0.1), 0.4); ARROW("#bo-Ra0", at(4, 0.16), 0.3);
IN("#bo-R1", at(4, 0.2), 0.4); ARROW("#bo-Ra1", at(4, 0.3), 0.3);
IN("#bo-R2", at(4, 0.36), 0.4); ARROW("#bo-Ra2", at(4, 0.55), 0.3);
IN("#bo-R3", at(4, 0.6), 0.4);
IN("#bo-off", at(4, 0.86), 0.4);
// L5 latency
tl.to("#bo-L2, #bo-R2", { opacity: 0.45, duration: 0.25, yoyo: true, repeat: 1 }, at(5, 0.12));
IN("#bo-sw, #bo-swh, #bo-lat0", at(5, 0.2), 0.4);
tl.to("#bo-swh", { rotation: 720, svgOrigin: "720 940", duration: 1.0, ease: "power2.in" }, at(5, 0.4));
tl.to("#bo-lat0", { opacity: 0.55, duration: 0.3 }, at(5, 0.42));
IN("#bo-lat1", at(5, 0.45), 0.4, { x: -14 }, { x: 0 });
// L6 validators
const t6 = at(6, 0);
OUT("#bo-Lt, #bo-L0, #bo-L1, #bo-L2, #bo-L3, #bo-La0, #bo-La1, #bo-La2, #bo-Rt, #bo-R0, #bo-R1, #bo-R2, #bo-R3, #bo-Ra0, #bo-Ra1, #bo-Ra2, #bo-off, #bo-sw, #bo-swh, #bo-lat0, #bo-lat1", t6, 0.4);
IN("#bo-val", t6 + 0.4, 0.4);
[0, 1, 2, 3, 4].forEach(i => IN(`#bo-o${i}`, t6 + 0.5 + i * 0.08, 0.3, { y: -10 }, { y: 0 }));
IN("#bo-mag", at(6, 0.12), 0.4, { x: -20 }, { x: 0 });

tl.to("#bo-o3", { x: -175, duration: 0.6, ease: "power2.inOut" }, at(6, 0.3));

IN("#bo-swp", at(6, 0.34), 0.4);

OUT("#bo-val, #bo-mag, #bo-o0, #bo-o1, #bo-o2, #bo-o3, #bo-o4, #bo-swp, #bo-mevl, #bo-mev, #bo-ethv, #bo-acv, #bo-dec", t7, 0.4);

IN("#bo-x2", at(7, 0.48), 0.4); IN("#bo-crack", at(7, 0.56), 0.2);
tl.to("#bo-x2", { y: 14, duration: 0.4, ease: "power2.in" }, at(7, 0.58));
IN("#bo-xl2", at(7, 0.6), 0.4);
IN("#bo-perp", at(7, 0.82), 0.5);

      /*ENDANIM*/

      tl.to("#bo-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#bo-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["book"] = tl;
    })();
