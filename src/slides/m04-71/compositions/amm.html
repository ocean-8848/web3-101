    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/

IN("#am-mini", at(0, 0.15), 0.6);
IN("#am-pool", at(0, 0.2), 0.7, { y: 20 }, { y: 0 });

OUT("#am-term", at(0, 0.97), 0.4);
// L1 LP
[0, 1, 2].forEach(i => IN(`#am-lp${i}`, at(1, 0.1) + i * 0.12, 0.4, { y: -14 }, { y: 0 }));
IN("#am-lpl", at(1, 0.3), 0.4);
[0, 1, 2].forEach(i => {
  IN(`#am-cn${i}`, at(1, 0.4) + i * 0.15, 0.2);
  tl.to(`#am-cn${i}`, { attr: { cy: 520 }, duration: 0.5, ease: "power2.in" }, at(1, 0.42) + i * 0.15);
  tl.to(`#am-cn${i}`, { opacity: 0, duration: 0.15 }, at(1, 0.42) + i * 0.15 + 0.45);
});
tl.to("#am-lg, #am-lb", { attr: { y: 450, height: 248 }, duration: 0.8 }, at(1, 0.5));
IN("#am-f0", at(1, 0.65), 0.4, { x: -14 }, { x: 0 });
// L2 swap
OUT("#am-lp0, #am-lp1, #am-lp2, #am-lpl", at(2, 0), 0.4);
IN("#am-slip", at(2, 0.05), 0.4);
tl.to("#am-slip", { x: 220, y: -10, duration: 0.7, ease: "power2.in" }, at(2, 0.18));
tl.to("#am-slip", { opacity: 0, duration: 0.2 }, at(2, 0.18) + 0.6);
tl.to("#am-lg", { attr: { y: 430, height: 268 }, duration: 0.5 }, at(2, 0.25));
tl.to("#am-lb", { attr: { y: 475, height: 223 }, duration: 0.5 }, at(2, 0.25));
IN("#am-out", at(2, 0.27), 0.2);
tl.to("#am-out", { attr: { cx: 860 }, duration: 0.6, ease: "power2.out" }, at(2, 0.28));
IN("#am-f1", at(2, 0.4), 0.4, { x: -14 }, { x: 0 });
IN("#am-f2", at(2, 0.8), 0.4, { x: -14 }, { x: 0 });
// L3 MEV
OUT("#am-out", at(3, 0), 0.3);
IN("#am-f3", at(3, 0.06), 0.5);
IN("#am-mp", at(3, 0.12), 0.5);
IN("#am-tx", at(3, 0.2), 0.4);
IN("#am-rc0", at(3, 0.3), 0.4, { x: -60 }, { x: 0 });
IN("#am-rc1", at(3, 0.34), 0.4, { x: 60 }, { x: 0 });
IN("#am-swl", at(3, 0.38), 0.4);
const ta = at(3, 0.52);
OUT("#am-mp, #am-tx, #am-rc0, #am-rc1, #am-swl", ta, 0.4);
IN("#am-eline, #am-el", ta + 0.45, 0.4);
IN("#am-pline, #am-pll", ta + 0.7, 0.4);
ARROW("#am-arb", at(3, 0.72), 0.5); IN("#am-arbl", at(3, 0.74), 0.3);
tl.to("#am-pline", { attr: { y1: 836, y2: 836 }, duration: 0.9, ease: "power2.inOut" }, at(3, 0.78));
// L4 latency
OUT("#am-eline, #am-el, #am-pline, #am-pll, #am-arb, #am-arbl", at(4, 0), 0.35);
IN("#am-blk, #am-blkf, #am-blkl", at(4, 0.12), 0.4);
tl.to("#am-blkf", { attr: { y: 796, height: 108 }, duration: 2.2, ease: "none" }, at(4, 0.2));
IN("#am-l2", at(4, 0.7), 0.4, { x: 14 }, { x: 0 });
// L5 failures
OUT("#am-blk, #am-blkf, #am-blkl, #am-l2", at(5, 0), 0.35);
IN("#am-f40", at(5, 0.1), 0.4); IN("#am-i0", at(5, 0.12), 0.5);
IN("#am-f41", at(5, 0.32), 0.4); IN("#am-i1", at(5, 0.34), 0.5);
IN("#am-hand", at(5, 0.38), 0.3);
tl.to("#am-hand", { y: 32, duration: 0.5, ease: "power2.in" }, at(5, 0.42));
tl.to("#am-i1w", { attr: { y: 908, height: 20 }, duration: 0.5, ease: "power2.in" }, at(5, 0.42));
IN("#am-f42", at(5, 0.6), 0.4); IN("#am-i2", at(5, 0.62), 0.25);
tl.to("#am-i2", { opacity: 0.3, duration: 0.12, yoyo: true, repeat: 3 }, at(5, 0.66));
IN("#am-i2l", at(5, 0.85), 0.4);
// L6 anyone can list
OUT("#am-i0, #am-i1, #am-hand, #am-i2, #am-i2l", at(6, 0), 0.35);
[0, 1, 2, 3, 4, 5].forEach(i => IN(`#am-np${i}`, at(6, 0.12) + i * 0.18, 0.4, { y: 20 }, { y: 0 }));
IN("#am-npl", at(6, 0.6), 0.5);

      tl.to("#am-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["amm"] = tl;
