        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      OUT("#de-el0, #de-ul0", at(0, 0.24), 0.3);

      IN("#de-f1", at(1, 0.05), 0.6, { x: -20 }, { x: 0 });
      tl.to("#de-usdl", { attr: { y: 427, height: 429 }, duration: 0.9 }, at(1, 0.35));

      IN("#de-f3", at(1, 0.75), 0.6);

      ["#de-q1", "#de-q2", "#de-q3", "#de-q4"].forEach((q, k) => { IN(q, at(4, 0.2) + k * 0.15, 0.01); DRAW(q, at(4, 0.2) + k * 0.15, 0.7); });
