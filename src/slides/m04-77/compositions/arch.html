      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      // L0 前端经代理附加 API Key
      IN("#ar-swap", at(0, 0.04), 0.5, { x: -16 }, { x: 0 });
      ARROW("#ar-a0", at(0, 0.2), 0.4);

      OUT("#ar-direct", at(1, 0.02), 0.3);
      ARROW("#ar-a1", at(1, 0.08), 0.6);
      IN("#ar-http", at(1, 0.14), 0.5, { y: 12 }, { y: 0 });

      tl.to("#ar-d2", { attr: { cx: 720 }, duration: 0.6, ease: "power2.in" }, at(1, 0.56));
      tl.to("#ar-d1", { attr: { r: 13 }, duration: 0.3, yoyo: true, repeat: 1 }, at(1, 0.56) + 0.6);
      OUT("#ar-d0, #ar-d2", at(1, 0.56) + 0.6, 0.15);
      ARROW("#ar-a3", at(1, 0.78), 0.3);
      IN("#ar-eng", at(1, 0.8), 0.5, { y: 12 }, { y: 0 });
      OUT("#ar-d1", at(1, 0.8), 0.2);
      IN("#ar-d3", at(1, 0.8), 0.2);
      tl.fromTo("#ar-d3", { attr: { cy: 560 } }, { attr: { cy: 588 }, duration: 0.6, ease: "power1.inOut", immediateRender: false }, at(1, 0.82));
      OUT("#ar-d3", at(1, 0.82) + 0.6, 0.2);
      // L2 报价引擎只读快照
      tl.to("#ar-engr", { strokeWidth: 6, duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.06));
      IN("#ar-snap", at(2, 0.4), 0.5, { y: 14 }, { y: 0 });
      ARROW("#ar-a4", at(2, 0.48), 0.4); IN("#ar-ro", at(2, 0.52), 0.4);
      tl.to("#ar-snaps", { fill: "#B48EF0", duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.78));
      // L3 索引器：唯一写入者，原子替换指针
      IN("#ar-idx", at(3, 0.04), 0.5, { y: 14 }, { y: 0 });
      ARROW("#ar-w", at(3, 0.3), 0.5); IN("#ar-wl", at(3, 0.34), 0.4);
      const tg = at(3, 0.55);
      IN("#ar-ghost", tg, 0.2);
      tl.fromTo("#ar-ghost", { x: 480 }, { x: 0, duration: 0.8, ease: "power2.inOut", immediateRender: false }, tg);
      tl.to("#ar-snap", { opacity: 0, duration: 0.5 }, tg + 0.2);
      tl.set("#ar-snap", { opacity: 1 }, tg + 0.85); tl.set("#ar-ghost", { opacity: 0 }, tg + 0.86);
      tl.to("#ar-snapr", { stroke: "#e8e6df", duration: 0.12, yoyo: true, repeat: 1 }, tg + 0.86);
      IN("#ar-lock", at(3, 0.8), 0.4);
      // L4 交易构造、RPC 网关、PostgreSQL
      OUT("#ar-lock", at(4, 0), 0.3);
      ARROW("#ar-a5", at(4, 0.04), 0.4);
      IN("#ar-bld", at(4, 0.08), 0.5, { x: 16 }, { x: 0 });
      IN("#ar-gw", at(4, 0.34), 0.5, { x: 20 }, { x: 0 });
      IN("#ar-chainb", at(4, 0.36), 0.4);
      ARROW("#ar-l3", at(4, 0.42), 0.4); IN("#ar-l3t", at(4, 0.44), 0.3);
      IN("#ar-l2", at(4, 0.47), 0.4, { x: -40 }, { x: 0 }); IN("#ar-l2t", at(4, 0.49), 0.3);
      ARROW("#ar-l1", at(4, 0.52), 0.4); IN("#ar-l1t", at(4, 0.54), 0.3);
      IN("#ar-gt", at(4, 0.6), 0.5);

      IN("#ar-wal", at(5, 0.1), 0.5, { y: 14 }, { y: 0 });
      tl.to("#ar-svcr", { stroke: "#FC6255", strokeWidth: 6, duration: 0.2, yoyo: true, repeat: 3 }, at(5, 0.38));
      IN("#ar-badc", at(5, 0.46), 0.4, { x: 200 }, { x: 0 });
      IN("#ar-g1", at(5, 0.6), 0.4, { x: -16 }, { x: 0 });

      tl.to("#ar-badc", { y: 0, duration: 0.3, ease: "power2.out" }, at(5, 0.82) + 0.4);
      tl.to("#ar-g1 line", { strokeWidth: 12, duration: 0.15, yoyo: true, repeat: 1 }, at(5, 0.82) + 0.4);

      tl.to("#ar-gl", { opacity: 1, duration: 0.3 }, at(6, 0.55));
