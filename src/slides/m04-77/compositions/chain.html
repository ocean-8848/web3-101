    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const MSG = (n, t) => {
        const p = document.querySelector("#ch-p" + n);
        if (p.classList.contains("dr")) ARROW(`#ch-p${n}`, t, 0.5); else IN(`#ch-p${n}`, t, 0.4, { x: p.getAttribute("d").includes("H4") ? 30 : -30 }, { x: 0 });
        IN(`#ch-t${n}`, t + 0.15, 0.4);
      };
      // L0 五条生命线；步 1、2
      ["U", "F", "B", "G", "W"].forEach((k, i) => { IN(`#ch-h${k}`, at(0, 0.02) + i * 0.1, 0.4, { y: -12 }, { y: 0 }); IN(`#ch-v${k}`, at(0, 0.06) + i * 0.1, 0.5); });
      MSG(1, at(0, 0.3));
      MSG(2, at(0, 0.62));
      // L1 步 3–5
      MSG(3, at(1, 0.03));
      MSG(4, at(1, 0.32));
      MSG(5, at(1, 0.66));
      tl.to("#ch-p5", { strokeWidth: 5, duration: 0.3, yoyo: true, repeat: 1 }, at(1, 0.9));
      // L2 步 6–9（先收起报价阶段）
      OUT("#ch-ph1", at(2, 0), 0.4);
      IN("#ch-sum", at(2, 0.04), 0.5, { y: 12 }, { y: 0 });
      MSG(6, at(2, 0.05));
      MSG(7, at(2, 0.16));
      MSG(8, at(2, 0.5));
      MSG(9, at(2, 0.76));
      // L3 返回卡：没有签名；minOut 在 data 里；授权不足分支
      OUT("#ch-sum", at(3, 0.0), 0.3);
      IN("#ch-card", at(3, 0.05), 0.5, { y: 16 }, { y: 0 });
      IN("#ch-nosig", at(3, 0.14), 0.4);
      IN("#ch-mo", at(3, 0.27), 0.4, { scale: 1.5, svgOrigin: "825 899" }, { scale: 1, svgOrigin: "825 899" });
      OUT("#ch-card, #ch-nosig, #ch-mo", at(3, 0.5), 0.4);
      tl.to("#ch-p8", { stroke: "#FF9F43", duration: 0.3 }, at(3, 0.55));
      IN("#ch-na", at(3, 0.62), 0.5, { x: 30 }, { x: 0 });
      tl.to("#ch-na text", { opacity: 0.5, duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.85));
      // L4 步 10–12：前端自己校验 to
      OUT("#ch-na", at(4, 0), 0.4);
      tl.to("#ch-p8", { stroke: "#58C4DD", duration: 0.3 }, at(4, 0));
      MSG(10, at(4, 0.05));
      tl.set("#ch-ok", { opacity: 1 }, at(4, 0.28)); DRAW("#ch-ok", at(4, 0.28), 0.4);
      MSG(11, at(4, 0.4));
      MSG(12, at(4, 0.55));
      IN("#ch-skip", at(4, 0.7), 0.4, { x: 16 }, { x: 0 });
      tl.to("#ch-p10", { stroke: "#FF9F43", strokeWidth: 5, duration: 0.3 }, at(4, 0.72));
      // L5 报价代理改为转发给本服务
      OUT("#ch-seq", at(5, 0), 0.4);
      IN("#ch-br", at(5, 0.06), 0.4);
      ARROW("#ch-xa", at(5, 0.12), 0.4);
      IN("#ch-pr", at(5, 0.14), 0.4);
      ARROW("#ch-old", at(5, 0.22), 0.4); IN("#ch-oldb", at(5, 0.24), 0.4);
      IN("#ch-oldx", at(5, 0.38), 0.3, { scale: 0.5, svgOrigin: "1188 438" }, { scale: 1, svgOrigin: "1188 438" });
      tl.to("#ch-oldb", { opacity: 0.4, duration: 0.3 }, at(5, 0.56));
      ARROW("#ch-new", at(5, 0.46), 0.5); IN("#ch-newb", at(5, 0.5), 0.4);
      IN("#ch-prl", at(5, 0.68), 0.4);
