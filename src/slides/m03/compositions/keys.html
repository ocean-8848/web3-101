      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 真随机数 → 12 词助记词
      IN("#ke-dice", at(0, 0), 0.6, { rotation: -30, svgOrigin: "220 550" }, { rotation: 0, svgOrigin: "220 550" });

      IN("#ke-card", at(0, 0.16), 0.7, { x: -20 }, { x: 0 });
      IN("#ke-term", at(0, 0.3), 0.5);
      tl.to("#ke-dice", { rotation: 90, svgOrigin: "220 550", duration: 0.5, ease: "power2.inOut" }, at(0, 0.55));
      tl.to("#ke-cardr", { attr: { "stroke-width": 6 }, duration: 0.3, yoyo: true, repeat: 1 }, at(0, 0.8));
      // L1 助记词 → 种子 → 密钥树
      OUT("#ke-g0", at(1, 0));
      tl.to("#ke-cm", { x: -210, duration: 0.8, ease: "power2.inOut" }, at(1, 0.01));
      ARROW("#ke-a1", at(1, 0.07), 0.4);
      IN("#ke-seed", at(1, 0.1), 0.5, { scale: 0.3, svgOrigin: "520 550" }, { scale: 1, svgOrigin: "520 550" }); IN("#ke-sl", at(1, 0.12));

      DRAW("#ke-b1", at(1, 0.3), 0.6); DRAW("#ke-b2", at(1, 0.32), 0.6);
      IN("#ke-en", at(1, 0.37), 0.3); IN("#ke-bn", at(1, 0.39), 0.3);
      IN("#ke-path", at(1, 0.42));
      tl.fromTo(".ke-lf", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, stagger: 0.18 }, at(1, 0.45));
      tl.fromTo(".ke-lfn", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.18 }, at(1, 0.48));
      tl.fromTo(".ke-lft", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.18 }, at(1, 0.5));
      IN("#ke-el", at(1, 0.76));
      tl.fromTo(".ke-bf", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, stagger: 0.15 }, at(1, 0.8));
      tl.fromTo(".ke-bfn", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.15 }, at(1, 0.83));
      tl.fromTo(".ke-bft", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.15 }, at(1, 0.84));
      IN("#ke-btl", at(1, 0.86));
      OUT("#ke-term", at(1, 0.55));
      // L2 服务器只拿 xpub，派生充值地址，不能签名
      IN("#ke-srv", at(2, 0.12));
      IN("#ke-xp", at(2, 0.3), 0.6, { y: -20 }, { y: 0 });
      IN("#ke-term2", at(2, 0.4), 0.5);
      tl.fromTo(".ke-u", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.1 }, at(2, 0.48));
      tl.fromTo(".ke-q", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.1 }, at(2, 0.5));
      tl.to("#ke-q0", { y: 560, duration: 0.4, ease: "power2.inOut" }, at(2, 0.56));
      tl.to("#ke-q1", { y: 620, duration: 0.4, ease: "power2.inOut" }, at(2, 0.56));
      tl.to("#ke-q2", { y: 680, duration: 0.4, ease: "power2.inOut" }, at(2, 0.56));
      tl.to("#ke-q2", { x: 1740, y: 820, duration: 0.6, ease: "power2.inOut" }, at(2, 0.62));
      tl.to("#ke-q1", { x: 1620, y: 820, duration: 0.6, ease: "power2.inOut" }, at(2, 0.68));
      tl.to("#ke-q0", { x: 1500, y: 820, duration: 0.6, ease: "power2.inOut" }, at(2, 0.74));
      IN("#ke-dep", at(2, 0.8));
