  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 三次独立往返
      IN("#mu-lt", at(0, 0));
      IN("#mu-k0", at(0, 0.05)); IN("#mu-k1", at(0, 0.1)); IN("#mu-k2", at(0, 0.15));
      IN("#mu-rpcL", at(0, 0.2));
      IN("#mu-lc", at(0, 0.25));
      [0, 1, 2].forEach(i => {
        const t = at(0, 0.32 + i * 0.2);
        ARROW("#mu-g" + i, t, 0.6);
        ARROW("#mu-b" + i, t + 0.8, 0.6);
        COUNT("#mu-lcn", i, i + 1, t + 1.3, 0.3);
      });

      // L1 打包成 aggregate3 → 一次往返
      IN("#mu-rt", at(1, 0));
      IN("#mu-q0", at(1, 0.05)); IN("#mu-q1", at(1, 0.1)); IN("#mu-q2", at(1, 0.15));
      tl.to("#mu-q0", { y: 130, opacity: 0, duration: 0.6, ease: "power2.in" }, at(1, 0.35));
      tl.to("#mu-q2", { y: -130, opacity: 0, duration: 0.6, ease: "power2.in" }, at(1, 0.35));
      tl.to("#mu-q1", { opacity: 0, duration: 0.6, ease: "power2.in" }, at(1, 0.35));
      IN("#mu-pack", at(1, 0.48), 0.5, { scale: 0.7, svgOrigin: "1105 458" }, { scale: 1 });
      IN("#mu-rpcR", at(1, 0.6), 0.4);
      ARROW("#mu-pg", at(1, 0.68), 0.3);
      IN("#mu-rc", at(1, 0.78), 0.5);

      // L2 Multicall3 逐个调用 → 结果 + 成功标志
      ARROW("#mu-mg", at(2, 0), 0.3);
      IN("#mu-m3", at(2, 0.04), 0.6);
      IN("#mu-hand", at(2, 0.18), 0.2);
      [0, 1, 2].forEach(i => {
        tl.to("#mu-hand", { attr: { cy: 430 + i * 50 }, duration: 0.3 }, at(2, 0.2 + i * 0.14));
        IN("#mu-ok" + i, at(2, 0.25 + i * 0.14), 0.3);
      });
      OUT("#mu-hand", at(2, 0.66), 0.2);
      ARROW("#mu-mb", at(2, 0.66), 0.3);
      ARROW("#mu-pb", at(2, 0.7), 0.3);
      IN("#mu-gas", at(2, 0.76), 0.5);

      // L3 同一地址 0xcA11…
      OUT("#mu-gas", at(3, 0), 0.3);
      IN("#mu-addr", at(3, 0.08), 0.5);
      IN("#mu-chains", at(3, 0.35), 0.7, { y: 20 }, { y: 0 });

      tl.to("#mu-addr", { fill: "#83C167", duration: 0.3, yoyo: true, repeat: 3 }, at(3, 0.72));
      // L4 allowFailure
      OUT("#mu-chains", at(4, 0), 0.3);
      OUT("#mu-left", at(4, 0), 0.4);
      IN("#mu-af0", at(4, 0.08), 0.4);
      IN("#mu-box", at(4, 0.1), 0.4);
      IN("#mu-c0", at(4, 0.14), 0.3); IN("#mu-c1", at(4, 0.18), 0.3); IN("#mu-c2", at(4, 0.22), 0.3);
      tl.to("#mu-box", { stroke: "#FC6255", duration: 0.3 }, at(4, 0.3));
      IN("#mu-whole", at(4, 0.32), 0.4);
      OUT("#mu-whole", at(4, 0.55), 0.3); OUT("#mu-af0", at(4, 0.55), 0.3);
      tl.to("#mu-box", { stroke: "#8a8f99", duration: 0.3 }, at(4, 0.55));
      IN("#mu-af1", at(4, 0.6), 0.4);
      IN("#mu-st", at(4, 0.66), 0.5);
      IN("#mu-sr", at(4, 0.78), 0.5);

      // L5 打包太多 → 自动拆分 → 同一区块
      ["#mu-af1", "#mu-box", "#mu-c0", "#mu-c1", "#mu-c2", "#mu-st", "#mu-sr"].forEach(s => OUT(s, at(5, 0), 0.3));
      IN("#mu-lim", at(5, 0.05), 0.4); IN("#mu-liml", at(5, 0.05), 0.4);
      IN("#mu-big", at(5, 0.08), 0.4); IN("#mu-bign", at(5, 0.08), 0.4);
      tl.to("#mu-big", { attr: { y: 372, height: 388 }, duration: 2.4, ease: "power1.in" }, at(5, 0.12));
      COUNT("#mu-bignn", 30, 300, at(5, 0.12), 2.4);
      tl.to("#mu-big", { stroke: "#FC6255", fill: "#FC6255", duration: 0.3 }, at(5, 0.3));
      OUT("#mu-big", at(5, 0.45), 0.3); OUT("#mu-bign", at(5, 0.45), 0.3);
      IN("#mu-sp0", at(5, 0.5), 0.4, { y: -40 }, { y: 0 });
      IN("#mu-sp1", at(5, 0.54), 0.4, { y: -40 }, { y: 0 });
      IN("#mu-sp2", at(5, 0.58), 0.4, { y: -40 }, { y: 0 });
      IN("#mu-stamp", at(5, 0.72), 0.3, { scale: 1.4, svgOrigin: "400 690" }, { scale: 1 });
      IN("#mu-same", at(5, 0.8), 0.5);

      // L6 viem 另两种合并
      ["#mu-lim", "#mu-liml", "#mu-sp0", "#mu-sp1", "#mu-sp2", "#mu-stamp", "#mu-same"].forEach(s => OUT(s, at(6, 0), 0.3));
      IN("#mu-t0", at(6, 0.1), 0.6, { x: -30 }, { x: 0 });
      IN("#mu-t1", at(6, 0.5), 0.6, { x: -30 }, { x: 0 });

      tl.to("#mu-t0 rect", { stroke: "#58C4DD", duration: 0.4 }, at(6, 0.8)); tl.to("#mu-t1 rect", { stroke: "#58C4DD", duration: 0.4 }, at(6, 0.86));
      tl.to("#mu-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["multicall"] = tl;
    })();
