              <text x="1010" y="400">useEffect(() =&gt; {</text>
              <text x="1043.6" y="440">qc.<tspan fill="#FF9F43">invalidateQueries</tspan>({ queryKey })</text>

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const NS = "http://www.w3.org/2000/svg";
      const dg = document.querySelector("#re-r2dots");
      for (let i = 0; i < 11; i++) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("id", "re-dd" + i); c.setAttribute("class", "h");
        c.setAttribute("cx", 960 + i * 42); c.setAttribute("cy", 860); c.setAttribute("r", 10);
        dg.appendChild(c);
      }
      const flash = (t) => { tl.to("#re-card", { stroke: "#58C4DD", duration: 0.1 }, t); tl.to("#re-card", { stroke: "#F0B90B", duration: 0.2 }, t + 0.12); };

      // L0 余额卡 + 时间轴 + 指针
      IN("#re-axis", at(0, 0), 0.6);
      IN("#re-card", at(0, 0.1), 0.6, { y: 20 }, { y: 0 });
      IN("#re-val", at(0, 0.15), 0.6, { y: 20 }, { y: 0 });
      IN("#re-ptr", at(0, 0.3), 0.4);
      tl.to("#re-ptr", { x: 220, duration: 2.6, ease: "none" }, at(0, 0.35));

      // L1 TanStack Query 外壳 + 三旋钮
      IN("#re-shell", at(1, 0.05), 0.7);
      IN("#re-kn0", at(1, 0.45), 0.4); IN("#re-kn1", at(1, 0.55), 0.4); IN("#re-kn2", at(1, 0.65), 0.4);
      tl.to("#re-ptr", { x: 240, duration: 6, ease: "none" }, at(1, 0));

      // L2 三旋钮演示
      OUT("#re-ptr", at(2, 0), 0.3);
      tl.to("#re-kn0", { scale: 1.12, svgOrigin: "610 420", duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.02));
      IN("#re-fr", at(2, 0.05), 0.1);
      tl.to("#re-fr", { attr: { width: 400 }, duration: 1.4, ease: "none" }, at(2, 0.05));
      IN("#re-frl", at(2, 0.1), 0.4);
      IN("#re-st", at(2, 0.18), 0.4); IN("#re-stl", at(2, 0.2), 0.4);
      tl.to("#re-kn1", { scale: 1.12, svgOrigin: "610 510", duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.34));
      ["#re-t0", "#re-t1", "#re-t2", "#re-t3"].forEach((s, i) => { IN(s, at(2, 0.36) + i * 0.35, 0.2); flash(at(2, 0.36) + i * 0.35); });
      IN("#re-tkl", at(2, 0.42), 0.4);
      tl.to("#re-kn2", { scale: 1.12, svgOrigin: "610 600", duration: 0.3, yoyo: true, repeat: 1 }, at(2, 0.66));
      IN("#re-bolt", at(2, 0.68), 0.3, { y: -60 }, { y: 0, ease: "power4.in" });
      IN("#re-boltl", at(2, 0.7), 0.3);
      OUT("#re-val", at(2, 0.73), 0.15);
      tl.to("#re-card", { stroke: "#8a8f99", duration: 0.15 }, at(2, 0.73));
      IN("#re-ld", at(2, 0.75), 0.2);
      OUT("#re-ld", at(2, 0.86), 0.2);
      IN("#re-val", at(2, 0.88), 0.3);
      tl.to("#re-card", { stroke: "#F0B90B", duration: 0.3 }, at(2, 0.88));

      // L3 新区块驱动失效
      ["#re-fr", "#re-st", "#re-frl", "#re-stl", "#re-t0", "#re-t1", "#re-t2", "#re-t3", "#re-tkl", "#re-bolt", "#re-boltl"].forEach(s => OUT(s, at(3, 0), 0.3));
      IN("#re-code", at(3, 0.05), 0.7, { x: 30 }, { x: 0 });
      ["#re-b0", "#re-b1", "#re-b2", "#re-b3", "#re-b4"].forEach((s, i) => {
        const t = at(3, 0.35) + i * 0.9;
        IN(s, t, 0.35, { y: -40 }, { y: 0, ease: "bounce.out" });
        flash(t + 0.3);
      });

      // L4 泳道 1：几乎不变
      OUT("#re-p1", at(4, 0), 0.4);
      IN("#re-r0", at(4, 0.08), 0.6, { y: 20 }, { y: 0 });
      IN("#re-r0d", at(4, 0.4), 0.3, { scale: 2, svgOrigin: "960 360" }, { scale: 1 });
      IN("#re-r0g", at(4, 0.5), 0.1); DRAW("#re-r0g", at(4, 0.5), 2.5);

      tl.to("#re-r0d", { scale: 1.5, svgOrigin: "960 360", duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.88));
      // L5 泳道 2：交易确认后失效
      IN("#re-r1", at(5, 0.02), 0.6, { y: 20 }, { y: 0 });
      IN("#re-r1d0", at(5, 0.25), 0.3);
      IN("#re-r1f", at(5, 0.3), 0.1);
      tl.to("#re-r1f", { attr: { width: 160 }, duration: 1, ease: "none" }, at(5, 0.3));
      IN("#re-r1e", at(5, 0.55), 0.4, { y: -20 }, { y: 0 });
      IN("#re-r1el", at(5, 0.6), 0.2);
      IN("#re-r1d1", at(5, 0.64), 0.3, { scale: 2, svgOrigin: "1360 620" }, { scale: 1 });
      IN("#re-r1f2", at(5, 0.68), 0.1);
      tl.to("#re-r1f2", { attr: { width: 160 }, duration: 1, ease: "none" }, at(5, 0.68));

      // L6 泳道 3：每块刷新 → 后台暂停
      IN("#re-r2", at(6, 0.02), 0.6, { y: 20 }, { y: 0 });
      for (let i = 0; i < 11; i++) IN("#re-dd" + i, at(6, 0.12) + i * 0.38, 0.15, { scale: 1.8, svgOrigin: (960 + i * 42) + " 860" }, { scale: 1 });
      IN("#re-dim", at(6, 0.6), 0.5);
      IN("#re-pause", at(6, 0.64), 0.5);
      IN("#re-pz", at(6, 0.7), 0.4);

      tl.to("#re-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["refresh"] = tl;
    })();
  </script>
