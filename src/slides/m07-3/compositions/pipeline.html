      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      // L0 一句话 + balanceOf 框 + ABI 编码箭头

      IN("#pi-term2", at(3, 0.15), 0.5);
      tl.to("#pi-Dr", { fill: "#58C4DD66", duration: 0.4, yoyo: true, repeat: 3 }, at(3, 0.35));
      IN("#pi-coin", at(3, 0.6), 0.5, { y: 15 }, { y: 0 });
      // L4 返回字节 → 解码
      ARROW("#pi-aDF", at(4, 0));
      IN("#pi-tDF", at(4, 0.05), 0.4);
      IN("#pi-strip", at(4, 0.05), 0.2);
      tl.to("#pi-strip", { x: -130, duration: 0.8, ease: "power2.in" }, at(4, 0.08));
      OUT("#pi-strip", at(4, 0.2), 0.2);
      IN("#pi-F", at(4, 0.2), 0.5);
      IN("#pi-f1", at(4, 0.22), 0.4);
      OUT("#pi-f1", at(4, 0.4), 0.3); IN("#pi-f2", at(4, 0.4) + 0.3, 0.4);
      OUT("#pi-f2", at(4, 0.58), 0.3); IN("#pi-f3", at(4, 0.58) + 0.3, 0.4);
      OUT("#pi-f3", at(4, 0.74), 0.3); IN("#pi-f4", at(4, 0.74) + 0.3, 0.5);
      tl.to("#pi-f4a", { fill: "#83C167", duration: 0.5 }, at(4, 0.9));
      IN("#pi-bottom", at(4, 0.8), 0.5);
      OUT("#pi-term2", at(4, 0.85), 0.4);
      tl.fromTo("#pi-E", { opacity: 0 }, { opacity: 0.4, duration: 0.5 }, at(4, 0.92));
      // L5 缩到左侧 + 点菜插画
      OUT(".pi-small", at(5, 0), 0.4);
      tl.to("#pi-diapos", { y: 80, duration: 1.2, ease: "power2.inOut" }, at(5, 0.06));
      tl.to("#pi-dia", { scale: 0.62, svgOrigin: "120 240", duration: 1.2, ease: "power2.inOut" }, at(5, 0.06));
      IN("#pi-cust", at(5, 0.2), 0.6);
      ARROW("#pi-a1", at(5, 0.33), 0.4);
      IN("#pi-ticket", at(5, 0.38), 0.5, { y: -20 }, { y: 0 });
      IN("#pi-link", at(5, 0.5), 0.5);
      ARROW("#pi-a2", at(5, 0.58), 0.4);
      IN("#pi-kit", at(5, 0.62), 0.5);
      ARROW("#pi-a3", at(5, 0.72), 0.4);
      IN("#pi-plate", at(5, 0.76), 0.5);
      ARROW("#pi-a4", at(5, 0.86), 0.3);
      IN("#pi-menu", at(5, 0.88), 0.5);
      // L6 现在 vs 账本

      tl.fromTo("#pi-hand", { rotation: 0, svgOrigin: "1690 604" }, { rotation: 360, svgOrigin: "1690 604", duration: 3, ease: "none", immediateRender: false }, at(6, 0.1));
