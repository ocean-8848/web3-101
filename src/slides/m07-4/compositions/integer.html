  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      
      // L0 只有整数
      IN("#in-zone", at(0, 0), 0.5);
      IN("#in-d0", at(0, 0), 0.3); tl.to("#in-d0", { attr: { cx: 560, cy: 220 }, opacity: 0, duration: 0.9, ease: "power2.out" }, at(0, 0.4));
      IN("#in-d1", at(0, 0), 0.3); tl.to("#in-d1", { attr: { cx: 1380, cy: 230 }, opacity: 0, duration: 0.9, ease: "power2.out" }, at(0, 0.4));
      IN("#in-d2", at(0, 0), 0.3); tl.to("#in-d2", { attr: { cx: 540, cy: 580 }, opacity: 0, duration: 0.9, ease: "power2.out" }, at(0, 0.4));
      IN("#in-d3", at(0, 0), 0.3); tl.to("#in-d3", { attr: { cx: 1400, cy: 590 }, opacity: 0, duration: 0.9, ease: "power2.out" }, at(0, 0.4));
      IN("#in-d4", at(0, 0), 0.3); tl.to("#in-d4", { attr: { cx: 820, cy: 200 }, opacity: 0, duration: 0.9, ease: "power2.out" }, at(0, 0.4));
      IN("#in-d5", at(0, 0), 0.3); tl.to("#in-d5", { attr: { cx: 1120, cy: 600 }, opacity: 0, duration: 0.9, ease: "power2.out" }, at(0, 0.4));
      IN("#in-int", at(0, 0.2), 0.6, { scale: 0.8, svgOrigin: "960 370" }, { scale: 1, svgOrigin: "960 370" });
      // L1 wei 术语卡 + 18 个零
      IN("#in-term1", at(1, 0.03), 0.5);
      IN("#in-eq", at(1, 0.12), 0.5);
      (function () {
        const o = { v: 0 }, el = document.querySelector("#in-zeros");
        tl.fromTo(o, { v: 0 }, { v: 18, duration: 2.4, ease: "none", immediateRender: false, onUpdate: () => { el.textContent = "0".repeat(Math.floor(o.v + 0.001)); } }, at(1, 0.2));
      })();
      IN("#in-coin", at(1, 0.68), 0.6, { y: 15 }, { y: 0 });
      // L2 银行回单
      OUT("#in-term1", at(2, 0.08), 0.4);
      IN("#in-ledger", at(2, 0.12), 0.6);
      IN("#in-ops", at(2, 0.42), 0.5);
      tl.fromTo("#in-opst", { attr: { fill: "#8a8f99" } }, { attr: { fill: "#58C4DD" }, duration: 0.3, yoyo: true, repeat: 3, immediateRender: false }, at(2, 0.5));
      IN("#in-a1l", at(2, 0.66), 0.4); ARROW("#in-a1", at(2, 0.66), 0.5);
      IN("#in-slot", at(2, 0.7), 0.3);
      tl.fromTo("#in-paper", { opacity: 1, attr: { height: 0 } }, { attr: { height: 230 }, duration: 0.9, ease: "none" }, at(2, 0.74));
      IN("#in-rc", at(2, 0.86), 0.4);
      // L3 比喻不成立：位数各不相同
      OUT("#in-bank", at(3, 0), 0.4);
      tl.fromTo("#in-coinc", { attr: { r: 44 } }, { attr: { r: 52 }, duration: 0.3, yoyo: true, repeat: 1, immediateRender: false }, at(3, 0.08));
      OUT("#in-coin", at(3, 0.3), 0.4);
      IN("#in-ask", at(3, 0.33), 0.5);
      OUT("#in-ask", at(3, 0.56), 0.4);
      [1, 2, 3].forEach((i, k) => {
        IN("#in-c" + i, at(3, 0.62 + k * 0.11), 0.5, { y: 20 }, { y: 0 });
        const b = document.querySelector("#in-b" + i);
        tl.to(b, { attr: { width: +b.dataset.w }, duration: 0.7, ease: "power2.out" }, at(3, 0.66 + k * 0.11));
      });
      IN("#in-same", at(3, 0.92), 0.4);
      // L4 decimals → 定点数
      IN("#in-term2", at(4, 0.02), 0.5);
      tl.to(["#in-n1", "#in-n2", "#in-n3"], { attr: { fill: "#FF9F43" }, duration: 0.3 }, at(4, 0.15));
      tl.fromTo(["#in-n1", "#in-n2", "#in-n3"], { attr: { "fill-opacity": 1 } }, { attr: { "fill-opacity": 0.3 }, duration: 0.25, yoyo: true, repeat: 3, immediateRender: false }, at(4, 0.2));
      tl.to(["#in-v1", "#in-v2", "#in-v3"], { attr: { fill: "#58C4DD" }, duration: 0.4 }, at(4, 0.33));
      OUT("#in-term2", at(4, 0.5), 0.3);
      IN("#in-term3", at(4, 0.53), 0.5);
      tl.fromTo("#in-zglow", { opacity: 0 }, { opacity: 0.3, duration: 0.4, yoyo: true, repeat: 1, immediateRender: false }, at(4, 0.86));
      // L5 一图看懂：输入 → bigint → 显示
      OUT("#in-term3", at(5, 0.02), 0.4);
      OUT(["#in-int", "#in-eq"], at(5, 0), 0.4);
      IN("#in-zl", at(5, 0.06), 0.5);
      IN("#in-inp", at(5, 0.06), 0.5);
      IN("#in-inpl", at(5, 0.12), 0.4);
      ARROW("#in-a2", at(5, 0.16), 0.5); IN("#in-a2l", at(5, 0.16), 0.4);
      IN("#in-key", at(5, 0.24), 0.5);
      IN("#in-dot", at(5, 0.29), 0.2);
      tl.to("#in-dot", { attr: { cx: 960, cy: 475 }, duration: 0.8, ease: "power2.inOut" }, at(5, 0.31));
      tl.to("#in-dot", { attr: { r: 0 }, duration: 0.3 }, at(5, 0.31) + 0.8);
      ARROW("#in-a3", at(5, 0.46), 0.5); IN("#in-a3l", at(5, 0.46), 0.4);
      tl.set("#in-dot", { attr: { cx: 1650, cy: 398 } }, at(5, 0.54));
      tl.to("#in-dot", { attr: { r: 12 }, duration: 0.3, ease: "back.out(3)" }, at(5, 0.55));
      IN("#in-out", at(5, 0.58), 0.5);
      tl.to("#in-dot", { opacity: 0, duration: 0.3 }, at(5, 0.62));
      IN("#in-outl", at(5, 0.68), 0.4);
      tl.fromTo("#in-zglow", { opacity: 0 }, { opacity: 0.3, duration: 0.4, yoyo: true, repeat: 1, immediateRender: false }, at(5, 0.82));
      // L6 底部一句 + 中间区加粗发光
      IN("#in-end", at(6, 0.05), 0.6);
      tl.to("#in-zone", { attr: { "stroke-width": 5 }, duration: 0.5 }, at(6, 0.3));
      tl.fromTo("#in-zglow", { opacity: 0 }, { opacity: 0.3, duration: 0.6, immediateRender: false }, at(6, 0.3));


      tl.to("#in-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to(".in-tc", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["integer"] = tl;
    })();
  </script>
