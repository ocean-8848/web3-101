  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 数字签名
      IN("#si-term", at(0, 0.03), 0.5);
      IN("#si-data", at(0, 0.12), 0.6, { x: -30 }, { x: 0 });
      IN("#si-key", at(0, 0.22), 0.5, { y: -20 }, { y: 0 });
      ARROW("#si-a0", at(0, 0.32), 0.5);
      IN("#si-seal", at(0, 0.4), 0.6, { scale: 0.6, svgOrigin: "990 515" }, { scale: 1, svgOrigin: "990 515" });
      IN("#si-mag", at(0, 0.6), 0.6, { x: 60 }, { x: 0 });
      IN("#si-ok", at(0, 0.82), 0.4, { scale: 0.6, svgOrigin: "1445 470" }, { scale: 1, svgOrigin: "1445 470" });
      OUT("#si-term", at(0, 0.88), 0.4);
      // L1 印章变纸条
      OUT("#si-s0", at(1, 0.0), 0.4);
      IN("#si-note", at(1, 0.06), 0.6, { scale: 0.6, svgOrigin: "960 480" }, { scale: 1, svgOrigin: "960 480" });
      IN("#si-tg0", at(1, 0.18), 0.4);
      IN("#si-tg1", at(1, 0.3), 0.4);
      IN("#si-what", at(1, 0.6), 0.4);
      tl.to("#si-what", { opacity: 0.3, duration: 0.3 }, at(1, 0.75));
      tl.to("#si-what", { opacity: 1, duration: 0.3 }, at(1, 0.75) + 0.3);
      tl.to("#si-what", { opacity: 0.3, duration: 0.3 }, at(1, 0.75) + 0.6);
      tl.to("#si-what", { opacity: 1, duration: 0.3 }, at(1, 0.75) + 0.9);
      // L2 左卡
      OUT("#si-note, #si-tg0, #si-tg1, #si-what", at(2, 0.0), 0.4);
      IN("#si-lc", at(2, 0.04), 0.6, { scale: 0.9, svgOrigin: "530 450" }, { scale: 1, svgOrigin: "530 450" });
      IN("#si-l0", at(2, 0.14), 0.4, { x: -15 }, { x: 0 });
      IN("#si-l1", at(2, 0.26), 0.4, { x: -15 }, { x: 0 });
      IN("#si-l2", at(2, 0.38), 0.4, { x: -15 }, { x: 0 });
      IN("#si-l3", at(2, 0.52), 0.4, { x: -15 }, { x: 0 });
      IN("#si-lb", at(2, 0.72), 0.6, { y: 20 }, { y: 0 });
      // L3 右卡
      IN("#si-rc", at(3, 0.04), 0.6, { scale: 0.9, svgOrigin: "1390 450" }, { scale: 1, svgOrigin: "1390 450" });
      IN("#si-r0", at(3, 0.18), 0.4, { x: -15 }, { x: 0 });
      IN("#si-r1", at(3, 0.26), 0.4, { x: -15 }, { x: 0 });
      IN("#si-r2", at(3, 0.36), 0.4, { x: -15 }, { x: 0 });
      IN("#si-r3", at(3, 0.44), 0.4, { x: -15 }, { x: 0 });
      IN("#si-rb", at(3, 0.6), 0.6, { y: 20 }, { y: 0 });
      // L4 同一把私钥 + 签到簿
      IN("#si-mk", at(4, 0.04), 0.5, { scale: 0.5, svgOrigin: "960 450" }, { scale: 1, svgOrigin: "960 450" });
      IN("#si-mkl, #si-mkl2", at(4, 0.1), 0.4);
      ARROW("#si-k0", at(4, 0.18), 0.4);
      ARROW("#si-k1", at(4, 0.18), 0.4);
      IN("#si-book", at(4, 0.38), 0.5);
      ARROW("#si-ba", at(4, 0.72), 0.4);
      IN("#si-vc", at(4, 0.82), 0.5, { scale: 0.7, svgOrigin: "526 235" }, { scale: 1, svgOrigin: "526 235" });
      // L5 委托书 + 撤销按钮
      IN("#si-doc", at(5, 0.04), 0.5);
      ARROW("#si-da", at(5, 0.18), 0.4);
      [0, 1, 2].forEach(k => {
        const t = at(5, 0.24) + k * 0.4;
        tl.fromTo(`#si-m${k}`, { opacity: 0, x: 0 }, { opacity: 1, duration: 0.2 }, t);
        tl.to(`#si-m${k}`, { x: 150 - k * 50, duration: 0.8, ease: "power2.out" }, t + 0.1);
      });
      IN("#si-rv", at(5, 0.56), 0.5);
      IN("#si-rvx", at(5, 0.68), 0.3, { scale: 0.5, svgOrigin: "1672 236" }, { scale: 1, svgOrigin: "1672 236" });
      IN("#si-end", at(5, 0.84), 0.6, { y: 15 }, { y: 0 });
      tl.to("#si-r2 tspan", { fill: "#FC6255", duration: 0.3 }, at(3, 0.82));
      tl.to("#si-r2 tspan", { fill: "#F0B90B", duration: 0.3 }, at(3, 0.82) + 0.6);

      tl.to("#si-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#si-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["sig"] = tl;
    })();
