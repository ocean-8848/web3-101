    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 节点依次出现
      IN("#st-title", at(0, 0.02), 0.6);
      IN("#st-dot", at(0, 0.2), 0.4);
      ["#st-nR", "#st-nU", "#st-nC", "#st-nK"].forEach((s, k) => IN(s, at(0, 0.3 + 0.12 * k), 0.5, { y: 14 }, { y: 0 }));

      // L1 页面加载：有记录 / 无记录
      ARROW("#st-a1", at(1, 0.05), 0.7); IN("#st-l1", at(1, 0.2), 0.5);
      ARROW("#st-a2", at(1, 0.6), 0.7); IN("#st-l2", at(1, 0.7), 0.5);

      // L2 恢复中：静默 eth_accounts
      ARROW("#st-a3", at(2, 0.1), 0.9); IN("#st-l3", at(2, 0.2), 0.5);
      IN("#st-mute", at(2, 0.3), 0.5, { scale: 0.7, svgOrigin: "1294 377" }, { scale: 1, svgOrigin: "1294 377" });
      ARROW("#st-a4", at(2, 0.7), 0.6); IN("#st-l4", at(2, 0.75), 0.5);

      // L3 用户主动连接
      ARROW("#st-a5", at(3, 0.08), 0.6); IN("#st-l5", at(3, 0.12), 0.5);
      ARROW("#st-a7", at(3, 0.45), 0.6); IN("#st-l7", at(3, 0.5), 0.5);
      ARROW("#st-a6", at(3, 0.72), 0.6); IN("#st-l6", at(3, 0.76), 0.5);

      // L4 已连接：自环 / 断开
      ARROW("#st-a8", at(4, 0.1), 0.7); IN("#st-l8", at(4, 0.18), 0.5);
      ARROW("#st-a9", at(4, 0.55), 1.0); IN("#st-l9", at(4, 0.7), 0.5);

      // L5 恢复中别画成未连接
      const t5 = at(5, 0);
      IN("#st-mock", t5 + 0.1, 0.5);
      IN("#st-flash", at(5, 0.2), 0.15);
      OUT("#st-flash", at(5, 0.2) + 0.35, 0.15);
      IN("#st-flash", at(5, 0.2) + 0.7, 0.15, {}, { immediateRender: false });
      OUT("#st-flash", at(5, 0.55), 0.3);
      tl.to("#st-rR", { fill: "#FF9F43", fillOpacity: 0.2, duration: 0.4 }, at(5, 0.6));
      IN("#st-skel", at(5, 0.62), 0.5);

      // L6 换账户不是断开：查询跟着地址刷新
      const t6 = at(6, 0);
      OUT(["#st-mock", "#st-skel"], t6 - 0.4, 0.4);
      tl.to("#st-rR", { fillOpacity: 0, duration: 0.4 }, t6);
      tl.to("#st-a8", { stroke: "#58C4DD", duration: 0.4 }, t6 + 0.1);
      IN("#st-qa", t6 + 0.2, 0.5);
      IN("#st-qc", at(6, 0.35), 0.5, { y: 12 }, { y: 0 });
      IN("#st-qk", at(6, 0.55), 0.5);
      [0, 1, 2].forEach(k => {
        const c = [1385, 1591, 1797][k] - 12;
        IN(`#st-sp${k}`, at(6, 0.62), 0.3);
        tl.fromTo(`#st-sp${k}`, { rotation: 0, svgOrigin: `${c} 200` }, { rotation: 720, svgOrigin: `${c} 200`, duration: 2.4, ease: "power1.inOut", immediateRender: false }, at(6, 0.62));
        OUT(`#st-sp${k}`, at(6, 0.62) + 2.5, 0.3);
      });
      tl.to("#st-a8", { stroke: "#83C167", duration: 0.4 }, at(6, 0.95));

      // L7 撤销授权：下一次请求才发现
      const t7 = at(7, 0);
      OUT(["#st-qa", "#st-qc", "#st-qk"], t7 - 0.4, 0.4);
      IN("#st-rev", t7 + 0.05, 0.5);
      IN("#st-unk", at(7, 0.25), 0.5);
      OUT("#st-unk", at(7, 0.52), 0.3);
      IN("#st-fail", at(7, 0.58), 0.4);
      tl.to("#st-a9", { stroke: "#FC6255", duration: 0.3 }, at(7, 0.62));
      tl.to("#st-rU", { fill: "#8a8f99", fillOpacity: 0.25, duration: 0.4 }, at(7, 0.7));


      tl.to("#st-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["states"] = tl;
    })();
