    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 配对里装多次会话
      IN("#wn-pair", at(0, 0.02), 0.8, { scale: 0.96, svgOrigin: "960 410" }, { scale: 1, svgOrigin: "960 410" });
      IN("#wn-sbox", at(0, 0.3), 0.6); IN("#wn-s1l", at(0, 0.3), 0.6);
      IN("#wn-s2", at(0, 0.5), 0.6); IN("#wn-s3", at(0, 0.7), 0.6);

      // L1 会话 1 放大：namespaces 三格 + 有效期沙漏
      const t1 = at(1, 0);
      OUT("#wn-pair", t1 - 0.3, 0.4); OUT("#wn-s2", t1 - 0.3, 0.4); OUT("#wn-s3", t1 - 0.3, 0.4); OUT("#wn-s1l", t1 - 0.3, 0.3);
      tl.to("#wn-sbox", { attr: { x: 300, y: 260, width: 1240, height: 400 }, duration: 0.9, ease: "power3.inOut" }, t1);
      IN("#wn-stitle", t1 + 0.7, 0.5);
      IN("#wn-c1", at(1, 0.2), 0.5, { y: 20 }, { y: 0 });
      IN("#wn-c2", at(1, 0.26), 0.5, { y: 20 }, { y: 0 });
      IN("#wn-c3", at(1, 0.32), 0.5, { y: 20 }, { y: 0 });
      IN("#wn-hg", at(1, 0.48), 0.6);
      tl.fromTo("#wn-sandt", { scaleY: 1, svgOrigin: "1700 470" }, { scaleY: 0, svgOrigin: "1700 470", duration: 2.6, ease: "none" }, at(1, 0.55));
      tl.fromTo("#wn-sandb", { scaleY: 0, svgOrigin: "1700 562" }, { scaleY: 1, svgOrigin: "1700 562", duration: 2.6, ease: "none" }, at(1, 0.55));
      const tg = at(1, 0.55) + 2.6;
      tl.to("#wn-sbox", { stroke: "#6b6f7a", duration: 0.5 }, tg);
      tl.to(".wn-cell", { stroke: "#6b6f7a", duration: 0.5 }, tg);
      tl.to([".wn-ct", "#wn-stt", "#wn-ns"], { fill: "#6b6f7a", duration: 0.5 }, tg);
      IN("#wn-rescan", tg + 0.4, 0.6, { y: 16 }, { y: 0 });

      // L2 扫码后无反应：两个故障点
      const t2 = at(2, 0);
      OUT("#wn-L1", t2 - 0.4, 0.4);
      IN("#wn-dapp", t2 + 0.05, 0.6);
      DRAW("#wn-ln1", t2 + 0.4, 0.5); IN("#wn-relay", t2 + 0.6, 0.5);
      DRAW("#wn-ln2", t2 + 0.9, 0.5); IN("#wn-phone", t2 + 1.1, 0.5);
      IN("#wn-spin", t2 + 1.4, 0.4);
      tl.fromTo("#wn-spin", { rotation: 0, svgOrigin: "1470 480" }, { rotation: 360 * 8, svgOrigin: "1470 480", duration: 8.4, ease: "none", immediateRender: false }, t2 + 1.4);
      tl.to("#wn-ln1", { stroke: "#FC6255", duration: 0.3 }, at(2, 0.3));
      IN("#wn-f1", at(2, 0.3), 0.5, { scale: 0.6, svgOrigin: "720 490" }, { scale: 1, svgOrigin: "720 490" });
      IN("#wn-f2", at(2, 0.5), 0.5);

      // L3 两项检查
      const t3 = at(3, 0);
      OUT("#wn-L2", t3 - 0.4, 0.4);
      IN("#wn-k1", t3 + 0.05, 0.5, { x: -20 }, { x: 0 });
      IN("#wn-k2", at(3, 0.35), 0.5, { x: -20 }, { x: 0 });
      DRAW("#wn-t1", at(3, 0.25), 0.4);
      DRAW("#wn-t2", at(3, 0.7), 0.4);
      tl.to("#wn-k1 rect, #wn-k2 rect", { stroke: "#83C167", duration: 0.3 }, at(3, 0.75));

      // L4 钓鱼站也能生成合法二维码，核对请求方域名
      const t4 = at(4, 0);
      OUT("#wn-L3", t4 - 0.4, 0.4);
      IN("#wn-relay2", t4 + 0.05, 0.6);
      IN("#wn-good", at(4, 0.14), 0.6, { x: -30 }, { x: 0 });
      DRAW("#wn-ln3", at(4, 0.2), 0.5);
      IN("#wn-bad", at(4, 0.26), 0.6, { x: 30 }, { x: 0 });
      DRAW("#wn-ln4", at(4, 0.32), 0.5);
      IN("#wn-pop", at(4, 0.55), 0.6, { y: 30 }, { y: 0 });
      IN("#wn-dom", at(4, 0.72), 0.5, { scale: 0.9, svgOrigin: "960 735" }, { scale: 1, svgOrigin: "960 735" });
      IN("#wn-eye", at(4, 0.86), 0.5);

      // L5 手机浏览器里打开 DApp，扫不了自己
      const t5 = at(5, 0);
      OUT("#wn-L4", t5 - 0.4, 0.4);
      IN("#wn-ph", t5 + 0.05, 0.6, { scale: 0.92, svgOrigin: "960 580" }, { scale: 1, svgOrigin: "960 580" });
      IN("#wn-phl", t5 + 0.3, 0.4);
      IN("#wn-phqr", at(5, 0.25), 0.5);
      IN("#wn-self", at(5, 0.6), 0.5, { x: -20 }, { x: 0 });

      // L6 深链：浏览器 → 钱包批准 → 跳回
      const t6 = at(6, 0);
      IN("#wn-term", t6 + 0.1, 0.5);
      OUT("#wn-self", t6, 0.3); OUT("#wn-phqr", t6, 0.3);
      IN("#wn-st1", t6 + 0.3, 0.4);
      IN("#wn-wc", t6 + 0.4, 0.5);
