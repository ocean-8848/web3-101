      <g id="su-term" class="h">
        <rect x="70" y="56" width="560" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">订阅 <tspan font-size="28" font-weight="400" fill="#8a8f99">Subscription</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">节点通过 WebSocket 主动推送</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const HL = (p, n, B0, a, b, t) => {
        tl.to(`#${p}-hb, #${p}-hs`, { opacity: 1, attr: { y: B0 - 29 + 41 * a, height: 41 * (b - a + 1) }, duration: 0.35, ease: "power2.inOut" }, t);
        for (let i = 0; i < n; i++) tl.to(`#${p}-c${i}`, { opacity: i >= a && i <= b ? 1 : 0.6, duration: 0.3 }, t);
      };
      const HF = (a, b, t) => HL("su-cf", 5, 266, a, b, t);
      const HG = (a, b, t) => HL("su-cg", 12, 266, a, b, t);

      // L0 轮询太慢 → 订阅；只能走 WS / IPC，HTTP 不行
      IN("#su-go", at(0, 0.0), 0.5);
      IN("#su-nd", at(0, 0.02), 0.5);
      DRAW("#su-http", at(0, 0.04), 0.6);
      IN("#su-httpt", at(0, 0.06), 0.4);
      ["#su-q0", "#su-q1", "#su-q2"].forEach((s, i) => {
        const t = at(0, 0.08 + i * 0.07);
        IN(s, t, 0.1);
        tl.to(s, { attr: { cx: 1450 }, duration: 0.8, ease: "none" }, t);
        OUT(s, t + 0.75, 0.15);
      });
      IN("#su-term", at(0, 0.3), 0.5);
      DRAW("#su-ws", at(0, 0.44), 0.7);
      IN("#su-wst", at(0, 0.5), 0.4);
      IN("#su-map", at(0, 0.56), 0.5, { x: -16 }, { x: 0 });
      IN("#su-h0", at(0, 0.60), 0.1); tl.to("#su-h0", { x: -950, duration: 1.6, ease: "none" }, at(0, 0.60)); OUT("#su-h0", at(0, 0.60) + 1.45, 0.15);
      IN("#su-h1", at(0, 0.68), 0.1); tl.to("#su-h1", { x: -950, duration: 1.6, ease: "none" }, at(0, 0.68)); OUT("#su-h1", at(0, 0.68) + 1.45, 0.15);
      IN("#su-h2", at(0, 0.76), 0.1); tl.to("#su-h2", { x: -950, duration: 1.6, ease: "none" }, at(0, 0.76)); OUT("#su-h2", at(0, 0.76) + 1.45, 0.15);
      IN("#su-h3", at(0, 0.84), 0.1); tl.to("#su-h3", { x: -950, duration: 1.6, ease: "none" }, at(0, 0.84)); OUT("#su-h3", at(0, 0.84) + 1.45, 0.15);
      IN("#su-h4", at(0, 0.92), 0.1); tl.to("#su-h4", { x: -950, duration: 1.6, ease: "none" }, at(0, 0.92)); OUT("#su-h4", at(0, 0.92) + 1.45, 0.15);
      IN("#su-h5", at(1, 0.00), 0.1); tl.to("#su-h5", { x: -950, duration: 1.6, ease: "none" }, at(1, 0.00)); OUT("#su-h5", at(1, 0.00) + 1.45, 0.15);
      IN("#su-h6", at(1, 0.12), 0.1); tl.to("#su-h6", { x: -950, duration: 1.6, ease: "none" }, at(1, 0.12)); OUT("#su-h6", at(1, 0.12) + 1.45, 0.15);
      IN("#su-h7", at(1, 0.24), 0.1); tl.to("#su-h7", { x: -950, duration: 1.6, ease: "none" }, at(1, 0.24)); OUT("#su-h7", at(1, 0.24) + 1.45, 0.15);
      IN("#su-h8", at(1, 0.36), 0.1); tl.to("#su-h8", { x: -950, duration: 1.6, ease: "none" }, at(1, 0.36)); OUT("#su-h8", at(1, 0.36) + 1.45, 0.15);
      tl.to("#su-http, #su-httpt", { opacity: 0.4, duration: 0.3 }, at(0, 0.86));
      IN("#su-hx", at(0, 0.86), 0.3, { scale: 1.6, svgOrigin: "960 395" }, { scale: 1, svgOrigin: "960 395" });
      OUT("#su-term", at(0, 0.88), 0.4);

      // L1 长连接会断 → sub.Err() 收到错误
      IN("#su-k0", at(1, 0.22), 0.35, { y: -10 }, { y: 0 });
      IN("#su-k1", at(1, 0.32), 0.35, { y: -10 }, { y: 0 });
      IN("#su-k2", at(1, 0.44), 0.35, { y: -10 }, { y: 0 });
      OUT("#su-ws", at(1, 0.58), 0.3);
      IN("#su-wsx", at(1, 0.58), 0.3);
      tl.to("#su-wst", { fill: "#FC6255", duration: 0.3 }, at(1, 0.58));
      IN("#su-pp", at(1, 0.7), 0.4);
      tl.to("#su-ppr", { stroke: "#FC6255", fill: "#FC625533", duration: 0.3 }, at(1, 0.84));
      tl.to("#su-ppt", { fill: "#FC6255", duration: 0.3 }, at(1, 0.84));

      // L2 select 同时等三件事
      OUT("#su-l0", at(2, 0), 0.4);
      IN("#su-cf", at(2, 0.04), 0.5);
      HF(0, 4, at(2, 0.06));
      IN("#su-tr", at(2, 0.08), 0.5);
      HF(1, 1, at(2, 0.26));
      ARROW("#su-b0", at(2, 0.28), 0.5); IN("#su-bl0", at(2, 0.3), 0.3); IN("#su-o0", at(2, 0.36), 0.4);
      HF(2, 2, at(2, 0.5));
      ARROW("#su-b1", at(2, 0.52), 0.5); IN("#su-bl1", at(2, 0.54), 0.3); IN("#su-o1", at(2, 0.6), 0.4);
      HF(3, 3, at(2, 0.78));
      ARROW("#su-b2", at(2, 0.8), 0.5); IN("#su-bl2", at(2, 0.82), 0.3); IN("#su-o2", at(2, 0.88), 0.4);

      // L3 指数退避：1 → 2 → 4 → … → 封顶；连上后回到 1s
      OUT("#su-cf, #su-l2", at(3, 0), 0.4);
      IN("#su-cg", at(3, 0.04), 0.5);
      HG(0, 0, at(3, 0.06));
      HG(6, 9, at(3, 0.18));
      IN("#su-bt0, #su-bar0", at(3, 0.20), 0.2); tl.fromTo("#su-bar0", { attr: { width: 0 } }, { attr: { width: 20 }, duration: 0.5, ease: "power1.out", immediateRender: false }, at(3, 0.20));
      IN("#su-bt1, #su-bar1", at(3, 0.27), 0.2); tl.fromTo("#su-bar1", { attr: { width: 0 } }, { attr: { width: 40 }, duration: 0.5, ease: "power1.out", immediateRender: false }, at(3, 0.27));
      IN("#su-bt2, #su-bar2", at(3, 0.34), 0.2); tl.fromTo("#su-bar2", { attr: { width: 0 } }, { attr: { width: 80 }, duration: 0.5, ease: "power1.out", immediateRender: false }, at(3, 0.34));
      IN("#su-bt3, #su-bar3", at(3, 0.41), 0.2); tl.fromTo("#su-bar3", { attr: { width: 0 } }, { attr: { width: 160 }, duration: 0.5, ease: "power1.out", immediateRender: false }, at(3, 0.41));
      IN("#su-bt4, #su-bar4", at(3, 0.48), 0.2); tl.fromTo("#su-bar4", { attr: { width: 0 } }, { attr: { width: 320 }, duration: 0.5, ease: "power1.out", immediateRender: false }, at(3, 0.48));
      IN("#su-bt5, #su-bar5", at(3, 0.55), 0.2); tl.fromTo("#su-bar5", { attr: { width: 0 } }, { attr: { width: 600 }, duration: 0.5, ease: "power1.out", immediateRender: false }, at(3, 0.55));
      HG(10, 10, at(3, 0.44));
      IN("#su-cap", at(3, 0.62), 0.4);
      HG(2, 2, at(3, 0.82));
      IN("#su-gn", at(3, 0.82), 0.4);
      IN("#su-ok", at(3, 0.84), 0.4, { scale: 0.5, svgOrigin: "215 720" }, { scale: 1, svgOrigin: "215 720" });
      IN("#su-r7", at(3, 0.9), 0.4, { x: -10 }, { x: 0 });

      // L4 回调只叫醒扫块循环；按高度逐块拉，断线期间也补上
      OUT("#su-cg, #su-gn, #su-l3", at(4, 0), 0.4);
      IN("#su-oh", at(4, 0.04), 0.4);
      ARROW("#su-oa", at(4, 0.1), 0.4);
      IN("#su-alo", at(4, 0.14), 0.4);
      tl.to("#su-al", { rotation: 10, svgOrigin: "612 344", duration: 0.07, yoyo: true, repeat: 7 }, at(4, 0.2));
      IN("#su-gap", at(4, 0.5), 0.4);
      IN("#su-n0", at(4, 0.55), 0.35, { y: -30 }, { y: 0 });
      IN("#su-n1", at(4, 0.60), 0.35, { y: -30 }, { y: 0 });
      IN("#su-n2", at(4, 0.65), 0.35, { y: -30 }, { y: 0 });
      IN("#su-n3", at(4, 0.70), 0.35, { y: -30 }, { y: 0 });
      tl.to("#su-nr3", { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, at(4, 0.70) + 0.3);
      IN("#su-n4", at(4, 0.75), 0.35, { y: -30 }, { y: 0 });
      tl.to("#su-nr4", { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, at(4, 0.75) + 0.3);
      IN("#su-n5", at(4, 0.80), 0.35, { y: -30 }, { y: 0 });
      tl.to("#su-nr5", { stroke: "#83C167", strokeWidth: 4, duration: 0.3 }, at(4, 0.80) + 0.3);
      IN("#su-n6", at(4, 0.85), 0.35, { y: -30 }, { y: 0 });
      IN("#su-n7", at(4, 0.90), 0.35, { y: -30 }, { y: 0 });

      // L5 Removed=true：区块被重组，撤销未确认充值
      OUT("#su-l4", at(5, 0), 0.4);
      IN("#su-c0, #su-c1, #su-c2, #su-cl", at(5, 0.03), 0.5);
      IN("#su-lk", at(5, 0.12), 0.3);
      IN("#su-lg", at(5, 0.14), 0.5, { x: 16 }, { x: 0 });
      tl.to("#su-orp", { y: -110, duration: 0.6, ease: "power2.inOut" }, at(5, 0.36));
      tl.to("#su-lk", { attr: { y1: 235 }, duration: 0.6, ease: "power2.inOut" }, at(5, 0.36));
      tl.to("#su-c2r", { stroke: "#FC6255", strokeDasharray: "10 6", fill: "#FC625518", duration: 0.3 }, at(5, 0.42));
      IN("#su-rg", at(5, 0.44), 0.4);
      IN("#su-c3", at(5, 0.48), 0.5, { y: 40 }, { y: 0 });
      IN("#su-rec", at(5, 0.62), 0.5, { y: 12 }, { y: 0 });
      DRAW("#su-st", at(5, 0.84), 0.4);
      tl.to("#su-rec", { opacity: 0.6, duration: 0.3 }, at(5, 0.88));
      ARROW("#su-rb", at(5, 0.88), 0.4);
      IN("#su-rbt", at(5, 0.9), 0.3);

      tl.to("#su-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#su-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["subscribe"] = tl;
    })();
  </script>
</template>
