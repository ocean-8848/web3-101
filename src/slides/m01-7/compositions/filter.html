        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

        tl.to(`#${p}-hb, #${p}-hs`, { opacity: 1, attr: { y: B0 - 29 + 41 * a, height: 41 * (b - a + 1) }, duration: 0.35, ease: "power2.inOut" }, t);

      IN("#fi-eth", at(0, 0.1), 0.5);

      tl.to("#fi-coin", { attr: { cx: 370 }, duration: 1.0, ease: "power2.inOut" }, at(0, 0.18));
      IN("#fi-same", at(0, 0.32), 0.4, { y: 8 }, { y: 0 });

      IN("#fi-map", at(0, 0.72), 0.5, { x: -16 }, { x: 0 });

      // L1 事件签名 = Keccak(Transfer(address,address,uint256))

      IN("#fi-code", at(1, 0.03), 0.5);
      H(0, 1, at(1, 0.06));
      IN("#fi-sig", at(1, 0.1), 0.5, { y: -10 }, { y: 0 });
      IN("#fi-fun", at(1, 0.3), 0.5);
      tl.to("#fi-sig", { y: 110, opacity: 0, duration: 0.8, ease: "power2.in" }, at(1, 0.5));
      ARROW("#fi-fa", at(1, 0.6), 0.35);
      IN("#fi-hash", at(1, 0.66), 0.5, { y: -12 }, { y: 0 });

      H(2, 4, at(2, 0.04));

      H(5, 5, at(2, 0.42));
      IN("#fi-n1", at(2, 0.42), 0.5, { y: -30 }, { y: 0 });
      H(6, 6, at(2, 0.62));
      IN("#fi-n2", at(2, 0.62), 0.5, { y: -30 }, { y: 0 });
      IN("#fi-cm", at(2, 0.7), 0.4);
      IN("#fi-pt0", at(2, 0.74) + 0.00, 0.2);
      tl.to("#fi-pt0", { attr: { y: 374 }, duration: 0.71, ease: "power2.in" }, at(2, 0.74) + 0.00);
      OUT("#fi-pt0", at(2, 0.74) + 0.00 + 0.96, 0.4);
      IN("#fi-pt1", at(2, 0.74) + 0.05, 0.2);
      tl.to("#fi-pt1", { attr: { y: 534 }, duration: 0.97, ease: "power2.in" }, at(2, 0.74) + 0.05);
      OUT("#fi-pt1", at(2, 0.74) + 0.05 + 1.22, 0.4);
      IN("#fi-pt2", at(2, 0.74) + 0.10, 0.2);
      tl.to("#fi-pt2", { attr: { y: 694 }, duration: 1.24, ease: "power2.in" }, at(2, 0.74) + 0.10);
      OUT("#fi-pt2", at(2, 0.74) + 0.10 + 1.49, 0.4);
      IN("#fi-pt3", at(2, 0.74) + 0.15, 0.2);
      tl.to("#fi-pt3", { attr: { y: 780 }, duration: 1.38, ease: "power2.in" }, at(2, 0.74) + 0.15);
      IN("#fi-pt4", at(2, 0.74) + 0.20, 0.2);
      tl.to("#fi-pt4", { attr: { y: 374 }, duration: 0.71, ease: "power2.in" }, at(2, 0.74) + 0.20);
      OUT("#fi-pt4", at(2, 0.74) + 0.20 + 0.96, 0.4);
      IN("#fi-pt5", at(2, 0.74) + 0.25, 0.2);
      tl.to("#fi-pt5", { attr: { y: 534 }, duration: 0.97, ease: "power2.in" }, at(2, 0.74) + 0.25);
      OUT("#fi-pt5", at(2, 0.74) + 0.25 + 1.22, 0.4);
      IN("#fi-pt6", at(2, 0.74) + 0.30, 0.2);
      tl.to("#fi-pt6", { attr: { y: 694 }, duration: 1.24, ease: "power2.in" }, at(2, 0.74) + 0.30);
      OUT("#fi-pt6", at(2, 0.74) + 0.30 + 1.49, 0.4);
      IN("#fi-pt7", at(2, 0.74) + 0.35, 0.2);
      tl.to("#fi-pt7", { attr: { y: 780 }, duration: 1.38, ease: "power2.in" }, at(2, 0.74) + 0.35);
      IN("#fi-pt8", at(2, 0.74) + 0.40, 0.2);

      tl.to("#fi-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);

    })();
