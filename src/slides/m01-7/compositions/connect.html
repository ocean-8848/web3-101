      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);

      };
      // 逐行高亮：a..b 行（从 0 开始）
      const N = 11, B0 = 252, ST = 41;
      const HL = (a, b, t) => {
        tl.to("#co-hb, #co-hs", { opacity: 1, attr: { y: B0 - 29 + ST * a, height: ST * (b - a + 1) }, duration: 0.35, ease: "power2.inOut" }, t);

      IN("#co-t1", at(0, 0.24), 0.4, { x: -12 }, { x: 0 });

      // L1 代码面板；ctx 60 秒超时
      OUT("#co-term", at(1, 0), 0.4);
      IN("#co-code", at(1, 0.05), 0.6, { x: 30 }, { x: 0 });
      HL(0, 2, at(1, 0.12));
      IN("#co-hg", at(1, 0.3), 0.5, { scale: 0.7, svgOrigin: "123 276" }, { scale: 1, svgOrigin: "123 276" });
      IN("#co-ctxl", at(1, 0.6), 0.8, { scaleY: 0, svgOrigin: "123 332" }, { scaleY: 1, svgOrigin: "123 332" });
      IN("#co-n0", at(1, 0.62), 0.5);

      // L2 DialContext 连上节点，退出前关闭
      HL(3, 5, at(2, 0.02));
      IN("#co-go", at(2, 0.1), 0.5);
      IN("#co-node", at(2, 0.22), 0.5);
      DRAW("#co-link", at(2, 0.38), 0.6);
      IN("#co-linkl", at(2, 0.48), 0.4);
      OUT("#co-n0", at(2, 0.6), 0.3);
      IN("#co-n1", at(2, 0.68), 0.4);

      // L3 ChainID：主网 1；配错就拒绝启动
      HL(6, 6, at(3, 0.02));
      IN("#co-thead", at(3, 0.08), 0.5);
      IN("#co-row0", at(3, 0.16), 0.5, { x: -16 }, { x: 0 });
      IN("#co-cid", at(3, 0.45), 0.5, { y: 10 }, { y: 0 });
      IN("#co-rej", at(3, 0.72), 0.5, { y: 10 }, { y: 0 });
      tl.to("#co-link", { stroke: "#FC6255", duration: 0.3, yoyo: true, repeat: 1 }, at(3, 0.76));

      // L4 BlockNumber
      OUT("#co-rej", at(4, 0), 0.3);
      HL(7, 7, at(4, 0.02));
      IN("#co-row1", at(4, 0.2), 0.5, { x: -16 }, { x: 0 });

      // L5 BalanceAt，nil = latest，单位 wei
      HL(8, 8, at(5, 0.02));
      IN("#co-row2", at(5, 0.15), 0.5, { x: -16 }, { x: 0 });
      OUT("#co-n1", at(5, 0.4), 0.3);
      IN("#co-n2", at(5, 0.46), 0.4);
      IN("#co-wei", at(5, 0.75), 0.5, { y: 10 }, { y: 0 });

      // L6 每个调用 = 一次往返：速度与账单；超时 → 检查 err

      IN("#co-go2", at(6, 0.04), 0.5);
      IN("#co-node2", at(6, 0.07), 0.5);
      for (let i = 0; i < 4; i++) {
        const t = at(6, 0.12 + i * 0.07);
        ARROW(`#co-q${i}`, t, 0.4);
        ARROW(`#co-p${i}`, t + 0.4, 0.4);
        IN(`#co-k${i}`, t + 0.1, 0.3, { scale: 0.5, svgOrigin: `680 ${370 + i * 110}` }, { scale: 1, svgOrigin: `680 ${370 + i * 110}` });

      IN("#co-gs, #co-ns", at(6, 0.36), 0.5);
      IN("#co-gb, #co-nb", at(6, 0.4), 0.5);
      tl.fromTo("#co-ns", { rotation: 60, svgOrigin: "1600 480" }, { rotation: -55, svgOrigin: "1600 480", duration: 1.6, ease: "power2.inOut", immediateRender: false }, at(6, 0.46));

      tl.set("#co-nb", { rotation: -60, svgOrigin: "1600 780" }, 0);
      tl.to("#co-p2", { opacity: 0.15, duration: 0.3 }, at(6, 0.7));
