  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const N = 8, B0 = 272, ST = 41;
      const HL = (a, b, t) => {
        tl.to("#ab-hb, #ab-hs", { opacity: 1, attr: { y: B0 - 29 + ST * a, height: ST * (b - a + 1) }, duration: 0.35, ease: "power2.inOut" }, t);
        for (let i = 0; i < N; i++) tl.to(`#ab-c${i}`, { opacity: i >= a && i <= b ? 1 : 0.6, duration: 0.3 }, t);
      };

      // L0 ETH 直接读；USDC 余额锁在合约里，要 eth_call
      IN("#ab-node", at(0, 0.02), 0.5);
      ARROW("#ab-ea", at(0, 0.1), 0.5);
      IN("#ab-eth", at(0, 0.16), 0.5, { y: 10 }, { y: 0 });
      IN("#ab-eal", at(0, 0.2), 0.4);
      IN("#ab-ct", at(0, 0.42), 0.6, { x: 30 }, { x: 0 });
      ARROW("#ab-ca", at(0, 0.75), 0.5);
      IN("#ab-cal", at(0, 0.8), 0.4);

      // L1 最小 ABI 三条目
      IN("#ab-abi", at(1, 0.05), 0.6, { x: 30 }, { x: 0 });
      IN("#ab-e0", at(1, 0.35), 0.4, { x: -12 }, { x: 0 });
      IN("#ab-e1", at(1, 0.5), 0.4, { x: -12 }, { x: 0 });
      IN("#ab-e2", at(1, 0.66), 0.4, { x: -12 }, { x: 0 });

      // L2 Pack：选择器 + 参数
      OUT("#ab-abi, #ab-e0, #ab-e1, #ab-e2, #ab-l0", at(2, 0), 0.4);
      IN("#ab-code", at(2, 0.05), 0.6, { x: 30 }, { x: 0 });
      HL(0, 0, at(2, 0.1));
      IN("#ab-p1", at(2, 0.14), 0.4);
      IN("#ab-p1i", at(2, 0.2), 0.4);
      IN("#ab-strip", at(2, 0.36), 0.5, { x: -24 }, { x: 0 });
      IN("#ab-n0", at(2, 0.4), 0.4);
      IN("#ab-sel", at(2, 0.62), 0.4, { y: 8 }, { y: 0 });
      IN("#ab-arg", at(2, 0.8), 0.4, { y: 8 }, { y: 0 });

      // L3 CallContract = eth_call：字节带进合约，带回一串编码字节
      HL(1, 2, at(3, 0.02));
      OUT("#ab-n0", at(3, 0.02), 0.3);
      IN("#ab-n1", at(3, 0.1), 0.4);
      IN("#ab-p2", at(3, 0.08), 0.4);
      ARROW("#ab-down1", at(3, 0.2), 0.5);
      tl.to("#ab-ctr", { strokeWidth: 6, duration: 0.25, yoyo: true, repeat: 1 }, at(3, 0.32));
      ARROW("#ab-down2", at(3, 0.5), 0.4);
      IN("#ab-ret", at(3, 0.56), 0.5, { y: -16 }, { y: 0 });

      // L4 Unpack：balance → *big.Int，decimals uint8 → *big.Int
      HL(3, 6, at(4, 0.02));
      OUT("#ab-n1", at(4, 0.02), 0.3);
      IN("#ab-n2", at(4, 0.1), 0.4);
      IN("#ab-p3", at(4, 0.08), 0.4);
      ARROW("#ab-down3", at(4, 0.14), 0.4);
      IN("#ab-o0", at(4, 0.3), 0.5, { x: -12 }, { x: 0 });
      IN("#ab-o1", at(4, 0.55), 0.5, { x: -12 }, { x: 0 });

      // L5 算一算：6 位 vs 18 位，差 10^12
      OUT("#ab-code, #ab-n2, #ab-left", at(5, 0), 0.5);
      IN("#ab-tab", at(5, 0.06), 0.6, { x: 30 }, { x: 0 });
      IN("#ab-raw", at(5, 0.3), 0.5);
      IN("#ab-u", at(5, 0.36), 0.5);
      IN("#ab-um", at(5, 0.42), 0.5, { y: -30 }, { y: 0 });
      IN("#ab-d", at(5, 0.5), 0.5);
      IN("#ab-dm", at(5, 0.56), 0.5, { y: -30 }, { y: 0 });
      ARROW("#ab-x", at(5, 0.66), 0.7);
      IN("#ab-xl", at(5, 0.72), 0.5, { scale: 0.7, svgOrigin: "270 458" }, { scale: 1, svgOrigin: "270 458" });
      IN("#ab-xl2", at(5, 0.86), 0.5);
      IN("#ab-ex", at(5, 0.9), 0.4);

      // L6 启动读一次进缓存；USDT 的 transfer 不返回 bool
      OUT("#ab-rul", at(6, 0), 0.5);
      IN("#ab-drw", at(6, 0.05), 0.6);
      IN("#ab-dv", at(6, 0.12), 0.6, { x: 200 }, { x: 0 });
      IN("#ab-once", at(6, 0.2), 0.5, { x: -12 }, { x: 0 });
      IN("#ab-usdt", at(6, 0.38), 0.6, { y: 20 }, { y: 0 });
      tl.to("#ab-slot", { strokeWidth: 4.5, duration: 0.3, yoyo: true, repeat: 3 }, at(6, 0.5));
      tl.to("#ab-dv", { fill: "#83C167", duration: 0.4, yoyo: true, repeat: 1 }, at(6, 0.88));
      IN("#ab-safe", at(6, 0.64), 0.5, { y: 10 }, { y: 0 });

      tl.to("#ab-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["abicall"] = tl;
    })();
  </script>
