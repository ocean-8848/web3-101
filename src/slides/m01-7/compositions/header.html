      const N = 11, B0 = 252, ST = 41;

      IN("#he-bt", at(1, 0.8), 0.4, { scale: 1.2, svgOrigin: "1302 954" }, { scale: 1, svgOrigin: "1302 954" });

      tl.to("#he-tx2r", { stroke: "#FF9F43", duration: 0.3 }, at(2, 0.5));

      tl.to("#he-gear circle", { stroke: "#FC6255", duration: 0.3 }, at(2, 0.68));
      IN("#he-errt", at(2, 0.72), 0.4, { x: -10 }, { x: 0 });
      tl.to("#he-head", { strokeWidth: 5, duration: 0.3 }, at(2, 0.85));

      // L3 回执：交易哈希 → status / gasUsed / logs
      OUT("#he-blk", at(3, 0), 0.5);
      IN("#he-in", at(3, 0.1), 0.5);
      ARROW("#he-ina", at(3, 0.16), 0.5);
      IN("#he-card", at(3, 0.2), 0.6, { scale: 0.94, svgOrigin: "960 510" }, { scale: 1, svgOrigin: "960 510" });

      IN("#he-f0", at(3, 0.55), 0.4, { x: -12 }, { x: 0 });
      IN("#he-f1", at(3, 0.68), 0.4, { x: -12 }, { x: 0 });
      IN("#he-f2", at(3, 0.82), 0.4, { x: -12 }, { x: 0 });

      // L4 status 1 / 0，失败也有回执
      OUT("#he-rc", at(4, 0), 0.4);
      IN("#he-ok", at(4, 0.1), 0.5, { x: 30 }, { x: 0 });
      IN("#he-bad", at(4, 0.4), 0.5, { x: 30 }, { x: 0 });
      IN("#he-title", at(4, 0.7), 0.5, { y: 10 }, { y: 0 });
