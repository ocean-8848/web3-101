          </g></g>
          <path id="de-crk" class="h" d="M690 676 L716 700 L700 712 L730 744" fill="none" stroke="#FC6255" stroke-width="4" stroke-linejoin="round" />

        <!-- L6：日志序号是全区块位置 -->
        <g id="de-bk">

            <path d="M320 460 L320 530 M480 460 L480 530 M960 460 L960 530 M1440 460 L1440 530 M1600 460 L1600 530" stroke="#8a8f99" stroke-width="2.5" />

            <text class="mono" x="480" y="690" font-size="34" fill="#FC6255" text-anchor="middle">1</text>

  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const HL = (p, n, B0, a, b, t) => {
        tl.to(`#${p}-hb, #${p}-hs`, { opacity: 1, attr: { y: B0 - 29 + 41 * a, height: 41 * (b - a + 1) }, duration: 0.35, ease: "power2.inOut" }, t);
        for (let i = 0; i < n; i++) tl.to(`#${p}-c${i}`, { opacity: i >= a && i <= b ? 1 : 0.6, duration: 0.3 }, t);
      };
      const H = (a, b, t) => HL("de-code", 12, 246, a, b, t);

      // L0 indexed → topics；非 indexed → data
      IN("#de-chf", at(0, 0.02), 0.4, { y: -12 }, { y: 0 });
      IN("#de-cht", at(0, 0.06), 0.4, { y: -12 }, { y: 0 });
      IN("#de-chv", at(0, 0.1), 0.4, { y: -12 }, { y: 0 });
      IN("#de-rows", at(0, 0.16), 0.6);
      IN("#de-ix", at(0, 0.3), 0.4, { y: 8 }, { y: 0 });
      IN("#de-tr", at(0, 0.4), 0.5);
      OUT("#de-ix", at(0, 0.46), 0.3);
      tl.to("#de-chf", { x: 185, y: 320, duration: 0.8, ease: "power2.inOut" }, at(0, 0.5));
      tl.to("#de-cht", { x: -5, y: 410, duration: 0.8, ease: "power2.inOut" }, at(0, 0.55));
      IN("#de-dr", at(0, 0.72), 0.5);
      tl.to("#de-chv", { x: -205, y: 520, duration: 0.8, ease: "power2.inOut" }, at(0, 0.78));

      // L1 Topics[0] 签名；Topics[1]/[2] 左补零，取后 20 字节
      IN("#de-code", at(1, 0.0), 0.5);
      H(4, 9, at(1, 0.03));
      IN("#de-t0", at(1, 0.06), 0.5);
      OUT("#de-chf, #de-cht", at(1, 0.18), 0.3);
      IN("#de-t1c", at(1, 0.2), 0.5);
      IN("#de-t2c", at(1, 0.28), 0.5);
      tl.fromTo("#de-t1c rect, #de-t2c rect", { opacity: 0.4 }, { opacity: 1, duration: 0.3, stagger: 0.008, immediateRender: false }, at(1, 0.44));
      DRAW("#de-cut", at(1, 0.66), 0.5);
      tl.to("#de-t1c, #de-t2c", { opacity: 0.35, duration: 0.4 }, at(1, 0.74));
      IN("#de-t1m", at(1, 0.78), 0.4);
      IN("#de-t2m", at(1, 0.82), 0.4);

      // L2 Data：32 字节大端整数 → Value
      H(10, 11, at(2, 0.02));
      OUT("#de-chv", at(2, 0.08), 0.3);
      IN("#de-dc", at(2, 0.1), 0.5);
      IN("#de-be", at(2, 0.4), 0.4, { y: 8 }, { y: 0 });
      IN("#de-dm", at(2, 0.66), 0.5);
      IN("#de-ad", at(2, 0.86), 0.4);

      // L3 第一道闸门：白名单
      OUT("#de-dg", at(3, 0), 0.4);
      tl.to("#de-code-hb, #de-code-hs", { opacity: 0, duration: 0.3 }, at(3, 0));
      tl.to("#de-code text", { opacity: 0.6, duration: 0.3 }, at(3, 0));
      IN("#de-g1", at(3, 0.06), 0.5, { y: 12 }, { y: 0 });
      IN("#de-realc", at(3, 0.14), 0.4, { y: -12 }, { y: 0 });
      IN("#de-fakec", at(3, 0.3), 0.4, { y: -12 }, { y: 0 });
      ARROW("#de-ra", at(3, 0.5), 0.4);
      ARROW("#de-fa", at(3, 0.54), 0.4);
      tl.to("#de-g1 path", { strokeWidth: 6, duration: 0.2, yoyo: true, repeat: 1 }, at(3, 0.6));
      OUT("#de-ra, #de-fa", at(3, 0.66), 0.3);
      tl.to("#de-fake", { x: 100, y: 160, duration: 0.6, ease: "power2.inOut" }, at(3, 0.66));
      IN("#de-drop", at(3, 0.74), 0.4, { y: -8 }, { y: 0 });
      tl.to("#de-fakec", { opacity: 0.45, duration: 0.4 }, at(3, 0.8));
      tl.to("#de-real", { x: 230, y: 300, duration: 0.7, ease: "power2.inOut" }, at(3, 0.8));
      tl.to("#de-realc rect", { stroke: "#83C167", duration: 0.3 }, at(3, 0.88));
      DRAW("#de-pa", at(3, 0.82), 0.3);

      // L4 第二道闸门：topics 正好 3 个（ERC-721 有 4 个）
      H(0, 3, at(4, 0.03));
      IN("#de-g2", at(4, 0.06), 0.5, { y: 12 }, { y: 0 });
      IN("#de-nftc", at(4, 0.22), 0.5, { x: -16 }, { x: 0 });
      tl.to("#de-nft", { x: 260, duration: 0.6, ease: "power2.in" }, at(4, 0.5));
      tl.to("#de-g2 path", { strokeWidth: 6, duration: 0.2, yoyo: true, repeat: 1 }, at(4, 0.54));
      tl.to("#de-nft", { x: 560, duration: 0.5, ease: "power2.out" }, at(4, 0.6));
      tl.to("#de-nftr", { stroke: "#FC6255", duration: 0.3 }, at(4, 0.62));
      IN("#de-crk", at(4, 0.72), 0.3);
      IN("#de-crt", at(4, 0.76), 0.4, { y: -8 }, { y: 0 });

      // L5 通过两道 + Removed=false → TransferEvent
      OUT("#de-fake, #de-drop, #de-nft, #de-crk, #de-crt", at(5, 0), 0.4);
      H(4, 11, at(5, 0.04));
      tl.to("#de-real", { y: 420, duration: 0.5, ease: "power2.inOut" }, at(5, 0.08));
      tl.to("#de-real", { opacity: 0, duration: 0.25 }, at(5, 0.08) + 0.4);
      tl.to("#de-g2 path", { stroke: "#83C167", duration: 0.3 }, at(5, 0.16));
      ARROW("#de-sa", at(5, 0.28), 0.4);
      IN("#de-rm", at(5, 0.36), 0.4, { x: -8 }, { x: 0 });
      IN("#de-ev", at(5, 0.6), 0.5, { y: 12 }, { y: 0 });

      // L6 区块内的日志连续编号
      OUT("#de-gt, #de-code", at(6, 0), 0.4);
      IN("#de-blk", at(6, 0.04), 0.5, { x: -30 }, { x: 0 });
      IN("#de-tx", at(6, 0.1), 0.5, { y: -16 }, { y: 0 });
      IN("#de-lg", at(6, 0.18), 0.5, { y: -16 }, { y: 0 });
      IN("#de-uid", at(6, 0.3), 0.5, { y: 10 }, { y: 0 });
      ["#de-n0", "#de-n1", "#de-n2", "#de-n3", "#de-n4"].forEach((s, i) => IN(s, at(6, 0.5 + i * 0.05), 0.3, { y: -8 }, { y: 0 }));
      IN("#de-wr", at(6, 0.8), 0.4, { y: 8 }, { y: 0 });

      tl.to("#de-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["decode"] = tl;
    })();
  </script>
