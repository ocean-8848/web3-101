    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const MV = (s, t, v, d = 0.6) => tl.to(s, { duration: d, ease: "power2.inOut", ...v }, t);
      { const g = document.querySelector("#au-grid");
        for (let i = 0; i < 100; i++) { const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          r.setAttribute("id", "au-c" + i); r.setAttribute("x", 200 + (i % 10) * 42); r.setAttribute("y", 400 + Math.floor(i / 10) * 42);
          r.setAttribute("width", 34); r.setAttribute("height", 34); r.setAttribute("rx", 5); r.setAttribute("fill", "#6b6f7a"); g.appendChild(r); } }
      const cells = [...Array(100).keys()].map(i => "#au-c" + i);

      // L0 三道闸门
      DRAW("#au-pipe", at(0, 0), 0.8);
      ["#au-g1", "#au-g2", "#au-g3"].forEach((s, i) => IN(s, at(0, 0.1 + i * 0.12), 0.5, { y: 20 }, { y: 0 }));
      IN("#au-req", at(0, 0.5), 0.3);
      MV("#au-req", at(0, 0.55), { x: 170 }, 0.8);
      IN("#au-g1h", at(0, 0.8), 0.4);

      // L1 Key → SHA-256 → 本地缓存 → PostgreSQL
      IN("#au-hdr", at(1, 0.02), 0.5, { x: -30 }, { x: 0 });
      ARROW("#au-a1", at(1, 0.12));
      IN("#au-sha", at(1, 0.16), 0.5);
      ARROW("#au-a2", at(1, 0.27));
      IN("#au-hash", at(1, 0.31), 0.5);
      IN("#au-only", at(1, 0.42), 0.5);
      ARROW("#au-a3", at(1, 0.58));
      IN("#au-lc", at(1, 0.62), 0.5);
      ARROW("#au-a4", at(1, 0.72));
      IN("#au-miss", at(1, 0.74), 0.4);
      IN("#au-db", at(1, 0.8), 0.5);
      tl.to("#au-lc rect", { stroke: "#83C167", duration: 0.4 }, at(1, 0.93));

      // L2 令牌桶 + 公式
      OUT("#au-k1", at(2, 0), 0.4);
      OUT("#au-g1h", at(2, 0), 0.3); IN("#au-g2h", at(2, 0.02), 0.4);
      MV("#au-req", at(2, 0), { x: 680 }, 0.7);
      IN("#au-bkA", at(2, 0.08), 0.5);
      [["#au-tk1", 0.15], ["#au-tk2", 0.3], ["#au-tk3", 0.5], ["#au-tk1", 0.7], ["#au-tk2", 0.85]].forEach(([s, f]) => {
        tl.fromTo(s, { opacity: 1, attr: { cy: 440 } }, { attr: { cy: 650 }, duration: 0.7, ease: "power2.in", immediateRender: false }, at(2, f));
        tl.to(s, { opacity: 0, duration: 0.2 }, at(2, f) + 0.6);
      });
      IN("#au-f1", at(2, 0.35), 0.6);
      IN("#au-f2", at(2, 0.68), 0.6);

      // L3 代入：50 RPS / 2 实例
      IN("#au-ex1", at(3, 0.05), 0.4);
      IN("#au-v1", at(3, 0.3), 0.6, { x: -20 }, { x: 0 });
      IN("#au-bkB", at(3, 0.45), 0.6);
      IN("#au-v2", at(3, 0.62), 0.6, { x: -20 }, { x: 0 });
      IN("#au-cA", at(3, 0.75), 0.5);

      // L4 超限 + 日配额
      OUT(["#au-f1", "#au-f2", "#au-v1", "#au-v2", "#au-bkB", "#au-ex1", "#au-cA"], at(4, 0), 0.4);
      tl.to("#au-lvA", { attr: { y: 808, height: 2 }, duration: 0.8, ease: "power2.in" }, at(4, 0.03));
      IN("#au-rj", at(4, 0.12), 0.3);
      MV("#au-rj", at(4, 0.15), { x: -200 }, 0.5);
      tl.to("#au-rj", { x: 0, fill: "#FC6255", duration: 0.5, ease: "back.out(2)" }, at(4, 0.15) + 0.5);
      IN("#au-rl1", at(4, 0.27), 0.4); IN("#au-rl2", at(4, 0.33), 0.4);
      IN("#au-rd", at(4, 0.55), 0.5);
      IN("#au-qf", at(4, 0.62), 0.1);
      tl.to("#au-qf", { attr: { width: 736 }, duration: 1.6, ease: "power1.in" }, at(4, 0.63));
      tl.to("#au-qf", { fill: "#FC6255", duration: 0.3 }, at(4, 0.63) + 1.4);
      IN("#au-qx", at(4, 0.88), 0.4);

      // L5 计算单位 CU
      OUT(["#au-k2", "#au-k4"], at(5, 0), 0.4);
      OUT("#au-g2h", at(5, 0), 0.3); IN("#au-g3h", at(5, 0.02), 0.4);
      MV("#au-req", at(5, 0), { x: 1190 }, 0.7);
      IN("#au-term", at(5, 0.08), 0.5);
      OUT("#au-term", at(6, 0) - 1.2, 0.4);
      [["#au-w1", "#au-n1", "#au-m1"], ["#au-w2", "#au-n2", "#au-m2"], ["#au-w3", "#au-n3", "#au-m3"]].forEach(([w, n, m], i) => {
        const t = at(5, 0.45 + i * 0.15);
        IN(m, t, 0.4); IN(w, t + 0.1, 0.5, { scaleY: 0, svgOrigin: "960 880" }, { scaleY: 1, svgOrigin: "960 880" }); IN(n, t + 0.4, 0.4);
      });
      IN("#au-cu", at(5, 0.25), 0.5);
      IN("#au-ex2", at(5, 0.5), 0.4);

      // L6 批量逐条计
      OUT("#au-k5", at(6, 0), 0.4);
      IN("#au-env", at(6, 0.05), 0.6, { y: 20 }, { y: 0 });
      ARROW("#au-e1", at(6, 0.4)); IN("#au-r1", at(6, 0.43), 0.5);
      IN("#au-x1", at(6, 0.62), 0.3, { scale: 1.6, svgOrigin: "1080 520" }, { scale: 1, svgOrigin: "1080 520" }); IN("#au-x1t", at(6, 0.65), 0.4);
      ARROW("#au-e2", at(6, 0.74)); IN("#au-r2", at(6, 0.76), 0.4); IN("#au-r2n", at(6, 0.78), 0.3);
      COUNT("#au-r2n", 0, 1000, at(6, 0.8), 1.3);
      IN("#au-x2", at(6, 0.95), 0.3);

      // L7 100 条进 51 容量的桶
      OUT("#au-k6", at(7, 0), 0.4);
      IN("#au-g2h", at(7, 0.02), 0.4);
      IN("#au-bt", at(7, 0.05), 0.4); IN("#au-grid", at(7, 0.06), 0.6);
      ARROW("#au-e3", at(7, 0.2)); IN("#au-bkC", at(7, 0.22), 0.5);
      tl.to(cells.slice(0, 51), { fill: "#83C167", duration: 0.2, stagger: 0.03 }, at(7, 0.32));
      IN("#au-ok", at(7, 0.5), 0.4);
