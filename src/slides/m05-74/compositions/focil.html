  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      // L0 构建者挡下一笔交易
      IN("#fo-b", at(0, 0.0)); IN("#fo-wall", at(0, 0.05));
      for (let k = 0; k < 5; k++) {
        const t0 = at(0, 0.1 + k * 0.13);
        IN(`#fo-t${k}`, t0, 0.3);
        if (k === 2) {
          tl.to(`#fo-to${k}`, { x: 560, duration: 1.0, ease: "power2.out" }, t0);
          tl.to(`#fo-to${k}`, { x: 540, duration: 0.2 }, t0 + 1.0);
        } else {
          tl.to(`#fo-to${k}`, { x: 780, duration: 1.4, ease: "none" }, t0);
          OUT(`#fo-t${k}`, t0 + 1.2, 0.3);
        }
      }
      IN("#fo-ban", at(0, 0.5));
      // L1 术语卡；构建者右移，验证者圈出现
      IN("#fo-term", at(1, 0.0), 0.5);
      OUT(["#fo-t2", "#fo-ban"], at(1, 0.1));
      tl.to("#fo-bo", { x: 500, duration: 1.0, ease: "power2.inOut" }, at(1, 0.15));
      for (let k = 0; k < 14; k++) IN(`#fo-v${k}`, at(1, 0.3 + k * 0.02), 0.4);
      IN("#fo-valt", at(1, 0.5));
      OUT("#fo-term", at(2, 0.62), 0.4);
      // L2 随机委员会 → 包含列表
      [1, 4, 6, 9, 12].forEach((k, i) => tl.to(`#fo-v${k}`, { stroke: "#83C167", fill: "#1d2a1a", duration: 0.3 }, at(2, 0.05 + i * 0.05)));
      IN("#fo-list", at(2, 0.35)); IN("#fo-lr", at(2, 0.35)); DRAW("#fo-lrl", at(2, 0.4), 0.4);
      for (let i = 0; i < 5; i++) {
        const el = document.getElementById("fo-f" + i);
        IN(`#fo-f${i}`, at(2, 0.45 + i * 0.04), 0.2);
        tl.to(`#fo-fo${i}`, { x: +el.dataset.dx, y: +el.dataset.dy, duration: 0.8, ease: "power2.inOut" }, at(2, 0.47 + i * 0.04));
        OUT(`#fo-f${i}`, at(2, 0.47 + i * 0.04) + 0.75, 0.2);
      }
      // L3 缺清单交易 → 全红 ✕ 推出；包含了 → ✓ 上链
      for (let i = 0; i < 4; i++) IN(`#fo-ch${i}`, at(3, 0.0 + i * 0.02), 0.4);
      for (let i = 0; i < 3; i++) IN(`#fo-cl${i}`, at(3, 0.02 + i * 0.02), 0.4);
      IN("#fo-ba", at(3, 0.1)); IN("#fo-unf", at(3, 0.16));
      tl.to(Array.from({ length: 14 }, (_, k) => `#fo-v${k}`), { stroke: "#FC6255", duration: 0.4, stagger: 0.03 }, at(3, 0.3));
      IN("#fo-bax", at(3, 0.38), 0.3);
      tl.to("#fo-bao", { y: 120, opacity: 0, duration: 0.7, ease: "power2.in" }, at(3, 0.48));
      OUT(["#fo-bax", "#fo-unf"], at(3, 0.48));
      IN("#fo-bb", at(3, 0.6));
      tl.to(Array.from({ length: 14 }, (_, k) => `#fo-v${k}`), { stroke: "#83C167", duration: 0.4, stagger: 0.03 }, at(3, 0.66));
      DRAW("#fo-bbck", at(3, 0.72), 0.4);
      ARROW("#fo-up", at(3, 0.8), 0.6); IN("#fo-cl3", at(3, 0.86), 0.3); IN("#fo-ch4", at(3, 0.88), 0.4);
      // L4 被拉黑的交易随清单进入区块，挡板失效
      OUT(["#fo-bb", "#fo-bbck", "#fo-up"], at(4, 0.0));
      tl.to("#fo-lro", { x: 440, y: -150, duration: 1.2, ease: "power2.inOut" }, at(4, 0.1));
      tl.to("#fo-wall", { opacity: 0, y: 60, duration: 0.6 }, at(4, 0.25));
      tl.to("#fo-lro", { x: 640, y: -400, duration: 1.0, ease: "power2.inOut" }, at(4, 0.5));
      OUT("#fo-lr", at(4, 0.72), 0.3);
      tl.to("#fo-ch4", { fill: "#F0B90B", duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.74));
      // L5 总结 + 状态
      OUT(Array.from({ length: 14 }, (_, k) => `#fo-v${k}`).concat(["#fo-valt", "#fo-list", "#fo-lrl", "#fo-b", "#fo-ch0", "#fo-ch1", "#fo-ch2", "#fo-ch3", "#fo-ch4", "#fo-cl0", "#fo-cl1", "#fo-cl2", "#fo-cl3"]), at(5, 0.0));
      IN("#fo-pbs", at(5, 0.08));
      IN("#fo-sum", at(5, 0.18));
      IN("#fo-stat", at(5, 0.45));


      tl.to("#fo-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#fo-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["focil"] = tl;
    })();
