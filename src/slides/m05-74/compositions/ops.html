  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      // L0 三张坑卡
      IN("#op-c1", at(0, 0.0)); IN("#op-c2", at(0, 0.25)); IN("#op-c3", at(0, 0.5));
      const FOCUS = (k, col, t) => {
        [1, 2, 3].forEach(j => {
          tl.to(`#op-c${j}`, { opacity: j === k ? 1 : 0.35, duration: 0.4 }, t);
          tl.to(`#op-c${j}r`, { stroke: j === k ? col : "#8a8f99", duration: 0.4 }, t);
        });
      };
      // L1 坑 1：防火墙挡端口
      FOCUS(1, "#FC6255", at(1, 0.0));
      IN("#op-node", at(1, 0.05));
      IN("#op-fw", at(1, 0.22));
      ARROW("#op-pa1", at(1, 0.42)); IN("#op-pt1", at(1, 0.42)); IN("#op-pn1", at(1, 0.45));
      ARROW("#op-pa2", at(1, 0.6)); IN("#op-pt2", at(1, 0.6)); IN("#op-pn2", at(1, 0.63));
      IN("#op-x1", at(1, 0.78), 0.3); IN("#op-x2", at(1, 0.84), 0.3);
      // L2 只剩 2 条线；收益条变短；错过
      [3, 5].forEach((k, i) => { DRAW(`#op-l${k}`, at(2, 0.05 + i * 0.1), 0.6); IN(`#op-p${k}`, at(2, 0.1 + i * 0.1), 0.4); });
      IN("#op-bar", at(2, 0.35));
      tl.to("#op-barf", { attr: { width: 130 }, fill: "#FC6255", duration: 1.6, ease: "power2.inOut" }, at(2, 0.48));
      IN("#op-slot", at(2, 0.72), 0.5, { scale: 0.85, svgOrigin: "1640 882" }, { scale: 1 });
      // L3 打开防火墙，连接增多，三个指标
      OUT(["#op-fw", "#op-pa1", "#op-pa2", "#op-x1", "#op-x2", "#op-pt1", "#op-pn1", "#op-pt2", "#op-pn2", "#op-bar", "#op-slot"], at(3, 0.0));
      [0, 1, 2, 4, 6, 7].forEach((k, i) => { DRAW(`#op-l${k}`, at(3, 0.08 + i * 0.03), 0.5); IN(`#op-p${k}`, at(3, 0.1 + i * 0.03), 0.4); });
      tl.to([0,1,2,3,4,5,6,7].map(k => `#op-l${k}`), { stroke: "#83C167", duration: 0.5 }, at(3, 0.3));
      tl.to([0,1,2,3,4,5,6,7].map(k => `#op-p${k}`), { stroke: "#83C167", duration: 0.5 }, at(3, 0.3));
      IN("#op-mt0", at(3, 0.42)); IN("#op-mt1", at(3, 0.58)); IN("#op-mt2", at(3, 0.75));
      // L4 坑 2：慢 RPC，进池被挤出
      OUT("#op-m1", at(4, 0.0));
      FOCUS(2, "#FF9F43", at(4, 0.0));
      IN("#op-tx", at(4, 0.08)); IN("#op-rpc", at(4, 0.12)); IN("#op-pool", at(4, 0.18));
      ARROW("#op-a21", at(4, 0.2));
      tl.to("#op-txg", { x: 270, duration: 1.8, ease: "power1.inOut" }, at(4, 0.25));
      ARROW("#op-a22", at(4, 0.5));
      tl.to("#op-txg", { x: 620, y: -40, duration: 0.8, ease: "power2.out" }, at(4, 0.55));
      tl.to("#op-tx", { fill: "#FC6255", duration: 0.3 }, at(4, 0.78));
      tl.to("#op-txg", { y: 220, duration: 0.7, ease: "power2.in" }, at(4, 0.8));
      OUT("#op-tx", at(4, 0.88));
      // L5 多地域 RPC + 私有通道 + 重播队列
      OUT("#op-m2a", at(5, 0.0));
      IN("#op-tx2", at(5, 0.06));
