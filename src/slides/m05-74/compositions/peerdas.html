  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      // L0 术语卡 + 状态标签
      IN("#pe-term", at(0, 0.05), 0.5);
      IN("#pe-stat", at(0, 0.55));
      OUT("#pe-term", at(1, 0.55), 0.4);
      // L1 一大块 Blob；家用节点下载条爆满
      IN("#pe-blob", at(0, 0.6)); IN("#pe-home", at(1, 0.12)); IN("#pe-homet", at(1, 0.14));
      ARROW("#pe-dl", at(1, 0.22)); IN("#pe-bar", at(1, 0.3));
      tl.fromTo("#pe-barf", { attr: { width: 0 } }, { attr: { width: 300 }, duration: 2.2, ease: "power1.in", immediateRender: false }, at(1, 0.32));
      tl.to("#pe-barf", { fill: "#FC6255", duration: 0.3 }, at(1, 0.72));
      // L2 切成列 + 纠删码扩展
      OUT(["#pe-dl", "#pe-home", "#pe-homet", "#pe-bar"], at(2, 0.0));
      OUT("#pe-blob", at(2, 0.08));
      for (let i = 0; i < 8; i++) IN(`#pe-c${i}`, at(2, 0.08 + i * 0.015), 0.4);
      IN("#pe-orig", at(2, 0.18));
      for (let i = 8; i < 16; i++) IN(`#pe-c${i}`, at(2, 0.32 + (i - 8) * 0.03), 0.4, { x: -30 }, { x: 0 });
      IN("#pe-ext", at(2, 0.4));
      IN("#pe-rec", at(2, 0.66));
      // L3 节点认领 + 随机抽样
      OUT(["#pe-orig", "#pe-ext", "#pe-rec"], at(3, 0.0));
      for (let g = 0; g < 6; g++) { IN(`#pe-gf${g}`, at(3, 0.05 + g * 0.04), 0.4); IN(`#pe-n${g}`, at(3, 0.07 + g * 0.04), 0.4); }
      for (let k = 0; k < 3; k++) { ARROW(`#pe-sa${k}`, at(3, 0.38 + k * 0.1)); DRAW(`#pe-ck${k}`, at(3, 0.45 + k * 0.1), 0.4); }
