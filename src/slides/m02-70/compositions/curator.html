OUT("#cu-vl", at(2, 0.1), 0.3);

for (let i = 0; i < 3; i++) { IN(`#cu-wd${i}`, at(3, 0.02) + i * 0.08, 0.3); tl.to(`#cu-pr${i}`, { stroke: "#58C4DD", duration: 0.3 }, at(3, 0.02) + i * 0.08); }

DRAW("#cu-w3", at(3, 0.45), 0.6); IN("#cu-wx", at(3, 0.55), 0.3); IN("#cu-nw", at(3, 0.58), 0.4);
const CAP = [800, 820, 840];
for (let i = 0; i < 3; i++) {
  IN(`#cu-cap${i}`, at(3, 0.65) + i * 0.06, 0.3);
  tl.fromTo(`#cu-f${i}`, { attr: { y: 866, height: 0 } }, { attr: { y: CAP[i] + 6, height: 860 - CAP[i] }, duration: 1.0, ease: "power2.out", immediateRender: false }, at(3, 0.7) + i * 0.06);
}
IN("#cu-capl", at(3, 0.7), 0.4);
// L4 no withdraw path
IN("#cu-wal", at(4, 0.02), 0.4);
IN("#cu-wall", at(4, 0.12), 0.4, { scaleY: 0, svgOrigin: "1270 490" }, { scaleY: 1, svgOrigin: "1270 490" });

IN("#cu-steal", at(4, 0.35), 0.2);
tl.fromTo("#cu-steal", { strokeDashoffset: 0 }, { strokeDashoffset: -54, duration: 1.0, ease: "none", immediateRender: false }, at(4, 0.35));
tl.to("#cu-wall", { fill: "#e8e6df", duration: 0.1, yoyo: true, repeat: 1 }, at(4, 0.55));
OUT("#cu-steal", at(4, 0.58), 0.15);
const sh = [[-30, -50], [-10, 60], [-40, 20]];
for (let i = 0; i < 3; i++) {
  tl.fromTo(`#cu-sh${i}`, { opacity: 1, x: 0, y: 0 }, { x: sh[i][0], y: sh[i][1], opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, at(4, 0.58));
}
// L5 performance fee + vault styles
OUT("#cu-wall, #cu-walll", at(5, 0), 0.3);
IN("#cu-fee", at(5, 0.08), 0.3);
