    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 协议司库
      IN("#tr-safe", at(0, 0.05), 0.8, { scale: 0.9, svgOrigin: "960 480" }, { scale: 1, svgOrigin: "960 480" });
      IN("#tr-dial", at(0, 0.3));
      tl.to("#tr-dial", { rotation: 120, svgOrigin: "960 460", duration: 1.0, ease: "power2.inOut" }, at(0, 0.5));
      // L1 数千万 → 数十亿
      IN("#tr-scale", at(1, 0.1), 0.4);
      ARROW("#tr-scl", at(1, 0.12), 1.4);
      tl.to("#tr-safe", { opacity: 0.6, duration: 0.4, yoyo: true, repeat: 1 }, at(1, 0.38));
      tl.to("#tr-dial", { rotation: -60, svgOrigin: "960 460", duration: 1.0, ease: "power2.inOut" }, at(1, 0.6));
      // L2 误区：95% 自家代币
      OUT("#tr-scale", at(2, 0.0)); OUT("#tr-dial", at(2, 0.0));
      IN("#tr-pie1", at(2, 0.08), 0.8, { scale: 0.6, svgOrigin: "960 460" }, { scale: 1, svgOrigin: "960 460" });
      IN("#tr-lab95", at(2, 0.3));
      IN("#tr-bub", at(2, 0.55), 0.6, { y: 20 }, { y: 0 });
      // L3 跌 90% → 死亡螺旋
      OUT("#tr-bub", at(3, 0.0));
      tl.to("#tr-pie1", { scale: 0.316, svgOrigin: "960 460", duration: 1.2, ease: "power2.inOut" }, at(3, 0.22));
      IN("#tr-m90", at(3, 0.3));
      IN("#tr-loop", at(3, 0.5), 0.5);
      ARROW("#tr-l1", at(3, 0.55)); ARROW("#tr-l2", at(3, 0.62)); ARROW("#tr-l3", at(3, 0.69));
      tl.to("#tr-loop", { opacity: 0.55, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, at(3, 0.8));
      // L4 多元化 + Runway
      OUT("#tr-loop", at(4, 0.0)); OUT("#tr-m90", at(4, 0.0)); OUT("#tr-pie1", at(4, 0.0)); OUT("#tr-lab95", at(4, 0.0));
      IN("#tr-pie2", at(4, 0.08), 0.8, { scale: 0.6, svgOrigin: "960 460" }, { scale: 1, svgOrigin: "960 460" });
      IN("#tr-lab2", at(4, 0.18));
      IN("#tr-run", at(4, 0.42));
      IN("#tr-hl", at(4, 0.55)); IN("#tr-rl", at(4, 0.64));
      tl.to("#tr-pie2", { scale: 1.06, svgOrigin: "960 460", duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, at(4, 0.58));
      IN("#tr-term", at(4, 0.82), 0.5);
      tl.to("#tr-hl", { fillOpacity: 0.5, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, at(4, 0.7));
      // L5 算一算：100 万 × 24 = 2400 万
      IN("#tr-f", at(5, 0.05));
      OUT("#tr-term", at(5, 0.4));
      for (let i = 0; i < 24; i++) IN(`#tr-c${i}`, at(5, 0.3) + i * 0.16, 0.2);
      // L6 多链看板
      OUT("#tr-safe", at(6, 0.0)); OUT("#tr-pie2", at(6, 0.0)); OUT("#tr-lab2", at(6, 0.0)); OUT("#tr-f", at(6, 0.0));
      IN("#tr-src", at(6, 0.08));
      IN("#tr-dash", at(6, 0.2));
      ARROW("#tr-s1", at(6, 0.26)); ARROW("#tr-s2", at(6, 0.3)); ARROW("#tr-s3", at(6, 0.34)); ARROW("#tr-s4", at(6, 0.38));
      IN("#tr-rows", at(6, 0.48));
      IN("#tr-wk", at(6, 0.6));
      ARROW("#tr-link", at(6, 0.75));
