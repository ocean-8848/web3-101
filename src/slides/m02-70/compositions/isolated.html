  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

for (let k = 0; k < 2; k++) {
  const t = at(3, 0.62) + k * 0.9;
  tl.fromTo("#is-rpL", { opacity: 1, x: 0 }, { x: -136, duration: 0.6, ease: "power1.out", immediateRender: false }, t);

  tl.to("#is-pr1", { strokeWidth: 8, duration: 0.12, yoyo: true, repeat: 1 }, t + 0.55);

// L4 curator on top layer
OUT("#is-ok", at(4, 0), 0.3);
IN("#is-cur", at(4, 0.08), 0.5, { y: -20 }, { y: 0 });
IN("#is-curl", at(4, 0.12), 0.4);
DRAW("#is-cl0", at(4, 0.3), 0.6); DRAW("#is-cl1", at(4, 0.36), 0.6);
IN("#is-q", at(4, 0.45), 0.5); IN("#is-q2", at(4, 0.72), 0.5);

tl.to("#is-cl0, #is-cl1", { strokeWidth: 7, duration: 1.0, yoyo: true, repeat: 1 }, at(4, 0.68));

for (let i = 0; i < 4; i++) IN(`#is-tr${i}`, at(5, 0.2) + i * 0.08, 0.5, { x: -60 }, { x: 0 });
const tg = at(5, 0.3);
for (let i = 0; i < 4; i++) if (i !== 2) tl.to(`#is-tr${i}`, { x: 1100 - i * 60, duration: (C.d - 0.6) - tg, ease: "power1.inOut" }, tg);
tl.to("#is-tr2", { x: 760, duration: at(5, 0.78) - tg, ease: "power1.in" }, tg);
tl.to("#is-tri2", { rotation: 16, svgOrigin: "550 712", duration: 0.5, ease: "power2.in" }, at(5, 0.78));
tl.to("#is-tr2", { y: 30, duration: 0.5, ease: "power2.in" }, at(5, 0.78));

/*ENDANIM*/

      tl.to("#is-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
