    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/

// L0 institutions need working capital
for (let i = 0; i < 3; i++) IN(`#cr-i${i}`, at(0, 0.05) + i * 0.15, 0.5, { y: 20 }, { y: 0 });
IN("#cr-need", at(0, 0.6), 0.5, { y: 10 }, { y: 0 });
// L1 term + collateral ratio scale
IN("#cr-term", at(1, 0.02), 0.5);
IN("#cr-sc", at(1, 0.08), 0.6);
IN("#cr-bb", at(1, 0.22), 0.5, { scaleX: 0, svgOrigin: "1624 520" }, { scaleX: 1, svgOrigin: "1624 520" });
IN("#cr-bbl", at(1, 0.26), 0.4);
for (let i = 0; i < 3; i++) tl.to(`#cr-i${i}`, { y: -12, duration: 0.25, yoyo: true, repeat: 1 }, at(1, 0.5) + i * 0.12);
IN("#cr-bg", at(1, 0.72), 0.5, { scaleX: 0, svgOrigin: "1000 520" }, { scaleX: 1, svgOrigin: "1000 520" });
IN("#cr-bgl", at(1, 0.76), 0.4);
ARROW("#cr-link", at(1, 0.4), 0.8);
tl.to("#cr-bb", { fillOpacity: 0.7, duration: 0.5, yoyo: true, repeat: 1 }, at(1, 0.38));
tl.to("#cr-need", { scale: 1.12, svgOrigin: "440 400", duration: 0.5, yoyo: true, repeat: 1 }, at(1, 0.6));
OUT("#cr-term", at(1, 0.02) + 7.4, 0.4);
// L2 calc: borrow 1M, lock 1.5M
OUT("#cr-link, #cr-sc, #cr-bb, #cr-bbl, #cr-bg, #cr-bgl", at(2, 0), 0.4);
IN("#cr-ex", at(2, 0.08), 0.4);
IN("#cr-b1, #cr-b1l", at(2, 0.15), 0.3);
tl.fromTo("#cr-b1", { attr: { y: 880, height: 0 } }, { attr: { y: 580, height: 300 }, duration: 0.9, ease: "power2.out", immediateRender: false }, at(2, 0.15));
IN("#cr-b2, #cr-b2l", at(2, 0.35), 0.3);
tl.fromTo("#cr-b2", { attr: { y: 880, height: 0 } }, { attr: { y: 430, height: 450 }, duration: 1.1, ease: "power2.out", immediateRender: false }, at(2, 0.35));
IN("#cr-f", at(2, 0.45), 0.5);
DRAW("#cr-brk", at(2, 0.58), 0.5); IN("#cr-brl", at(2, 0.62), 0.4);
IN("#cr-bad", at(2, 0.82), 0.4);
// L3 hybrid bridge
tl.to("#cr-left, #cr-calc", { opacity: 0, duration: 0.4 }, at(3, 0));
IN("#cr-tgMaple", at(3, 0.05), 0.4); IN("#cr-tgClearpool", at(3, 0.12), 0.4); IN("#cr-tgGoldfinch", at(3, 0.19), 0.4);
IN("#cr-pier", at(3, 0.28), 0.5);
IN("#cr-up", at(3, 0.38), 0.5, { y: -20 }, { y: 0 });
IN("#cr-lo", at(3, 0.48), 0.5, { y: 20 }, { y: 0 });
IN("#cr-tex", at(3, 0.62), 0.4);
tl.to("#cr-tgMaple", { opacity: 0.4, duration: 0.35, yoyo: true, repeat: 3 }, at(3, 0.75));
// L4 table row 1: admission
tl.to("#cr-bridge", { opacity: 0, duration: 0.4 }, at(4, 0));
IN("#cr-frame", at(4, 0.04), 0.6);
IN("#cr-n1", at(4, 0.1), 0.4);
IN("#cr-r1l", at(4, 0.25), 0.4, { x: -15 }, { x: 0 });
IN("#cr-r1a", at(4, 0.5), 0.4, { x: -15 }, { x: 0 });
IN("#cr-hl1", at(4, 0.66), 0.5);
IN("#cr-r1b", at(4, 0.8), 0.4, { x: -15 }, { x: 0 });
// L5 row 2: who manages risk
IN("#cr-n2", at(5, 0.02), 0.4);
IN("#cr-r2l", at(5, 0.15), 0.4, { x: -15 }, { x: 0 }); IN("#cr-gear", at(5, 0.2), 0.4);
tl.to("#cr-gear", { rotation: 180, svgOrigin: "1040 620", duration: 2, ease: "none" }, at(5, 0.22));
IN("#cr-r2a", at(5, 0.45), 0.4, { x: -15 }, { x: 0 }); IN("#cr-pd", at(5, 0.5), 0.4);
