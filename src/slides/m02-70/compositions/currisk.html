    (function () {
      const C = /*CUES*/{}/*END*/;

      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/

// L0 recall: the steal path is blocked

IN("#ck-wall, #ck-walll", at(0, 0.05), 0.4);
IN("#ck-steal", at(0, 0.15), 0.2);
tl.fromTo("#ck-steal", { strokeDashoffset: 0 }, { strokeDashoffset: -54, duration: 0.9, ease: "none", immediateRender: false }, at(0, 0.15));
OUT("#ck-steal", at(0, 0.15) + 0.9, 0.15);
const sh = [[-30, -50], [-10, 60], [-40, 20]];
for (let i = 0; i < 3; i++) tl.fromTo(`#ck-sh${i}`, { opacity: 1, x: 0, y: 0 }, { x: sh[i][0], y: sh[i][1], opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, at(0, 0.15) + 0.95);
IN("#ck-ok", at(0, 0.55), 0.5, { scale: 0.7, svgOrigin: "1280 405" }, { scale: 1, svgOrigin: "1280 405" });
// L1 the real risk: a bad market
tl.to("#ck-g0", { opacity: 0, duration: 0.4 }, at(1, 0));
IN("#ck-v1, #ck-v1l", at(1, 0.05), 0.4);
IN("#ck-pa", at(1, 0.1), 0.4); IN("#ck-px", at(1, 0.15), 0.4);
ARROW("#ck-aa", at(1, 0.22), 0.6);
IN("#ck-xl0", at(1, 0.45), 0.4); IN("#ck-xl1", at(1, 0.6), 0.4);
ARROW("#ck-ax", at(1, 0.3), 0.6);
for (let k = 0; k < 3; k++) for (let i = 0; i < 3; i++) {
  const t = at(1, 0.4) + k * 1.3 + i * 0.35;
  tl.fromTo(`#ck-cx${i}`, { opacity: 1, x: 0, y: 0 }, { x: 205, y: 190, duration: 0.9, ease: "power1.in", immediateRender: false }, t);
  tl.to(`#ck-cx${i}`, { opacity: 0, duration: 0.1 }, t + 0.9);
}
tl.to("#ck-pxr", { stroke: "#FF9F43", strokeWidth: 6, duration: 0.6, yoyo: true, repeat: 1 }, at(1, 0.74));
tl.to("#ck-ax", { strokeWidth: 14, duration: 0.6, yoyo: true, repeat: 1 }, at(1, 0.88));
// L2 bad debt + redemption queue
tl.to("#ck-pxr", { stroke: "#FC6255", fill: "#3a1a18", duration: 0.4 }, at(2, 0.05));
IN("#ck-bad", at(2, 0.08), 0.3);
for (let i = 0; i < 4; i++) IN(`#ck-q${i}`, at(2, 0.3) + i * 0.08, 0.3, { x: -20 }, { x: 0 });
IN("#ck-btn, #ck-btnl", at(2, 0.35), 0.4);
tl.to("#ck-btn", { fill: "#8a8f99", stroke: "#8a8f99", duration: 0.3 }, at(2, 0.62));
OUT("#ck-btnl", at(2, 0.62), 0.2); IN("#ck-btnq", at(2, 0.66), 0.3);
IN("#ck-hg", at(2, 0.66), 0.3);
tl.to("#ck-hgi", { rotation: 180, svgOrigin: "600 390", duration: 0.6, repeat: 3, repeatDelay: 0.3 }, at(2, 0.7));
// L3 metaphor limit
tl.to("#ck-g1", { opacity: 0, duration: 0.4 }, at(3, 0));
IN("#ck-lim", at(3, 0.05), 0.5); IN("#ck-rail", at(3, 0.08), 0.5);
IN("#ck-tr", at(3, 0.15), 0.4, { x: -40 }, { x: 0 });
tl.to("#ck-tr", { x: 920, duration: at(3, 0.75) - at(3, 0.25), ease: "power1.in" }, at(3, 0.25));
tl.to("#ck-tri", { rotation: 22, svgOrigin: "560 632", duration: 0.5, ease: "power2.in" }, at(3, 0.75));
tl.to("#ck-tr", { y: 40, duration: 0.5, ease: "power2.in" }, at(3, 0.75));
tl.to("#ck-trr", { stroke: "#FC6255", fill: "#3a1a18", duration: 0.3 }, at(3, 0.78));
tl.to("#ck-trt", { fill: "#FC6255", duration: 0.3 }, at(3, 0.78));
// L4 timelock axis
tl.to("#ck-g3", { opacity: 0, duration: 0.4 }, at(4, 0));
