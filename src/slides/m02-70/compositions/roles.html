        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      IN("#ro-5m", at(1, 0.2));
      IN("#ro-wal", at(1, 0.24));
      IN("#ro-bad", at(1, 0.55), 0.5, { x: 30 }, { x: 0 });

      IN("#ro-card", at(3, 0.6), 0.6, { y: -120 }, { y: 0 });
      OUT("#ro-term", at(3, 0.65));
      // L4 三层检查
      IN("#ro-tx", at(4, 0.04));
      tl.to("#ro-tx", { y: -100, duration: 0.7, ease: "power2.out" }, at(4, 0.14));
