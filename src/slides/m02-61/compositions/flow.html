    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 state chain
      IN("#fl-old", at(0, 0.02), 0.5);
      [0, 1, 2, 3, 4].forEach(i => { IN(`#fl-s${i}`, at(0, 0.08 + i * 0.1), 0.4); if (i < 4) IN(`#fl-r${i}`, at(0, 0.13 + i * 0.1), 0.3); });
      [0, 1, 2, 3, 4].forEach(i => { tl.to(`#fl-s${i}`, { fill: "#e8e6df", duration: 0.3 }, at(0, 0.62 + i * 0.05)); tl.to(`#fl-s${i}`, { fill: "#8a8f99", duration: 0.3 }, at(0, 0.67 + i * 0.05)); });
      IN("#fl-lanes", at(0, 0.88), 0.6);
      // L1 propose + delay
      ARROW("#fl-p", at(1, 0.05), 0.6);
      IN("#fl-pl", at(1, 0.08), 0.4);
      IN("#fl-pa", at(1, 0.3), 0.5);
      tl.to("#fl-s0", { fill: "#58C4DD", duration: 0.3 }, at(1, 0.1));
      IN("#fl-vd", at(1, 0.7), 0.4, { scaleY: 0, svgOrigin: "600 425" }, { scaleY: 1, svgOrigin: "600 425" });
      IN("#fl-vdl", at(1, 0.72), 0.4);
      // L2 vote
      tl.to("#fl-s0", { fill: "#8a8f99", duration: 0.3 }, at(2, 0.02)); tl.to("#fl-s1", { fill: "#58C4DD", duration: 0.3 }, at(2, 0.02));
      ARROW("#fl-v", at(2, 0.04), 0.6);
      IN("#fl-vl", at(2, 0.08), 0.4);
      IN("#fl-b0", at(2, 0.3), 0.3); IN("#fl-b1", at(2, 0.42), 0.3); IN("#fl-b2", at(2, 0.54), 0.3);
      IN("#fl-vp", at(2, 0.7), 0.4, { scaleY: 0, svgOrigin: "600 615" }, { scaleY: 1, svgOrigin: "600 615" });
      IN("#fl-vpl", at(2, 0.72), 0.4);
      tl.to("#fl-s1", { fill: "#8a8f99", duration: 0.3 }, at(2, 0.85)); tl.to("#fl-s2", { fill: "#83C167", duration: 0.3 }, at(2, 0.85));
      // L3 queue / execute
      tl.to("#fl-s2", { fill: "#8a8f99", duration: 0.3 }, at(3, 0.05)); tl.to("#fl-s3", { fill: "#FF9F43", duration: 0.3 }, at(3, 0.05));
      ARROW("#fl-q", at(3, 0.02), 0.4); IN("#fl-ql", at(3, 0.04), 0.3);
      ARROW("#fl-sb", at(3, 0.14), 0.6); IN("#fl-sbl", at(3, 0.18), 0.4);
      IN("#fl-md", at(3, 0.32), 0.4, { scaleY: 0, svgOrigin: "1400 790" }, { scaleY: 1, svgOrigin: "1400 790" }); IN("#fl-mdl", at(3, 0.34), 0.4);
      ARROW("#fl-e", at(3, 0.5), 0.4); IN("#fl-el", at(3, 0.52), 0.3);
      ARROW("#fl-eb", at(3, 0.6), 0.6); IN("#fl-ebl", at(3, 0.63), 0.4);
      tl.to("#fl-s3", { fill: "#8a8f99", duration: 0.3 }, at(3, 0.75)); tl.to("#fl-s4", { fill: "#83C167", duration: 0.3 }, at(3, 0.75));
