  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 two contracts
      IN("#ro-gov", at(0, 0.3), 0.6, { x: -30 }, { x: 0 });
      IN("#ro-tlb", at(0, 0.62), 0.6, { x: 30 }, { x: 0 });
      // L1 timelock term + countdown + executor
      IN("#ro-term", at(1, 0.02), 0.5);
      IN("#ro-cd", at(1, 0.2), 0.4);
      tl.fromTo("#ro-cdf", { attr: { width: 560 } }, { attr: { width: 24 }, duration: 3, ease: "none", immediateRender: false }, at(1, 0.25));
      ARROW("#ro-ex", at(1, 0.68), 0.6);
      IN("#ro-exl", at(1, 0.74), 0.5);
      OUT("#ro-term", at(1, 0.8), 0.4);
      // L2 assets fly into the timelock
      ["#ro-g0", "#ro-g1", "#ro-g2"].forEach((s, i) => {
        const t = at(2, 0.08 + i * 0.2);
        tl.fromTo(s, { opacity: 0, x: -900, y: -20 }, { opacity: 1, x: -900, y: 0, duration: 0.4, ease: "power2.out" }, t);
        tl.to(s, { x: 0, duration: 0.8, ease: "power2.inOut" }, t + 0.55);
      });
      IN("#ro-no", at(2, 0.78), 0.5);
      // L3 role table
      OUT("#ro-top", at(3, 0), 0.5);
      IN("#ro-tt", at(3, 0.08), 0.5);
      IN("#ro-r0", at(3, 0.2), 0.5, { y: 16 }, { y: 0 });
      IN("#ro-bad", at(3, 0.66), 0.5, { x: -20 }, { x: 0 });
      // L4 canceller, executor
      IN("#ro-r1", at(4, 0.05), 0.5, { y: 16 }, { y: 0 });
      tl.to("#ro-r1 rect", { stroke: "#B48EF0", duration: 0.4 }, at(4, 0.3));
      IN("#ro-r2", at(4, 0.6), 0.5, { y: 16 }, { y: 0 });
      // L5 admin, crown off
      IN("#ro-r3", at(5, 0.05), 0.5, { y: 16 }, { y: 0 });
      IN("#ro-crown", at(5, 0.15), 0.4);
      tl.to("#ro-crown", { y: -40, opacity: 0, fill: "#83C167", duration: 0.8, ease: "power2.in" }, at(5, 0.7));
      IN("#ro-done", at(5, 0.78), 0.4);
      // L6 compact list + code panel
      OUT("#ro-tab", at(6, 0), 0.4);
      IN("#ro-mini", at(6, 0.06), 0.5);
      IN("#ro-code", at(6, 0.1), 0.6, { x: 30 }, { x: 0 });
      const HLY = [308, 368, 428, 488, 548, 608];
      tl.to("#ro-hl", { attr: { y: HLY[1] }, duration: 0.3 }, at(6, 0.3));
      tl.to("#ro-hl", { attr: { y: HLY[2] }, duration: 0.3 }, at(6, 0.4));
      tl.to("#ro-hl", { attr: { y: HLY[3] }, duration: 0.3 }, at(6, 0.47));
      tl.to("#ro-hl", { attr: { y: HLY[4] }, duration: 0.3 }, at(6, 0.54));
      tl.to("#ro-hl", { attr: { y: HLY[5] }, duration: 0.3 }, at(6, 0.62));
      IN("#ro-ob", at(6, 0.78), 0.4);
      IN("#ro-obl", at(6, 0.82), 0.5);

      tl.to("#ro-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ro-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["roles"] = tl;
    })();
