    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 wallet + delegatee with 0 votes
      IN("#de-erc", at(0, 0.1), 0.5);
      IN("#de-w", at(0, 0.25), 0.6, { x: -20 }, { x: 0 });
      IN("#de-d", at(0, 0.5), 0.6, { x: 20 }, { x: 0 });
      IN("#de-n", at(0, 0.6), 0.4);
      // L1 delegation term
      IN("#de-term", at(1, 0.02), 0.5);
      IN("#de-line", at(1, 0.15), 0.5);
      tl.fromTo("#de-line", { strokeDashoffset: 0 }, { strokeDashoffset: -52, duration: 2, ease: "none", immediateRender: false }, at(1, 0.15));
      tl.to("#de-dr", { stroke: "#F0B90B", duration: 0.3 }, at(1, 0.3));
      COUNT("#de-n", 0, 3, at(1, 0.3), 0.8);
      ARROW("#de-self", at(1, 0.5), 0.6);
      IN("#de-selfl", at(1, 0.55), 0.4);
      IN("#de-stay", at(1, 0.8), 0.5);
      // L2 most wallets undelegated, few delegates
      OUT("#de-term", at(2, 0), 0.4);
      OUT("#de-one", at(2, 0), 0.4);
      IN("#de-grid", at(2, 0.05), 0.6);
      IN("#de-zero", at(2, 0.18), 0.5);
      IN("#de-dels", at(2, 0.4), 0.6, { scale: 0.6, svgOrigin: "1450 580" }, { scale: 1, svgOrigin: "1450 580" });
      DRAW("#de-lines path", at(2, 0.48), 1.2);
      IN("#de-dl", at(2, 0.55), 0.5);
      IN("#de-dl2", at(2, 0.78), 0.5);
      // L3 quorum term + bar
      OUT("#de-two", at(3, 0), 0.4);
      IN("#de-term2", at(3, 0.05), 0.5);
      IN("#de-bar", at(3, 0.35), 0.5);
      IN("#de-q", at(3, 0.55), 0.5, { x: -20 }, { x: 0 });
      // L4 apathy
      OUT("#de-term2", at(4, 0.08), 0.4);
      IN("#de-h0, #de-h1", at(4, 0.12), 0.4);
      IN("#de-t0", at(4, 0.15), 0.5, { y: 14 }, { y: 0 });
      tl.to("#de-bar", { opacity: 0.6, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.4));
      // L5 too low / too high
      IN("#de-t1", at(5, 0.03), 0.5, { y: 14 }, { y: 0 });
      tl.to("#de-q", { y: 200, duration: 0.7, ease: "power2.inOut" }, at(5, 0.08));
      tl.to("#de-ql", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.12));
      tl.to("#de-q", { y: 0, duration: 0.7, ease: "power2.inOut" }, at(5, 0.36));
      tl.to("#de-ql", { stroke: "#FF9F43", duration: 0.3 }, at(5, 0.4));
      IN("#de-t2", at(5, 0.5), 0.5, { y: 14 }, { y: 0 });
      tl.to("#de-q", { y: -140, duration: 0.7, ease: "power2.inOut" }, at(5, 0.56));
      IN("#de-abs", at(5, 0.8), 0.6, { scaleY: 0, svgOrigin: "1620 600" }, { scaleY: 1, svgOrigin: "1620 600" });
      IN("#de-absl", at(5, 0.84), 0.4);
      // L6 exchange
      IN("#de-t3", at(6, 0.03), 0.5, { y: 14 }, { y: 0 });
      IN("#de-ex", at(6, 0.3), 0.5);
      IN("#de-exi", at(6, 0.35), 0.5);
      tl.to("#de-t3 rect", { stroke: "#B48EF0", duration: 0.4 }, at(6, 0.6));

      tl.to("#de-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#de-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["delegate"] = tl;
    })();
