      IN("#ti-eth", at(0, 0.68), 0.5);
      IN("#ti-b2", at(0, 0.88), 0.4);
      // L1 voting delay = 1 day
      tl.to("#ti-g0", { attr: { y: 512, height: 56 }, duration: 0.3 }, at(1, 0.02));
      IN("#ti-f1", at(1, 0.05), 0.4);
      FO("#ti-f1b", at(1, 0.4)); FO("#ti-f1c", at(1, 0.75));
      tl.to("#ti-g0", { attr: { y: 520, height: 40 }, duration: 0.3 }, at(1, 0.95));
      // L2 voting period = 7 days, rescale axis 1:7:2

      tl.to("#ti-g0", { attr: { width: 156 }, duration: 0.9, ease }, RS);
      tl.to("#ti-g1", { attr: { x: 320, width: 1116 }, duration: 0.9, ease }, RS);
      tl.to("#ti-g2", { attr: { x: 1440, width: 320 }, duration: 0.9, ease }, RS);

      tl.to("#ti-n1, #ti-b1", { attr: { x: 878 }, duration: 0.9, ease }, RS);
      tl.to("#ti-n2, #ti-b2", { attr: { x: 1600 }, duration: 0.9, ease }, RS);
      IN("#ti-f2", at(2, 0.2), 0.4);
      FO("#ti-f2b", at(2, 0.5)); FO("#ti-f2c", at(2, 0.8));
      // L3 + 2 days = 10 days, safety multisig
      IN("#ti-f3", at(3, 0.05), 0.4, { y: 10 }, { y: 0 });
      IN("#ti-tot", at(3, 0.2), 0.6, { scale: 0.8, svgOrigin: "960 770" }, { scale: 1, svgOrigin: "960 770" });
      IN("#ti-sh", at(3, 0.7), 0.5, { x: 20 }, { x: 0 });
      // L4 L2 with copied block numbers

      tl.to("#ti-ax1", { y: -250, duration: 0.7, ease: "power2.inOut" }, at(4, 0.05));
      IN("#ti-l2", at(4, 0.15), 0.4);
      [0, 1, 2].forEach(i => IN(`#ti-h${i}`, at(4, 0.25), 0.6, { scaleX: 0, svgOrigin: "160 520" }, { scaleX: 1, svgOrigin: "160 520" }));
      IN("#ti-hf", at(4, 0.5), 0.5);
      IN("#ti-short", at(4, 0.78), 0.4, { scale: 1.4, svgOrigin: "866 598" }, { scale: 1, svgOrigin: "866 598" });
      // L5 0.25 s chain

      [0, 1, 2].forEach(i => IN(`#ti-j${i}`, at(5, 0.12), 0.6, { scaleX: 0, svgOrigin: "160 740" }, { scaleX: 1, svgOrigin: "160 740" }));

      // L6 timestamp clock

      IN("#ti-clk", at(6, 0.12), 0.6, { scale: 0.7, svgOrigin: "960 460" }, { scale: 1, svgOrigin: "960 460" });
      tl.fromTo("#ti-hand", { rotation: 0, svgOrigin: "960 460" }, { rotation: 360, svgOrigin: "960 460", duration: 5, ease: "none", immediateRender: false }, at(6, 0.2));
      IN("#ti-ts", at(6, 0.3), 0.6);
      IN("#ti-erc", at(6, 0.55), 0.5);

      tl.to("#ti-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
