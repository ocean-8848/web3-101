      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const TO = (s, t, v, d = 0.5) => tl.to(s, { duration: d, ease: "power2.out", ...v }, t);
      const PULSE = (s, t, d = 0.35) => tl.to(s, { opacity: 0.4, duration: d, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const HL = (i, t) => {
        const xs = [0, 341, 601, 901, 1161, 1391], ws = [0, 228, 268, 228, 198, 308];
        tl.to("#b4-hl", { attr: { x: xs[i], width: ws[i] }, duration: 0.5, ease: "power2.inOut" }, t);
      };
      // L0 五格路径
      IN("#b4-term", at(0, 0.0), 0.5);
      IN("#b4-c0", at(0, 0.08));
      ["#b4-c1", "#b4-c2", "#b4-c3", "#b4-c4", "#b4-c5"].forEach((s, k) => IN(s, at(0, 0.2 + k * 0.13), 0.5, { y: -14 }, { y: 0 }));

      PULSE(["#b4-r1", "#b4-r2", "#b4-r3"], at(0, 0.88));

      OUT("#b4-term", at(1, 0), 0.4);

      IN("#b4-d1s", at(1, 0.55));
      // L2 SLIP-44
      IN("#b4-term2", at(2, 0.0), 0.5);
      HL(2, at(2, 0.04));
      OUT(["#b4-d1", "#b4-d1s"], at(2, 0.0), 0.4);
      gsap.utils.toArray(".b4-cn").forEach((e, k) => tl.fromTo(e, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, at(2, [0.35, 0.45, 0.55, 0.667, 0.817][k])));

      OUT("#b4-term2", at(3, 0), 0.4);
      HL(3, at(3, 0.02));
      OUT(".b4-cn", at(3, 0.0), 0.4);
      tl.fromTo(".b4-fd", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.8 }, at(3, 0.15));
      PULSE("#b4-r3", at(3, 0.85));
      // L4 change + address_index
      HL(4, at(4, 0.02));
      OUT(".b4-fd", at(4, 0.0), 0.4);
      IN("#b4-ch0", at(4, 0.08), 0.5, { x: -20 }, { x: 0 });
      IN("#b4-ch1", at(4, 0.22), 0.5, { x: -20 }, { x: 0 });
      IN("#b4-eth", at(4, 0.38)); DRAW("#b4-ethl", at(4, 0.42), 0.5); IN("#b4-ethl", at(4, 0.42), 0.1);
      HL(5, at(4, 0.6));
      tl.fromTo(".b4-ix", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.35 }, at(4, 0.66));
      ARROW("#b4-up", at(4, 0.8)); IN("#b4-upt", at(4, 0.86));
      // L5 两个钱包两条路径
      OUT("#b4-d4", at(5, 0), 0.4); OUT("#b4-hl", at(5, 0), 0.4);
      IN("#b4-wa", at(5, 0.06), 0.6, { x: -20 }, { x: 0 });
      COUNT("#b4-wan", 0, 3, at(5, 0.24), 2.4, v => String(Math.floor(v)));
      PULSE("#b4-r5", at(5, 0.24), 0.5);
      IN("#b4-wb", at(5, 0.58), 0.6, { x: -20 }, { x: 0 });
      COUNT("#b4-wbn", 0, 3, at(5, 0.72), 2.4, v => String(Math.floor(v)));
      PULSE("#b4-r3", at(5, 0.72), 0.5);
      IN("#b4-note", at(5, 0.4));
      // L6 Solana
      IN("#b4-ws", at(6, 0.05), 0.6, { x: -20 }, { x: 0 });
      IN("#b4-wst", at(6, 0.35));
      PULSE("#b4-ws", at(6, 0.6), 0.4);
      PULSE(["#b4-r1", "#b4-r2", "#b4-r3"], at(6, 0.84));
      // L7 换对路径，余额回来
      OUT(["#b4-d5", "#b4-bar"], at(7, 0), 0.4);
      IN("#b4-ph", at(7, 0.06)); IN("#b4-zero", at(7, 0.1));
      PULSE("#b4-zero", at(7, 0.18), 0.25);
      IN("#b4-kp", at(7, 0.16)); IN("#b4-kp1", at(7, 0.18));
      IN("#b4-why", at(7, 0.26)); IN("#b4-why2", at(7, 0.34));
