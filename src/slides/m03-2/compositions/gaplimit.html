      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);

      const TO = (s, t, v, d = 0.5) => tl.to(s, { duration: d, ease: "power2.out", ...v }, t);
      const PULSE = (s, t, d = 0.35) => tl.to(s, { opacity: 0.4, duration: d, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);

      TO("#ga-bar", at(1, 0.6), { attr: { width: 120 } }, 0.8);
      IN("#ga-lost", at(1, 0.76), 0.4, { y: 10 }, { y: 0 });
      // L2 钱还在，按记录扫
      OUT(["#ga-lost", "#ga-stop"], at(2, 0), 0.3);
      tl.to(".ga-far", { opacity: 1, duration: 0.4, stagger: 0.08 }, at(2, 0.05));
      IN("#ga-db", at(2, 0.3)); IN("#ga-dbt", at(2, 0.36));
      TO("#ga-curp", at(2, 0.52), { attr: { fill: "#83C167" } }, 0.3);
      tl.to("#ga-cur", { x: 1612, duration: 1.0, ease: "power1.inOut" }, at(2, 0.55));
      TO("#ga-bar", at(2, 0.66), { attr: { width: 500 } }, 0.8);
      IN("#ga-ok", at(2, 0.78));
      // L3 上线清单
      OUT("#ga-s1", at(3, 0), 0.5);
      IN("#ga-ct", at(3, 0.03));
      const tk = (k, f, g = 0.06) => { IN(gsap.utils.toArray(".ga-box")[k], at(3, f), 0.3); IN("#ga-it" + k, at(3, f), 0.5, { x: -16 }, { x: 0 }); ARROW("#ga-tk" + k, at(3, f + g), 0.4); };
      tk(0, 0.06); tk(1, 0.22); tk(2, 0.35); tk(3, 0.48); tk(4, 0.58); tk(5, 0.7, 0.18);
      PULSE("#ga-it5", at(3, 0.8));
      // L4 离线动手
      OUT("#ga-s2", at(4, 0), 0.5);
      IN("#ga-lap", at(4, 0.06), 0.6, { y: 20 }, { y: 0 });
      IN("#ga-wifi", at(4, 0.22)); IN("#ga-src", at(4, 0.3));
      IN("#ga-mn", at(4, 0.4), 0.6, { x: -12 }, { x: 0 });
      IN("#ga-coin", at(4, 0.66));
      PULSE("#ga-mn", at(4, 0.84));
      // L5 第一个地址 + passphrase 改变全部
