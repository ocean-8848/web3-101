  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const PULSE = (s, t) => tl.to(s, { opacity: 0.4, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      const X = [400, 680, 960, 1240, 1520];
      // L0 L1 + L2s
      IN("#l2-l1", at(0, 0.03), 0.6, { y: 20 }, { y: 0 });
      for (let i = 0; i < 5; i++) { IN(`#l2-c${i}`, at(0, 0.2) + i * 0.25, 0.5, { y: -30 }, { y: 0 }); DRAW(`#l2-s${i}`, at(0, 0.3) + i * 0.25, 0.5); }
      PULSE("#l2-l1", at(0, 0.62)); PULSE("#l2-c0, #l2-c1, #l2-c2, #l2-c3, #l2-c4", at(0, 0.88));
      // L1 cluster capsules
      IN("#l2-k0", at(1, 0.1), 0.5); IN("#l2-k1", at(1, 0.4), 0.5); IN("#l2-k2", at(1, 0.7), 0.5);
      // L2 shared bridge vault + fast arrows
      IN("#l2-vault, #l2-vl", at(2, 0.05), 0.6);
      for (let i = 0; i < 5; i++) IN(`#l2-g${i}`, at(2, 0.15) + i * 0.12, 0.4);
      for (let i = 0; i < 4; i++) ARROW(`#l2-h${i}`, at(2, 0.45) + i * 0.15, 0.4);
      IN("#l2-fast", at(2, 0.6), 0.5);
      // L3 status: OP interop not on mainnet, Base leaving OP Stack
      IN("#l2-op", at(3, 0.04), 0.5, { y: -14 }, { y: 0 });
      tl.to("#l2-k0 rect", { stroke: "#FF9F43", duration: 0.4 }, at(3, 0.1));
      PULSE("#l2-k0", at(3, 0.12));
      PULSE("#l2-op", at(3, 0.5));
      OUT("#l2-op", at(4, 0.0), 0.4);
      // L4 one chain hacked
      OUT("#l2-k0, #l2-k1, #l2-k2", at(4, 0.0), 0.4);
      OUT("#l2-fast", at(4, 0.0), 0.4);
      tl.to("#l2-cr4", { stroke: "#FC6255", fill: "#3a1a1a", duration: 0.4 }, at(4, 0.25));
      IN("#l2-slip", at(4, 0.62), 0.5, { scale: 0.6, svgOrigin: "1730 430" }, { scale: 1, svgOrigin: "1730 430" });
      // L5 drain
      tl.to("#l2-slip", { y: 140, duration: 0.6, ease: "power2.in" }, at(5, 0.05));
      for (let k = 0; k < 12; k++) {
        const i = k % 4, t0 = at(5, 0.2) + k * 0.12;
        tl.fromTo(`#l2-p${k}`, { opacity: 1, attr: { cx: X[i], cy: 730 } }, { opacity: 0.2, attr: { cx: 1730, cy: 600 }, duration: 0.8, ease: "power1.in", immediateRender: false }, t0);
        tl.set(`#l2-p${k}`, { opacity: 0 }, t0 + 0.8);
      }
      for (let i = 0; i < 4; i++) tl.to(`#l2-g${i}`, { attr: { height: 10, y: 760 }, duration: 1.6, ease: "power1.in" }, at(5, 0.22));
      tl.to("#l2-vr", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.4));
      IN("#l2-drain", at(5, 0.45), 0.5);
      // L6 pessimistic proof
      OUT("#l2-drain", at(6, 0.0), 0.3);
      IN("#l2-term", at(6, 0.03), 0.5);
      tl.to("#l2-vr", { stroke: "#F0B90B", duration: 0.3 }, at(6, 0.1));
      for (let i = 0; i < 4; i++) tl.to(`#l2-g${i}`, { attr: { height: 80, y: 690 }, duration: 0.8, ease: "power2.out" }, at(6, 0.12));
      for (let i = 0; i < 5; i++) IN(`#l2-q${i}`, at(6, 0.18) + i * 0.1, 0.3);
      IN("#l2-shield", at(6, 0.4), 0.5);
      IN("#l2-sh", at(6, 0.42), 0.5, { scale: 0.5, svgOrigin: "140 844" }, { scale: 1, svgOrigin: "140 844" });
      IN("#l2-f", at(6, 0.5), 0.6);
      tl.to("#l2-slip", { y: 0, duration: 0.6, ease: "back.out(2)" }, at(6, 0.75));
      IN("#l2-x", at(6, 0.84), 0.3);
      OUT("#l2-term", at(6, 0.82), 0.4);
      // L7 isolated loss
      OUT("#l2-slip, #l2-x", at(7, 0.0), 0.4);
      tl.to("#l2-q4", { stroke: "#FC6255", duration: 0.4 }, at(7, 0.12));
      tl.to("#l2-g4", { fill: "#FC6255", attr: { height: 20, y: 750 }, duration: 0.8 }, at(7, 0.12));
      PULSE("#l2-q0, #l2-q1, #l2-q2, #l2-q3", at(7, 0.35));
      IN("#l2-off", at(7, 0.55), 0.5);
      PULSE("#l2-shield", at(7, 0.8));


      tl.to("#l2-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#l2-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["l2interop"] = tl;
    })();
