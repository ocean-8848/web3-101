    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const PULSE = (s, t) => tl.to(s, { opacity: 0.4, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      // L0 chains + shuttling USDC
      DRAW("#cc-ring", at(0, 0.02), 1.2);
      IN("#cc-nodes", at(0, 0.05), 0.6);
      const NX = [[300,320],[960,240],[1620,320],[1620,820],[960,900],[300,820]];
      for (let k = 0; k < 6; k++) {
        const a = NX[k], b = NX[(k + 1) % 6], t0 = at(0, 0.15) + k * 0.25;
        IN(`#cc-d${k}`, t0, 0.3);
        tl.fromTo(`#cc-d${k}`, { attr: { cx: a[0], cy: a[1] } }, { attr: { cx: b[0], cy: b[1] }, duration: 1.6, ease: "sine.inOut", repeat: 9, yoyo: true, immediateRender: false }, t0);
      }
      IN("#cc-move", at(0, 0.35), 0.7, { scale: 0.85, svgOrigin: "960 560" }, { scale: 1, svgOrigin: "960 560" });
      // L1 title + term
      OUT("#cc-move", at(1, 0.0), 0.5);
      tl.to("#cc-bg", { opacity: 0.35, duration: 0.6 }, at(1, 0.05));
      OUT("#cc-bg", at(1, 0.9), 0.5);
      IN("#cc-title", at(1, 0.08), 0.7, { y: 20 }, { y: 0 });
      IN("#cc-term", at(1, 0.2), 0.5);
      OUT("#cc-term", at(1, 0.95), 0.4);
      // L2 columns + burn
      IN("#cc-h0", at(2, 0.0), 0.4); IN("#cc-h1", at(2, 0.04), 0.4); IN("#cc-h2", at(2, 0.08), 0.4); IN("#cc-h3", at(2, 0.12), 0.4);
      DRAW("#cc-v0, #cc-v1, #cc-v2, #cc-v3", at(2, 0.12), 0.8);
      ARROW("#cc-a1", at(2, 0.38), 0.6);
      IN("#cc-a1t", at(2, 0.42), 0.4);
      IN("#cc-coin", at(2, 0.5), 0.4, { scale: 0.6, svgOrigin: "820 520" }, { scale: 1, svgOrigin: "820 520" });
      const tb = at(2, 0.66);
      tl.to("#cc-coin", { opacity: 0, duration: 0.6 }, tb);
      const PD = [[-70,-60],[60,-80],[90,-10],[-90,10],[-40,70],[50,60],[0,-100],[110,40]];
      PD.forEach((d, k) => {
        tl.fromTo(`#cc-p${k}`, { opacity: 1, attr: { cx: 820, cy: 520 } }, { opacity: 0, attr: { cx: 820 + d[0], cy: 520 + d[1] }, duration: 1.2, ease: "power2.out", immediateRender: false }, tb + k * 0.03);
      });
      IN("#cc-burn", tb + 0.3, 0.5);
      // L3 finality + attestation
      IN("#cc-fin", at(3, 0.08), 0.5);
      ARROW("#cc-a2", at(3, 0.3), 0.6);
      IN("#cc-stamp", at(3, 0.52), 0.4, { scale: 1.6, svgOrigin: "1262 725" }, { scale: 1, svgOrigin: "1262 725", ease: "back.out(2)" });
      ARROW("#cc-a3", at(3, 0.68), 0.8);
      IN("#cc-a3t", at(3, 0.74), 0.4);
      // L4 relay + mint
      ARROW("#cc-a4", at(4, 0.1), 1.0);
      IN("#cc-a4t", at(4, 0.14), 0.5);
      IN("#cc-rm", at(4, 0.42), 0.5);
      IN("#cc-ok", at(4, 0.56), 0.4);
      IN("#cc-mint", at(4, 0.68), 0.6, { scale: 0.2, svgOrigin: "1750 600" }, { scale: 1, svgOrigin: "1750 600", ease: "back.out(1.8)" });
      IN("#cc-mintt", at(4, 0.78), 0.5);
      // L5 native vs bridged
      OUT("#cc-seq", at(5, 0.0), 0.5);
      IN("#cc-e", at(5, 0.08), 0.5);
      IN("#cc-n", at(5, 0.2), 0.5, { scale: 0.7, svgOrigin: "1260 500" }, { scale: 1, svgOrigin: "1260 500" });
      IN("#cc-no", at(5, 0.32), 0.6);
      tl.to("#cc-ec", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.62));
      IN("#cc-el", at(5, 0.64), 0.4);
      IN("#cc-nl", at(5, 0.74), 0.4);
      // L6 trust
      OUT("#cc-cmp", at(6, 0.0), 0.5);
      IN("#cc-you", at(6, 0.1), 0.4);
      IN("#cc-circle", at(6, 0.18), 0.5);
      ARROW("#cc-ta", at(6, 0.3), 0.6);
      IN("#cc-tat", at(6, 0.36), 0.4);
      IN("#cc-same", at(6, 0.55), 0.6, { x: -20 }, { x: 0 });
      // L7 speeds
      OUT("#cc-trust", at(7, 0.0), 0.5);
      IN("#cc-std", at(7, 0.03), 0.4);
      IN("#cc-sb", at(7, 0.04), 0.1);
      tl.fromTo("#cc-sb", { attr: { width: 0 } }, { attr: { width: 1100 }, duration: 2.2, ease: "power1.inOut", immediateRender: false }, at(7, 0.04));
      IN("#cc-sbt", at(7, 0.16), 0.4);
      IN("#cc-fst", at(7, 0.26), 0.4);
      IN("#cc-fb", at(7, 0.28), 0.1);
      tl.fromTo("#cc-fb", { attr: { width: 0 } }, { attr: { width: 40 }, duration: 0.3, ease: "power2.out", immediateRender: false }, at(7, 0.28));
      IN("#cc-fbt", at(7, 0.3), 0.4);
      tl.fromTo("#cc-fee", { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.4, immediateRender: true }, at(7, 0.4));
      IN("#cc-v1", at(7, 0.58), 0.5, { y: 14 }, { y: 0 });
      IN("#cc-off", at(7, 0.86), 0.5);


      tl.to("#cc-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#cc-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["cctp"] = tl;
    })();
