      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const PULSE = (s, t) => tl.to(s, { opacity: 0.4, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      // L0 title
      IN("#ro-title", at(0, 0.05), 0.7, { scale: 0.85, svgOrigin: "960 130" }, { scale: 1, svgOrigin: "960 130" });
      // L1 axes + intent curve
      ARROW("#ro-ax", at(1, 0.0), 0.6); ARROW("#ro-ay", at(1, 0.06), 0.6);
      IN("#ro-axl, #ro-ayl", at(1, 0.15), 0.4);
      DRAW("#ro-ci", at(1, 0.3), 2.0);
      IN("#ro-cil", at(1, 0.35), 0.5);
      PULSE("#ro-ci", at(1, 0.78));
      // L2 CCTP line
      DRAW("#ro-cc", at(2, 0.05), 1.4);
      IN("#ro-ccl", at(2, 0.2), 0.5);
      PULSE("#ro-cc", at(2, 0.6));
      // L3 crossover
      IN("#ro-x", at(3, 0.04), 0.4, { scale: 2.5, svgOrigin: "1198 619" }, { scale: 1, svgOrigin: "1198 619" });
      IN("#ro-xl", at(3, 0.1), 0.4);
      IN("#ro-lz", at(3, 0.45), 0.5);
      IN("#ro-rz", at(3, 0.7), 0.5);
      IN("#ro-sk", at(3, 0.8), 0.4);
      // L4 example
      OUT("#ro-chart", at(4, 0.0), 0.5);
      IN("#ro-card", at(4, 0.12), 0.6, { y: -20 }, { y: 0 });
      IN("#ro-exl", at(4, 0.3), 0.4);
      // L5 split into small orders, drain inventory, then CCTP
      IN("#ro-sol, #ro-inv", at(5, 0.0), 0.5);
      IN("#ro-sl", at(5, 0.04), 0.4);
      for (let k = 0; k < 6; k++) {
        const t0 = at(5, 0.08) + k * 0.22, x0 = 800 + 60 * k;
        IN(`#ro-q${k}`, t0, 0.15);
        tl.fromTo(`#ro-q${k}`, { attr: { x: x0, y: 380 } }, { attr: { x: 540, y: 560 }, duration: 0.7, ease: "power2.in", immediateRender: false }, t0 + 0.1);
        tl.to(`#ro-q${k}`, { opacity: 0, duration: 0.1 }, t0 + 0.8);
      }
      tl.fromTo("#ro-inv", { attr: { height: 188, y: 546 } }, { attr: { height: 0, y: 734 }, duration: 1.6, ease: "power1.in", immediateRender: false }, at(5, 0.12));
      tl.to("#ro-invb", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.3));
      IN("#ro-empty", at(5, 0.32), 0.4);
      tl.to("#ro-card rect", { stroke: "#58C4DD", duration: 0.4 }, at(5, 0.5));
      ARROW("#ro-ch", at(5, 0.55), 0.9);
      IN("#ro-chl", at(5, 0.6), 0.4);
      IN("#ro-gold", at(5, 0.72), 0.5, { scale: 0.3, svgOrigin: "1440 690" }, { scale: 1, svgOrigin: "1440 690" });

      IN("#ro-box", at(6, 0.08), 0.5);

      IN("#ro-rinl", at(6, 0.2), 0.4);
      ARROW("#ro-r1", at(6, 0.32), 0.4);
      IN("#ro-r1t", at(6, 0.36), 0.4);
      ARROW("#ro-r2", at(6, 0.5), 0.4);
      IN("#ro-r2t", at(6, 0.54), 0.4);
      IN("#ro-thr", at(6, 0.85), 0.4);
      // L7 front + back
      OUT("#ro-rt", at(7, 0.0), 0.4);
      IN("#ro-nu", at(7, 0.06), 0.4); IN("#ro-ns", at(7, 0.1), 0.4);
      ARROW("#ro-s1", at(7, 0.18), 0.5);
      IN("#ro-s1t, #ro-s1b", at(7, 0.22), 0.4);
      IN("#ro-nc", at(7, 0.5), 0.4);
      ARROW("#ro-s2", at(7, 0.58), 0.5);
      IN("#ro-s2t, #ro-s2b", at(7, 0.62), 0.4);


      tl.to("#ro-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);

    })();
