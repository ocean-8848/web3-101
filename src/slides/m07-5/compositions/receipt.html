    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 进度条“等回执”亮；拿着 txHash 轮询
      IN("#re-prog", 0.05, 0.5);
      IN("#re-lanesA", 0.1, 0.5);
      IN("#re-lanesB", 0.1, 0.5);
      tl.to("#re-p4", { attr: { stroke: "#58C4DD", fill: "#13242c" }, duration: 0.5 }, at(0, 0.08));
      tl.to("#re-p4t", { attr: { fill: "#58C4DD" }, duration: 0.5 }, at(0, 0.08));
      IN("#re-tk", at(0, 0.05), 0.6);
      IN("#re-ask", at(0, 0.2), 0.5);
      ARROW("#re-q1", at(0, 0.25), 0.5); OUT("#re-q1", at(0, 0.25) + 0.7, 0.3);
      ARROW("#re-q2", at(0, 0.5), 0.5); OUT("#re-q2", at(0, 0.5) + 0.7, 0.3);
      ARROW("#re-q3", at(0, 0.75), 0.5);
      IN("#re-no1", at(0, 0.25) + 0.45, 0.3); OUT("#re-no1", at(0, 0.5) - 0.2, 0.25);
      IN("#re-no2", at(0, 0.5) + 0.45, 0.3); OUT("#re-no2", at(0, 0.75) - 0.2, 0.25);
      tl.to("#re-tk", { opacity: 0.55, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, at(0, 0.32));

      // L1 区块落链；回执卡三行
      // L1 wagmi：等回执用 useWaitForTransactionReceipt，要看状态
      IN("#re-wg", at(1, 0.05), 0.5, { scale: 0.8, svgOrigin: "1480 92" }, { scale: 1, svgOrigin: "1480 92" });
      IN("#re-wgc", at(1, 0.55), 0.5);

      OUT("#re-q3, #re-ask, #re-lanesA", at(2, 0.0), 0.35);
      IN("#re-chain", at(2, 0.02), 0.4);
      tl.fromTo("#re-blk", { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.6, ease: "bounce.out" }, at(2, 0.06));
      IN("#re-card", at(2, 0.22), 0.6, { scale: 0.8, svgOrigin: "1100 570" }, { scale: 1, svgOrigin: "1100 570" });
      IN("#re-term", at(2, 0.06), 0.5);
      IN("#re-r1", at(2, 0.42), 0.5);
      IN("#re-r2", at(2, 0.58), 0.5);
      IN("#re-r3", at(2, 0.74), 0.5);

      // L2 status 分叉
      DRAW("#re-b1", at(3, 0.05), 0.5);
      IN("#re-ok", at(3, 0.12), 0.5);
      DRAW("#re-b2", at(3, 0.42), 0.5);
      IN("#re-ng", at(3, 0.5), 0.5);
      IN("#re-ngn", at(3, 0.66), 0.5);
      OUT("#re-term", at(3, 0.5), 0.4);

      // L3 revert：状态全部撤销，Gas 不退
      IN("#re-term2", at(4, 0.03), 0.5);
      OUT("#re-chain, #re-blk", at(4, 0.0), 0.4);
      IN("#re-ct", at(4, 0.06), 0.5);
      IN("#re-cells", at(4, 0.06), 0.5);
