  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const fmt = v => Math.round(v).toLocaleString("en-US");
      const GROW = (s, w, t, d = 0.8) => tl.fromTo(s, { attr: { width: 0 } }, { attr: { width: w }, duration: d, ease: "power2.out" }, t);
      // L0 title
      IN("#ga-title", at(0, 0.05), 0.7, { y: 20 }, { y: 0 });
      IN("#ga-ex", at(0, 0.35), 0.5);
      // L1 three gas bars + price
      [[0, 230, 46000, 0.05], [1, 600, 120000, 0.22], [2, 800, 160000, 0.4]].forEach(([k, w, n, f]) => {
        const t = at(1, f);
        IN(`#ga-l${k}`, t, 0.4);
        IN(`#ga-b${k}`, t, 0.1); GROW(`#ga-b${k}`, w, t, 0.9);
        IN(`#ga-v${k}`, t + 0.3, 0.3); COUNT(`#ga-v${k}`, 0, n, t + 0.3, 0.8, fmt);
      });
      IN("#ga-price", at(1, 0.58), 0.4);
      IN("#ga-p0, #ga-p0l", at(1, 0.62), 0.4, { x: -16 }, { x: 0 });
      IN("#ga-p1, #ga-p1l", at(1, 0.74), 0.4, { x: -16 }, { x: 0 });
      DRAW("#ga-pl", at(1, 0.84), 0.4);
      IN("#ga-p2", at(1, 0.88), 0.5, { x: -16 }, { x: 0 });
      // L2 merge approve + deposit, compute two-step
      OUT("#ga-v0, #ga-v1, #ga-l0, #ga-l1", at(2, 0), 0.3);
      tl.to("#ga-b1", { attr: { x: 570, y: 252 }, duration: 0.8, ease: "power2.inOut" }, at(2, 0.04));
      tl.to("#ga-r2", { y: -70, duration: 0.8, ease: "power2.inOut" }, at(2, 0.04));
      IN("#ga-l3", at(2, 0.1), 0.4);
      IN("#ga-v3", at(2, 0.13), 0.3); COUNT("#ga-v3", 0, 166000, at(2, 0.13), 0.8, fmt);
      IN("#ga-h0", at(2, 0.14), 0.4); DRAW("#ga-div", at(2, 0.14), 0.6);
      IN("#ga-c0", at(2, 0.2), 0.5, { x: -20 }, { x: 0 });
      IN("#ga-c1", at(2, 0.38), 0.5, { x: -20 }, { x: 0 });
      tl.to("#ga-p2", { fill: "#ffffff", duration: 0.2, yoyo: true, repeat: 1 }, at(2, 0.38));
      IN("#ga-c2", at(2, 0.55), 0.5, { x: -20 }, { x: 0 });
      IN("#ga-c3", at(2, 0.78), 0.5, { x: -20 }, { x: 0 });
      // L3 permit column
      IN("#ga-h1", at(3, 0.02), 0.4);
      IN("#ga-d0", at(3, 0.1), 0.5, { x: -20 }, { x: 0 });
      IN("#ga-d1", at(3, 0.45), 0.5, { x: -20 }, { x: 0 });
      IN("#ga-d2", at(3, 0.72), 0.5, { x: -20 }, { x: 0 });
      // L4 dollar bars replace gas bars
      OUT("#ga-bars, #ga-price", at(3, 0.88), 0.3);
      IN("#ga-ml0, #ga-ml1", at(3, 0.97), 0.3);
      IN("#ga-m0, #ga-m1", at(3, 0.97), 0.1);
      GROW("#ga-m0", 1046, at(3, 0.97), 0.6); GROW("#ga-m1", 1008, at(3, 0.97), 0.6);
      IN("#ga-mv0, #ga-mv1", at(4, 0.05), 0.3);
      IN("#ga-md", at(4, 0.3), 0.3);
      IN("#ga-mp", at(4, 0.45), 0.4, { x: -16 }, { x: 0 });
      // L5 experience
      IN("#ga-big", at(5, 0.2), 0.6, { y: 16 }, { y: 0 });
      IN("#ga-i0", at(5, 0.55), 0.5, { y: 12 }, { y: 0 });
      IN("#ga-i1", at(5, 0.78), 0.5, { y: 12 }, { y: 0 });

      tl.to("#ga-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["gascalc"] = tl;
    })();
  </script>
