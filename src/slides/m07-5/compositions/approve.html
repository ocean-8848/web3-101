  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 钱包里的 USDC；金库想拿被锁挡住
      IN("#ap-wal", at(0, 0.04), 0.6);
      IN("#ap-coin", at(0, 0.04), 0.6);
      IN("#ap-vault", at(0, 0.2), 0.6);
      ARROW("#ap-reach", at(0, 0.45), 0.9);
      IN("#ap-lock", at(0, 0.6), 0.4, { scale: 1.4, svgOrigin: "906 600" }, { scale: 1, svgOrigin: "906 600", ease: "back.out(2)" });
      IN("#ap-nolab", at(0, 0.7), 0.5);

      // L1 术语卡；approve 单据 → 代币合约账本
      OUT("#ap-reach, #ap-lock, #ap-nolab", at(1, 0.0), 0.35);
      IN("#ap-term", at(1, 0.03), 0.5);
      IN("#ap-tok", at(1, 0.15), 0.5);
      IN("#ap-slip", at(1, 0.3), 0.5, { y: 20 }, { y: 0 });
      ARROW("#ap-slipA", at(1, 0.48), 0.5);
      IN("#ap-ledger", at(1, 0.62), 0.5, { scale: 1.2, svgOrigin: "830 934" }, { scale: 1, svgOrigin: "830 934" });

      // L2 transferFrom，币流向金库；① 授权 ② 操作
      OUT("#ap-term", at(2, 0.05), 0.4);
      ARROW("#ap-tf", at(2, 0.08), 0.7);
      IN("#ap-tfl", at(2, 0.18), 0.4);
      tl.to("#ap-coin", { x: 1200, y: 100, duration: 1.3, ease: "power2.inOut" }, at(2, 0.35));
      IN("#ap-two", at(2, 0.62), 0.5);

      // L3 状态机：读取额度 → 够 / 不够
      OUT("#ap-wal, #ap-coin, #ap-vault, #ap-slip, #ap-slipA, #ap-tok, #ap-ledger, #ap-tf, #ap-tfl, #ap-two", at(3, 0.0), 0.4);
      IN("#ap-sm0", at(3, 0.12), 0.6);
      ARROW("#ap-eOk", at(3, 0.35), 0.5); IN("#ap-lOk", at(3, 0.38), 0.4);
      IN("#ap-nExe", at(3, 0.45), 0.4);
      ARROW("#ap-eNo", at(3, 0.62), 0.5); IN("#ap-lNo", at(3, 0.65), 0.4);
      IN("#ap-nNeed", at(3, 0.72), 0.4);

      // L4 授权签名中 → 授权确认中；拒签回线
      ARROW("#ap-e1", at(4, 0.06), 0.35); IN("#ap-nAs", at(4, 0.1), 0.4);
      ARROW("#ap-e2", at(4, 0.3), 0.35); IN("#ap-nAc", at(4, 0.34), 0.4);
      ARROW("#ap-rj1", at(4, 0.58), 0.6); IN("#ap-lrj1", at(4, 0.64), 0.4);

      // L5 回执成功后重读；按钮文案切换；操作支路补齐
      ARROW("#ap-loop", at(5, 0.03), 1.0); IN("#ap-lloop", at(5, 0.1), 0.4);
      IN("#ap-btn", at(5, 0.24), 0.4); IN("#ap-bt1", at(5, 0.24), 0.4);
      IN("#ap-hl", at(5, 0.24), 0.4);
      OUT("#ap-bt1", at(5, 0.38), 0.25);
      tl.to("#ap-btn", { attr: { fill: "#2c313c" }, duration: 0.3 }, at(5, 0.38));
      tl.to("#ap-hl", { attr: { x: 1192, width: 256 }, duration: 0.5, ease: "power2.inOut" }, at(5, 0.38));
      IN("#ap-bt2", at(5, 0.38) + 0.3, 0.3);
      OUT("#ap-bt2", at(5, 0.54), 0.25);
      tl.to("#ap-btn", { attr: { fill: "#58C4DD" }, duration: 0.3 }, at(5, 0.54));
      tl.to("#ap-hl", { attr: { x: 592, y: 354, width: 216 }, duration: 0.6, ease: "power2.inOut" }, at(5, 0.54));
      IN("#ap-bt3", at(5, 0.54) + 0.3, 0.3);
