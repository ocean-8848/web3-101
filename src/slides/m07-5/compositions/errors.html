        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const ROW = (i, t, h = 80) => tl.to("#er-hl", { attr: { y: 280 + i * 80, height: h }, duration: 0.4, ease: "power2.inOut" }, t);
      // L0 package drops
      IN("#er-pkg", at(0, 0.03), 0.9, { y: -260 }, { y: 0, ease: "bounce.out" });
      IN("#er-bang", at(0, 0.1), 0.5);

      IN("#er-o1", at(1, 0.3), 0.5, { scale: 0.9, svgOrigin: "420 620" }, { scale: 1, svgOrigin: "420 620" });

      // L2 table + 4001
      OUT("#er-onion", at(2, 0), 0.35);
      IN("#er-th", at(2, 0.04), 0.4);
      IN("#er-r0", at(2, 0.1), 0.4, { x: 20 }, { x: 0 });
      IN("#er-hl", at(2, 0.12), 0.3);
      IN("#er-v0", at(2, 0.18), 0.4);
      IN("#er-v0t", at(2, 0.4), 0.4);
      tl.to("#er-btn0", { fill: "#58C4DD", duration: 0.4 }, at(2, 0.72));
      // L3 InsufficientFunds
      OUT("#er-v0, #er-v0t", at(3, 0), 0.3);
      IN("#er-r3", at(3, 0.05), 0.4, { x: 20 }, { x: 0 }); ROW(3, at(3, 0.05));
      IN("#er-v1a", at(3, 0.3), 0.4);
      IN("#er-v1b", at(3, 0.55), 0.4);
      IN("#er-v1c", at(3, 0.72), 0.4);
      OUT("#er-term", at(3, 0.92), 0.4);
      // L4 revert: errorName / reason
      OUT("#er-v1", at(4, 0), 0.3);
      IN("#er-r1", at(4, 0.04), 0.4, { x: 20 }, { x: 0 }); ROW(1, at(4, 0.04));
      IN("#er-rv", at(4, 0.05), 0.4);
      DRAW("#er-tr", at(4, 0.08), 0.8);
      DRAW("#er-ta", at(4, 0.14), 0.2); IN("#er-en", at(4, 0.15), 0.4);
      IN("#er-map", at(4, 0.2), 0.4);
      IN("#er-m0", at(4, 0.3), 0.4, { x: -12 }, { x: 0 });
      IN("#er-m1", at(4, 0.4), 0.4, { x: -12 }, { x: 0 });
      IN("#er-m2", at(4, 0.5), 0.4, { x: -12 }, { x: 0 });
      IN("#er-r2", at(4, 0.68), 0.4, { x: 20 }, { x: 0 }); ROW(2, at(4, 0.68));
      DRAW("#er-tb", at(4, 0.7), 0.2); IN("#er-rs", at(4, 0.71), 0.4);
      IN("#er-rsc", at(4, 0.84), 0.4);
      // L5 EstimateGas / Http / ChainMismatch
      OUT("#er-v2", at(5, 0), 0.3);
      IN("#er-r4", at(5, 0.03), 0.4, { x: 20 }, { x: 0 }); ROW(4, at(5, 0.03));
      IN("#er-sb", at(5, 0.08), 0.4);
      IN("#er-sbl", at(5, 0.2), 0.4);
      IN("#er-r5", at(5, 0.36), 0.4, { x: 20 }, { x: 0 }); ROW(5, at(5, 0.36));
      IN("#er-n0, #er-n1", at(5, 0.4), 0.4);
      tl.to("#er-n0r", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.5));
      IN("#er-n0l", at(5, 0.5), 0.3);
      ARROW("#er-na", at(5, 0.56), 0.5);
      tl.to("#er-n1r", { stroke: "#83C167", duration: 0.3 }, at(5, 0.62));
      IN("#er-r6", at(5, 0.78), 0.4, { x: 20 }, { x: 0 }); ROW(6, at(5, 0.78));
      IN("#er-cb", at(5, 0.84), 0.4);
      // L6 custom error decoding
      OUT("#er-tab, #er-v3", at(6, 0), 0.4);
      IN("#er-hex", at(6, 0.04), 0.5);
      IN("#er-hs", at(6, 0.13), 0.3); IN("#er-hsl", at(6, 0.15), 0.4);
