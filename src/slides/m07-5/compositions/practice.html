      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形

      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };


      const CHK = (i, t) => { DRAW("#pr-k" + i, t, 0.4); tl.to("#pr-t" + i, { attr: { fill: "#e8e6df" }, duration: 0.3 }, t); };

      IN("#pr-list", at(0, 0.05), 0.6, { y: 20 }, { y: 0 });

      CHK(0, at(1, 0.05));
      IN("#pr-f1", at(1, 0.25), 0.6, { x: 40 }, { x: 0 });
      // L2 ② 禁用按钮
      OUT("#pr-f1", at(2, 0) - 0.3, 0.3);
      CHK(1, at(2, 0.02));
      IN("#pr-f2", at(2, 0.08), 0.5);
      tl.fromTo("#pr-r1", { opacity: 1, attr: { r: 14 } }, { opacity: 0, attr: { r: 60 }, duration: 0.5, ease: "power2.out", immediateRender: false }, at(2, 0.35));
      tl.fromTo("#pr-r2", { opacity: 1, attr: { r: 14 } }, { opacity: 0, attr: { r: 60 }, duration: 0.5, ease: "power2.out", immediateRender: false }, at(2, 0.47));
      tl.to("#pr-one", { opacity: 1, duration: 0.5 }, at(2, 0.65));
      // L3 ③ ④ ⑤
      OUT("#pr-f2", at(3, 0) - 0.3, 0.3);
      CHK(2, at(3, 0.02));
      IN("#pr-f3", at(3, 0.06), 0.5);
      OUT("#pr-f3", at(3, 0.26), 0.3);
      CHK(3, at(3, 0.3));
      IN("#pr-f4", at(3, 0.32), 0.5);
      OUT("#pr-f4", at(3, 0.53), 0.3);
      CHK(4, at(3, 0.57));
      IN("#pr-f5", at(3, 0.59), 0.5);
      tl.to("#pr-fail", { opacity: 1, duration: 0.4 }, at(3, 0.8));
      // L4 ⑥ 两个埋点
      OUT("#pr-f5", at(4, 0) - 0.3, 0.3);
      CHK(5, at(4, 0.03));
      IN("#pr-f6", at(4, 0.1), 0.6);
      tl.from(["#pr-g1", "#pr-g2", "#pr-g3", "#pr-g4", "#pr-g5", "#pr-g6", "#pr-g7", "#pr-g8"], { attr: { height: 0, y: 640 }, duration: 0.6, stagger: 0.08, immediateRender: false }, at(4, 0.12));
      tl.to("#pr-g8", { attr: { fill: "#ff8a80" }, duration: 0.3, yoyo: true, repeat: 1 }, at(4, 0.75));
      // L5 清单收起 → 测试网流程
      OUT("#pr-p1", at(5, 0) - 0.3, 0.35);
      IN("#pr-s1", at(5, 0.05), 0.5, { y: 20 }, { y: 0 });
      ARROW("#pr-sa1", at(5, 0.3), 0.4);
      IN("#pr-s2", at(5, 0.33), 0.5, { y: 20 }, { y: 0 });
      ARROW("#pr-sa2", at(5, 0.55), 0.4);
      IN("#pr-s3", at(5, 0.58), 0.5, { y: 20 }, { y: 0 });
      ARROW("#pr-sa3", at(5, 0.8), 0.4);
      IN("#pr-s4", at(5, 0.83), 0.5, { y: 20 }, { y: 0 });
      // L6 三个预期结果
      IN("#pr-e1", at(6, 0.03), 0.5, { x: -30 }, { x: 0 });
      IN("#pr-e2", at(6, 0.25), 0.5, { x: -30 }, { x: 0 });
      IN("#pr-e3", at(6, 0.55), 0.5, { x: -30 }, { x: 0 });
      ARROW("#pr-ea", at(6, 0.75), 0.8);
      IN("#pr-12", at(6, 0.75), 0.4);
      IN("#pr-e4", at(6, 0.85), 0.5);

      tl.to("#pr-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
