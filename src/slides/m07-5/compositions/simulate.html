  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
// L0 simulate lit, term, lanes, eth_call arrow
IN("#si-pb", at(0, 0.0), 0.5);
IN("#si-term", at(0, 0.04), 0.5);
[0, 1, 2, 3].forEach(i => IN(`#si-ln${i}`, at(0, 0.12 + i * 0.07), 0.5, { y: -16 }, { y: 0 }));
IN("#si-real", at(0, 0.4), 0.5);
IN("#si-cl", at(0, 0.55), 0.4);
ARROW("#si-ca", at(0, 0.6), 0.7);
// L1 ghost execution, nothing written to the real chain
IN("#si-gh", at(1, 0.02), 0.5, { scale: 0.8, svgOrigin: "1100 465" }, { scale: 1, svgOrigin: "1100 465" });
tl.to("#si-ghr", { fill: "#e8e6df", duration: 0.3 }, at(1, 0.3));
IN("#si-gx", at(1, 0.45), 0.4);
IN("#si-gxx", at(1, 0.6), 0.3, { scale: 1.6, svgOrigin: "1619 465" }, { scale: 1, svgOrigin: "1619 465" });
IN("#si-ghl", at(1, 0.72), 0.4);
OUT("#si-term", at(1, 0.9), 0.4);
// L2 branch A: revert -> no wallet
IN("#si-al", at(2, 0.05), 0.4);
ARROW("#si-aa", at(2, 0.08), 0.6);
IN("#si-wp", at(2, 0.4), 0.4);
IN("#si-wx", at(2, 0.55), 0.3, { scale: 1.5, svgOrigin: "1500 688" }, { scale: 1, svgOrigin: "1500 688" });
tl.to("#si-wp", { opacity: 0.35, duration: 0.3 }, at(2, 0.6));
IN("#si-wl", at(2, 0.66), 0.4);
// L3 branch B: request envelope parked in the frontend lane
IN("#si-bl", at(3, 0.05), 0.4);
ARROW("#si-ba", at(3, 0.1), 0.6);
IN("#si-env", at(3, 0.3), 0.3);
tl.fromTo("#si-env", { x: 400, y: -40 }, { x: 0, y: 0, duration: 0.9, ease: "power2.inOut", immediateRender: false }, at(3, 0.3));
IN("#si-envl", at(3, 0.6), 0.4);
// L4 useSimulateContract re-simulates when args change
IN("#si-hk", at(4, 0.05), 0.5, { y: 20 }, { y: 0 });
COUNT("#si-num", 100, 120, at(4, 0.45), 0.6);
tl.to("#si-ca", { stroke: "#e8e6df", attr: { "stroke-width": 7 }, duration: 0.2 }, at(4, 0.6));
tl.to("#si-ca", { stroke: "#83C167", attr: { "stroke-width": 4 }, duration: 0.3 }, at(4, 0.6) + 0.25);
tl.to("#si-gh rect", { fill: "#1f4a5a", duration: 0.2 }, at(4, 0.66));
tl.to("#si-gh rect", { fill: "#132029", duration: 0.3 }, at(4, 0.66) + 0.25);
// L5 big statement
tl.to("#si-lanes", { opacity: 0, duration: 0.4, ease: "power2.in" }, at(5, 0.0));
IN("#si-big", at(5, 0.15), 0.6, { scale: 0.85, svgOrigin: "960 560" }, { scale: 1, svgOrigin: "960 560" });
// L6 gap between simulation and inclusion
tl.to("#si-big", { y: -240, duration: 0.6, ease: "power2.inOut" }, at(6, 0.0));
DRAW("#si-tline", at(6, 0.04), 0.8);
IN("#si-t0", at(6, 0.04), 0.4);
IN("#si-t1, #si-t1c", at(6, 0.1), 0.4);
IN("#si-gap", at(6, 0.16), 0.4);
[0, 1, 2].forEach(i => IN(`#si-r${i}`, at(6, 0.3 + i * 0.1), 0.4, { y: -60 }, { y: 0 }));
OUT("#si-t1", at(6, 0.64), 0.2);
tl.to("#si-t1c", { fill: "#FC6255", duration: 0.3 }, at(6, 0.64));
IN("#si-t1r", at(6, 0.67), 0.3, { scale: 1.4, svgOrigin: "1620 692" }, { scale: 1, svgOrigin: "1620 692" });
tl.to("#si-t1c", { attr: { r: 24 }, duration: 0.3, yoyo: true, repeat: 1 }, at(6, 0.85));

      /*ENDANIM*/

      tl.to("#si-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#si-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["simulate"] = tl;
    })();
  </script>
