        <!-- L3 确认数 -->
        <g id="tx-m3">

          <rect id="tx-c1" class="h" x="1250" y="788" width="140" height="44" rx="6" fill="none" stroke="#58C4DD" stroke-width="2"/>

          <rect id="tx-c3" class="h" x="1250" y="684" width="140" height="44" rx="6" fill="none" stroke="#58C4DD" stroke-width="2"/>
          <rect id="tx-c4" class="h" x="1250" y="632" width="140" height="44" rx="6" fill="none" stroke="#58C4DD" stroke-width="2"/>

        <!-- L5 From / To -->
        <g id="tx-m5">

        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">交易哈希 <tspan font-size="28" font-weight="400" fill="#8a8f99">Transaction Hash</tspan></text>

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      /*ANIM*/
const BAR = (row, t, h = 58) => tl.to("#tx-bar", { attr: { y: 282 + row * 90, height: h }, duration: 0.45, ease: "power2.inOut" }, t);
// L0 窗口 + 字段名
IN("#tx-win", at(0, 0.02), 0.7, { scale: 0.96, svgOrigin: "960 600" }, { scale: 1, svgOrigin: "960 600" });
IN("#tx-term", at(0, 0.42), 0.5);
for (let i = 0; i < 8; i++) IN(`#tx-k${i}`, at(0, 0.62) + i * 0.15, 0.4, { x: -12 }, { x: 0 });
IN("#tx-bar", at(0, 0.9), 0.4);
// L1 交易哈希
OUT("#tx-term", at(1, 0), 0.35);
IN("#tx-term2", at(1, 0.04), 0.5);
IN("#tx-sc", at(1, 0.14), 0.5, { y: -20 }, { y: 0 });
IN("#tx-fun", at(1, 0.2), 0.5);
tl.to("#tx-sc", { y: 90, scale: 0.4, svgOrigin: "1435 317", opacity: 0, duration: 0.6, ease: "power2.in" }, at(1, 0.32));
tl.to("#tx-fun path", { fill: "#58C4DD55", duration: 0.2, yoyo: true, repeat: 1 }, at(1, 0.36));
IN("#tx-ho", at(1, 0.42), 0.4, { y: -20 }, { y: 0 });
tl.to("#tx-ho", { x: -766, y: -230, duration: 0.8, ease: "power2.inOut" }, at(1, 0.62));
tl.set("#tx-ho", { opacity: 0 }, at(1, 0.62) + 0.85);
tl.set("#tx-v0", { opacity: 1 }, at(1, 0.62) + 0.85);
OUT("#tx-term2, #tx-fun", at(1, 0.94), 0.4);
// L2 Status
BAR(1, at(2, 0.02));
IN("#tx-v1", at(2, 0.1), 0.4);
IN("#tx-fail", at(2, 0.42), 0.4);
IN("#tx-coin", at(2, 0.55), 0.2);
tl.fromTo("#tx-coin", { y: 0 }, { y: 70, duration: 0.6, ease: "bounce.out", immediateRender: false }, at(2, 0.55));
IN("#tx-fee", at(2, 0.62), 0.4);
// L3 Block + 确认数
OUT("#tx-m2", at(3, 0), 0.35);
BAR(2, at(3, 0.02));
IN("#tx-v2", at(3, 0.08), 0.4);
IN("#tx-blk0", at(3, 0.14), 0.4);
IN("#tx-cl, #tx-cn", at(3, 0.3), 0.4);
for (let k = 1; k <= 5; k++) {
  const t = at(3, 0.34) + (k - 1) * 0.45;
  IN(`#tx-c${k}`, t, 0.3, { y: -30 }, { y: 0 });
  COUNT("#tx-cn", k - 1, k, t + 0.1, 0.25);
}
// L4 Timestamp
OUT("#tx-m3", at(4, 0), 0.35);
BAR(3, at(4, 0.02));
IN("#tx-v3", at(4, 0.1), 0.4);
IN("#tx-ck0, #tx-ck1", at(4, 0.2), 0.4);
tl.to("#tx-ck1c", { stroke: "#58C4DD", duration: 0.3 }, at(4, 0.62));
tl.to("#tx-ck1t", { fill: "#58C4DD", duration: 0.3 }, at(4, 0.62));
tl.to("#tx-ck0", { opacity: 0.45, duration: 0.3 }, at(4, 0.62));
// L5 From / To
OUT("#tx-m4", at(5, 0), 0.35);
BAR(4, at(5, 0.02));
IN("#tx-v4", at(5, 0.06), 0.4);
IN("#tx-sig", at(5, 0.16), 0.4);
ARROW("#tx-sa", at(5, 0.24), 0.5);
IN("#tx-me", at(5, 0.36), 0.4, { scale: 0.7, svgOrigin: "830 670" }, { scale: 1, svgOrigin: "830 670" });
BAR(5, at(5, 0.5));
IN("#tx-v5", at(5, 0.54), 0.4);
IN("#tx-types", at(5, 0.68), 0.5);
// L6 Value + Nonce
OUT("#tx-m5", at(6, 0), 0.35);
BAR(6, at(6, 0.02));
IN("#tx-v6", at(6, 0.08), 0.4);
BAR(7, at(6, 0.55));
IN("#tx-v7", at(6, 0.6), 0.4);
IN("#tx-n1", at(6, 0.72), 0.4, { x: -10 }, { x: 0 });

      /*ENDANIM*/

      tl.to("#tx-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#tx-term, #tx-term2", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["txpage"] = tl;
    })();
  </script>
