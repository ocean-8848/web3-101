        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">提交-揭示 <tspan font-size="28" font-weight="400" fill="#8a8f99">Commit-Reveal</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">先交哈希、后公开原文</text>
      </g>
    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 交易先进内存池排队，所有人都看得见
      IN("#me-wal", at(0, 0.05), 0.5);
      ARROW("#me-a0", at(0, 0.18), 0.5);
      IN("#me-mp", at(0, 0.24), 0.6);
      IN("#me-q", at(0, 0.34), 0.5);
      IN("#me-you", at(0, 0.4), 0.6, { x: -600 }, { x: 0, ease: "power2.out" });
      ARROW("#me-a1", at(0, 0.55), 0.5);
      IN("#me-blk", at(0, 0.6), 0.5);
      IN("#me-eyes", at(0, 0.8), 0.5, { y: 10 }, { y: 0 });
      // L1 构建者插入、排序、剔除 → MEV；前置交易
      IN("#me-b0", at(1, 0.02), 0.4, { y: -40 }, { y: 0 });
      IN("#me-b1", at(1, 0.06), 0.4, { y: -40 }, { y: 0 });
      IN("#me-b3", at(1, 0.1), 0.4, { y: -40 }, { y: 0 });
      IN("#me-b2", at(1, 0.16), 0.4, { y: -60 }, { y: 0 });
      tl.to("#me-b1", { x: 96, duration: 0.5, ease: "power2.inOut" }, at(1, 0.24));
      tl.to("#me-b2", { x: -96, duration: 0.5, ease: "power2.inOut" }, at(1, 0.24));
      tl.to("#me-b3", { y: 70, opacity: 0, duration: 0.5, ease: "power2.in" }, at(1, 0.32));
      ["#me-g0", "#me-g1", "#me-g2"].forEach((s, i) => {
        tl.fromTo(s, { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, at(1, 0.38 + i * 0.03));
        tl.to(s, { x: -100 + i * 6, y: 120, duration: 0.7, ease: "power2.in" }, at(1, 0.4 + i * 0.03));
        tl.to(s, { opacity: 0, duration: 0.2 }, at(1, 0.4 + i * 0.03) + 0.6);
      });
      IN("#me-bld", at(1, 0.4), 0.4);
      IN("#me-mev", at(1, 0.48), 0.5);
      IN("#me-fr", at(1, 0.66), 0.3);
      tl.to("#me-fr", { x: 360, duration: 0.7, ease: "power2.inOut" }, at(1, 0.72));
      tl.to("#me-fr", { y: -40, duration: 0.35, ease: "power1.out", yoyo: true, repeat: 1 }, at(1, 0.72));
      IN("#me-frl", at(1, 0.8), 0.4);
      // L2 三明治：①②③ 与价格曲线
      OUT("#me-p0", at(2, 0), 0.4);
      IN("#me-term", at(2, 0.03), 0.5);
      IN("#me-ax", at(2, 0.08), 0.4);
      DRAW("#me-s0", at(2, 0.1), 0.4);
      IN("#me-r1", at(2, 0.2), 0.5);
      IN("#me-r0", at(2, 0.56), 0.5, { y: -14 }, { y: 0 });
      DRAW("#me-s1", at(2, 0.58), 0.5);
      DRAW("#me-s2", at(2, 0.74), 0.5);
      tl.to("#me-r1 rect", { stroke: "#e8e6df", duration: 0.3 }, at(2, 0.74));
      IN("#me-r2", at(2, 0.88), 0.5, { y: 14 }, { y: 0 });
      DRAW("#me-s3", at(2, 0.9), 0.5);
      // L3 同一区块；多付 ≈ 利润 + 手续费；上限 = 滑点
      OUT("#me-term", at(3, 0), 0.3);
      IN("#me-blk2", at(3, 0.04), 0.5);
      IN("#me-blk2l", at(3, 0.08), 0.4);
      IN("#me-eq", at(3, 0.3), 0.5, { y: 10 }, { y: 0 });
      IN("#me-slip", at(3, 0.62), 0.4);
      IN("#me-slipl", at(3, 0.66), 0.4);
      IN("#me-cap", at(3, 0.74), 0.4);
      // L4 合约只能强制 minOut + deadline
      OUT("#me-p2", at(4, 0), 0.4);
      IN("#me-cl", at(4, 0.06), 0.5);
      IN("#me-cant", at(4, 0.12), 0.5);
      IN("#me-cr", at(4, 0.36), 0.5);
      IN("#me-gb", at(4, 0.5), 0.3);
      IN("#me-hl", at(4, 0.5), 0.3);
      tl.to("#me-hl", { attr: { y: 513, height: 38 }, duration: 0.4, ease: "power2.inOut" }, at(4, 0.68));
      tl.to("#me-hl", { attr: { y: 589, height: 38 }, duration: 0.4, ease: "power2.inOut" }, at(4, 0.82));
      // L5 滑点 50% / minOut = 0；用户侧防护
      OUT("#me-p4", at(5, 0), 0.4);
      IN("#me-dial, #me-ndl", at(5, 0.04), 0.5);
      tl.to("#me-ndl", { rotation: 84.6, svgOrigin: "560 700", duration: 0.9, ease: "power2.inOut" }, at(5, 0.1));
      tl.to("#me-ndl", { stroke: "#FC6255", duration: 0.3 }, at(5, 0.2));
      IN("#me-s50", at(5, 0.18), 0.4);
      IN("#me-bot", at(5, 0.24), 0.4);
      for (let i = 0; i < 4; i++) {
        const t = at(5, 0.28 + i * 0.04);
        tl.fromTo(`#me-k${i}`, { opacity: 0, x: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, t);
        tl.to(`#me-k${i}`, { x: 230, duration: 0.6, ease: "power2.in" }, t);
        tl.to(`#me-k${i}`, { opacity: 0, duration: 0.12 }, t + 0.55);
      }
      IN("#me-m0", at(5, 0.34), 0.4);
      IN("#me-sh0", at(5, 0.6), 0.5, { x: 16 }, { x: 0 });
      IN("#me-sh1", at(5, 0.84), 0.5, { x: 16 }, { x: 0 });
      // L6 提交-揭示
      OUT("#me-p5", at(6, 0), 0.4);
      IN("#me-ic", at(6, 0.06), 0.5);
      IN("#me-ic2", at(6, 0.22), 0.5);
      IN("#me-term2", at(6, 0.3), 0.5);
      IN("#me-st1", at(6, 0.36), 0.5);
      IN("#me-hash", at(6, 0.44), 0.5, { x: -12 }, { x: 0 });
      IN("#me-st2", at(6, 0.56), 0.5);
      IN("#me-dly", at(6, 0.58), 0.4);
      IN("#me-rev", at(6, 0.66), 0.4, { x: -12 }, { x: 0 });
      IN("#me-cc", at(6, 0.74), 0.6);
      IN("#me-chl", at(6, 0.8), 0.3);
      tl.to("#me-chl", { attr: { y: 727, height: 228 }, duration: 0.5, ease: "power2.inOut" }, at(6, 0.9));
      // L7 哈希里带提交者地址，照抄也揭示不了
      OUT("#me-term2, #me-ic, #me-ic2", at(7, 0), 0.3);
      IN("#me-cp", at(7, 0.06), 0.4, { x: -80 }, { x: 0 });
      IN("#me-gl0", at(7, 0.3), 0.3);
      tl.to("#me-chl", { attr: { y: 803, height: 38 }, duration: 0.4, ease: "power2.inOut" }, at(7, 0.3));
      IN("#me-gl1", at(7, 0.34), 0.3);
      IN("#me-x", at(7, 0.5), 0.4, { scale: 1.3, svgOrigin: "1240 450" }, { scale: 1, svgOrigin: "1240 450" });
      tl.to("#me-th1, #me-tc1", { stroke: "#83C167", fill: "#83C167", duration: 0.5 }, at(7, 0.78));

      tl.to("#me-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#me-term, #me-term2", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["mev"] = tl;
    })();
  </script>
</template>
