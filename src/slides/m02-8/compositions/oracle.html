  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const N0 = v => Math.round(v).toLocaleString("en-US");
      const N1 = v => v.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 1 });
      const K = 3e9;
      let cx = 1000;
      // 池子：ETH 储备 x → 柱高、标签、价格同步
      const POOL = (x, t, d = 1.2) => {
        const y0 = K / cx, y1 = K / x, he = 0.32 * x, hu = y1 * 320 / 3e6;
        tl.to("#or-be", { attr: { y: 860 - he, height: he }, duration: d, ease: "power2.inOut" }, t);
        tl.to("#or-bu", { attr: { y: 860 - hu, height: hu }, duration: d, ease: "power2.inOut" }, t);
        tl.to("#or-ve", { attr: { y: 844 - he }, duration: d, ease: "power2.inOut" }, t);
        tl.to("#or-vu", { attr: { y: 844 - hu }, duration: d, ease: "power2.inOut" }, t);
        COUNT("#or-ve", cx, x, t, d, N1);
        COUNT("#or-vu", y0, y1, t, d, N0);
        COUNT("#or-px", y0 / cx, y1 / x, t, d, N0);
        cx = x;
      };

      // L0 预言机；协议去池子读价
      IN("#or-term", at(0, 0.08), 0.5);
      IN("#or-lb", at(0, 0.45), 0.6, { y: 16 }, { y: 0 });
      IN("#or-mid, #or-midt", at(0, 0.55), 0.6, { y: 16 }, { y: 0 });
      ARROW("#or-read", at(0, 0.68), 0.6);
      IN("#or-readl", at(0, 0.72), 0.4);
      IN("#or-midp", at(0, 0.84), 0.5);
      // L1 即时价 = 储备比值；中盒放大成池子
      OUT("#or-term", at(1, 0), 0.3);
      OUT("#or-lb, #or-read, #or-readl, #or-midt, #or-midp", at(1, 0), 0.35);
      tl.to("#or-mid", { attr: { x: 1020, y: 240, width: 780, height: 720 }, duration: 0.9, ease: "power2.inOut" }, at(1, 0.04));
      IN("#or-pool", at(1, 0.16), 0.6);
      tl.to("#or-px", { fill: "#FF9F43", duration: 0.2 }, at(1, 0.4));
      POOL(810, at(1, 0.42), 0.9);
      POOL(1000, at(1, 0.58), 0.9);
      tl.to("#or-px", { fill: "#e8e6df", duration: 0.3 }, at(1, 0.7));
      IN("#or-term2", at(1, 0.74), 0.5);
      // L2 算一算：起点
      OUT("#or-term2", at(2, 0), 0.3);
      IN("#or-panr", at(2, 0.04), 0.5);
      IN("#or-ex", at(2, 0.1), 0.4);
      IN("#or-d0", at(2, 0.35), 0.4, { x: -14 }, { x: 0 });
      IN("#or-d1", at(2, 0.55), 0.4, { x: -14 }, { x: 0 });
      IN("#or-d2", at(2, 0.8), 0.4, { x: -14 }, { x: 0 });
      // L3 k、目标价、新储备
      IN("#or-d3", at(3, 0.06), 0.4, { x: -14 }, { x: 0 });
      IN("#or-d4", at(3, 0.3), 0.4, { x: -14 }, { x: 0 });
      IN("#or-d5", at(3, 0.5), 0.4, { x: -14 }, { x: 0 });
      tl.to("#or-px", { fill: "#FC6255", duration: 0.3 }, at(3, 0.5));
      POOL(Math.sqrt(500000), at(3, 0.52), 1.8);
      IN("#or-d6", at(3, 0.78), 0.4, { x: -14 }, { x: 0 });
      // L4 投入与换出
      IN("#or-d7", at(4, 0.12), 0.4, { x: -14 }, { x: 0 });
      IN("#or-d8", at(4, 0.42), 0.4, { x: -14 }, { x: 0 });
      IN("#or-nofee", at(4, 0.78), 0.4);
      // L5 回到三盒；闪电贷 + 一笔交易
      OUT("#or-pan, #or-pool", at(5, 0), 0.35);
      IN("#or-term3", at(5, 0.04), 0.5);
      tl.to("#or-mid", { attr: { x: 730, y: 230, width: 460, height: 170 }, duration: 0.8, ease: "power2.inOut" }, at(5, 0.04));
      tl.set("#or-px2", { textContent: "6,000", fill: "#FC6255" }, at(5, 0.1));
      IN("#or-midt, #or-midp", at(5, 0.16), 0.4);
      IN("#or-lb, #or-read, #or-readl", at(5, 0.18), 0.5);
      IN("#or-rb", at(5, 0.24), 0.5, { y: 16 }, { y: 0 });
      IN("#or-flc, #or-flt", at(5, 0.3), 0.4);
      DRAW("#or-boom", at(5, 0.3), 0.8);
      ARROW("#or-fla", at(5, 0.4), 0.4);
      IN("#or-fll", at(5, 0.42), 0.4);
      IN("#or-br, #or-brl", at(5, 0.52), 0.5);
      ARROW("#or-push", at(5, 0.64), 0.5);
      IN("#or-pushl", at(5, 0.66), 0.4);
      IN("#or-rb2", at(5, 0.84), 0.4);
      // L6 按即时价估值 vs 市场价
      OUT("#or-term3", at(6, 0), 0.3);
      tl.to("#or-lbr", { attr: { height: 390 }, duration: 0.6, ease: "power2.inOut" }, at(6, 0.04));
      IN("#or-v0l", at(6, 0.14), 0.4);
      IN("#or-v0", at(6, 0.22), 0.5, { x: -12 }, { x: 0 });
      IN("#or-v1l", at(6, 0.62), 0.4);
      IN("#or-v1", at(6, 0.7), 0.5, { x: -12 }, { x: 0 });
      tl.set("#or-brace", { opacity: 1 }, at(6, 0.86));
      DRAW("#or-brace", at(6, 0.86), 0.5);
      IN("#or-bracel", at(6, 0.9), 0.4);
      // L7 借走、复原、归还、坏账
      OUT("#or-rb2", at(7, 0), 0.3);
      ARROW("#or-take", at(7, 0.08), 0.8);
      IN("#or-takel", at(7, 0.12), 0.4);
      tl.to("#or-px2", { fill: "#e8e6df", duration: 0.4 }, at(7, 0.32));
      COUNT("#or-px2", 6000, 3000, at(7, 0.32), 0.9, N0);
      OUT("#or-fll", at(7, 0.42), 0.25);
      DRAW("#or-close", at(7, 0.46), 0.6);
      IN("#or-flr", at(7, 0.5), 0.4);
      IN("#or-bad", at(7, 0.62), 0.5, { y: 16 }, { y: 0 });
      IN("#or-ppl", at(7, 0.8), 0.5);
      ARROW("#or-pplA", at(7, 0.82), 0.4);
      IN("#or-ppll", at(7, 0.86), 0.4);

      tl.to("#or-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#or-term, #or-term2, #or-term3", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["oracle"] = tl;
    })();
  </script>
