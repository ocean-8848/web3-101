      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };
      const BARS = (h0, h1, col, t, d = 0.9) => {
        tl.to("#ha-b0", { attr: { y: 540 - h0, height: h0 }, fill: col, duration: d, ease: "power2.inOut" }, t);
        tl.to("#ha-b1", { attr: { y: 540 - h1, height: h1 }, fill: col, duration: d, ease: "power2.inOut" }, t);
      };

      IN("#ha-sub", at(0, 0.5), 0.5);

      IN("#ha-vault", at(1, 0.25), 0.6, { y: 16 }, { y: 0 });
      ARROW("#ha-rd", at(1, 0.5), 0.5);
      IN("#ha-rdl", at(1, 0.55), 0.4);
      // L2 比例偏离 → 份额价格偏低 → 存入拿更多份额

      tl.to("#ha-mf", { attr: { width: 150 }, fill: "#FC6255", duration: 0.8, ease: "power2.inOut" }, at(2, 0.4));
      IN("#ha-r1c", at(2, 0.66), 0.4, { x: -16 }, { x: 0 });
      ARROW("#ha-r1a", at(2, 0.72), 0.4);
      IN("#ha-r1s", at(2, 0.78), 0.4, { x: -16 }, { x: 0 });
      IN("#ha-r1l", at(2, 0.84), 0.4);
      // L3 池子恢复 → 份额价值回升 → 赎回多拿；钱来自其他存款人

      tl.to("#ha-mf", { attr: { width: 300 }, fill: "#58C4DD", duration: 0.8, ease: "power2.inOut" }, at(3, 0.16));
      IN("#ha-r2s", at(3, 0.32), 0.4, { x: -16 }, { x: 0 });

      IN("#ha-ppll", at(3, 0.76), 0.4);
      IN("#ha-from", at(3, 0.82), 0.4);
      // L4 偏离检查：阈值太宽，多轮重复
      OUT("#ha-r1, #ha-r2, #ha-pool, #ha-rd, #ha-rdl", at(4, 0), 0.4);
      IN("#ha-chkl", at(4, 0.08), 0.4);
      IN("#ha-base", at(4, 0.1), 0.4);
      IN("#ha-thr, #ha-thrl", at(4, 0.2), 0.5);
      tl.set("#ha-zig", { opacity: 1 }, at(4, 0.4));
      DRAW("#ha-zig", at(4, 0.4), 3.0);
      IN("#ha-zigl", at(4, 0.86), 0.4);
