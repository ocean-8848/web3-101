      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 拔掉即时价，换一个推不动的价格源
      IN("#tw-slot", at(0, 0.0), 0.4);
      IN("#tw-spot", at(0, 0.05), 0.4, { y: 10 }, { y: 0 });
      tl.to("#tw-spot", { y: -260, x: 340, opacity: 0, duration: 0.8, ease: "power2.in" }, at(0, 0.36));
      IN("#tw-swap", at(0, 0.6), 0.5);
      // L1 TWAP：尖刺很窄，均线几乎不动
      OUT("#tw-p0", at(1, 0), 0.4);
      IN("#tw-term", at(1, 0.04), 0.5);
      IN("#tw-ax", at(1, 0.12), 0.5);
      DRAW("#tw-line", at(1, 0.18), 1.6);
      IN("#tw-spk", at(1, 0.44), 0.3);
      IN("#tw-spkl", at(1, 0.48), 0.4);
      DRAW("#tw-avg", at(1, 0.66), 1.0);
      IN("#tw-avgl", at(1, 0.78), 0.4);
      // L2 累加器：两点相减再除以时间差
      OUT("#tw-term", at(2, 0), 0.3);
      IN("#tw-tt", at(2, 0.08), 0.5);
      tl.set("#tw-area", { opacity: 1 }, at(2, 0.12));
      tl.fromTo("#tw-clipr", { attr: { width: 0 } }, { attr: { width: 900 }, duration: 2.2, ease: "power1.inOut", immediateRender: false }, at(2, 0.12));
      IN("#tw-f", at(2, 0.4), 0.6, { y: 12 }, { y: 0 });
      IN("#tw-v2", at(2, 0.3), 0.4);
      IN("#tw-v3", at(2, 0.86), 0.4);
      tl.to("#tw-area", { opacity: 0.55, duration: 0.4, yoyo: true, repeat: 1 }, at(2, 0.62));
      tl.to("#tw-tt", { opacity: 0.5, duration: 0.4, yoyo: true, repeat: 1 }, at(2, 0.62));
      // L3 30 分钟要持续压住；局限：浅池子、跟得慢
      OUT("#tw-spkl", at(3, 0), 0.3);
      ARROW("#tw-rul", at(3, 0.04), 0.6);
      IN("#tw-rull", at(3, 0.08), 0.4);
      tl.set("#tw-plat", { opacity: 1 }, at(3, 0.16));
      DRAW("#tw-plat", at(3, 0.16), 1.2);
