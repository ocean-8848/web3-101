        <rect x="70" y="56" width="620" height="132" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="2.5" />
        <text x="100" y="110" font-size="38" font-weight="700" fill="#e8e6df">域分隔符 <tspan font-size="28" font-weight="400" fill="#8a8f99">Domain Separator</tspan></text>
        <text x="100" y="160" font-size="28" fill="#e8e6df">把签名绑定到协议、版本、链和合约</text>
      </g>

    </svg>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      // 带 marker-end 的箭头：class="dr h"，用 ARROW 同时画线并显形
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 链下签名 → 链上执行
      IN("#si-user", at(0, 0.02), 0.5);
      IN("#si-card, #si-cardt", at(0, 0.08), 0.5, { y: 16 }, { y: 0 });
      IN("#si-pen", at(0, 0.12), 0.3);
      DRAW("#si-sq", at(0, 0.16), 0.9);
      tl.to("#si-pen", { x: 120, duration: 0.9, ease: "power1.inOut" }, at(0, 0.16));
      OUT("#si-pen", at(0, 0.3), 0.3);
      IN("#si-offl", at(0, 0.2), 0.4);
      IN("#si-div", at(0, 0.3), 0.4);
      IN("#si-r1", at(0, 0.34), 0.5, { x: 20 }, { x: 0 });
      IN("#si-onl", at(0, 0.38), 0.4);
      tl.set("#si-f0", { opacity: 1 }, at(0, 0.55));
      tl.fromTo("#si-f0", { x: 0, y: 0 }, { x: 720, y: -160, duration: 1.2, ease: "power2.inOut", immediateRender: false }, at(0, 0.55));
      OUT("#si-f0", at(0, 0.55) + 1.15, 0.3);
      tl.to("#si-r1b", { fill: "#22303a", duration: 0.25, yoyo: true, repeat: 1 }, at(0, 0.55) + 1.15);
      // L1 复印 3 张 → 重放
      IN("#si-term", at(1, 0.0), 0.5);
      OUT("#si-offl, #si-onl", at(1, 0.0), 0.3);
      IN("#si-r2", at(1, 0.06), 0.5, { x: 20 }, { x: 0 });
      IN("#si-r3", at(1, 0.1), 0.5, { x: 20 }, { x: 0 });
      [["#si-f1", -160, "#si-rp1", "#si-r1b"], ["#si-f2", 0, "#si-rp2", "#si-r2b"], ["#si-f3", 160, "#si-rp3", "#si-r3b"]].forEach(([f, dy, p, b], i) => {
        const t = at(1, 0.2 + i * 0.12);
        IN(p, t, 0.4);
        tl.fromTo(f, { opacity: 0, x: 216, y: dy * 0.3 }, { opacity: 1, duration: 0.25, immediateRender: false }, t);
        tl.to(f, { x: 720, y: dy, duration: 1.0, ease: "power2.in" }, t + 0.25);
        OUT(f, t + 1.2, 0.25);
        tl.to(b, { stroke: "#FC6255", duration: 0.3 }, t + 1.2);
      });
      // L2 消息表单：四个字段，四条重放路径
      OUT("#si-term", at(2, 0.0), 0.3);
      OUT("#si-user, #si-cardt, #si-sq, #si-rp1, #si-rp2, #si-rp3", at(2, 0.0), 0.3);
      tl.to("#si-r1b, #si-r2b, #si-r3b", { stroke: "#58C4DD", duration: 0.3 }, at(2, 0.0));
      tl.to("#si-cardr", { attr: { x: 160, y: 250, width: 600, height: 690 }, duration: 0.7, ease: "power2.inOut" }, at(2, 0.02));
      IN("#si-ft", at(2, 0.06), 0.4);
      for (let i = 0; i < 4; i++) {
        const t = at(2, [0.03, 0.28, 0.52, 0.76][i]);
        if (i === 3) IN("#si-r4", t - 0.2, 0.4, { x: 20 }, { x: 0 });
        IN(`#si-k${i}, #si-s${i}`, t, 0.4);
        ARROW(`#si-q${i}`, t + 0.3, 0.6);
        tl.to(`#si-r${i + 1}b`, { stroke: "#FC6255", duration: 0.3 }, t + 0.8);
        const g = t + 1.9;
        tl.to(`#si-s${i}`, { stroke: "#83C167", strokeDasharray: "none", duration: 0.3 }, g);
        IN(`#si-v${i}`, g, 0.3);
        tl.to(`#si-q${i}`, { stroke: "#83C167", attr: { "marker-end": "url(#si-arrGr)" }, duration: 0.3 }, g + 0.2);
        IN(`#si-b${i}`, g + 0.3, 0.3, { scaleY: 0, svgOrigin: `1200 ${380 + i * 160}` }, { scaleY: 1, svgOrigin: `1200 ${380 + i * 160}` });
        tl.to(`#si-r${i + 1}b`, { stroke: "#83C167", duration: 0.3 }, g + 0.3);
      }
      // L3 可塑性
      OUT("#si-p1", at(3, 0.0), 0.4);
      IN("#si-tu1", at(3, 0.05), 0.5);
      IN("#si-n1", at(3, 0.08), 0.4);
      IN("#si-mall", at(3, 0.14), 0.4);
      DRAW("#si-ax", at(3, 0.14), 0.6);
      tl.fromTo("#si-tu2", { opacity: 0, scaleX: -1, svgOrigin: "1360 440" }, { opacity: 1, scaleX: 1, svgOrigin: "1360 440", duration: 0.9, ease: "power2.out", immediateRender: false }, at(3, 0.2));
      IN("#si-n2", at(3, 0.34), 0.4);
      IN("#si-er", at(3, 0.62), 0.4, { x: -16 }, { x: 0 });
      IN("#si-ok", at(3, 0.82), 0.4, { x: -16 }, { x: 0 });
      // L4 两层哈希
      OUT("#si-p3", at(4, 0.0), 0.4);
      IN("#si-term2", at(4, 0.02), 0.5);
      IN("#si-dom", at(4, 0.05), 0.5, { y: 16 }, { y: 0 });
      ["#si-d0", "#si-d1", "#si-d2", "#si-d3"].forEach((s, i) => IN(s, at(4, 0.14 + i * 0.07), 0.35, { x: -12 }, { x: 0 }));
      IN("#si-str", at(4, 0.48), 0.5, { y: 16 }, { y: 0 });
      ["#si-e0", "#si-e1", "#si-e2", "#si-e3"].forEach((s, i) => IN(s, at(4, 0.58 + i * 0.07), 0.35, { x: -12 }, { x: 0 }));
      ARROW("#si-a1", at(4, 0.88), 0.5);
      ARROW("#si-a2", at(4, 0.88), 0.5);
      IN("#si-dg", at(4, 0.92), 0.5, { y: 12 }, { y: 0 });
      // L5 代码对照
      OUT("#si-term2", at(5, 0.0), 0.3);
      OUT("#si-p4", at(5, 0.0), 0.4);
      IN("#si-cl", at(5, 0.03), 0.5);
      IN("#si-cln", at(5, 0.07), 0.4);
      IN("#si-cr, #si-crt", at(5, 0.08), 0.5);
      IN("#si-hl", at(5, 0.14), 0.3);
      tl.to("#si-hl", { attr: { y: 562 }, duration: 0.4, ease: "power2.inOut" }, at(5, 0.34));
      IN("#si-nk, #si-nv", at(5, 0.38), 0.3);
      COUNT("#si-nv", 0, 1, at(5, 0.44), 0.3);
      tl.to("#si-hl", { attr: { y: 642 }, duration: 0.4, ease: "power2.inOut" }, at(5, 0.58));
      IN("#si-rej", at(5, 0.78), 0.4, { x: 20 }, { x: 0 });
      tl.to("#si-rej", { x: 8, duration: 0.07, yoyo: true, repeat: 5, ease: "none" }, at(5, 0.84));
      // L6 钱包展示与钓鱼
      OUT("#si-p5", at(6, 0.0), 0.4);
      IN("#si-w1", at(6, 0.04), 0.5, { y: 16 }, { y: 0 });
      IN("#si-w1l", at(6, 0.1), 0.4);
      IN("#si-w2", at(6, 0.16), 0.5, { y: 16 }, { y: 0 });
      ["#si-x0, #si-y0", "#si-x1, #si-y1", "#si-x2, #si-y2"].forEach((s, i) => IN(s, at(6, 0.22 + i * 0.05), 0.3));
      IN("#si-w2l", at(6, 0.36), 0.4);
      IN("#si-hook", at(6, 0.44), 0.5, { y: -20 }, { y: 0 });
      IN("#si-wal, #si-k1c, #si-k2c, #si-k3c", at(6, 0.5), 0.4);
      IN("#si-att", at(6, 0.56), 0.4);
      ARROW("#si-dr", at(6, 0.62), 0.6);
      IN("#si-drl", at(6, 0.66), 0.3);
      ["#si-k3c", "#si-k2c", "#si-k1c"].forEach((s, i) => {
        tl.to(s, { x: 1480 - (950 + (2 - i) * 45), duration: 0.9, ease: "power2.in" }, at(6, 0.7 + i * 0.05));
        OUT(s, at(6, 0.7 + i * 0.05) + 0.85, 0.2);
      });
      tl.to("#si-tl2, #si-tc2", { stroke: "#83C167", fill: "#83C167", duration: 0.5 }, at(6, 0.9));
      tl.to("#si-tc2", { attr: { r: 9 }, duration: 0.25, yoyo: true, repeat: 1 }, at(6, 0.9));

      tl.to("#si-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#si-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["sign"] = tl;
    })();
  </script>
</template>
